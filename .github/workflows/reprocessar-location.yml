name: Reprocessar Location Taxonomy (v1)

on:
  push:
    branches: [main]
    paths:
      - 'ferramentas/location/v1/UL_Location_Taxonomy.xlsx'

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Rodar reprocessamento
        working-directory: ferramentas/location/v1
        env:
          CI: 'true'
        run: python reprocessar_location.py

      - name: Commit e push (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ferramentas/location/v1/municipios.json
          git diff --staged --quiet || git commit -m "auto: reprocessar municipios.json [skip ci]"
          git push

      - name: Sync para gh-pages
        run: |
          git checkout gh-pages
          git checkout main -- ferramentas/location/v1/municipios.json
          git checkout main -- ferramentas/location/v1/index.html
          git diff --staged --quiet || git commit -m "sync: municipios.json → gh-pages [skip ci]"
          git push
