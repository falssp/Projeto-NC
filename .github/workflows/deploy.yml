name: Deploy to Google Apps Script

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Deploy changed folders
        env:
          CLASP_TOKEN_CORP: ${{ secrets.CLASP_TOKEN_CORP }}
          CLASP_TOKEN_PESSOAL: ${{ secrets.CLASP_TOKEN_PESSOAL }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+/[^/]+' | sort -u)
          for folder in $CHANGED; do
            if [ ! -f "$folder/.clasp.json" ]; then continue; fi
            if echo "$folder" | grep -q "/corp"; then
              echo "$CLASP_TOKEN_CORP" > ~/.clasprc.json
              echo "Deploy Corp: $folder"
            elif echo "$folder" | grep -q "/pessoal"; then
              echo "$CLASP_TOKEN_PESSOAL" > ~/.clasprc.json
              echo "Deploy Pessoal: $folder"
            else
              continue
            fi
            cd "$folder" && clasp push --force && cd "$GITHUB_WORKSPACE"
          done
