name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Evita deploys paralelos que poderiam sobrescrever um ao outro.
# O gh-pages espelha o main via force-push — não editar gh-pages diretamente.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main:gh-pages --force
