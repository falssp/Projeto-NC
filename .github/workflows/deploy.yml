name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Evita deploys paralelos que poderiam sobrescrever um ao outro.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara conteúdo sem binários
        run: |
          # Copia repo para diretório temporário excluindo xlsx/xlsm
          rsync -a --exclude='*.xlsx' --exclude='*.xlsm' --exclude='.git' . /tmp/pages-build/

      - name: Push para gh-pages (sem binários)
        run: |
          cd /tmp/pages-build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: pages sem binários [skip ci]"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
