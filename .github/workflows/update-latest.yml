name: Atualiza latest.json (RM e ADP)

on:
  push:
    branches: [main]
    paths:
      - 'Arquivos/RM/**/*.xlsx'
      - 'Arquivos/ADP/**/*.xlsx'

permissions:
  contents: write

jobs:
  update-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualiza latest.json para RM e ADP
        run: |
          python3 - <<'PYEOF'
          import os, json, re
          from pathlib import Path

          today = __import__('datetime').date.today().isoformat()
          changed = False

          def version_key_rm(name):
              # RM_STORMX_2026_v6.1.xlsx  →  (2026, 6, 1)
              m = re.search(r'_(\d{4})_v(\d+)[._](\d+)', name)
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else (0, 0, 0)

          def version_key_adp(name):
              # UNCC_Digital_Platform_String_Tool_Merge_5_5.xlsx  →  (5, 5)
              m = re.search(r'_(\d+)_(\d+)\.xlsx$', name)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)

          for tipo, key_fn in [('RM', version_key_rm), ('ADP', version_key_adp)]:
              base = Path(f'Arquivos/{tipo}')
              if not base.exists():
                  continue

              # Varre todos os subdiretórios de ano
              all_files = []
              for year_dir in sorted(base.iterdir()):
                  if year_dir.is_dir() and year_dir.name.isdigit():
                      for f in year_dir.glob('*.xlsx'):
                          all_files.append((year_dir.name, f.name))

              if not all_files:
                  continue

              all_files.sort(key=lambda x: key_fn(x[1]))
              year, filename = all_files[-1]
              k = key_fn(filename)
              version_str = f"{k[1]}.{k[2]}" if tipo == 'RM' else f"{k[0]}.{k[1]}"
              rel_path = f"{year}/{filename}"

              out_path = base / 'latest.json'
              new_data = {
                  "filename": filename,
                  "path": rel_path,
                  "version": version_str,
                  "updated": today
              }

              if out_path.exists():
                  old = json.loads(out_path.read_text())
                  if old.get('path') == rel_path:
                      print(f"[skip] {out_path} — sem mudança ({rel_path})")
                      continue

              out_path.write_text(json.dumps(new_data, indent=2, ensure_ascii=False) + "\n")
              print(f"[ok] {out_path} → {rel_path} (v{version_str})")
              changed = True

          if not changed:
              print("Nenhum latest.json precisou de atualização.")
          PYEOF

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Arquivos/RM/latest.json Arquivos/ADP/latest.json 2>/dev/null || true
          git diff --cached --quiet && echo "nada a commitar" && exit 0
          git commit -m "chore: atualiza latest.json automaticamente [skip ci]"
          git push
