<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Status — NC Tool F3</title>
<style>
  :root {
    --ul:#1F36C7; --ul2:#0F1B6E; --ok:#0D7A4E; --ok-bg:#F0FFF4; --ok-bd:#6EE7B7;
    --warn:#B45309; --warn-bg:#FFFBEB; --warn-bd:#FDE68A;
    --err:#C0392B; --err-bg:#FFF0F0; --err-bd:#FCA5A5;
    --g50:#F8F9FD; --g100:#F1F3FB; --g200:#E2E6F6; --g300:#C5CEEE;
    --g400:#8D9CC8; --g500:#5C6B9A; --g700:#1E2A5E; --g900:#0D1340;
    --fn:'Inter',system-ui,sans-serif; --r:10px; --r2:7px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--fn); background:var(--g50); color:var(--g900); font-size:13px; padding:12px 16px; }
  h1 { font-size:16px; font-weight:700; color:var(--ul2); margin-bottom:2px; }
  .subtitle { font-size:11px; color:var(--g500); margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .card { background:#fff; border:1px solid var(--g200); border-radius:var(--r); padding:12px 14px; }
  .card-title { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--g500); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; margin-bottom:8px; }
  .badge.ok   { background:var(--ok-bg);   color:var(--ok);   border:1px solid var(--ok-bd); }
  .badge.warn { background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-bd); }
  .badge.err  { background:var(--err-bg);  color:var(--err);  border:1px solid var(--err-bd); }
  .row { display:flex; justify-content:space-between; align-items:center; padding:3px 0; border-bottom:1px solid var(--g100); font-size:12.5px; }
  .row:last-child { border-bottom:none; }
  .row-label { color:var(--g500); }
  .row-val { font-weight:500; color:var(--g900); text-align:right; max-width:60%; word-break:break-word; overflow-wrap:anywhere; font-size:11.5px; }
  .aba-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.ok   { background:var(--ok); }
  .dot.err  { background:var(--err); }
  .dot.warn { background:var(--warn); }
  .regra-row { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:11.5px; flex-wrap:nowrap; overflow:hidden; white-space:nowrap; }
  .tag { font-size:10px; font-weight:700; background:var(--g100); color:var(--g500); padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .btn-refresh { background:var(--ul); color:#fff; border:none; padding:7px 16px; border-radius:var(--r2); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-refresh:hover { background:var(--ul2); }
  .loading { text-align:center; padding:40px; color:var(--g400); font-size:13px; }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ts { font-size:10px; color:var(--g400); }
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px">
  <div>
    <h1>Status do Ambiente</h1>
    <div class="subtitle" id="ts-subtitle">Carregando...</div>
  </div>
  <button class="btn-refresh" onclick="carregar()">
    <span id="spin-icon">↻</span> Atualizar
  </button>
</div>

<div id="conteudo" class="loading">
  <span class="spin">↻</span> Buscando status do ambiente...
</div>

<script>
function carregar() {
  document.getElementById('conteudo').innerHTML = '<div class="loading"><span class="spin">↻</span> Buscando status do ambiente...</div>';
  document.getElementById('spin-icon').classList.add('spin');
  if (typeof google === 'undefined' || !google.script) {
    document.getElementById('conteudo').innerHTML = '<div class="loading" style="color:var(--err)">❌ Esta página deve ser aberta via menu NC Tool → 📡 Status do Ambiente dentro da planilha Google Sheets.</div>';
    document.getElementById('spin-icon').classList.remove('spin');
    return;
  }
  google.script.run
    .withSuccessHandler(renderizar)
    .withFailureHandler(function(e) {
      document.getElementById('conteudo').innerHTML = '<div class="loading" style="color:var(--err)">❌ Erro ao carregar: ' + (e.message||e) + '</div>';
      document.getElementById('spin-icon').classList.remove('spin');
    })
    .getStatusAmbiente();
}

function renderizar(d) {
  document.getElementById('spin-icon').classList.remove('spin');
  // ambiente-tag removido
  var ts = new Date(d.timestamp);
  document.getElementById('ts-subtitle').textContent =
    'Atualizado em ' + ts.toLocaleDateString('pt-BR') + ' às ' + ts.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});

  var html = '<div class="grid">';

  // ── Jira ──
  var j = d.jira;
  html += card('🔗 Jira', badge(j.ok,'ok','warn') +
    rows([
      ['Status',  j.ok ? 'Configurado' : 'Não configurado'],
      ['E-mail',  j.email || '—']
    ]));

  // ── Dicionário ──
  var dic = d.dicionario;
  html += card('📖 Dicionário', badge(dic.ok && !dic.aviso, 'ok', dic.aviso ? 'warn' : 'err') +
    rows([
      ['Última atualização', dic.msg],
      ['Total de slugs',     dic.total ? dic.total.toLocaleString('pt-BR') : '0'],
      ['Data exata',         dic.lastMerge ? new Date(dic.lastMerge).toLocaleString('pt-BR') : '—']
    ]));

  // ── Abas ──
  var abas = d.planilha;
  var abasOk = abas.every(function(a){ return a.ok; });
  var abasHtml = '<div style="margin-top:8px">';
  abas.forEach(function(a) {
    var cls = a.ok ? 'ok' : (a.nome.indexOf('duplicada') !== -1 ? 'warn' : 'err');
    abasHtml += '<div class="aba-row"><div class="dot ' + cls + '"></div><span style="flex:1">' + esc(a.nome) + '</span>' +
      (a.ok ? '<span class="ts">' + a.linhas + ' registros</span>' : '<span style="color:var(--err);font-size:11px">' + esc(a.msg) + '</span>') +
      '</div>';
  });
  abasHtml += '</div>';
  html += card('📋 Abas da Planilha', badge(abasOk,'ok','err') + abasHtml);

  // ── Último Log ──
  var ul = d.ultimoLog;
  html += card('📊 Último Log', badge(ul.ok,'ok','warn') +
    rows([
      ['ID',          ul.id || '—'],
      ['Data',        ul.timestamp || '—'],
      ['Usuário',     ul.usuario || '—'],
      ['Fonte',       ul.fonte || '—'],
      ['Total strings', ul.total != null ? ul.total : '—'],
      ['Score',       ul.score || '—'],
      ['Total no log', ul.totalLogs != null ? ul.totalLogs + ' registros' : '—']
    ]));

  // ── Config ──
  var cfg = d.config;
  var cfgHtml = '<div style="margin-top:8px">';
  if (cfg.regras && cfg.regras.length) {
    cfg.regras.forEach(function(r) {
      cfgHtml += '<div class="regra-row">' +
        '<div class="dot ' + (r.ativa ? 'ok' : 'err') + '"></div>' +
        '<span class="tag">' + esc(r.key) + '</span>' +
        '<span style="color:var(--g500);font-size:11px">' + esc(r.nota.slice(0,32)) + (r.nota.length > 32 ? '...' : '') + '</span>' +
        '</div>';
    });
  } else {
    cfgHtml += '<span style="color:var(--g400);font-size:11px">' + (cfg.msg || 'Sem regras') + '</span>';
  }
  cfgHtml += '</div>';
  html += card('⚙️ Regras de Validação', badge(cfg.ok,'ok','err') + cfgHtml);

  // ── Triggers ──
  var tr = d.triggers;
  html += card('⏰ Triggers', badge(tr.ok,'ok','warn') +
    rows([
      ['Merge dicionário (domingo 3h)', tr.merge  ? (tr.merge.instalado  ? '✅ Instalado' : '❌ Não instalado') : '—'],
      ['Arquivamento (dia 1 do mês)',   tr.arquivo ? (tr.arquivo.instalado ? '✅ Instalado' : '❌ Não instalado') : '—']
    ]));

  html += '</div>';
  document.getElementById('conteudo').innerHTML = html;
}

function card(titulo, conteudo) {
  return '<div class="card"><div class="card-title">' + titulo + '</div>' + conteudo + '</div>';
}
function badge(ok, cls_ok, cls_err) {
  var cls = ok ? cls_ok : cls_err;
  var txt = ok ? '✔ OK' : '⚠ Atenção';
  return '<span class="badge ' + cls + '" style="margin-bottom:10px">' + txt + '</span>';
}
function rows(pairs) {
  return '<div style="margin-top:8px">' + pairs.map(function(p) {
    return '<div class="row"><span class="row-label">' + esc(p[0]) + '</span><span class="row-val">' + esc(String(p[1]||'—')) + '</span></div>';
  }).join('') + '</div>';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

carregar();
</script>
</body>
</html>
