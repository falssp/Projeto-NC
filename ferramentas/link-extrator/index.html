<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrator de Links · NC Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --ul:#0040CE;--ul-b:#E5ECFF;--ul-m:#1a56d6;
  --ok:#0D7A4E;--ok-b:#E6F4EE;
  --err:#C0392B;--err-b:#FDECEA;
  --warn:#B45309;--warn-b:#FEF3C7;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g800:#1F2937;
  --sa:'DM Sans',system-ui,sans-serif;--mo:'DM Mono',monospace
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sa);background:var(--g50);color:var(--g800);min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 32px}

/* Header */
.header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.header-icon{width:42px;height:42px;background:var(--ul-b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header h1{font-size:22px;font-weight:700;color:var(--g800)}
.header p{font-size:13px;color:var(--g500);margin-top:2px}

/* Cards */
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:22px;margin-bottom:18px}
.card-title{font-size:14px;font-weight:700;color:var(--g800);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Tab bar */
.tab-bar{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.tab-btn{flex:1;padding:9px 12px;background:none;border:none;font-family:var(--sa);font-size:13px;font-weight:500;color:var(--g600);cursor:pointer;transition:all .15s}
.tab-btn:not(:last-child){border-right:1px solid var(--g200)}
.tab-btn.active{background:var(--ul);color:#fff;font-weight:600}
.tab-btn:not(.active):hover{background:var(--g50)}

/* Input */
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.input-row input{flex:1;padding:9px 12px;border:1px solid var(--g300);border-radius:8px;font-family:var(--mo);font-size:12px;outline:none;background:#fff;color:var(--g800);transition:border-color .15s}
.input-row input:focus{border-color:var(--ul)}
textarea#ext-urls{width:100%;min-height:180px;border:1px solid var(--g300);border-radius:8px;padding:10px 12px;font-family:var(--mo);font-size:12px;resize:vertical;outline:none;background:#fff;line-height:1.7;color:var(--g800);transition:border-color .15s;display:block}
textarea#ext-urls:focus{border-color:var(--ul)}

/* Info banner */
.info-banner{background:var(--ul-b);border:1px solid #C5CEEE;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#1a3a8f;margin-bottom:14px;line-height:1.55}
.info-banner strong{font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:none;font-family:var(--sa);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--ul);color:#fff}.btn-primary:hover{background:var(--ul-m)}
.btn-secondary{background:#fff;border:1px solid var(--g300);color:var(--g700)}.btn-secondary:hover{background:var(--g50)}
.btn-sm{padding:6px 13px;font-size:12px;font-weight:500}

/* Batch footer */
.batch-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:8px}
.line-count{font-size:12px;color:var(--g500)}

/* Result single */
.handle-box{display:inline-flex;align-items:center;gap:10px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:11px 16px;margin-top:12px}
.net-badge{font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:4px;white-space:nowrap}
.handle-val{font-family:var(--mo);font-size:15px;font-weight:600;color:var(--g800)}
.copy-btn{background:none;border:1px solid var(--g300);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--g500);transition:all .15s}
.copy-btn:hover{background:var(--g100);color:var(--g800)}
.copy-btn.copied{background:var(--ok-b);border-color:var(--ok);color:var(--ok)}

/* Result table */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--g200);margin-top:16px}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl-wrap th{padding:9px 14px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g200);white-space:nowrap;text-transform:uppercase}
.tbl-wrap td{padding:8px 14px;border-bottom:1px solid var(--g100);vertical-align:middle}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr:hover td{background:var(--g50)}

/* Net chips */
.net-chip{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:4px;white-space:nowrap}
.net-ig{background:#C13584}.net-tt{background:#010101}.net-yt{background:#FF0000}
.net-tw{background:#1DA1F2}.net-fb{background:#1877F2}.net-li{background:#0A66C2}
.net-pi{background:#E60023}.net-sc{background:#FFFC00;color:#000}.net-tv{background:#9146FF}
.net-kw{background:#FF6500}.net-xx{background:#888}
.handle-mono{font-family:var(--mo);font-size:12px}
.url-short{font-family:var(--mo);font-size:11px;color:var(--g500);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}

/* Result actions */
.result-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px}
.result-meta{font-size:12.5px;color:var(--g500)}
.result-meta strong{color:var(--g700)}

code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-family:var(--mo);font-size:11px}

/* ── Nav Tabs ──────────────────────────── */
.nav-tabs{display:flex;gap:0;border-bottom:2px solid var(--g200);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:9px 16px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.nav-tab.on{color:var(--ul);border-bottom-color:var(--ul);font-weight:600}
.nav-tab:hover:not(.on){color:var(--g700);background:var(--g50)}
.nav-pane{display:none}.nav-pane.on{display:block}
/* ── FAQ ───────────────────────────────── */
.faq-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.faq-search-wrap{flex:1;min-width:180px;position:relative}
.faq-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--g400);pointer-events:none}
.faq-search{width:100%;background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:8px 10px 8px 32px;font:13px 'DM Sans',sans-serif;color:var(--g700);outline:none;transition:border-color .15s}
.faq-search:focus{border-color:var(--ul)}
.faq-count{font-size:11px;color:var(--g400);white-space:nowrap}
.faq-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.faq-chip{padding:5px 13px;border-radius:20px;border:1px solid var(--g200);background:#fff;font:500 12px 'DM Sans',sans-serif;color:var(--g500);cursor:pointer;transition:all .15s}
.faq-chip:hover{border-color:var(--ul);color:var(--ul)}
.faq-chip.on{background:var(--ul);border-color:var(--ul);color:#fff}
.faq-item{background:#fff;border:1px solid var(--g200);border-radius:8px;overflow:hidden;margin-bottom:8px}
.faq-q{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:500}
.faq-q:hover{background:var(--g50)}
.faq-q-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0}
.faq-q-text{flex:1}
.faq-q-arr{color:var(--g400);transition:transform .2s}
.faq-item.open .faq-q-arr{transform:rotate(90deg)}
.faq-a{display:none;padding:0 14px 14px;font-size:13px;color:var(--g500);line-height:1.6;border-top:1px solid var(--g100)}
.faq-item.open .faq-a{display:block}
.faq-empty{text-align:center;padding:32px;color:var(--g400);font-size:13px}
/* ── IA ────────────────────────────────── */
.ia-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ia-head h2{font-size:15px;font-weight:700}
.btn-cfg-open{background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:6px 12px;font:500 12px 'DM Sans',sans-serif;color:var(--g500);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.btn-cfg-open:hover{border-color:var(--ul);color:var(--ul)}
.cfg-dot{width:7px;height:7px;border-radius:50%;background:var(--g300);flex-shrink:0}
.cfg-dot.ok{background:#22c55e}
.ia-no-key{background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:28px 24px;text-align:center;margin-bottom:16px}
.ia-no-key p{font-size:13px;color:var(--g500);margin:8px 0 16px}
.btn-cfg-cta{background:var(--ul);color:#fff;border:none;border-radius:6px;padding:10px 20px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ia-ready{display:none}.ia-ready.show{display:block}
.ia-result{background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:16px;font-size:13px;color:var(--g700);line-height:1.7;min-height:80px}
.ia-result h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.ia-result ul{padding-left:20px;margin:6px 0}
.ia-result strong{font-weight:600}
.ia-actions{display:flex;gap:8px;align-items:center;margin-bottom:14px}
/* ── Config Modal ──────────────────────── */
.cfg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:center;justify-content:center;padding:16px}
.cfg-overlay.open{display:flex}
.cfg-modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.25);display:flex;flex-direction:column}
.cfg-modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--g200)}
.cfg-modal-hdr h3{font-size:15px;font-weight:700}
.cfg-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g500);padding:2px 6px;border-radius:4px}
.cfg-modal-body{padding:20px;overflow-y:auto}
.cfg-tabs{display:flex;gap:6px;margin-bottom:16px}
.cfg-tab{flex:1;padding:8px;border:1px solid var(--g200);border-radius:7px;background:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;text-align:center;transition:all .15s}
.cfg-tab.on{background:var(--ul);border-color:var(--ul);color:#fff}
.cfg-panel{display:none}.cfg-panel.on{display:block}
.cfg-lbl{font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.cfg-inp{width:100%;padding:9px 12px;border:1px solid var(--g200);border-radius:7px;font-family:monospace;font-size:13px;background:var(--g50);outline:none;margin-bottom:8px;transition:border-color .15s}
.cfg-inp:focus{border-color:var(--ul)}
.cfg-link{font-size:12px;color:var(--ul);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px}
.btn-cfg-save{background:var(--ul);color:#fff;border:none;border-radius:7px;padding:9px 18px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;width:100%}

</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-icon">🔗</div>
    <div>
      <h1>Extrator de Links de Influencer</h1>
      <p>Cole links de redes sociais, remove duplicatas e extrai o perfil por plataforma</p>
    </div>
  </div>

  <div class="card">
  <div class="nav-tabs">
    <button class="nav-tab on" onclick="lxTabSwitch('main')">🔗 Ferramenta</button>
    <button class="nav-tab" onclick="lxTabSwitch('faq')">❓ Dúvidas</button>
  </div>

  <div class="nav-pane on" id="lx-pane-main">
    <div class="card-title">🔍 Extrair</div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-single-btn" onclick="setTab('single')">Um por vez</button>
      <button class="tab-btn" id="tab-batch-btn" onclick="setTab('batch')">Em lote</button>
    </div>

    <!-- Aba: Um por vez -->
    <div id="tab-single">
      <div class="input-row">
        <input type="text" id="ext-url" placeholder="https://www.instagram.com/fulano/?hl=pt-br" oninput="extSingleRun()" />
        <button class="btn btn-secondary btn-sm" onclick="extClearSingle()">Limpar</button>
      </div>
      <div id="ext-single-result" style="display:none"></div>
    </div>

    <!-- Aba: Em lote -->
    <div id="tab-batch" style="display:none">
      <div class="info-banner"><strong>Em lote:</strong> Cole um ou mais links por linha. Duplicatas (pela URL canônica) são removidas automaticamente na cópia para Sheets.</div>
      <textarea id="ext-urls" placeholder="Cole os links aqui, um por linha…" oninput="extBatchCount()"></textarea>
      <div class="batch-footer">
        <span class="line-count" id="ext-batch-count">0 linhas</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="extClearBatch()">Limpar</button>
          <button class="btn btn-primary" onclick="extBatchRun()">🔗 Extrair</button>
        </div>
      </div>
      <div id="ext-batch-result"></div>
    </div>
  </div>

</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var NET_COLORS={Instagram:'net-ig',TikTok:'net-tt',YouTube:'net-yt','Twitter/X':'net-tw',Facebook:'net-fb',LinkedIn:'net-li',Pinterest:'net-pi',Snapchat:'net-sc',Twitch:'net-tv',Kwai:'net-kw',Outro:'net-xx'};

function detectNet(url){
  if(/instagram\.com/i.test(url))return'Instagram';if(/tiktok\.com/i.test(url))return'TikTok';
  if(/youtube\.com|youtu\.be/i.test(url))return'YouTube';if(/twitter\.com|x\.com/i.test(url))return'Twitter/X';
  if(/facebook\.com/i.test(url))return'Facebook';if(/linkedin\.com/i.test(url))return'LinkedIn';
  if(/pinterest\.com/i.test(url))return'Pinterest';if(/snapchat\.com/i.test(url))return'Snapchat';
  if(/twitch\.tv/i.test(url))return'Twitch';if(/kwai\.com/i.test(url))return'Kwai';
  if(/chatgpt\.com|chat\.openai\.com/i.test(url))return'ChatGPT';if(/threads\.net/i.test(url))return'Threads';
  if(/bsky\.app/i.test(url))return'Bluesky';if(/t\.me/i.test(url))return'Telegram';
  if(/bereal\.com/i.test(url))return'BeReal';if(/triller\.co/i.test(url))return'Triller';
  if(/rumble\.com/i.test(url))return'Rumble';if(/kick\.com/i.test(url))return'Kick';
  if(/discord\.(?:com|gg)/i.test(url))return'Discord';if(/reddit\.com/i.test(url))return'Reddit';
  return'Outro';
}

function extractHandle(url){
  url=url.trim();if(!url)return'';
  var h='';
  var mIG=url.match(/instagram\.com\/([^/?#]+)/i);
  if(mIG){h=mIG[1];}
  else{var mYC=url.match(/youtube\.com\/(?:c|user)\/([^/?#]+)/i);
    if(mYC){h=mYC[1];}
    else{var mAt=url.match(/@([^/?#&\s]+)/);
      if(mAt){h=mAt[1];}
      else{var mGen=url.match(/(?:facebook\.com|linkedin\.com\/in|linkedin\.com\/company|pinterest\.com)\/([^/?#]+)/i);
        if(mGen){h=mGen[1];}}}}
  return h.replace(/[^A-Za-z0-9._-]/g,'');
}

function canonicalUrl(url){
  url=url.trim().toLowerCase();
  url=url.replace(/^https?:\/\/(www\.)?/,'');
  url=url.replace(/[?#].*$/,'');
  url=url.replace(/\/+$/,'');
  return url;
}

function isValidUrl(s){
  s=s.trim();
  var md=s.match(/\[.*?\]\((https?:\/\/[^\)]+)\)/);if(md)s=md[1];
  if(!s||s.toLowerCase()==='na'||s.toLowerCase()==='n/a')return false;
  if(/^https?:\/\//i.test(s))return true;
  if(/^(www\.|instagram\.|tiktok\.|youtube\.|twitter\.|x\.|facebook\.|linkedin\.|pinterest\.)/i.test(s))return true;
  return false;
}

function normalizeUrl(s){
  s=s.trim();
  var md=s.match(/\[.*?\]\((https?:\/\/[^\)]+)\)/);if(md)return md[1];
  if(/^https?:\/\//i.test(s))return s;
  return 'https://'+s;
}

function setTab(mode){
  document.getElementById('tab-single-btn').classList.toggle('active',mode==='single');
  document.getElementById('tab-batch-btn').classList.toggle('active',mode==='batch');
  document.getElementById('tab-single').style.display=mode==='single'?'':'none';
  document.getElementById('tab-batch').style.display=mode==='batch'?'':'none';
}

function extSingleRun(){
  var raw=document.getElementById('ext-url').value;
  var res=document.getElementById('ext-single-result');
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl).map(normalizeUrl);
  if(tokens.length>1){
    res.style.display='';
    res.innerHTML='<div class="info-banner" style="background:var(--warn-b);border-color:#e0c070;color:var(--warn);margin-top:8px">'+
      '<strong>'+tokens.length+' links detectados.</strong> O modo "Um por vez" aceita apenas um link. '+
      '<button class="btn btn-secondary btn-sm" style="margin-left:8px" '+
      'onclick="extPassToLote()">Usar em lote →</button></div>';
    return;
  }
  var url=tokens.length===1?tokens[0]:normalizeUrl(raw.trim());
  if(!url||!isValidUrl(url)){res.style.display='none';return;}
  var handle=extractHandle(url),net=detectNet(url);
  res.style.display='';
  res.innerHTML='<div class="handle-box">'+
    '<span class="net-badge '+(NET_COLORS[net]||'net-xx')+'">'+esc(net)+'</span>'+
    '<span class="handle-val" id="ext-handle-val">'+esc(handle||'—')+'</span>'+
    '<button class="copy-btn" onclick="extCopy(\'ext-handle-val\',this)" title="Copiar">⎘</button>'+
    '</div>';
}

function extPassToLote(){
  var raw=document.getElementById('ext-url').value;
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl);
  document.getElementById('ext-urls').value=tokens.join('\n');
  extBatchCount();
  setTab('batch');
  document.getElementById('ext-url').value='';
  document.getElementById('ext-single-result').style.display='none';
}

function extClearSingle(){document.getElementById('ext-url').value='';document.getElementById('ext-single-result').style.display='none';}

function extBatchCount(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(Boolean):[];
  var valid=lines.filter(isValidUrl).length;
  document.getElementById('ext-batch-count').textContent=lines.length+' linha'+(lines.length!==1?'s':'')+' · '+valid+' válida'+(valid!==1?'s':'');
}

function extClearBatch(){document.getElementById('ext-urls').value='';extBatchCount();document.getElementById('ext-batch-result').innerHTML='';}

function extBatchRun(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(Boolean):[];
  var valid=lines.filter(isValidUrl).map(normalizeUrl);
  if(!valid.length)return;
  var html='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Link</th><th>Plataforma</th><th>Perfil</th></tr></thead><tbody>';
  valid.forEach(function(url,i){
    var handle=extractHandle(url),net=detectNet(url);
    var chip='<span class="net-chip '+(NET_COLORS[net]||'net-xx')+'">'+esc(net)+'</span>';
    var short=url.replace(/^https?:\/\/(www\.)?/,'');
    if(short.length>60)short=short.slice(0,58)+'…';
    html+='<tr><td style="color:var(--g400);font-size:11.5px">'+(i+1)+'</td>'+
      '<td><span class="url-short" title="'+esc(url)+'">'+esc(short)+'</span></td>'+
      '<td>'+chip+'</td>'+
      '<td><span class="handle-mono">'+esc(handle||'—')+'</span></td></tr>';
  });
  html+='</tbody></table></div>';
  var seen={},uniqueCount=0;
  valid.forEach(function(url){var k=canonicalUrl(url);if(!seen[k]){seen[k]=true;uniqueCount++;}});
  var dupCount=valid.length-uniqueCount;
  html+='<div class="result-actions">'+
    '<span class="result-meta">'+valid.length+' linha'+(valid.length!==1?'s':'')+
    ' · <strong>'+uniqueCount+' único'+(uniqueCount!==1?'s':'')+' para o Sheets</strong>'+
    (dupCount?' · <span style="color:var(--warn)">'+dupCount+' duplicata'+(dupCount>1?'s':'')+' serão removidas</span>':'')+
    '</span>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btn-secondary btn-sm" onclick="extCopyTable()">⎘ Copiar Perfis</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="extCopyTableTSV()">⎘ Copiar Tabela (TSV)</button>'+
    '</div></div>';
  document.getElementById('ext-batch-result').innerHTML=html;
}

function extCopyTable(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  var seen={},handles=[];
  lines.forEach(function(url){var k=canonicalUrl(url);if(!seen[k]){seen[k]=true;handles.push(extractHandle(url));}});
  navigator.clipboard.writeText(handles.join('\n')).then(function(){
    var btns=document.querySelectorAll('[onclick="extCopyTable()"]');
    btns.forEach(function(b){b.textContent='✓ Copiado';setTimeout(function(){b.textContent='⎘ Copiar Perfis';},2000);});
  });
}

function extCopyTableTSV(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  var rows=lines.map(function(url){return[url,detectNet(url),extractHandle(url)].join('\t');});
  navigator.clipboard.writeText(rows.join('\n')).then(function(){
    var btns=document.querySelectorAll('[onclick="extCopyTableTSV()"]');
    btns.forEach(function(b){b.textContent='✓ Copiado';setTimeout(function(){b.textContent='⎘ Copiar Tabela (TSV)';},2000);});
  });
}

function extCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(function(){
    btn.classList.add('copied');btn.textContent='✓';
    setTimeout(function(){btn.classList.remove('copied');btn.textContent='⎘';},2000);
  });
}

function lxTabSwitch(name){
  var tabs=['main','faq'];
  document.querySelectorAll('.nav-tab').forEach(function(b,i){b.classList.toggle('on',tabs[i]===name);});
  document.querySelectorAll('.nav-pane').forEach(function(q){q.classList.toggle('on',q.id==='lx-pane-'+name);});
  if(name==='faq')lxInitFAQ();
}
// ── FAQ ──────────────────────────────────────────────────────────────────────
var LX_FAQ=[{tag:'Entrada',q:'Que formatos de links são aceitos?',a:'Links completos de qualquer rede social e handles com @ ou sem. Cole um por linha ou separe por vírgulas.'}, {tag:'Entrada',q:'Como funciona a entrada em abas (Texto / Excel)?',a:'Na aba "Texto" você cola links diretamente. Na aba "Excel" a ferramenta extrai links de qualquer coluna automaticamente de células copiadas.'}, {tag:'Plataformas',q:'Quais plataformas são detectadas?',a:'Instagram, TikTok, YouTube, X (Twitter), Facebook, LinkedIn e Snapchat. Não reconhecidos ficam como "Outros".'}, {tag:'Plataformas',q:'O que acontece com handles duplicados?',a:'Duplicatas são removidas automaticamente. O contador mostra quantas foram removidas.'}, {tag:'Saída',q:'Como os resultados são organizados?',a:'Por plataforma, em ordem alfabética de handle. Use "Copiar tudo" para exportar em TSV para o Google Sheets.'}, {tag:'Técnico',q:'Posso usar a ferramenta offline?',a:'Sim. Funciona 100% no browser, sem chamadas a servidores externos. Todo processamento é local.'}];
var lxFaqDone=false,lxFaqChip='Todas';
function lxInitFAQ(){
  if(lxFaqDone){lxFilterFAQ();return;}lxFaqDone=true;
  var tags=['Todas',...new Set(LX_FAQ.map(function(f){return f.tag;}))]
  var cols={'Entrada':'#1946E6', 'Plataformas':'#0D7A4E', 'Saída':'#B45309', 'Técnico':'#7C3AED'};
  document.getElementById('lx-faq-chips').innerHTML=tags.map(function(t){return'<button class="faq-chip'+(t==='Todas'?' on':'')+'" onclick="lxSetFaqChip(\''+t+'\')">'+t+'</button>';}).join('');
  document.getElementById('lx-faq-list').innerHTML=LX_FAQ.map(function(f,i){
    var col=cols[f.tag]||'#555';
    return'<div class="faq-item" data-tag="'+f.tag+'"><div class="faq-q" onclick="this.parentElement.classList.toggle(\'open\')"><span class="faq-q-tag" style="background:'+col+'20;color:'+col+'">'+f.tag+'</span><span class="faq-q-text">'+f.q+'</span><span class="faq-q-arr">▶</span></div><div class="faq-a">'+f.a+'</div></div>';
  }).join('');
  lxFilterFAQ();
}
function lxSetFaqChip(tag){lxFaqChip=tag;document.querySelectorAll('.faq-chip').forEach(function(c){c.classList.toggle('on',c.textContent===tag);});lxFilterFAQ();}
function lxFilterFAQ(){
  var q=(document.getElementById('lx-faq-search')?document.getElementById('lx-faq-search').value:'').toLowerCase();
  var items=document.querySelectorAll('#lx-faq-list .faq-item'),vis=0;
  items.forEach(function(el){var ok=(lxFaqChip==='Todas'||el.dataset.tag===lxFaqChip)&&(!q||el.textContent.toLowerCase().includes(q));el.style.display=ok?'':'none';if(ok)vis++;});
  var cnt=document.getElementById('lx-faq-count');if(cnt)cnt.textContent=vis+' pergunta'+(vis!==1?'s':'');
  var lst=document.getElementById('lx-faq-list');var emp=lst?lst.querySelector('.faq-empty'):null;
  if(vis===0&&!emp&&lst)lst.insertAdjacentHTML('beforeend','<div class="faq-empty">Nenhuma dúvida encontrada.</div>');
  if(vis>0&&emp)emp.remove();
}
