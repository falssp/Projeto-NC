<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrator de Links · NC Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
:root{
  --ul:#1F36C7;--ul-l:#EEF1FC;--ul-m:#2E47D4;--ul-d:#1628A0;
  --ok:#0D7A4E;--ok-b:#E6F4EE;--ok-t:#0A6040;
  --err:#C0392B;--err-b:#FDECEA;
  --warn:#B45309;--warn-b:#FEF9EC;--warn-t:#92400E;
  --g0:#fff;--g50:#F8F9FA;--g100:#F1F3F5;--g200:#E9ECEF;
  --g300:#DEE2E6;--g400:#CED4DA;--g500:#868E96;
  --g600:#6C757D;--g700:#495057;--g800:#343A40;--g900:#212529;
  --fn:'DM Sans',system-ui,sans-serif;--mo:'DM Mono',monospace;
  --rad:10px;--rad-sm:6px;--rad-lg:14px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--g100);color:var(--g900);min-height:100vh;padding:28px 20px 40px}

/* ── Topbar ── */
.topbar{max-width:860px;margin:0 auto 24px;display:flex;align-items:center;gap:14px}
.topbar-ico{width:40px;height:40px;border-radius:var(--rad);background:var(--ul);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:var(--sh)}
.topbar-ico svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-text h1{font-size:15px;font-weight:600;color:var(--g900);letter-spacing:-.01em}
.topbar-text p{font-size:12px;color:var(--g500);margin-top:2px;font-weight:400}

/* ── Card ── */
.card{max-width:860px;margin:0 auto;background:var(--g0);border:1px solid var(--g200);border-radius:var(--rad-lg);box-shadow:var(--sh-md);overflow:hidden}

/* ── Tabs ── */
.tab-row{display:flex;border-bottom:1px solid var(--g200);background:var(--g50)}
.tab-btn{flex:1;padding:12px 0;font-family:var(--fn);font-size:12.5px;font-weight:500;color:var(--g600);background:none;border:none;cursor:pointer;transition:all .15s;position:relative;letter-spacing:.01em}
.tab-btn::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--ul);border-radius:2px 2px 0 0;opacity:0;transition:opacity .15s}
.tab-btn.active{color:var(--ul);background:var(--g0)}
.tab-btn.active::after{opacity:1}
.tab-btn:not(.active):hover{background:var(--g100);color:var(--g700)}

/* ── Panels ── */
.panel{padding:20px 22px 22px;display:none}
.panel.active{display:block}

/* ── Single tab ── */
.input-group{display:flex;gap:8px;align-items:stretch}
.input-group input{flex:1;padding:9px 13px;border:1.5px solid var(--g300);border-radius:var(--rad-sm);font-family:var(--mo);font-size:12.5px;outline:none;background:var(--g0);color:var(--g900);transition:border-color .15s;min-width:0}
.input-group input:focus{border-color:var(--ul);box-shadow:0 0 0 3px rgba(31,54,199,.08)}
.input-group input::placeholder{color:var(--g400);font-family:var(--fn);font-size:12px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:var(--rad-sm);font-family:var(--fn);font-size:12.5px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;flex-shrink:0}
.btn-primary{background:var(--ul);color:#fff}
.btn-primary:hover{background:var(--ul-m)}
.btn-primary:active{background:var(--ul-d)}
.btn-ghost{background:var(--g0);border:1.5px solid var(--g300);color:var(--g700)}
.btn-ghost:hover{background:var(--g50);border-color:var(--g400)}

/* ── Single result ── */
.single-result{margin-top:14px}
.result-pill{display:inline-flex;align-items:center;gap:10px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--rad);padding:11px 15px;min-width:0;max-width:100%}
.net-badge{font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.result-handle{font-family:var(--mo);font-size:14.5px;font-weight:500;color:var(--g900);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{background:none;border:1.5px solid var(--g300);border-radius:var(--rad-sm);padding:4px 9px;cursor:pointer;font-size:12px;color:var(--g500);transition:all .15s;flex-shrink:0;line-height:1}
.copy-btn:hover{background:var(--g100);color:var(--g700);border-color:var(--g400)}
.copy-btn.copied{background:var(--ok-b);border-color:var(--ok);color:var(--ok-t)}
.warn-banner{background:var(--warn-b);border:1px solid #e8c97a;border-radius:var(--rad-sm);padding:10px 13px;font-size:12px;color:var(--warn-t);display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}

/* ── Batch tab ── */
.hint-box{background:var(--ul-l);border:1px solid #C5CEEE;border-radius:var(--rad-sm);padding:9px 13px;font-size:12px;color:#2B40A8;margin-bottom:13px;line-height:1.55}
.hint-box strong{font-weight:600}
textarea#ext-urls{width:100%;height:160px;border:1.5px solid var(--g300);border-radius:var(--rad-sm);padding:10px 13px;font-family:var(--mo);font-size:11.5px;resize:vertical;outline:none;background:var(--g0);color:var(--g900);line-height:1.75;transition:border-color .15s}
textarea#ext-urls:focus{border-color:var(--ul);box-shadow:0 0 0 3px rgba(31,54,199,.08)}
textarea#ext-urls::placeholder{color:var(--g400)}
.batch-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.line-count{font-size:11.5px;color:var(--g500);font-feature-settings:'tnum'}
.btn-row{display:flex;gap:7px}

/* ── Results table ── */
.tbl-section{margin-top:18px;border-top:1px solid var(--g100);padding-top:18px}
.tbl-scroll{overflow-x:auto;border:1px solid var(--g200);border-radius:var(--rad-sm)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 14px;text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g200);white-space:nowrap}
tbody td{padding:8px 14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--g50)}
.tbl-idx{color:var(--g400);font-size:11px;font-variant-numeric:tabular-nums}
.tbl-url{font-family:var(--mo);font-size:11px;color:var(--g600);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.tbl-handle{font-family:var(--mo);font-size:12px;color:var(--g800)}
.net-chip{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}

/* ── Network colors ── */
.nc-ig{background:linear-gradient(135deg,#C13584,#E1306C)}
.nc-tt{background:#010101}
.nc-yt{background:#FF0000}
.nc-tw{background:#1DA1F2}
.nc-fb{background:#1877F2}
.nc-li{background:#0A66C2}
.nc-pi{background:#E60023}
.nc-sc{background:#FFFC00;color:#000!important}
.nc-tv{background:#9146FF}
.nc-kw{background:#FF6500}
.nc-th{background:linear-gradient(135deg,#000,#333)}
.nc-bs{background:#0085FF}
.nc-rd{background:#FF4500}
.nc-dc{background:#5865F2}
.nc-xx{background:var(--g500)}

/* ── Results footer ── */
.results-footer{display:flex;align-items:center;justify-content:space-between;margin-top:13px;flex-wrap:wrap;gap:10px}
.results-stat{font-size:12px;color:var(--g600)}
.results-stat strong{color:var(--g800);font-weight:600}
.results-stat .dup-note{color:var(--g500);font-size:11.5px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-ico">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
  </div>
  <div class="topbar-text">
    <h1>Extrator de Links de Influencer</h1>
    <p>Cole links de redes sociais — extrai perfis e remove duplicatas</p>
  </div>
</div>

<div class="card">
  <div class="tab-row">
    <button class="tab-btn active" onclick="setTab('single',this)">Um por vez</button>
    <button class="tab-btn" onclick="setTab('batch',this)">Em lote</button>
  </div>

  <!-- Single -->
  <div class="panel active" id="panel-single">
    <div class="input-group">
      <input type="text" id="ext-url" placeholder="Cole o link aqui  —  ex: https://www.instagram.com/perfil" oninput="extSingleRun()" autocomplete="off" spellcheck="false" />
      <button class="btn btn-ghost" onclick="extClearSingle()">Limpar</button>
    </div>
    <div id="single-result" class="single-result" style="display:none"></div>
  </div>

  <!-- Batch -->
  <div class="panel" id="panel-batch">
    <div class="hint-box"><strong>Em lote:</strong> Um link por linha. Duplicatas (pela URL canônica) são removidas automaticamente na cópia para o Sheets.</div>
    <textarea id="ext-urls" placeholder="Cole os links aqui, um por linha…" oninput="extBatchCount()" spellcheck="false"></textarea>
    <div class="batch-footer">
      <span class="line-count" id="batch-count">0 linhas</span>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="extClearBatch()">Limpar</button>
        <button class="btn btn-primary" onclick="extBatchRun()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Extrair
        </button>
      </div>
    </div>
    <div id="batch-result"></div>
  </div>
</div>

<script>
/* ── Helpers ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var NET_CLS={
  'Instagram':'nc-ig','TikTok':'nc-tt','YouTube':'nc-yt','Twitter/X':'nc-tw',
  'Facebook':'nc-fb','LinkedIn':'nc-li','Pinterest':'nc-pi','Snapchat':'nc-sc',
  'Twitch':'nc-tv','Kwai':'nc-kw','Threads':'nc-th','Bluesky':'nc-bs',
  'Reddit':'nc-rd','Discord':'nc-dc','Outro':'nc-xx'
};

function detectNet(u){
  if(/instagram\.com/i.test(u))return'Instagram';
  if(/tiktok\.com/i.test(u))return'TikTok';
  if(/youtube\.com|youtu\.be/i.test(u))return'YouTube';
  if(/twitter\.com|x\.com/i.test(u))return'Twitter/X';
  if(/facebook\.com/i.test(u))return'Facebook';
  if(/linkedin\.com/i.test(u))return'LinkedIn';
  if(/pinterest\.com/i.test(u))return'Pinterest';
  if(/snapchat\.com/i.test(u))return'Snapchat';
  if(/twitch\.tv/i.test(u))return'Twitch';
  if(/kwai\.com/i.test(u))return'Kwai';
  if(/threads\.net/i.test(u))return'Threads';
  if(/bsky\.app/i.test(u))return'Bluesky';
  if(/reddit\.com/i.test(u))return'Reddit';
  if(/discord\.(?:com|gg)/i.test(u))return'Discord';
  if(/t\.me/i.test(u))return'Telegram';
  if(/rumble\.com/i.test(u))return'Rumble';
  if(/kick\.com/i.test(u))return'Kick';
  if(/bereal\.com/i.test(u))return'BeReal';
  if(/triller\.co/i.test(u))return'Triller';
  return'Outro';
}

function extractHandle(url){
  var h='';
  var mIG=url.match(/instagram\.com\/([^/?#]+)/i);
  if(mIG){h=mIG[1];}
  else{var mYC=url.match(/youtube\.com\/(?:c|user)\/([^/?#]+)/i);
    if(mYC){h=mYC[1];}
    else{var mAt=url.match(/@([^/?#&\s]+)/);
      if(mAt){h=mAt[1];}
      else{var mGen=url.match(/(?:facebook\.com|linkedin\.com\/in|linkedin\.com\/company|pinterest\.com|threads\.net)\/([^/?#]+)/i);
        if(mGen){h=mGen[1];}}}}
  return h.replace(/[^A-Za-z0-9._-]/g,'');
}

function canonicalUrl(url){
  return url.trim().toLowerCase()
    .replace(/^https?:\/\/(www\.)?/,'')
    .replace(/[?#].*$/,'')
    .replace(/\/+$/,'');
}

function isValidUrl(s){
  s=s.trim();
  var md=s.match(/\[.*?\]\((https?:\/\/[^\)]+)\)/);if(md)return true;
  if(!s||/^(na|n\/a)$/i.test(s))return false;
  if(/^https?:\/\//i.test(s))return true;
  if(/^(www\.|instagram\.|tiktok\.|youtube\.|twitter\.|x\.|facebook\.|linkedin\.|pinterest\.|threads\.)/i.test(s))return true;
  return false;
}

function normalizeUrl(s){
  s=s.trim();
  var md=s.match(/\[.*?\]\((https?:\/\/[^\)]+)\)/);if(md)return md[1];
  return /^https?:\/\//i.test(s)?s:'https://'+s;
}

function netCls(net){return NET_CLS[net]||'nc-xx';}

/* ── Tabs ── */
function setTab(mode,el){
  document.querySelectorAll('.tab-btn').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('panel-'+mode).classList.add('active');
}

/* ── Single ── */
function extSingleRun(){
  var raw=document.getElementById('ext-url').value;
  var res=document.getElementById('single-result');
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl).map(normalizeUrl);

  if(tokens.length>1){
    res.style.display='';
    res.innerHTML='<div class="warn-banner">'+
      '<span>⚠ <strong>'+tokens.length+' links detectados.</strong> Use o modo Em lote para múltiplos links.</span>'+
      '<button class="btn btn-ghost" style="padding:5px 12px;font-size:11.5px" onclick="extPassToLote()">Usar em lote →</button>'+
      '</div>';
    return;
  }
  var url=tokens.length===1?tokens[0]:normalizeUrl(raw.trim());
  if(!url||!isValidUrl(url)){res.style.display='none';return;}
  var handle=extractHandle(url),net=detectNet(url);
  var cls=netCls(net);
  res.style.display='';
  res.innerHTML='<div class="result-pill">'+
    '<span class="net-badge '+cls+'">'+esc(net)+'</span>'+
    '<span class="result-handle" id="single-handle">'+esc(handle||'—')+'</span>'+
    '<button class="copy-btn" onclick="copyById(\'single-handle\',this)" title="Copiar handle">⎘</button>'+
    '</div>';
}

function extPassToLote(){
  var raw=document.getElementById('ext-url').value;
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl);
  document.getElementById('ext-urls').value=tokens.join('\n');
  extBatchCount();
  document.querySelectorAll('.tab-btn')[1].click();
  document.getElementById('ext-url').value='';
  document.getElementById('single-result').style.display='none';
}

function extClearSingle(){
  document.getElementById('ext-url').value='';
  document.getElementById('single-result').style.display='none';
}

/* ── Batch ── */
function extBatchCount(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(Boolean):[];
  var valid=lines.filter(isValidUrl).length;
  document.getElementById('batch-count').textContent=
    lines.length+' linha'+(lines.length!==1?'s':'')+' · '+valid+' válida'+(valid!==1?'s':'');
}

function extClearBatch(){
  document.getElementById('ext-urls').value='';
  extBatchCount();
  document.getElementById('batch-result').innerHTML='';
}

function extBatchRun(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(Boolean):[];
  var valid=lines.filter(isValidUrl).map(normalizeUrl);
  if(!valid.length)return;

  var rows=valid.map(function(url,i){
    var handle=extractHandle(url),net=detectNet(url),cls=netCls(net);
    var short=url.replace(/^https?:\/\/(www\.)?/,'');
    if(short.length>52)short=short.slice(0,50)+'…';
    return'<tr>'+
      '<td class="tbl-idx">'+(i+1)+'</td>'+
      '<td><span class="tbl-url" title="'+esc(url)+'">'+esc(short)+'</span></td>'+
      '<td><span class="net-chip '+cls+'">'+esc(net)+'</span></td>'+
      '<td class="tbl-handle">'+esc(handle||'—')+'</td>'+
      '</tr>';
  });

  var seen={},unique=0;
  valid.forEach(function(url){var k=canonicalUrl(url);if(!seen[k]){seen[k]=true;unique++;}});
  var dups=valid.length-unique;

  var html='<div class="tbl-section">'+
    '<div class="tbl-scroll"><table>'+
    '<thead><tr><th>#</th><th>Link</th><th>Plataforma</th><th>Perfil</th></tr></thead>'+
    '<tbody>'+rows.join('')+'</tbody></table></div>'+
    '<div class="results-footer">'+
      '<div class="results-stat">'+
        '<strong>'+unique+' único'+(unique!==1?'s':'')+' para o Sheets</strong>'+
        (dups?' <span class="dup-note">· '+dups+' duplicata'+(dups>1?'s':'')+' removida'+(dups>1?'s':'')+' na cópia</span>':'')+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" onclick="extCopyProfiles()">⎘ Copiar Perfis (únicos)</button>'+
        '<button class="btn btn-ghost" onclick="extCopyTSV()">⎘ Copiar como TSV</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById('batch-result').innerHTML=html;
}

function extCopyProfiles(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  var seen={},handles=[];
  lines.forEach(function(url){var k=canonicalUrl(url);if(!seen[k]){seen[k]=true;handles.push(extractHandle(url));}});
  copyText(handles.join('\n'),'[onclick="extCopyProfiles()"]','Copiar Perfis (únicos)');
}

function extCopyTSV(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  var rows=lines.map(function(url){return[url,detectNet(url),extractHandle(url)].join('\t');});
  copyText(rows.join('\n'),'[onclick="extCopyTSV()"]','Copiar como TSV');
}

function copyById(id,btn){
  copyText(document.getElementById(id).textContent,null,null,btn);
}

function copyText(text,sel,label,btn){
  navigator.clipboard.writeText(text).then(function(){
    if(btn){
      var orig=btn.textContent;
      btn.classList.add('copied');btn.textContent='✓';
      setTimeout(function(){btn.classList.remove('copied');btn.textContent=orig;},2000);
    }else if(sel){
      document.querySelectorAll(sel).forEach(function(b){
        var orig=b.textContent;b.textContent='✓ Copiado';
        setTimeout(function(){b.textContent='⎘ '+label;},2000);
      });
    }
  });
}
</script>
</body>
</html>
