<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrator de Links · NC Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#F1F3F5;--surface:#fff;--surface2:#F8F9FA;
  --border:#E9ECEF;--border-strong:#DEE2E6;
  --text:#212529;--text2:#495057;--text3:#868E96;
  --accent:#1F36C7;--accent-bg:#EEF1FC;--accent-border:#C5CEEE;--accent-text:#1a2da8;
  --ok:#0D7A4E;--ok-bg:#E6F4EE;--ok-border:#A3D9C0;--ok-text:#0A6040;
  --warn:#B45309;--warn-bg:#FEF9EC;--warn-border:#E8C97A;--warn-text:#92400E;
  --radius:8px;
  --fn:'DM Sans',system-ui,sans-serif;
  --mo:'DM Mono',monospace;
  --header-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fn);background:var(--bg);color:var(--text)}

/* ── Header ── */
header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--surface);border-bottom:1px solid var(--border);
  z-index:100;display:flex;align-items:center;
  padding:0 clamp(16px,2.5vw,32px);gap:14px;
}
.hd-ico{
  width:32px;height:32px;border-radius:var(--radius);
  background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hd-ico svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hd-title{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.hd-sub{font-size:11px;color:var(--text3);margin-top:1px}
.hd-spacer{flex:1}
.tab-group{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border-strong);border-radius:calc(var(--radius) + 2px);padding:3px}
.tab-btn{
  padding:5px 16px;border-radius:calc(var(--radius) - 1px);
  font-family:var(--fn);font-size:12px;font-weight:500;
  color:var(--text3);background:none;border:none;cursor:pointer;transition:all .15s;
}
.tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-btn:not(.active):hover{color:var(--text2)}

/* ── Layout ── */
.layout{
  position:fixed;
  top:var(--header-h);left:0;right:0;bottom:0;
  display:grid;grid-template-columns:340px 1fr;
}

/* ── Left panel ── */
.left{
  border-right:1px solid var(--border);
  background:var(--surface);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden;padding:16px}
.panel.active{display:flex}

/* Inputs */
.lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.inp{
  width:100%;padding:8px 11px;
  border:1.5px solid var(--border-strong);border-radius:var(--radius);
  font-family:var(--mo);font-size:12.5px;outline:none;
  background:var(--surface);color:var(--text);
  transition:border-color .15s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,54,199,.07)}
.inp::placeholder{color:var(--text3);font-family:var(--fn);font-size:12px}

textarea.inp{
  flex:1;resize:none;line-height:1.75;
  font-size:12px;min-height:0;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:0 14px;height:34px;
  border-radius:var(--radius);font-family:var(--fn);font-size:12px;font-weight:500;
  cursor:pointer;border:none;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2E47D4}
.btn-primary:active{background:#1628A0}
.btn-ghost{background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text2)}
.btn-ghost:hover{background:var(--surface2);border-color:#CED4DA}

.row{display:flex;gap:7px;margin-top:8px;align-items:center;justify-content:space-between;flex-shrink:0}
.line-count{font-size:11px;color:var(--text3)}

.hint{
  background:var(--accent-bg);border:1px solid var(--accent-border);
  border-radius:var(--radius);padding:8px 11px;font-size:11.5px;color:var(--accent-text);
  line-height:1.55;margin-bottom:12px;flex-shrink:0;
}
.hint strong{font-weight:600}

/* Single result in left panel */
.single-out{margin-top:12px;flex-shrink:0}
.result-pill{
  display:flex;align-items:center;gap:9px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px;
}
.net-badge{
  font-size:10px;font-weight:700;color:#fff;
  padding:3px 9px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;flex-shrink:0;
}
.result-handle{font-family:var(--mo);font-size:14px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{
  background:none;border:1.5px solid var(--border-strong);border-radius:var(--radius);
  padding:4px 8px;cursor:pointer;font-size:11px;color:var(--text3);transition:all .15s;flex-shrink:0;
}
.copy-btn:hover{background:var(--surface2);color:var(--text2)}
.copy-btn.copied{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}

.warn-banner{
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);
  padding:9px 11px;font-size:11.5px;color:var(--warn-text);margin-top:10px;
  display:flex;flex-direction:column;gap:7px;flex-shrink:0;
}

/* ── Right panel ── */
.right{overflow-y:auto;padding:24px clamp(16px,2.5vw,32px)}

.empty-state{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:var(--text3);
}
.empty-ico{font-size:32px;opacity:.35}
.empty-msg{font-size:13px}

/* Results */
.results-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;flex-wrap:wrap;gap:10px;
}
.results-stat{font-size:13px;color:var(--text2)}
.results-stat strong{color:var(--text);font-weight:600}
.dup-note{font-size:12px;color:var(--text3)}

.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  padding:9px 14px;text-align:left;font-size:10.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--text3);
  background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.tbl-idx{width:40px;color:var(--text3);font-variant-numeric:tabular-nums;font-size:11px}
.tbl-url{font-family:var(--mo);font-size:11px;color:var(--text3);display:inline-block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-handle{font-family:var(--mo);font-size:12.5px;color:var(--text)}
.net-chip{
  display:inline-block;font-size:10px;font-weight:700;color:#fff;
  padding:2px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;
}

/* ── Single result on right panel ── */
.single-right{padding:24px clamp(16px,2.5vw,32px)}
.single-right .big-result{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;max-width:480px;
}
.single-right .big-net{font-size:11px;font-weight:700;color:#fff;padding:4px 12px;border-radius:20px;flex-shrink:0}
.single-right .big-handle{font-family:var(--mo);font-size:20px;font-weight:500;flex:1}
.single-right .copy-btn{height:34px;padding:0 12px;font-size:13px}

/* Action row below table */
.action-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ── Network colors ── */
.nc-ig{background:linear-gradient(135deg,#C13584,#E1306C)}
.nc-tt{background:#010101}
.nc-yt{background:#FF0000}
.nc-tw{background:#1DA1F2}
.nc-fb{background:#1877F2}
.nc-li{background:#0A66C2}
.nc-pi{background:#E60023}
.nc-sc{background:#FFFC00;color:#000!important}
.nc-tv{background:#9146FF}
.nc-kw{background:#FF6500}
.nc-th{background:#000}
.nc-bs{background:#0085FF}
.nc-rd{background:#FF4500}
.nc-dc{background:#5865F2}
.nc-xx{background:var(--text3)}
</style>
</head>
<body>

<header>
  <div class="hd-ico">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
  </div>
  <div>
    <div class="hd-title">Extrator de Links de Influencer</div>
    <div class="hd-sub">Extrai perfis e remove duplicatas</div>
  </div>
  <div class="hd-spacer"></div>
  <div class="tab-group">
    <button class="tab-btn active" onclick="setTab('single',this)">Um por vez</button>
    <button class="tab-btn" onclick="setTab('batch',this)">Em lote</button>
  </div>
</header>

<div class="layout">

  <!-- Left -->
  <div class="left">

    <!-- Single -->
    <div class="panel active" id="panel-single">
      <div class="lbl">Link</div>
      <input class="inp" type="text" id="ext-url"
        placeholder="https://www.instagram.com/perfil"
        oninput="extSingleRun()" autocomplete="off" spellcheck="false" />
      <div id="single-result" class="single-out" style="display:none"></div>
      <div style="margin-top:auto;padding-top:12px;flex-shrink:0">
        <button class="btn btn-ghost" style="width:100%" onclick="extClearSingle()">Limpar</button>
      </div>
    </div>

    <!-- Batch -->
    <div class="panel" id="panel-batch">
      <div class="hint"><strong>Em lote:</strong> Um link por linha. Duplicatas são removidas automaticamente na cópia para o Sheets.</div>
      <div class="lbl">Links</div>
      <textarea class="inp" id="ext-urls"
        placeholder="Cole os links aqui, um por linha…"
        oninput="extBatchCount()" spellcheck="false"></textarea>
      <div class="row">
        <span class="line-count" id="batch-count">0 linhas</span>
        <div style="display:flex;gap:7px">
          <button class="btn btn-ghost" onclick="extClearBatch()">Limpar</button>
          <button class="btn btn-primary" onclick="extBatchRun()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Extrair
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Right -->
  <div class="right" id="right-panel">
    <div class="empty-state" id="empty-state">
      <div class="empty-ico">🔗</div>
      <div class="empty-msg">Cole um link para começar</div>
    </div>
  </div>

</div>

<script>
var _mode='single';

var NET_CLS={
  Instagram:'nc-ig',TikTok:'nc-tt',YouTube:'nc-yt','Twitter/X':'nc-tw',
  Facebook:'nc-fb',LinkedIn:'nc-li',Pinterest:'nc-pi',Snapchat:'nc-sc',
  Twitch:'nc-tv',Kwai:'nc-kw',Threads:'nc-th',Bluesky:'nc-bs',
  Reddit:'nc-rd',Discord:'nc-dc',Outro:'nc-xx'
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function netCls(n){return NET_CLS[n]||'nc-xx';}

function detectNet(u){
  if(/instagram\.com/i.test(u))return'Instagram';
  if(/tiktok\.com/i.test(u))return'TikTok';
  if(/youtube\.com|youtu\.be/i.test(u))return'YouTube';
  if(/twitter\.com|x\.com/i.test(u))return'Twitter/X';
  if(/facebook\.com/i.test(u))return'Facebook';
  if(/linkedin\.com/i.test(u))return'LinkedIn';
  if(/pinterest\.com/i.test(u))return'Pinterest';
  if(/snapchat\.com/i.test(u))return'Snapchat';
  if(/twitch\.tv/i.test(u))return'Twitch';
  if(/kwai\.com/i.test(u))return'Kwai';
  if(/threads\.net/i.test(u))return'Threads';
  if(/bsky\.app/i.test(u))return'Bluesky';
  if(/reddit\.com/i.test(u))return'Reddit';
  if(/discord\.(?:com|gg)/i.test(u))return'Discord';
  if(/t\.me/i.test(u))return'Telegram';
  if(/rumble\.com/i.test(u))return'Rumble';
  if(/kick\.com/i.test(u))return'Kick';
  return'Outro';
}

function extractHandle(url){
  var h='';
  var mIG=url.match(/instagram\.com\/([^/?#]+)/i);
  if(mIG){h=mIG[1];}
  else{var mYC=url.match(/youtube\.com\/(?:c|user)\/([^/?#]+)/i);
    if(mYC){h=mYC[1];}
    else{var mAt=url.match(/@([^/?#&\s]+)/);
      if(mAt){h=mAt[1];}
      else{var mGen=url.match(/(?:facebook\.com|linkedin\.com\/in|linkedin\.com\/company|pinterest\.com|threads\.net)\/([^/?#]+)/i);
        if(mGen){h=mGen[1];}}}}
  return h.replace(/[^A-Za-z0-9._-]/g,'');
}

function canonicalUrl(u){
  return u.trim().toLowerCase()
    .replace(/^https?:\/\/(www\.)?/,'')
    .replace(/[?#].*$/,'')
    .replace(/\/+$/,'');
}

function isValidUrl(s){
  s=s.trim();
  if(!s||/^(na|n\/a)$/i.test(s))return false;
  if(/\[.*?\]\((https?:\/\/[^\)]+)\)/.test(s))return true;
  if(/^https?:\/\//i.test(s))return true;
  if(/^(www\.|instagram\.|tiktok\.|youtube\.|twitter\.|x\.|facebook\.|linkedin\.|pinterest\.|threads\.)/i.test(s))return true;
  return false;
}

function normalizeUrl(s){
  s=s.trim();
  var md=s.match(/\[.*?\]\((https?:\/\/[^\)]+)\)/);if(md)return md[1];
  return /^https?:\/\//i.test(s)?s:'https://'+s;
}

/* ── Tabs ── */
function setTab(mode,el){
  _mode=mode;
  document.querySelectorAll('.tab-btn').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('panel-'+mode).classList.add('active');
  setRight('<div class="empty-state"><div class="empty-ico">🔗</div><div class="empty-msg">'+
    (mode==='single'?'Cole um link para começar':'Cole os links e clique em Extrair')+
    '</div></div>');
}

function setRight(html){document.getElementById('right-panel').innerHTML=html;}

/* ── Single ── */
function extSingleRun(){
  var raw=document.getElementById('ext-url').value;
  var res=document.getElementById('single-result');
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl).map(normalizeUrl);

  if(tokens.length>1){
    res.style.display='';
    res.innerHTML='<div class="warn-banner">'+
      '<span>⚠ <strong>'+tokens.length+' links</strong> detectados.</span>'+
      '<button class="btn btn-ghost" style="height:28px;font-size:11px" onclick="extPassToLote()">Usar em lote →</button>'+
      '</div>';
    setRight('<div class="empty-state"><div class="empty-ico">🔗</div><div class="empty-msg">Use o modo Em lote para múltiplos links</div></div>');
    return;
  }
  var url=tokens.length===1?tokens[0]:normalizeUrl(raw.trim());
  if(!url||!isValidUrl(url)){
    res.style.display='none';
    setRight('<div class="empty-state"><div class="empty-ico">🔗</div><div class="empty-msg">Cole um link para começar</div></div>');
    return;
  }
  var handle=extractHandle(url),net=detectNet(url),cls=netCls(net);
  res.style.display='';
  res.innerHTML='<div class="result-pill">'+
    '<span class="net-badge '+cls+'">'+esc(net)+'</span>'+
    '<span class="result-handle">'+esc(handle||'—')+'</span>'+
    '</div>';

  setRight('<div style="padding:24px clamp(16px,2.5vw,32px)">'+
    '<div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;max-width:520px">'+
    '<span class="net-badge '+cls+'" style="font-size:11px;padding:4px 12px">'+esc(net)+'</span>'+
    '<span id="big-handle" style="font-family:var(--mo);font-size:20px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(handle||'—')+'</span>'+
    '<button class="copy-btn" style="height:34px;padding:0 12px;font-size:13px" onclick="copyById(\'big-handle\',this)">⎘ Copiar</button>'+
    '</div>'+
    '<div style="margin-top:10px;font-size:11px;color:var(--text3);font-family:var(--mo)">'+esc(url)+'</div>'+
    '</div>');
}

function extPassToLote(){
  var raw=document.getElementById('ext-url').value;
  var tokens=raw.split(/[\n\s]+/).map(function(t){return t.trim();}).filter(isValidUrl);
  document.getElementById('ext-urls').value=tokens.join('\n');
  extBatchCount();
  document.querySelectorAll('.tab-btn')[1].click();
  document.getElementById('ext-url').value='';
  document.getElementById('single-result').style.display='none';
}

function extClearSingle(){
  document.getElementById('ext-url').value='';
  document.getElementById('single-result').style.display='none';
  setRight('<div class="empty-state"><div class="empty-ico">🔗</div><div class="empty-msg">Cole um link para começar</div></div>');
}

/* ── Batch ── */
function extBatchCount(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(Boolean):[];
  var valid=lines.filter(isValidUrl).length;
  document.getElementById('batch-count').textContent=
    lines.length+' linha'+(lines.length!==1?'s':'')+' · '+valid+' válida'+(valid!==1?'s':'');
}

function extClearBatch(){
  document.getElementById('ext-urls').value='';
  extBatchCount();
  setRight('<div class="empty-state"><div class="empty-ico">🔗</div><div class="empty-msg">Cole os links e clique em Extrair</div></div>');
}

function extBatchRun(){
  var raw=document.getElementById('ext-urls').value.trim();
  var valid=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  if(!valid.length)return;

  var seen={},unique=0;
  valid.forEach(function(u){var k=canonicalUrl(u);if(!seen[k]){seen[k]=true;unique++;}});
  var dups=valid.length-unique;

  var rows=valid.map(function(url,i){
    var handle=extractHandle(url),net=detectNet(url),cls=netCls(net);
    var short=url.replace(/^https?:\/\/(www\.)?/,'');
    if(short.length>55)short=short.slice(0,53)+'…';
    return'<tr>'+
      '<td class="tbl-idx">'+(i+1)+'</td>'+
      '<td><span class="tbl-url" title="'+esc(url)+'">'+esc(short)+'</span></td>'+
      '<td><span class="net-chip '+cls+'">'+esc(net)+'</span></td>'+
      '<td class="tbl-handle">'+esc(handle||'—')+'</td>'+
      '</tr>';
  });

  setRight(
    '<div style="padding:24px clamp(16px,2.5vw,32px)">'+
    '<div class="results-hdr">'+
      '<div class="results-stat">'+
        '<strong>'+unique+' perfil'+(unique!==1?'s':'')+' único'+(unique!==1?'s':'')+' para o Sheets</strong>'+
        (dups?' <span class="dup-note">· '+dups+' duplicata'+(dups>1?'s':'')+' removida'+(dups>1?'s':'')+' na cópia</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="tbl-wrap">'+
    '<table><thead><tr><th>#</th><th>Link</th><th>Plataforma</th><th>Perfil</th></tr></thead>'+
    '<tbody>'+rows.join('')+'</tbody></table></div>'+
    '<div class="action-row">'+
      '<button class="btn btn-ghost" onclick="extCopyProfiles()">⎘ Copiar Perfis (únicos)</button>'+
      '<button class="btn btn-ghost" onclick="extCopyTSV()">⎘ Copiar como TSV</button>'+
    '</div></div>'
  );
}

/* ── Copy helpers ── */
function extCopyProfiles(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  var seen={},handles=[];
  lines.forEach(function(url){var k=canonicalUrl(url);if(!seen[k]){seen[k]=true;handles.push(extractHandle(url));}});
  copyText(handles.join('\n'),'[onclick="extCopyProfiles()"]','Copiar Perfis (únicos)');
}
function extCopyTSV(){
  var raw=document.getElementById('ext-urls').value.trim();
  var lines=raw?raw.split('\n').map(function(l){return l.trim();}).filter(isValidUrl).map(normalizeUrl):[];
  copyText(lines.map(function(u){return[u,detectNet(u),extractHandle(u)].join('\t');}).join('\n'),'[onclick="extCopyTSV()"]','Copiar como TSV');
}
function copyById(id,btn){
  copyText(document.getElementById(id).textContent,null,null,btn);
}
function copyText(text,sel,label,btn){
  navigator.clipboard.writeText(text).then(function(){
    if(btn){
      var o=btn.textContent;btn.classList.add('copied');btn.textContent='✓ Copiado';
      setTimeout(function(){btn.classList.remove('copied');btn.textContent=o;},2000);
    }else if(sel){
      document.querySelectorAll(sel).forEach(function(b){
        var o=b.textContent;b.textContent='✓ Copiado';
        setTimeout(function(){b.textContent='⎘ '+label;},2000);
      });
    }
  });
}
</script>
</body>
