<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Pós-Voo de Campanha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1a237e;--accent:#1F36C7;--hl:#e8ecfd;--border:#d6dbf2;--bg:#f4f5fb;--white:#fff;--red:#d32f2f;--yellow:#f57c00;--green:#2e7d32;--gray:#607d8b}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:#1a1a2e;min-height:100vh}
header{background:var(--blue);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:1.25rem;font-weight:700}
header .subtitle{font-size:.8rem;opacity:.7;margin-top:2px}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 14px;font-family:inherit;font-size:.82rem;font-weight:600;color:#fff;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.25)}
.main{padding:28px 32px;min-width:0;display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}
@media(max-width:1050px){.main{grid-template-columns:1fr}}
.panel{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:22px;margin-bottom:0}
.section-title{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--border);margin-top:0}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.78rem;font-weight:600;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.88rem;background:var(--white)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--border);margin:16px 0}
.plataforma-block{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.plataforma-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.plataforma-header span{font-size:.85rem;font-weight:700}
.btn-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:.8rem;font-weight:600}
.btn-add{background:var(--hl);color:var(--accent);border:1.5px dashed var(--border);border-radius:8px;padding:8px;width:100%;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;margin-top:4px}
.btn-add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Preview area */
.preview{background:var(--white);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.preview-header{background:var(--blue);color:#fff;padding:16px 24px}
.preview-header h2{font-size:1.1rem;font-weight:700}
.preview-header .meta{font-size:.78rem;opacity:.7;margin-top:4px}
.preview-body{padding:24px}
.report-section{margin-bottom:24px}
.report-section h3{font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--hl)}
.kpi-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.kpi-card .label{font-size:.68rem;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.kpi-card .value{font-size:1.1rem;font-weight:700;color:var(--accent)}
.kpi-card .delta{font-size:.72rem;margin-top:2px}
.delta.pos{color:var(--green)}
.delta.neg{color:var(--red)}
.plat-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:16px}
.plat-table th{background:var(--hl);color:var(--accent);padding:8px 10px;text-align:left;font-weight:700}
.plat-table td{padding:8px 10px;border-top:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-yellow{background:#fff8e1;color:#f57c00}
.badge-red{background:#ffebee;color:#c62828}
.narrative-block{background:var(--hl);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 16px;font-size:.85rem;line-height:1.7;margin-bottom:12px}
.narrative-block.green{background:#e8f5e9;border-color:#2e7d32}
.narrative-block.yellow{background:#fff8e1;border-color:#f57c00}
.insight-list{list-style:none;padding:0}
.insight-list li{padding:7px 12px;border-radius:6px;margin-bottom:6px;font-size:.82rem;line-height:1.5}
.insight-list li.pos{background:#e8f5e9;border-left:3px solid var(--green)}
.insight-list li.neg{background:#ffebee;border-left:3px solid var(--red)}
.insight-list li.neu{background:var(--hl);border-left:3px solid var(--accent)}
.print-actions{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--hl);color:var(--accent)}
.btn:hover{opacity:.85}
.placeholder{padding:60px;text-align:center;color:var(--gray);font-size:.9rem}
@media print{
  header .hbtn,.print-actions,.main>div:first-child{display:none!important}
  .main{grid-template-columns:1fr;padding:8px}
  .preview{border:none}
  .preview-header{background:#1a237e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>✈️ Relatório Pós-Voo de Campanha</h1>
    <div class="subtitle">Análise consolidada ao encerramento da campanha</div>
  </div>
  <button class="hbtn" onclick="window.print()">🖨️ Exportar PDF</button>
</header>
<div class="main">
  <!-- Left: Form -->
  <div>
    <div class="panel">
      <div class="section-title">Informações Gerais</div>
      <div class="form-group"><label>Nome da Campanha</label><input type="text" id="f_camp" placeholder="Ex: Campanha Verão 2026 — Brand" oninput="genReport()"></div>
      <div class="form-group"><label>Anunciante / Cliente</label><input type="text" id="f_client" placeholder="Nome do anunciante" oninput="genReport()"></div>
      <div class="row2">
        <div class="form-group"><label>Início</label><input type="date" id="f_start" oninput="genReport()"></div>
        <div class="form-group"><label>Encerramento</label><input type="date" id="f_end" oninput="genReport()"></div>
      </div>
      <div class="form-group"><label>Objetivo Principal</label>
        <select id="f_obj" onchange="genReport()">
          <option value="awareness">Awareness / Alcance</option>
          <option value="consideration">Consideração / Tráfego</option>
          <option value="conversion">Conversão / Vendas</option>
          <option value="lead">Geração de Leads</option>
          <option value="app">Install de App</option>
        </select>
      </div>
      <div class="form-group"><label>Responsável AdOps</label><input type="text" id="f_resp" oninput="genReport()"></div>

      <div class="divider"></div>
      <div class="section-title">Verba & Resultados Totais</div>
      <div class="row2">
        <div class="form-group"><label>Budget Aprovado (R$)</label><input type="number" id="f_budget_plan" placeholder="10000" oninput="genReport()"></div>
        <div class="form-group"><label>Investido Real (R$)</label><input type="number" id="f_budget_real" placeholder="9850" oninput="genReport()"></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Impressões Realizadas</label><input type="number" id="f_imp" oninput="genReport()"></div>
        <div class="form-group"><label>Impressões Meta</label><input type="number" id="f_imp_plan" oninput="genReport()"></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Cliques</label><input type="number" id="f_clicks" oninput="genReport()"></div>
        <div class="form-group"><label>Conversões</label><input type="number" id="f_conv" oninput="genReport()"></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Receita Gerada (R$)</label><input type="number" id="f_revenue" oninput="genReport()"></div>
        <div class="form-group"><label>Viewability (%)</label><input type="number" id="f_view" oninput="genReport()"></div>
      </div>

      <div class="divider"></div>
      <div class="section-title">Por Plataforma</div>
      <div id="platforms"></div>
      <button class="btn-add" onclick="addPlatform()">+ Adicionar plataforma</button>

      <div class="divider"></div>
      <div class="section-title">Análise Qualitativa</div>
      <div class="form-group"><label>Destaques Positivos</label><textarea id="f_pos" placeholder="Criativo de vídeo teve CTR 2x acima do benchmark&#10;Segmentação por interesse performou melhor que lookalike" oninput="genReport()"></textarea></div>
      <div class="form-group"><label>Pontos de Melhoria</label><textarea id="f_neg" placeholder="Pacing irregular na 2ª semana&#10;Viewability abaixo de 60% nos posicionamentos display" oninput="genReport()"></textarea></div>
      <div class="form-group"><label>Recomendações para Próximas Campanhas</label><textarea id="f_rec" placeholder="Aumentar verba em 20% para vídeo&#10;Testar creative refresh quinzenal" oninput="genReport()"></textarea></div>
    </div>
  </div>

  <!-- Right: Preview -->
  <div>
    <div class="preview" id="previewArea">
      <div class="placeholder">Preencha as informações ao lado para gerar o relatório automaticamente.</div>
    </div>
  </div>
</div>

<script>
let platformCount = 0;
const PLATFORM_OPTIONS = ['CM360','Meta Ads','Google Ads','DV360','TikTok Ads','LinkedIn Ads','Twitter/X Ads','Programático (outros)'];

function addPlatform() {
  const id = 'plt_' + platformCount++;
  const div = document.createElement('div');
  div.className = 'plataforma-block';
  div.id = id;
  div.innerHTML = `
    <div class="plataforma-header">
      <select onchange="genReport()" id="${id}_name" style="border:none;background:transparent;font-weight:700;font-family:inherit;font-size:.85rem;color:var(--blue)">
        ${PLATFORM_OPTIONS.map(p=>`<option>${p}</option>`).join('')}
      </select>
      <button class="btn-remove" onclick="document.getElementById('${id}').remove();genReport()">✕ Remover</button>
    </div>
    <div class="row2">
      <div class="form-group"><label>Investimento (R$)</label><input type="number" id="${id}_spend" placeholder="3500" oninput="genReport()"></div>
      <div class="form-group"><label>Impressões</label><input type="number" id="${id}_imp" placeholder="500000" oninput="genReport()"></div>
    </div>
    <div class="row2">
      <div class="form-group"><label>Cliques</label><input type="number" id="${id}_clicks" oninput="genReport()"></div>
      <div class="form-group"><label>Conversões</label><input type="number" id="${id}_conv" oninput="genReport()"></div>
    </div>`;
  document.getElementById('platforms').appendChild(div);
  genReport();
}

function getPlatforms() {
  const rows = [];
  document.querySelectorAll('[id^="plt_"]').forEach(el => {
    const id = el.id;
    const name = document.getElementById(id+'_name')?.value||'';
    const spend = parseFloat(document.getElementById(id+'_spend')?.value)||0;
    const imp = parseFloat(document.getElementById(id+'_imp')?.value)||0;
    const clicks = parseFloat(document.getElementById(id+'_clicks')?.value)||0;
    const conv = parseFloat(document.getElementById(id+'_conv')?.value)||0;
    if (name) rows.push({name, spend, imp, clicks, conv});
  });
  return rows;
}

function getN(id) { return parseFloat(document.getElementById(id)?.value)||0; }
function getV(id) { return document.getElementById(id)?.value||''; }
function fmtBRL(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtNum(n){return n.toLocaleString('pt-BR');}
function fmtPct(n,d=2){return n.toFixed(d)+'%';}
function deltaClass(v,p,goodIfHigh=true){
  if(!p||!v)return '';
  const pctDiff=(v-p)/p*100;
  if(goodIfHigh) return pctDiff>=0?'pos':'neg';
  return pctDiff<=0?'pos':'neg';
}
function deltaStr(v,p){
  if(!p||!v)return '';
  const d=(v-p)/p*100;
  return (d>=0?'+':'')+d.toFixed(1)+'% vs meta';
}

function genReport() {
  const camp = getV('f_camp');
  const client = getV('f_client');
  const start = getV('f_start');
  const end = getV('f_end');
  const obj = getV('f_obj');
  const resp = getV('f_resp');
  const budgetPlan = getN('f_budget_plan');
  const budgetReal = getN('f_budget_real');
  const impReal = getN('f_imp');
  const impPlan = getN('f_imp_plan');
  const clicks = getN('f_clicks');
  const conv = getN('f_conv');
  const revenue = getN('f_revenue');
  const viewability = getN('f_view');
  const platforms = getPlatforms();
  const pos = getV('f_pos').split('\n').filter(x=>x.trim());
  const neg = getV('f_neg').split('\n').filter(x=>x.trim());
  const rec = getV('f_rec').split('\n').filter(x=>x.trim());

  if (!camp && !client) {
    document.getElementById('previewArea').innerHTML = '<div class="placeholder">Preencha as informações ao lado para gerar o relatório automaticamente.</div>';
    return;
  }

  const ctr = impReal>0&&clicks>0 ? clicks/impReal*100 : 0;
  const cpm = budgetReal>0&&impReal>0 ? budgetReal/impReal*1000 : 0;
  const cpc = budgetReal>0&&clicks>0 ? budgetReal/clicks : 0;
  const cpa = budgetReal>0&&conv>0 ? budgetReal/conv : 0;
  const roas = budgetReal>0&&revenue>0 ? revenue/budgetReal : 0;
  const budgetExec = budgetPlan>0&&budgetReal>0 ? budgetReal/budgetPlan*100 : 0;
  const impDelta = impPlan>0&&impReal>0 ? (impReal-impPlan)/impPlan*100 : null;

  const objLabels = {awareness:'Awareness / Alcance',consideration:'Consideração / Tráfego',conversion:'Conversão / Vendas',lead:'Geração de Leads',app:'Install de App'};
  const dateRange = start&&end ? `${new Date(start+'T12:00').toLocaleDateString('pt-BR')} — ${new Date(end+'T12:00').toLocaleDateString('pt-BR')}` : (start ? 'Início: '+new Date(start+'T12:00').toLocaleDateString('pt-BR') : '');

  // Build narrative
  let narrativeColor = 'neu';
  let narrativeLine = '';
  if (budgetReal && impReal) {
    const execPct = budgetExec;
    if (execPct >= 95 && execPct <= 105) { narrativeColor = 'green'; narrativeLine = `A campanha foi entregue com ${execPct.toFixed(1)}% do budget aprovado, dentro da faixa ideal de execução.`; }
    else if (execPct < 85) { narrativeColor = 'yellow'; narrativeLine = `A campanha entregou ${execPct.toFixed(1)}% do budget aprovado, abaixo da meta de execução. Recomendamos revisar a estratégia de pacing.`; }
    else narrativeLine = `A campanha entregou ${execPct.toFixed(1)}% do budget aprovado (R$ ${(budgetPlan-budgetReal).toLocaleString('pt-BR',{maximumFractionDigits:0})} de saldo).`;
    if (impDelta !== null) narrativeLine += ` Foram entregues ${impReal.toLocaleString('pt-BR')} impressões, ${impDelta>=0?'superando':'abaixo de'} a meta em ${Math.abs(impDelta).toFixed(1)}%.`;
    if (roas > 0) narrativeLine += ` O ROAS final de ${roas.toFixed(2)}x ${roas >= 2 ? 'demonstra boa eficiência de retorno sobre o investimento.' : 'indica oportunidade de melhoria na rentabilidade da campanha.'}`;
  }

  const html = `
    <div class="preview-header">
      <h2>Relatório Pós-Voo — ${camp||'(campanha)'}</h2>
      <div class="meta">${client?client+' · ':''}${dateRange?dateRange+' · ':''}${objLabels[obj]||''}</div>
    </div>
    <div class="preview-body">
      ${narrativeLine?`<div class="report-section"><div class="narrative-block ${narrativeColor}">${narrativeLine}</div></div>`:''}

      <div class="report-section">
        <h3>Resumo Executivo</h3>
        <div class="kpi-wrap">
          ${budgetReal?`<div class="kpi-card"><div class="label">Investimento</div><div class="value">${fmtBRL(budgetReal)}</div>${budgetPlan?`<div class="delta ${deltaClass(budgetReal,budgetPlan,true)}">${deltaStr(budgetReal,budgetPlan)}</div>`:''}</div>`:''}
          ${impReal?`<div class="kpi-card"><div class="label">Impressões</div><div class="value">${fmtNum(impReal)}</div>${impDelta!==null?`<div class="delta ${impDelta>=0?'pos':'neg'}">${impDelta>=0?'+':''}${impDelta.toFixed(1)}% vs meta</div>`:''}</div>`:''}
          ${ctr>0?`<div class="kpi-card"><div class="label">CTR</div><div class="value">${fmtPct(ctr)}</div></div>`:''}
          ${cpm>0?`<div class="kpi-card"><div class="label">CPM</div><div class="value">${fmtBRL(cpm)}</div></div>`:''}
          ${cpc>0?`<div class="kpi-card"><div class="label">CPC</div><div class="value">${fmtBRL(cpc)}</div></div>`:''}
          ${conv?`<div class="kpi-card"><div class="label">Conversões</div><div class="value">${fmtNum(conv)}</div></div>`:''}
          ${cpa>0?`<div class="kpi-card"><div class="label">CPA</div><div class="value">${fmtBRL(cpa)}</div></div>`:''}
          ${roas>0?`<div class="kpi-card"><div class="label">ROAS</div><div class="value">${roas.toFixed(2)}x</div></div>`:''}
          ${viewability?`<div class="kpi-card"><div class="label">Viewability</div><div class="value">${viewability}%</div><div class="delta ${viewability>=70?'pos':viewability>=50?'':'neg'}">${viewability>=70?'✅ Acima benchmark':viewability>=50?'⚠️ Abaixo do ideal':'🔴 Crítico'}</div></div>`:''}
        </div>
      </div>

      ${platforms.length>0?`<div class="report-section">
        <h3>Performance por Plataforma</h3>
        <table class="plat-table">
          <thead><tr><th>Plataforma</th><th>Investimento</th><th>Impressões</th><th>CTR</th><th>CPC</th>${platforms.some(p=>p.conv)?'<th>Conversões</th><th>CPA</th>':''}</tr></thead>
          <tbody>${platforms.map(p=>{
            const pctr=p.imp>0&&p.clicks>0?p.clicks/p.imp*100:0;
            const pcpc=p.spend>0&&p.clicks>0?p.spend/p.clicks:0;
            const pcpa=p.spend>0&&p.conv>0?p.spend/p.conv:0;
            return `<tr>
              <td><strong>${p.name}</strong></td>
              <td>${p.spend?fmtBRL(p.spend):'—'}</td>
              <td>${p.imp?fmtNum(p.imp):'—'}</td>
              <td>${pctr>0?fmtPct(pctr):'—'}</td>
              <td>${pcpc>0?fmtBRL(pcpc):'—'}</td>
              ${platforms.some(pl=>pl.conv)?`<td>${p.conv?fmtNum(p.conv):'—'}</td><td>${pcpa>0?fmtBRL(pcpa):'—'}</td>`:''}</tr>`;
          }).join('')}</tbody>
        </table>
      </div>`:''}

      ${pos.length>0||neg.length>0?`<div class="report-section">
        <h3>Análise Qualitativa</h3>
        ${pos.length>0?`<ul class="insight-list">${pos.map(l=>`<li class="pos">✅ ${l}</li>`).join('')}</ul>`:''}
        ${neg.length>0?`<ul class="insight-list">${neg.map(l=>`<li class="neg">⚠️ ${l}</li>`).join('')}</ul>`:''}
      </div>`:''}

      ${rec.length>0?`<div class="report-section">
        <h3>Recomendações</h3>
        <ul class="insight-list">${rec.map(l=>`<li class="neu">→ ${l}</li>`).join('')}</ul>
      </div>`:''}

      ${resp?`<div style="font-size:.75rem;color:var(--gray);text-align:right;margin-top:16px">Responsável AdOps: ${resp} · Gerado por NC Tools</div>`:''}
    </div>
    <div class="print-actions">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Exportar PDF</button>
      <button class="btn btn-secondary" onclick="copyReport()">📋 Copiar resumo</button>
    </div>`;
  document.getElementById('previewArea').innerHTML = html;
}

function copyReport() {
  const camp = getV('f_camp');
  const lines = [`RELATÓRIO PÓS-VOO — ${camp||'(campanha)'}`, '='.repeat(50)];
  ['f_client','f_start','f_end'].forEach(id=>{ const v=getV(id); if(v) lines.push(id.replace('f_','')+': '+v); });
  lines.push('\nMÉTRICAS PRINCIPAIS');
  ['f_budget_real','f_imp','f_clicks','f_conv','f_revenue','f_view'].forEach(id=>{ const v=getN(id); if(v) lines.push(id.replace('f_','')+': '+v.toLocaleString('pt-BR')); });
  navigator.clipboard.writeText(lines.join('\n'));
}

// Initialize with today's date
const today = new Date().toISOString().split('T')[0];
document.getElementById('f_start').value = today;
document.getElementById('f_end').value = today;
addPlatform();
genReport();
</script>
</body>
</html>
