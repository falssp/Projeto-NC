<title>NC Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#ffffff;--bg2:#f8fafc;--bg3:#f1f5f9;
    --border:#e2e8f0;--border2:#cbd5e1;
    --fg:#0f172a;--fg2:#475569;--fg3:#94a3b8;
    --accent:#7c3aed;--accent-bg:#faf5ff;--accent-border:#e9d5ff;
    --radius:10px;
    --c0:#7c3aed;--c1:#0891b2;--c2:#059669;--c3:#d97706;--c4:#dc2626;--c5:#db2777;--c6:#4f46e5;--c7:#0d9488;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
    --border:#334155;--border2:#475569;
    --fg:#f1f5f9;--fg2:#94a3b8;--fg3:#64748b;
    --accent:#a78bfa;--accent-bg:#1e1b4b;--accent-border:#4c1d95;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
    --border:#334155;--border2:#475569;
    --fg:#f1f5f9;--fg2:#94a3b8;--fg3:#64748b;
    --accent:#a78bfa;--accent-bg:#1e1b4b;--accent-border:#4c1d95;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
  .header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .header-left{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
  .title{font-size:16px;font-weight:700}
  .subtitle{font-size:12px;color:var(--fg2)}
  .btn-theme{background:none;border:1px solid var(--border2);border-radius:6px;color:var(--fg2);cursor:pointer;font-size:14px;padding:4px 8px}
  .btn-theme:hover{background:var(--bg3)}
  .body{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 73px)}
  @media(max-width:800px){.body{grid-template-columns:1fr}}
  .left{padding:20px 24px;border-right:1px solid var(--border)}
  .right{padding:20px 24px}
  .sec{font-size:11px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:16px}
  .sec:first-child{margin-top:0}
  label{font-size:12px;color:var(--fg2);font-weight:500;display:block;margin-bottom:4px}
  input[type=text],input[type=number],select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:12px;padding:6px 10px;outline:none;font-family:inherit}
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
  textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:12px;padding:12px;resize:vertical;outline:none;line-height:1.6}
  textarea:focus{border-color:var(--accent)}
  textarea::placeholder{color:var(--fg3)}
  .btn{border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{opacity:.88}
  .btn-secondary{background:var(--bg3);border:1px solid var(--border2);color:var(--fg2)}
  .btn-secondary:hover{background:var(--bg2)}
  .btn-sm{font-size:11px;padding:4px 10px;font-weight:500}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* periods config */
  .period-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border)}
  .period-item:last-child{border-bottom:none}
  .period-badge{background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 7px;min-width:50px;text-align:center}
  .period-order{font-size:11px;color:var(--fg2);min-width:28px;text-align:right}
  /* kpi */
  .kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex:1;min-width:70px}
  .kpi-val{font-size:18px;font-weight:700;line-height:1}
  .kpi-lbl{font-size:10px;color:var(--fg2);margin-top:2px}
  .kpi.purple .kpi-val{color:var(--accent)}
  /* timeline */
  .tl-wrap{overflow-x:auto}
  .tl-grid{display:grid;min-width:600px}
  .tl-head{display:flex;border-bottom:2px solid var(--border);padding-bottom:6px;margin-bottom:4px}
  .tl-head-label{font-size:11px;font-weight:700;color:var(--fg3);min-width:140px;flex-shrink:0}
  .tl-head-cell{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--fg2);padding:0 4px;min-width:80px}
  .tl-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:36px}
  .tl-row:last-child{border-bottom:none}
  .tl-label{min-width:140px;flex-shrink:0;font-size:12px;color:var(--fg);font-weight:500;padding:4px 8px 4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-cell{flex:1;padding:3px 4px;min-width:80px;text-align:center}
  .tl-bubble{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px;cursor:default;white-space:nowrap}
  .tl-bubble:hover{opacity:.85}
  /* nc list */
  .nc-list{margin-top:12px}
  .nc-chip{display:inline-block;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 7px;margin:2px;cursor:pointer}
  .nc-chip:hover{border-color:var(--accent)}
  /* detail panel */
  .detail-panel{position:fixed;bottom:16px;right:16px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:16px;min-width:280px;max-width:380px;max-height:60vh;overflow-y:auto;z-index:100;display:none}
  .detail-panel.open{display:block}
  .detail-close{float:right;background:none;border:none;color:var(--fg3);cursor:pointer;font-size:16px;line-height:1}
  .detail-close:hover{color:var(--fg)}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:999}
  #toast.show{opacity:1}
</style>

<div class="header">
  <div class="header-left">
    <div class="logo">📅</div>
    <div>
      <div class="title">NC Timeline</div>
      <div class="subtitle">Mapeia NCs por período — extrai o segmento de data/fase e monta linha do tempo</div>
    </div>
  </div>
  <button class="btn-theme" onclick="toggleTheme()">◑</button>
</div>

<div class="body">
  <!-- LEFT: config -->
  <div class="left">
    <div class="sec">Configuração</div>
    <div class="row2" style="margin-bottom:8px">
      <div>
        <label>Separador</label>
        <input id="cfgSep" type="text" value="_" maxlength="3" style="font-family:'JetBrains Mono',monospace">
      </div>
      <div>
        <label>Posição do período</label>
        <input id="cfgPos" type="number" min="1" max="12" value="5" title="Qual posição (1-based) contém o período?">
      </div>
    </div>
    <div class="row2" style="margin-bottom:8px">
      <div>
        <label>Posição do grupo (linha)</label>
        <input id="cfgGroup" type="number" min="1" max="12" value="2" title="Qual posição agrupa as linhas do grid?">
      </div>
      <div>
        <label>Posição do tipo (cor)</label>
        <input id="cfgColor" type="number" min="0" max="12" value="1" title="Qual posição define a cor (0 = sem cor)">
      </div>
    </div>

    <div class="sec" style="margin-top:14px">Ordem dos Períodos</div>
    <p style="font-size:11px;color:var(--fg2);margin-bottom:8px">Os períodos detectados aparecerão aqui. Arraste ou reordene para definir a sequência do eixo X.</p>
    <div id="periodList" style="min-height:40px;border:1px dashed var(--border);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--fg3)">
      Períodos detectados aparecerão aqui após analisar.
    </div>

    <div class="sec" style="margin-top:14px">NCs</div>
    <label>Cole NCs (uma por linha)</label>
    <textarea id="ncInput" rows="10" placeholder="camp_perf_app_venda_q1_stories&#10;camp_brand_web_lanc_q2_feed&#10;camp_perf_app_desc_q1_reels&#10;camp_brand_app_lanc_q3_stories&#10;camp_perf_web_venda_q2_feed&#10;..."></textarea>

    <div class="actions">
      <button class="btn btn-primary" onclick="analyze()">📊 Montar Timeline</button>
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">↓ CSV</button>
    </div>
  </div>

  <!-- RIGHT: timeline -->
  <div class="right">
    <div id="kpiRow" class="kpi-row" style="display:none"></div>
    <div id="timelineWrap"></div>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">×</button>
  <div id="detailContent"></div>
</div>
<div id="toast"></div>

<script>
const COLORS = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
let periods = [];   // ordered list of period strings
let rows = [];      // { group, period, ncs:[], colorKey }
let allNCs = [];

function analyze() {
  const raw = document.getElementById('ncInput').value.trim();
  if (!raw) { showToast('Cole NCs!'); return; }
  const sep = document.getElementById('cfgSep').value || '_';
  const posP = (parseInt(document.getElementById('cfgPos').value) || 5) - 1;
  const posG = (parseInt(document.getElementById('cfgGroup').value) || 2) - 1;
  const posC = (parseInt(document.getElementById('cfgColor').value) || 1) - 1;

  allNCs = raw.split('\n').map(l=>l.trim()).filter(Boolean);

  // Build cell map: group → period → {ncs, colorKey}
  const cellMap = {}; // group → period → {ncs:[], colorKey}
  const periodsSet = new Set();
  const groupsSet = new Set();

  allNCs.forEach(nc => {
    const segs = nc.split(sep);
    const p = segs[posP] || '(sem período)';
    const g = segs[posG] || '(sem grupo)';
    const c = posC >= 0 ? (segs[posC] || '') : '';
    periodsSet.add(p);
    groupsSet.add(g);
    if (!cellMap[g]) cellMap[g] = {};
    if (!cellMap[g][p]) cellMap[g][p] = { ncs: [], colorKey: c };
    cellMap[g][p].ncs.push(nc);
  });

  // Keep existing period order if already set, else sort
  const detected = [...periodsSet];
  const existing = periods.filter(p => periodsSet.has(p));
  const newOnes = detected.filter(p => !periods.includes(p));
  periods = [...existing, ...newOnes];

  renderPeriodList();
  renderTimeline(cellMap, [...groupsSet]);
  renderKPIs(allNCs.length, periods.length, groupsSet.size);
  document.getElementById('kpiRow').style.display = 'flex';
}

function renderPeriodList() {
  const container = document.getElementById('periodList');
  if (!periods.length) { container.textContent = 'Nenhum período detectado.'; return; }
  container.innerHTML = '';
  periods.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'period-item';
    item.innerHTML = `
      <div style="display:flex;gap:4px">
        <button onclick="movePeriod(${i},-1)" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--fg2)">↑</button>
        <button onclick="movePeriod(${i},1)" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--fg2)">↓</button>
      </div>
      <span class="period-badge">${esc(p)}</span>
      <span class="period-order" style="flex:1;text-align:left;padding-left:6px;font-size:10px;color:var(--fg3)">pos ${i+1}</span>
    `;
    container.appendChild(item);
  });
}

function movePeriod(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= periods.length) return;
  [periods[idx], periods[newIdx]] = [periods[newIdx], periods[idx]];
  renderPeriodList();
  // Re-render timeline without re-analyzing
  document.getElementById('timelineWrap').innerHTML = '';
  document.getElementById('kpiRow').style.display = 'none';
  analyze();
}

function renderKPIs(total, numP, numG) {
  const el = document.getElementById('kpiRow');
  el.innerHTML = `
    <div class="kpi purple"><div class="kpi-val">${total}</div><div class="kpi-lbl">NCs</div></div>
    <div class="kpi"><div class="kpi-val">${numP}</div><div class="kpi-lbl">períodos</div></div>
    <div class="kpi"><div class="kpi-val">${numG}</div><div class="kpi-lbl">grupos (linhas)</div></div>
  `;
}

function renderTimeline(cellMap, groups) {
  const colorMap = {}; // colorKey → color var index
  let colorIdx = 0;

  const wrap = document.getElementById('timelineWrap');
  wrap.innerHTML = '';

  // Header
  const head = document.createElement('div');
  head.className = 'tl-wrap';
  let headHTML = `<div class="tl-grid">
    <div class="tl-head">
      <span class="tl-head-label">Grupo</span>`;
  periods.forEach(p => {
    headHTML += `<span class="tl-head-cell">${esc(p)}</span>`;
  });
  headHTML += `</div>`;

  // Rows
  groups.sort().forEach(g => {
    headHTML += `<div class="tl-row">
      <span class="tl-label" title="${esc(g)}">${esc(g)}</span>`;
    periods.forEach(p => {
      const cell = cellMap[g] && cellMap[g][p];
      headHTML += `<div class="tl-cell">`;
      if (cell) {
        const ck = cell.colorKey;
        if (ck && !(ck in colorMap)) colorMap[ck] = colorIdx++ % 8;
        const colorVar = ck ? COLORS[colorMap[ck]] : '--accent';
        const count = cell.ncs.length;
        const label = count > 1 ? `${count} NCs` : esc(cell.ncs[0].length > 14 ? cell.ncs[0].slice(0,12)+'…' : cell.ncs[0]);
        headHTML += `<span class="tl-bubble" style="background:var(${colorVar})" onclick="showDetail('${esc(g)}','${esc(p)}',${JSON.stringify(cell.ncs).replace(/</g,'\\u003c')})">${label}</span>`;
      }
      headHTML += `</div>`;
    });
    headHTML += `</div>`;
  });
  headHTML += `</div>`;
  head.innerHTML = headHTML;
  wrap.appendChild(head);
}

function showDetail(group, period, ncs) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');
  content.innerHTML = `
    <div style="font-weight:700;margin-bottom:4px;padding-right:24px">${esc(group)} · ${esc(period)}</div>
    <div style="font-size:11px;color:var(--fg2);margin-bottom:10px">${ncs.length} NC${ncs.length>1?'s':''}</div>
    <div class="nc-list">
      ${ncs.map(nc=>`<span class="nc-chip" onclick="copyNC('${esc(nc)}')" title="Clique para copiar">${esc(nc)}</span>`).join('')}
    </div>
  `;
  panel.classList.add('open');
}

function copyNC(nc) {
  navigator.clipboard.writeText(nc).then(()=>showToast('Copiado!')).catch(()=>showToast(nc));
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
}

function exportCSV() {
  if (!allNCs.length) { showToast('Analise primeiro!'); return; }
  const sep = document.getElementById('cfgSep').value || '_';
  const posP = (parseInt(document.getElementById('cfgPos').value) || 5) - 1;
  const posG = (parseInt(document.getElementById('cfgGroup').value) || 2) - 1;

  const rows = [['nc','grupo','periodo','num_segmentos']];
  allNCs.forEach(nc => {
    const segs = nc.split(sep);
    rows.push([nc, segs[posG]||'', segs[posP]||'', segs.length]);
  });

  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'nc-timeline.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exportado!');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');}
</script>
