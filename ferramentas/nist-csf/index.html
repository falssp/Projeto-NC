<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIST CSF 2.0 — Referência</title>
<style>
  :root {
    --govern:   #0f766e;
    --identify: #1F36C7;
    --protect:  #7c3aed;
    --detect:   #d97706;
    --respond:  #dc2626;
    --recover:  #16a34a;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%); color: #fff; padding: 2rem 1.5rem 1.5rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header p  { opacity: .85; margin-top: .4rem; font-size: .95rem; }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; padding: 1.25rem 1.5rem; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .controls input { flex: 1; min-width: 200px; padding: .55rem .9rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; }
  .controls input:focus { outline: 2px solid var(--govern); border-color: transparent; }

  .filter-btn { padding: .45rem .9rem; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font-size: .82rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .filter-btn:hover { border-color: #94a3b8; }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-cat="all"].active    { background: #334155; }
  .filter-btn[data-cat="govern"].active   { background: var(--govern); }
  .filter-btn[data-cat="identify"].active { background: var(--identify); }
  .filter-btn[data-cat="protect"].active  { background: var(--protect); }
  .filter-btn[data-cat="detect"].active   { background: var(--detect); }
  .filter-btn[data-cat="respond"].active  { background: var(--respond); }
  .filter-btn[data-cat="recover"].active  { background: var(--recover); }

  main { width: 100%; box-sizing: border-box; padding: 1.5rem 3rem; }

  .letter-group { margin-bottom: 2rem; }
  .letter-anchor { font-size: 1.3rem; font-weight: 700; color: var(--muted); margin-bottom: .75rem; padding-bottom: .3rem; border-bottom: 2px solid var(--border); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .65rem; border-left: 4px solid #94a3b8; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .card[data-cat="govern"]   { border-left-color: var(--govern); }
  .card[data-cat="identify"] { border-left-color: var(--identify); }
  .card[data-cat="protect"]  { border-left-color: var(--protect); }
  .card[data-cat="detect"]   { border-left-color: var(--detect); }
  .card[data-cat="respond"]  { border-left-color: var(--respond); }
  .card[data-cat="recover"]  { border-left-color: var(--recover); }

  .card-header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
  .card-name   { font-size: 1rem; font-weight: 700; }
  .card-acronym { font-size: .82rem; color: var(--muted); font-weight: 400; }
  .card-tag    { font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; color: #fff; margin-left: auto; white-space: nowrap; }
  .card[data-cat="govern"]   .card-tag { background: var(--govern); }
  .card[data-cat="identify"] .card-tag { background: var(--identify); }
  .card[data-cat="protect"]  .card-tag { background: var(--protect); }
  .card[data-cat="detect"]   .card-tag { background: var(--detect); }
  .card[data-cat="respond"]  .card-tag { background: var(--respond); }
  .card[data-cat="recover"]  .card-tag { background: var(--recover); }

  .card-def  { font-size: .88rem; color: #334155; line-height: 1.55; }
  .card-aka  { font-size: .78rem; color: var(--muted); margin-top: .35rem; }
  .card-aka span { font-style: italic; }

  .az-bar { display: flex; flex-wrap: wrap; gap: .3rem; padding: 1rem 1.5rem .5rem; }
  .az-btn { font-size: .78rem; font-weight: 600; padding: .2rem .5rem; border-radius: 5px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--muted); text-decoration: none; transition: all .12s; }
  .az-btn:hover { background: var(--govern); color: #fff; border-color: transparent; }

  #empty { display: none; text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .count { font-size: .82rem; color: var(--muted); padding: 0 1.5rem .5rem; }

  .new-badge { font-size: .65rem; font-weight: 700; background: #fef3c7; color: #92400e; padding: .1rem .4rem; border-radius: 999px; border: 1px solid #fcd34d; margin-left: .3rem; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1>🔒 NIST CSF 2.0 — Referência</h1>
  <p>NIST Cybersecurity Framework 2.0 · 6 Funções · Categorias e Subcategorias</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="govern">GV — Govern <span class="new-badge">novo v2</span></button>
  <button class="filter-btn" data-cat="identify">ID — Identify</button>
  <button class="filter-btn" data-cat="protect">PR — Protect</button>
  <button class="filter-btn" data-cat="detect">DE — Detect</button>
  <button class="filter-btn" data-cat="respond">RS — Respond</button>
  <button class="filter-btn" data-cat="recover">RC — Recover</button>
</div>

<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>

<script>
const CAT_LABELS = {
  govern:   "GV — Govern",
  identify: "ID — Identify",
  protect:  "PR — Protect",
  detect:   "DE — Detect",
  respond:  "RS — Respond",
  recover:  "RC — Recover",
};

const TERMS = [
  // ── GOVERN (nova função em v2.0) ─────────────────────────────────────────
  { name: "NIST CSF 2.0", acronym: "Cybersecurity Framework 2.0", cat: "govern", def: "Revisão do NIST Cybersecurity Framework publicada em fevereiro de 2024. Principal novidade: adição da função Govern (GV) como função central que orienta todas as demais. Escopo ampliado para organizações de qualquer setor — não mais apenas infraestruturas críticas. Versão anterior: CSF 1.1 (2018).", aka: "CSF 2.0 · Framework de Cibersegurança NIST" },
  { name: "Govern — GV", acronym: "GV", cat: "govern", def: "Nova função do CSF 2.0. Estabelece e monitora a estratégia, expectativas e política de cibersegurança da organização. Responde às perguntas: o que a organização prioriza, quem é responsável, e como as decisões de cibersegurança são tomadas. É a função que orienta todas as demais.", aka: "Governar · GV" },
  { name: "GV.OC — Contexto Organizacional", acronym: "GV.OC", cat: "govern", def: "Categoria do Govern: as circunstâncias — missão, partes interessadas, dependências, requisitos legais e regulatórios — que influenciam as decisões de cibersegurança são entendidas.", aka: "Organizational Context" },
  { name: "GV.RM — Estratégia de Gestão de Risco", acronym: "GV.RM", cat: "govern", def: "Categoria do Govern: as prioridades, restrições, tolerâncias a risco e premissas da organização são estabelecidas, comunicadas e usadas para apoiar decisões operacionais de risco.", aka: "Risk Management Strategy" },
  { name: "GV.RR — Funções, Responsabilidades e Autoridades", acronym: "GV.RR", cat: "govern", def: "Categoria do Govern: papéis, responsabilidades e autoridades de cibersegurança são estabelecidos para fomentar accountability, avaliação de desempenho e melhoria contínua.", aka: "Roles, Responsibilities and Authorities" },
  { name: "GV.PO — Políticas", acronym: "GV.PO", cat: "govern", def: "Categoria do Govern: políticas de cibersegurança são estabelecidas, comunicadas e aplicadas.", aka: "Policy" },
  { name: "GV.OV — Supervisão", acronym: "GV.OV", cat: "govern", def: "Categoria do Govern: resultados das atividades de gestão de risco de cibersegurança são usados para informar e ajustar a estratégia, com supervisão da liderança.", aka: "Oversight" },
  { name: "GV.SC — Gestão de Risco da Cadeia de Suprimentos", acronym: "GV.SC", cat: "govern", def: "Categoria do Govern: processos de gestão de risco de cibersegurança da cadeia de suprimentos são identificados, estabelecidos, gerenciados, monitorados e melhorados pela liderança.", aka: "Cybersecurity Supply Chain Risk Management" },

  // ── IDENTIFY ─────────────────────────────────────────────────────────────
  { name: "Identify — ID", acronym: "ID", cat: "identify", def: "Função do CSF que trata de desenvolver entendimento organizacional para gerenciar risco de cibersegurança em sistemas, pessoas, ativos, dados e capacidades. Compreender o contexto de negócio, recursos que suportam funções críticas e os riscos relacionados permite que a organização foque e priorize seus esforços.", aka: "Identificar" },
  { name: "ID.AM — Gestão de Ativos", acronym: "ID.AM", cat: "identify", def: "Categoria do Identify: ativos (dados, hardware, software, sistemas, instalações, serviços e pessoal) que permitem à organização atingir seus objetivos são identificados e gerenciados de acordo com sua importância relativa aos objetivos de negócio e à estratégia de risco.", aka: "Asset Management" },
  { name: "ID.RA — Avaliação de Risco", acronym: "ID.RA", cat: "identify", def: "Categoria do Identify: a organização entende o risco de cibersegurança para operações, ativos e pessoas. Inclui identificação de ameaças e vulnerabilidades, determinação de probabilidade e impacto.", aka: "Risk Assessment" },
  { name: "ID.IM — Melhoria", acronym: "ID.IM", cat: "identify", def: "Nova categoria em CSF 2.0 (antes parte de outras funções): melhorias para as atividades de cibersegurança da organização são identificadas com base em lições aprendidas e medidas de desempenho.", aka: "Improvement" },

  // ── PROTECT ──────────────────────────────────────────────────────────────
  { name: "Protect — PR", acronym: "PR", cat: "protect", def: "Função do CSF que cobre salvaguardas para limitar ou conter o impacto de um evento de cibersegurança. Suporta a capacidade de entregar serviços críticos mesmo sob ataque ou incidente.", aka: "Proteger" },
  { name: "PR.AA — Autenticação e Controle de Acesso", acronym: "PR.AA", cat: "protect", def: "Categoria do Protect (renomeada em v2.0, era PR.AC): acesso a ativos físicos e lógicos e facilidades associadas é limitado a usuários, processos e dispositivos autorizados, e é gerenciado de acordo com o risco avaliado de acesso não autorizado.", aka: "Identity Management, Authentication and Access Control" },
  { name: "PR.AT — Consciência e Treinamento", acronym: "PR.AT", cat: "protect", def: "Categoria do Protect: a organização fornece treinamento de conscientização em cibersegurança para garantir que todos estejam adequadamente treinados para realizar suas responsabilidades.", aka: "Awareness and Training" },
  { name: "PR.DS — Segurança de Dados", acronym: "PR.DS", cat: "protect", def: "Categoria do Protect: informações e registros (dados) são gerenciados de acordo com a estratégia de risco da organização para proteger a confidencialidade, integridade e disponibilidade da informação.", aka: "Data Security" },
  { name: "PR.PS — Processos e Procedimentos de Segurança da Plataforma", acronym: "PR.PS", cat: "protect", def: "Categoria do Protect (reestruturada em v2.0): políticas, processos, procedimentos e acordos de segurança são mantidos e usados para gerenciar a proteção de sistemas de informação e ativos.", aka: "Platform Security" },
  { name: "PR.IR — Resiliência da Infraestrutura", acronym: "PR.IR", cat: "protect", def: "Nova categoria em CSF 2.0: arquiteturas de segurança são gerenciadas com conceitos de defense-in-depth, aplicando proteções com resiliência adequada ao nível de risco.", aka: "Technology Infrastructure Resilience" },

  // ── DETECT ───────────────────────────────────────────────────────────────
  { name: "Detect — DE", acronym: "DE", cat: "detect", def: "Função do CSF que permite descoberta oportuna de eventos de cibersegurança. Suporta a capacidade de descobrir anomalias, eventos e indicadores de comprometimento antes que se tornem incidentes completos.", aka: "Detectar" },
  { name: "DE.CM — Monitoramento Contínuo", acronym: "DE.CM", cat: "detect", def: "Categoria do Detect: o sistema de informação e os ativos são monitorados para identificar eventos de cibersegurança e verificar a eficácia de medidas de proteção. Inclui redes, ambiente físico, pessoal e provedores de serviços externos.", aka: "Continuous Monitoring" },
  { name: "DE.AE — Análise de Eventos Adversos", acronym: "DE.AE", cat: "detect", def: "Categoria do Detect (reestruturada em v2.0): anomalias e eventos são detectados e seu potencial impacto é entendido. Dados de múltiplas fontes são correlacionados e analisados.", aka: "Adverse Event Analysis" },

  // ── RESPOND ──────────────────────────────────────────────────────────────
  { name: "Respond — RS", acronym: "RS", cat: "respond", def: "Função do CSF que cobre atividades para conter o impacto de um incidente de cibersegurança detectado. Suporta a capacidade de conter o impacto de incidentes potenciais.", aka: "Responder" },
  { name: "RS.MA — Gestão de Incidentes", acronym: "RS.MA", cat: "respond", def: "Categoria do Respond: respostas a incidentes detectados são gerenciadas. Inclui coordenação com partes internas e externas conforme apropriado.", aka: "Incident Management" },
  { name: "RS.AN — Análise de Incidentes", acronym: "RS.AN", cat: "respond", def: "Categoria do Respond: investigações são conduzidas para garantir resposta efetiva e suportar atividades forenses e recuperação. Análise de causa raiz, impacto e IOCs.", aka: "Incident Analysis" },
  { name: "RS.CO — Comunicação de Resposta a Incidentes", acronym: "RS.CO", cat: "respond", def: "Categoria do Respond: atividades de resposta são coordenadas com partes interessadas internas e externas conforme exigido por planos de resposta e políticas.", aka: "Incident Response Reporting and Communication" },
  { name: "RS.MI — Mitigação de Incidentes", acronym: "RS.MI", cat: "respond", def: "Categoria do Respond: atividades são realizadas para prevenir expansão de um evento, mitigar seus efeitos e resolver o incidente.", aka: "Incident Mitigation" },

  // ── RECOVER ──────────────────────────────────────────────────────────────
  { name: "Recover — RC", acronym: "RC", cat: "recover", def: "Função do CSF que cobre atividades para manter planos de resiliência e restaurar capacidades ou serviços que foram prejudicados por um incidente de cibersegurança. Suporta recuperação oportuna para operações normais.", aka: "Recuperar" },
  { name: "RC.RP — Execução do Plano de Recuperação", acronym: "RC.RP", cat: "recover", def: "Categoria do Recover: planos de recuperação são executados durante ou após um incidente de cibersegurança.", aka: "Incident Recovery Plan Execution" },
  { name: "RC.CO — Comunicação de Recuperação", acronym: "RC.CO", cat: "recover", def: "Categoria do Recover: atividades de restauração são coordenadas com partes internas e externas como centros de coordenação, provedores de internet, fornecedores de sistemas atacados, vítimas, outros CSIRTs e fornecedores.", aka: "Incident Recovery Communication" },

  // ── Conceitos transversais ────────────────────────────────────────────────
  { name: "Perfil do CSF", acronym: "CSF Profile", cat: "govern", def: "Alinhamento das funções, categorias e subcategorias do CSF com os requisitos de negócio, tolerância a risco e recursos da organização. Um Perfil Alvo representa o estado desejado de cibersegurança; um Perfil Atual representa o estado presente. A lacuna entre os dois orienta o plano de ação.", aka: "Framework Profile" },
  { name: "Tier do CSF", acronym: "CSF Tier", cat: "govern", def: "Nível de sofisticação das práticas de gestão de risco de cibersegurança da organização. Vai de Tier 1 (Partial — informal, ad-hoc) até Tier 4 (Adaptive — adaptativo, preditivo, proativo). Os Tiers não são níveis de maturidade a serem progredidos obrigatoriamente.", aka: "Implementation Tier · Nível de Implementação" },
  { name: "Subcategoria do CSF", acronym: "", cat: "govern", def: "Nível mais granular do CSF. Declarações de resultado específicas e orientadas a resultados (ex: 'ID.AM-01: Inventários de hardware gerenciados pela organização são mantidos'). O CSF 2.0 possui mais de 100 subcategorias organizadas em 6 funções e 22 categorias.", aka: "Subcategory" },
  { name: "Implementação de Referência do CSF", acronym: "CSF Reference Implementation", cat: "govern", def: "Guias práticos publicados pelo NIST com exemplos de como implementar as categorias e subcategorias do CSF em contextos específicos (ex: pequenas empresas, setor de saúde, manufatura). Substituem os antigos guias de implementação do CSF 1.1.", aka: "CSF Implementation Guide" },
  { name: "TPCRM", acronym: "Third-Party Cybersecurity Risk Management", cat: "govern", def: "Gestão de risco de cibersegurança de terceiros na cadeia de suprimentos. No CSF 2.0, ganhou destaque como categoria própria dentro de Govern (GV.SC), refletindo a crescente importância dos riscos de cadeia de suprimentos (ataques como SolarWinds, Log4Shell).", aka: "C-SCRM · Gestão de Risco de Terceiros" },
  { name: "IOC", acronym: "Indicator of Compromise", cat: "detect", def: "Evidência forense de que um sistema foi potencialmente comprometido. Pode ser um endereço IP malicioso, hash de arquivo, domínio, URL, padrão de tráfego de rede ou comportamento anômalo de processo. Usados em DE.AE para detectar e correlacionar atividades suspeitas.", aka: "Indicador de Comprometimento" },
  { name: "Plano de Resposta a Incidentes", acronym: "IRP", cat: "respond", def: "Documento que define papéis, responsabilidades, processos e procedimentos para responder a incidentes de cibersegurança. Elemento central da categoria RS.MA. Deve ser testado periodicamente com tabletop exercises e simulações.", aka: "Incident Response Plan · PRI" },
  { name: "RTO / RPO", acronym: "Recovery Time / Point Objective", cat: "recover", def: "RTO (Recovery Time Objective): tempo máximo aceitável para restaurar um serviço após interrupção. RPO (Recovery Point Objective): ponto no tempo até o qual dados devem ser recuperados. Métricas centrais de BC/DR que orientam a função Recover do CSF.", aka: "Objetivo de Tempo de Recuperação / Ponto de Recuperação" },
];

TERMS.sort((a,b) => a.name.localeCompare(b.name, 'pt'));

let currentCat = 'all';
let currentQ   = '';

function firstLetter(s) {
  const c = s.trim().toUpperCase()[0];
  return /[A-Z]/.test(c) ? c : '#';
}

function render() {
  const q   = currentQ.toLowerCase();
  const cat = currentCat;
  const filtered = TERMS.filter(t => {
    const matchCat = cat === 'all' || t.cat === cat;
    const matchQ   = !q ||
      t.name.toLowerCase().includes(q) ||
      (t.acronym||'').toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      (t.aka||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('count').textContent =
    `${filtered.length} termo${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const groups = {};
  filtered.forEach(t => {
    const l = firstLetter(t.name);
    if (!groups[l]) groups[l] = [];
    groups[l].push(t);
  });

  const letters = Object.keys(groups).sort();

  // AZ bar
  document.getElementById('azBar').innerHTML = letters.map(l =>
    `<a class="az-btn" href="#grp-${l}">${l}</a>`
  ).join('');

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  letters.forEach(l => {
    const grp = document.createElement('div');
    grp.className = 'letter-group';
    grp.id = `grp-${l}`;
    grp.innerHTML = `<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t => {
      const aka = t.aka ? `<div class="card-aka">Também: <span>${t.aka}</span></div>` : '';
      const acr = t.acronym ? `<span class="card-acronym">— ${t.acronym}</span>` : '';
      grp.innerHTML += `
        <div class="card" data-cat="${t.cat}">
          <div class="card-header">
            <span class="card-name">${t.name}</span>${acr}
            <span class="card-tag">${CAT_LABELS[t.cat]}</span>
          </div>
          <div class="card-def">${t.def}</div>
          ${aka}
        </div>`;
    });
    list.appendChild(grp);
  });
}

document.getElementById('search').addEventListener('input', e => {
  currentQ = e.target.value; render();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

render();
</script>
</body>
</html>
