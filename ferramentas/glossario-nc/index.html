<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glossário NC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc; --fg:#0f172a; --card:#fff; --accent:#2563eb; --accent-soft:rgba(37,99,235,.08);
  --border:#e2e8f0; --faint:#64748b; --pill:#f1f5f9; --pill-fg:#334155;
  --ok:#22c55e; --warn:#f59e0b; --erro:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --mono:'JetBrains Mono',monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f172a; --fg:#f1f5f9; --card:#1e293b; --accent:#60a5fa; --accent-soft:rgba(96,165,250,.1);
  --border:#334155; --faint:#94a3b8; --pill:#1e293b; --pill-fg:#cbd5e1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f172a; --fg:#f1f5f9; --card:#1e293b; --accent:#60a5fa; --accent-soft:rgba(96,165,250,.1);
  --border:#334155; --faint:#94a3b8; --pill:#1e293b; --pill-fg:#cbd5e1;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo{font-size:20px;}
.header-title{font-size:16px;font-weight:800;letter-spacing:-.03em;}
.header-sub{font-size:11px;color:var(--faint);}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
/* Controls */
select,input[type=text]{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--fg);font-size:12px;font-family:inherit;}
select:focus,input:focus{outline:2px solid var(--accent);border-color:transparent;}
.search-wrap{position:relative;}
.search-wrap input{padding-left:28px;width:200px;}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;color:var(--faint);}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s;}
.btn:hover{background:var(--pill);}
.btn.active{background:var(--accent);color:#fff;border-color:transparent;}
/* Main layout */
.main{max-width:1200px;margin:0 auto;padding:20px;}
/* Seg tabs */
.seg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.seg-tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--faint);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.seg-tab:hover{border-color:var(--accent);color:var(--accent);}
.seg-tab.active{background:var(--accent);color:#fff;border-color:transparent;}
.seg-tab .tab-count{font-size:10px;padding:1px 5px;border-radius:9px;background:rgba(255,255,255,.25);font-weight:700;}
.seg-tab:not(.active) .tab-count{background:var(--border);color:var(--faint);}
/* Alpha index */
.alpha-bar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px;}
.alpha-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.alpha-btn:hover,.alpha-btn.active{background:var(--accent);color:#fff;border-color:transparent;}
.alpha-btn.empty{opacity:.35;cursor:default;pointer-events:none;}
/* Table view */
.gloss-table{width:100%;border-collapse:collapse;font-size:13px;}
.gloss-table th{text-align:left;padding:7px 12px;background:var(--pill);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);border-bottom:2px solid var(--border);position:sticky;top:52px;}
.gloss-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.gloss-table tr:last-child td{border-bottom:none;}
.gloss-table tr:hover td{background:var(--accent-soft);}
.term-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);}
.term-label{font-weight:500;}
.term-desc{color:var(--faint);font-size:12px;}
.seg-badge{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
.fav-star{font-size:11px;}
.uses-badge{font-size:10px;padding:1px 5px;border-radius:9px;background:var(--pill);color:var(--faint);font-weight:600;}
/* Card view */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.term-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:default;transition:box-shadow .15s;}
.term-card:hover{box-shadow:var(--shadow-lg);}
.term-card-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px;}
.term-card-label{font-size:12px;font-weight:500;margin-bottom:4px;}
.term-card-desc{font-size:11px;color:var(--faint);line-height:1.5;}
.term-card-footer{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
/* Alpha section header */
.alpha-section{margin-bottom:24px;}
.alpha-heading{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding:4px 0 8px;border-bottom:2px solid var(--accent);margin-bottom:12px;}
/* Stats bar */
.stats-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.stat{text-align:center;}
.stat-num{font-size:22px;font-weight:800;color:var(--accent);line-height:1;}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-top:2px;}
/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--faint);}
.empty-icon{font-size:48px;margin-bottom:12px;}
/* Tag chip */
.tag-chip{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#f1f5f9;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Copy btn */
.copy-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:5px;color:var(--faint);opacity:0;transition:opacity .15s;}
.gloss-table tr:hover .copy-btn,.term-card:hover .copy-btn{opacity:1;}
.copy-btn:hover{background:var(--pill);color:var(--fg);}
/* No data */
.no-data{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px;}
/* Loading */
.loading{padding:60px 20px;text-align:center;color:var(--faint);}
@media(max-width:600px){
  .header{padding:10px 14px;}
  .search-wrap input{width:140px;}
  .main{padding:12px;}
  .cards-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">📖</span>
    <div>
      <div class="header-title">Glossário NC</div>
      <div class="header-sub" id="headerSub">—</div>
    </div>
  </div>
  <div class="header-controls">
    <select id="clientSel" onchange="onClientChange()"><option value="">— selecionar cliente —</option></select>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar termo…" oninput="onSearch()">
    </div>
    <button class="btn" id="viewToggle" onclick="toggleView()" title="Alternar visualização">🗂 Cards</button>
    <button class="btn" id="favBtn" onclick="toggleFavOnly()" title="Mostrar apenas favoritos">⭐</button>
    <button class="btn" onclick="exportGlossaryCSV()" title="Exportar glossário como CSV">⬇ CSV</button>
    <button class="btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
  </div>
</div>

<div class="main">
  <div id="statsBar" class="stats-bar" style="display:none"></div>
  <div id="segTabs" class="seg-tabs"></div>
  <div id="alphaBar" class="alpha-bar" style="display:none"></div>
  <div id="gloss"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== STATE ===================== */
let _clients = [];
let _activeClientId = null;
let _activeSeg = '__all__'; // '__all__' or segId
let _searchQ = '';
let _viewMode = 'table'; // 'table' | 'cards'
let _favOnly = false;
let _alphaFilter = null; // null or letter
let _theme = null;

/* ===================== INIT ===================== */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function loadData(){
  try {
    const raw = localStorage.getItem('taxo_clients_v1');
    if(!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : (data.clients||[]);
  } catch(e){ return []; }
}

function getActiveId(){
  try{ return localStorage.getItem('taxo_active_v1')||null; }catch(e){return null;}
}

function init(){
  // Theme
  try{ _theme = localStorage.getItem('glossarionc_theme'); }catch(e){}
  if(_theme==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(_theme==='light') document.documentElement.setAttribute('data-theme','light');
  updateThemeBtn();

  _clients = loadData();
  const activeId = getActiveId();
  const sel = document.getElementById('clientSel');
  sel.innerHTML='<option value="">— selecionar cliente —</option>';

  if(!_clients.length){
    document.getElementById('gloss').innerHTML=`<div class="empty"><div class="empty-icon">📭</div><p>Nenhum dado encontrado.<br>Abra o <strong>Taxonomy Builder</strong> e cadastre um cliente.</p></div>`;
    return;
  }

  // Sort: pinned first, then by name
  const sorted = [..._clients].filter(c=>!c.archived).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(a.name||'').localeCompare(b.name||''));
  sorted.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if(c.id===activeId) opt.textContent+=' ✓';
    sel.appendChild(opt);
  });

  // Auto-select active client
  if(activeId && sorted.find(c=>c.id===activeId)){
    sel.value = activeId;
  } else if(sorted.length){
    sel.value = sorted[0].id;
  }
  onClientChange();

  // Sync storage changes from other tabs
  window.addEventListener('storage', e=>{
    if(e.key==='taxo_clients_v1'||e.key==='taxo_active_v1'){
      _clients=loadData();
      init();
    }
  });
}

function onClientChange(){
  const sel = document.getElementById('clientSel');
  _activeClientId = sel.value||null;
  _activeSeg = '__all__';
  _searchQ = '';
  _alphaFilter = null;
  document.getElementById('searchInput').value='';
  renderAll();
}

function getClient(){ return _clients.find(c=>c.id===_activeClientId)||null; }

/* ===================== RENDER ===================== */
function renderAll(){
  const c = getClient();
  if(!c){
    document.getElementById('statsBar').style.display='none';
    document.getElementById('segTabs').innerHTML='';
    document.getElementById('alphaBar').style.display='none';
    document.getElementById('gloss').innerHTML=`<div class="empty"><div class="empty-icon">👤</div><p>Selecione um cliente.</p></div>`;
    document.getElementById('headerSub').textContent='—';
    return;
  }

  const totalTerms = c.segments.reduce((a,s)=>a+(c.dictionary[s.id]||[]).length,0);
  const totalSegs = c.segments.length;
  const totalFav = c.segments.reduce((a,s)=>a+(c.dictionary[s.id]||[]).filter(t=>t.fav).length,0);
  document.getElementById('headerSub').textContent=`${c.name} · sep: ${c.separator||'_'} · ${totalTerms} termos · ${totalSegs} segmentos`;

  // Stats
  const statsEl = document.getElementById('statsBar');
  statsEl.style.display='flex';
  statsEl.innerHTML=`
    <div class="stat"><div class="stat-num">${totalSegs}</div><div class="stat-lbl">Segmentos</div></div>
    <div class="stat"><div class="stat-num">${totalTerms}</div><div class="stat-lbl">Termos</div></div>
    <div class="stat"><div class="stat-num">${totalFav}</div><div class="stat-lbl">Favoritos</div></div>
    <div class="stat"><div class="stat-num">${c.structures?.length||0}</div><div class="stat-lbl">Estruturas</div></div>
    <div class="stat"><div class="stat-num">${c.separator||'_'}</div><div class="stat-lbl">Separador</div></div>
  `;

  // Seg tabs
  renderSegTabs(c);
  // Alpha bar
  renderAlphaBar(c);
  // Content
  renderGloss(c);
}

function renderSegTabs(c){
  const el = document.getElementById('segTabs');
  el.innerHTML='';
  // "Todos" tab
  const allBtn = document.createElement('button');
  const totalAll = c.segments.reduce((a,s)=>a+(c.dictionary[s.id]||[]).length,0);
  allBtn.className='seg-tab'+(_activeSeg==='__all__'?' active':'');
  allBtn.innerHTML=`Todos <span class="tab-count">${totalAll}</span>`;
  allBtn.onclick=()=>{ _activeSeg='__all__'; _alphaFilter=null; renderAll(); };
  el.appendChild(allBtn);
  c.segments.forEach(s=>{
    const cnt=(c.dictionary[s.id]||[]).length;
    if(!cnt) return; // hide empty segments
    const btn=document.createElement('button');
    btn.className='seg-tab'+(_activeSeg===s.id?' active':'');
    btn.innerHTML=`${esc(s.label)} <span class="tab-count">${cnt}</span>`;
    btn.onclick=()=>{ _activeSeg=s.id; _alphaFilter=null; renderAll(); };
    el.appendChild(btn);
  });
}

function getFilteredTerms(c){
  let items = []; // {term, seg}
  const segs = _activeSeg==='__all__' ? c.segments : c.segments.filter(s=>s.id===_activeSeg);
  segs.forEach(s=>{
    (c.dictionary[s.id]||[]).forEach(t=>{
      items.push({term:t, seg:s});
    });
  });
  if(_favOnly) items=items.filter(x=>x.term.fav);
  if(_searchQ){
    const q=_searchQ.toLowerCase();
    items=items.filter(x=>
      x.term.value.toLowerCase().includes(q)||
      (x.term.label||'').toLowerCase().includes(q)||
      (x.term.desc||'').toLowerCase().includes(q)||
      x.seg.label.toLowerCase().includes(q)
    );
  }
  return items;
}

function renderAlphaBar(c){
  const el = document.getElementById('alphaBar');
  const items = getFilteredTerms(c);
  if(!items.length||_searchQ){ el.style.display='none'; return; }
  const lettersPresent = new Set(items.map(x=>x.term.value[0]?.toUpperCase()).filter(Boolean));
  const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  el.style.display='flex';
  el.innerHTML='<button class="alpha-btn'+(!_alphaFilter?' active':'')+'" onclick="_alphaFilter=null;renderAll()">∗</button>';
  for(const ch of alpha){
    const has=lettersPresent.has(ch);
    const btn=document.createElement('button');
    btn.className='alpha-btn'+(ch===_alphaFilter?' active':'')+(has?'':' empty');
    btn.textContent=ch;
    if(has) btn.onclick=()=>{ _alphaFilter=ch; renderAll(); };
    el.appendChild(btn);
  }
}

function renderGloss(c){
  const el = document.getElementById('gloss');
  let items = getFilteredTerms(c);
  if(_alphaFilter) items=items.filter(x=>x.term.value[0]?.toUpperCase()===_alphaFilter);
  if(!items.length){
    el.innerHTML=`<div class="no-data">Nenhum termo encontrado${_searchQ?` para "<strong>${esc(_searchQ)}</strong>"`:''}.</div>`;
    return;
  }
  // Sort alphabetically
  items.sort((a,b)=>a.term.value.localeCompare(b.term.value,'pt-BR',{sensitivity:'base'}));

  if(_viewMode==='cards') renderCards(el, items);
  else renderTable(el, items);
}

function renderTable(el, items){
  // Group by first letter for alpha sections
  const groups = {};
  items.forEach(x=>{
    const letter=(x.term.value[0]||'#').toUpperCase();
    if(!groups[letter]) groups[letter]=[];
    groups[letter].push(x);
  });
  const showAllSegs = _activeSeg==='__all__';
  let html=`<table class="gloss-table">
    <thead><tr>
      <th>Valor</th>
      <th>Label</th>
      <th>Descrição</th>
      ${showAllSegs?'<th>Segmento</th>':''}
      <th>Info</th>
      <th></th>
    </tr></thead><tbody>`;
  Object.keys(groups).sort().forEach(letter=>{
    if(!_searchQ&&!_alphaFilter) html+=`<tr><td colspan="${showAllSegs?6:5}" style="padding:12px 12px 4px;"><span class="alpha-heading">${esc(letter)}</span></td></tr>`;
    groups[letter].forEach(({term:t,seg:s})=>{
      const tagHtml = t.tag ? `<span class="tag-chip" style="background:rgba(37,99,235,.1);color:var(--accent)">${esc(t.tag)}</span>` : '';
      html+=`<tr>
        <td><span class="term-val">${esc(t.value)}</span></td>
        <td><span class="term-label">${esc(t.label||'—')}</span></td>
        <td><span class="term-desc">${esc(t.desc||'')}</span></td>
        ${showAllSegs?`<td><span class="seg-badge">${esc(s.label)}</span></td>`:''}
        <td style="white-space:nowrap;display:flex;gap:4px;align-items:center;flex-wrap:wrap">
          ${t.fav?`<span class="fav-star" title="Favorito">⭐</span>`:''}
          ${t.uses?`<span class="uses-badge" title="${t.uses} uso(s)">${t.uses}×</span>`:''}
          ${tagHtml}
        </td>
        <td><button class="copy-btn" title="Copiar valor" onclick="copyVal('${esc(t.value.replace(/'/g,"\\'"))}')">📋</button></td>
      </tr>`;
    });
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

function renderCards(el, items){
  const groups = {};
  items.forEach(x=>{
    const letter=(x.term.value[0]||'#').toUpperCase();
    if(!groups[letter]) groups[letter]=[];
    groups[letter].push(x);
  });
  const showAllSegs = _activeSeg==='__all__';
  let html='';
  Object.keys(groups).sort().forEach(letter=>{
    if(!_searchQ&&!_alphaFilter) html+=`<div class="alpha-section"><div class="alpha-heading">${esc(letter)}</div>`;
    html+='<div class="cards-grid">';
    groups[letter].forEach(({term:t,seg:s})=>{
      const tagHtml = t.tag ? `<span class="tag-chip" style="background:rgba(37,99,235,.1);color:var(--accent)">${esc(t.tag)}</span>` : '';
      html+=`<div class="term-card">
        <div class="term-card-val">${esc(t.value)}<button class="copy-btn" onclick="copyVal('${esc(t.value.replace(/'/g,"\\'"))}')">📋</button></div>
        ${t.label?`<div class="term-card-label">${esc(t.label)}</div>`:''}
        ${t.desc?`<div class="term-card-desc">${esc(t.desc)}</div>`:''}
        <div class="term-card-footer">
          ${showAllSegs?`<span class="seg-badge">${esc(s.label)}</span>`:''}
          ${t.fav?`<span class="fav-star">⭐</span>`:''}
          ${t.uses?`<span class="uses-badge">${t.uses}×</span>`:''}
          ${tagHtml}
        </div>
      </div>`;
    });
    html+='</div>';
    if(!_searchQ&&!_alphaFilter) html+='</div>';
  });
  el.innerHTML=html||'<div class="no-data">Nenhum termo.</div>';
}

/* ===================== ACTIONS ===================== */
function onSearch(){
  _searchQ = document.getElementById('searchInput').value.trim();
  _alphaFilter = null;
  renderAll();
}

function toggleView(){
  _viewMode = _viewMode==='table' ? 'cards' : 'table';
  document.getElementById('viewToggle').textContent = _viewMode==='table' ? '🗂 Cards' : '📋 Tabela';
  renderAll();
}

function toggleFavOnly(){
  _favOnly = !_favOnly;
  const btn = document.getElementById('favBtn');
  btn.classList.toggle('active', _favOnly);
  btn.title = _favOnly ? 'Mostrar todos' : 'Mostrar apenas favoritos';
  _alphaFilter=null;
  renderAll();
}

function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  if(!cur){
    const isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
    _theme = isDark ? 'light' : 'dark';
  } else {
    _theme = cur==='dark' ? 'light' : 'dark';
  }
  root.setAttribute('data-theme', _theme);
  try{ localStorage.setItem('glossarionc_theme', _theme); }catch(e){}
  updateThemeBtn();
}

function updateThemeBtn(){
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeBtn').textContent=isDark?'☀️':'🌙';
}

function copyVal(val){
  navigator.clipboard.writeText(val).then(()=>showToast(`📋 Copiado: ${val}`)).catch(()=>showToast(val));
}

function exportGlossaryCSV(){
  const c=getClient(); if(!c){showToast('Selecione um cliente primeiro');return;}
  const items=getFilteredTerms(c).sort((a,b)=>a.seg.label.localeCompare(b.seg.label)||a.term.value.localeCompare(b.term.value));
  const rows=[['segmento','valor','label','descricao','favorito','usos','tag']];
  items.forEach(({term:t,seg:s})=>{
    rows.push([s.label,t.value,t.label||'',t.desc||'',t.fav?'sim':'não',t.uses||0,t.tag||'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`glossario_${c.id}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`⬇ ${items.length} termos exportados`);
}

/* ===================== BOOT ===================== */
init();
</script>
</body>
