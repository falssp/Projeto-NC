<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO 27001:2022 — Referência</title>
<style>
  :root {
    --azul: #1F36C7;
    --azul-escuro: #1a237e;
    --azul-light: #e8ecfd;
    --cinza: #f4f5fb;
    --borda: #d6dbf2;
    --text: #1a1f3a;
    --text-muted: #6b7280;
    --white: #fff;
    --cat-isms: #1F36C7;
    --cat-isms-bg: #e8ecfd;
    --cat-clauses: #7c3aed;
    --cat-clauses-bg: #f3f0ff;
    --cat-annexa: #d97706;
    --cat-annexa-bg: #fffbeb;
    --cat-risk: #dc2626;
    --cat-risk-bg: #fef2f2;
    --cat-concepts: #374151;
    --cat-concepts-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cinza); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 100%);
    color: #fff; padding: 28px 40px 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

  .search-wrap { background: var(--azul-escuro); padding: 0 40px 28px; }
  .search-box { position: relative; max-width: 700px; }
  .search-box input {
    width: 100%; padding: 14px 20px 14px 48px; font-size: 1rem;
    border: none; border-radius: 10px; outline: none;
    background: rgba(255,255,255,0.12); color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.6); font-size: 1.1rem; pointer-events: none;
  }

  .filters-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 14px 40px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px;
    border-radius: 20px; border: 1.5px solid var(--borda);
    background: var(--white); color: var(--text-muted);
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--azul); color: var(--azul); }
  .filter-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .filter-btn[data-cat="isms"].active    { background: var(--cat-isms);    border-color: var(--cat-isms); }
  .filter-btn[data-cat="clauses"].active { background: var(--cat-clauses); border-color: var(--cat-clauses); }
  .filter-btn[data-cat="annexa"].active  { background: var(--cat-annexa);  border-color: var(--cat-annexa); }
  .filter-btn[data-cat="risk"].active    { background: var(--cat-risk);    border-color: var(--cat-risk); }
  .filter-btn[data-cat="concepts"].active { background: var(--cat-concepts); border-color: var(--cat-concepts); }
  .filters-right { margin-left: auto; font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }

  .az-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 8px 40px; display: flex; gap: 3px; flex-wrap: wrap;
  }
  .az-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    color: var(--azul); transition: all 0.15s; background: none; border: none; text-decoration: none;
  }
  .az-btn:hover { background: var(--azul-light); }
  .az-btn.disabled { color: var(--borda); cursor: default; }
  .az-btn.disabled:hover { background: none; }

  .content { padding: 30px 40px 60px; }
  .letter-section { margin-bottom: 36px; }
  .letter-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .letter-heading h2 { font-size: 1.6rem; font-weight: 800; color: var(--azul-escuro); min-width: 36px; }
  .letter-heading hr { flex: 1; border: none; border-top: 2px solid var(--borda); }
  .terms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .term-card {
    background: var(--white); border: 1.5px solid var(--borda);
    border-radius: 10px; padding: 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover { box-shadow: 0 2px 12px rgba(31,54,199,0.08); border-color: #b8c4f0; }
  .term-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .term-name { font-size: 0.97rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .term-acronym {
    font-size: 0.78rem; font-weight: 600; color: var(--azul);
    background: var(--azul-light); padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .term-def { font-size: 0.85rem; color: #374151; line-height: 1.55; margin-bottom: 8px; }
  .term-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
    border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
  }
  .cat-isms     { color: var(--cat-isms);    background: var(--cat-isms-bg); }
  .cat-clauses  { color: var(--cat-clauses); background: var(--cat-clauses-bg); }
  .cat-annexa   { color: var(--cat-annexa);  background: var(--cat-annexa-bg); }
  .cat-risk     { color: var(--cat-risk);    background: var(--cat-risk-bg); }
  .cat-concepts { color: var(--cat-concepts); background: var(--cat-concepts-bg); }
  .term-aka { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
</style>
</head>
<body>
<div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:.55rem 1.5rem;font-size:.8rem;color:#64748b"><a href="../governanca-ti/" style="color:#1F36C7;text-decoration:none;font-weight:600">← Hub de Governança de TI</a></div>
<header>
  <h1>🛡️ ISO 27001:2022 — Referência</h1>
  <p>Sistema de Gestão de Segurança da Informação, cláusulas, controles do Anexo A e gestão de risco</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar cláusula, controle ou conceito…" autocomplete="off">
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="isms">🔵 ISMS / Framework</button>
  <button class="filter-btn" data-cat="clauses">🟣 Cláusulas (4–10)</button>
  <button class="filter-btn" data-cat="annexa">🟠 Anexo A (Controles)</button>
  <button class="filter-btn" data-cat="risk">🔴 Gestão de Risco</button>
  <button class="filter-btn" data-cat="concepts">⚫ Conceitos</button>
  <div class="filters-right" id="countDisplay"></div>
</div>

<div class="az-bar" id="azBar"></div>
<div class="content" id="content"></div>

<script>
const TERMS = [
  // ISMS / FRAMEWORK
  { name: "ISO 27001:2022", acronym: "", cat: "isms", def: "Norma internacional para Sistemas de Gestão de Segurança da Informação (ISMS), publicada em outubro de 2022. Define requisitos para estabelecer, implementar, manter e melhorar continuamente um ISMS. Certificável por auditoria de terceira parte.", aka: "ISO/IEC 27001:2022" },
  { name: "ISO 27002", acronym: "", cat: "isms", def: "Guia de boas práticas para controles de segurança da informação. Referência de implementação para o Anexo A da ISO 27001: descreve como implementar cada controle, não é certificável por si só.", aka: "ISO/IEC 27002:2022" },
  { name: "ISO 27005", acronym: "", cat: "isms", def: "Norma de gestão de risco de segurança da informação. Fornece diretrizes para o processo de avaliação e tratamento de riscos compatível com a ISO 27001. Alinhada com ISO 31000.", aka: "ISO/IEC 27005:2022" },
  { name: "ISMS", acronym: "Information Security Management System", cat: "isms", def: "Sistema de Gestão de Segurança da Informação: conjunto de políticas, processos, procedimentos, estruturas e controles para proteger ativos de informação. Framework central da ISO 27001.", aka: "SGSI — Sistema de Gestão de Segurança da Informação" },
  { name: "PDCA no ISMS", acronym: "", cat: "isms", def: "Ciclo Plan-Do-Check-Act aplicado ao ISMS: Plan (definir escopo, política, objetivos, avaliação de risco); Do (implementar controles); Check (auditorias, monitoramento); Act (melhoria contínua). Base da estrutura da ISO 27001.", aka: "Ciclo PDCA" },
  { name: "Escopo do ISMS", acronym: "", cat: "isms", def: "Definição dos limites e aplicabilidade do sistema de gestão: quais áreas, processos, locais e tecnologias estão cobertos pela certificação. Determinado na Cláusula 4.3 da norma.", aka: "ISMS Scope" },

  // CLÁUSULAS
  { name: "Cláusula 4 — Contexto da Organização", acronym: "§4", cat: "clauses", def: "Requer que a organização identifique questões internas e externas, partes interessadas e seus requisitos, e defina o escopo do ISMS. Fundação para todo o sistema de gestão.", aka: "" },
  { name: "Cláusula 5 — Liderança", acronym: "§5", cat: "clauses", def: "Comprometimento da alta direção com o ISMS: estabelecer política de segurança, atribuir papéis e responsabilidades, e garantir que os objetivos estejam alinhados com a estratégia de negócios.", aka: "" },
  { name: "Cláusula 6 — Planejamento", acronym: "§6", cat: "clauses", def: "Requer avaliação de riscos e oportunidades, objetivos de segurança da informação mensuráveis e planos para alcançá-los. Inclui o processo formal de avaliação e tratamento de risco.", aka: "" },
  { name: "Cláusula 7 — Suporte", acronym: "§7", cat: "clauses", def: "Recursos, competências, conscientização, comunicação e informação documentada necessários para operação do ISMS. Inclui treinamento de equipe e gestão de documentos e registros.", aka: "" },
  { name: "Cláusula 8 — Operação", acronym: "§8", cat: "clauses", def: "Planejamento e controle operacional: implementação dos planos de tratamento de risco, gerenciamento de mudanças e controle de processos terceirizados relevantes para o ISMS.", aka: "" },
  { name: "Cláusula 9 — Avaliação de Desempenho", acronym: "§9", cat: "clauses", def: "Monitoramento, medição, análise e avaliação do ISMS: auditoria interna, revisão pela direção e métricas de desempenho. A revisão pela direção deve ocorrer em intervalos planejados.", aka: "" },
  { name: "Cláusula 10 — Melhoria", acronym: "§10", cat: "clauses", def: "Tratamento de não-conformidades, ações corretivas e melhoria contínua do ISMS. Requer identificação da causa raiz de não-conformidades e verificação da eficácia das ações tomadas.", aka: "" },

  // ANEXO A — CONTROLES (temas e controles relevantes)
  { name: "Controles Organizacionais (Tema 5)", acronym: "", cat: "annexa", def: "37 controles do Anexo A relativos à organização: políticas de segurança, papéis e responsabilidades, gestão de ativos, classificação da informação, relacionamento com fornecedores, gestão de incidentes, continuidade de negócios e conformidade.", aka: "Annex A — Theme 5" },
  { name: "Controles de Pessoas (Tema 6)", acronym: "", cat: "annexa", def: "8 controles do Anexo A relativos a recursos humanos: seleção, termos e condições de emprego, conscientização, treinamento, processo disciplinar, offboarding e acordos de confidencialidade.", aka: "Annex A — Theme 6" },
  { name: "Controles Físicos (Tema 7)", acronym: "", cat: "annexa", def: "14 controles do Anexo A para segurança física: perímetros de segurança, controle de acesso físico, proteção de equipamentos, política de mesa limpa/tela limpa, segurança de escritórios e áreas de entrega.", aka: "Annex A — Theme 7" },
  { name: "Controles Tecnológicos (Tema 8)", acronym: "", cat: "annexa", def: "34 controles do Anexo A para segurança tecnológica: controle de acesso lógico, criptografia, gestão de vulnerabilidades, logging, proteção contra malware, segurança de redes, desenvolvimento seguro e gerenciamento de configuração.", aka: "Annex A — Theme 8" },
  { name: "Declaração de Aplicabilidade", acronym: "SoA", cat: "annexa", def: "Statement of Applicability: documento que lista todos os 93 controles do Anexo A e justifica quais são aplicáveis, quais estão implementados e a razão de exclusão dos controles não aplicáveis. Documento obrigatório para certificação.", aka: "Statement of Applicability" },

  // GESTÃO DE RISCO
  { name: "Aceitação do Risco", acronym: "", cat: "risk", def: "Decisão de assumir um risco sem implementar controles adicionais, geralmente quando o custo de mitigação supera o impacto potencial ou o risco está dentro do apetite definido pela direção.", aka: "Risk Acceptance" },
  { name: "Análise de Risco", acronym: "", cat: "risk", def: "Processo de identificar ativos, ameaças e vulnerabilidades, e estimar a probabilidade e o impacto dos riscos resultantes. Base para o plano de tratamento de risco na ISO 27001.", aka: "Risk Analysis, Avaliação de Risco" },
  { name: "Ativo de Informação", acronym: "", cat: "risk", def: "Qualquer informação, sistema, serviço ou recurso que tenha valor para a organização e que precise ser protegido. Inventário de ativos é requisito da ISO 27001 (Controle 5.9 do Anexo A).", aka: "Information Asset" },
  { name: "Ameaça", acronym: "", cat: "risk", def: "Causa potencial de um incidente indesejado que pode resultar em dano a um sistema ou organização. Exemplos: ataque de ransomware, desastre natural, erro humano, falha de fornecedor.", aka: "Threat" },
  { name: "Plano de Tratamento de Risco", acronym: "RTP", cat: "risk", def: "Risk Treatment Plan: documento que descreve as opções selecionadas para tratar cada risco identificado (mitigar, aceitar, transferir ou evitar), os controles a implementar, responsáveis e prazos.", aka: "Risk Treatment Plan" },
  { name: "Transferência de Risco", acronym: "", cat: "risk", def: "Opção de tratamento de risco onde o risco é compartilhado ou transferido para terceiros — via seguro cibernético, contratos com fornecedores ou terceirização de processos com responsabilidade contratual.", aka: "Risk Transfer, Risk Sharing" },
  { name: "Vulnerabilidade", acronym: "", cat: "risk", def: "Fraqueza em um ativo ou controle que pode ser explorada por uma ameaça. Exemplo: software sem patch, senha fraca, ausência de criptografia. Avaliação de vulnerabilidades é exigida pelo Controle 8.8 do Anexo A.", aka: "Vulnerability" },

  // CONCEITOS
  { name: "Auditoria Interna", acronym: "", cat: "concepts", def: "Avaliação sistemática e independente do ISMS para verificar se está conforme aos requisitos da ISO 27001 e efetivamente implementado. Deve ocorrer em intervalos planejados (Cláusula 9.2). Requisito para certificação.", aka: "Internal Audit" },
  { name: "Certificação ISO 27001", acronym: "", cat: "concepts", def: "Processo de auditoria de terceira parte conduzido por organismo de certificação acreditado. Inclui auditoria de estágio 1 (revisão documental) e estágio 2 (auditoria in loco). Vigência de 3 anos com auditorias de vigilância anuais.", aka: "" },
  { name: "CIA Triad", acronym: "", cat: "concepts", def: "Os três pilares da segurança da informação segundo a ISO 27001: Confidencialidade (acesso apenas por quem tem direito), Integridade (completude e precisão da informação) e Disponibilidade (acesso quando necessário).", aka: "CID — Confidencialidade, Integridade, Disponibilidade" },
  { name: "Classificação da Informação", acronym: "", cat: "concepts", def: "Esquema de categorias (ex: Pública, Interna, Confidencial, Restrita) para definir o nível de proteção de cada ativo de informação. Exigida pelo Controle 5.12 do Anexo A. Base para definição de controles proporcionais.", aka: "Information Classification" },
  { name: "Conformidade", acronym: "", cat: "concepts", def: "Atendimento a requisitos legais, regulatórios e contratuais de segurança da informação. Avaliada na Cláusula 9.1 e Cláusula 10. Inclui LGPD, GDPR, PCI DSS e outros regulamentos aplicáveis ao negócio.", aka: "Compliance" },
  { name: "Melhoria Contínua", acronym: "", cat: "concepts", def: "Princípio central do ISMS: o sistema deve ser constantemente aperfeiçoado com base em auditorias, revisões da direção, não-conformidades e mudanças no contexto organizacional. Exigido pela Cláusula 10.2.", aka: "Continual Improvement" },
  { name: "Não-Conformidade", acronym: "NC", cat: "concepts", def: "Falha em atender a um requisito da norma ISO 27001 ou a um requisito interno do ISMS. Requer registro, análise de causa raiz, ação corretiva e verificação de eficácia. Registrada durante auditorias.", aka: "Nonconformity" },
  { name: "Revisão pela Direção", acronym: "", cat: "concepts", def: "Avaliação periódica do ISMS pela alta direção para garantir sua contínua adequação, suficiência e eficácia. Deve considerar resultados de auditorias, desempenho, mudanças no contexto e oportunidades de melhoria (Cláusula 9.3).", aka: "Management Review" }
];

TERMS.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const CAT_LABELS = {
  isms:    "🔵 ISMS / Framework",
  clauses: "🟣 Cláusulas",
  annexa:  "🟠 Anexo A",
  risk:    "🔴 Gestão de Risco",
  concepts:"⚫ Conceitos"
};

let currentCat = "all";
let currentSearch = "";

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === "all" || t.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.acronym.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.aka.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const content = document.getElementById("content");
  const countDisplay = document.getElementById("countDisplay");
  countDisplay.textContent = `${filtered.length} de ${TERMS.length} termos`;

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum termo encontrado</h3><p>Tente buscar por outra palavra ou limpe os filtros.</p></div>`;
    return;
  }

  const byLetter = {};
  filtered.forEach(t => {
    const letter = t.name[0].toUpperCase();
    if (!byLetter[letter]) byLetter[letter] = [];
    byLetter[letter].push(t);
  });

  let html = "";
  Object.keys(byLetter).sort().forEach(letter => {
    html += `<div class="letter-section" id="letter-${letter}">
      <div class="letter-heading"><h2>${letter}</h2><hr></div>
      <div class="terms-grid">`;
    byLetter[letter].forEach(t => {
      html += `<div class="term-card">
        <div class="term-header">
          <div class="term-name">${t.name}</div>
          ${t.acronym ? `<div class="term-acronym">${t.acronym}</div>` : ""}
        </div>
        <div class="term-def">${t.def}</div>
        <div class="term-footer">
          <span class="cat-tag cat-${t.cat}">${CAT_LABELS[t.cat]}</span>
          ${t.aka ? `<span class="term-aka">Tb. conhecido como: ${t.aka}</span>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter) {
  const bar = document.getElementById("azBar");
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  bar.innerHTML = all.map(l => {
    if (byLetter && byLetter[l]) return `<a class="az-btn" href="#letter-${l}">${l}</a>`;
    return `<span class="az-btn disabled">${l}</span>`;
  }).join("");
}

updateAZBar(null);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
