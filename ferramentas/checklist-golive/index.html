<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checklist de Go-Live | NC Tool</title>
<style>
:root{--navy:#0D2137;--navy2:#1A3F63;--accent:#38BDF8;--bg:#F0F4F8;--surface:#fff;--border:#DDE3EC;--text:#0D2137;--mid:#4A5568;--light:#8B9BBF;--green:#10B981;--yellow:#F59E0B;--red:#EF4444;--blue:#2563EB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;height:56px;gap:12px;justify-content:space-between}
.logo{color:#fff;font-size:15px;font-weight:700}.logo span{color:var(--accent)}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-hdr{padding:5px 14px;border-radius:20px;border:none;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.btn-hdr.primary{background:var(--accent);color:var(--navy)}
.btn-hdr.secondary{background:rgba(255,255,255,.15);color:#fff}
.btn-qa{background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.btn-qa:hover{background:var(--accent);color:var(--navy)}
.back{color:var(--accent);font-size:12px;text-decoration:none;opacity:.8}

.wrap{max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}

/* META BAR */
.meta-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.meta-field{display:flex;flex-direction:column;gap:3px}
.meta-field label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--light)}
.meta-field input{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;color:var(--text);background:var(--bg);outline:none;font-family:inherit}
.meta-field input:focus{border-color:var(--blue)}

/* PROGRESS */
.progress-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-label{font-size:12px;font-weight:700;color:var(--navy)}
.progress-count{font-size:12px;color:var(--light)}
.bar-track{height:12px;background:#EEF2F7;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;background:var(--green);transition:width .4s}
.status-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;margin-top:8px}

/* SECTIONS GRID */
.sections-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:860px){.sections-grid{grid-template-columns:1fr}}

.section-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.section-head{padding:12px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);background:#FAFBFD}
.section-head:hover{background:#F0F4F8}
.section-icon{font-size:16px}
.section-title{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.section-count{font-size:11px;font-weight:700;color:var(--light)}
.section-chevron{font-size:10px;color:var(--light);transition:transform .2s}
.section-body{padding:10px 0}
.section-body.collapsed{display:none}

/* CHECKLIST ITEMS */
.item{display:flex;align-items:flex-start;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.item:last-child{border-bottom:none}
.item:hover{background:#FAFBFD}
.item-check{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.item-check.checked{background:var(--green);border-color:var(--green)}
.item-check.na{background:#E2E8F0;border-color:#CBD5E0}
.check-icon{color:#fff;font-size:10px;font-weight:900;display:none}
.item-check.checked .check-icon,.item-check.na .check-icon{display:block}
.item-check.na .check-icon{color:#718096}
.item-content{flex:1}
.item-label{font-size:12px;font-weight:600;color:var(--text);line-height:1.4}
.item-hint{font-size:10px;color:var(--light);line-height:1.5;margin-top:2px}
.item-priority{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.p-high{background:#FEE2E2;color:#991B1B}.p-med{background:#FEF3C7;color:#92400E}.p-low{background:#F0F4F8;color:var(--mid)}
.item-actions{display:flex;gap:4px;margin-top:3px}
.na-btn,.note-toggle{font-size:9px;padding:1px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--light)}
.na-btn:hover,.note-toggle:hover{border-color:var(--mid);color:var(--mid)}
.note-input{font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:4px;color:var(--mid);background:var(--bg);font-family:inherit;width:100%;margin-top:4px;display:none}

.export-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-export{padding:8px 18px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.btn-txt{background:var(--navy);color:#fff}
.btn-clear-all{background:transparent;border:1px solid var(--border);color:var(--mid)}

/* QA Modal */
.qa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.qa-overlay.open{display:flex}
.qa-modal{background:var(--surface);border-radius:14px;width:min(540px,90vw);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.qa-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.qa-header h2{font-size:15px;font-weight:800;color:var(--navy)}
.qa-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mid)}
.qa-body{padding:20px 24px}
.qa-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.qa-item:last-child{border-bottom:none}
.qa-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dot-ok{background:var(--green)}.dot-err{background:var(--red)}.dot-warn{background:var(--yellow)}
.qa-text{font-size:12px;color:var(--mid);line-height:1.5}
.qa-text b{color:var(--text)}
.qa-score{padding:14px 24px;background:#F8FAFC;border-top:1px solid var(--border);font-size:12px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px}
.score-badge{padding:4px 14px;border-radius:20px;font-size:13px;font-weight:800}

footer{text-align:center;color:var(--light);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Checklist de <span>Go-Live</span></div>
    <div class="header-actions">
      <button class="btn-qa" onclick="runQA()">🔍 QA</button>
      <button class="btn-hdr secondary" onclick="resetAll()">↺ Limpar</button>
      <button class="btn-hdr primary" onclick="exportTxt()">⬇ Exportar</button>
      <a class="back" href="https://falssp.github.io/Projeto-NC/">← Projeto NC</a>
    </div>
  </div>
</header>

<!-- QA Modal -->
<div class="qa-overlay" id="qa-overlay" onclick="closeQA(event)">
  <div class="qa-modal">
    <div class="qa-header"><h2>🔍 QA — Checklist Go-Live</h2><button class="qa-close" onclick="closeQA()">×</button></div>
    <div class="qa-body" id="qa-body"></div>
    <div class="qa-score" id="qa-score"></div>
  </div>
</div>

<div class="wrap">
  <div class="meta-bar">
    <div class="meta-field"><label>Cliente / Campanha</label><input id="meta-cliente" placeholder="Ex: MarcaX — Awareness Q4"></div>
    <div class="meta-field"><label>Plataforma(s)</label><input id="meta-plat" placeholder="Ex: Meta + DV360"></div>
    <div class="meta-field"><label>Data de Go-Live</label><input type="date" id="meta-data"></div>
    <div class="meta-field"><label>Responsável</label><input id="meta-resp" placeholder="Seu nome"></div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-header">
      <span class="progress-label">Progresso do Checklist</span>
      <span class="progress-count" id="prog-count">0 / 0 itens</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="prog-bar" style="width:0%"></div></div>
    <span class="status-badge" id="prog-badge" style="background:#FEF3C7;color:#92400E">⏳ Em andamento</span>
  </div>

  <div class="sections-grid" id="sections-wrap"></div>

  <div class="export-row">
    <button class="btn-export btn-txt" onclick="exportTxt()">⬇ Exportar .txt</button>
    <button class="btn-export btn-clear-all" onclick="resetAll()">↺ Resetar tudo</button>
  </div>

  <footer><a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none">← Projeto NC</a></footer>
</div>

<script>
const SECTIONS=[
  {id:'tracking',icon:'🎯',title:'Tracking & Pixels',items:[
    {id:'t1',label:'Pixel / Tag de conversão implementado e disparando',hint:'Verificar no Tag Assistant ou PixelHelper',p:'high'},
    {id:'t2',label:'Floodlight / Event Tags testadas no ambiente de staging',hint:'CM360: usar Preview Mode',p:'high'},
    {id:'t3',label:'Deduplicação de conversão configurada (clique vs. view)',hint:'Evita double counting entre plataformas',p:'high'},
    {id:'t4',label:'Janela de atribuição alinhada com o cliente',hint:'Padrão: 7d clique / 1d view para Meta; 30d para Search',p:'med'},
    {id:'t5',label:'UTM parameters configurados em todos os destinos de URL',hint:'utm_source, utm_medium, utm_campaign, utm_content',p:'high'},
    {id:'t6',label:'GA4 / Analytics validado para receber tráfego corretamente',hint:'Verificar eventos e conversões no DebugView',p:'med'},
    {id:'t7',label:'Impression Tracker configurado onde necessário (DV360/CM360)',hint:'Obrigatório para placements que não servem via ad server',p:'med'},
  ]},
  {id:'criativos',icon:'🎨',title:'Criativos & Assets',items:[
    {id:'c1',label:'Todos os criativos aprovados pela plataforma',hint:'Verificar status em cada ad: sem "Em revisão" ou "Reprovado"',p:'high'},
    {id:'c2',label:'Landing pages funcionando (desktop + mobile)',hint:'Testar em 3G simulado — tempo de carregamento < 3s',p:'high'},
    {id:'c3',label:'URLs de destino corretas em todos os anúncios',hint:'Sem redirecionamentos quebrados ou páginas 404',p:'high'},
    {id:'c4',label:'Especificações técnicas respeitadas (tamanho, formato, peso)',hint:'Video: bitrate, codec, resolução; Banner: KB máx',p:'med'},
    {id:'c5',label:'Criativos adaptados para mobile (responsivo ou versão específica)',hint:'> 60% do tráfego é mobile no Brasil',p:'med'},
    {id:'c6',label:'Call-to-action claro e alinhado com objetivo da campanha',hint:'Awareness ≠ "Compre agora"; Conversão ≠ "Saiba mais"',p:'low'},
    {id:'c7',label:'Versão com e sem áudio testada (para video)',hint:'80% dos usuários assiste sem som no feed',p:'low'},
  ]},
  {id:'segmentacao',icon:'🎯',title:'Segmentação & Targeting',items:[
    {id:'s1',label:'Audiências criadas e com volume mínimo para entrega',hint:'Meta: mín. 1.000; Google: mín. 1.000 (Match)',p:'high'},
    {id:'s2',label:'Geolocalização correta definida',hint:'Checar se é Brasil / Estado / Cidade específica',p:'high'},
    {id:'s3',label:'Faixa etária e gênero alinhados com briefing',hint:'Atenção a defaults de plataforma que incluem 18-65+',p:'med'},
    {id:'s4',label:'Exclusões configuradas (audiências, palavras-chave negativas, app categories)',hint:'Brand Safety: excluir categorias sensíveis',p:'high'},
    {id:'s5',label:'Segmentos de remarketing com Tag implementada e acumulando',hint:'Lista deve ter volume antes do go-live',p:'med'},
    {id:'s6',label:'Frequency cap configurado conforme estratégia',hint:'Awareness: 3-5x/semana; Retargeting: até 10x/semana',p:'med'},
    {id:'s7',label:'Idioma do anúncio e targeting de idioma alinhados',hint:'Segmentar PT-BR para evitar servir para PT-PT',p:'low'},
  ]},
  {id:'budget',icon:'💰',title:'Budget & Lances',items:[
    {id:'b1',label:'Budget total e diário definidos corretamente',hint:'Verificar se é budget de campanha ou de linha',p:'high'},
    {id:'b2',label:'Estratégia de lances configurada (CPC, CPM, CPA, ROAS)',hint:'Automático só funciona bem com volume mínimo de conversões',p:'high'},
    {id:'b3',label:'Data de início e fim corretas em todas as campanhas/linhas',hint:'Timezone da campanha vs. timezone do cliente',p:'high'},
    {id:'b4',label:'Flight de budget por período planejado (se aplicável)',hint:'Campanhas com sazonalidade precisam de ajuste manual',p:'med'},
    {id:'b5',label:'Lances mínimos acima do floor price (para programática)',hint:'Deal IDs: verificar CPM mínimo do deal',p:'med'},
  ]},
  {id:'brand_safety',icon:'🛡️',title:'Brand Safety & Compliance',items:[
    {id:'bs1',label:'Brand safety configurado (GARM tiers ou listas de exclusão)',hint:'Mínimo: excluir Violência, Conteúdo Adulto, Fake News',p:'high'},
    {id:'bs2',label:'Inclusion list ou PMP ativo (se exigido pelo cliente)',hint:'Premium: forçar whitelist de sites aprovados',p:'med'},
    {id:'bs3',label:'IAS / DoubleVerify / MOAT ativo (se contratado)',hint:'Tag de medibilidade terceira deve ser aplicada no ad server',p:'med'},
    {id:'bs4',label:'Disclaimer / termos legais presentes onde exigido',hint:'CONAR e BACEN têm regras específicas para ads no Brasil',p:'high'},
    {id:'bs5',label:'LGPD: consentimento coletado antes de usar dados de retargeting',hint:'Pixel só pode disparar após aceite de cookies',p:'high'},
  ]},
  {id:'adserver',icon:'⚙️',title:'Ad Server & Trafficking',items:[
    {id:'as1',label:'Tags do ad server geradas e testadas (não em erro)',hint:'CM360: Preview Tag; Sizmek: Preview URL',p:'high'},
    {id:'as2',label:'Tags implementadas pelo publisher e confirmadas como "Live"',hint:'Pedir screenshot do QA do publisher',p:'high'},
    {id:'as3',label:'Dimensões dos placements corretos no ad server',hint:'Placement 300x250 com criativo 300x600 = erro de serve',p:'high'},
    {id:'as4',label:'Relatório de entrega configurado (impressões, cliques, conversões)',hint:'Agendar relatório diário automático para o período da campanha',p:'med'},
    {id:'as5',label:'Discrepância baseline validada com publisher (< 10%)',hint:'Confirmar método de contagem antes de escalar para o cliente',p:'med'},
    {id:'as6',label:'Viewability measurement ativa nos placements principais',hint:'IAS, MOAT ou nativa da plataforma',p:'med'},
  ]},
  {id:'processo',icon:'📋',title:'Processo & Comunicação',items:[
    {id:'p1',label:'Briefing assinado ou aprovado formalmente pelo cliente',hint:'E-mail ou sistema de aprovação — evitar aprovação verbal',p:'high'},
    {id:'p2',label:'KPIs e benchmarks alinhados e documentados',hint:'CTR, CPM, VTR, CPA — o que será usado para avaliar sucesso?',p:'high'},
    {id:'p3',label:'Dashboard de monitoramento configurado e compartilhado',hint:'Looker Studio, CM360 Report, Data Studio ou planilha',p:'med'},
    {id:'p4',label:'Escalada de alertas definida',hint:'Threshold definido — ex: CPA > 2x meta = pausar e escalar',p:'med'},
    {id:'p5',label:'Primeiro relatório de performance agendado (D+1, D+3)',hint:'Primeiras 48h são críticas para identificar problemas de entrega',p:'med'},
    {id:'p6',label:'Confirmação de Go-Live enviada ao cliente',hint:'E-mail com links, criativos ao vivo e prints de confirmação',p:'high'},
  ]},
];

let states={};
function init(){SECTIONS.forEach(sec=>{sec.items.forEach(item=>{states[item.id]='unchecked';});});renderAll();}

function renderAll(){
  const wrap=document.getElementById('sections-wrap');wrap.innerHTML='';
  SECTIONS.forEach(sec=>{
    const checkedCount=sec.items.filter(i=>states[i.id]==='checked'||states[i.id]==='na').length;
    const div=document.createElement('div');div.className='section-card';
    div.innerHTML=`
      <div class="section-head" onclick="toggleSection('${sec.id}')">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count">${checkedCount}/${sec.items.length}</span>
        <span class="section-chevron" id="chev-${sec.id}">▼</span>
      </div>
      <div class="section-body" id="body-${sec.id}">
        ${sec.items.map(item=>renderItem(item)).join('')}
      </div>`;
    wrap.appendChild(div);
  });
  updateProgress();
}

function renderItem(item){
  const st=states[item.id]||'unchecked';
  const pClass={high:'p-high',med:'p-med',low:'p-low'}[item.p];
  const pLabel={high:'Crítico',med:'Importante',low:'Recomendado'}[item.p];
  return `<div class="item" id="item-${item.id}">
    <div class="item-check ${st}" onclick="toggle('${item.id}')" id="chk-${item.id}">
      <span class="check-icon">${st==='na'?'—':'✓'}</span>
    </div>
    <div class="item-content">
      <div class="item-label">${item.label} <span class="item-priority ${pClass}">${pLabel}</span></div>
      <div class="item-hint">${item.hint}</div>
      <div class="item-actions">
        <button class="na-btn" onclick="markNA('${item.id}')">N/A</button>
        <button class="note-toggle" onclick="toggleNote('${item.id}')">📝 Nota</button>
      </div>
      <input class="note-input" id="note-${item.id}" placeholder="Adicionar observação…">
    </div>
  </div>`;
}

function toggle(id){
  const cur=states[id];states[id]=cur==='unchecked'?'checked':'unchecked';
  const chk=document.getElementById('chk-'+id);
  chk.className='item-check '+(states[id]==='checked'?'checked':'');
  chk.querySelector('.check-icon').style.display=states[id]==='checked'?'block':'none';
  chk.querySelector('.check-icon').textContent='✓';
  updateProgress();updateSectionCount(id);
}
function markNA(id){
  states[id]='na';
  const chk=document.getElementById('chk-'+id);
  chk.className='item-check na';
  chk.querySelector('.check-icon').style.display='block';
  chk.querySelector('.check-icon').textContent='—';
  updateProgress();updateSectionCount(id);
}
function toggleNote(id){const note=document.getElementById('note-'+id);note.style.display=note.style.display==='block'?'none':'block';if(note.style.display==='block')note.focus();}
function toggleSection(id){const body=document.getElementById('body-'+id);const chev=document.getElementById('chev-'+id);body.classList.toggle('collapsed');chev.textContent=body.classList.contains('collapsed')?'▶':'▼';}
function updateSectionCount(itemId){
  SECTIONS.forEach(sec=>{
    if(sec.items.find(i=>i.id===itemId)){
      const c=sec.items.filter(i=>states[i.id]==='checked'||states[i.id]==='na').length;
      const el=document.querySelector(`#body-${sec.id}`).previousElementSibling.querySelector('.section-count');
      if(el)el.textContent=`${c}/${sec.items.length}`;
    }
  });
}
function updateProgress(){
  const all=Object.keys(states).length;
  const done=Object.values(states).filter(s=>s==='checked'||s==='na').length;
  const pct=all?Math.round(done/all*100):0;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-count').textContent=`${done} / ${all} itens`;
  const badge=document.getElementById('prog-badge');
  if(pct===100){badge.style.background='#D1FAE5';badge.style.color='#065F46';badge.textContent='✅ Pronto para Go-Live!';}
  else if(pct>=75){badge.style.background='#D1FAE5';badge.style.color='#065F46';badge.textContent='🟢 Quase lá — '+pct+'%';}
  else if(pct>=40){badge.style.background='#FEF3C7';badge.style.color='#92400E';badge.textContent='⏳ Em andamento — '+pct+'%';}
  else{badge.style.background='#FEE2E2';badge.style.color='#991B1B';badge.textContent='🔴 Início — '+pct+'%';}
}
function resetAll(){Object.keys(states).forEach(k=>states[k]='unchecked');renderAll();}
function exportTxt(){
  const cliente=document.getElementById('meta-cliente').value||'—';
  const plat=document.getElementById('meta-plat').value||'—';
  const data=document.getElementById('meta-data').value;
  const resp=document.getElementById('meta-resp').value||'—';
  const all=Object.keys(states).length;
  const done=Object.values(states).filter(s=>s==='checked'||s==='na').length;
  let txt='CHECKLIST DE GO-LIVE\n'+'='.repeat(50)+'\n';
  txt+=`Campanha : ${cliente}\nPlataforma: ${plat}\nGo-Live  : ${data||'—'}\nResp.    : ${resp}\nGerado em: ${new Date().toLocaleDateString('pt-BR')}\nProgresso: ${done}/${all} itens (${Math.round(done/all*100)}%)\n\n`;
  SECTIONS.forEach(sec=>{
    txt+=`\n${sec.title.toUpperCase()}\n${'-'.repeat(40)}\n`;
    sec.items.forEach(item=>{
      const s=states[item.id];const mark=s==='checked'?'[✓]':s==='na'?'[N/A]':'[ ]';
      const note=document.getElementById('note-'+item.id)?.value;
      txt+=`${mark} ${item.label}\n`;
      if(note)txt+=`     Nota: ${note}\n`;
    });
  });
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`golive_${(cliente||'campanha').toLowerCase().replace(/\s+/g,'_')}.txt`;a.click();
}

// ── QA ──────────────────────────────────────────────────────────
function runQA(){
  const checks=[];
  checks.push({ok:true,msg:'<b>Página</b> carregou corretamente'});

  const totalItems=Object.keys(states).length;
  const expectedItems=SECTIONS.reduce((a,s)=>a+s.items.length,0);
  checks.push({ok:totalItems===expectedItems,msg:`<b>Total de itens</b>: ${totalItems} no estado (esperado ${expectedItems})`});

  const sectionsGrid=document.querySelector('.sections-grid');
  checks.push({ok:!!sectionsGrid,msg:'<b>Layout grid</b> de seções renderizado'});

  const numSections=document.querySelectorAll('.section-card').length;
  checks.push({ok:numSections===7,msg:`<b>Seções</b>: ${numSections} renderizadas (esperado 7)`});

  // Testar toggle
  const testId='t1';
  const prevState=states[testId];
  toggle(testId);
  const afterToggle=states[testId]==='checked';
  checks.push({ok:afterToggle,msg:`<b>Toggle de item</b>: t1 marcado como checked`});
  toggle(testId); // restore

  // Testar N/A
  markNA('t2');
  const naOk=states['t2']==='na';
  checks.push({ok:naOk,msg:`<b>Marcar N/A</b>: t2 marcado corretamente`});
  states['t2']='unchecked';
  const chk=document.getElementById('chk-t2');
  if(chk){chk.className='item-check';chk.querySelector('.check-icon').style.display='none';}

  // Progress bar
  const bar=document.getElementById('prog-bar');
  checks.push({ok:!!bar,msg:'<b>Barra de progresso</b> presente'});

  // Meta fields
  const metaFields=['meta-cliente','meta-plat','meta-data','meta-resp'];
  const metaOk=metaFields.every(id=>document.getElementById(id));
  checks.push({ok:metaOk,msg:'<b>Campos de meta</b> (cliente, plataforma, data, responsável) presentes'});

  // Layout full-width
  const wrap=document.querySelector('.wrap');
  checks.push({ok:!!wrap&&wrap.style.maxWidth!=='900px',msg:'<b>Layout full-width</b> (max-width 1400px)'});

  const ok=checks.filter(c=>c.ok).length,total=checks.length,pct=Math.round(ok/total*100);
  document.getElementById('qa-body').innerHTML=checks.map(c=>`<div class="qa-item"><div class="qa-dot ${c.ok?'dot-ok':'dot-err'}"></div><div class="qa-text">${c.msg}</div></div>`).join('');
  const color=pct>=90?'#D1FAE5;color:#065F46':pct>=70?'#FEF3C7;color:#92400E':'#FEE2E2;color:#991B1B';
  document.getElementById('qa-score').innerHTML=`<span>Score:</span><span class="score-badge" style="background:${color.split(';')[0].replace('background:','')};color:${color.split('color:')[1]}">${pct}% (${ok}/${total})</span>`;
  document.getElementById('qa-overlay').classList.add('open');
}
function closeQA(e){if(!e||e.target===document.getElementById('qa-overlay'))document.getElementById('qa-overlay').classList.remove('open')}

init();
</script>
</body>
</html>
