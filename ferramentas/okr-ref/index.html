<style>
:root {
  --bg:#f4f5f8;--surface:#fff;--surface2:#eef0f4;--border:#e0e3ea;
  --text:#1a1d26;--muted:#6b7280;--subtle:#9ca3af;
  --accent:#1F36C7;--accent-bg:#eef1fc;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 14px rgba(0,0,0,.10);
  --c-fw:#1F36C7;--c-fw-bg:#eef1fc;
  --c-obj:#7c3aed;--c-obj-bg:#f5f3ff;
  --c-kr:#0891b2;--c-kr-bg:#ecfeff;
  --c-ci:#059669;--c-ci-bg:#ecfdf5;
  --c-ro:#d97706;--c-ro-bg:#fffbeb;
  --c-er:#dc2626;--c-er-bg:#fef2f2;
  --c-pl:#0f766e;--c-pl-bg:#f0fdfa;
}
[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;
  --text:#e8eaf0;--muted:#9ca3af;--subtle:#6b7280;
  --accent:#4f6ef7;--accent-bg:#1a224a;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 14px rgba(0,0,0,.45);
  --c-fw-bg:#1a2250;--c-obj-bg:#2a1f4a;--c-kr-bg:#0a2a38;
  --c-ci-bg:#082e1f;--c-ro-bg:#2a1e08;--c-er-bg:#2a0e0e;--c-pl-bg:#0a2420;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.back-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;font-size:.78rem;color:var(--subtle);display:flex;justify-content:space-between;align-items:center}
.back-nav a{color:var(--accent);text-decoration:none;font-weight:600}
.back-nav a:hover{text-decoration:underline}
.lang-btn{font-size:.72rem;font-weight:600;padding:.2rem .7rem;border:1px solid var(--border);border-radius:20px;color:var(--muted);background:none;cursor:pointer;font-family:inherit;transition:all .15s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.lang-switcher{display:flex;gap:.35rem;align-items:center}
.hero{background:linear-gradient(135deg,#0d1a6e 0%,var(--accent) 100%);color:#fff;padding:1.6rem 1.5rem 1.3rem}
.hero-title{font-size:1.55rem;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:.5rem}
.hero-sub{font-size:.82rem;opacity:.8;margin-top:.3rem}
.controls{background:linear-gradient(135deg,#0d1a6e 0%,var(--accent) 100%);padding:0 1.5rem 1.3rem;display:flex;flex-direction:column;gap:.6rem}
.search-wrap{position:relative;max-width:520px}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none;font-size:14px}
#search{width:100%;padding:.55rem .8rem .55rem 2.1rem;border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-sm);background:rgba(255,255,255,.12);color:#fff;font-size:.85rem;font-family:inherit;outline:none;transition:background .15s,border-color .15s}
#search::placeholder{color:rgba(255,255,255,.55)}
#search:focus{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.filter-btn{padding:.3rem .85rem;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.filter-btn:hover{background:rgba(255,255,255,.22);color:#fff}
.filter-btn.active{background:#fff;border-color:#fff;color:var(--accent)}
.legend{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;gap:.45rem;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;padding:.2rem .6rem;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.az-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;gap:2px;flex-wrap:wrap}
.az-btn{width:22px;height:22px;border:none;background:none;border-radius:4px;font-size:.7rem;font-weight:700;color:var(--accent);cursor:pointer;transition:all .15s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.az-btn:hover{background:var(--accent-bg)}
.az-btn.disabled{color:var(--subtle);cursor:default;pointer-events:none}
.stats-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:.45rem 1.5rem;font-size:.75rem;color:var(--subtle);display:flex;justify-content:space-between;align-items:center}
.theme-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.25rem .65rem;font-size:.72rem;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}
.theme-btn:hover{color:var(--text);border-color:var(--accent)}
.grid{padding:1.2rem 1.5rem 3rem}
.letter-section{margin-bottom:1.5rem}
.letter-heading{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
.letter-heading h2{font-size:1.1rem;font-weight:800;color:var(--accent);min-width:1.5rem}
.letter-heading hr{flex:1;border:none;border-top:2px solid var(--border)}
.terms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:.6rem}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--accent)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.card-name{font-size:.9rem;font-weight:700;color:var(--text);line-height:1.25}
.card-abbr{font-size:.68rem;font-weight:600;color:var(--subtle);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.15rem .45rem;white-space:nowrap;flex-shrink:0}
.card-cat{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;padding:.2rem .6rem;border-radius:20px;width:fit-content;text-transform:uppercase;letter-spacing:.4px}
.card-def{font-size:.82rem;color:var(--muted);line-height:1.6}
.card-ex{font-size:.76rem;color:var(--subtle);background:var(--surface2);border-left:3px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.45rem .65rem;font-style:italic;line-height:1.5}
.c-fw{color:var(--c-fw);background:var(--c-fw-bg)}
.c-obj{color:var(--c-obj);background:var(--c-obj-bg)}
.c-kr{color:var(--c-kr);background:var(--c-kr-bg)}
.c-ci{color:var(--c-ci);background:var(--c-ci-bg)}
.c-ro{color:var(--c-ro);background:var(--c-ro-bg)}
.c-er{color:var(--c-er);background:var(--c-er-bg)}
.c-pl{color:var(--c-pl);background:var(--c-pl-bg)}
.empty{grid-column:1/-1;text-align:center;padding:3.5rem 1rem;color:var(--subtle)}
.empty-icon{font-size:2.2rem;margin-bottom:.7rem}
.empty-title{font-size:.95rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);max-width:480px;width:100%;padding:1.4rem;display:flex;flex-direction:column;gap:1rem}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:.95rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--subtle);line-height:1}
.modal-close:hover{color:var(--text)}
.modal-steps{display:flex;flex-direction:column;gap:.65rem}
.modal-step{display:flex;gap:.75rem;align-items:flex-start}
.step-n{min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-t{font-size:.82rem;color:var(--muted);line-height:1.5}
.step-t strong{color:var(--text)}
.modal-tip{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:.6rem .75rem;font-size:.76rem;color:var(--accent);line-height:1.5}
@media(max-width:600px){
  .hero{padding:1.2rem 1rem 1rem}.hero-title{font-size:1.25rem}
  .controls,.legend,.az-bar,.stats-bar,.grid{padding-left:1rem;padding-right:1rem}
  .terms-grid{grid-template-columns:1fr}.grid{padding-top:1rem}
}
</style>
</head>
<body>

<div class="back-nav">
  <a href="../" id="backLink">← Ferramentas | NC Tool</a>
  <div class="lang-switcher">
    <button class="lang-btn active" id="btnPT" onclick="setLang('pt')">🇧🇷 PT</button>
    <button class="lang-btn" id="btnEN" onclick="setLang('en')">🇺🇸 EN</button>
  </div>
</div>

<header class="hero">
  <div class="hero-title" id="heroTitle">🎯 OKR para AdOps — Referência</div>
  <div class="hero-sub" id="heroSub">Framework, Objetivos, Key Results, Check-in, Papéis, Plataformas e Erros comuns aplicados a operações de mídia digital</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" autocomplete="off">
  </div>
  <div class="filters" id="filters"></div>
</div>

<div class="legend" id="legend"></div>
<div class="az-bar" id="azBar"></div>

<div class="stats-bar">
  <span id="statsBar"></span>
  <button class="theme-btn" id="themeBtn">🌙 Dark</button>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">❓ Como usar esta referência</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-steps" id="modalSteps"></div>
    <div class="modal-tip" id="modalTip"></div>
  </div>
</div>

<button id="helpBtn" style="position:fixed;bottom:1.2rem;right:1.2rem;z-index:150;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:.5rem 1rem;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(31,54,199,.4)">❓</button>

<script>
/* ── DADOS ── */
var TERMS = {
  pt: [
    /* FRAMEWORK */
    {name:'OKR',abbr:'Objectives & Key Results',cat:'framework',cl:'c-fw',
     def:'Metodologia de definição de metas que conecta um Objetivo inspiracional a Resultados-chave mensuráveis. Criada na Intel por Andy Grove e popularizada no Google por John Doerr.',
     ex:'Formato: Objetivo [O quê + Por quê] + Key Results [Como medimos o sucesso]'},
    {name:'Ciclo OKR',abbr:'',cat:'framework',cl:'c-fw',
     def:'Período de execução dos OKRs. Normalmente trimestral (90 dias) para times operacionais, com OKRs anuais no nível estratégico.',
     ex:'Q1: Jan–Mar · Q2: Abr–Jun · Q3: Jul–Set · Q4: Out–Dez'},
    {name:'Cadência',abbr:'',cat:'framework',cl:'c-fw',
     def:'Frequência dos rituais de acompanhamento: check-in semanal (15–30 min), revisão mensal e retrospectiva trimestral. Sem cadência, OKRs viram metas de gaveta.',
     ex:''},
    {name:'Cascata',abbr:'Cascading',cat:'framework',cl:'c-fw',
     def:'Desdobramento dos OKRs corporativos em OKRs de times e individuais. Feito por alinhamento colaborativo, não imposição hierárquica.',
     ex:''},
    {name:'CFR',abbr:'Conversations, Feedback, Recognition',cat:'framework',cl:'c-fw',
     def:'Práticas contínuas que sustentam o ciclo OKR: conversas honestas sobre progresso, feedback bidirecional e reconhecimento de contribuições. Complementam a pontuação numérica.',
     ex:''},
    {name:'OKR Comprometido',abbr:'Roofshot',cat:'framework',cl:'c-fw',
     def:'Objetivo cuja entrega de 100% é esperada e obrigatória. Usado para operações críticas, SLAs e contratos com clientes.',
     ex:'Entregas de campanha, compliance de brand safety e prazos contratuais são roofshots'},
    {name:'OKR Aspiracional',abbr:'Moonshot',cat:'framework',cl:'c-fw',
     def:'Objetivo ambicioso onde atingir 70% já representa sucesso. Usado para inovação e crescimento acelerado. Não deve ser atrelado a avaliações de desempenho.',
     ex:'Score 0,7 num moonshot equivale a score 1,0 num roofshot'},
    {name:'North Star Metric',abbr:'NSM',cat:'framework',cl:'c-fw',
     def:'Métrica única que representa o valor entregue ao cliente e orienta todas as decisões estratégicas. Todos os OKRs devem contribuir para ela.',
     ex:'Para uma operação de mídia: volume de impressões qualificadas entregues no prazo e dentro do budget'},
    {name:'OKR Backlog',abbr:'',cat:'framework',cl:'c-fw',
     def:'Lista de Objetivos e KRs candidatos para ciclos futuros. Evita que boas ideias se percam e facilita a priorização no início de cada trimestre.',
     ex:''},
    {name:'OKR Canvas',abbr:'',cat:'framework',cl:'c-fw',
     def:'Ferramenta visual para planejar o ciclo OKR: contexto estratégico, Objetivos, Key Results, donos, dependências e riscos em um único quadro.',
     ex:''},
    {name:'Alinhamento Estratégico',abbr:'',cat:'framework',cl:'c-fw',
     def:'Garantia de que os OKRs de time e individuais suportam os objetivos organizacionais. Evita que times otimizem localmente em detrimento do todo.',
     ex:''},
    {name:'OKR de Time',abbr:'',cat:'framework',cl:'c-fw',
     def:'Conjunto de Objetivos e Key Results sob responsabilidade coletiva de um squad, área ou célula. Diferente do OKR individual, pertence ao grupo.',
     ex:''},
    {name:'Alinhamento Bidirecional',abbr:'Bottom-up + Top-down',cat:'framework',cl:'c-fw',
     def:'Modelo ideal de cascata: liderança define direção (top-down) e times definem como chegar lá (bottom-up). Proporção sugerida: 40% top-down / 60% bottom-up.',
     ex:''},
    /* OBJETIVOS */
    {name:'Objetivo',abbr:'',cat:'objective',cl:'c-obj',
     def:'Declaração qualitativa e inspiracional do que se quer alcançar. Responde ao o quê e ao por quê. Não é uma tarefa, não contém número e não descreve um output.',
     ex:'✅ Elevar a qualidade de entrega de campanhas digitais | ❌ Implementar checklist de QA'},
    {name:'Verbo de Ação',abbr:'',cat:'objective',cl:'c-obj',
     def:'Objetivos eficazes começam com um verbo forte que sinaliza transformação: Elevar, Transformar, Tornar-se, Liderar, Conquistar, Estabelecer-se como referência.',
     ex:'Evite: Manter, Garantir, Continuar — esses verbos não indicam crescimento'},
    {name:'Objetivo de Negócio vs Tarefa',abbr:'',cat:'objective',cl:'c-obj',
     def:'Um objetivo de negócio mede impacto no cliente ou resultado. Um objetivo-tarefa descreve um entregável interno. Apenas o primeiro é um Objetivo legítimo de OKR.',
     ex:'Negócio: Tornar-se a operação mais confiável do mercado | Tarefa: Criar documentação de processos'},
    {name:'Qualitativo',abbr:'',cat:'objective',cl:'c-obj',
     def:'Característica essencial do Objetivo: ele descreve uma direção ou aspiração, nunca um número. Números pertencem aos Key Results.',
     ex:''},
    {name:'Teste do Suor',abbr:'Sweat Test',cat:'objective',cl:'c-obj',
     def:'Teste para validar se um Objetivo é ambicioso o suficiente: ao lê-lo, o time sente leve desconforto? Se não, provavelmente é fácil demais.',
     ex:''},
    /* KEY RESULTS */
    {name:'Key Result',abbr:'KR',cat:'kr',cl:'c-kr',
     def:'Resultado mensurável que indica se o Objetivo está sendo alcançado. Deve ser específico, com baseline, meta e prazo. Recomendado: 2 a 5 KRs por Objetivo.',
     ex:'Formato: [Métrica] de [baseline] para [meta] até [data]'},
    {name:'Baseline',abbr:'',cat:'kr',cl:'c-kr',
     def:'Valor atual de uma métrica antes do início do ciclo. Sem baseline é impossível medir progresso real. Obrigatório antes de definir qualquer KR.',
     ex:''},
    {name:'Brand Safety Score',abbr:'BSS',cat:'kr',cl:'c-kr',
     def:'% de impressões servidas em ambientes alinhados às diretrizes da marca. KR de proteção de imagem e compliance com políticas do anunciante.',
     ex:'Manter Brand Safety Score acima de 95% em 100% das campanhas do cliente'},
    {name:'Budget Utilization',abbr:'',cat:'kr',cl:'c-kr',
     def:'% do budget total comprometido e investido no período. KR financeiro e indicador de eficiência do planejamento de mídia.',
     ex:'Atingir 97% de utilização de budget na carteira de clientes ao final de cada trimestre'},
    {name:'Confidence Score',abbr:'',cat:'kr',cl:'c-kr',
     def:'Estimativa semanal (0–10) da confiança do time em bater o KR. Uma queda brusca é sinal de alerta antecipado antes do score numérico cair.',
     ex:'Confidence 7/10 no início, 4/10 na semana 6 — gatilho para revisão urgente'},
    {name:'CTR (KR)',abbr:'Click-Through Rate',cat:'kr',cl:'c-kr',
     def:'% de cliques sobre impressões. Usado como KR quando o objetivo é gerar tráfego qualificado. Cuidado: CTR alto no contexto errado é métrica de vaidade.',
     ex:'Manter CTR acima de 0,15% em formatos rich media em campanhas de awareness'},
    {name:'Delivery Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% do budget entregue vs planejado ao final da campanha. KR de eficiência de pacing. Meta típica: 95–105%.',
     ex:'Atingir delivery rate entre 98% e 102% em 90% das campanhas do portfolio'},
    {name:'eCPM (KR)',abbr:'Effective CPM',cat:'kr',cl:'c-kr',
     def:'Custo efetivo por mil impressões qualificadas entregues. KR de eficiência na compra de mídia programática.',
     ex:'Reduzir eCPM médio de R$3,50 para R$2,80 sem perda de viewability'},
    {name:'IVT Rate',abbr:'Invalid Traffic',cat:'kr',cl:'c-kr',
     def:'% de tráfego inválido (bots, cliques fraudulentos) identificado na campanha. Meta: abaixo de 10% (padrão IAB).',
     ex:'Manter taxa de IVT abaixo de 5% em todas as campanhas programáticas do trimestre'},
    {name:'Outcome vs Output',abbr:'',cat:'kr',cl:'c-kr',
     def:'Output: entrega de uma tarefa. Outcome: mudança de comportamento ou resultado de negócio. KRs medem outcomes, nunca outputs.',
     ex:'Output: Publicar relatório de viewability | Outcome: Viewability média acima de 70%'},
    {name:'Cobertura de Reports',abbr:'',cat:'kr',cl:'c-kr',
     def:'% de campanhas ativas com relatórios de performance entregues dentro do SLA acordado. KR de excelência no atendimento ao cliente.',
     ex:'Atingir 100% de entregas de reports no prazo no Q4'},
    {name:'Scoring',abbr:'',cat:'kr',cl:'c-kr',
     def:'Pontuação de 0 a 1 (ou 0–100%) que indica o grau de alcance de um KR. 0,7–1,0 = ótimo; 0,4–0,6 = aceitável; abaixo de 0,4 = revisão urgente.',
     ex:'Score 0,7 num moonshot = 70% de um objetivo ambicioso — válido e esperado'},
    {name:'Setup Lead Time',abbr:'',cat:'kr',cl:'c-kr',
     def:'Tempo médio entre o recebimento do briefing e a campanha ao ar. KR de eficiência operacional — mede a agilidade do time de AdOps.',
     ex:'Reduzir setup lead time médio de 5 dias úteis para 2 dias no Q3'},
    {name:'Share of Voice',abbr:'SOV',cat:'kr',cl:'c-kr',
     def:'% das impressões do anunciante sobre o total do mercado/segmento. KR de dominância de mídia. Correlacionado com market share.',
     ex:''},
    {name:'Meta (Target)',abbr:'',cat:'kr',cl:'c-kr',
     def:'Valor objetivo que o KR deve atingir ao final do ciclo. Deve ser ambicioso o suficiente para exigir esforço, mas alcançável com foco e recursos disponíveis.',
     ex:''},
    {name:'Trafficking Error Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% de tags ou criativos com problemas detectados durante a veiculação: erros de servidor, redirects quebrados, criativos não aprovados.',
     ex:'Reduzir taxa de erros de trafficking de 8% para 2% até o final do trimestre'},
    {name:'Video Completion Rate',abbr:'VCR',cat:'kr',cl:'c-kr',
     def:'% de vídeos assistidos até o final (100% da duração). Indica qualidade de atenção e afinidade com o criativo. KR de engajamento em campanhas de vídeo.',
     ex:'Aumentar VCR médio de 35% para 50% em formatos in-stream no Q4'},
    {name:'Viewability — Display',abbr:'',cat:'kr',cl:'c-kr',
     def:'% de impressões display visíveis pelo padrão MRC: 50% do criativo visível por ao menos 1 segundo. Benchmarks: 300x250 ~58% · 728x90 ~52% · 970x250 ~65%.',
     ex:'Aumentar viewability média de 55% para 72% em campanhas de display no Q2'},
    {name:'Viewability — Vídeo',abbr:'',cat:'kr',cl:'c-kr',
     def:'% de impressões de vídeo visíveis pelo padrão MRC: 50% do player visível por ao menos 2 segundos. Pre-roll in-stream tipicamente atinge 80%+; outstream fica em torno de 50–60%.',
     ex:'Manter viewability de vídeo acima de 75% em formatos pre-roll in-stream no DV360'},
    {name:'Win Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% de leilões programáticos ganhos sobre o total de leilões participados. KR de competitividade e eficiência de lance. Muito alto pode indicar targeting pouco refinado.',
     ex:'Manter win rate entre 15% e 35% em campanhas de prospecting no DV360'},
    /* CHECK-IN */
    {name:'Check-in Semanal',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Reunião curta (15–30 min) para acompanhar KRs: o que avançou, o que está em risco, quais bloqueios precisam de atenção. Não é reunião de status de tarefas.',
     ex:''},
    {name:'Revisão Mensal',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Análise mais profunda dos OKRs: scoring atual, desvios, correções de rota e alinhamento entre times. Oportunidade de escalar bloqueios à liderança.',
     ex:''},
    {name:'Retrospectiva Trimestral',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Encerramento do ciclo: o que funcionou, o que não funcionou, o que aprendemos e quais OKRs transitam para o próximo ciclo. Score final + lições documentadas.',
     ex:''},
    {name:'Escalada de Bloqueios',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Processo de levar ao executive sponsor um bloqueio que o time não consegue resolver sozinho. Deve acontecer antes do KR ficar comprometido.',
     ex:'Dependência de aprovação de criativo pelo cliente bloqueando entrega → escalar na revisão mensal'},
    {name:'Health Check',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Avaliação qualitativa do status de um KR: 🟢 on track · 🟡 em risco · 🔴 comprometido. Complementa o scoring numérico e facilita priorização.',
     ex:''},
    {name:'Revisão de Meio de Ciclo',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Revisão na metade do ciclo (semana 6–7 de um trimestre) para avaliar se os OKRs ainda são relevantes. Permite ajuste de metas se o contexto mudou.',
     ex:''},
    {name:'OKR Log',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Registro escrito de cada atualização de KR a cada check-in: score atual, confidence, o que aconteceu na semana e próximos passos. A memória viva do ciclo.',
     ex:''},
    {name:'Off-Track',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Quando um KR diverge significativamente do ritmo esperado. Exige análise de causa-raiz e plano de recuperação registrado no OKR log.',
     ex:'Viewability caindo abaixo da projeção → investigar SSPs, formatos e placements'},
    /* PAPÉIS */
    {name:'OKR Owner',abbr:'',cat:'roles',cl:'c-ro',
     def:'Pessoa responsável por um Objetivo ou KR específico. Atualiza progresso nos check-ins, escalona bloqueios e responde pelo resultado final do ciclo.',
     ex:''},
    {name:'OKR Champion',abbr:'',cat:'roles',cl:'c-ro',
     def:'Facilitador do processo OKR na organização ou time. Garante cadência, qualidade das metas, aderência ao método e evolução da prática entre ciclos.',
     ex:''},
    {name:'Executive Sponsor',abbr:'',cat:'roles',cl:'c-ro',
     def:'Líder que valida e patrocina os OKRs do time, garante recursos e remove bloqueios estratégicos ou organizacionais que o time não consegue resolver.',
     ex:''},
    {name:'Squad de AdOps',abbr:'Time de Operações',cat:'roles',cl:'c-ro',
     def:'Grupo de profissionais responsável pela execução técnica de campanhas. Dono de KRs de qualidade (viewability, brand safety) e eficiência (lead time, error rate).',
     ex:''},
    {name:'Account Manager (OKR)',abbr:'',cat:'roles',cl:'c-ro',
     def:'Responsável pelos KRs de relacionamento e satisfação do cliente: NPS, pontualidade de reports, cobertura de reuniões. Principal ponto de escalada.',
     ex:''},
    {name:'Analista de Dados (OKR)',abbr:'',cat:'roles',cl:'c-ro',
     def:'Responsável pelos KRs de qualidade e disponibilidade de dados: acurácia do tracking, latência de reports, cobertura de Floodlight. Viabiliza o scoring de outros KRs.',
     ex:''},
    {name:'Media Planner (OKR)',abbr:'',cat:'roles',cl:'c-ro',
     def:'Responsável pelos KRs de alcance, frequência, mix de mídia e eficiência de compra. Alinha OKRs de planejamento com objetivos de negócio do anunciante.',
     ex:''},
    {name:'Especialista de Trafficking',abbr:'',cat:'roles',cl:'c-ro',
     def:'Profissional responsável pela configuração técnica das campanhas nos ad servers (CM360, DV360). Dono de KRs de taxa de erros, setup lead time e QA de tags.',
     ex:''},
    /* PLATAFORMAS */
    {name:'Active View',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Tecnologia Google para mensuração de viewability no DV360 e CM360. Padrão MRC: 50% do criativo visível por 1s (display) ou 2s (vídeo). Reports disponíveis no CM360 Studio e DV360 Insights.',
     ex:'KR: Aumentar Active View Rate de 55% para 72% em campanhas display no DV360 no Q2'},
    {name:'Bid Shading',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Algoritmo do DV360 que reduz automaticamente os lances em leilões de primeiro preço para evitar pagar a mais. Reduz eCPM sem perder alcance. Monitorar com KRs de win rate e eCPM.',
     ex:''},
    {name:'CM360',abbr:'Campaign Manager 360',cat:'platforms',cl:'c-pl',
     def:'Ad server Google para gestão de campanhas display, vídeo, rich media e mobile. Hub central de trafficking, Floodlight, relatórios de discrepância e atribuição.',
     ex:'KR de error rate: reduzir discrepância de impressões entre CM360 e SSP abaixo de 5%'},
    {name:'Deal ID',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Identificador único de um deal programático (PMP ou PG) entre comprador e publisher. Configurado no DV360 como Inventory Source. KR: % de budget entregue via deals vs open auction.',
     ex:'Alocar 40% do budget programático via deals PMP até Q3'},
    {name:'DV360',abbr:'Display & Video 360',cat:'platforms',cl:'c-pl',
     def:'DSP Google integrada ao ecossistema GMP. Habilita compra programática de display, vídeo, áudio, CTV e DOOH. KRs de win rate, eCPM, viewability e IVT são nativos da plataforma.',
     ex:'KR: Reduzir eCPM médio no DV360 de R$3,50 para R$2,80 sem queda de viewability no Q2'},
    {name:'Floodlight (KR)',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Sistema de tracking de conversões do CM360. KRs de cobertura Floodlight medem o % de campanhas com tags ativas, testadas e reportando dados corretamente.',
     ex:'Atingir 100% de cobertura Floodlight ativa em todas as campanhas de performance no Q3'},
    {name:'Floor Price',abbr:'',cat:'platforms',cl:'c-pl',
     def:'CPM mínimo definido pelo publisher para participar do leilão. Impacta diretamente win rate e eCPM. KR: % de impressões ganhas acima do floor price esperado por tipo de inventário.',
     ex:''},
    {name:'Open Auction',abbr:'OA / RTB',cat:'platforms',cl:'c-pl',
     def:'Modalidade de compra programática aberta onde qualquer DSP pode dar lance em tempo real. Maior escala, menor controle de qualidade de inventário vs PMP.',
     ex:''},
    {name:'Pacing Algorithm (DV360)',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Algoritmo do DV360 que distribui o budget ao longo do período da campanha. Modos: ASAP (entrega máxima imediata) e Even (distribuição uniforme). KR de delivery rate depende da configuração correta.',
     ex:''},
    {name:'Private Marketplace',abbr:'PMP',cat:'platforms',cl:'c-pl',
     def:'Leilão privado entre publisher selecionado e compradores convidados. Maior controle de inventário e brand safety vs open auction. KR: % do budget em PMP como proxy de qualidade.',
     ex:'Aumentar participação de PMP de 20% para 45% do budget programático no Q4'},
    {name:'Programmatic Guaranteed',abbr:'PG',cat:'platforms',cl:'c-pl',
     def:'Modalidade de compra programática com inventário reservado a CPM fixo, sem leilão. Garante volume, placement e preço — mas sem otimização algorítmica. KR: delivery rate do PG deve ser 100%.',
     ex:''},
    {name:'Rich Media Interaction Rate',abbr:'',cat:'platforms',cl:'c-pl',
     def:'% de usuários que interagiram com um criativo rich media (expandiu, assistiu ao vídeo interno, clicou em elemento interativo). KR de engajamento em formatos premium no CM360.',
     ex:'Atingir interaction rate acima de 1,5% em formatos expansíveis em campanhas de lançamento de produto'},
    {name:'Supply Path Optimization',abbr:'SPO',cat:'platforms',cl:'c-pl',
     def:'Prática de reduzir intermediários (SSPs) entre comprador e publisher para diminuir fees, latência e risco de IVT. KR: % do budget via supply paths diretos.',
     ex:'Reduzir SSPs ativos de 12 para 5 priorizando caminhos diretos até Q3'},
    {name:'TrueView',abbr:'',cat:'platforms',cl:'c-pl',
     def:'Formato de vídeo pulável do Google (YouTube e DV360) onde o anunciante paga apenas se o usuário assistir 30s ou até o fim. CPV (custo por view) como principal KR.',
     ex:''},
    {name:'View-Through Attribution',abbr:'VTA',cat:'platforms',cl:'c-pl',
     def:'Modelo de atribuição do CM360 que credita conversões a impressões visualizadas mas não clicadas. KR: % de conversões view-through vs click-through por campanha.',
     ex:'Validar que view-through não ultrapassa 30% das conversões atribuídas em display de prospecting'},
    /* ERROS */
    {name:'KR = Tarefa',abbr:'',cat:'errors',cl:'c-er',
     def:'Erro mais comum: confundir um resultado mensurável com um entregável. Implementar ferramenta X é tarefa; Reduzir em 50% o tempo de setup é um Key Result.',
     ex:'Teste: se o KR pode ser marcado como feito no primeiro dia, é tarefa, não resultado'},
    {name:'KR Sem Baseline',abbr:'',cat:'errors',cl:'c-er',
     def:'Definir uma meta sem saber o valor atual da métrica torna o KR arbitrário e impossível de avaliar com honestidade ao final do ciclo.',
     ex:'Aumentar viewability para 70% sem saber se o baseline é 68% ou 40% — são metas completamente diferentes'},
    {name:'Check-in Ausente',abbr:'',cat:'errors',cl:'c-er',
     def:'OKRs sem acompanhamento semanal viram metas de gaveta: definidas no início do trimestre e revisadas só no fechamento.',
     ex:''},
    {name:'Objetivo Sem Inspiração',abbr:'',cat:'errors',cl:'c-er',
     def:'Objetivos operacionais não mobilizam o time. Precisam de aspiração para funcionar como ferramenta de alinhamento e motivação.',
     ex:'✅ Tornar-se a operação mais confiável da vertical | ❌ Manter processos de QA'},
    {name:'OKR Atrelado à Avaliação',abbr:'',cat:'errors',cl:'c-er',
     def:'Vincular OKRs à remuneração ou avaliação de desempenho desincentiva metas ambiciosas. As pessoas jogam seguro para proteger o bônus.',
     ex:''},
    {name:'Revisar OKR no Meio do Ciclo',abbr:'',cat:'errors',cl:'c-er',
     def:'Mudar metas no meio do ciclo sem processo formal invalida o aprendizado. Revisões são permitidas, mas exigem motivo registrado e aprovação do sponsor.',
     ex:''},
    {name:'Sandbagging',abbr:'',cat:'errors',cl:'c-er',
     def:'Prática de definir metas intencionalmente fáceis para garantir 100% de atingimento. Destrói o valor dos OKRs como ferramenta de crescimento e aprendizado.',
     ex:''},
    {name:'Times em Silos',abbr:'',cat:'errors',cl:'c-er',
     def:'OKRs definidos sem alinhamento entre AdOps, planejamento e atendimento criam conflitos de prioridade e metas contraditórias dentro da mesma operação.',
     ex:'AdOps priorizando viewability enquanto planejamento prioriza alcance bruto — sem alinhamento prévio'},
    {name:'OKRs em Excesso',abbr:'',cat:'errors',cl:'c-er',
     def:'Ter mais de 3–5 Objetivos por ciclo dispersa foco e dilui recursos. Regra prática: se tudo é prioridade, nada é prioridade.',
     ex:''},
    {name:'Top-down Sem Contexto',abbr:'',cat:'errors',cl:'c-er',
     def:'Impor OKRs de cima para baixo sem explicar o porquê gera resistência e desengajamento. O ideal é 40% top-down (direção) + 60% bottom-up (como chegar lá).',
     ex:''},
    {name:'Métricas de Vaidade',abbr:'Vanity Metrics',cat:'errors',cl:'c-er',
     def:'Métricas que crescem facilmente mas não indicam resultado real (ex: impressões brutas, pageviews sem contexto). KRs baseados nelas criam sensação de progresso sem entrega real.',
     ex:'Impressões totais podem subir sem melhora em viewability, brand safety ou conversão'}
  ],
  en: [
    /* FRAMEWORK */
    {name:'OKR',abbr:'Objectives & Key Results',cat:'framework',cl:'c-fw',
     def:'Goal-setting methodology that connects an inspirational Objective to measurable Key Results. Created at Intel by Andy Grove and popularized at Google by John Doerr.',
     ex:'Format: Objective [What + Why] + Key Results [How we measure success]'},
    {name:'OKR Cycle',abbr:'',cat:'framework',cl:'c-fw',
     def:'Execution period for OKRs. Typically quarterly (90 days) for operational teams, with annual OKRs at the strategic level.',
     ex:'Q1: Jan–Mar · Q2: Apr–Jun · Q3: Jul–Sep · Q4: Oct–Dec'},
    {name:'Cadence',abbr:'',cat:'framework',cl:'c-fw',
     def:'Frequency of tracking rituals: weekly check-in (15–30 min), monthly review and quarterly retrospective. Without cadence, OKRs become shelf targets.',
     ex:''},
    {name:'Cascading',abbr:'',cat:'framework',cl:'c-fw',
     def:'Breakdown of corporate OKRs into team and individual OKRs. Done through collaborative alignment, not hierarchical imposition.',
     ex:''},
    {name:'CFR',abbr:'Conversations, Feedback, Recognition',cat:'framework',cl:'c-fw',
     def:'Continuous practices that sustain the OKR cycle: honest conversations about progress, two-way feedback and recognition of contributions. Complement the numeric scoring.',
     ex:''},
    {name:'Committed OKR',abbr:'Roofshot',cat:'framework',cl:'c-fw',
     def:'Objective whose 100% delivery is expected and mandatory. Used for critical operations, SLAs and client contracts.',
     ex:'Campaign deliveries, brand safety compliance and contractual deadlines are roofshots'},
    {name:'Aspirational OKR',abbr:'Moonshot',cat:'framework',cl:'c-fw',
     def:'Ambitious objective where reaching 70% already represents success. Used for innovation and accelerated growth. Should not be tied to performance reviews.',
     ex:'Score 0.7 on a moonshot equals score 1.0 on a roofshot'},
    {name:'North Star Metric',abbr:'NSM',cat:'framework',cl:'c-fw',
     def:'Single metric that represents the value delivered to the client and guides all strategic decisions. All OKRs should contribute to it.',
     ex:'For a media operation: volume of qualified impressions delivered on time and within budget'},
    {name:'OKR Backlog',abbr:'',cat:'framework',cl:'c-fw',
     def:'List of candidate Objectives and KRs for future cycles. Prevents good ideas from getting lost and facilitates prioritization at the start of each quarter.',
     ex:''},
    {name:'OKR Canvas',abbr:'',cat:'framework',cl:'c-fw',
     def:'Visual tool to plan the OKR cycle: strategic context, Objectives, Key Results, owners, dependencies and risks in a single board.',
     ex:''},
    {name:'Strategic Alignment',abbr:'',cat:'framework',cl:'c-fw',
     def:'Ensuring that team and individual OKRs support organizational objectives. Prevents teams from optimizing locally at the expense of the whole.',
     ex:''},
    {name:'Team OKR',abbr:'',cat:'framework',cl:'c-fw',
     def:'Set of Objectives and Key Results under collective responsibility of a squad, area or cell. Unlike individual OKR, it belongs to the group.',
     ex:''},
    {name:'Two-Way Alignment',abbr:'Bottom-up + Top-down',cat:'framework',cl:'c-fw',
     def:'Ideal cascading model: leadership sets direction (top-down) and teams define how to get there (bottom-up). Suggested ratio: 40% top-down / 60% bottom-up.',
     ex:''},
    /* OBJECTIVES */
    {name:'Objective',abbr:'',cat:'objective',cl:'c-obj',
     def:'Qualitative and inspirational statement of what you want to achieve. Answers the what and the why. Not a task, contains no number, and does not describe an output.',
     ex:'Correct: Elevate the quality of digital campaign delivery | Wrong: Implement a QA checklist'},
    {name:'Action Verb',abbr:'',cat:'objective',cl:'c-obj',
     def:'Effective objectives start with a strong verb that signals transformation: Elevate, Transform, Become, Lead, Conquer, Establish as the benchmark.',
     ex:'Avoid: Maintain, Ensure, Continue — these verbs do not indicate growth'},
    {name:'Business Objective vs Task',abbr:'',cat:'objective',cl:'c-obj',
     def:'A business objective measures impact on the client or result. A task-objective describes an internal deliverable. Only the first is a legitimate OKR Objective.',
     ex:'Business: Become the most reliable operation in the market | Task: Create process documentation'},
    {name:'Qualitative',abbr:'',cat:'objective',cl:'c-obj',
     def:'Essential characteristic of the Objective: it describes a direction or aspiration, never a number. Numbers belong to Key Results.',
     ex:''},
    {name:'Sweat Test',abbr:'',cat:'objective',cl:'c-obj',
     def:'Test to validate whether an Objective is ambitious enough: when reading it, does the team feel slight discomfort? If not, it is probably too easy.',
     ex:''},
    /* KEY RESULTS */
    {name:'Key Result',abbr:'KR',cat:'kr',cl:'c-kr',
     def:'Measurable result that indicates whether the Objective is being achieved. Must be specific, with baseline, target and deadline. Recommended: 2 to 5 KRs per Objective.',
     ex:'Format: [Metric] from [baseline] to [target] by [date]'},
    {name:'Baseline',abbr:'',cat:'kr',cl:'c-kr',
     def:'Current value of a metric before the cycle begins. Without a baseline it is impossible to measure real progress. Mandatory before defining any KR.',
     ex:''},
    {name:'Brand Safety Score',abbr:'BSS',cat:'kr',cl:'c-kr',
     def:'% of impressions served in environments aligned with brand guidelines. KR for image protection and compliance with advertiser policies.',
     ex:'Maintain Brand Safety Score above 95% across 100% of client campaigns'},
    {name:'Budget Utilization',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of total budget committed and invested in the period. Financial KR and media planning efficiency indicator.',
     ex:'Achieve 97% budget utilization across the client portfolio at end of each quarter'},
    {name:'Confidence Score',abbr:'',cat:'kr',cl:'c-kr',
     def:'Weekly estimate (0–10) of the team\'s confidence that it will hit the KR. A sudden drop is an early warning signal before the numeric score falls.',
     ex:'Confidence 7/10 at start, 4/10 at week 6 — trigger for urgent review'},
    {name:'CTR (KR)',abbr:'Click-Through Rate',cat:'kr',cl:'c-kr',
     def:'% of clicks over impressions. Used as a KR when the objective is driving qualified traffic. Caution: high CTR in the wrong context is a vanity metric.',
     ex:'Maintain CTR above 0.15% on rich media formats in awareness campaigns'},
    {name:'Delivery Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of budget delivered vs planned at campaign end. KR for pacing efficiency. Typical target: 95–105%.',
     ex:'Achieve delivery rate between 98% and 102% across 90% of portfolio campaigns'},
    {name:'eCPM (KR)',abbr:'Effective CPM',cat:'kr',cl:'c-kr',
     def:'Effective cost per thousand qualified impressions delivered. KR for programmatic media buying efficiency.',
     ex:'Reduce average eCPM from $3.50 to $2.80 without losing viewability'},
    {name:'IVT Rate',abbr:'Invalid Traffic',cat:'kr',cl:'c-kr',
     def:'% of invalid traffic (bots, fraudulent clicks) identified in the campaign. Target: below 10% (IAB standard).',
     ex:'Keep IVT rate below 5% across all programmatic campaigns in the quarter'},
    {name:'Outcome vs Output',abbr:'',cat:'kr',cl:'c-kr',
     def:'Output: delivery of a task. Outcome: behavior change or business result. KRs measure outcomes, never outputs.',
     ex:'Output: Publish viewability report | Outcome: Average viewability above 70%'},
    {name:'Report Coverage',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of active campaigns with performance reports delivered within the agreed SLA. KR for client service excellence.',
     ex:'Achieve 100% on-time report delivery in Q4'},
    {name:'Scoring',abbr:'',cat:'kr',cl:'c-kr',
     def:'Score from 0 to 1 (or 0–100%) indicating the degree to which a KR was achieved. 0.7–1.0 = great; 0.4–0.6 = acceptable; below 0.4 = urgent review needed.',
     ex:'Score 0.7 on a moonshot = 70% of an ambitious objective — valid and expected'},
    {name:'Setup Lead Time',abbr:'',cat:'kr',cl:'c-kr',
     def:'Average time between receiving a brief and the campaign going live. KR for operational efficiency — measures the agility of the AdOps team.',
     ex:'Reduce average setup lead time from 5 business days to 2 days in Q3'},
    {name:'Share of Voice',abbr:'SOV',cat:'kr',cl:'c-kr',
     def:'% of advertiser impressions over the total market/segment. KR for media dominance. Correlated with market share.',
     ex:''},
    {name:'Target',abbr:'',cat:'kr',cl:'c-kr',
     def:'Goal value the KR must reach by end of cycle. Should be ambitious enough to require effort, yet achievable with available focus and resources.',
     ex:''},
    {name:'Trafficking Error Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of tags or creatives with issues detected during serving: server errors, broken redirects, unapproved creatives.',
     ex:'Reduce trafficking error rate from 8% to 2% by end of quarter'},
    {name:'Video Completion Rate',abbr:'VCR',cat:'kr',cl:'c-kr',
     def:'% of videos watched to completion (100% of duration). Indicates quality of attention and affinity with the creative. KR for video campaign engagement.',
     ex:'Increase average VCR from 35% to 50% on in-stream formats in Q4'},
    {name:'Viewability — Display',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of display impressions viewable per MRC standard: 50% of creative visible for at least 1 second. Benchmarks: 300x250 ~58% · 728x90 ~52% · 970x250 ~65%.',
     ex:'Increase average viewability from 55% to 72% on display campaigns in Q2'},
    {name:'Viewability — Video',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of video impressions viewable per MRC standard: 50% of player visible for at least 2 seconds. Pre-roll in-stream typically reaches 80%+; outstream hovers at 50–60%.',
     ex:'Maintain video viewability above 75% on pre-roll in-stream formats in DV360'},
    {name:'Win Rate',abbr:'',cat:'kr',cl:'c-kr',
     def:'% of programmatic auctions won over total auctions entered. KR for competitiveness and bid efficiency. Too high may indicate under-refined targeting.',
     ex:'Maintain win rate between 15% and 35% on prospecting campaigns in DV360'},
    /* CHECK-IN */
    {name:'Weekly Check-in',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Short meeting (15–30 min) to track KRs: what advanced, what is at risk, what blockers need attention. Not a task status meeting.',
     ex:''},
    {name:'Monthly Review',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Deeper analysis of OKRs: current scoring, deviations, course corrections and cross-team alignment. Opportunity to escalate blockers to leadership.',
     ex:''},
    {name:'Quarterly Retrospective',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Cycle closing: what worked, what did not, what we learned and which OKRs carry into the next cycle. Final score + documented lessons.',
     ex:''},
    {name:'Blocker Escalation',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Process of bringing to the executive sponsor a blocker the team cannot resolve alone. Should happen before the KR becomes compromised.',
     ex:'Client creative approval dependency blocking campaign launch → escalate at monthly review'},
    {name:'Health Check',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Qualitative status assessment of a KR: 🟢 on track · 🟡 at risk · 🔴 compromised. Complements numeric scoring and facilitates prioritization.',
     ex:''},
    {name:'Mid-Cycle Review',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Review at the halfway point of the cycle (week 6–7 of a quarter) to assess whether OKRs are still relevant. Allows target adjustment if context has changed.',
     ex:''},
    {name:'OKR Log',abbr:'',cat:'checkin',cl:'c-ci',
     def:'Written record of each KR update at every check-in: current score, confidence, what happened this week and next steps. The living memory of the cycle.',
     ex:''},
    {name:'Off-Track',abbr:'',cat:'checkin',cl:'c-ci',
     def:'When a KR diverges significantly from the expected pace. Requires root-cause analysis and a recovery plan recorded in the OKR log.',
     ex:'Viewability dropping below projection → investigate SSPs, formats and placements'},
    /* ROLES */
    {name:'OKR Owner',abbr:'',cat:'roles',cl:'c-ro',
     def:'Person responsible for a specific Objective or KR. Updates progress at check-ins, escalates blockers and is accountable for the final cycle result.',
     ex:''},
    {name:'OKR Champion',abbr:'',cat:'roles',cl:'c-ro',
     def:'OKR process facilitator in the organization or team. Ensures cadence, goal quality, method adherence and practice evolution across cycles.',
     ex:''},
    {name:'Executive Sponsor',abbr:'',cat:'roles',cl:'c-ro',

var $ = function(id){return document.getElementById(id)};
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ')}

var lang = 'pt';
try{ var saved=localStorage.getItem('okr-ref-lang'); if(saved==='en') lang='en'; }catch(e){}

var activeCat='all', searchText='';

function getTerms(){ return TERMS[lang]; }

function getFiltered(){
  return getTerms().filter(function(t){
    if(activeCat!=='all' && t.cat!==activeCat) return false;
    if(searchText){
      var q=normalize(searchText);
      var hay=normalize([t.name,t.abbr||'',t.def,t.ex||''].join(' '));
      return hay.indexOf(q)>-1;
    }
    return true;
  });
}

function renderUI(){
  var u=UI[lang];
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
  document.title=u.pageTitle;
  $('heroTitle').textContent=u.heroTitle;
  $('heroSub').textContent=u.heroSub;
  $('search').placeholder=u.searchPH;
  $('modalTitle').textContent=u.modalTitle;
  $('modalTip').textContent=u.modalTip;
  $('helpBtn').textContent=u.helpBtn;
  // modal steps
  $('modalSteps').innerHTML=u.modalSteps.map(function(s,i){
    return '<div class="modal-step"><div class="step-n">'+(i+1)+'</div><div class="step-t"><strong>'+s[0]+'</strong> '+s[1]+'</div></div>';
  }).join('');
  // legend chips
  var lc=[['c-fw','c-obj','c-kr','c-ci','c-ro','c-pl','c-er']];
  $('legend').innerHTML=u.legend.map(function(l,i){
    var cls=['c-fw','c-obj','c-kr','c-ci','c-ro','c-pl','c-er'][i];
    return '<span class="lchip '+cls+'">'+l+'</span>';
  }).join('');
  // filters
  $('filters').innerHTML='<button class="filter-btn'+(activeCat==='all'?' active':'')+'" data-cat="all">'+u.filterAll+'</button>'
    +u.filters.map(function(f){
      return '<button class="filter-btn'+(activeCat===f.cat?' active':'')+'" data-cat="'+f.cat+'">'+f.label+'</button>';
    }).join('');
  // re-attach filter events
  var btns=document.querySelectorAll('#filters .filter-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click',function(){
      activeCat=this.dataset.cat;
      for(var j=0;j<btns.length;j++) btns[j].classList.remove('active');
      this.classList.add('active');
      renderGrid();
    });
  }
  // lang buttons
  $('btnPT').classList.toggle('active', lang==='pt');
  $('btnEN').classList.toggle('active', lang==='en');
  renderGrid();
}

function renderGrid(){
  var u=UI[lang];
  var f=getFiltered();
  $('statsBar').textContent=f.length+' '+u.statsOf+' '+getTerms().length+' '+u.statsTerms;
  if(!f.length){
    $('grid').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">'+u.empty+'</div><div>'+u.emptyHint+'</div></div>';
    updateAZBar({});
    return;
  }
  var byLetter={};
  f.forEach(function(t){
    var letter=t.name[0].toUpperCase();
    if(!byLetter[letter]) byLetter[letter]=[];
    byLetter[letter].push(t);
  });
  var html='';
  Object.keys(byLetter).sort().forEach(function(letter){
    html+='<div class="letter-section" id="letter-'+letter+'">'
      +'<div class="letter-heading"><h2>'+letter+'</h2><hr></div>'
      +'<div class="terms-grid">';
    byLetter[letter].forEach(function(t){
      var label=u.catLabels[t.cat]||t.cat;
      html+='<div class="card">'
        +'<div class="card-head"><div class="card-name">'+t.name+'</div>'
        +(t.abbr?'<div class="card-abbr">'+t.abbr+'</div>':'')
        +'</div>'
        +'<span class="card-cat '+t.cl+'">'+label+'</span>'
        +'<div class="card-def">'+t.def+'</div>'
        +(t.ex?'<div class="card-ex">'+t.ex+'</div>':'')
        +'</div>';
    });
    html+='</div></div>';
  });
  $('grid').innerHTML=html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter){
  var bar=$('azBar');
  var all='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  bar.innerHTML=all.map(function(l){
    if(byLetter&&byLetter[l]) return '<a class="az-btn" href="#letter-'+l+'">'+l+'</a>';
    return '<span class="az-btn disabled">'+l+'</span>';
  }).join('');
}

function setLang(l){
  lang=l; activeCat='all'; searchText=''; $('search').value='';
  try{localStorage.setItem('okr-ref-lang',l);}catch(e){}
  renderUI();
}

$('search').addEventListener('input',function(){
  searchText=this.value.trim();
  renderGrid();
});

var dark=false;
try{dark=localStorage.getItem('okr-ref-theme')==='dark';}catch(e){}
function applyTheme(){
  document.documentElement.dataset.theme=dark?'dark':'';
  $('themeBtn').textContent=dark?UI[lang].light:UI[lang].dark;
  try{localStorage.setItem('okr-ref-theme',dark?'dark':'light');}catch(e){}
}
applyTheme();
$('themeBtn').addEventListener('click',function(){dark=!dark;applyTheme();});

$('helpBtn').addEventListener('click',function(){$('overlay').classList.add('open');});
$('modalClose').addEventListener('click',function(){$('overlay').classList.remove('open');});
$('overlay').addEventListener('click',function(e){if(e.target===$('overlay'))$('overlay').classList.remove('open');});

renderUI();
