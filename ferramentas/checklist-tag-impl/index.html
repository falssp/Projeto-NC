<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Implementação de Tag</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1a237e;--accent:#1F36C7;--hl:#e8ecfd;--border:#d6dbf2;--bg:#f4f5fb;--white:#fff;--red:#d32f2f;--yellow:#f57c00;--green:#2e7d32;--gray:#607d8b}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:#1a1a2e;min-height:100vh}
header{background:var(--blue);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
header h1{font-size:1.25rem;font-weight:700;letter-spacing:.3px}
header .subtitle{font-size:.8rem;opacity:.7;margin-top:2px}
.env-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.env-badge.prod{background:#c62828;border-color:#ef5350}
.main{padding:28px 32px;min-width:0}
.meta-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:900px){.meta-row{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.meta-row{grid-template-columns:1fr}}
.meta-row label{display:block;font-size:.75rem;font-weight:600;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.meta-row input,.meta-row select{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--white)}
.meta-row input:focus,.meta-row select:focus{outline:none;border-color:var(--accent)}
.progress-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.progress-label{font-size:.9rem;font-weight:600;white-space:nowrap;min-width:140px}
.progress-bar-bg{flex:1;height:10px;background:#e0e0e0;border-radius:10px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:10px;transition:width .3s ease}
.progress-pct{font-size:.85rem;font-weight:700;color:var(--accent);white-space:nowrap;min-width:50px;text-align:right}
.campaign-selector{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.campaign-selector label{font-size:.8rem;font-weight:600;color:var(--gray)}
.campaign-selector select{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;background:var(--white)}
.btn-sm{padding:6px 14px;border:none;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--hl);color:var(--accent);transition:all .15s}
.btn-sm:hover{background:var(--accent);color:#fff}
.btn-sm.danger{background:#ffebee;color:#c62828}
.btn-sm.danger:hover{background:#c62828;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 18px;border:none;background:transparent;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;transition:all .15s;white-space:nowrap}
.tab:hover{background:var(--hl);color:var(--accent)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--hl)}
.tab-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 6px;margin-left:5px;vertical-align:middle}
.tab-badge.done{background:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.section{margin-bottom:28px}
.section-title{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:8px}
.section-pct{font-size:.75rem;font-weight:600;color:var(--gray);text-transform:none;letter-spacing:0}
.item{background:var(--white);border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.item:hover{border-color:#b0bde8}
.item.checked{background:#f0fdf4;border-color:#a7d7a9}
.item-main{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
.item-cb{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;margin-top:2px;cursor:pointer}
.item-body{flex:1;min-width:0}
.item-label{font-size:.9rem;font-weight:500;line-height:1.4}
.item.checked .item-label{text-decoration:line-through;color:var(--gray)}
.item-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.priority{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:10px}
.p-critico{background:#ffebee;color:#c62828}
.p-importante{background:#fff8e1;color:#f57c00}
.p-extra{background:#f5f5f5;color:var(--gray)}
.expand-btn{font-size:.75rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 6px;font-family:inherit}
.item-detail{display:none;padding:0 14px 12px 44px;font-size:.82rem;color:#555;line-height:1.6;border-top:1px solid var(--border)}
.item-detail.open{display:block}
.item-detail strong{color:var(--accent)}
.item-note{margin-top:8px}
.item-note input{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:.8rem;background:var(--bg)}
.item-note input:focus{outline:none;border-color:var(--accent)}
.footer-actions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1629a0}
.btn-secondary{background:var(--hl);color:var(--accent);border:1.5px solid var(--border)}
.btn-secondary:hover{background:var(--accent);color:#fff}
.btn-danger{background:#ffebee;color:#c62828;border:1.5px solid #ffcdd2}
.btn-danger:hover{background:#c62828;color:#fff}
@media print{header .env-badge,.campaign-selector,.tabs,.footer-actions,.expand-btn,.item-note input{display:none!important}.tab-panel{display:block!important}.main{padding:16px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>✅ Checklist de Implementação de Tag</h1>
    <div class="subtitle">Verificação pré-campanha — CM360, Meta, Google, TikTok, LinkedIn</div>
  </div>
  <button class="env-badge" id="envToggle" onclick="toggleEnv()">🧪 Homologação</button>
</header>
<div class="main">
  <div class="campaign-selector">
    <label>Campanha ativa:</label>
    <select id="campaignSelect" onchange="switchCampaign()"></select>
    <button class="btn-sm" onclick="newCampaign()">+ Nova</button>
    <button class="btn-sm danger" onclick="deleteCampaign()">Excluir</button>
  </div>
  <div class="meta-row">
    <div>
      <label>Nome da Campanha / Projeto</label>
      <input type="text" id="campName" placeholder="Ex: Campanha Verão 2026" oninput="saveMeta()">
    </div>
    <div>
      <label>Responsável pela Implementação</label>
      <input type="text" id="respName" placeholder="Seu nome" oninput="saveMeta()">
    </div>
    <div>
      <label>Data de Verificação</label>
      <input type="date" id="verDate" oninput="saveMeta()">
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">Progresso geral: <span id="progressText">0 / 0</span></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div id="tabPanels"></div>
  <div class="footer-actions">
    <button class="btn btn-primary" onclick="copyReport()">📋 Copiar relatório de verificação</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨️ Exportar PDF</button>
    <button class="btn btn-danger" onclick="clearCampaign()">🗑️ Limpar verificação</button>
  </div>
</div>

let campaigns = JSON.parse(localStorage.getItem('tagChecklist_campaigns') || '[]');
let currentCampaignId = localStorage.getItem('tagChecklist_current') || null;

function initApp() {
  if (campaigns.length === 0) newCampaign(false);
  else loadCampaign(currentCampaignId || campaigns[0].id);
  renderTabs();
}

function newCampaign(autoLoad=true) {
  const id = 'c_' + Date.now();
  const today = new Date().toISOString().split('T')[0];
  campaigns.push({id, name:'Nova verificação', resp:'', date:today, env:'homo', states:{}, notes:{}});
  if (campaigns.length > 5) campaigns.shift();
  saveCampaigns();
  if (autoLoad) loadCampaign(id);
  renderCampaignSelector();
}

function deleteCampaign() {
  if (campaigns.length <= 1) { alert('Deve haver ao menos uma verificação.'); return; }
  if (!confirm('Excluir esta verificação?')) return;
  campaigns = campaigns.filter(c => c.id !== currentCampaignId);
  saveCampaigns();
  loadCampaign(campaigns[0].id);
  renderCampaignSelector();
}

function switchCampaign() {
  loadCampaign(document.getElementById('campaignSelect').value);
}

function loadCampaign(id) {
  currentCampaignId = id;
  localStorage.setItem('tagChecklist_current', id);
  const c = campaigns.find(x => x.id === id);
  if (!c) return;
  document.getElementById('campName').value = c.name;
  document.getElementById('respName').value = c.resp;
  document.getElementById('verDate').value = c.date;
  const envBtn = document.getElementById('envToggle');
  if (c.env === 'prod') { envBtn.textContent = '🚀 Produção'; envBtn.classList.add('prod'); }
  else { envBtn.textContent = '🧪 Homologação'; envBtn.classList.remove('prod'); }
  renderCampaignSelector();
  buildPanels();
  updateProgress();
}

function renderCampaignSelector() {
  const sel = document.getElementById('campaignSelect');
  sel.innerHTML = campaigns.map(c => `<option value="${c.id}"${c.id===currentCampaignId?' selected':''}>${c.name||'(sem nome)'}</option>`).join('');
}

function saveMeta() {
  const c = campaigns.find(x => x.id === currentCampaignId);
  if (!c) return;
  c.name = document.getElementById('campName').value;
  c.resp = document.getElementById('respName').value;
  c.date = document.getElementById('verDate').value;
  saveCampaigns();
  renderCampaignSelector();
}

function toggleEnv() {
  const c = campaigns.find(x => x.id === currentCampaignId);
  const btn = document.getElementById('envToggle');
  if (c.env === 'homo') { c.env = 'prod'; btn.textContent = '🚀 Produção'; btn.classList.add('prod'); }
  else { c.env = 'homo'; btn.textContent = '🧪 Homologação'; btn.classList.remove('prod'); }
  saveCampaigns();
}

function saveCampaigns() { localStorage.setItem('tagChecklist_campaigns', JSON.stringify(campaigns)); }

function getState(tabId, secIdx, itemIdx) {
  const c = campaigns.find(x => x.id === currentCampaignId);
  return (c?.states?.[`${tabId}_${secIdx}_${itemIdx}`]) || false;
}
function getNote(tabId, secIdx, itemIdx) {
  const c = campaigns.find(x => x.id === currentCampaignId);
  return (c?.notes?.[`${tabId}_${secIdx}_${itemIdx}`]) || '';
}
function setState(tabId, secIdx, itemIdx, val) {
  const c = campaigns.find(x => x.id === currentCampaignId);
  if (!c.states) c.states = {};
  c.states[`${tabId}_${secIdx}_${itemIdx}`] = val;
  saveCampaigns();
}
function setNote(tabId, secIdx, itemIdx, val) {
  const c = campaigns.find(x => x.id === currentCampaignId);
  if (!c.notes) c.notes = {};
  c.notes[`${tabId}_${secIdx}_${itemIdx}`] = val;
  saveCampaigns();
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TABS_DATA.map((t,i) => `<button class="tab${i===0?' active':''}" onclick="switchTab(${i})" id="tab_${i}">${t.label}<span class="tab-badge" id="badge_${i}">0</span></button>`).join('');
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

function buildPanels() {
  const container = document.getElementById('tabPanels');
  container.innerHTML = '';
  TABS_DATA.forEach((tab, ti) => {
    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (ti===0?' active':'');
    panel.id = 'panel_' + ti;
    tab.sections.forEach((sec, si) => {
      const secDiv = document.createElement('div');
      secDiv.className = 'section';
      secDiv.innerHTML = `<div class="section-title">${sec.title} <span class="section-pct" id="spct_${tab.id}_${si}"></span></div>`;
      sec.items.forEach((item, ii) => {
        const checked = getState(tab.id, si, ii);
        const note = getNote(tab.id, si, ii);
        const pClass = item.p==='critico'?'p-critico':item.p==='importante'?'p-importante':'p-extra';
        const pLabel = item.p==='critico'?'🔴 Crítico':item.p==='importante'?'🟡 Importante':'⚪ Extra';
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item' + (checked?' checked':'');
        itemDiv.id = `item_${tab.id}_${si}_${ii}`;
        itemDiv.innerHTML = `
          <div class="item-main" onclick="toggleItem('${tab.id}',${si},${ii})">
            <input type="checkbox" class="item-cb" ${checked?'checked':''} onclick="e=>{e.stopPropagation();toggleItem('${tab.id}',${si},${ii})}">
            <div class="item-body">
              <div class="item-label">${item.t}</div>
              <div class="item-meta">
                <span class="priority ${pClass}">${pLabel}</span>
                <button class="expand-btn" onclick="event.stopPropagation();toggleDetail('detail_${tab.id}_${si}_${ii}')">▼ Como verificar</button>
              </div>
            </div>
          </div>
          <div class="item-detail" id="detail_${tab.id}_${si}_${ii}">
            <strong>Como verificar:</strong> ${item.how}
            <div class="item-note">
              <input type="text" placeholder="Notas / observações..." value="${note.replace(/"/g,'&quot;')}" oninput="setNote('${tab.id}',${si},${ii},this.value)" onclick="event.stopPropagation()">
            </div>
          </div>`;
        secDiv.appendChild(itemDiv);
      });
      panel.appendChild(secDiv);
    });
    container.appendChild(panel);
  });
  updateProgress();
}

function toggleItem(tabId, si, ii) {
  const key = `item_${tabId}_${si}_${ii}`;
  const el = document.getElementById(key);
  const cb = el.querySelector('.item-cb');
  const newVal = !cb.checked;
  cb.checked = newVal;
  el.classList.toggle('checked', newVal);
  setState(tabId, si, ii, newVal);
  updateProgress();
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function updateProgress() {
  let total = 0, done = 0;
  TABS_DATA.forEach((tab, ti) => {
    let tabTotal = 0, tabDone = 0;
    tab.sections.forEach((sec, si) => {
      let secTotal = sec.items.length, secDone = 0;
      sec.items.forEach((_, ii) => {
        total++; tabTotal++;
        if (getState(tab.id, si, ii)) { done++; tabDone++; secDone++; }
      });
      const spct = document.getElementById(`spct_${tab.id}_${si}`);
      if (spct) spct.textContent = `${secDone}/${secTotal}`;
    });
    const badge = document.getElementById(`badge_${ti}`);
    if (badge) {
      badge.textContent = `${tabDone}/${tabTotal}`;
      badge.className = 'tab-badge' + (tabDone===tabTotal&&tabTotal>0?' done':'');
    }
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function clearCampaign() {
  if (!confirm('Limpar todos os itens verificados desta campanha?')) return;
  const c = campaigns.find(x => x.id === currentCampaignId);
  c.states = {}; c.notes = {};
  saveCampaigns();
  buildPanels();
}

function copyReport() {
  const c = campaigns.find(x => x.id === currentCampaignId);
  let lines = [];
  lines.push('RELATÓRIO DE VERIFICAÇÃO DE TAGS');
  lines.push('═'.repeat(50));
  lines.push(`Campanha: ${c.name||'(sem nome)'}`);
  lines.push(`Responsável: ${c.resp||'—'}`);
  lines.push(`Data: ${c.date||'—'}`);
  lines.push(`Ambiente: ${c.env==='prod'?'Produção':'Homologação'}`);
  lines.push('');
  TABS_DATA.forEach(tab => {
    let tabItems = [], pendentes = [];
    tab.sections.forEach((sec, si) => {
      sec.items.forEach((item, ii) => {
        const checked = getState(tab.id, si, ii);
        const note = getNote(tab.id, si, ii);
        tabItems.push({checked, label:item.t, note});
        if (!checked) pendentes.push(item.t);
      });
    });
    const done = tabItems.filter(x=>x.checked).length;
    lines.push(`\n── ${tab.label.toUpperCase()} (${done}/${tabItems.length}) ──`);
    tabItems.forEach(it => {
      lines.push(`  ${it.checked?'[✓]':'[ ]'} ${it.label}`);
      if (it.note) lines.push(`       Nota: ${it.note}`);
    });
  });
  lines.push('\n' + '═'.repeat(50));
  lines.push('Gerado por NC Tool — AdOps Suite | ' + new Date().toLocaleDateString('pt-BR'));
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copiado!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

initApp();
</script>
</body>
</html>
