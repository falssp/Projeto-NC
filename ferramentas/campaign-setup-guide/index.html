<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdOps Campaign Setup Guide · StormX</title>
<style>
:root{
  --azul:#1F36C7;--azul-escuro:#1a237e;--azul-light:#e8ecfd;
  --cinza:#f4f5fb;--borda:#d6dbf2;
  --ok:#1b8a3a;--erro:#c0392b;--warn:#9a7b00;
  --sidebar-w:220px;--header-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cinza);color:#222;min-height:100vh;}

/* HEADER */
.header{background:var(--azul-escuro);color:#fff;padding:0 24px;height:var(--header-h);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200;}
.header h1{font-size:16px;font-weight:700;}
.header .badge{font-size:10px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:20px;}
.header .ver{font-size:10px;opacity:.5;margin-left:auto;}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--borda);padding:12px 0 24px;flex-shrink:0;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;}
.sb-group{padding:14px 14px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#aaa;}
.plat-btn{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:13px;font-weight:500;color:#333;transition:background .1s;}
.plat-btn:hover{background:var(--cinza);}
.plat-btn.active{background:var(--azul-light);color:var(--azul);font-weight:700;}
.plat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.plat-tag{font-size:9px;background:#eee;color:#888;padding:1px 5px;border-radius:3px;margin-left:auto;flex-shrink:0;}

/* MAIN */
.main{flex:1;padding:24px;min-width:0;}

/* PLATFORM HEADER */
.plat-header{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:18px 22px;margin-bottom:20px;display:flex;align-items:center;gap:16px;}
.plat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.plat-header-info h2{font-size:18px;color:var(--azul-escuro);margin-bottom:3px;}
.plat-header-info p{font-size:13px;color:#666;margin-bottom:4px;}
.plat-header-info a{font-size:12px;color:var(--azul);text-decoration:none;}
.plat-header-info a:hover{text-decoration:underline;}

/* STEPS NAV */
.steps-nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
.step-btn{padding:7px 13px;border:1.5px solid var(--borda);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:#555;display:flex;align-items:center;gap:6px;transition:all .1s;}
.step-btn:hover{background:var(--cinza);}
.step-btn.active{background:var(--azul);color:#fff;border-color:var(--azul);}
.step-num{width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.step-btn.active .step-num{background:rgba(255,255,255,.25);}

/* STEP CONTENT */
.step-content{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;}
.step-ch{padding:14px 22px;border-bottom:1px solid var(--borda);background:var(--azul-light);}
.step-ch h3{font-size:15px;color:var(--azul-escuro);margin-bottom:2px;}
.step-ch p{font-size:13px;color:#555;}

/* CAMPO */
.campo{border-bottom:1px solid var(--borda);}
.campo:last-child{border-bottom:none;}
.campo-h{padding:12px 22px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none;}
.campo-h:hover{background:#fafbff;}
.campo-label{font-weight:600;font-size:13px;line-height:1.3;}
.campo-meta{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;line-height:1.4;}
.tag-req{background:#fde8e8;color:var(--erro);}
.tag-opt{background:#e8f4ea;color:var(--ok);}
.tag-onde{background:#eef0fa;color:#333;}
.tag-tipo{background:#fff3e0;color:#a85600;}
.campo-arr{color:#bbb;font-size:12px;margin-top:2px;flex-shrink:0;transition:transform .2s;}
.campo-arr.open{transform:rotate(180deg);}
.campo-body{display:none;padding:0 22px 14px 22px;}
.campo-body.open{display:block;}
.campo-opts strong{font-size:10px;text-transform:uppercase;color:#aaa;letter-spacing:.05em;}
.campo-opts ul{margin:4px 0 0 16px;font-size:13px;color:#444;line-height:1.8;}
.campo-dica{margin-top:10px;padding:8px 12px;background:#fffbea;border-left:3px solid #f0c040;font-size:12px;color:#5a4500;border-radius:0 4px 4px 0;line-height:1.6;}
.campo-dica strong{color:#a07000;}

/* NAV BUTTONS */
.nav-btns{display:flex;gap:10px;margin-top:16px;}
.btn-prev{padding:9px 18px;border:1.5px solid var(--borda);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:#555;}
.btn-next{padding:9px 18px;border:none;background:var(--azul);color:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-prev:hover{background:var(--cinza);}
.btn-next:hover{opacity:.9;}

/* WELCOME */
.welcome{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:40px;text-align:center;}
.welcome h2{font-size:20px;color:var(--azul-escuro);margin-bottom:10px;}
.welcome p{font-size:14px;color:#666;line-height:1.7;max-width:500px;margin:0 auto;}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:28px;}
.plat-card{border:1.5px solid var(--borda);border-radius:8px;padding:14px 10px;cursor:pointer;text-align:center;transition:border-color .15s,box-shadow .15s;}
.plat-card:hover{border-color:var(--azul);box-shadow:0 2px 8px rgba(31,54,199,.12);}
.plat-card .pc-icon{font-size:26px;margin-bottom:6px;}
.plat-card .pc-name{font-size:12px;font-weight:600;color:#333;}
.plat-card .pc-sub{font-size:10px;color:#999;margin-top:2px;}
</style>
</head>

/* ============================================================
   GRUPOS / ORDEM
   ============================================================ */
const GRUPOS = {
  "Ad Server": ["cm360","dv360"],
  "Search / Display": ["googleads"],
  "Social": ["meta","linkedin","tiktok","xads"]
};

/* ============================================================
   STATE
   ============================================================ */
let platAtual = null;
let stepAtual = 0;

/* ============================================================
   SIDEBAR
   ============================================================ */
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  for(const [grupo, ids] of Object.entries(GRUPOS)){
    const g = document.createElement('div');
    g.className = 'sb-group';
    g.textContent = grupo;
    sb.appendChild(g);
    ids.forEach(id => {
      const p = PLATAFORMAS[id];
      const btn = document.createElement('button');
      btn.className = 'plat-btn' + (platAtual === id ? ' active' : '');
      btn.onclick = () => selecionar(id);
      const dot = document.createElement('span');
      dot.className = 'plat-dot';
      dot.style.background = p.cor;
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(p.nome));
      if(p.status !== 'full'){
        const t = document.createElement('span');
        t.className = 'plat-tag';
        t.textContent = p.status === 'partial' ? 'Parcial' : 'Em breve';
        btn.appendChild(t);
      }
      sb.appendChild(btn);
    });
  }
}

/* ============================================================
   SELECT
   ============================================================ */
function selecionar(id){
  platAtual = id;
  stepAtual = 0;
  renderSidebar();
  renderMain();
  window.scrollTo(0,0);
}

/* ============================================================
   MAIN
   ============================================================ */
function renderMain(){
  const main = document.getElementById('main');
  if(!platAtual){ renderWelcome(); return; }
  const p = PLATAFORMAS[platAtual];
  main.innerHTML = '';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'plat-header';
  hdr.innerHTML = `
    <div class="plat-icon" style="background:${p.cor}18">${p.emoji}</div>
    <div class="plat-header-info">
      <h2>${p.nome}</h2>
      <p>${p.descricao}</p>
      <a href="${p.url}" target="_blank" rel="noopener">↗ Abrir plataforma</a>
    </div>
  `;
  main.appendChild(hdr);

  // Steps nav
  const nav = document.createElement('div');
  nav.className = 'steps-nav';
  p.steps.forEach((s,i) => {
    const b = document.createElement('button');
    b.className = 'step-btn' + (stepAtual===i?' active':'');
    b.innerHTML = `<span class="step-num">${i+1}</span>${s.icone} ${s.titulo}`;
    b.onclick = () => { stepAtual=i; renderMain(); };
    nav.appendChild(b);
  });
  main.appendChild(nav);

  // Step content
  const step = p.steps[stepAtual];
  const box = document.createElement('div');
  box.className = 'step-content';
  const ch = document.createElement('div');
  ch.className = 'step-ch';
  ch.innerHTML = `<h3>${step.icone} ${step.titulo}</h3>${step.descricao?`<p>${step.descricao}</p>`:''}`;
  box.appendChild(ch);

  step.campos.forEach((c,i) => {
    const sec = document.createElement('div');
    sec.className = 'campo';
    const h = document.createElement('div');
    h.className = 'campo-h';
    h.onclick = () => toggle(i);
    h.innerHTML = `
      <div style="flex:1">
        <div class="campo-label">${c.label}</div>
        <div class="campo-meta">
          <span class="tag ${c.obrigatorio?'tag-req':'tag-opt'}">${c.obrigatorio?'Obrigatório':'Opcional'}</span>
          ${c.onde?`<span class="tag tag-onde">📍 ${c.onde}</span>`:''}
          ${c.tipo?`<span class="tag tag-tipo">⚙ ${c.tipo}</span>`:''}
        </div>
      </div>
      <span class="campo-arr" id="arr-${i}">▼</span>
    `;
    sec.appendChild(h);
    const body = document.createElement('div');
    body.className = 'campo-body';
    body.id = 'cb-'+i;
    if(c.opcoes && c.opcoes.length){
      body.innerHTML += `<div class="campo-opts"><strong>Opções / Valores</strong><ul>${c.opcoes.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
    }
    if(c.dica){
      body.innerHTML += `<div class="campo-dica"><strong>💡 Dica:</strong> ${c.dica}</div>`;
    }
    if(!c.opcoes && !c.dica){
      body.innerHTML = '<p style="color:#999;font-size:12px">Sem detalhes adicionais.</p>';
    }
    sec.appendChild(body);
    box.appendChild(sec);
  });
  main.appendChild(box);

  // Prev / Next
  const btns = document.createElement('div');
  btns.className = 'nav-btns';
  if(stepAtual > 0){
    const prev = document.createElement('button');
    prev.className = 'btn-prev';
    prev.textContent = '← Anterior';
    prev.onclick = () => { stepAtual--; renderMain(); window.scrollTo(0,0); };
    btns.appendChild(prev);
  }
  if(stepAtual < p.steps.length - 1){
    const nxt = document.createElement('button');
    nxt.className = 'btn-next';
    nxt.textContent = 'Próximo →';
    nxt.onclick = () => { stepAtual++; renderMain(); window.scrollTo(0,0); };
    btns.appendChild(nxt);
  }
  main.appendChild(btns);
}

/* ============================================================
   TOGGLE CAMPO
   ============================================================ */
function toggle(i){
  const b = document.getElementById('cb-'+i);
  const a = document.getElementById('arr-'+i);
  const open = b.classList.toggle('open');
  a.classList.toggle('open', open);
  if(open) a.textContent = '▲'; else a.textContent = '▼';
}

/* ============================================================
   WELCOME
   ============================================================ */
function renderWelcome(){
  const main = document.getElementById('main');
  const platCards = Object.entries(PLATAFORMAS).map(([id,p]) => `
    <div class="plat-card" onclick="selecionar('${id}')">
      <div class="pc-icon">${p.emoji}</div>
      <div class="pc-name">${p.nome}</div>
      <div class="pc-sub">${p.status==='full'?'✅ Completo':p.status==='partial'?'🔶 Parcial':'🔜 Em breve'}</div>
    </div>
  `).join('');
  main.innerHTML = `
    <div class="welcome">
      <div style="font-size:52px;margin-bottom:14px">📋</div>
      <h2>AdOps Campaign Setup Guide</h2>
      <p>Guia completo de setup de campanhas nas principais plataformas de mídia digital — do acesso inicial até o go-live. Selecione uma plataforma para começar.</p>
      <div class="plat-grid">${platCards}</div>
    </div>
  `;
}

/* ============================================================
   INIT
   ============================================================ */
renderSidebar();
renderWelcome();
</script>
