<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório NC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzBEMjEzNyIvPjx0ZXh0IHg9IjE2IiB5PSIyMiIgZm9udC1mYW1pbHk9InN5c3RlbS11aSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE0IiBmb250LXdlaWdodD0iODAwIiBmaWxsPSIjMzhCREY4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5SQzwvdGV4dD48L3N2Zz4=">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ─── TOKENS ─── */
:root {
  --bg:        #f4f5fb;
  --surface:   #ffffff;
  --border:    #e0e4f2;
  --fg:        #1a1d2e;
  --muted:     #5a6080;
  --faint:     #9099cc;
  --accent:    #3b5bdb;
  --accent-fg: #ffffff;
  --ok:        #22c55e;
  --warn:      #f59e0b;
  --shadow:    0 1px 4px rgba(0,0,0,.07);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.12);
  --pill:      #eef0fb;
  --header-h:  52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1225;--surface:#1a1f3a;--border:#2a3060;
    --fg:#c5ccf5;--muted:#8891c8;--faint:#4a5494;
    --accent:#6b83ff;--accent-fg:#fff;--ok:#34d058;--warn:#fbbf24;
    --pill:#1f2650;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1225;--surface:#1a1f3a;--border:#2a3060;
  --fg:#c5ccf5;--muted:#8891c8;--faint:#4a5494;
  --accent:#6b83ff;--accent-fg:#fff;--ok:#34d058;--warn:#fbbf24;
  --pill:#1f2650;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}

/* ─── HEADER ─── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);height:var(--header-h);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.app-logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.header-sep{flex:1}
.btn{padding:7px 14px;border-radius:9px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.back-link{font-size:12px;color:var(--faint);text-decoration:none;padding:4px 8px;border-radius:6px;transition:background .15s}
.back-link:hover{background:var(--pill)}

/* ─── TOOLBAR ─── */
.toolbar{padding:16px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
.client-select{padding:7px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;cursor:pointer;min-width:200px}

/* ─── REPORT BODY ─── */
.report-wrap{max-width:900px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}

/* ─── COVER ─── */
.report-cover{background:var(--accent);border-radius:16px;padding:28px 32px;color:var(--accent-fg);position:relative;overflow:hidden}
.report-cover::after{content:'NC';position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:120px;font-weight:900;opacity:.08;line-height:1;font-family:'DM Mono',monospace;pointer-events:none}
.cover-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:8px}
.cover-name{font-size:28px;font-weight:800;line-height:1.2;margin-bottom:12px;word-break:break-word}
.cover-sep{font-family:'DM Mono',monospace;font-size:16px;opacity:.8;margin-bottom:8px}
.cover-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;opacity:.8}
.cover-score{position:absolute;top:28px;right:36px;text-align:center}
.score-ring{width:70px;height:70px;border-radius:50%;border:4px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.12)}
.score-num{font-size:20px;font-weight:800;line-height:1}
.score-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}

/* ─── SECTION HEADER ─── */
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-icon{font-size:18px}
.section-title{font-size:16px;font-weight:700;color:var(--fg)}
.section-count{background:var(--pill);color:var(--muted);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}

/* ─── SEGMENTS TABLE ─── */
.seg-overview{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg-ov-hdr{display:grid;grid-template-columns:140px 1fr 80px 80px;gap:0;background:var(--pill);padding:8px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);border-bottom:1px solid var(--border)}
.seg-ov-row{display:grid;grid-template-columns:140px 1fr 80px 80px;gap:0;padding:9px 16px;border-bottom:1px solid var(--border);align-items:center;font-size:12px}
.seg-ov-row:last-child{border-bottom:none}
.seg-ov-name{font-weight:600;color:var(--fg)}
.seg-ov-bar-wrap{background:var(--pill);border-radius:4px;height:6px;overflow:hidden;margin:0 8px}
.seg-ov-bar{height:100%;border-radius:4px;background:var(--ok);transition:width .3s}
.seg-ov-bar.empty-bar{background:var(--border)}
.seg-ov-count{text-align:right;font-weight:700;color:var(--accent)}
.seg-ov-count.zero{color:var(--faint);font-weight:400}
.seg-ov-badge{text-align:right}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.05em}
.badge-req{background:#ffe4e6;color:#be123c}
.badge-opt{background:var(--pill);color:var(--faint)}

/* ─── DICT SECTION ─── */
.dict-seg-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dict-seg-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--pill);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.dict-seg-hdr-left{display:flex;align-items:center;gap:8px}
.dict-seg-hdr-name{font-size:13px;font-weight:700;color:var(--fg)}
.dict-seg-hdr-info{font-size:11px;color:var(--faint)}
.dict-seg-hdr-chevron{font-size:12px;color:var(--faint);transition:transform .2s}
.dict-seg-hdr-chevron.open{transform:rotate(180deg)}
.dict-terms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0}
.dict-term-cell{padding:8px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:12px}
.dict-term-cell:last-child{border-bottom:none}
.dict-term-val{font-family:'DM Mono',monospace;font-weight:700;color:var(--accent);margin-bottom:1px}
.dict-term-label{color:var(--fg);font-weight:500}
.dict-term-desc{font-size:10.5px;color:var(--faint);margin-top:1px}
.dict-term-tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;margin-top:3px}
.dict-empty{padding:16px;font-size:12px;color:var(--faint);font-style:italic;text-align:center}

/* ─── STRUCTURES ─── */
.struct-list{display:flex;flex-direction:column;gap:8px}
.struct-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 16px}
.struct-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.struct-card-label{font-size:13px;font-weight:700;color:var(--fg)}
.struct-card-plat{background:var(--pill);color:var(--muted);font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px}
.struct-card-pattern{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);background:var(--pill);padding:4px 10px;border-radius:6px;margin-bottom:4px;word-break:break-all}
.struct-card-notes{font-size:11px;color:var(--faint);line-height:1.5}

/* ─── EXAMPLES ─── */
.examples-list{display:flex;flex-direction:column;gap:6px}
.example-pill{font-family:'DM Mono',monospace;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 14px;color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:8px;word-break:break-all}
.example-copy-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;color:var(--muted);white-space:nowrap;font-family:inherit;transition:all .12s}
.example-copy-btn:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* ─── EMPTY / NO CLIENT ─── */
.no-client{padding:60px 20px;text-align:center;color:var(--faint)}
.no-client h2{font-size:18px;color:var(--muted);margin-bottom:8px}
.no-client p{font-size:13px;line-height:1.6}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── PRINT ─── */
@media print {
  .app-header,.toolbar,.toast,.no-print{display:none!important}
  body{background:#fff!important;color:#000!important}
  .report-wrap{max-width:100%;padding:0}
  .report-cover{background:#1a1d2e!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dict-seg-block,.struct-card,.seg-overview{break-inside:avoid}
  .dict-terms-grid{break-inside:avoid}
  .example-pill,.example-copy-btn{display:none}
}

@media(max-width:600px){
  .seg-ov-hdr,.seg-ov-row{grid-template-columns:1fr 60px}
  .seg-ov-bar-wrap,.seg-ov-badge{display:none}
  .cover-score{display:none}
  .cover-name{font-size:20px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-logo">📄 <span>Relatório NC</span></div>
  <div class="header-sep"></div>
  <a class="back-link" href="../taxonomy-builder/">← Builder</a>
  <a class="back-link" href="../">⬡ Ferramentas</a>
  <button class="btn btn-ghost no-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
  <button class="btn btn-ghost no-print" onclick="exportMarkdown()">⬇ .md</button>
  <button class="btn btn-ghost no-print" onclick="toggleTheme()">☾</button>
</header>

<div class="toolbar no-print">
  <label style="font-size:12px;color:var(--faint);font-weight:600">Cliente:</label>
  <select id="clientSel" class="client-select" onchange="renderReport()"></select>
  <button class="btn btn-ghost" onclick="loadClients()">↺</button>
</div>

<div id="reportBody"></div>

<div class="toast" id="toast"></div>

<script>
const CLIENTS_KEY = 'taxo_clients_v1';
const ACTIVE_KEY  = 'taxo_active_v1';

const TERM_TAG_COLORS = {
  evergreen:  {bg:'#dcfce7',fg:'#15803d'},
  sazonal:    {bg:'#fef9c3',fg:'#a16207'},
  teste:      {bg:'#fce7f3',fg:'#9d174d'},
  pausa:      {bg:'#f1f5f9',fg:'#475569'},
  prioridade: {bg:'#fee2e2',fg:'#b91c1c'},
  novo:       {bg:'#dbeafe',fg:'#1d4ed8'},
};

let _openSegs = new Set(); // track collapsed dict segments

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, dur=2200) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

function toggleTheme() {
  const root=document.documentElement, cur=root.getAttribute('data-theme');
  root.setAttribute('data-theme', (!cur||cur==='light')?'dark':'light');
  try{localStorage.setItem('rnc_theme',root.getAttribute('data-theme'))}catch(e){}
}

function loadClients() {
  let clients = [];
  try { clients = JSON.parse(localStorage.getItem(CLIENTS_KEY)||'[]'); } catch(e){}
  const sel = document.getElementById('clientSel');
  const prev = sel.value;
  sel.innerHTML = clients.length
    ? clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
    : '<option value="">Nenhum cliente encontrado</option>';

  // Try to pre-select from URL param or active client
  const params = new URLSearchParams(location.search);
  const urlClient = params.get('client');
  let activeId = '';
  try { activeId = localStorage.getItem(ACTIVE_KEY)||''; } catch(e){}
  const target = urlClient || activeId;
  if(target) {
    const opt = [...sel.options].find(o=>o.value===target);
    if(opt) { sel.value=target; } else if(prev && clients.find(c=>c.id===prev)) { sel.value=prev; }
  }
  renderReport();
}

function getClient() {
  const id = document.getElementById('clientSel').value;
  try {
    const clients = JSON.parse(localStorage.getItem(CLIENTS_KEY)||'[]');
    return clients.find(c=>c.id===id)||null;
  } catch(e){ return null; }
}

function renderReport() {
  const c = getClient();
  const body = document.getElementById('reportBody');
  if(!c) {
    body.innerHTML = `<div class="no-client"><h2>Nenhum cliente</h2><p>Crie um cliente no <a href="../taxonomy-builder/" style="color:var(--accent)">Taxonomy Builder</a> e volte aqui para gerar o relatório.</p></div>`;
    return;
  }

  const dict = c.dictionary||{};
  const segs = c.segments||[];
  const structs = c.structures||[];
  const totalTerms = Object.values(dict).reduce((a,b)=>a+b.length,0);
  const segsWithTerms = segs.filter(s=>(dict[s.id]||[]).length>0).length;
  const completePct = segs.length ? Math.round(100*segsWithTerms/segs.length) : 0;
  const maxTermsInSeg = Math.max(1,...segs.map(s=>(dict[s.id]||[]).length));
  const today = new Date().toLocaleDateString('pt-BR',{year:'numeric',month:'long',day:'numeric'});

  body.innerHTML = `<div class="report-wrap">

    <!-- COVER -->
    <div class="report-cover">
      <div class="cover-score">
        <div class="score-ring"><div class="score-num">${completePct}%</div><div class="score-label">completo</div></div>
      </div>
      <div class="cover-label">Naming Convention — Relatório</div>
      <div class="cover-name">${esc(c.name)}</div>
      <div class="cover-sep">Separador: <strong>${esc(c.separator||'—')}</strong></div>
      <div class="cover-meta">
        <span>📐 ${segs.length} segmentos</span>
        <span>📚 ${totalTerms} termos</span>
        <span>🗂️ ${structs.length} estruturas</span>
        <span>📅 ${today}</span>
      </div>
    </div>

    <!-- OVERVIEW -->
    <div>
      <div class="section-hdr">
        <span class="section-icon">📐</span>
        <span class="section-title">Segmentos</span>
        <span class="section-count">${segs.length}</span>
      </div>
      <div class="seg-overview">
        <div class="seg-ov-hdr"><div>Segmento</div><div>Preenchimento</div><div>Termos</div><div>Tipo</div></div>
        ${segs.map(s=>{
          const cnt=(dict[s.id]||[]).length;
          const pct=Math.round(100*cnt/maxTermsInSeg);
          return `<div class="seg-ov-row">
            <div class="seg-ov-name">${esc(s.label)}</div>
            <div><div class="seg-ov-bar-wrap"><div class="seg-ov-bar ${cnt?'':'empty-bar'}" style="width:${pct}%"></div></div></div>
            <div class="seg-ov-count ${cnt?'':'zero'}">${cnt||'—'}</div>
            <div class="seg-ov-badge"><span class="badge ${s.required?'badge-req':'badge-opt'}">${s.required?'req':'opt'}</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- DICT -->
    <div>
      <div class="section-hdr">
        <span class="section-icon">📚</span>
        <span class="section-title">Dicionário</span>
        <span class="section-count">${totalTerms} termos</span>
      </div>
      ${segs.map(s=>{
        const terms = dict[s.id]||[];
        const isOpen = _openSegs.has(s.id) || terms.length>0;
        return `<div class="dict-seg-block" style="margin-bottom:8px">
          <div class="dict-seg-hdr" onclick="toggleDictSeg('${s.id}')">
            <div class="dict-seg-hdr-left">
              <span class="dict-seg-hdr-name">${esc(s.label)}</span>
              <span class="dict-seg-hdr-info">${terms.length} termos · sep: <code>${esc(s.sep||c.separator||'')}</code></span>
            </div>
            <span class="dict-seg-hdr-chevron ${isOpen?'open':''}">▼</span>
          </div>
          ${isOpen ? (terms.length
            ? `<div class="dict-terms-grid">${terms.map(t=>{
                const tagHtml = t.tag && TERM_TAG_COLORS[t.tag]
                  ? `<span class="dict-term-tag" style="background:${TERM_TAG_COLORS[t.tag].bg};color:${TERM_TAG_COLORS[t.tag].fg}">${t.tag}</span>` : '';
                return `<div class="dict-term-cell">
                  <div class="dict-term-val">${esc(t.value)}</div>
                  <div class="dict-term-label">${esc(t.label||t.value)}</div>
                  ${t.desc?`<div class="dict-term-desc">${esc(t.desc)}</div>`:''}
                  ${tagHtml}
                </div>`;
              }).join('')}</div>`
            : `<div class="dict-empty">Nenhum termo cadastrado ainda.</div>`
          ) : ''}
        </div>`;
      }).join('')}
    </div>

    ${structs.length ? `
    <!-- STRUCTURES -->
    <div>
      <div class="section-hdr">
        <span class="section-icon">🗂️</span>
        <span class="section-title">Estruturas</span>
        <span class="section-count">${structs.length}</span>
      </div>
      <div class="struct-list">
        ${structs.map(st=>`
          <div class="struct-card">
            <div class="struct-card-hdr">
              <span class="struct-card-label">${esc(st.label)}</span>
              ${st.platform?`<span class="struct-card-plat">${esc(st.platform)}</span>`:''}
              ${st.level?`<span class="struct-card-plat">${esc(st.level)}</span>`:''}
            </div>
            <div class="struct-card-pattern">${esc(st.pattern||'')}</div>
            ${st.notes?`<div class="struct-card-notes">${esc(st.notes)}</div>`:''}
          </div>
        `).join('')}
      </div>
    </div>
    `:''}

    <!-- EXAMPLES -->
    <div>
      <div class="section-hdr">
        <span class="section-icon">💡</span>
        <span class="section-title">Exemplos gerados</span>
        <button class="btn btn-ghost no-print" style="font-size:11px;padding:4px 10px" onclick="regenerateExamples()">↺ Regenerar</button>
      </div>
      <div class="examples-list" id="examplesWrap">${buildExamples(c,5)}</div>
    </div>

    ${c.notes ? `
    <div>
      <div class="section-hdr"><span class="section-icon">📝</span><span class="section-title">Notas do cliente</span></div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 18px;font-size:13px;line-height:1.6;color:var(--muted)">${esc(c.notes)}</div>
    </div>
    ` : ''}

  </div>`;
}

function buildExamples(c, count) {
  const segs = c.segments||[];
  const dict = c.dictionary||{};
  const sep = c.separator||'_';
  const examples = [];
  for(let i=0;i<count;i++){
    const parts = segs.map(s=>{
      const terms = dict[s.id]||[];
      if(terms.length) return terms[Math.floor(Math.random()*terms.length)].value;
      return `[${s.label}]`;
    });
    examples.push(parts.join(sep));
  }
  return examples.map((ex,i)=>`
    <div class="example-pill">
      <span>${esc(ex)}</span>
      <button class="example-copy-btn" onclick="copyEx('${ex.replace(/'/g,"\\'")}')">📋</button>
    </div>
  `).join('');
}

function regenerateExamples() {
  const c = getClient(); if(!c) return;
  document.getElementById('examplesWrap').innerHTML = buildExamples(c, 5);
}

function copyEx(val) {
  navigator.clipboard.writeText(val).then(()=>showToast('✅ Copiado!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=val;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('✅ Copiado!');
  });
}

function toggleDictSeg(segId) {
  if(_openSegs.has(segId)) _openSegs.delete(segId); else _openSegs.add(segId);
  renderReport();
}

function exportMarkdown() {
  const c = getClient(); if(!c) { showToast('Nenhum cliente selecionado'); return; }
  const dict = c.dictionary||{};
  const segs = c.segments||[];
  const structs = c.structures||[];
  const today = new Date().toLocaleDateString('pt-BR');
  let md = `# Naming Convention — ${c.name}\n\nSeparador: \`${c.separator||''}\` · Gerado em: ${today}\n\n`;
  md += `## Segmentos (${segs.length})\n\n`;
  md += `| Segmento | Termos | Tipo |\n|---|---|---|\n`;
  segs.forEach(s=>{ md+=`| ${s.label} | ${(dict[s.id]||[]).length} | ${s.required?'req':'opt'} |\n`; });
  md += `\n## Dicionário\n\n`;
  segs.forEach(s=>{
    const terms=dict[s.id]||[];
    md+=`### ${s.label}\n\n`;
    if(terms.length) {
      md+=`| Valor | Label | Descrição |\n|---|---|---|\n`;
      terms.forEach(t=>{ md+=`| \`${t.value}\` | ${t.label||t.value} | ${t.desc||''} |\n`; });
    } else { md+=`_Nenhum termo cadastrado._\n`; }
    md+='\n';
  });
  if(structs.length) {
    md+=`## Estruturas (${structs.length})\n\n`;
    structs.forEach(st=>{ md+=`### ${st.label}\n\n\`\`\`\n${st.pattern||''}\n\`\`\`\n\n${st.notes||''}\n\n`; });
  }
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`nc-${c.name.toLowerCase().replace(/\s+/g,'-')}.md`; a.click();
  showToast('⬇ Markdown exportado');
}

  try{const th=localStorage.getItem('rnc_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
  loadClients();
})();
