<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Finder</title>
<style>
:root{
  --azul:#1F36C7;--azul-escuro:#1a237e;--azul-light:#e8ecfd;
  --cinza:#f4f5fb;--borda:#d6dbf2;
  --sidebar-w:220px;--header-h:52px;
  --tag-img:#e8f4ea;--tag-img-c:#1b6b2f;
  --tag-vid:#fde8e8;--tag-vid-c:#b71c1c;
  --tag-html:#fff3e0;--tag-html-c:#a85600;
  --tag-disp:#e8ecfd;--tag-disp-c:#1F36C7;
  --tag-soc:#f3e5f5;--tag-soc-c:#6a1b9a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cinza);color:#222;min-height:100vh;}

.header{background:var(--azul-escuro);color:#fff;padding:0 24px;height:var(--header-h);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200;}
.header h1{font-size:16px;font-weight:700;}
.header .badge{font-size:10px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:20px;}
.header .ver{font-size:10px;opacity:.5;margin-left:auto;}

.search-wrap{margin-left:auto;margin-right:0;position:relative;}
.search-input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px 6px 32px;border-radius:6px;font-size:13px;width:260px;outline:none;}
.search-input::placeholder{color:rgba(255,255,255,.5);}
.search-input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;}

.layout{display:flex;min-height:calc(100vh - var(--header-h));}

.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--borda);padding:12px 0 24px;flex-shrink:0;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;}
.sb-group{padding:14px 14px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#aaa;}
.plat-btn{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:13px;font-weight:500;color:#333;transition:background .1s;}
.plat-btn:hover{background:var(--cinza);}
.plat-btn.active{background:var(--azul-light);color:var(--azul);font-weight:700;}
.plat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.main{flex:1;padding:24px;min-width:0;}

/* Search results */
.search-results{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.sr-header{padding:12px 20px;background:var(--azul-light);font-size:13px;font-weight:600;color:var(--azul-escuro);border-bottom:1px solid var(--borda);}
.sr-item{padding:12px 20px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--cinza);}
.sr-plat{font-size:11px;background:var(--cinza);padding:2px 6px;border-radius:4px;color:#555;font-weight:600;white-space:nowrap;}
.sr-name{font-size:13px;font-weight:600;}
.sr-dim{font-size:12px;color:#666;font-family:monospace;}

/* Platform header */
.plat-header{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
.plat-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.plat-header-info h2{font-size:16px;color:var(--azul-escuro);}
.plat-header-info p{font-size:12px;color:#666;margin-top:2px;}

/* Format tabs */
.format-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.fmt-tab{padding:6px 12px;border:1.5px solid var(--borda);background:#fff;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;color:#555;display:flex;align-items:center;gap:5px;transition:all .1s;}
.fmt-tab:hover{border-color:var(--azul);color:var(--azul);}
.fmt-tab.active{background:var(--azul);color:#fff;border-color:var(--azul);}

/* Spec cards grid */
.specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.spec-card{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;}
.spec-card-head{padding:12px 16px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.spec-card-head h3{font-size:13px;font-weight:700;color:#222;}
.spec-tags{display:flex;gap:4px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;}
.tag-img{background:var(--tag-img);color:var(--tag-img-c);}
.tag-vid{background:var(--tag-vid);color:var(--tag-vid-c);}
.tag-html{background:var(--tag-html);color:var(--tag-html-c);}
.tag-disp{background:var(--tag-disp);color:var(--tag-disp-c);}
.tag-soc{background:var(--tag-soc);color:var(--tag-soc-c);}
.tag-nat{background:#e0f7fa;color:#006064;}

.spec-card-body{padding:12px 16px;}
.spec-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f0f2fa;}
.spec-row:last-child{border-bottom:none;}
.spec-key{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;min-width:110px;flex-shrink:0;padding-top:1px;}
.spec-val{font-size:12px;color:#222;line-height:1.5;}
.spec-val code{font-family:monospace;background:#f0f2fa;padding:1px 4px;border-radius:3px;font-size:11px;}

.spec-card-foot{padding:8px 16px;border-top:1px solid var(--borda);display:flex;justify-content:flex-end;}
.copy-btn{font-size:11px;padding:5px 10px;background:var(--azul-light);color:var(--azul);border:none;border-radius:5px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px;}
.copy-btn:hover{background:var(--azul);color:#fff;}
.copy-btn.copied{background:#e8f4ea;color:#1b6b2f;}

.spec-obs{margin-top:8px;padding:7px 10px;background:#fffbea;border-left:3px solid #f0c040;font-size:11px;color:#5a4500;border-radius:0 4px 4px 0;line-height:1.5;}

/* Welcome */
.welcome{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:40px;text-align:center;}
.welcome h2{font-size:20px;color:var(--azul-escuro);margin-bottom:8px;}
.welcome p{font-size:14px;color:#666;line-height:1.7;max-width:500px;margin:0 auto 28px;}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.plat-card{border:1.5px solid var(--borda);border-radius:8px;padding:14px 10px;cursor:pointer;text-align:center;transition:border-color .15s,box-shadow .15s;}
.plat-card:hover{border-color:var(--azul);box-shadow:0 2px 8px rgba(31,54,199,.12);}
.plat-card .pc-icon{font-size:26px;margin-bottom:6px;}
.plat-card .pc-name{font-size:12px;font-weight:600;color:#333;}
.plat-card .pc-count{font-size:10px;color:#999;margin-top:2px;}

.empty{padding:40px;text-align:center;color:#aaa;font-size:14px;}

<body>

<div class="header">
  <span style="font-size:20px">📐</span>

/* =====================================================
   GRUPOS
   ===================================================== */
const GRUPOS = {
  "Ad Server":["cm360","dv360"],
  "Search / Display":["googleads"],
  "Social":["meta","linkedin","tiktok","xads"]
};

/* =====================================================
   STATE
   ===================================================== */
let platAtual = null;
let tipoAtual = "todos";
let searchMode = false;
let searchTerm = "";

/* =====================================================
   SIDEBAR
   ===================================================== */
function renderSidebar(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  for(const [g,ids] of Object.entries(GRUPOS)){
    const dg = document.createElement("div");
    dg.className = "sb-group";
    dg.textContent = g;
    sb.appendChild(dg);
    ids.forEach(id => {
      const p = PLATS[id];
      const btn = document.createElement("button");
      btn.className = "plat-btn" + (platAtual===id?" active":"");
      btn.onclick = () => selecionar(id);
      const dot = document.createElement("span");
      dot.className = "plat-dot";
      dot.style.background = p.cor;
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(p.nome));
      sb.appendChild(btn);
    });
  }
}

/* =====================================================
   SELECT
   ===================================================== */
function selecionar(id){
  platAtual = id;
  tipoAtual = "todos";
  searchMode = false;
  document.getElementById("searchInput").value = "";
  renderSidebar();
  renderMain();
  window.scrollTo(0,0);
}

/* =====================================================
   SEARCH
   ===================================================== */
function handleSearch(){
  searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
  if(searchTerm.length >= 2){
    searchMode = true;
    platAtual = null;
    renderSidebar();
    renderSearchResults();
  } else {
    searchMode = false;
    renderMain();
  }
}

function renderSearchResults(){
  const main = document.getElementById("main");
  const results = [];
  for(const [pid,p] of Object.entries(PLATS)){
    for(const fmt of p.formatos){
      const haystack = (fmt.nome + " " + p.nome + " " + Object.values(fmt.specs).join(" ") + " " + (fmt.obs||"")).toLowerCase();
      if(haystack.includes(searchTerm)){
        results.push({pid, p, fmt});
      }
    }
  }
  if(results.length === 0){
    main.innerHTML = `<div class="welcome"><div style="font-size:48px;margin-bottom:16px">🔍</div><h2>Nenhum resultado</h2><p>Tente buscar por dimensão (ex: "300×250"), tipo de arquivo (ex: "MP4") ou nome da plataforma.</p></div>`;
    return;
  }
  main.innerHTML = `<div class="search-results">
    <div class="sr-header">🔍 ${results.length} resultado${results.length>1?"s":""} para "${searchTerm}"</div>
    ${results.map(r=>`
      <div class="sr-item" onclick="selectFromSearch('${r.pid}','${r.fmt.nome}')">
        <span class="sr-plat">${r.p.emoji} ${r.p.nome}</span>
        <div>
          <div class="sr-name">${r.fmt.nome}</div>
          <div class="sr-dim">${Object.values(r.fmt.specs)[0]}</div>
        </div>
        <span style="margin-left:auto;font-size:11px;color:#aaa">Ver specs →</span>
      </div>
    `).join("")}
  </div>`;
}

function selectFromSearch(pid, fmtNome){
  platAtual = pid;
  tipoAtual = "todos";
  searchMode = false;
  document.getElementById("searchInput").value = "";
  renderSidebar();
  renderMain(fmtNome);
}

/* =====================================================
   MAIN
   ===================================================== */
function renderMain(highlightFmt){
  const main = document.getElementById("main");
  if(!platAtual){ renderWelcome(); return; }
  const p = PLATS[platAtual];
  main.innerHTML = "";

  // Header
  const hdr = document.createElement("div");
  hdr.className = "plat-header";
  hdr.innerHTML = `
    <div class="plat-icon" style="background:${p.cor}18">${p.emoji}</div>
    <div class="plat-header-info">
      <h2>${p.nome}</h2>
      <p>${p.formatos.length} formatos disponíveis</p>
    </div>
  `;
  main.appendChild(hdr);

  // Filter tabs
  const tipos = ["todos","img","vid","html","disp","soc","nat"];
  const tipoLabels = {todos:"Todos",img:"📷 Imagem",vid:"🎬 Vídeo",html:"</> HTML5",disp:"🖥 Display",soc:"📱 Social",nat:"🔗 Native"};
  const tiposPresentes = new Set(p.formatos.flatMap(f=>f.tipos));
  const tabs = document.createElement("div");
  tabs.className = "format-tabs";
  tipos.filter(t => t==="todos" || tiposPresentes.has(t)).forEach(t => {
    const b = document.createElement("button");
    b.className = "fmt-tab" + (tipoAtual===t?" active":"");
    b.textContent = tipoLabels[t];
    b.onclick = () => { tipoAtual=t; renderMain(); };
    tabs.appendChild(b);
  });
  main.appendChild(tabs);

  // Cards
  const fmtsFiltrados = p.formatos.filter(f => tipoAtual==="todos" || f.tipos.includes(tipoAtual));
  const grid = document.createElement("div");
  grid.className = "specs-grid";
  if(fmtsFiltrados.length === 0){
    grid.innerHTML = `<div class="empty">Nenhum formato desse tipo nesta plataforma.</div>`;
  } else {
    fmtsFiltrados.forEach(fmt => {
      const card = buildCard(fmt, fmt.nome === highlightFmt);
      grid.appendChild(card);
    });
  }
  main.appendChild(grid);

  if(highlightFmt){
    setTimeout(()=>{
      const el = main.querySelector("[data-fmt='"+highlightFmt+"']");
      if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    },100);
  }
}

function buildCard(fmt, highlight){
  const card = document.createElement("div");
  card.className = "spec-card";
  card.setAttribute("data-fmt", fmt.nome);
  if(highlight) card.style.boxShadow = "0 0 0 2px var(--azul)";

  const tagMap = {img:"tag-img",vid:"tag-vid",html:"tag-html",disp:"tag-disp",soc:"tag-soc",nat:"tag-nat"};
  const tagLabel = {img:"Imagem",vid:"Vídeo",html:"HTML5",disp:"Display",soc:"Social",nat:"Native"};
  const tagsHtml = fmt.tipos.map(t=>`<span class="tag ${tagMap[t]||""}">${tagLabel[t]||t}</span>`).join("");

  card.innerHTML = `
    <div class="spec-card-head">
      <h3>${fmt.nome}</h3>
      <div class="spec-tags">${tagsHtml}</div>
    </div>
    <div class="spec-card-body">
      ${Object.entries(fmt.specs).map(([k,v])=>`
        <div class="spec-row">
          <span class="spec-key">${k}</span>
          <span class="spec-val">${v.replace(/\n/g,"<br>")}</span>
        </div>
      `).join("")}
      ${fmt.obs ? `<div class="spec-obs">💡 ${fmt.obs}</div>` : ""}
    </div>
    <div class="spec-card-foot">
      <button class="copy-btn" onclick="copySpecs(this, '${fmt.nome.replace(/'/g,"\\'")}')">📋 Copiar specs</button>
    </div>
  `;
  return card;
}

/* =====================================================
   COPY
   ===================================================== */
function copySpecs(btn, fmtNome){
  const p = PLATS[platAtual];
  const fmt = p.formatos.find(f=>f.nome===fmtNome);
  if(!fmt) return;
  let txt = `📐 ESPECIFICAÇÕES — ${p.nome.toUpperCase()} · ${fmt.nome}\n`;
  txt += "─".repeat(50) + "\n";
  for(const [k,v] of Object.entries(fmt.specs)){
    txt += `${k}: ${v}\n`;
  }
  if(fmt.obs) txt += `\n⚠ Observação: ${fmt.obs}`;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent = "✅ Copiado!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = "📋 Copiar specs"; btn.classList.remove("copied"); }, 2000);
  });
}

/* =====================================================
   WELCOME
   ===================================================== */
function renderWelcome(){
  const main = document.getElementById("main");
  const cards = Object.entries(PLATS).map(([id,p])=>`
    <div class="plat-card" onclick="selecionar('${id}')">
      <div class="pc-icon">${p.emoji}</div>
      <div class="pc-name">${p.nome}</div>
      <div class="pc-count">${p.formatos.length} formatos</div>
    </div>
  `).join("");
  main.innerHTML = `
    <div class="welcome">
      <div style="font-size:52px;margin-bottom:14px">📐</div>
      <h2>Spec Finder</h2>
      <p>Especificações técnicas de criativos para todas as plataformas de mídia digital. Selecione uma plataforma ou use a busca global por dimensão, formato ou tipo de arquivo.</p>
      <div class="plat-grid">${cards}</div>
    </div>
  `;
}

/* =====================================================
   INIT
   ===================================================== */
renderSidebar();
renderWelcome();
</script>
