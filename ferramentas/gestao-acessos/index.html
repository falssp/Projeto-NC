<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Acessos</title>
<style>
  :root {
    --azul: #1F36C7;
    --azul-escuro: #1a237e;
    --azul-light: #e8ecfd;
    --cinza: #f4f5fb;
    --borda: #d6dbf2;
    --text: #1a1f3a;
    --text-muted: #6b7280;
    --white: #fff;
    --cat-iam: #7c3aed;
    --cat-iam-bg: #f3f0ff;
    --cat-pam: #dc2626;
    --cat-pam-bg: #fef2f2;
    --cat-protocols: #1F36C7;
    --cat-protocols-bg: #e8ecfd;
    --cat-concepts: #374151;
    --cat-concepts-bg: #f3f4f6;
    --cat-compliance: #059669;
    --cat-compliance-bg: #ecfdf5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cinza); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 100%);
    color: #fff;
    padding: 28px 40px 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

  .search-wrap {
    background: var(--azul-escuro);
    padding: 0 40px 28px;
  }
  .search-box { position: relative; max-width: 700px; }
  .search-box input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.6); font-size: 1.1rem; pointer-events: none;
  }

  .filters-bar {
    background: var(--white);
    border-bottom: 1.5px solid var(--borda);
    padding: 14px 40px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 20px;
    border: 1.5px solid var(--borda);
    background: var(--white); color: var(--text-muted);
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--azul); color: var(--azul); }
  .filter-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .filter-btn[data-cat="iam"].active { background: var(--cat-iam); border-color: var(--cat-iam); }
  .filter-btn[data-cat="pam"].active { background: var(--cat-pam); border-color: var(--cat-pam); }
  .filter-btn[data-cat="protocols"].active { background: var(--cat-protocols); border-color: var(--cat-protocols); }
  .filter-btn[data-cat="concepts"].active { background: var(--cat-concepts); border-color: var(--cat-concepts); }
  .filter-btn[data-cat="compliance"].active { background: var(--cat-compliance); border-color: var(--cat-compliance); }
  .filters-right { margin-left: auto; font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }

  .az-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 8px 40px; display: flex; gap: 3px; flex-wrap: wrap;
  }
  .az-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    color: var(--azul); transition: all 0.15s; background: none; border: none; text-decoration: none;
  }
  .az-btn:hover { background: var(--azul-light); }
  .az-btn.disabled { color: var(--borda); cursor: default; }
  .az-btn.disabled:hover { background: none; }

  .content { padding: 30px 40px 60px; }
  .letter-section { margin-bottom: 36px; }
  .letter-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .letter-heading h2 { font-size: 1.6rem; font-weight: 800; color: var(--azul-escuro); min-width: 36px; }
  .letter-heading hr { flex: 1; border: none; border-top: 2px solid var(--borda); }

  .terms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }
  .term-card {
    background: var(--white); border: 1.5px solid var(--borda);
    border-radius: 10px; padding: 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover { box-shadow: 0 2px 12px rgba(31,54,199,0.08); border-color: #b8c4f0; }
  .term-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .term-name { font-size: 0.97rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .term-acronym {
    font-size: 0.78rem; font-weight: 600; color: var(--azul);
    background: var(--azul-light); padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .term-def { font-size: 0.85rem; color: #374151; line-height: 1.55; margin-bottom: 8px; }
  .term-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
  }
  .cat-iam       { color: var(--cat-iam);       background: var(--cat-iam-bg); }
  .cat-pam       { color: var(--cat-pam);       background: var(--cat-pam-bg); }
  .cat-protocols { color: var(--cat-protocols); background: var(--cat-protocols-bg); }
  .cat-concepts  { color: var(--cat-concepts);  background: var(--cat-concepts-bg); }
  .cat-compliance{ color: var(--cat-compliance);background: var(--cat-compliance-bg); }
  .term-aka { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🔐 Gestão de Acessos</h1>
  <p>IAM, PAM, RBAC, SSO, protocolos de identidade e controle de acesso</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar termo, sigla ou palavra-chave…" autocomplete="off">
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="iam">🟣 IAM</button>
  <button class="filter-btn" data-cat="pam">🔴 PAM</button>
  <button class="filter-btn" data-cat="protocols">🔵 Protocolos</button>
  <button class="filter-btn" data-cat="compliance">🟢 Compliance</button>
  <button class="filter-btn" data-cat="concepts">⚫ Conceitos</button>
  <div class="filters-right" id="countDisplay"></div>
</div>

<div class="az-bar" id="azBar"></div>
<div class="content" id="content"></div>

<script>
const TERMS = [
  // IAM
  { name: "Access Certification", acronym: "", cat: "iam", def: "Processo periódico de revisão e validação dos acessos concedidos a usuários, confirmando que cada permissão ainda é necessária e apropriada. Também chamado de Access Review ou Recertification.", aka: "Access Review, Recertification" },
  { name: "Account Provisioning", acronym: "", cat: "iam", def: "Processo automatizado ou manual de criar e configurar contas de usuário com as permissões e recursos necessários para que a pessoa execute suas funções.", aka: "User Provisioning" },
  { name: "Active Directory", acronym: "AD", cat: "iam", def: "Serviço de diretório da Microsoft para autenticação e autorização centralizada em ambientes Windows. Organiza usuários, grupos, computadores e políticas em estruturas de domínio.", aka: "AD, Windows AD" },
  { name: "CIAM", acronym: "Customer Identity and Access Management", cat: "iam", def: "Subconjunto de IAM voltado para o gerenciamento de identidades de clientes externos: registro, login, perfil, consentimento e privacidade em apps e portais públicos.", aka: "" },
  { name: "Deprovisioning", acronym: "", cat: "iam", def: "Processo de remoção de acessos e desativação de contas quando um usuário muda de função, projeto ou sai da organização. Crítico para reduzir superfície de ataque.", aka: "Offboarding de acesso" },
  { name: "Directory Service", acronym: "", cat: "iam", def: "Sistema que armazena e organiza informações sobre usuários, grupos e recursos em rede, permitindo busca e autenticação centralizada. Ex: Active Directory, OpenLDAP, Azure AD.", aka: "" },
  { name: "Entitlement", acronym: "", cat: "iam", def: "Conjunto de permissões, direitos e privilégios associados a um usuário ou papel dentro de um sistema. Inclui acesso a aplicações, dados e operações específicas.", aka: "Direito de acesso" },
  { name: "Federation", acronym: "", cat: "iam", def: "Mecanismo que permite que identidades de um domínio (organização A) sejam reconhecidas e aceitas em outro domínio (organização B) sem necessidade de nova conta, usando padrões como SAML ou OIDC.", aka: "Identity Federation" },
  { name: "IAM", acronym: "Identity and Access Management", cat: "iam", def: "Conjunto de processos, tecnologias e políticas para gerenciar identidades digitais e controlar quem tem acesso a quais recursos, quando e como. Pilar central de segurança de TI.", aka: "" },
  { name: "Identity Governance", acronym: "IGA", cat: "iam", def: "Disciplina de IAM focada em garantir que os acessos estejam alinhados às políticas corporativas e regulatórias, incluindo provisionamento, revisão de acessos e segregação de funções.", aka: "IGA, Identity Governance and Administration" },
  { name: "Identity Provider", acronym: "IdP", cat: "iam", def: "Sistema que cria, mantém e gerencia informações de identidade digital, autenticando usuários e emitindo tokens ou assertions para service providers. Ex: Okta, Azure AD, Google Workspace.", aka: "IdP" },
  { name: "LDAP", acronym: "Lightweight Directory Access Protocol", cat: "iam", def: "Protocolo de acesso e gerenciamento de serviços de diretório via TCP/IP. Usado para autenticação, consulta e modificação de entradas em diretórios como Active Directory e OpenLDAP.", aka: "" },
  { name: "Lifecycle Management", acronym: "", cat: "iam", def: "Gestão completa do ciclo de vida de identidades: criação (joiner), mudanças de função (mover) e desligamento (leaver). Automatiza provisionamento e deprovisioning.", aka: "Joiner-Mover-Leaver" },
  { name: "MFA", acronym: "Multi-Factor Authentication", cat: "iam", def: "Método de autenticação que exige dois ou mais fatores independentes: algo que você sabe (senha), tem (token/app) ou é (biometria). Reduz drasticamente risco de comprometimento de conta.", aka: "2FA, Autenticação Multifator" },
  { name: "Role", acronym: "", cat: "iam", def: "Conjunto nomeado de permissões agrupadas por função de negócio ou técnica. Usuários recebem roles em vez de permissões individuais, simplificando a administração de acessos.", aka: "Papel, Perfil de acesso" },
  { name: "Service Account", acronym: "", cat: "iam", def: "Conta criada não para uma pessoa, mas para um sistema, aplicação ou processo automatizado. Requer gestão especial: senhas longas e rotativas, sem login interativo, auditoria de uso.", aka: "Conta de serviço" },
  { name: "Single Sign-On", acronym: "SSO", cat: "iam", def: "Mecanismo que permite ao usuário autenticar-se uma única vez e acessar múltiplas aplicações e sistemas sem precisar fazer login novamente em cada uma.", aka: "SSO" },
  { name: "User Directory", acronym: "", cat: "iam", def: "Repositório centralizado de informações de usuários (nome, e-mail, departamento, grupos, credenciais) usado como fonte autoritativa de identidade em uma organização.", aka: "" },

  // PAM
  { name: "Bastion Host", acronym: "", cat: "pam", def: "Servidor exposto à rede pública que atua como ponto de entrada controlado e auditado para acesso a sistemas internos. Protege infraestrutura crítica de acesso direto.", aka: "Jump Server" },
  { name: "Break Glass", acronym: "", cat: "pam", def: "Procedimento de acesso emergencial a sistemas críticos em situações onde o processo normal de autorização não pode ser seguido. Todo uso é registrado e revisado posteriormente.", aka: "Emergency Access, Acesso de emergência" },
  { name: "Credential Vault", acronym: "", cat: "pam", def: "Repositório seguro e criptografado para armazenar senhas, chaves SSH, certificados e credenciais privilegiadas. O sistema injeta a credencial sem expô-la ao usuário.", aka: "Password Vault, Cofre de senhas" },
  { name: "JIT Access", acronym: "Just-in-Time Access", cat: "pam", def: "Modelo onde acessos privilegiados são concedidos apenas por um período de tempo limitado para uma tarefa específica, e revogados automaticamente ao término. Elimina contas privilegiadas permanentes.", aka: "Acesso Just-in-Time" },
  { name: "PAM", acronym: "Privileged Access Management", cat: "pam", def: "Conjunto de tecnologias e processos para controlar, monitorar e auditar acessos privilegiados (admin, root, superusuário) a sistemas críticos. Reduz risco de insider threats e comprometimentos.", aka: "" },
  { name: "PIM", acronym: "Privileged Identity Management", cat: "pam", def: "Disciplina focada no gerenciamento de identidades privilegiadas: quem tem acesso admin, quando pode usar, com que aprovação e por quanto tempo. Frequentemente parte da solução PAM.", aka: "" },
  { name: "Privileged Account", acronym: "", cat: "pam", def: "Conta com permissões elevadas que pode modificar configurações de sistema, acessar dados sensíveis ou executar ações de alto impacto. Ex: root, Domain Admin, DBA, conta de serviço crítico.", aka: "Conta privilegiada" },
  { name: "Session Recording", acronym: "", cat: "pam", def: "Gravação de sessões de acesso privilegiado (terminal, desktop remoto) para fins de auditoria, investigação de incidentes e conformidade regulatória. Componente essencial de soluções PAM.", aka: "Gravação de sessão" },

  // PROTOCOLOS
  { name: "JWT", acronym: "JSON Web Token", cat: "protocols", def: "Padrão aberto (RFC 7519) para transmitir informações de identidade como um objeto JSON assinado digitalmente. Muito usado em APIs e microsserviços para autenticação stateless.", aka: "" },
  { name: "Kerberos", acronym: "", cat: "protocols", def: "Protocolo de autenticação de rede baseado em tickets, desenvolvido pelo MIT. É o mecanismo padrão de autenticação em ambientes Windows/Active Directory.", aka: "" },
  { name: "OAuth 2.0", acronym: "", cat: "protocols", def: "Framework de autorização que permite a uma aplicação obter acesso limitado a uma conta de usuário em outro serviço, sem compartilhar credenciais. Base para a maioria das integrações de login modernas.", aka: "" },
  { name: "OpenID Connect", acronym: "OIDC", cat: "protocols", def: "Camada de identidade construída sobre OAuth 2.0 que permite que aplicações verifiquem a identidade do usuário com base na autenticação realizada por um IdP, via ID Token JWT.", aka: "OIDC" },
  { name: "RADIUS", acronym: "Remote Authentication Dial-In User Service", cat: "protocols", def: "Protocolo cliente-servidor para autenticação, autorização e contabilização (AAA) de usuários de rede. Muito usado em VPNs, Wi-Fi corporativo e acesso remoto.", aka: "" },
  { name: "SAML", acronym: "Security Assertion Markup Language", cat: "protocols", def: "Padrão XML para troca de dados de autenticação e autorização entre um Identity Provider e um Service Provider. Base do SSO corporativo federado.", aka: "" },
  { name: "SCIM", acronym: "System for Cross-domain Identity Management", cat: "protocols", def: "Protocolo aberto (RFC 7643/7644) para automatizar o provisionamento e sincronização de identidades entre sistemas de IAM e aplicações SaaS. Reduz trabalho manual de onboarding/offboarding.", aka: "" },

  // CONCEITOS
  { name: "ABAC", acronym: "Attribute-Based Access Control", cat: "concepts", def: "Modelo de controle de acesso onde permissões são definidas com base em atributos do usuário (cargo, departamento, localização), do recurso e do ambiente. Mais granular que RBAC.", aka: "" },
  { name: "DAC", acronym: "Discretionary Access Control", cat: "concepts", def: "Modelo onde o proprietário do recurso define quem pode acessá-lo e com que nível de permissão. Flexível, mas pode resultar em proliferação descontrolada de acessos.", aka: "Controle de acesso discricionário" },
  { name: "Defense in Depth", acronym: "", cat: "concepts", def: "Estratégia de segurança que usa múltiplas camadas de controle independentes para proteger sistemas. Se uma camada falha, as outras ainda protegem. Aplicada também em gestão de acessos.", aka: "Defesa em profundidade" },
  { name: "Least Privilege", acronym: "", cat: "concepts", def: "Princípio de segurança que estabelece que cada usuário ou processo deve ter apenas as permissões mínimas necessárias para executar sua função, nada além disso.", aka: "Privilégio mínimo, Mínimo necessário" },
  { name: "MAC", acronym: "Mandatory Access Control", cat: "concepts", def: "Modelo rígido onde políticas de acesso são definidas centralmente pela organização (não pelo dono do recurso), com base em classificações de segurança. Comum em ambientes governamentais e militares.", aka: "Controle de acesso obrigatório" },
  { name: "RBAC", acronym: "Role-Based Access Control", cat: "concepts", def: "Modelo de controle de acesso onde permissões são associadas a papéis (roles), e usuários recebem papéis conforme sua função. Simplifica a administração em organizações com muitos usuários.", aka: "Controle de acesso baseado em papéis" },
  { name: "Segregation of Duties", acronym: "SoD", cat: "concepts", def: "Princípio que separa responsabilidades críticas entre diferentes pessoas para evitar fraude ou erro. Ex: quem aprova uma compra não pode ser quem a executa.", aka: "SoD, Segregação de funções" },
  { name: "Shadow IT", acronym: "", cat: "concepts", def: "Uso de sistemas, aplicações ou serviços por funcionários sem aprovação ou conhecimento do departamento de TI. Cria riscos de segurança e acessos não gerenciados.", aka: "" },
  { name: "Zero Trust", acronym: "", cat: "concepts", def: "Modelo de segurança que assume que nenhuma entidade — interna ou externa — é confiável por padrão. Toda solicitação de acesso é verificada explicitamente, independente da origem.", aka: "Never Trust, Always Verify" },

  // COMPLIANCE
  { name: "Access Log", acronym: "", cat: "compliance", def: "Registro cronológico de todos os eventos de acesso a sistemas e dados: quem acessou, quando, de onde e o que fez. Essencial para auditoria, investigação de incidentes e conformidade.", aka: "Log de acesso, Audit Log" },
  { name: "Audit Trail", acronym: "", cat: "compliance", def: "Trilha completa e imutável de registros de atividades em um sistema, usada para reconstruir eventos e demonstrar conformidade com políticas e regulamentos.", aka: "Trilha de auditoria" },
  { name: "GDPR", acronym: "General Data Protection Regulation", cat: "compliance", def: "Regulamento europeu de proteção de dados pessoais. Exige controle granular de quem acessa dados de titulares, com base em consentimento ou finalidade legítima. Referência global.", aka: "" },
  { name: "LGPD", acronym: "Lei Geral de Proteção de Dados", cat: "compliance", def: "Lei brasileira de proteção de dados pessoais (Lei 13.709/2018), equivalente ao GDPR europeu. Impõe requisitos de controle de acesso, minimização de dados e retenção.", aka: "" },
  { name: "PCI DSS", acronym: "Payment Card Industry Data Security Standard", cat: "compliance", def: "Padrão de segurança para organizações que processam dados de cartão de crédito. Inclui requisitos rigorosos de controle de acesso, MFA, logs e revisão periódica de privilégios.", aka: "" },
  { name: "SOX", acronym: "Sarbanes-Oxley Act", cat: "compliance", def: "Lei americana de governança corporativa que exige controles internos robustos sobre sistemas financeiros, incluindo gestão de acessos, SoD e trilhas de auditoria para empresas de capital aberto.", aka: "Sarbanes-Oxley" },

  // TERMOS MODERNOS
  { name: "Conditional Access", acronym: "", cat: "concepts", def: "Políticas que avaliam múltiplas condições antes de conceder acesso — dispositivo (gerenciado ou não), localização, nível de risco do usuário, aplicação alvo — e aplicam controles proporcionais como MFA ou bloqueio.", aka: "Acesso Condicional" },
  { name: "ITDR", acronym: "Identity Threat Detection and Response", cat: "concepts", def: "Capacidade de detectar, investigar e responder a ameaças direcionadas a identidades em tempo real: credential stuffing, privilege escalation, lateral movement. Complementa EDR e SIEM com foco em identidade.", aka: "Detecção e Resposta a Ameaças de Identidade" },
  { name: "Passkeys", acronym: "", cat: "concepts", def: "Padrão FIDO2/WebAuthn que substitui senhas por um par de chaves criptográficas: a chave privada fica no dispositivo do usuário (protegida por biometria ou PIN) e nunca trafega pela rede. Resistente a phishing por design.", aka: "FIDO2 Passkey" },
  { name: "Passwordless Authentication", acronym: "", cat: "concepts", def: "Autenticação sem uso de senhas tradicionais, usando biometria, hardware tokens (FIDO2), magic links ou OTP via app autenticador. Elimina o vetor de ataque mais comum — roubo e reuso de senhas.", aka: "Autenticação sem senha" },
  { name: "PIM", acronym: "Privileged Identity Management", cat: "pam", def: "Subset de PAM focado no ciclo de vida de identidades privilegiadas: criação, aprovação, atribuição JIT, revogação e auditoria de contas com privilégios elevados. Distinto do PAM que gerencia o acesso a sessões e credenciais.", aka: "Gestão de Identidades Privilegiadas" }
];

TERMS.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const CAT_LABELS = {
  iam: "🟣 IAM",
  pam: "🔴 PAM",
  protocols: "🔵 Protocolos",
  concepts: "⚫ Conceitos",
  compliance: "🟢 Compliance"
};

let currentCat = "all";
let currentSearch = "";

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === "all" || t.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.acronym.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.aka.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const content = document.getElementById("content");
  const countDisplay = document.getElementById("countDisplay");
  countDisplay.textContent = `${filtered.length} de ${TERMS.length} termos`;

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum termo encontrado</h3><p>Tente buscar por outra palavra ou limpe os filtros.</p></div>`;
    return;
  }

  const byLetter = {};
  filtered.forEach(t => {
    const letter = t.name[0].toUpperCase();
    if (!byLetter[letter]) byLetter[letter] = [];
    byLetter[letter].push(t);
  });

  let html = "";
  Object.keys(byLetter).sort().forEach(letter => {
    html += `<div class="letter-section" id="letter-${letter}">
      <div class="letter-heading"><h2>${letter}</h2><hr></div>
      <div class="terms-grid">`;
    byLetter[letter].forEach(t => {
      html += `<div class="term-card">
        <div class="term-header">
          <div class="term-name">${t.name}</div>
          ${t.acronym ? `<div class="term-acronym">${t.acronym}</div>` : ""}
        </div>
        <div class="term-def">${t.def}</div>
        <div class="term-footer">
          <span class="cat-tag cat-${t.cat}">${CAT_LABELS[t.cat]}</span>
          ${t.aka ? `<span class="term-aka">Tb. conhecido como: ${t.aka}</span>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter) {
  const bar = document.getElementById("azBar");
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  bar.innerHTML = all.map(l => {
    if (byLetter && byLetter[l]) {
      return `<a class="az-btn" href="#letter-${l}">${l}</a>`;
    }
    return `<span class="az-btn disabled">${l}</span>`;
  }).join("");
}

updateAZBar(null);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
