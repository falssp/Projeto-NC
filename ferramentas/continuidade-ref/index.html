<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuidade de Negócios — Referência</title>
<style>
  :root {
    --bcm:      #0369a1;
    --drp:      #7c3aed;
    --bia:      #d97706;
    --metrics:  #0f766e;
    --concepts: #94a3b8;
    --bg: #0f1117; --card: #1a1d27; --border: #2e3248;
    --text: #e8eaf0; --muted: #8890aa; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .breadcrumb { background: #1a1d27; border-bottom: 1px solid var(--border); padding: .55rem 1.5rem; font-size: .8rem; color: var(--muted); }
  .breadcrumb a { color: var(--bcm); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }

  header { background: linear-gradient(135deg, #0c4a6e 0%, var(--bcm) 100%); color: #fff; padding: 2rem 1.5rem 1.5rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header p  { opacity: .85; margin-top: .4rem; font-size: .95rem; }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; padding: 1.25rem 1.5rem; background: #1a1d27; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .controls input { flex: 1; min-width: 200px; padding: .55rem .9rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; background: #12141e; color: var(--text); }
  .controls input:focus { outline: 2px solid var(--bcm); border-color: transparent; }

  .filter-btn { padding: .45rem .9rem; border-radius: 999px; border: 1.5px solid var(--border); background: #1a1d27; font-size: .82rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--text); }
  .filter-btn:hover { border-color: #94a3b8; }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-cat="all"].active      { background: #3d4f6b; color: #e8eaf0; }
  .filter-btn[data-cat="bcm"].active      { background: var(--bcm); }
  .filter-btn[data-cat="drp"].active      { background: var(--drp); }
  .filter-btn[data-cat="bia"].active      { background: var(--bia); }
  .filter-btn[data-cat="metrics"].active  { background: var(--metrics); }
  .filter-btn[data-cat="concepts"].active { background: var(--concepts); }

  main { width: 100%; box-sizing: border-box; padding: 1.5rem 3rem; }
  .letter-group { margin-bottom: 2rem; }
  .letter-anchor { font-size: 1.3rem; font-weight: 700; color: var(--muted); margin-bottom: .75rem; padding-bottom: .3rem; border-bottom: 2px solid var(--border); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .65rem; border-left: 4px solid #94a3b8; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .card[data-cat="bcm"]      { border-left-color: var(--bcm); }
  .card[data-cat="drp"]      { border-left-color: var(--drp); }
  .card[data-cat="bia"]      { border-left-color: var(--bia); }
  .card[data-cat="metrics"]  { border-left-color: var(--metrics); }
  .card[data-cat="concepts"] { border-left-color: var(--concepts); }

  .card-header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
  .card-name   { font-size: 1rem; font-weight: 700; }
  .card-acronym { font-size: .82rem; color: var(--muted); font-weight: 400; }
  .card-tag    { font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; color: #fff; margin-left: auto; white-space: nowrap; }
  .card[data-cat="bcm"]      .card-tag { background: var(--bcm); }
  .card[data-cat="drp"]      .card-tag { background: var(--drp); }
  .card[data-cat="bia"]      .card-tag { background: var(--bia); }
  .card[data-cat="metrics"]  .card-tag { background: var(--metrics); }
  .card[data-cat="concepts"] .card-tag { background: var(--concepts); }

  .card-def  { font-size: .88rem; color: #c8ccd8; line-height: 1.55; }
  .card-aka  { font-size: .78rem; color: var(--muted); margin-top: .35rem; }
  .card-aka span { font-style: italic; }

  .az-bar { display: flex; flex-wrap: wrap; gap: .3rem; padding: 1rem 1.5rem .5rem; }
  .az-btn { font-size: .78rem; font-weight: 600; padding: .2rem .5rem; border-radius: 5px; border: 1px solid var(--border); background: #1a1d27; cursor: pointer; color: var(--muted); text-decoration: none; transition: all .12s; }
  .az-btn:hover { background: var(--bcm); color: #fff; border-color: transparent; }

  #empty { display: none; text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .count { font-size: .82rem; color: var(--muted); padding: 0 1.5rem .5rem; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>

<header>
  <h1>🔄 Continuidade de Negócios — Referência</h1>
  <p>ISO 22301:2019 · BCM · BCP · DRP · BIA · Resiliência Operacional</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="bcm">BCM / ISO 22301</button>
  <button class="filter-btn" data-cat="drp">Recuperação de Desastres</button>
  <button class="filter-btn" data-cat="bia">BIA — Análise de Impacto</button>
  <button class="filter-btn" data-cat="metrics">Métricas e Objetivos</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Estratégias</button>
</div>

<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>

<script>
const CAT_LABELS = {
  bcm:      "BCM / ISO 22301",
  drp:      "Recuperação de Desastres",
  bia:      "BIA — Análise de Impacto",
  metrics:  "Métricas e Objetivos",
  concepts: "Conceitos e Estratégias",
};

const TERMS = [
  // ── BCM / ISO 22301 ───────────────────────────────────────────────────────
  { name: "ISO 22301:2019", acronym: "", cat: "bcm", def: "Norma internacional para Sistemas de Gestão de Continuidade de Negócios (BCMS). Publicada em 2019 (revisão da edição 2012). Especifica requisitos para planejar, estabelecer, implementar, operar, monitorar, revisar, manter e melhorar um BCMS. É certificável — organizações podem obter certificação de terceira parte.", aka: "Business Continuity Management System · BCMS" },
  { name: "BCM", acronym: "Business Continuity Management", cat: "bcm", def: "Processo holístico que identifica ameaças potenciais e seus impactos nas operações de negócio, fornecendo um framework para construir resiliência organizacional com capacidade de resposta eficaz que salvaguarda interesses de partes interessadas, reputação, marca e atividades de criação de valor. Framework: ISO 22301.", aka: "Gestão de Continuidade de Negócios · GCN" },
  { name: "BCMS", acronym: "Business Continuity Management System", cat: "bcm", def: "Sistema de gestão para continuidade de negócios conforme ISO 22301. Inclui políticas, objetivos, processos e procedimentos para lidar com eventos disruptivos. Segue o ciclo PDCA (Plan-Do-Check-Act) como todos os sistemas de gestão ISO.", aka: "Sistema de Gestão de Continuidade de Negócios" },
  { name: "BCP", acronym: "Business Continuity Plan", cat: "bcm", def: "Documento que fornece procedimentos para restaurar operações de negócio dentro de um tempo pré-definido após uma interrupção. Baseado nos resultados da BIA. Define: quem faz o quê, quando, como e com quais recursos durante e após uma disrupção. Deve ser testado e atualizado regularmente.", aka: "Plano de Continuidade de Negócios · PCN" },
  { name: "Crisis Management", acronym: "", cat: "bcm", def: "Processo coordenado para gerenciar situações de crise que ameaçam a organização, suas partes interessadas ou o público em geral. Inclui equipe de gestão de crise, plano de comunicação de crise e sala de gestão de crise (war room). Distinto do BCP: o BCP foca em operações; o Crisis Management foca em decisões estratégicas e comunicação.", aka: "Gestão de Crises" },
  { name: "Exercício de Continuidade", acronym: "", cat: "bcm", def: "Atividade realizada para validar, praticar e melhorar planos e capacidades de continuidade. Tipos: tabletop exercise (discussão em mesa), walkthrough (revisão de planos), simulation (simulação de cenário), parallel test (operação paralela), full interruption test (interrupção real — alto custo/risco).", aka: "BC Test · Teste de Continuidade" },
  { name: "PDCA no BCM", acronym: "", cat: "bcm", def: "Ciclo de melhoria contínua aplicado ao BCMS (ISO 22301): Plan (estabelecer política, objetivos, processos, BIA) → Do (implementar e operar) → Check (monitorar e revisar) → Act (manter e melhorar). O ciclo nunca para — eventos, mudanças no negócio e resultados de testes alimentam continuamente o plano.", aka: "Plan-Do-Check-Act" },

  // ── RECUPERAÇÃO DE DESASTRES ───────────────────────────────────────────────
  { name: "DRP", acronym: "Disaster Recovery Plan", cat: "drp", def: "Subconjunto do BCP focado especificamente na recuperação de sistemas de TI, dados e infraestrutura após um desastre. Define: procedimentos de failover, prioridade de restauração de sistemas, responsabilidades da equipe de TI e critérios para declarar desastre. Deve estar alinhado com os RTOs e RPOs definidos na BIA.", aka: "Plano de Recuperação de Desastres · PRD" },
  { name: "DR Site", acronym: "Disaster Recovery Site", cat: "drp", def: "Localização alternativa de TI para recuperação após desastre. Tipos: (1) Cold Site — instalação vazia, infraestrutura básica, maior tempo de ativação (dias a semanas); (2) Warm Site — infraestrutura parcialmente configurada, ativação em horas a dias; (3) Hot Site — espelho completo em operação contínua, failover em minutos; (4) Cloud DR — recuperação em nuvem pública.", aka: "Site de Recuperação · Site Alternativo" },
  { name: "Failover", acronym: "", cat: "drp", def: "Comutação automática ou manual de um sistema, servidor ou rede primário para um sistema de backup quando o primário falha ou é desativado. Em alta disponibilidade: o failover ocorre automaticamente sem intervenção humana. Em DR: pode ser manual e seguir procedimentos documentados no DRP.", aka: "Failback · Comutação" },
  { name: "Backup e Restore", acronym: "", cat: "drp", def: "Cópia de dados para recuperação em caso de perda, corrupção ou desastre (backup) e processo de restaurar esses dados (restore). Estratégias: backup completo, incremental (desde o último backup), diferencial (desde o último backup completo). Regra 3-2-1: 3 cópias, 2 mídias diferentes, 1 offsite.", aka: "Cópia de Segurança" },
  { name: "Replicação de Dados", acronym: "", cat: "drp", def: "Processo de copiar dados de um servidor/banco de dados para outro em tempo real ou near real-time. Síncrona: gravação confirmada somente após replicação (RPO = 0, maior latência). Assíncrona: gravação confirmada antes da replicação completar (RPO > 0, menor latência). Fundamental para hot sites e cloud DR com baixo RPO.", aka: "Data Replication · Espelhamento" },
  { name: "Runbook de DR", acronym: "", cat: "drp", def: "Documento operacional detalhado com instruções passo a passo para executar procedimentos de recuperação de desastres. Deve ser suficientemente detalhado para ser executado por qualquer membro da equipe, não apenas o especialista. Inclui comandos exatos, credenciais de acesso (ou referências ao cofre de senhas), sequência de recuperação e critérios de validação.", aka: "Disaster Recovery Runbook" },

  // ── BIA — ANÁLISE DE IMPACTO ──────────────────────────────────────────────
  { name: "BIA", acronym: "Business Impact Analysis", cat: "bia", def: "Análise que identifica e avalia os efeitos (impactos) de interrupções em processos e funções de negócio críticos. Fundamento do BCM — a BIA determina RTOs, RPOs e MTDs para cada processo crítico, orientando as estratégias de continuidade. Deve ser realizada periodicamente e após mudanças significativas no negócio.", aka: "Análise de Impacto no Negócio · AIN" },
  { name: "Processo Crítico", acronym: "", cat: "bia", def: "Atividade ou processo de negócio cuja interrupção causaria impacto inaceitável à organização dentro de um período definido. Identificado na BIA com base em impacto financeiro, regulatório, reputacional e operacional. Os processos críticos têm RTOs e RPOs mais agressivos e recebem prioridade na recuperação.", aka: "Critical Business Process · Função Crítica" },
  { name: "MTPD", acronym: "Maximum Tolerable Period of Disruption", cat: "bia", def: "Período máximo que a organização pode tolerar a interrupção de um processo crítico antes de sofrer impactos inaceitáveis para sua sobrevivência. Ponto de partida da BIA: o RTO deve ser menor que o MTPD. Também chamado de MAO (Maximum Acceptable Outage) ou MTO (Maximum Tolerable Outage).", aka: "MAO · Maximum Acceptable Outage · MTO" },
  { name: "MBCO", acronym: "Minimum Business Continuity Objective", cat: "bia", def: "Nível mínimo de serviço ou produto que é aceitável para a organização durante ou após uma interrupção. Define 'quanto do negócio' precisa estar operando — não necessariamente 100% da capacidade. Orienta as estratégias de continuidade: o objetivo não é restaurar tudo imediatamente, mas atingir o MBCO dentro do RTO.", aka: "Objetivo Mínimo de Continuidade" },
  { name: "Dependências de Processo", acronym: "", cat: "bia", def: "Recursos, sistemas, fornecedores e processos dos quais um processo crítico depende para funcionar. A BIA mapeia essas dependências para identificar pontos únicos de falha (SPOF). Categorias típicas: infraestrutura de TI, telecomunicações, fornecedores críticos, pessoal-chave (key person dependency), instalações físicas.", aka: "Process Dependencies · SPOF" },

  // ── MÉTRICAS E OBJETIVOS ──────────────────────────────────────────────────
  { name: "RTO", acronym: "Recovery Time Objective", cat: "metrics", def: "Tempo máximo aceitável para restaurar um processo ou sistema após uma interrupção, antes que o impacto seja inaceitável. Definido na BIA para cada processo crítico. Exemplo: RTO de 4 horas para o sistema de faturamento significa que ele deve estar operacional em até 4 horas após uma falha.", aka: "Objetivo de Tempo de Recuperação" },
  { name: "RPO", acronym: "Recovery Point Objective", cat: "metrics", def: "Ponto no tempo até o qual os dados devem ser recuperados após uma interrupção. Define a quantidade máxima de perda de dados tolerável. Exemplo: RPO de 1 hora significa que backups devem ser feitos com frequência tal que nunca se perca mais de 1 hora de dados. Determina a estratégia de backup e replicação.", aka: "Objetivo de Ponto de Recuperação" },
  { name: "RCO", acronym: "Recovery Capacity Objective", cat: "metrics", def: "Capacidade mínima de um processo ou sistema que deve ser restaurada após uma interrupção. Complementa o RTO: enquanto o RTO define quando, o RCO define quanto. Exemplo: o sistema de vendas deve ser restaurado em 2 horas (RTO) com 60% da capacidade (RCO) — capacidade plena pode vir depois.", aka: "Objetivo de Capacidade de Recuperação" },
  { name: "MTTR", acronym: "Mean Time to Recover", cat: "metrics", def: "Tempo médio para restaurar um sistema ou serviço após uma falha. Métrica operacional de TI que alimenta a definição de RTOs realistas. MTTR = Tempo total de recuperação / Número de incidentes. Baixo MTTR indica boa capacidade de resposta e recuperação.", aka: "Tempo Médio de Recuperação" },
  { name: "MTBF", acronym: "Mean Time Between Failures", cat: "metrics", def: "Tempo médio entre falhas de um sistema — indicador de confiabilidade. MTBF = Tempo total de operação / Número de falhas. Alto MTBF indica alta confiabilidade. Usado em conjunto com MTTR para calcular disponibilidade: Disponibilidade = MTBF / (MTBF + MTTR).", aka: "Tempo Médio Entre Falhas" },
  { name: "SLA de Disponibilidade", acronym: "", cat: "metrics", def: "Acordo de nível de serviço que define o percentual mínimo de disponibilidade de um sistema. Regra dos '9s': 99% = 87,6h de indisponibilidade/ano; 99,9% (três noves) = 8,76h/ano; 99,99% (quatro noves) = 52,6min/ano; 99,999% (cinco noves) = 5,26min/ano. Quanto mais crítico o sistema, maior o número de noves exigido.", aka: "Uptime SLA · Availability SLA" },

  // ── CONCEITOS E ESTRATÉGIAS ───────────────────────────────────────────────
  { name: "Alta Disponibilidade", acronym: "HA", cat: "concepts", def: "Arquitetura projetada para garantir um nível acordado de desempenho operacional, geralmente uptime, por um período maior que o normal. Implementada com redundância de componentes, balanceamento de carga, clustering e failover automático. Diferente de DR: HA é sobre prevenir interrupções; DR é sobre recuperar após interrupções.", aka: "High Availability · HA" },
  { name: "Resiliência Operacional", acronym: "", cat: "concepts", def: "Capacidade de uma organização de antecipar, se preparar, responder e se adaptar a mudanças incrementais e interrupções repentinas para sobreviver e prosperar. Conceito mais amplo que BCM — inclui adaptação contínua, não apenas recuperação. Foco de reguladores como o Banco de Inglaterra (DORA) e o BACEN.", aka: "Operational Resilience" },
  { name: "SPOF", acronym: "Single Point of Failure", cat: "concepts", def: "Componente único cuja falha resultaria na interrupção de todo o sistema ou processo. Identificado na BIA como dependência crítica sem redundância. Deve ser eliminado ou mitigado em sistemas críticos. Exemplos: servidor único sem redundância, fornecedor único de um serviço essencial, profissional-chave sem sucessor.", aka: "Ponto Único de Falha" },
  { name: "Redundância", acronym: "", cat: "concepts", def: "Duplicação de componentes críticos ou funções de um sistema para aumentar a confiabilidade. Tipos: N+1 (um componente sobressalente), 2N (capacidade duplicada), N+N (espelho completo). Em TI: servidores redundantes, links de internet redundantes, fontes de energia redundantes (UPS, geradores).", aka: "Redundancy" },
  { name: "Estratégia de Continuidade", acronym: "", cat: "concepts", def: "Abordagem selecionada para assegurar continuidade das atividades críticas dentro do RTO/RPO. Opções típicas: (1) Trabalho remoto/home office; (2) Site alternativo (DR Site); (3) Terceirização de processo; (4) Acordo de reciprocidade com outra organização; (5) Manual workaround (processo manual temporário).", aka: "Continuity Strategy" },
  { name: "Equipe de Continuidade", acronym: "BCT", cat: "concepts", def: "Business Continuity Team: equipe responsável por ativar, coordenar e executar o BCP durante uma interrupção. Papéis típicos: Líder de Continuidade (BC Manager), Equipes de Resposta por Área (TI, RH, Comunicação, Operações), Equipe de Gestão de Crise. A equipe deve ser treinada e os planos testados regularmente.", aka: "BC Team · Equipe de Resposta" },
  { name: "Lições Aprendidas", acronym: "", cat: "concepts", def: "Revisão pós-incidente (Post-Incident Review / PIR) ou pós-exercício para identificar o que funcionou, o que não funcionou e o que precisa melhorar nos planos e capacidades de continuidade. Fundamental para o ciclo PDCA do BCMS. Resultado deve ser incorporado na próxima revisão dos planos.", aka: "Post-Incident Review · PIR · AAR" },
];

TERMS.sort((a,b) => a.name.localeCompare(b.name, 'pt'));

let currentCat = 'all', currentQ = '';

function firstLetter(s) {
  const c = s.trim().toUpperCase()[0];
  return /[A-Z]/.test(c) ? c : '#';
}

function render() {
  const q = currentQ.toLowerCase(), cat = currentCat;
  const filtered = TERMS.filter(t => {
    const matchCat = cat === 'all' || t.cat === cat;
    const matchQ = !q || t.name.toLowerCase().includes(q) || (t.acronym||'').toLowerCase().includes(q) || t.def.toLowerCase().includes(q) || (t.aka||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('count').textContent = `${filtered.length} termo${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const groups = {};
  filtered.forEach(t => { const l = firstLetter(t.name); if (!groups[l]) groups[l] = []; groups[l].push(t); });
  const letters = Object.keys(groups).sort();

  document.getElementById('azBar').innerHTML = letters.map(l => `<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!filtered.length) { document.getElementById('empty').style.display = 'block'; return; }
  document.getElementById('empty').style.display = 'none';

  letters.forEach(l => {
    const grp = document.createElement('div');
    grp.className = 'letter-group'; grp.id = `grp-${l}`;
    grp.innerHTML = `<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t => {
      const aka = t.aka ? `<div class="card-aka">Também: <span>${t.aka}</span></div>` : '';
      const acr = t.acronym ? `<span class="card-acronym">— ${t.acronym}</span>` : '';
      grp.innerHTML += `<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}

document.getElementById('search').addEventListener('input', e => { currentQ = e.target.value; render(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); currentCat = btn.dataset.cat; render();
  });
});
render();
</script>
</body>
</html>
