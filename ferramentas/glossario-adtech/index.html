<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossário AdTech</title>
<style>
  :root {
    --azul: #1F36C7;
    --azul-escuro: #1a237e;
    --azul-light: #e8ecfd;
    --cinza: #f4f5fb;
    --borda: #d6dbf2;
    --text: #1a1f3a;
    --text-muted: #6b7280;
    --white: #fff;
    --cat-prog: #7c3aed;
    --cat-prog-bg: #f3f0ff;
    --cat-server: #1F36C7;
    --cat-server-bg: #e8ecfd;
    --cat-social: #059669;
    --cat-social-bg: #ecfdf5;
    --cat-metrics: #d97706;
    --cat-metrics-bg: #fffbeb;
    --cat-formats: #dc2626;
    --cat-formats-bg: #fef2f2;
    --cat-market: #374151;
    --cat-market-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cinza); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 100%);
    color: #fff;
    padding: 28px 40px 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

  /* SEARCH BAR */
  .search-wrap {
    background: var(--azul-escuro);
    padding: 0 40px 28px;
  }
  .search-box {
    position: relative;
    max-width: 700px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 1.1rem;
    pointer-events: none;
  }

  /* FILTERS */
  .filters-bar {
    background: var(--white);
    border-bottom: 1.5px solid var(--borda);
    padding: 14px 40px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--borda);
    background: var(--white);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--azul); color: var(--azul); }
  .filter-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .filter-btn[data-cat="programmatic"].active { background: var(--cat-prog); border-color: var(--cat-prog); }
  .filter-btn[data-cat="adserver"].active { background: var(--cat-server); border-color: var(--cat-server); }
  .filter-btn[data-cat="social"].active { background: var(--cat-social); border-color: var(--cat-social); }
  .filter-btn[data-cat="metrics"].active { background: var(--cat-metrics); border-color: var(--cat-metrics); }
  .filter-btn[data-cat="formats"].active { background: var(--cat-formats); border-color: var(--cat-formats); }
  .filter-btn[data-cat="market"].active { background: var(--cat-market); border-color: var(--cat-market); }

  .filters-right {
    margin-left: auto;
    font-size: 0.82rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* A-Z INDEX */
  .az-bar {
    background: var(--white);
    border-bottom: 1.5px solid var(--borda);
    padding: 8px 40px;
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }
  .az-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--azul);
    transition: all 0.15s;
    background: none;
    border: none;
    text-decoration: none;
  }
  .az-btn:hover { background: var(--azul-light); }
  .az-btn.disabled { color: var(--borda); cursor: default; }
  .az-btn.disabled:hover { background: none; }

  /* CONTENT */
  .content { padding: 30px 40px 60px; }

  /* LETTER SECTION */
  .letter-section { margin-bottom: 36px; }
  .letter-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .letter-heading h2 {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--azul-escuro);
    min-width: 36px;
  }
  .letter-heading hr {
    flex: 1;
    border: none;
    border-top: 2px solid var(--borda);
  }

  /* TERM CARDS GRID */
  .terms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }

  .term-card {
    background: var(--white);
    border: 1.5px solid var(--borda);
    border-radius: 10px;
    padding: 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover { box-shadow: 0 2px 12px rgba(31,54,199,0.08); border-color: #b8c4f0; }

  .term-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .term-name {
    font-size: 0.97rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .term-acronym {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--azul);
    background: var(--azul-light);
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .term-def {
    font-size: 0.85rem;
    color: #374151;
    line-height: 1.55;
    margin-bottom: 8px;
  }
  .term-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cat-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .cat-programmatic { color: var(--cat-prog); background: var(--cat-prog-bg); }
  .cat-adserver { color: var(--cat-server); background: var(--cat-server-bg); }
  .cat-social { color: var(--cat-social); background: var(--cat-social-bg); }
  .cat-metrics { color: var(--cat-metrics); background: var(--cat-metrics-bg); }
  .cat-formats { color: var(--cat-formats); background: var(--cat-formats-bg); }
  .cat-market { color: var(--cat-market); background: var(--cat-market-bg); }

  .term-aka {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📖 Glossário AdTech</h1>
  <p>Termos essenciais de publicidade digital, programático, ad server e mensuração</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar termo, sigla ou palavra-chave…" autocomplete="off">
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="programmatic">🟣 Programmatic</button>
  <button class="filter-btn" data-cat="adserver">🔵 Ad Server</button>
  <button class="filter-btn" data-cat="social">🟢 Social Media Ads</button>
  <button class="filter-btn" data-cat="metrics">🟠 Mensuração &amp; Analytics</button>
  <button class="filter-btn" data-cat="formats">🔴 Formatos &amp; Criativos</button>
  <button class="filter-btn" data-cat="market">⚫ Mercado &amp; Negócios</button>
  <div class="filters-right" id="countDisplay"></div>
</div>

<div class="az-bar" id="azBar"></div>

<div class="content" id="content"></div>

<script>
const TERMS = [
  // PROGRAMMATIC
  { name: "Ad Exchange", acronym: "", cat: "programmatic", def: "Marketplace tecnológico onde publishers e anunciantes compram e vendem inventário de anúncios programaticamente em tempo real, via leilão.", aka: "" },
  { name: "Ad Fraud", acronym: "", cat: "programmatic", def: "Prática fraudulenta de gerar impressões, cliques ou conversões falsos para inflacionar métricas e drenar budget de anunciantes.", aka: "" },
  { name: "Attention Metrics", acronym: "", cat: "programmatic", def: "Métricas que medem o nível de atenção real do usuário ao anúncio (tempo de exposição, eye-tracking, interações). Evolução além de viewability.", aka: "" },
  { name: "Bid Request", acronym: "", cat: "programmatic", def: "Requisição enviada por um SSP a uma DSP com informações sobre o usuário e o inventário disponível para licitação, tudo em milissegundos.", aka: "" },
  { name: "Brand Safety", acronym: "", cat: "programmatic", def: "Conjunto de práticas e tecnologias para garantir que anúncios não sejam exibidos ao lado de conteúdo inapropriado ou prejudicial à marca.", aka: "" },
  { name: "Brand Suitability", acronym: "", cat: "programmatic", def: "Nível mais refinado de brand safety: o anunciante define quais categorias de conteúdo são adequadas para a sua marca especificamente, além das categorias bloqueadas por padrão.", aka: "" },
  { name: "CDP", acronym: "Customer Data Platform", cat: "programmatic", def: "Plataforma que unifica dados de clientes de todas as fontes (CRM, site, app, e-mail) em um perfil único e persistente, acessível por outras ferramentas de marketing.", aka: "" },
  { name: "Contextual Targeting", acronym: "", cat: "programmatic", def: "Segmentação baseada no conteúdo da página onde o anúncio é exibido, sem depender de dados do usuário. Alternativa relevante no contexto cookieless.", aka: "" },
  { name: "Cookie", acronym: "", cat: "programmatic", def: "Pequeno arquivo armazenado no browser do usuário para rastreamento de comportamento online. Em extinção progressiva por restrições de privacidade (iOS, GDPR, LGPD).", aka: "" },
  { name: "Cookieless", acronym: "", cat: "programmatic", def: "Contexto pós-extinção dos third-party cookies. Envolve soluções alternativas como IDs universais, contextual targeting e cohorts (ex: Google Topics API).", aka: "" },
  { name: "Dayparting", acronym: "", cat: "programmatic", def: "Configuração de horários específicos do dia ou dias da semana em que os anúncios serão veiculados. Permite otimizar entrega para momentos de maior receptividade.", aka: "" },
  { name: "Deal ID", acronym: "", cat: "programmatic", def: "Identificador único de um deal programático (PMP, PG ou Preferred) compartilhado entre comprador e publisher para configuração na DSP.", aka: "" },
  { name: "Demand Path Optimization", acronym: "DPO", cat: "programmatic", def: "Lado do publisher: prática de selecionar as DSPs e buyers mais eficientes para monetizar seu inventário, reduzindo intermediários.", aka: "" },
  { name: "DMP", acronym: "Data Management Platform", cat: "programmatic", def: "Plataforma que coleta, organiza e ativa dados de audiência de múltiplas fontes para segmentação. Ex: Adobe Audience Manager, Oracle BlueKai. Sendo substituída por CDPs.", aka: "" },
  { name: "DSP", acronym: "Demand-Side Platform", cat: "programmatic", def: "Plataforma usada por compradores de mídia para comprar inventário programático automaticamente via leilão em tempo real. Ex: DV360, The Trade Desk, Xandr.", aka: "" },
  { name: "First-Party Data", acronym: "1P Data", cat: "programmatic", def: "Dados coletados diretamente pelo anunciante a partir de suas próprias interações com clientes (site, app, CRM, e-mail). São os dados mais valiosos e confiáveis.", aka: "1P Data" },
  { name: "First-Price Auction", acronym: "", cat: "programmatic", def: "Modelo de leilão programático onde o vencedor paga exatamente o valor que lançou. Hoje é o padrão do mercado, substituindo o second-price.", aka: "" },
  { name: "Floor Price", acronym: "", cat: "programmatic", def: "CPM mínimo definido pelo publisher abaixo do qual o inventário não será vendido em leilão programático.", aka: "Preço de reserva" },
  { name: "Frequency Cap", acronym: "", cat: "programmatic", def: "Limite máximo de vezes que um mesmo usuário vê um anúncio em um determinado período (ex: máx. 3 vezes por dia). Controla saturação e experiência do usuário.", aka: "" },
  { name: "Header Bidding", acronym: "", cat: "programmatic", def: "Técnica que permite a múltiplos ad exchanges competir simultaneamente pelo inventário do publisher antes da chamada ao ad server primário, maximizando receita.", aka: "Prebidding" },
  { name: "ID Universal", acronym: "", cat: "programmatic", def: "Identificador alternativo ao cookie para rastreamento cross-site no ambiente cookieless. Exemplos: UID2.0 (The Trade Desk), RampID (LiveRamp), ID5.", aka: "Universal ID" },
  { name: "Invalid Traffic", acronym: "IVT", cat: "programmatic", def: "Tráfego gerado por bots ou fraude que não representa audiência humana real. Subdivide-se em GIVT (General IVT, tráfego facilmente identificável) e SIVT (Sophisticated IVT, tráfego avançado e difícil de detectar).", aka: "" },
  { name: "Lookalike Audience", acronym: "", cat: "programmatic", def: "Audiência criada algoritmicamente para encontrar usuários com perfil similar a uma audiência-semente (seed audience) definida pelo anunciante.", aka: "Similar Audience" },
  { name: "MFA", acronym: "Made For Advertising", cat: "programmatic", def: "Sites criados exclusivamente para gerar receita de anúncios, com conteúdo de baixa qualidade, clickbait e alto volume de IVT. Problema crescente no ecossistema programático.", aka: "" },
  { name: "Open Auction", acronym: "", cat: "programmatic", def: "Leilão programático aberto a todos os compradores sem restrição. Oferece maior alcance e menor custo, mas menor controle de contexto e brand safety.", aka: "Open Exchange, Open Market" },
  { name: "PMP", acronym: "Private Marketplace", cat: "programmatic", def: "Leilão programático restrito a um grupo seleto de compradores convidados pelo publisher, com preço mínimo (floor price) definido. Combina escala programática com controle de inventário.", aka: "" },
  { name: "Preferred Deal", acronym: "", cat: "programmatic", def: "Acordo de compra de inventário programático com preço fixo e acesso prioritário ao inventário, sem garantia de volume mínimo de impressões.", aka: "Programmatic Non-Guaranteed" },
  { name: "Programmatic Guaranteed", acronym: "PG", cat: "programmatic", def: "Compra programática com CPM fixo, volume de impressões garantido e datas definidas — o mais próximo de uma compra direta com automação de trafficking.", aka: "Guaranteed Deal" },
  { name: "RTB", acronym: "Real-Time Bidding", cat: "programmatic", def: "Leilão em tempo real (milissegundos) que acontece durante o carregamento de uma página para determinar qual anúncio será exibido, quem pagará e quanto.", aka: "" },
  { name: "Second-Party Data", acronym: "2P Data", cat: "programmatic", def: "Dados de primeira parte de um parceiro, compartilhados diretamente entre empresas com acordo mútuo. Ex: dados de um publisher compartilhados com um anunciante.", aka: "2P Data" },
  { name: "Second-Price Auction", acronym: "Vickrey", cat: "programmatic", def: "Modelo de leilão onde o vencedor paga o valor do segundo maior lance + R$0,01. Foi o modelo original do RTB; hoje majoritariamente substituído por first-price.", aka: "Vickrey Auction" },
  { name: "SSP", acronym: "Supply-Side Platform", cat: "programmatic", def: "Plataforma usada por publishers para disponibilizar e monetizar seu inventário de anúncios. Conecta o publisher a múltiplas DSPs e ad exchanges. Ex: Google Ad Manager, Magnite, PubMatic.", aka: "" },
  { name: "Supply Path Optimization", acronym: "SPO", cat: "programmatic", def: "Prática de otimizar e reduzir a cadeia de intermediários entre DSP e publisher para maior eficiência, transparência e melhor custo de mídia.", aka: "" },
  { name: "Third-Party Data", acronym: "3P Data", cat: "programmatic", def: "Dados de audiência coletados e vendidos por empresas externas (data providers), sem relação direta com o anunciante. Em declínio pelo fim dos third-party cookies.", aka: "3P Data" },
  { name: "vCPM", acronym: "Viewable CPM", cat: "programmatic", def: "CPM calculado com base apenas nas impressões consideradas viewable, segundo o padrão IAB. Métrica mais precisa de custo real de exposição.", aka: "" },
  { name: "Viewability", acronym: "", cat: "programmatic", def: "Métrica que mede se um anúncio teve chance real de ser visto por um usuário. Padrão IAB: mínimo 50% dos pixels em tela por 1 segundo (display) ou 2 segundos (vídeo).", aka: "" },
  { name: "Walled Garden", acronym: "", cat: "programmatic", def: "Ecossistema fechado de dados e inventário controlado por grandes plataformas (Meta, Google, Amazon) onde o acesso externo é limitado. Os dados não saem da plataforma.", aka: "" },
  { name: "Win Rate", acronym: "", cat: "programmatic", def: "Percentual de leilões ganhos em relação ao total de lances enviados por uma DSP. Indica competitividade e eficiência de bid strategy.", aka: "" },

  // AD SERVER
  { name: "Ad Server", acronym: "", cat: "adserver", def: "Plataforma tecnológica que armazena, gerencia, serve e rastreia a entrega de anúncios digitais. Responsável por decidir qual criativo exibir, servir o anúncio e registrar cada impressão e clique.", aka: "" },
  { name: "Campaign Manager 360", acronym: "CM360", cat: "adserver", def: "Ad server do Google Marketing Platform para gerenciamento de campanhas de display, vídeo e rich media. Parte central do stack GMP, integrado ao DV360.", aka: "CM360, DCM" },
  { name: "Click", acronym: "", cat: "adserver", def: "Interação do usuário ao clicar em um anúncio, geralmente redirecionando para a landing page do anunciante. Rastreado pelo ad server via redirect URL.", aka: "" },
  { name: "Click Tracker", acronym: "", cat: "adserver", def: "Tag que rastreia cliques sem servir criativo — usada para contar cliques independentemente do ad server do publisher, adicionando uma camada de medição própria do anunciante.", aka: "" },
  { name: "Creative Rotation", acronym: "", cat: "adserver", def: "Configuração de como múltiplos criativos são distribuídos dentro de um mesmo placement: mesmo peso (even), otimizado por performance, sequencial ou por regras.", aka: "" },
  { name: "Display & Video 360", acronym: "DV360", cat: "adserver", def: "DSP do Google Marketing Platform integrada ao CM360. Permite compra programática de display, vídeo, áudio, CTV e mais, com acesso a inventário global.", aka: "DV360" },
  { name: "Floodlight", acronym: "", cat: "adserver", def: "Sistema de tags de conversão do Google (CM360/DV360) para rastrear ações dos usuários após exposição a anúncios: compras, cadastros, visitas a páginas específicas.", aka: "" },
  { name: "iFrame Tag", acronym: "", cat: "adserver", def: "Tipo de tag de ad server que carrega o anúncio dentro de um frame isolado. Mais compatível com publishers legados, mas com limitações de rastreamento e interação.", aka: "" },
  { name: "Impression", acronym: "", cat: "adserver", def: "Cada vez que um anúncio é carregado e exibido para um usuário. Unidade básica de contagem de entrega de mídia digital.", aka: "" },
  { name: "Impression Tracker", acronym: "Pixel 1×1", cat: "adserver", def: "Imagem transparente de 1×1 pixel usada para contar impressões de forma independente, sem depender da contagem do publisher ou plataforma.", aka: "Pixel 1×1" },
  { name: "JavaScript Tag", acronym: "", cat: "adserver", def: "Tipo de tag de ad server que permite rastreamento mais avançado e interações com o DOM da página. Mais poderoso que iFrame, mas pode ter restrições em alguns publishers.", aka: "" },
  { name: "Placement", acronym: "", cat: "adserver", def: "Posição específica de anúncio em um site ou app, definida por formato, dimensão e localização na página. Unidade de compra e de configuração no ad server.", aka: "" },
  { name: "Tag", acronym: "", cat: "adserver", def: "Trecho de código (JavaScript, iFrame ou URL) gerado pelo ad server para ser implementado no site do publisher, responsável por servir o criativo e rastrear a entrega.", aka: "" },
  { name: "Trafficking", acronym: "", cat: "adserver", def: "Processo de configurar e organizar campanhas, criativos e tags em um ad server para entrega. Inclui upload de criativos, definição de regras de veiculação e geração de tags.", aka: "" },
  { name: "Trafficking Sheet", acronym: "", cat: "adserver", def: "Documento (geralmente Excel/Sheets) com todos os detalhes de uma campanha (placements, formatos, URLs, tags) usado para configuração no ad server e envio ao publisher.", aka: "Tabela de trafficking" },
  { name: "VAST", acronym: "Video Ad Serving Template", cat: "adserver", def: "Padrão IAB de comunicação entre ad servers e players de vídeo para servir anúncios in-stream. Define o protocolo de requisição e resposta para vídeo digital.", aka: "" },
  { name: "VPAID", acronym: "Video Player Ad Interface Definition", cat: "adserver", def: "Extensão do VAST que permite interatividade no anúncio de vídeo via script JavaScript. Em desuso por problemas de segurança e performance; substituído por SIMID.", aka: "" },

  // SOCIAL
  { name: "ABM", acronym: "Account-Based Marketing", cat: "social", def: "Estratégia B2B de segmentar anúncios por empresa (account), não por indivíduo. Amplamente usado no LinkedIn para alcançar decisores de empresas-alvo específicas.", aka: "" },
  { name: "Business Manager", acronym: "BM", cat: "social", def: "Plataforma central do Meta para gerenciar ativos de anúncios (ad accounts, páginas, pixels, catálogos) de um ou múltiplos clientes com controle de acesso granular.", aka: "Meta Business Suite" },
  { name: "CBO", acronym: "Campaign Budget Optimization", cat: "social", def: "Funcionalidade onde o budget é definido no nível de campanha e a plataforma distribui automaticamente entre os conjuntos de anúncios/ad groups conforme performance.", aka: "Advantage Campaign Budget" },
  { name: "Conversions API", acronym: "CAPI", cat: "social", def: "Integração server-side que envia eventos de conversão diretamente do servidor do anunciante para a plataforma, reduzindo dependência do pixel e impacto do bloqueio de cookies (iOS 14+).", aka: "CAPI, Server-Side API" },
  { name: "Custom Audience", acronym: "", cat: "social", def: "Audiência criada a partir de dados próprios do anunciante: lista de clientes (e-mail, telefone), visitantes do site (via pixel) ou usuários do app.", aka: "" },
  { name: "Dark Post", acronym: "", cat: "social", def: "Anúncio criado para veiculação paga que não aparece na timeline orgânica do perfil da marca. Permite mensagens direcionadas a públicos específicos sem impacto no feed orgânico.", aka: "Unpublished Post" },
  { name: "Dynamic Creative", acronym: "DCO", cat: "social", def: "Funcionalidade que combina automaticamente múltiplos títulos, descrições, imagens e CTAs para encontrar a melhor combinação por público via machine learning.", aka: "Dynamic Creative Optimization" },
  { name: "Engagement Rate", acronym: "", cat: "social", def: "Taxa de engajamento: (curtidas + comentários + compartilhamentos) / alcance ou impressões × 100. Indica relevância e qualidade da interação com o conteúdo.", aka: "" },
  { name: "Lead Gen Form", acronym: "", cat: "social", def: "Formulário nativo dentro da plataforma (Meta, LinkedIn, TikTok) que coleta dados do usuário sem redirecioná-lo para um site externo, reduzindo fricção e aumentando CVR.", aka: "Lead Form, Formulário de Cadastro" },
  { name: "Lookalike", acronym: "Similar Audience", cat: "social", def: "Audiência criada pela plataforma com usuários de perfil similar a uma Custom Audience de referência. Cada plataforma tem seu algoritmo próprio (Meta, LinkedIn, TikTok, X).", aka: "Similar Audience, Público Semelhante" },
  { name: "Pixel", acronym: "", cat: "social", def: "Tag de rastreamento instalada no site para medir conversões e construir audiências de retargeting. Cada plataforma tem o seu: Meta Pixel, LinkedIn Insight Tag, TikTok Pixel, X Website Tag.", aka: "" },
  { name: "Reach & Frequency", acronym: "R&F", cat: "social", def: "Modalidade de compra de mídia em social onde o alcance e a frequência são garantidos com CPM fixo, via reserva prévia. Controle total de entrega x alcance.", aka: "R&F" },
  { name: "ROAS", acronym: "Return On Ad Spend", cat: "social", def: "Receita gerada dividida pelo investimento em mídia. ROAS = Receita / Investimento. Ex: ROAS de 4 = para cada R$1 investido, R$4 em receita.", aka: "" },
  { name: "Spark Ad", acronym: "", cat: "social", def: "Formato do TikTok que permite impulsionar posts orgânicos de contas TikTok como anúncios pagos, mantendo engajamento orgânico acumulado e credibilidade.", aka: "" },

  // METRICS
  { name: "A/B Test", acronym: "", cat: "metrics", def: "Experimento controlado que compara duas versões (A e B) de um elemento (criativo, landing page, audiência) para determinar qual performa melhor, com significância estatística.", aka: "Split Test" },
  { name: "Atribuição", acronym: "", cat: "metrics", def: "Processo de dar crédito a pontos de contato de mídia que contribuíram para uma conversão. Modelo de atribuição define como esse crédito é distribuído entre os canais.", aka: "Attribution" },
  { name: "Brand Lift", acronym: "", cat: "metrics", def: "Pesquisa que mede o impacto de uma campanha de branding em métricas como lembrança de anúncio, lembrança de marca, consideração e intenção de compra, via survey.", aka: "" },
  { name: "CPA", acronym: "Cost Per Acquisition", cat: "metrics", def: "Custo por aquisição ou ação: Investimento / Conversões. Métrica central para campanhas de performance, indica quanto custa gerar cada conversão.", aka: "Cost Per Action" },
  { name: "CPC", acronym: "Cost Per Click", cat: "metrics", def: "Custo por clique: Investimento / Cliques. Modelo de compra ou métrica de eficiência que indica quanto custa cada clique gerado pela campanha.", aka: "" },
  { name: "CPL", acronym: "Cost Per Lead", cat: "metrics", def: "Custo por lead gerado: Investimento / Leads. Métrica de performance para campanhas de geração de cadastros e formulários.", aka: "" },
  { name: "CPM", acronym: "Cost Per Mille", cat: "metrics", def: "Custo por mil impressões: Investimento / Impressões × 1.000. Principal modelo de compra de mídia de display, programático e social (branding).", aka: "Custo por Mil" },
  { name: "CPV", acronym: "Cost Per View", cat: "metrics", def: "Custo por visualização de vídeo: Investimento / Visualizações. O que conta como 'view' varia por plataforma (ex: 3 segundos no TrueView, 2 segundos no Meta).", aka: "" },
  { name: "CTR", acronym: "Click-Through Rate", cat: "metrics", def: "Taxa de cliques: Cliques / Impressões × 100. Indica a proporção de usuários que clicaram no anúncio em relação ao total que o viu.", aka: "Taxa de Clique" },
  { name: "CVR", acronym: "Conversion Rate", cat: "metrics", def: "Taxa de conversão: Conversões / Cliques × 100. Mede a eficiência da landing page ou funil em converter cliques em ações desejadas.", aka: "Taxa de Conversão" },
  { name: "Data-Driven Attribution", acronym: "", cat: "metrics", def: "Modelo de atribuição que usa Machine Learning para distribuir crédito entre os pontos de contato com base em dados reais de conversão, em vez de regras pré-definidas.", aka: "" },
  { name: "DoubleVerify", acronym: "DV", cat: "metrics", def: "Empresa de verificação de terceiros especializada em brand safety, viewability e detecção de fraude. Concorrente do IAS; ambas são integradas a DSPs e ad servers.", aka: "" },
  { name: "First Click", acronym: "", cat: "metrics", def: "Modelo de atribuição que dá 100% do crédito ao primeiro clique da jornada do usuário antes da conversão. Valoriza canais de descoberta (topo de funil).", aka: "" },
  { name: "GA4", acronym: "Google Analytics 4", cat: "metrics", def: "Versão atual do Google Analytics, baseada em eventos (não sessões), com modelo de dados mais flexível e integração nativa com Google Ads e BigQuery.", aka: "" },
  { name: "Google Tag Manager", acronym: "GTM", cat: "metrics", def: "Gerenciador de tags que permite implementar e atualizar tags de rastreamento sem alterações de código no site. Centraliza pixels, conversion tags e scripts de terceiros.", aka: "GTM" },
  { name: "IAS", acronym: "Integral Ad Science", cat: "metrics", def: "Empresa de verificação de terceiros especializada em brand safety, viewability e detecção de fraude. Integrada a principais DSPs, ad servers e plataformas sociais.", aka: "" },
  { name: "Incrementality", acronym: "", cat: "metrics", def: "Método de medição que isola o efeito real de uma campanha comparando grupo exposto (test) vs grupo controle (holdout). Mostra o lift real causado pela mídia.", aka: "Causal Measurement, Holdout Test" },
  { name: "Janela de Atribuição", acronym: "", cat: "metrics", def: "Período de tempo após um clique ou impressão dentro do qual uma conversão é atribuída ao anúncio. Ex: janela de 7 dias para clique e 1 dia para visualização.", aka: "Lookback Window, Attribution Window" },
  { name: "KPI", acronym: "Key Performance Indicator", cat: "metrics", def: "Métrica principal usada para avaliar o sucesso de uma campanha em relação ao objetivo definido. Varia conforme o objetivo: CPM para alcance, CPA para performance, ROAS para e-commerce.", aka: "" },
  { name: "Last Click", acronym: "", cat: "metrics", def: "Modelo de atribuição que dá 100% do crédito ao último clique antes da conversão. É o modelo padrão mais comum, mas tende a supervalorizar canais de conversão (fundo de funil).", aka: "" },
  { name: "Linear Attribution", acronym: "", cat: "metrics", def: "Modelo de atribuição que distribui o crédito igualmente entre todos os pontos de contato da jornada do usuário antes da conversão.", aka: "" },
  { name: "Pacing", acronym: "", cat: "metrics", def: "Ritmo de entrega de uma campanha em relação ao budget e período planejados. Pacing saudável = entrega uniforme. Underpacing = entrega abaixo do esperado; overpacing = acima.", aka: "" },
  { name: "Share of Voice", acronym: "SOV", cat: "metrics", def: "Parcela de voz de uma marca em relação à categoria, geralmente medida por impressões ou investimento em mídia. SOV alto correlaciona com crescimento de market share.", aka: "" },
  { name: "Third-Party Verification", acronym: "", cat: "metrics", def: "Verificação independente de métricas de entrega (impressões, cliques, viewability, brand safety) por empresas especializadas como IAS, DoubleVerify e MOAT.", aka: "" },
  { name: "UTM Parameters", acronym: "", cat: "metrics", def: "Parâmetros adicionados às URLs para rastrear a origem do tráfego no Google Analytics: utm_source, utm_medium, utm_campaign, utm_content, utm_term.", aka: "UTM Tags" },
  { name: "View-Through Conversion", acronym: "VTC", cat: "metrics", def: "Conversão atribuída a uma exposição (impressão) sem clique — o usuário viu o anúncio e converteu depois por outro canal dentro da janela de atribuição.", aka: "VTC" },
  { name: "VTR", acronym: "View-Through Rate", cat: "metrics", def: "Taxa de visualização completa de vídeo: Visualizações completas / Impressões × 100. Indica qualidade do engajamento com o criativo de vídeo.", aka: "Video Completion Rate (VCR)" },

  // FORMATS
  { name: "Aspect Ratio", acronym: "", cat: "formats", def: "Relação entre largura e altura de uma imagem ou vídeo. Formatos comuns: 16:9 (horizontal/landscape), 1:1 (quadrado), 9:16 (vertical/reels/stories), 4:5 (feed vertical).", aka: "Proporção" },
  { name: "Bumper Ad", acronym: "", cat: "formats", def: "Vídeo curto de até 6 segundos, não pulável. Ideal para mensagem objetiva de branding e awareness. Muito usado no YouTube em conjunto com TrueView.", aka: "" },
  { name: "CTA", acronym: "Call to Action", cat: "formats", def: "Elemento de texto ou botão que instrui o usuário a tomar uma ação específica: 'Saiba mais', 'Comprar agora', 'Cadastre-se', 'Baixar app'. Elemento crítico de todo criativo.", aka: "Call to Action" },
  { name: "CTV", acronym: "Connected TV", cat: "formats", def: "Televisão conectada à internet (Smart TVs, Chromecast, Apple TV, Fire Stick). Inventário premium crescente, com CPMs altos e audiência engajada em ambiente de tela grande.", aka: "Streaming TV" },
  { name: "DCO", acronym: "Dynamic Creative Optimization", cat: "formats", def: "Tecnologia que personaliza o criativo em tempo real com base em dados do usuário (localização, comportamento, perfil, clima) para maximizar relevância e performance.", aka: "" },
  { name: "Display", acronym: "", cat: "formats", def: "Anúncios gráficos (imagem estática ou HTML5 animado) exibidos em sites e apps. Formatos padronizados pelo IAB: leaderboard (728×90), rectangle (300×250), skyscraper (160×600).", aka: "Banner" },
  { name: "DOOH", acronym: "Digital Out-of-Home", cat: "formats", def: "Publicidade digital em espaços físicos públicos: outdoors digitais, painéis em shoppings, aeroportos, elevadores. Pode ser comprado programaticamente.", aka: "" },
  { name: "Expandable", acronym: "", cat: "formats", def: "Banner de display que expande para um tamanho maior quando o usuário interage (hover ou clique), revelando mais conteúdo sem redirecionar para outra página.", aka: "" },
  { name: "HTML5", acronym: "", cat: "formats", def: "Padrão para criação de banners animados interativos que substituiu o Flash. Entregue como arquivo ZIP com index.html, imagens e scripts. Suportado por todos os ad servers modernos.", aka: "" },
  { name: "In-Stream Video", acronym: "", cat: "formats", def: "Anúncio de vídeo exibido antes (pre-roll), durante (mid-roll) ou após (post-roll) um vídeo de conteúdo. Formato mais impactante de vídeo digital.", aka: "Pre-roll, Mid-roll" },
  { name: "Interstitial", acronym: "", cat: "formats", def: "Anúncio em tela cheia exibido entre páginas ou telas de um app. Alta visibilidade, mas pode impactar negativamente a experiência do usuário se usado em excesso.", aka: "" },
  { name: "Native Ad", acronym: "", cat: "formats", def: "Formato de anúncio que se integra visualmente ao conteúdo editorial do site ou app, parecendo parte do conteúdo. Menor rejeição do usuário, maior engajamento.", aka: "Conteúdo patrocinado" },
  { name: "Non-skippable Ad", acronym: "", cat: "formats", def: "Anúncio de vídeo que deve ser assistido completamente antes do conteúdo. Geralmente de 15–20 segundos. Garante exposição total da mensagem, CPM mais elevado.", aka: "" },
  { name: "OTT", acronym: "Over-The-Top", cat: "formats", def: "Conteúdo de vídeo entregue via internet sem intermediação de operadoras tradicionais (streaming). Principal ambiente de anúncios CTV. Ex: Globoplay, Star+, Pluto TV.", aka: "" },
  { name: "Out-Stream Video", acronym: "", cat: "formats", def: "Vídeo exibido fora de um player de vídeo — dentro do conteúdo editorial de um site (in-read) ou em feeds sociais. Reprodução automática sem depender de conteúdo de vídeo do publisher.", aka: "" },
  { name: "Rich Media", acronym: "", cat: "formats", def: "Formato de display com interatividade avançada: expansão, vídeo embutido, jogos, formulários, polite load. Desenvolvido em HTML5, servido via plataformas como Celtra ou Studio.", aka: "" },
  { name: "Skippable Ad", acronym: "", cat: "formats", def: "Anúncio de vídeo que o usuário pode pular após um período mínimo (geralmente 5 segundos). No TrueView (YouTube), o anunciante paga apenas se o usuário assistir ao mínimo definido.", aka: "TrueView" },
  { name: "Storyboard", acronym: "", cat: "formats", def: "Sequência visual de frames que representa a estrutura narrativa de um vídeo publicitário antes da produção. Essencial para alinhamento de criativo entre agência e anunciante.", aka: "" },
  { name: "UGC", acronym: "User Generated Content", cat: "formats", def: "Conteúdo criado por usuários reais (consumidores, influenciadores), utilizado como criativo em anúncios por sua autenticidade. Alta performance em social, especialmente TikTok.", aka: "" },

  // MARKET
  { name: "Agency Trading Desk", acronym: "ATD", cat: "market", def: "Mesa de compra programática operada por uma agência de mídia em nome de seus clientes. Oferece escala, negociação centralizada de deals e expertise técnica em DSPs.", aka: "ATD" },
  { name: "CAC", acronym: "Customer Acquisition Cost", cat: "market", def: "Custo médio para adquirir um novo cliente: Total de Investimento em Marketing e Vendas / Número de Novos Clientes. Métrica fundamental para avaliar sustentabilidade do negócio.", aka: "" },
  { name: "CPD", acronym: "Cost Per Day", cat: "market", def: "Modelo de compra por período fixo, geralmente para posições premium como homepage takeovers e patrocínios de seção. Garante visibilidade exclusiva por tempo determinado.", aka: "" },
  { name: "CPP", acronym: "Cost Per Point", cat: "market", def: "Custo por ponto de GRP em TV — referência usada para comparação de eficiência entre campanhas de TV e digital.", aka: "" },
  { name: "Flight", acronym: "", cat: "market", def: "Período de veiculação de uma campanha ou de uma fase específica dela (ex: 'flight de lançamento: 01/11–15/11'). Termo padrão do mercado de mídia.", aka: "Período de veiculação" },
  { name: "Full-Funnel", acronym: "", cat: "market", def: "Estratégia de mídia que cobre todas as etapas do funil de marketing: awareness (topo) → consideração (meio) → conversão (fundo). Abordagem holística que integra diferentes formatos e canais.", aka: "" },
  { name: "GMV", acronym: "Gross Merchandise Value", cat: "market", def: "Valor total de produtos vendidos em um marketplace, independente de descontos ou devoluções. Métrica de volume de negócios, não de receita líquida.", aka: "" },
  { name: "GRP", acronym: "Gross Rating Point", cat: "market", def: "Métrica de peso de audiência em TV: alcance × frequência. Usada para planejar campanhas de TV e como referência de comparação com digital.", aka: "" },
  { name: "Insertion Order", acronym: "IO", cat: "market", def: "Documento formal de compra de mídia entre anunciante/agência e veículo, com detalhes de volume, preço, período e condições. Equivalente ao contrato de compra de mídia.", aka: "Ordem de Inserção" },
  { name: "LTV", acronym: "Lifetime Value", cat: "market", def: "Valor total que um cliente gera para a empresa ao longo de todo o relacionamento. Usado para calcular quanto vale investir na aquisição (CAC) de cada cliente.", aka: "" },
  { name: "Managed Service", acronym: "", cat: "market", def: "Modelo onde a DSP, plataforma ou agência opera as campanhas em nome do anunciante. Oposto ao self-serve. Comum em empresas sem equipe de mídia interna.", aka: "" },
  { name: "Media Mix", acronym: "", cat: "market", def: "Combinação de canais e plataformas utilizados em uma estratégia de mídia (ex: 40% programático, 30% social, 20% search, 10% CTV). Define como o budget é distribuído entre meios.", aka: "" },
  { name: "Media Plan", acronym: "", cat: "market", def: "Documento que detalha a estratégia, alocação de budget, canais, formatos, audiências, métricas e cronograma de uma campanha de mídia. Principal entregável do planejamento.", aka: "Plano de Mídia" },
  { name: "Prospecting", acronym: "", cat: "market", def: "Estratégia de atingir novos usuários que ainda não conhecem a marca (topo de funil). Oposto ao retargeting. Usa audiências de interesse, lookalike e contextual.", aka: "" },
  { name: "Programmatic Direct", acronym: "", cat: "market", def: "Compra programática de inventário garantido com publisher específico. Engloba Programmatic Guaranteed e Preferred Deals. Combina automação com relação direta com o publisher.", aka: "" },
  { name: "Retargeting", acronym: "", cat: "market", def: "Estratégia de exibir anúncios para usuários que já tiveram alguma interação prévia com a marca (visitaram o site, adicionaram ao carrinho, viram um vídeo). Fundo de funil.", aka: "Remarketing" },
  { name: "Sazonalidade", acronym: "", cat: "market", def: "Variação de CPM e performance ao longo do ano devido a datas comemorativas e picos de demanda. Black Friday e Natal elevam CPMs significativamente no Q4.", aka: "" },
  { name: "Self-Serve", acronym: "", cat: "market", def: "Modelo onde o próprio anunciante ou agência opera diretamente na plataforma de mídia, sem intermediação de um managed service. Oferece mais controle e agilidade.", aka: "" },
  { name: "Share of Wallet", acronym: "", cat: "market", def: "Percentual do budget total de um cliente que é alocado para um veículo, plataforma ou agência específica. Métrica comercial usada por veículos para avaliar penetração de conta.", aka: "" },
  { name: "Trading Desk", acronym: "", cat: "market", def: "Equipe especializada em compra programática dentro de uma agência ou como empresa independente (Independent Trading Desk - ITD). Gerencia DSPs, deals e otimização de mídia.", aka: "" },
  { name: "Upfront", acronym: "", cat: "market", def: "Compra antecipada de inventário de mídia para períodos futuros, geralmente com desconto sobre o preço spot. Prática comum em TV, crescente no streaming e CTV.", aka: "" }
];

// Sort terms alphabetically
TERMS.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const CAT_LABELS = {
  programmatic: "🟣 Programmatic",
  adserver: "🔵 Ad Server",
  social: "🟢 Social",
  metrics: "🟠 Mensuração",
  formats: "🔴 Formatos",
  market: "⚫ Mercado"
};

let currentCat = "all";
let currentSearch = "";

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === "all" || t.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.acronym.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.aka.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const content = document.getElementById("content");
  const countDisplay = document.getElementById("countDisplay");

  countDisplay.textContent = `${filtered.length} de ${TERMS.length} termos`;

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum termo encontrado</h3><p>Tente buscar por outra palavra ou limpe os filtros.</p></div>`;
    return;
  }

  // Group by first letter
  const byLetter = {};
  filtered.forEach(t => {
    const letter = t.name[0].toUpperCase();
    if (!byLetter[letter]) byLetter[letter] = [];
    byLetter[letter].push(t);
  });

  let html = "";
  Object.keys(byLetter).sort().forEach(letter => {
    html += `<div class="letter-section" id="letter-${letter}">
      <div class="letter-heading"><h2>${letter}</h2><hr></div>
      <div class="terms-grid">`;
    byLetter[letter].forEach(t => {
      html += `<div class="term-card">
        <div class="term-header">
          <div class="term-name">${t.name}</div>
          ${t.acronym ? `<div class="term-acronym">${t.acronym}</div>` : ""}
        </div>
        <div class="term-def">${t.def}</div>
        <div class="term-footer">
          <span class="cat-tag cat-${t.cat}">${CAT_LABELS[t.cat]}</span>
          ${t.aka ? `<span class="term-aka">Tb. conhecido como: ${t.aka}</span>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter) {
  const bar = document.getElementById("azBar");
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  bar.innerHTML = all.map(l => {
    if (byLetter && byLetter[l]) {
      return `<a class="az-btn" href="#letter-${l}">${l}</a>`;
    }
    return `<span class="az-btn disabled">${l}</span>`;
  }).join("");
}

// Init A-Z with all letters
updateAZBar(null);

// Filters
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

// Search
document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

// Initial render
render();
</script>
</body>
</html>
