<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NC Template Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--card:#fff;--border:#e4e4e7;
  --fg:#18181b;--muted:#71717a;--mono:'JetBrains Mono',monospace;
  --accent:#10b981;--accent-fg:#fff;--accent-light:#f0fdf4;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --fixed:#6366f1;--fixed-bg:#eef2ff;
  --var:#f59e0b;--var-bg:#fffbeb;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#052e16;
  --fixed-bg:#1e1b4b;--var-bg:#1c1400;
}}
:root[data-theme="dark"]{
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#052e16;
  --fixed-bg:#1e1b4b;--var-bg:#1c1400;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;padding:0 0 60px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700;flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-primary:hover{opacity:.88}
.btn-sm{padding:4px 10px;font-size:11px}
.wrap{max-width:1060px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
.col-full{grid-column:1/-1}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

/* Segments builder */
.seg-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.seg-row{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.seg-num{font-size:11px;font-weight:800;color:var(--muted);min-width:20px}
.seg-name{flex:1;border:none;background:transparent;color:var(--fg);font-family:inherit;font-size:12px;font-weight:600;outline:none}
.seg-type-btn{padding:4px 10px;border-radius:6px;border:1px solid;font-size:11px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
.type-fixed{background:var(--fixed-bg);color:var(--fixed);border-color:var(--fixed)}
.type-var{background:var(--var-bg);color:var(--var);border-color:var(--var)}
.seg-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
.seg-del:hover{color:#ef4444}

/* Values textarea */
.var-block{margin-bottom:10px}
.var-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.var-label span{color:var(--var)}
textarea.var-vals{width:100%;min-height:64px;padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:11px;resize:vertical;outline:none;line-height:1.6}
textarea.var-vals:focus{border-color:var(--accent)}

/* Preview */
.preview-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;min-height:40px}
.preview-chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid;display:inline-block}
.chip-fixed{background:var(--fixed-bg);color:var(--fixed);border-color:var(--fixed)44}
.chip-var{background:var(--var-bg);color:var(--var);border-color:var(--var)44}
.chip-sep{color:var(--muted);font-size:10px;padding:2px 1px;border:none;background:none}

/* Results */
.result-list{max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.result-item{font-family:var(--mono);font-size:12px;padding:7px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:var(--accent-light)}
.result-nc{flex:1;font-weight:700}
.result-copy{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:2px 4px}
.result-copy:hover{color:var(--accent)}

.sep-sel{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--fg)}

.stat{font-size:11px;color:var(--muted);font-weight:600}
.stat strong{color:var(--accent)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#18181b;color:#fff;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:600;transition:.25s;opacity:0;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <span style="font-size:18px">🧩</span>
  <h1>NC Template Builder</h1>
  <button class="btn btn-primary" onclick="generate()">▶ Gerar NCs</button>
  <button class="btn" onclick="copyAll()">⎘ Copiar tudo</button>
  <button class="btn" onclick="exportTxt()">↓ .txt</button>
  <button class="btn" id="themeBtn" onclick="toggleTheme()">◑</button>
</header>

<div class="wrap">
  <!-- Template builder -->
  <div class="card">
    <div class="card-header">
      🧩 Estrutura do Template
      <select class="sep-sel" id="cfgSep" style="margin-left:auto" onchange="updatePreview()">
        <option value="_">_ underscore</option>
        <option value="-">- hífen</option>
        <option value=".">. ponto</option>
        <option value="|">| pipe</option>
      </select>
    </div>
    <div class="card-body">
      <div class="seg-list" id="segList"></div>
      <button class="btn btn-sm" onclick="addSeg()">+ Adicionar segmento</button>

      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Preview do template</div>
        <div class="preview-wrap" id="previewWrap"></div>
        <div class="stat" id="combStat"></div>
      </div>
    </div>
  </div>

  <!-- Variable values -->
  <div class="card">
    <div class="card-header">🔀 Valores das Variáveis</div>
    <div class="card-body">
      <div id="varBlocks">
        <div style="color:var(--muted);font-size:12px">Adicione segmentos variáveis no template para ver os campos aqui.</div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="card col-full">
    <div class="card-header">
      ✅ NCs Geradas
      <span class="stat" style="margin-left:auto" id="resultStat">0 NCs</span>
    </div>
    <div class="card-body">
      <div class="result-list" id="resultList">
        <div style="padding:40px;text-align:center;color:var(--muted)">Configure o template e clique em <strong>Gerar NCs</strong>.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const THEME_KEY='nctmpl_theme';
const STORE_KEY='nctmpl_v1';
let _segs=[];
let _generated=[];

function initTheme(){
  const t=localStorage.getItem(THEME_KEY)||'system';
  if(t!=='system') document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(THEME_KEY,next);
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(d&&d.segs){_segs=d.segs;document.getElementById('cfgSep').value=d.sep||'_';}
    else defaultSegs();
  }catch{defaultSegs();}
  renderSegList();
  renderVarBlocks();
  updatePreview();
}
function save(){
  const sep=document.getElementById('cfgSep').value;
  try{localStorage.setItem(STORE_KEY,JSON.stringify({segs:_segs,sep}));}catch{}
}
function defaultSegs(){
  _segs=[
    {name:'canal',type:'fixed',val:'camp'},
    {name:'objetivo',type:'var'},
    {name:'produto',type:'var'},
    {name:'periodo',type:'fixed',val:'q1'},
    {name:'formato',type:'var'},
  ];
}

// ── Segments ────────────────────────────────────────────────────────────────
function renderSegList(){
  const list=document.getElementById('segList');
  list.innerHTML=_segs.map((s,i)=>{
    const isFixed=s.type==='fixed';
    return `<div class="seg-row" id="segrow_${i}">
      <span class="seg-num">${i+1}</span>
      <input class="seg-name" value="${esc(s.name)}" placeholder="nome" oninput="onSegName(${i},this.value)" />
      ${isFixed?`<input style="width:90px;border:1px solid var(--border);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:11px" value="${esc(s.val||'')}" placeholder="valor" oninput="onSegVal(${i},this.value)">`:'<span style="font-size:11px;color:var(--muted)">valores abaixo →</span>'}
      <button class="seg-type-btn ${isFixed?'type-fixed':'type-var'}" onclick="toggleType(${i})">${isFixed?'FIXO':'VAR'}</button>
      <button class="seg-del" onclick="delSeg(${i})">✕</button>
    </div>`;
  }).join('');
}
function onSegName(i,v){_segs[i].name=v;save();updatePreview();}
function onSegVal(i,v){_segs[i].val=v;save();updatePreview();}
function toggleType(i){
  _segs[i].type=_segs[i].type==='fixed'?'var':'fixed';
  if(_segs[i].type==='fixed'&&!_segs[i].val) _segs[i].val=_segs[i].name;
  save();
  renderSegList();
  renderVarBlocks();
  updatePreview();
}
function addSeg(){
  _segs.push({name:'seg'+ (_segs.length+1),type:'var'});
  save();renderSegList();renderVarBlocks();updatePreview();
}
function delSeg(i){
  _segs.splice(i,1);save();renderSegList();renderVarBlocks();updatePreview();
}

// ── Var blocks ───────────────────────────────────────────────────────────────
function renderVarBlocks(){
  const vars=_segs.map((s,i)=>({...s,i})).filter(s=>s.type==='var');
  const container=document.getElementById('varBlocks');
  if(!vars.length){
    container.innerHTML='<div style="color:var(--muted);font-size:12px">Nenhum segmento variável no template.</div>';
    return;
  }
  // Preserve existing textarea values
  const existing={};
  container.querySelectorAll('textarea[data-idx]').forEach(ta=>{existing[ta.dataset.idx]=ta.value;});
  container.innerHTML=vars.map(s=>`
    <div class="var-block">
      <div class="var-label"><span>Segmento ${s.i+1}: ${esc(s.name)}</span><span>um por linha</span></div>
      <textarea class="var-vals" data-idx="${s.i}" placeholder="valor1&#10;valor2&#10;valor3">${existing[s.i]||''}</textarea>
    </div>`).join('');
}

// ── Preview ───────────────────────────────────────────────────────────────────
function updatePreview(){
  const sep=document.getElementById('cfgSep').value;
  const chips=_segs.map(s=>{
    if(s.type==='fixed') return `<span class="preview-chip chip-fixed">${esc(s.val||s.name||'…')}</span>`;
    return `<span class="preview-chip chip-var">{${esc(s.name||'var')}}</span>`;
  });
  const withSeps=[];
  chips.forEach((c,i)=>{if(i>0) withSeps.push(`<span class="chip-sep">${sep}</span>`);withSeps.push(c);});
  document.getElementById('previewWrap').innerHTML=withSeps.join('');

  // Combo estimate
  const varSegs=_segs.filter(s=>s.type==='var');
  const tas=document.getElementById('varBlocks').querySelectorAll('textarea[data-idx]');
  let est=1;
  tas.forEach(ta=>{const v=ta.value.split('\n').map(l=>l.trim()).filter(Boolean).length;if(v>0) est*=v;});
  if(varSegs.length===0) est=1;
  document.getElementById('combStat').innerHTML=est>0?`Combinações estimadas: <strong>${est.toLocaleString('pt-BR')}</strong>`:'';
}

// ── Generate ──────────────────────────────────────────────────────────────────
function generate(){
  const sep=document.getElementById('cfgSep').value;

  // Collect var values
  const varVals={};
  document.getElementById('varBlocks').querySelectorAll('textarea[data-idx]').forEach(ta=>{
    const idx=parseInt(ta.dataset.idx);
    varVals[idx]=ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  });

  // Build combinations (cartesian product)
  let combos=[[]];
  for(let i=0;i<_segs.length;i++){
    const s=_segs[i];
    if(s.type==='fixed'){
      combos=combos.map(c=>[...c,s.val||s.name]);
    } else {
      const vals=varVals[i]||[];
      if(vals.length===0){showToast(`Segmento "${s.name}" sem valores`);return;}
      if(combos.length*vals.length>5000){showToast('Limite: 5.000 NCs por geração');return;}
      combos=combos.flatMap(c=>vals.map(v=>[...c,v]));
    }
  }

  _generated=combos.map(parts=>parts.join(sep));
  renderResults();
  document.getElementById('resultStat').textContent=_generated.length+' NC'+(_generated.length!==1?'s':'');
  updatePreview();
  showToast(`✓ ${_generated.length} NCs geradas`);
}

function renderResults(){
  const list=document.getElementById('resultList');
  if(!_generated.length){list.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">Nenhuma NC gerada ainda.</div>';return;}
  list.innerHTML=_generated.map((nc,i)=>`
    <div class="result-item">
      <span class="result-nc">${esc(nc)}</span>
      <button class="result-copy" onclick="copyOne('${esc(nc)}')" title="Copiar">⎘</button>
    </div>`).join('');
}

// ── Clipboard / export ────────────────────────────────────────────────────────
function copyOne(nc){
  navigator.clipboard.writeText(nc).then(()=>showToast('✓ Copiado')).catch(()=>{});
}
function copyAll(){
  if(!_generated.length){showToast('Gere as NCs primeiro');return;}
  navigator.clipboard.writeText(_generated.join('\n')).then(()=>showToast(`✓ ${_generated.length} NCs copiadas`)).catch(()=>{});
}
function exportTxt(){
  if(!_generated.length){showToast('Gere as NCs primeiro');return;}
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(_generated.join('\n'));
  a.download='nc-generated.txt';a.click();
  showToast('✓ .txt exportado');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2500);
}

initTheme();
load();
// Live preview update when var values change
document.getElementById('varBlocks').addEventListener('input',updatePreview);
</script>
</body>
</html>
