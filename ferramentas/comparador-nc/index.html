<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador NC — Dicionários lado a lado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f8f9fc;--fg:#111827;--card:#fff;--card-border:#e5e7eb;
  --accent:#2563eb;--accent-soft:#eff6ff;--faint:#6b7280;--pill:#f3f4f6;
  --input-bg:#fff;--input-border:#d1d5db;--ok:#16a34a;--warn:#d97706;--erro:#dc2626;
  --divider:#f0f0f4;--shadow:0 1px 4px rgba(0,0,0,.07);--radius:10px;
  --mono:'DM Mono',monospace;
  --only-a:#fef2f2;--only-a-fg:#991b1b;
  --only-b:#f0fdf4;--only-b-fg:#14532d;
  --shared:#eff6ff;--shared-fg:#1e40af;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--fg:#e5e7eb;--card:#1a1d27;--card-border:#2d3148;
  --accent:#3b82f6;--accent-soft:#1e3a5f;--faint:#9ca3af;--pill:#252836;
  --input-bg:#1e2130;--input-border:#3d4263;--divider:#1e2130;
  --shadow:0 1px 4px rgba(0,0,0,.35);color-scheme:dark;
  --only-a:#450a0a;--only-a-fg:#fca5a5;
  --only-b:#052e16;--only-b-fg:#86efac;
  --shared:#1e3a5f;--shared-fg:#93c5fd;
}}
:root[data-theme="dark"]{
  --bg:#0f1117;--fg:#e5e7eb;--card:#1a1d27;--card-border:#2d3148;
  --accent:#3b82f6;--accent-soft:#1e3a5f;--faint:#9ca3af;--pill:#252836;
  --input-bg:#1e2130;--input-border:#3d4263;--divider:#1e2130;
  --shadow:0 1px 4px rgba(0,0,0,.35);color-scheme:dark;
  --only-a:#450a0a;--only-a-fg:#fca5a5;
  --only-b:#052e16;--only-b-fg:#86efac;
  --shared:#1e3a5f;--shared-fg:#93c5fd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;font-size:14px;line-height:1.5}
.app-header{background:var(--card);border-bottom:1px solid var(--card-border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:700;letter-spacing:-.5px}.logo span{color:var(--accent)}
.subtitle{font-size:12px;color:var(--faint)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer;border:none;transition:opacity .12s}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--pill);color:var(--fg);border:1px solid var(--card-border)}.btn.secondary:hover{border-color:var(--faint)}
.btn.sm{padding:4px 10px;font-size:12px}
.theme-btn{background:none;border:1px solid var(--card-border);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--faint)}
.main{max-width:1100px;margin:0 auto;padding:20px}
/* Config row */
.cfg{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow)}
.cfg-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label.fl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.form-select{background:var(--input-bg);color:var(--fg);border:1px solid var(--input-border);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:13px;width:100%}
.form-select:focus{outline:none;border-color:var(--accent)}
/* Stats strip */
.stats-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-pill{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:6px}
.stat-pill .num{font-weight:700;font-size:15px}
.stat-pill.shared{background:var(--shared);border-color:var(--shared-fg)40;color:var(--shared-fg)}
.stat-pill.only-a{background:var(--only-a);border-color:var(--only-a-fg)40;color:var(--only-a-fg)}
.stat-pill.only-b{background:var(--only-b);border-color:var(--only-b-fg)40;color:var(--only-b-fg)}
/* Comparison grid */
.comp-grid{display:flex;flex-direction:column;gap:14px}
.seg-block{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.seg-header{padding:10px 16px;background:var(--pill);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--divider)}
.seg-title{font-weight:700;font-size:13px}
.seg-badge{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
.seg-badge.shared{background:var(--shared);color:var(--shared-fg)}
.seg-badge.only-a{background:var(--only-a);color:var(--only-a-fg)}
.seg-badge.only-b{background:var(--only-b);color:var(--only-b-fg)}
.seg-cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--divider)}
.seg-col{padding:10px 14px;min-width:0}
.seg-col:first-child{border-right:1px solid var(--divider)}
.col-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:6px}
.term-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:5px;margin:2px;font-family:var(--mono);font-weight:500;border:1px solid transparent}
.term-chip.shared{background:var(--shared);color:var(--shared-fg)}
.term-chip.only{background:var(--only-a);color:var(--only-a-fg)}
.term-chip.only-b-side{background:var(--only-b);color:var(--only-b-fg)}
.term-chip .lbl{font-family:'DM Sans',sans-serif;font-weight:400;font-size:10px;color:inherit;opacity:.75}
.empty-seg{font-size:11px;color:var(--faint);font-style:italic;padding:4px 0}
/* Tabs */
.view-tabs{display:flex;gap:6px;margin-bottom:14px}
.view-tab{padding:6px 14px;border-radius:7px;border:1px solid var(--card-border);background:var(--pill);font-size:12px;font-weight:600;cursor:pointer;color:var(--faint)}
.view-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Full table view */
.full-table{width:100%;border-collapse:collapse;font-size:12px}
.full-table th{text-align:left;padding:7px 12px;background:var(--pill);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);border-bottom:2px solid var(--divider)}
.full-table td{padding:6px 12px;border-bottom:1px solid var(--divider);vertical-align:top}
.full-table tr:last-child td{border-bottom:none}
.full-table .val{font-family:var(--mono);font-size:12px;color:var(--accent)}
.chip-only{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.chip-only.a{background:var(--only-a);color:var(--only-a-fg)}
.chip-only.b{background:var(--only-b);color:var(--only-b-fg)}
.chip-only.both{background:var(--shared);color:var(--shared-fg)}
/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--faint)}
.empty-icon{font-size:40px;margin-bottom:10px}
/* Search */
.cmp-search{background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;color:var(--fg);width:100%;margin-bottom:14px}
.cmp-search:focus{outline:none;border-color:var(--accent)}
/* Filter row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-chip{padding:4px 10px;border-radius:6px;border:1px solid var(--card-border);font-size:11px;font-weight:600;cursor:pointer;background:var(--pill);color:var(--faint)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header class="app-header">
  <div>
    <div class="logo">Comparador <span>NC</span></div>
    <div class="subtitle">Compare dicionários de nomenclatura entre dois clientes</div>
  </div>
  <div class="hdr-right">
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    <a href="../index.html" class="btn secondary sm">← Ferramentas</a>
  </div>
</header>

<main class="main">
  <div class="cfg">
    <div class="cfg-field">
      <label class="fl">Cliente A</label>
      <select class="form-select" id="selA" onchange="compare()"></select>
    </div>
    <div class="cfg-field">
      <label class="fl">Cliente B</label>
      <select class="form-select" id="selB" onchange="compare()"></select>
    </div>
    <div class="cfg-field" style="max-width:200px">
      <label class="fl">Segmento</label>
      <select class="form-select" id="selSeg" onchange="compare()">
        <option value="">— todos —</option>
      </select>
    </div>
    <div class="cfg-field" style="flex:0">
      <label class="fl">&nbsp;</label>
      <div style="display:flex;gap:6px">
        <button class="btn primary sm" onclick="compare()">🔄 Comparar</button>
        <button class="btn secondary sm" onclick="exportCompareCSV()">⬇ CSV</button>
      </div>
    </div>
  </div>

  <div id="statsStrip" class="stats-strip" style="display:none"></div>

  <div class="view-tabs">
    <button class="view-tab active" onclick="setView('side')" data-view="side">◫ Lado a lado</button>
    <button class="view-tab" onclick="setView('table')" data-view="table">📋 Tabela unificada</button>
    <button class="view-tab" onclick="setView('diff')" data-view="diff">🔀 Apenas diferenças</button>
  </div>

  <input class="cmp-search" id="cmpSearch" type="search" placeholder="Filtrar termos…" oninput="filterView(this.value)" style="display:none">

  <div class="filter-row" id="filterRow" style="display:none">
    <span style="font-size:11px;font-weight:700;color:var(--faint)">Mostrar:</span>
    <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">Todos</button>
    <button class="filter-chip" data-filter="shared" onclick="setFilter('shared')">Compartilhados</button>
    <button class="filter-chip" data-filter="only-a" onclick="setFilter('only-a')">Só em A</button>
    <button class="filter-chip" data-filter="only-b" onclick="setFilter('only-b')">Só em B</button>
  </div>

  <div id="compOut">
    <div class="empty">
      <div class="empty-icon">🔀</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">Selecione dois clientes para comparar</div>
      <p style="font-size:12px">O comparador mostra termos compartilhados e exclusivos de cada cliente.</p>
    </div>
  </div>
</main>

<script>
const TAXO_KEY='taxo_clients_v1';
function loadTaxo(){try{return JSON.parse(localStorage.getItem(TAXO_KEY)||'[]');}catch(e){return [];}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let _view='side', _filter='all', _searchQ='', _cmpData=null;

function populateClients(){
  const taxo=loadTaxo().filter(c=>!c.archived);
  const selA=document.getElementById('selA'), selB=document.getElementById('selB');
  if(!selA||!selB) return;
  const opts=taxo.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  selA.innerHTML=opts; selB.innerHTML=opts;
  if(taxo.length>1) selB.selectedIndex=1;
  updateSegSelector();
}

function updateSegSelector(){
  const taxo=loadTaxo();
  const a=taxo.find(c=>c.id===document.getElementById('selA')?.value);
  const b=taxo.find(c=>c.id===document.getElementById('selB')?.value);
  const sel=document.getElementById('selSeg'); if(!sel) return;
  // Union of segment IDs from both clients
  const segsA=(a?.segments||[]).map(s=>({id:s.id,label:s.label}));
  const segsB=(b?.segments||[]).map(s=>({id:s.id,label:s.label}));
  const allSegs=[...new Map([...segsA,...segsB].map(s=>[s.id,s])).values()];
  const cur=sel.value;
  sel.innerHTML='<option value="">— todos —</option>'+allSegs.map(s=>`<option value="${esc(s.id)}"${s.id===cur?' selected':''}>${esc(s.label)}</option>`).join('');
}

function compare(){
  updateSegSelector();
  const taxo=loadTaxo();
  const aId=document.getElementById('selA')?.value;
  const bId=document.getElementById('selB')?.value;
  const segFilter=document.getElementById('selSeg')?.value||'';
  if(!aId||!bId||aId===bId){ renderEmpty('Selecione dois clientes diferentes.'); return; }
  const a=taxo.find(c=>c.id===aId), b=taxo.find(c=>c.id===bId);
  if(!a||!b){ renderEmpty('Cliente não encontrado.'); return; }

  // Build comparison data per segment
  const segsA=(a.segments||[]);
  const segsB=(b.segments||[]);
  const allSegIds=[...new Set([...segsA.map(s=>s.id),...segsB.map(s=>s.id)])];
  const targetSegs=segFilter?allSegIds.filter(id=>id===segFilter):allSegIds;

  _cmpData={a,b,segs:[]};
  let totalShared=0,totalOnlyA=0,totalOnlyB=0;
  targetSegs.forEach(segId=>{
    const segA=segsA.find(s=>s.id===segId);
    const segB=segsB.find(s=>s.id===segId);
    const termsA=(a.dictionary[segId]||[]);
    const termsB=(b.dictionary[segId]||[]);
    const valsA=new Set(termsA.map(t=>t.value));
    const valsB=new Set(termsB.map(t=>t.value));
    const shared=[...valsA].filter(v=>valsB.has(v));
    const onlyA=[...valsA].filter(v=>!valsB.has(v));
    const onlyB=[...valsB].filter(v=>!valsA.has(v));
    totalShared+=shared.length; totalOnlyA+=onlyA.length; totalOnlyB+=onlyB.length;
    _cmpData.segs.push({segId,segA,segB,termsA,termsB,shared,onlyA,onlyB,valsA,valsB});
  });

  // Stats
  const strip=document.getElementById('statsStrip');
  strip.style.display='flex';
  strip.innerHTML=`
    <div class="stat-pill"><span>📋</span><span class="num">${segsA.length}</span><span>segs A</span></div>
    <div class="stat-pill"><span>📋</span><span class="num">${segsB.length}</span><span>segs B</span></div>
    <div class="stat-pill shared"><span>🤝</span><span class="num">${totalShared}</span><span>compartilhados</span></div>
    <div class="stat-pill only-a"><span>🅰️</span><span class="num">${totalOnlyA}</span><span>só em ${esc(a.name)}</span></div>
    <div class="stat-pill only-b"><span>🅱️</span><span class="num">${totalOnlyB}</span><span>só em ${esc(b.name)}</span></div>
  `;
  document.getElementById('cmpSearch').style.display='block';
  document.getElementById('filterRow').style.display='flex';
  renderView();
}

function renderEmpty(msg){
  document.getElementById('statsStrip').style.display='none';
  document.getElementById('cmpSearch').style.display='none';
  document.getElementById('filterRow').style.display='none';
  document.getElementById('compOut').innerHTML=`<div class="empty"><div class="empty-icon">🔀</div><p>${esc(msg)}</p></div>`;
}

function setView(v){ _view=v; document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v)); renderView(); }
function setFilter(f){ _filter=f; document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===f)); renderView(); }
function filterView(q){ _searchQ=q.trim().toLowerCase(); renderView(); }

function renderView(){
  if(!_cmpData){ return; }
  const out=document.getElementById('compOut');
  if(_view==='side') out.innerHTML=renderSide();
  else if(_view==='table') out.innerHTML=renderTable();
  else out.innerHTML=renderDiff();
}

function matchesFilter(isShared,isOnlyA,isOnlyB){
  if(_filter==='all') return true;
  if(_filter==='shared') return isShared;
  if(_filter==='only-a') return isOnlyA;
  if(_filter==='only-b') return isOnlyB;
  return true;
}

function renderSide(){
  const {a,b,segs}=_cmpData;
  if(!segs.length) return '<div class="empty"><p>Nenhum segmento para comparar.</p></div>';
  return segs.map(seg=>{
    const {segId,segA,segB,termsA,termsB,shared,onlyA,onlyB,valsA,valsB}=seg;
    const label=(segA||segB)?.label||segId;
    const aTerFilter=termsA.filter(t=>{
      const isSh=valsB.has(t.value), isOA=!valsB.has(t.value);
      if(!matchesFilter(isSh,isOA,false)) return false;
      if(_searchQ) return (t.value+' '+(t.label||'')).toLowerCase().includes(_searchQ);
      return true;
    });
    const bTerFilter=termsB.filter(t=>{
      const isSh=valsA.has(t.value), isOB=!valsA.has(t.value);
      if(!matchesFilter(isSh,false,isOB)) return false;
      if(_searchQ) return (t.value+' '+(t.label||'')).toLowerCase().includes(_searchQ);
      return true;
    });
    if(!aTerFilter.length&&!bTerFilter.length&&(_filter!=='all'||_searchQ)) return '';
    return `<div class="seg-block">
      <div class="seg-header">
        <span class="seg-title">${esc(label)}</span>
        <span class="seg-badge shared">🤝 ${shared.length}</span>
        <span class="seg-badge only-a">A: ${onlyA.length}</span>
        <span class="seg-badge only-b">B: ${onlyB.length}</span>
      </div>
      <div class="seg-cols">
        <div class="seg-col">
          <div class="col-label">🅰 ${esc(a.name)} (${termsA.length})</div>
          ${aTerFilter.length?aTerFilter.map(t=>`<span class="term-chip ${valsB.has(t.value)?'shared':'only'}" title="${esc(t.label)}">${esc(t.value)}${t.label?` <span class="lbl">${esc(t.label)}</span>`:''}</span>`).join(''):'<span class="empty-seg">sem termos visíveis</span>'}
        </div>
        <div class="seg-col">
          <div class="col-label">🅱 ${esc(b.name)} (${termsB.length})</div>
          ${bTerFilter.length?bTerFilter.map(t=>`<span class="term-chip ${valsA.has(t.value)?'shared':'only-b-side'}" title="${esc(t.label)}">${esc(t.value)}${t.label?` <span class="lbl">${esc(t.label)}</span>`:''}</span>`).join(''):'<span class="empty-seg">sem termos visíveis</span>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTable(){
  const {a,b,segs}=_cmpData;
  let rows=[];
  segs.forEach(seg=>{
    const {segId,segA,segB,termsA,termsB,valsA,valsB}=seg;
    const label=(segA||segB)?.label||segId;
    const allVals=[...new Set([...valsA,...valsB])].sort();
    allVals.forEach(val=>{
      const tA=termsA.find(t=>t.value===val);
      const tB=termsB.find(t=>t.value===val);
      const isSh=valsA.has(val)&&valsB.has(val);
      const isOA=valsA.has(val)&&!valsB.has(val);
      const isOB=!valsA.has(val)&&valsB.has(val);
      if(!matchesFilter(isSh,isOA,isOB)) return;
      if(_searchQ&&!(val+' '+(tA?.label||tB?.label||'')).toLowerCase().includes(_searchQ)) return;
      rows.push({label,val,tA,tB,isSh,isOA,isOB});
    });
  });
  if(!rows.length) return '<div class="empty"><p>Nenhum resultado para os filtros aplicados.</p></div>';
  return `<div style="overflow-x:auto"><table class="full-table">
    <thead><tr><th>Segmento</th><th>Valor</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td style="color:var(--faint)">${esc(r.label)}</td>
      <td class="val">${esc(r.val)}</td>
      <td>${r.tA?esc(r.tA.label):'<span style="color:var(--faint)">—</span>'}</td>
      <td>${r.tB?esc(r.tB.label):'<span style="color:var(--faint)">—</span>'}</td>
      <td>${r.isSh?'<span class="chip-only both">compartilhado</span>':r.isOA?`<span class="chip-only a">só ${esc(a.name)}</span>`:`<span class="chip-only b">só ${esc(b.name)}</span>`}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function renderDiff(){
  const prevFilter=_filter;
  _filter='all'; // override temporarily so we can show both sides
  const {a,b,segs}=_cmpData;
  const diffs=[];
  segs.forEach(seg=>{
    const {segId,segA,segB,onlyA,onlyB,termsA,termsB}=seg;
    const label=(segA||segB)?.label||segId;
    onlyA.forEach(val=>{
      if(_searchQ&&!val.toLowerCase().includes(_searchQ)) return;
      const t=termsA.find(x=>x.value===val);
      diffs.push({label,val,side:'A',lbl:t?.label||''});
    });
    onlyB.forEach(val=>{
      if(_searchQ&&!val.toLowerCase().includes(_searchQ)) return;
      const t=termsB.find(x=>x.value===val);
      diffs.push({label,val,side:'B',lbl:t?.label||''});
    });
  });
  _filter=prevFilter;
  if(!diffs.length) return '<div class="empty"><div class="empty-icon">✅</div><p style="font-weight:600">Nenhuma diferença!</p><p style="font-size:12px">Os dois clientes compartilham todos os termos nos segmentos comparados.</p></div>';
  return `<div style="overflow-x:auto"><table class="full-table">
    <thead><tr><th>Segmento</th><th>Valor</th><th>Label</th><th>Exclusivo em</th></tr></thead>
    <tbody>${diffs.map(d=>`<tr>
      <td style="color:var(--faint)">${esc(d.label)}</td>
      <td class="val">${esc(d.val)}</td>
      <td>${esc(d.lbl)}</td>
      <td>${d.side==='A'?`<span class="chip-only a">🅰 ${esc(a.name)}</span>`:`<span class="chip-only b">🅱 ${esc(b.name)}</span>`}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function exportCompareCSV(){
  if(!_cmpData){ showToast('Compare primeiro'); return; }
  const {a,b,segs}=_cmpData;
  const rows=[['segmento','valor','label_A','label_B','status']];
  segs.forEach(seg=>{
    const {segA,segB,segId,termsA,termsB,valsA,valsB}=seg;
    const label=(segA||segB)?.label||segId;
    const allVals=[...new Set([...valsA,...valsB])].sort();
    allVals.forEach(val=>{
      const tA=termsA.find(t=>t.value===val);
      const tB=termsB.find(t=>t.value===val);
      const status=valsA.has(val)&&valsB.has(val)?'compartilhado':valsA.has(val)?`só ${a.name}`:`só ${b.name}`;
      rows.push([label,val,tA?.label||'',tB?.label||'',status]);
    });
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const aa=document.createElement('a'); aa.href=url;
  aa.download=`comparacao_${a.id}_vs_${b.id}_${new Date().toISOString().slice(0,10)}.csv`;
  aa.click(); URL.revokeObjectURL(url);
  showToast('⬇ CSV exportado');
}

function showToast(msg){
  let t=document.getElementById('ncToast');
  if(!t){t=document.createElement('div');t.id='ncToast';Object.assign(t.style,{position:'fixed',bottom:'20px',right:'20px',background:'var(--fg)',color:'var(--bg)',padding:'9px 16px',borderRadius:'9px',fontSize:'13px',fontWeight:'600',zIndex:'9999',transition:'opacity .25s',opacity:'0',pointerEvents:'none'});document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2400);
}

function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{localStorage.setItem('cmpnc_theme',r.dataset.theme);}catch(e){}
}
(function(){try{const t=localStorage.getItem('cmpnc_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();

window.addEventListener('storage',e=>{ if(e.key===TAXO_KEY){populateClients();compare();} });

populateClients();
compare();
</script>
