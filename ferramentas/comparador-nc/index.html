<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Comparador NC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f5f7; --surface:#fff; --surface2:#f8f9fb; --fg:#1a1a2e; --faint:#6b7280;
  --accent:#3b5bdb; --accent2:#4c6ef5; --ok:#22c55e; --warn:#f59e0b; --erro:#ef4444;
  --brd:#e2e5ec; --card:#fff; --pill:#eef0f5; --sep:#cbd5e1;
  --shadow:0 1px 4px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --a-col:#3b5bdb; --b-col:#7c3aed;
  --a-bg:#eff3ff; --b-bg:#f5f3ff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f111a; --surface:#181c2a; --surface2:#1e2235; --fg:#e8eaf2; --faint:#8892a4;
  --accent:#4c6ef5; --accent2:#748ffc; --ok:#4ade80; --warn:#fbbf24; --erro:#f87171;
  --brd:#2a2f45; --card:#1e2235; --pill:#262b40; --sep:#2a2f45;
  --shadow:0 1px 4px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  --a-col:#748ffc; --b-col:#a78bfa;
  --a-bg:#1e2545; --b-bg:#231d3a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181c2a; --surface2:#1e2235; --fg:#e8eaf2; --faint:#8892a4;
  --accent:#4c6ef5; --accent2:#748ffc; --ok:#4ade80; --warn:#fbbf24; --erro:#f87171;
  --brd:#2a2f45; --card:#1e2235; --pill:#262b40; --sep:#2a2f45;
  --shadow:0 1px 4px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  --a-col:#748ffc; --b-col:#a78bfa;
  --a-bg:#1e2545; --b-bg:#231d3a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.5}
/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--brd);padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:100}
.header-logo{font-size:17px;font-weight:700;letter-spacing:-.3px}
.header-logo span{color:var(--accent)}
.header-sep{flex:1}
.theme-btn{background:none;border:none;cursor:pointer;font-size:17px;padding:4px 6px;border-radius:6px;color:var(--faint)}
.theme-btn:hover{background:var(--pill)}
.back-link{font-size:12px;color:var(--faint);text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid var(--brd);transition:background .1s}
.back-link:hover{background:var(--pill)}
/* ── MAIN ── */
.main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
/* ── SELECTORS ── */
.selectors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:600px){.selectors{grid-template-columns:1fr}}
.selector-card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.selector-card.client-a{border-top:3px solid var(--a-col)}
.selector-card.client-b{border-top:3px solid var(--b-col)}
.selector-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:8px}
.selector-label.a{color:var(--a-col)}
.selector-label.b{color:var(--b-col)}
.client-select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--brd);background:var(--surface2);color:var(--fg);font-size:13px;font-family:inherit;cursor:pointer}
.client-select:focus{outline:2px solid var(--accent);outline-offset:1px}
.empty-sel{text-align:center;padding:32px 16px;color:var(--faint);font-size:13px}
/* ── SECTION ── */
.section{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
/* ── OVERVIEW CARDS ── */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ov-card{border-radius:10px;padding:12px 14px;border:1px solid var(--brd);background:var(--surface2)}
.ov-card-label{font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ov-card-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ov-val{font-size:22px;font-weight:700;line-height:1}
.ov-val.a{color:var(--a-col)}
.ov-val.b{color:var(--b-col)}
.ov-sep-mid{font-size:11px;color:var(--sep);flex-shrink:0}
/* ── SEGMENTS TABLE ── */
.seg-cmp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.seg-cmp-table th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);text-align:left;padding:4px 8px;border-bottom:1px solid var(--brd)}
.seg-cmp-table td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
.seg-cmp-table tr:last-child td{border-bottom:none}
.seg-cmp-table tr:hover td{background:var(--surface2)}
.seg-match{color:var(--ok);font-weight:700}
.seg-miss-a{color:var(--b-col);font-style:italic}
.seg-miss-b{color:var(--a-col);font-style:italic}
.seg-fill-bar-mini{height:5px;background:var(--pill);border-radius:3px;overflow:hidden;min-width:60px}
.seg-fill-bar-mini-inner{height:100%;border-radius:3px;transition:width .3s}
.fill-a{background:var(--a-col)}
.fill-b{background:var(--b-col)}
.req-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase}
.req-badge.req{background:#fef3c7;color:#92400e}
.req-badge.opt{background:var(--pill);color:var(--faint)}
/* ── OVERLAP ── */
.overlap-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.overlap-wrap{grid-template-columns:1fr}}
.overlap-col{background:var(--surface2);border:1px solid var(--brd);border-radius:10px;padding:12px}
.overlap-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.overlap-col-title.shared{color:var(--ok)}
.overlap-col-title.only-a{color:var(--a-col)}
.overlap-col-title.only-b{color:var(--b-col)}
.overlap-seg-block{margin-bottom:8px}
.overlap-seg-label{font-size:10px;font-weight:600;color:var(--faint);margin-bottom:3px}
.overlap-chip{display:inline-block;font-size:11px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:5px;margin:1px 2px;font-weight:500}
.chip-shared{background:rgba(34,197,94,.12);color:var(--ok)}
.chip-a{background:var(--a-bg);color:var(--a-col)}
.chip-b{background:var(--b-bg);color:var(--b-col)}
/* ── STRUCTS ── */
.structs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.structs-grid{grid-template-columns:1fr}}
.structs-col{background:var(--surface2);border:1px solid var(--brd);border-radius:10px;padding:12px}
.structs-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.struct-item{font-size:11.5px;padding:5px 8px;border-radius:6px;background:var(--card);border:1px solid var(--brd);margin-bottom:4px}
.struct-label{font-weight:600;color:var(--fg)}
.struct-platform{font-size:10px;color:var(--faint);font-weight:500;margin-left:4px}
.struct-pattern{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--accent);margin-top:3px;word-break:break-all}
.no-items{font-size:12px;color:var(--faint);text-align:center;padding:16px 0}
/* ── SCORE RING ── */
.score-wrap{display:flex;align-items:center;gap:10px}
.score-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--fg)}
/* ── DIFF BADGE ── */
.diff-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.diff-pos{background:#dcfce7;color:#15803d}
.diff-neg{background:#fee2e2;color:#dc2626}
.diff-zero{background:var(--pill);color:var(--faint)}
</style>
</head>
<body>
<header class="header">
  <div class="header-logo">Sistema · <span>Comparador NC</span></div>
  <div class="header-sep"></div>
  <a class="back-link" href="../">← Ferramentas</a>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema">🌙</button>
</header>

<main class="main">
  <div class="selectors">
    <div class="selector-card client-a">
      <div class="selector-label a">Cliente A</div>
      <select class="client-select" id="selA" onchange="onSelectChange()">
        <option value="">— Selecione —</option>
      </select>
    </div>
    <div class="selector-card client-b">
      <div class="selector-label b">Cliente B</div>
      <select class="client-select" id="selB" onchange="onSelectChange()">
        <option value="">— Selecione —</option>
      </select>
    </div>
  </div>

  <div id="compareBody">
    <div class="empty-sel">Selecione dois clientes para comparar suas taxonomias.</div>
  </div>
</main>

<script>
const TAXO_KEY = 'taxo_clients_v1';
const ACTIVE_KEY = 'taxo_active_v1';
const THEME_KEY = 'cmp_theme';

let _clients = [];
let _themeManual = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadClients() {
  try {
    _clients = JSON.parse(localStorage.getItem(TAXO_KEY)||'[]');
  } catch(e) { _clients = []; }
  const selA = document.getElementById('selA');
  const selB = document.getElementById('selB');
  const prevA = selA.value, prevB = selB.value;
  [selA, selB].forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">— Selecione —</option>' +
      _clients.filter(c=>!c.archived).map(c=>`<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>${esc(c.name)}</option>`).join('');
    sel.value = cur; // restore if still exists
  });
  // Pre-select last active
  try {
    const actId = localStorage.getItem(ACTIVE_KEY);
    if(actId && !selA.value) {
      selA.value = actId;
      const others = _clients.filter(c=>!c.archived&&c.id!==actId);
      if(others.length && !selB.value) selB.value = others[0].id;
    }
  } catch(e) {}
}

function getClient(id) { return _clients.find(c=>c.id===id)||null; }

function onSelectChange() { renderCompare(); }

function renderCompare() {
  const idA = document.getElementById('selA').value;
  const idB = document.getElementById('selB').value;
  const body = document.getElementById('compareBody');
  if(!idA || !idB) {
    body.innerHTML = '<div class="empty-sel">Selecione dois clientes para comparar suas taxonomias.</div>';
    return;
  }
  if(idA === idB) {
    body.innerHTML = '<div class="empty-sel">⚠️ Selecione dois clientes <em>diferentes</em>.</div>';
    return;
  }
  const a = getClient(idA), b = getClient(idB);
  if(!a||!b) { body.innerHTML='<div class="empty-sel">Cliente não encontrado.</div>'; return; }
  body.innerHTML = renderOverview(a,b) + renderSegsSection(a,b) + renderOverlapSection(a,b) + renderStructsSection(a,b);
}

/* OVERVIEW */
function completePct(c) {
  if(!c.segments.length) return 0;
  const filled = c.segments.filter(s=>(c.dictionary[s.id]||[]).length>0).length;
  return Math.round(100*filled/c.segments.length);
}
function totalTerms(c) { return Object.values(c.dictionary||{}).reduce((s,a)=>s+a.length,0); }

function scoreRingHtml(pct, colorVar) {
  const r=16, cx=20, cy=20;
  const circumference = 2*Math.PI*r;
  const dash = circumference*(pct/100);
  const gap = circumference - dash;
  return `<div class="score-ring">
    <svg width="40" height="40" viewBox="0 0 40 40">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--brd)" stroke-width="4"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorVar}" stroke-width="4"
        stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-linecap="round"/>
    </svg>
    <div class="score-ring-label">${pct}%</div>
  </div>`;
}

function diffBadge(va, vb) {
  const d = va - vb;
  if(d===0) return `<span class="diff-badge diff-zero">=</span>`;
  if(d>0) return `<span class="diff-badge diff-pos">A +${d}</span>`;
  return `<span class="diff-badge diff-neg">B +${Math.abs(d)}</span>`;
}

function renderOverview(a, b) {
  const pA = completePct(a), pB = completePct(b);
  const tA = totalTerms(a), tB = totalTerms(b);
  const sA = (a.structures||[]).length, sB = (b.structures||[]).length;
  const rows = [
    {label:'Completude', vA:`<div class="score-wrap">${scoreRingHtml(pA,'var(--a-col)')}<span class="ov-val a">${pA}%</span></div>`, vB:`<div class="score-wrap">${scoreRingHtml(pB,'var(--b-col)')}<span class="ov-val b">${pB}%</span></div>`, diff:''},
    {label:'Segmentos', vA:`<span class="ov-val a">${a.segments.length}</span>`, vB:`<span class="ov-val b">${b.segments.length}</span>`, diff:diffBadge(a.segments.length, b.segments.length)},
    {label:'Total de termos', vA:`<span class="ov-val a">${tA}</span>`, vB:`<span class="ov-val b">${tB}</span>`, diff:diffBadge(tA,tB)},
    {label:'Estruturas', vA:`<span class="ov-val a">${sA}</span>`, vB:`<span class="ov-val b">${sB}</span>`, diff:diffBadge(sA,sB)},
    {label:'Separador', vA:`<code style="font-family:monospace;font-size:14px;font-weight:700;color:var(--a-col)">${esc(a.separator)}</code>`, vB:`<code style="font-family:monospace;font-size:14px;font-weight:700;color:var(--b-col)">${esc(b.separator)}</code>`, diff:a.separator===b.separator?'<span class="diff-badge diff-zero">igual</span>':'<span class="diff-badge diff-neg">diferente</span>'},
  ];
  return `<div class="section">
    <div class="section-title">📊 Visão geral</div>
    <div class="overview-grid">
      ${rows.map(r=>`<div class="ov-card">
        <div class="ov-card-label">${r.label}</div>
        <div class="ov-card-row">${r.vA}<span class="ov-sep-mid">vs</span>${r.vB}</div>
        ${r.diff?`<div style="margin-top:5px">${r.diff}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`;
}

/* SEGMENTS COMPARISON */
function renderSegsSection(a, b) {
  // Build merged segment list by label (normalized)
  const normalize = s => s.toLowerCase().trim().replace(/\s+/g,' ');
  const mapA = new Map(a.segments.map(s=>[normalize(s.label), s]));
  const mapB = new Map(b.segments.map(s=>[normalize(s.label), s]));
  const allKeys = [...new Set([...mapA.keys(), ...mapB.keys()])];
  const rows = allKeys.map(key => {
    const sa = mapA.get(key), sb = mapB.get(key);
    const cntA = sa ? (a.dictionary[sa.id]||[]).length : null;
    const cntB = sb ? (b.dictionary[sb.id]||[]).length : null;
    const maxA = Math.max(1, cntA||0), maxB = Math.max(1, cntB||0);
    const totalMax = Math.max(maxA, maxB, 1);
    const fillBarA = cntA!==null ? `<div class="seg-fill-bar-mini"><div class="seg-fill-bar-mini-inner fill-a" style="width:${Math.round(100*(cntA/totalMax))}%"></div></div>` : '';
    const fillBarB = cntB!==null ? `<div class="seg-fill-bar-mini"><div class="seg-fill-bar-mini-inner fill-b" style="width:${Math.round(100*(cntB/totalMax))}%"></div></div>` : '';
    return `<tr>
      <td style="font-weight:600">${sa?esc(sa.label):`<em style="color:var(--faint)">${esc(sb.label)}</em>`}</td>
      <td>${sa?`<span class="req-badge ${sa.required?'req':'opt'}">${sa.required?'req':'opt'}</span>`:''}</td>
      <td style="color:var(--a-col);font-weight:600">${cntA!==null?cntA:'<span style="color:var(--faint)">—</span>'}</td>
      <td>${fillBarA}</td>
      <td>${sa&&sb?`<span class="seg-match">✓</span>`:`<span style="color:var(--erro)">✗</span>`}</td>
      <td style="color:var(--b-col);font-weight:600">${cntB!==null?cntB:'<span style="color:var(--faint)">—</span>'}</td>
      <td>${fillBarB}</td>
      <td>${sb?`<span class="req-badge ${sb.required?'req':'opt'}">${sb.required?'req':'opt'}</span>`:''}</td>
    </tr>`;
  });
  const sharedCount = allKeys.filter(k=>mapA.has(k)&&mapB.has(k)).length;
  const onlyA = allKeys.filter(k=>mapA.has(k)&&!mapB.has(k)).length;
  const onlyB = allKeys.filter(k=>!mapA.has(k)&&mapB.has(k)).length;
  return `<div class="section">
    <div class="section-title">🗂️ Segmentos <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">${sharedCount} em comum · <span style="color:var(--a-col)">${onlyA} só em A</span> · <span style="color:var(--b-col)">${onlyB} só em B</span></span></div>
    <div style="overflow-x:auto">
    <table class="seg-cmp-table">
      <thead><tr>
        <th>Segmento</th>
        <th>Tipo A</th>
        <th style="color:var(--a-col)">Termos A</th>
        <th>Fill A</th>
        <th>Match</th>
        <th style="color:var(--b-col)">Termos B</th>
        <th>Fill B</th>
        <th>Tipo B</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    </div>
  </div>`;
}

/* TERM OVERLAP */
function renderOverlapSection(a, b) {
  const normalize = s => s.toLowerCase().trim().replace(/\s+/g,' ');
  // Build maps: segLabel_normalized -> terms set
  const mapA = new Map(a.segments.map(s=>[normalize(s.label), new Set((a.dictionary[s.id]||[]).map(t=>t.value))]));
  const mapB = new Map(b.segments.map(s=>[normalize(s.label), new Set((b.dictionary[s.id]||[]).map(t=>t.value))]));

  const sharedSegs = [...mapA.keys()].filter(k=>mapB.has(k));
  let sharedTerms = [], onlyATerms = [], onlyBTerms = [];

  sharedSegs.forEach(key => {
    const sa = a.segments.find(s=>normalize(s.label)===key);
    const sb = b.segments.find(s=>normalize(s.label)===key);
    const setA = mapA.get(key)||new Set(), setB = mapB.get(key)||new Set();
    const shared = [...setA].filter(v=>setB.has(v));
    const onlyA = [...setA].filter(v=>!setB.has(v));
    const onlyB = [...setB].filter(v=>!setA.has(v));
    if(shared.length) sharedTerms.push({label:sa.label, terms:shared});
    if(onlyA.length) onlyATerms.push({label:sa.label, terms:onlyA});
    if(onlyB.length) onlyBTerms.push({label:sb.label, terms:onlyB});
  });

  // Also purely exclusive segments
  a.segments.filter(s=>!mapB.has(normalize(s.label))).forEach(s=>{
    const terms = (a.dictionary[s.id]||[]).map(t=>t.value);
    if(terms.length) onlyATerms.push({label:s.label, terms});
  });
  b.segments.filter(s=>!mapA.has(normalize(s.label))).forEach(s=>{
    const terms = (b.dictionary[s.id]||[]).map(t=>t.value);
    if(terms.length) onlyBTerms.push({label:s.label, terms});
  });

  const colHtml = (groups, chipClass, maxPerSeg=20) =>
    groups.length ? groups.map(g=>`<div class="overlap-seg-block">
      <div class="overlap-seg-label">${esc(g.label)} (${g.terms.length})</div>
      ${g.terms.slice(0,maxPerSeg).map(v=>`<span class="overlap-chip ${chipClass}">${esc(v)}</span>`).join('')}
      ${g.terms.length>maxPerSeg?`<span style="font-size:10px;color:var(--faint)"> +${g.terms.length-maxPerSeg} mais</span>`:''}
    </div>`).join('') : `<div class="no-items">Nenhum</div>`;

  const totalShared = sharedTerms.reduce((s,g)=>s+g.terms.length,0);
  const totalOnlyA = onlyATerms.reduce((s,g)=>s+g.terms.length,0);
  const totalOnlyB = onlyBTerms.reduce((s,g)=>s+g.terms.length,0);

  return `<div class="section">
    <div class="section-title">🔁 Sobreposição de termos
      <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">${totalShared} comuns · <span style="color:var(--a-col)">${totalOnlyA} só em A</span> · <span style="color:var(--b-col)">${totalOnlyB} só em B</span></span>
    </div>
    <div class="overlap-wrap">
      <div class="overlap-col">
        <div class="overlap-col-title shared">✓ Em comum (${totalShared})</div>
        ${colHtml(sharedTerms,'chip-shared')}
      </div>
      <div class="overlap-col">
        <div class="overlap-col-title only-a">Só em A (${totalOnlyA})</div>
        ${colHtml(onlyATerms,'chip-a')}
      </div>
      <div class="overlap-col">
        <div class="overlap-col-title only-b">Só em B (${totalOnlyB})</div>
        ${colHtml(onlyBTerms,'chip-b')}
      </div>
    </div>
  </div>`;
}

/* STRUCTURES */
function renderStructsSection(a, b) {
  const structs = c => (c.structures||[]).map(s=>`<div class="struct-item">
    <div>
      <span class="struct-label">${esc(s.label)}</span>
      ${s.platform?`<span class="struct-platform">${esc(s.platform)}</span>`:''}
      ${s.level?`<span class="struct-platform">${esc(s.level)}</span>`:''}
    </div>
    <div class="struct-pattern">${esc(s.pattern||'')}</div>
  </div>`).join('');
  return `<div class="section">
    <div class="section-title">🏗️ Estruturas</div>
    <div class="structs-grid">
      <div class="structs-col">
        <div class="structs-col-title" style="color:var(--a-col)">A · ${esc(a.name)} (${(a.structures||[]).length})</div>
        ${(a.structures||[]).length ? structs(a) : '<div class="no-items">Nenhuma estrutura</div>'}
      </div>
      <div class="structs-col">
        <div class="structs-col-title" style="color:var(--b-col)">B · ${esc(b.name)} (${(b.structures||[]).length})</div>
        ${(b.structures||[]).length ? structs(b) : '<div class="no-items">Nenhuma estrutura</div>'}
      </div>
    </div>
  </div>`;
}

/* THEME */
function applyTheme(t) {
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(t==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeBtn').textContent = (t==='dark') ? '☀️' : '🌙';
  try{ localStorage.setItem(THEME_KEY, t||''); }catch(e){}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme')||'';
  _themeManual = cur==='dark' ? 'light' : 'dark';
  applyTheme(_themeManual);
}

// Init
try{
  const saved = localStorage.getItem(THEME_KEY);
  if(saved) applyTheme(saved);
}catch(e){}

loadClients();
// Listen for localStorage changes (if taxonomy-builder updates data in another tab)
window.addEventListener('storage', e=>{ if(e.key===TAXO_KEY){ loadClients(); renderCompare(); } });
onSelectChange();
</script>
</body>
</html>
