<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda de NC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--fg:#0f172a;--card:#fff;--accent:#7c3aed;--accent-soft:rgba(124,58,237,.08);
  --border:#e2e8f0;--faint:#64748b;--input-bg:#fff;--divider:#f1f5f9;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--erro:#dc2626;--erro-bg:#fef2f2;
  --shadow:0 1px 4px rgba(0,0,0,.08);--mono:'JetBrains Mono',monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#a78bfa;--accent-soft:rgba(167,139,250,.1);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;--divider:#1e293b;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.08);
  --erro:#f87171;--erro-bg:rgba(248,113,113,.08);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#a78bfa;--accent-soft:rgba(167,139,250,.1);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;--divider:#1e293b;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.08);
  --erro:#f87171;--erro-bg:rgba(248,113,113,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.btn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{background:var(--border);}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
.page{max-width:960px;margin:0 auto;padding:18px;display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start;}
@media(max-width:720px){.page{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;}
input[type=text],input[type=date],select,textarea{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);color:var(--fg);font-size:12px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
/* Status badges */
.status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;}
.s-active{background:var(--ok-bg);color:var(--ok);}
.s-scheduled{background:var(--accent-soft);color:var(--accent);}
.s-expired{background:var(--erro-bg);color:var(--erro);}
.s-expiring{background:var(--warn-bg);color:var(--warn);}
.s-paused{background:var(--divider);color:var(--faint);}
/* NC items */
.nc-item{padding:11px 14px;border:1px solid var(--border);border-radius:9px;background:var(--input-bg);margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.nc-item:hover{border-color:var(--accent);}
.nc-item.selected{border-color:var(--accent);background:var(--accent-soft);}
.nc-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);}
.nc-meta{font-size:10px;color:var(--faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.nc-label{font-size:12px;font-weight:500;margin-top:1px;}
/* Timeline bar */
.timeline-bar{height:8px;border-radius:4px;background:var(--divider);overflow:hidden;margin:6px 0;}
.timeline-fill{height:100%;border-radius:4px;transition:width .3s;}
/* Filter chips */
.filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.filter-chip{font-size:11px;padding:3px 10px;border-radius:14px;border:1px solid var(--border);cursor:pointer;font-weight:500;background:var(--card);}
.filter-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#1e293b;color:#f1f5f9;padding:8px 16px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:all .3s;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:14px;padding:22px;width:90%;max-width:480px;box-shadow:var(--shadow-lg,0 12px 40px rgba(0,0,0,.2));}
.modal h3{font-size:15px;font-weight:800;margin-bottom:16px;}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">📅</span>
    <div>
      <div style="font-size:15px;font-weight:800">Agenda de NC</div>
      <div style="font-size:11px;color:var(--faint)">Gerencie validade e ativação de naming conventions</div>
    </div>
  </div>
  <div style="display:flex;gap:7px">
    <button class="btn" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn" onclick="toggleTheme()">🌙</button>
    <button class="btn primary" onclick="openAddModal()">+ Nova NC</button>
  </div>
</div>

<div class="page">
  <!-- Left: list -->
  <div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <input type="text" id="searchIn" placeholder="🔍 Buscar NC…" oninput="renderList()">
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div id="ncList"><div style="text-align:center;padding:30px;color:var(--faint)">Nenhuma NC cadastrada ainda.<br><br><button class="btn primary" onclick="openAddModal()">+ Adicionar primeira NC</button></div></div>
    </div>
    <div id="summaryBar" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
  </div>

  <!-- Right: detail -->
  <div id="detailPanel">
    <div class="card" style="text-align:center;padding:40px;color:var(--faint)">
      <div style="font-size:30px;margin-bottom:8px">📋</div>
      <div>Selecione uma NC para ver detalhes</div>
    </div>
  </div>
</div>

<!-- Modal add/edit -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Nova NC</h3>
    <div class="form-row">
      <div class="form-label">Naming Convention <span style="color:var(--erro)">*</span></div>
      <input type="text" id="mNc" placeholder="cliente_campanha_produto_br" style="font-family:var(--mono)">
    </div>
    <div class="form-row">
      <div class="form-label">Descrição / Rótulo</div>
      <input type="text" id="mLabel" placeholder="Nome amigável ou descrição">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <div class="form-label">Data de início</div>
        <input type="date" id="mStart">
      </div>
      <div class="form-row">
        <div class="form-label">Data de expiração</div>
        <input type="date" id="mEnd">
      </div>
    </div>
    <div class="form-row">
      <div class="form-label">Status</div>
      <select id="mStatus">
        <option value="scheduled">Agendada</option>
        <option value="active">Ativa</option>
        <option value="paused">Pausada</option>
        <option value="expired">Expirada</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-label">Cliente / Campanha</div>
      <input type="text" id="mClient" placeholder="ex: Dove, Dove_Cabelos_2024">
    </div>
    <div class="form-row">
      <div class="form-label">Notas</div>
      <textarea id="mNotes" rows="2" placeholder="Observações, links, contexto…"></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="saveNC()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Theme
let _theme=null; try{_theme=localStorage.getItem('agendanc_theme');}catch(e){}
if(_theme) document.documentElement.setAttribute('data-theme',_theme);
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  _theme=isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme',_theme);
  try{localStorage.setItem('agendanc_theme',_theme);}catch(e){}
  document.querySelector('.btn[onclick="toggleTheme()"]').textContent=_theme==='dark'?'☀️':'🌙';
}
(function(){const cur=document.documentElement.getAttribute('data-theme');const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);const btn=document.querySelector('.btn[onclick="toggleTheme()"]');if(btn)btn.textContent=isDark?'☀️':'🌙';})();

const STORE_KEY='agenda_nc_v1';
let _items=[];
let _selId=null;
let _filter='all';
let _editId=null;

function load(){try{_items=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');}catch(e){_items=[];}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(_items));}catch(e){};}
load();

function today(){return new Date().toISOString().slice(0,10);}

function computeStatus(item){
  const now=today();
  if(item.status==='paused') return 'paused';
  if(item.status==='expired') return 'expired';
  if(item.end && item.end < now) return 'expired';
  if(item.start && item.start > now) return 'scheduled';
  if(item.end){
    const daysLeft=Math.round((new Date(item.end)-new Date())/86400000);
    if(daysLeft<=7) return 'expiring';
  }
  return 'active';
}

function statusLabel(s){
  return {active:'Ativa',scheduled:'Agendada',expired:'Expirada',expiring:'Expirando',paused:'Pausada'}[s]||s;
}

function renderFilters(){
  const counts={all:_items.length};
  _items.forEach(item=>{const s=computeStatus(item);counts[s]=(counts[s]||0)+1;});
  const filters=[
    {key:'all',label:'Todas'},
    {key:'active',label:'Ativas'},
    {key:'expiring',label:'Expirando'},
    {key:'scheduled',label:'Agendadas'},
    {key:'expired',label:'Expiradas'},
    {key:'paused',label:'Pausadas'},
  ];
  document.getElementById('filterRow').innerHTML=filters.map(f=>
    `<span class="filter-chip ${_filter===f.key?'on':''}" onclick="setFilter('${f.key}')">${f.label}${counts[f.key]?' ('+counts[f.key]+')':''}</span>`
  ).join('');
}

function setFilter(f){_filter=f;renderList();}

function renderList(){
  const q=(document.getElementById('searchIn').value||'').toLowerCase();
  const list=document.getElementById('ncList');
  renderFilters();
  renderSummary();
  let items=_items;
  if(_filter!=='all') items=items.filter(i=>computeStatus(i)===_filter);
  if(q) items=items.filter(i=>i.nc.toLowerCase().includes(q)||(i.label||'').toLowerCase().includes(q)||(i.client||'').toLowerCase().includes(q));
  if(!items.length){list.innerHTML=`<div style="text-align:center;padding:24px;color:var(--faint)">Nenhuma NC${q?' para "'+esc(q)+'"':''}.</div>`;return;}
  list.innerHTML=items.map(item=>{
    const s=computeStatus(item);
    const pct=item.start&&item.end?Math.min(100,Math.max(0,Math.round((new Date()-new Date(item.start))/(new Date(item.end)-new Date(item.start))*100))):null;
    const color=s==='active'?'var(--ok)':s==='expiring'?'var(--warn)':s==='expired'?'var(--erro)':s==='scheduled'?'var(--accent)':'var(--faint)';
    return `<div class="nc-item ${_selId===item.id?'selected':''}" onclick="selectNC('${item.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div class="nc-val">${esc(item.nc)}</div>
        <span class="status-badge s-${s}">${statusLabel(s)}</span>
      </div>
      ${item.label?`<div class="nc-label">${esc(item.label)}</div>`:''}
      <div class="nc-meta">
        ${item.client?`<span>🏢 ${esc(item.client)}</span>`:''}
        ${item.start?`<span>▶ ${item.start}</span>`:''}
        ${item.end?`<span>⏹ ${item.end}</span>`:''}
      </div>
      ${pct!==null?`<div class="timeline-bar"><div class="timeline-fill" style="width:${pct}%;background:${color}"></div></div>`:''}
    </div>`;
  }).join('');
}

function renderSummary(){
  const counts={active:0,scheduled:0,expiring:0,expired:0};
  _items.forEach(i=>{const s=computeStatus(i);if(s in counts)counts[s]++;});
  document.getElementById('summaryBar').innerHTML=[
    {l:'Ativas',n:counts.active,c:'var(--ok)'},
    {l:'Expirando',n:counts.expiring,c:'var(--warn)'},
    {l:'Agendadas',n:counts.scheduled,c:'var(--accent)'},
    {l:'Expiradas',n:counts.expired,c:'var(--erro)'},
  ].map(x=>`<div class="card" style="text-align:center;padding:10px 6px">
    <div style="font-size:22px;font-weight:800;color:${x.c}">${x.n}</div>
    <div style="font-size:10px;color:var(--faint)">${x.l}</div>
  </div>`).join('');
}

function selectNC(id){
  _selId=id;
  renderList();
  const item=_items.find(i=>i.id===id);
  if(!item) return;
  const s=computeStatus(item);
  const statusColors={active:'var(--ok)',scheduled:'var(--accent)',expired:'var(--erro)',expiring:'var(--warn)',paused:'var(--faint)'};
  const pct=item.start&&item.end?Math.min(100,Math.max(0,Math.round((new Date()-new Date(item.start))/(new Date(item.end)-new Date(item.start))*100))):null;
  document.getElementById('detailPanel').innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);word-break:break-all">${esc(item.nc)}</div>
          ${item.label?`<div style="font-size:13px;margin-top:3px">${esc(item.label)}</div>`:''}
        </div>
        <span class="status-badge s-${s}" style="font-size:12px;padding:4px 12px">${statusLabel(s)}</span>
      </div>
      ${pct!==null?`<div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:3px">
          <span>Progresso do período</span><span style="font-weight:700;color:${statusColors[s]}">${pct}%</span>
        </div>
        <div class="timeline-bar" style="height:10px"><div class="timeline-fill" style="width:${pct}%;background:${statusColors[s]}"></div></div>
      </div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
        ${item.client?`<div><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em">Cliente</div><div style="font-size:13px;font-weight:600;margin-top:2px">${esc(item.client)}</div></div>`:''}
        ${item.start?`<div><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em">Início</div><div style="font-size:13px;font-weight:600;margin-top:2px">${esc(item.start)}</div></div>`:''}
        ${item.end?`<div><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em">Expiração</div><div style="font-size:13px;font-weight:600;margin-top:2px">${esc(item.end)}</div></div>`:''}
        ${item.end&&s!=='expired'?`<div><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em">Dias restantes</div><div style="font-size:13px;font-weight:700;color:${statusColors[s]};margin-top:2px">${Math.max(0,Math.round((new Date(item.end)-new Date())/86400000))} dias</div></div>`:''}
      </div>
      ${item.notes?`<div style="margin-top:12px;padding:10px;background:var(--divider);border-radius:7px;font-size:12px;line-height:1.6">${esc(item.notes)}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn" onclick="navigator.clipboard.writeText('${esc(item.nc).replace(/'/g,"\\'")}').then(()=>showToast('✓ NC copiada!'))">📋 Copiar NC</button>
        <button class="btn" onclick="openEditModal('${item.id}')">✏️ Editar</button>
        <button class="btn" onclick="toggleStatus('${item.id}')">${s==='active'?'⏸ Pausar':s==='paused'?'▶ Reativar':'🔄 Reativar'}</button>
        <button class="btn" style="color:var(--erro)" onclick="deleteNC('${item.id}')">🗑 Remover</button>
      </div>
    </div>
  `;
}

function toggleStatus(id){
  const item=_items.find(i=>i.id===id); if(!item) return;
  const s=computeStatus(item);
  item.status=s==='paused'?'active':'paused';
  save(); renderList(); selectNC(id);
}

function deleteNC(id){
  if(!confirm('Remover esta NC da agenda?')) return;
  _items=_items.filter(i=>i.id!==id);
  if(_selId===id) { _selId=null; document.getElementById('detailPanel').innerHTML=`<div class="card" style="text-align:center;padding:40px;color:var(--faint)"><div style="font-size:30px;margin-bottom:8px">📋</div><div>Selecione uma NC</div></div>`; }
  save(); renderList();
  showToast('NC removida');
}

// Modal
function openAddModal(){
  _editId=null;
  document.getElementById('modalTitle').textContent='Nova NC';
  ['mNc','mLabel','mStart','mEnd','mClient','mNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mStatus').value='scheduled';
  document.getElementById('mStart').value=today();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('mNc').focus(),50);
}

function openEditModal(id){
  const item=_items.find(i=>i.id===id); if(!item) return;
  _editId=id;
  document.getElementById('modalTitle').textContent='Editar NC';
  document.getElementById('mNc').value=item.nc||'';
  document.getElementById('mLabel').value=item.label||'';
  document.getElementById('mStart').value=item.start||'';
  document.getElementById('mEnd').value=item.end||'';
  document.getElementById('mStatus').value=item.status||'active';
  document.getElementById('mClient').value=item.client||'';
  document.getElementById('mNotes').value=item.notes||'';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}

function saveNC(){
  const nc=document.getElementById('mNc').value.trim();
  if(!nc){document.getElementById('mNc').style.borderColor='var(--erro)';return;}
  document.getElementById('mNc').style.borderColor='';
  const item={
    id: _editId||('nc_'+Date.now()),
    nc,
    label: document.getElementById('mLabel').value.trim(),
    start: document.getElementById('mStart').value,
    end: document.getElementById('mEnd').value,
    status: document.getElementById('mStatus').value,
    client: document.getElementById('mClient').value.trim(),
    notes: document.getElementById('mNotes').value.trim(),
    createdAt: _editId?(_items.find(i=>i.id===_editId)?.createdAt||Date.now()):Date.now(),
    updatedAt: Date.now(),
  };
  if(_editId){
    const idx=_items.findIndex(i=>i.id===_editId);
    if(idx>=0) _items[idx]=item;
  } else {
    _items.unshift(item);
  }
  save(); closeModal(); renderList();
  if(_editId||_selId===item.id) selectNC(item.id);
  _editId=null;
  showToast(_editId?'NC atualizada':'✓ NC adicionada');
}

function exportCSV(){
  if(!_items.length){showToast('Nenhuma NC para exportar');return;}
  const rows=[['nc','label','status','inicio','expiracao','cliente','notas','criado_em']];
  _items.forEach(i=>rows.push([i.nc,i.label||'',computeStatus(i),i.start||'',i.end||'',i.client||'',i.notes||'',new Date(i.createdAt).toLocaleDateString('pt-BR')]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`agenda_nc_${today()}.csv`;a.click();
  showToast(`⬇ ${_items.length} NCs exportadas`);
}

// Init
renderList();
// Enter on modal
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&document.getElementById('modalOverlay').classList.contains('open')&&e.target.tagName!=='TEXTAREA') saveNC();
});
</script>
</body>
</html>
