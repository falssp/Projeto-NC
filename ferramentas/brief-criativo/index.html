<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief de Criativo | NC Tool</title>
<style>
:root{
  --navy:#0D2137;--navy2:#1A3F63;--accent:#38BDF8;
  --bg:#F0F4F8;--surface:#fff;--border:#DDE3EC;
  --text:#0D2137;--mid:#4A5568;--light:#8B9BBF;
  --blue:#2563EB;--green:#10B981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

header{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;gap:16px;height:56px}
.logo{color:#fff;font-size:15px;font-weight:700}
.logo span{color:var(--accent)}

main{padding:24px;max-width:960px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:700px){main{grid-template-columns:1fr}}

/* LEFT PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:sticky;top:76px}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--light);margin-bottom:14px}

.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--mid);margin-bottom:5px;display:block}
select,input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;font-family:inherit;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:70px;line-height:1.5}

.btn-gen{width:100%;padding:10px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:4px}
.btn-gen:hover{background:#1D4ED8}
.btn-export{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:8px}
.btn-export:hover{border-color:var(--blue);color:var(--blue)}

/* RIGHT PANEL — BRIEF */
.brief{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;min-height:400px}
.brief-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--light);text-align:center;gap:12px}
.brief-empty svg{width:48px;height:48px;opacity:.4}

.brief-header{border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:20px}
.brief-logo{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--light);margin-bottom:4px}
.brief-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px}
.brief-meta{display:flex;gap:10px;flex-wrap:wrap}
.brief-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:#EFF6FF;color:var(--blue)}

.section-block{margin-bottom:22px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2);border-left:3px solid var(--accent);padding-left:10px;margin-bottom:12px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.info-grid{grid-template-columns:1fr}}
.info-item{background:#F7FAFC;border-radius:8px;padding:10px 12px}
.info-item.full{grid-column:1/-1}
.info-key{font-size:10px;font-weight:600;color:var(--light);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.info-val{font-size:13px;color:var(--text);line-height:1.5}
.info-val code{font-family:'SF Mono','Fira Code',monospace;font-size:12px;background:#EFF6FF;color:var(--blue);padding:1px 6px;border-radius:4px}

.spec-table{width:100%;border-collapse:collapse;font-size:12px}
.spec-table th{text-align:left;padding:6px 10px;background:#F0F4F8;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--light)}
.spec-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.spec-table tr:last-child td{border-bottom:none}
.spec-val{font-family:'SF Mono','Fira Code',monospace;color:var(--blue)}

.checklist{list-style:none;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--mid);line-height:1.5}
.checklist li::before{content:'□';color:var(--light);font-size:14px;flex-shrink:0;margin-top:-1px}

.obs-box{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:12px;font-size:12px;color:#92400E;line-height:1.6}

footer{text-align:center;color:var(--light);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Brief de <span>Criativo</span></div>
  </div>
</header>

<main>
  <!-- LEFT -->
  <div class="panel">
    <h3>Configurar Brief</h3>

    <div class="form-group">
      <label class="form-label">Plataforma</label>
      <select id="plat">
        <option value="">Selecionar…</option>
        <option>Meta Ads</option>
        <option>TikTok Ads</option>
        <option>LinkedIn Ads</option>
        <option>Google Display</option>
        <option>YouTube</option>
        <option>DV360 / Programático</option>
        <option>Pinterest</option>
        <option>Snapchat</option>
        <option>X (Twitter) Ads</option>
        <option>CM360 (Rich Media)</option>
        <option>Spotify Ads</option>
        <option>Amazon DSP</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Formato</label>
      <select id="fmt"><option value="">Selecionar plataforma primeiro</option></select>
    </div>

    <div class="form-group">
      <label class="form-label">Objetivo</label>
      <select id="obj">
        <option>Awareness / Alcance</option>
        <option>Consideration / Tráfego</option>
        <option>Conversão / Vendas</option>
        <option>Geração de Leads</option>
        <option>Instalação de App</option>
        <option>Engajamento</option>
        <option>Video Views</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Nome do Cliente / Produto</label>
      <input type="text" id="cliente" placeholder="Ex: Unilever — Dove Men">
    </div>

    <div class="form-group">
      <label class="form-label">Mensagem principal</label>
      <textarea id="msg" placeholder="Ex: Novo produto para hidratação masculina com proteção UV"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">CTA</label>
      <input type="text" id="cta" placeholder="Ex: Saiba mais / Compre agora / Cadastre-se">
    </div>

    <div class="form-group">
      <label class="form-label">URL de destino</label>
      <input type="text" id="url" placeholder="https://…">
    </div>

    <button class="btn-gen" onclick="generate()">⚡ Gerar Brief</button>
    <button class="btn-export" onclick="exportBrief()">⬇ Exportar .txt</button>
  </div>

  <!-- RIGHT -->
  <div class="brief" id="brief">
    <div class="brief-empty">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="8" y="6" width="32" height="36" rx="3"/>
        <line x1="14" y1="16" x2="34" y2="16"/>
        <line x1="14" y1="22" x2="34" y2="22"/>
        <line x1="14" y1="28" x2="26" y2="28"/>
      </svg>
      <div>Configure o brief ao lado<br>e clique em <b>Gerar Brief</b></div>
    </div>
  </div>
</main>

<footer>Brief de Criativo · <a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none;">← Projeto NC</a></footer>

const OBJ_CHECKLIST = {
  "Awareness / Alcance":["Criativo impactante nos primeiros 3s","Marca visível logo no início","Mensagem simples e memorável","Evitar muito texto — formato visual","Versão com e sem som (legenda/logo)"],
  "Consideration / Tráfego":["CTA claro e direto","Produto/serviço visível","Proposta de valor explícita","URL de destino com UTM","Landing page alinhada com a mensagem do criativo"],
  "Conversão / Vendas":["Oferta/benefício destacado","Urgência ou escassez (se aplicável)","CTA de ação direta (Comprar / Pedir / Contratar)","Preço ou desconto visível","Pixels de conversão testados antes do go live"],
  "Geração de Leads":["Formulário simplificado (≤5 campos)","Benefício claro para o lead","CTA: Cadastrar / Baixar / Receber","Lead magnet destacado (e-book, demo, trial)","Pixel de lead testado"],
  "Instalação de App":["App store badge visível","Rating/reviews se positivos","Demonstração da UI do app","Deep link configurado","SDK de atribuição integrado (Adjust/AppsFlyer)"],
  "Engajamento":["Conteúdo nativo e autêntico","Hook nos primeiros 2s","Incentivar ação (curtir, comentar, compartilhar)","Tom alinhado com a plataforma","Evitar visual de 'anúncio' — preferir formato orgânico"],
  "Video Views":["Hook visual poderoso nos primeiros 3s","Storytelling progressivo","Versão curta (6s) para reforço","Closed captions ativos","Fim com CTA ou tela de marca"],
};

document.getElementById('plat').addEventListener('change', function() {
  const fmts = FORMATS[this.value] || [];
  const sel = document.getElementById('fmt');
  sel.innerHTML = fmts.length ? fmts.map(f=>`<option>${f}</option>`).join('') : '<option>Nenhum formato disponível</option>';
});

function generate() {
  const plat = document.getElementById('plat').value;
  const fmt = document.getElementById('fmt').value;
  const obj = document.getElementById('obj').value;
  const cliente = document.getElementById('cliente').value || '[Cliente/Produto]';
  const msg = document.getElementById('msg').value || '[Mensagem principal não informada]';
  const cta = document.getElementById('cta').value || '[CTA]';
  const url = document.getElementById('url').value || '[URL não informada]';

  if(!plat || !fmt) { alert('Selecione plataforma e formato.'); return; }
  const spec = SPECS[fmt] || {dim:'—',ratio:'—',peso:'—',ext:'—',dur:'—',extra:''};
  const checks = OBJ_CHECKLIST[obj] || [];
  const date = new Date().toLocaleDateString('pt-BR');

  document.getElementById('brief').innerHTML = `
    <div class="brief-header">
      <div class="brief-logo">NC Tool · Brief de Criativo · ${date}</div>
      <div class="brief-title">${cliente}</div>
      <div class="brief-meta">
        <span class="brief-tag">${plat}</span>
        <span class="brief-tag">${fmt}</span>
        <span class="brief-tag">${obj}</span>
      </div>
    </div>

    <div class="section-block">
      <div class="section-title">Informações Gerais</div>
      <div class="info-grid">
        <div class="info-item"><div class="info-key">Cliente / Produto</div><div class="info-val">${cliente}</div></div>
        <div class="info-item"><div class="info-key">Data do Brief</div><div class="info-val">${date}</div></div>
        <div class="info-item full"><div class="info-key">Mensagem Principal</div><div class="info-val">${msg}</div></div>
        <div class="info-item"><div class="info-key">CTA</div><div class="info-val"><b>${cta}</b></div></div>
        <div class="info-item"><div class="info-key">URL de Destino</div><div class="info-val"><code>${url}</code></div></div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-title">Especificações Técnicas</div>
      <table class="spec-table">
        <thead><tr><th>Atributo</th><th>Especificação</th></tr></thead>
        <tbody>
          <tr><td>Plataforma</td><td class="spec-val">${plat}</td></tr>
          <tr><td>Formato</td><td class="spec-val">${fmt}</td></tr>
          <tr><td>Dimensões</td><td class="spec-val">${spec.dim}</td></tr>
          <tr><td>Aspect Ratio</td><td class="spec-val">${spec.ratio}</td></tr>
          <tr><td>Peso máximo</td><td class="spec-val">${spec.peso}</td></tr>
          <tr><td>Extensões aceitas</td><td class="spec-val">${spec.ext}</td></tr>
          <tr><td>Duração</td><td class="spec-val">${spec.dur}</td></tr>
          <tr><td>Objetivo</td><td class="spec-val">${obj}</td></tr>
        </tbody>
      </table>
      ${spec.extra?`<div class="obs-box" style="margin-top:10px">⚠️ ${spec.extra}</div>`:''}
    </div>

    <div class="section-block">
      <div class="section-title">Checklist para ${obj}</div>
      <ul class="checklist">${checks.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>

    <div class="section-block">
      <div class="section-title">Observações Adicionais</div>
      <div class="info-grid">
        <div class="info-item full" style="min-height:60px"><div class="info-key">Para a equipe criativa</div><div class="info-val" style="color:var(--light)">[Preencher com contexto de campanha, referências visuais, restrições de marca]</div></div>
        <div class="info-item full"><div class="info-key">Entrega</div><div class="info-val" style="color:var(--light)">[Data de entrega · Responsável · Canal de aprovação]</div></div>
      </div>
    </div>`;
}

function exportBrief() {
  const plat = document.getElementById('plat').value || '—';
  const fmt = document.getElementById('fmt').value || '—';
  const obj = document.getElementById('obj').value;
  const cliente = document.getElementById('cliente').value || '[Cliente/Produto]';
  const msg = document.getElementById('msg').value || '—';
  const cta = document.getElementById('cta').value || '—';
  const url = document.getElementById('url').value || '—';
  const spec = SPECS[fmt] || {dim:'—',ratio:'—',peso:'—',ext:'—',dur:'—',extra:''};
  const checks = (OBJ_CHECKLIST[obj]||[]).map(c=>'  □ '+c).join('\n');
  const txt = `BRIEF DE CRIATIVO — NC Tool
${'='.repeat(40)}
Data: ${new Date().toLocaleDateString('pt-BR')}
Cliente/Produto: ${cliente}

INFORMAÇÕES GERAIS
------------------
Plataforma: ${plat}
Formato: ${fmt}
Objetivo: ${obj}
Mensagem: ${msg}
CTA: ${cta}
URL: ${url}

ESPECIFICAÇÕES TÉCNICAS
------------------------
Dimensões: ${spec.dim}
Ratio: ${spec.ratio}
Peso máx: ${spec.peso}
Extensões: ${spec.ext}
Duração: ${spec.dur}
${spec.extra?'Atenção: '+spec.extra:''}

CHECKLIST — ${obj}
${'-'.repeat(obj.length+12)}
${checks}

OBSERVAÇÕES
-----------
[Preencher com contexto, referências visuais e restrições de marca]

ENTREGA
-------
Data: ___________  Responsável: ___________  Canal de aprovação: ___________
`;
  const blob = new Blob([txt],{type:'text/plain'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Brief_${(cliente+' '+plat).replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}
</script>
</body>
</html>
