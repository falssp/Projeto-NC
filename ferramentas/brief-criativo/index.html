<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief de Criativo — NC Tool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#f4f5fb;color:#1a1a2e;min-height:100vh}
header{background:#1a237e;color:#fff;padding:16px 32px;display:flex;align-items:center;gap:16px}
header h1{font-size:1.2rem;font-weight:600}
header span{font-size:.85rem;opacity:.7;margin-left:auto}
.app{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:42%;min-width:380px;background:#fff;border-right:1px solid #d6dbf2;overflow-y:auto;padding:24px}
.preview-panel{flex:1;min-width:0;background:#f4f5fb;overflow-y:auto;padding:24px}
.section{margin-bottom:24px}
.section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1F36C7;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #e8ecfd}
.field{margin-bottom:12px}
label{display:block;font-size:.8rem;font-weight:600;color:#444;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d6dbf2;border-radius:6px;font-family:inherit;font-size:.85rem;color:#1a1a2e;background:#fff;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1F36C7}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#1F36C7;color:#fff}
.btn-primary:hover{background:#1a237e}
.btn-secondary{background:#e8ecfd;color:#1F36C7}
.btn-secondary:hover{background:#d6dbf2}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 10px;font-size:.75rem}
.format-row{background:#f8f9ff;border:1px solid #d6dbf2;border-radius:8px;padding:12px;margin-bottom:10px;position:relative}
.format-row-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.format-idx{font-size:.75rem;font-weight:700;color:#1F36C7;background:#e8ecfd;padding:2px 8px;border-radius:10px}
.color-row{display:flex;gap:10px;align-items:center}
.color-item{display:flex;align-items:center;gap:6px}
.color-item input[type=color]{width:36px;height:32px;padding:2px;border-radius:4px;cursor:pointer}
.color-hex{width:80px}
.preview-wrap{background:#fff;border-radius:10px;border:1px solid #d6dbf2;padding:28px;min-height:400px}
.preview-actions{display:flex;gap:8px;margin-bottom:16px}
.brief-doc{font-family:'Space Grotesk',monospace;font-size:.82rem;line-height:1.6;color:#1a1a2e}
.brief-header{background:#1a237e;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:16px}
.brief-header h2{font-size:1rem;font-weight:700;margin-bottom:4px}
.brief-header .meta{font-size:.75rem;opacity:.8}
.brief-section{margin-bottom:16px}
.brief-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#1F36C7;border-bottom:1px solid #d6dbf2;padding-bottom:4px;margin-bottom:8px}
.brief-table{width:100%;border-collapse:collapse;font-size:.75rem}
.brief-table th{background:#e8ecfd;color:#1a237e;padding:5px 8px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.brief-table td{padding:5px 8px;border-bottom:1px solid #f0f1f8;vertical-align:middle}
.brief-table tr:last-child td{border-bottom:none}
.brief-table tr:hover td{background:#f8f9ff}
.plat-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:.7rem;font-weight:600}
.brief-copy-block{background:#f8f9ff;border:1px solid #d6dbf2;border-radius:6px;padding:12px;font-size:.82rem}
.brief-copy-block strong{color:#1F36C7}
.brief-colors{display:flex;gap:8px;align-items:center;margin-top:4px}
.color-swatch{width:20px;height:20px;border-radius:4px;border:1px solid #d6dbf2;display:inline-block}
.placeholder{color:#aaa;font-style:italic}
.brief-footer{font-size:.7rem;color:#aaa;text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #f0f1f8}
@media print{
  header,.sidebar,.preview-actions{display:none!important}
  .app{display:block}
  .preview-panel{padding:0;background:#fff}
  .preview-wrap{border:none;padding:0;border-radius:0}
  .brief-header{background:#1a237e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid #d6dbf2}
}
</style>
</head>
<body>
<header>
  <div>📋</div>
  <h1>Gerador de Brief de Criativo</h1>
  <span>NC Tool · AdOps Suite</span>
</header>
<div class="app">
  <!-- SIDEBAR FORM -->
  <div class="sidebar">

    <div class="section">
      <div class="section-title">Dados Gerais</div>
      <div class="field"><label>Anunciante</label><input id="anunciante" placeholder="Ex: Marca X" oninput="renderPreview()"></div>
      <div class="field"><label>Produto / Campanha</label><input id="campanha" placeholder="Ex: Lançamento Produto Y — Q4 2026" oninput="renderPreview()"></div>
      <div class="row2">
        <div class="field"><label>Agência de mídia</label><input id="agencia" placeholder="Ex: StormX" oninput="renderPreview()"></div>
        <div class="field"><label>Contato mídia</label><input id="contato" placeholder="Nome" oninput="renderPreview()"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Data de envio</label><input type="date" id="data-envio" oninput="renderPreview()"></div>
        <div class="field"><label>Prazo de entrega</label><input type="date" id="prazo" oninput="renderPreview()"></div>
      </div>
      <div class="field"><label>Objetivo da campanha</label>
        <select id="objetivo" onchange="renderPreview()">
          <option value="">Selecione...</option>
          <option>Awareness / Branding</option>
          <option>Consideração</option>
          <option>Conversão</option>
          <option>Remarketing</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Formatos Solicitados</div>
      <div id="formats-list"></div>
      <button class="btn btn-secondary" onclick="addFormat()">+ Adicionar formato</button>
    </div>

    <div class="section">
      <div class="section-title">Diretrizes de Copy</div>
      <div class="field"><label>Headline principal</label><input id="headline" placeholder="Ex: Transforme sua rotina" oninput="renderPreview()"></div>
      <div class="field"><label>CTA</label><input id="cta" placeholder="Ex: Saiba mais / Compre agora" oninput="renderPreview()"></div>
      <div class="field"><label>Tagline / mensagem secundária</label><input id="tagline" placeholder="Ex: Por apenas R$ 49/mês" oninput="renderPreview()"></div>
      <div class="field"><label>Restrições de marca</label><textarea id="restricoes" placeholder="Ex: Não usar fundo branco. Não mencionar concorrentes. Logo sempre no canto inferior direito." oninput="renderPreview()"></textarea></div>
    </div>

    <div class="section">
      <div class="section-title">Referências Visuais</div>
      <div class="field"><label>URL de referência</label><input id="ref-url" placeholder="https://..." oninput="renderPreview()"></div>
      <div class="field"><label>Paleta de cores</label>
        <div class="color-row">
          <div class="color-item"><input type="color" id="cor1" value="#1F36C7" oninput="syncHex('cor1','hex1');renderPreview()"><input class="color-hex" id="hex1" value="#1F36C7" oninput="syncColor('hex1','cor1');renderPreview()"></div>
          <div class="color-item"><input type="color" id="cor2" value="#ffffff" oninput="syncHex('cor2','hex2');renderPreview()"><input class="color-hex" id="hex2" value="#ffffff" oninput="syncColor('hex2','cor2');renderPreview()"></div>
          <div class="color-item"><input type="color" id="cor3" value="#f4f5fb" oninput="syncHex('cor3','hex3');renderPreview()"><input class="color-hex" id="hex3" value="#f4f5fb" oninput="syncColor('hex3','cor3');renderPreview()"></div>
        </div>
      </div>
      <div class="field"><label>Fonte principal</label><input id="fonte" placeholder="Ex: Montserrat Bold" oninput="renderPreview()"></div>
    </div>

    <div class="section">
      <div class="section-title">Instruções de Entrega</div>
      <div class="field"><label>Formato de entrega</label>
        <select id="entrega" onchange="renderPreview()">
          <option value="">Selecione...</option>
          <option>Link Google Drive</option>
          <option>WeTransfer</option>
          <option>E-mail</option>
          <option>Plataforma de gestão</option>
        </select>
      </div>
      <div class="field"><label>Destinatário</label><input id="destinatario" placeholder="Ex: studio@agencia.com.br" oninput="renderPreview()"></div>
      <div class="field"><label>Nomenclatura de arquivos</label><input id="nomenclatura" value="ANUNCIANTE_FORMATO_DIMENSAO_VERSAO" oninput="renderPreview()"></div>
      <div class="field"><label>Observações adicionais</label><textarea id="obs-entrega" placeholder="Ex: Entregar em pastas separadas por formato. Incluir versão em espanhol." oninput="renderPreview()"></textarea></div>
    </div>

  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-actions">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / PDF</button>
      <button class="btn btn-secondary" onclick="copyHTML()">📋 Copiar HTML</button>
      <button class="btn btn-secondary" onclick="copyText()">📄 Copiar como texto</button>
      <button class="btn btn-secondary btn-sm" onclick="clearAll()" style="margin-left:auto">🗑️ Limpar</button>
    </div>
    <div class="preview-wrap" id="brief-output">
      <div class="placeholder" style="text-align:center;padding:60px 20px">
        <div style="font-size:2rem;margin-bottom:12px">📋</div>
        <div style="font-size:1rem;font-weight:600;color:#888">Preencha o formulário ao lado</div>
        <div style="font-size:.82rem;color:#aaa;margin-top:6px">O brief será gerado automaticamente</div>
      </div>
    </div>
  </div>
</div>

<script>
const PLATFORM_FORMATS = {
  'Meta Ads': [
    {f:'Feed 1:1',d:'1080×1080',t:'JPG / PNG / MP4',s:'1MB img · 30MB vídeo',dur:'até 30s'},
    {f:'Feed 4:5',d:'1080×1350',t:'JPG / PNG / MP4',s:'1MB img · 30MB vídeo',dur:'até 30s'},
    {f:'Stories 9:16',d:'1080×1920',t:'JPG / PNG / MP4',s:'30MB',dur:'até 15s'},
    {f:'Reels 9:16',d:'1080×1920',t:'MP4',s:'4GB',dur:'até 90s'},
    {f:'Carrossel',d:'1080×1080',t:'JPG / PNG / MP4',s:'30MB',dur:'até 30s/card'},
    {f:'Banner 1.91:1',d:'1200×628',t:'JPG / PNG',s:'30MB',dur:'—'},
  ],
  'Google Display': [
    {f:'Medium Rectangle',d:'300×250',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Leaderboard',d:'728×90',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Billboard',d:'970×250',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Mobile Banner',d:'320×50',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'—'},
    {f:'Half Page',d:'300×600',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Wide Skyscraper',d:'160×600',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
  ],
  'YouTube': [
    {f:'Skippable In-Stream',d:'16:9 (1920×1080)',t:'MP4 / MOV',s:'—',dur:'até 60s (pulo em 5s)'},
    {f:'Non-Skippable',d:'16:9 (1920×1080)',t:'MP4 / MOV',s:'—',dur:'15–20s'},
    {f:'Bumper',d:'16:9 (1920×1080)',t:'MP4 / MOV',s:'—',dur:'6s'},
    {f:'Discovery / In-Feed',d:'Thumbnail 1280×720',t:'JPG / PNG + headline',s:'—',dur:'—'},
    {f:'Masthead',d:'16:9 (1920×1080)',t:'MP4',s:'—',dur:'até 30s'},
  ],
  'TikTok': [
    {f:'TopView',d:'1080×1920',t:'MP4',s:'500MB',dur:'até 60s'},
    {f:'In-Feed',d:'1080×1920',t:'MP4',s:'500MB',dur:'até 60s'},
    {f:'Spark Ad',d:'1080×1920',t:'MP4',s:'500MB',dur:'até 60s'},
    {f:'Brand Takeover',d:'1080×1920',t:'MP4 / JPG',s:'500MB',dur:'3–5s'},
  ],
  'LinkedIn': [
    {f:'Single Image Feed',d:'1200×628 ou 1200×1200',t:'JPG / PNG',s:'5MB',dur:'—'},
    {f:'Video Ad',d:'16:9 (1920×1080)',t:'MP4',s:'200MB',dur:'3s a 30min'},
    {f:'Carrossel',d:'1080×1080',t:'JPG / PNG',s:'10MB/card',dur:'—'},
    {f:'Document Ad',d:'—',t:'PDF',s:'100MB',dur:'—'},
  ],
  'DV360/Programático': [
    {f:'Medium Rectangle',d:'300×250',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Billboard',d:'970×250',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Half Page',d:'300×600',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Leaderboard',d:'728×90',t:'JPG / PNG / GIF / HTML5',s:'150KB',dur:'até 30s anim.'},
    {f:'Expandable',d:'variável',t:'HTML5',s:'150KB (inicial)',dur:'até 30s anim.'},
    {f:'Interstitial',d:'320×480',t:'HTML5 / JPG',s:'200KB',dur:'—'},
  ],
  'CM360/Ad Server': [
    {f:'Display Padrão',d:'customizável',t:'JPG / PNG / GIF',s:'200KB',dur:'até 30s anim.'},
    {f:'HTML5',d:'customizável',t:'HTML5 (ZIP)',s:'200KB',dur:'até 30s anim.'},
    {f:'VAST Pre-roll',d:'16:9 (1920×1080)',t:'VAST XML / MP4',s:'—',dur:'até 30s'},
    {f:'Rich Media',d:'customizável',t:'HTML5',s:'500KB',dur:'customizável'},
  ],
  'X Ads': [
    {f:'Imagem 16:9',d:'1200×675',t:'JPG / PNG / GIF',s:'15MB GIF · 5MB img',dur:'—'},
    {f:'Imagem 1:1',d:'1200×1200',t:'JPG / PNG / GIF',s:'15MB GIF · 5MB img',dur:'—'},
    {f:'Vídeo In-Stream',d:'16:9 (1920×1080)',t:'MP4 / MOV',s:'1GB',dur:'até 30s'},
    {f:'App Card',d:'800×418',t:'JPG / PNG',s:'3MB',dur:'—'},
  ],
  'Pinterest': [
    {f:'Pin 2:3',d:'1000×1500',t:'JPG / PNG / MP4',s:'32MB img · 2GB vídeo',dur:'4–15min vídeo'},
    {f:'Pin 1:1',d:'1000×1000',t:'JPG / PNG / MP4',s:'32MB img · 2GB vídeo',dur:'4–15min vídeo'},
    {f:'Pin 9:16',d:'1000×1778',t:'JPG / PNG / MP4',s:'32MB img · 2GB vídeo',dur:'4–15min vídeo'},
  ],
  'OOH Digital': [
    {f:'Full HD Landscape',d:'1920×1080',t:'JPG / PNG / MP4',s:'50MB',dur:'5–15s'},
    {f:'Full HD Portrait',d:'1080×1920',t:'JPG / PNG / MP4',s:'50MB',dur:'5–15s'},
    {f:'Custom',d:'customizável',t:'JPG / PNG / MP4',s:'50MB',dur:'customizável'},
  ],
};

const PLAT_COLORS = {
  'Meta Ads':'#1877F2','Google Display':'#34A853','YouTube':'#FF0000',
  'TikTok':'#010101','LinkedIn':'#0077B5','DV360/Programático':'#4285F4',
  'CM360/Ad Server':'#1a237e','X Ads':'#000000','Pinterest':'#E60023','OOH Digital':'#F5A623'
};

let formats = [];
let fmtCounter = 0;

function addFormat(){
  const id = ++fmtCounter;
  formats.push({id, plat:'', fmt:'', dim:'', tipo:'', size:'', dur:'', qtd:1, variantes:'', obs:''});
  renderFormats();
}

function removeFormat(id){
  formats = formats.filter(f=>f.id!==id);
  renderFormats();
}

function renderFormats(){
  const el = document.getElementById('formats-list');
  if(!formats.length){el.innerHTML='<p style="color:#aaa;font-size:.8rem;margin-bottom:10px">Nenhum formato adicionado.</p>';renderPreview();return;}
  el.innerHTML = formats.map((f,i)=>`
    <div class="format-row" id="fmt-${f.id}">
      <div class="format-row-header">
        <span class="format-idx">Formato ${i+1}</span>
        <button class="btn btn-danger btn-sm" onclick="removeFormat(${f.id})">✕ Remover</button>
      </div>
      <div class="row2">
        <div class="field"><label>Plataforma</label>
          <select onchange="onPlatChange(${f.id},this.value)">
            <option value="">Selecione...</option>
            ${Object.keys(PLATFORM_FORMATS).map(p=>`<option${f.plat===p?' selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Formato</label>
          <select id="fmtsel-${f.id}" onchange="onFmtChange(${f.id},this.value)">
            <option value="">Selecione a plataforma</option>
            ${f.plat?PLATFORM_FORMATS[f.plat].map(x=>`<option${f.fmt===x.f?' selected':''}>${x.f}</option>`).join(''):''}
          </select>
        </div>
      </div>
      <div class="row3">
        <div class="field"><label>Dimensões</label><input value="${f.dim}" placeholder="1080×1080" oninput="updateFmt(${f.id},'dim',this.value)"></div>
        <div class="field"><label>Tipo de arquivo</label><input value="${f.tipo}" placeholder="JPG/MP4" oninput="updateFmt(${f.id},'tipo',this.value)"></div>
        <div class="field"><label>Tam. máximo</label><input value="${f.size}" placeholder="30MB" oninput="updateFmt(${f.id},'size',this.value)"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Duração máx.</label><input value="${f.dur}" placeholder="até 30s" oninput="updateFmt(${f.id},'dur',this.value)"></div>
        <div class="field"><label>Versões</label><input type="number" min="1" value="${f.qtd}" oninput="updateFmt(${f.id},'qtd',this.value)"></div>
        <div class="field"><label>Variantes</label><input value="${f.variantes}" placeholder="Ex: Produto A, Produto B" oninput="updateFmt(${f.id},'variantes',this.value)"></div>
      </div>
      <div class="field"><label>Observações</label><input value="${f.obs}" placeholder="Ex: Incluir versão sem texto para adaptação" oninput="updateFmt(${f.id},'obs',this.value)"></div>
    </div>
  `).join('');
  renderPreview();
}

function onPlatChange(id, plat){
  const f = formats.find(x=>x.id===id);
  f.plat=plat; f.fmt=''; f.dim=''; f.tipo=''; f.size=''; f.dur='';
  renderFormats();
}

function onFmtChange(id, fmt){
  const f = formats.find(x=>x.id===id);
  f.fmt=fmt;
  if(f.plat && fmt){
    const spec = PLATFORM_FORMATS[f.plat]?.find(x=>x.f===fmt);
    if(spec){f.dim=spec.d;f.tipo=spec.t;f.size=spec.s;f.dur=spec.dur;}
  }
  renderFormats();
}

function updateFmt(id, key, val){
  const f = formats.find(x=>x.id===id);
  if(f) f[key]=val;
  renderPreview();
}

function syncHex(colorId, hexId){
  document.getElementById(hexId).value = document.getElementById(colorId).value;
}
function syncColor(hexId, colorId){
  const v = document.getElementById(hexId).value;
  if(/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById(colorId).value = v;
}

function g(id){return document.getElementById(id)?.value||'';}

function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function renderPreview(){
  saveState();
  const anunciante = g('anunciante')||'[Anunciante]';
  const campanha = g('campanha')||'[Campanha]';
  const agencia = g('agencia')||'[Agência]';
  const contato = g('contato');
  const dataEnvio = fmtDate(g('data-envio'));
  const prazo = fmtDate(g('prazo'));
  const objetivo = g('objetivo')||'—';
  const headline = g('headline');
  const cta = g('cta');
  const tagline = g('tagline');
  const restricoes = g('restricoes');
  const refUrl = g('ref-url');
  const c1 = g('hex1')||'#1F36C7';
  const c2 = g('hex2')||'#ffffff';
  const c3 = g('hex3')||'#f4f5fb';
  const fonte = g('fonte');
  const entrega = g('entrega')||'—';
  const destinatario = g('destinatario');
  const nomenclatura = g('nomenclatura')||'ANUNCIANTE_FORMATO_DIMENSAO_VERSAO';
  const obsEntrega = g('obs-entrega');

  const hasData = anunciante!=='[Anunciante]'||campanha!=='[Campanha]'||formats.length>0;
  if(!hasData){
    document.getElementById('brief-output').innerHTML=`<div class="placeholder" style="text-align:center;padding:60px 20px"><div style="font-size:2rem;margin-bottom:12px">📋</div><div style="font-size:1rem;font-weight:600;color:#888">Preencha o formulário ao lado</div><div style="font-size:.82rem;color:#aaa;margin-top:6px">O brief será gerado automaticamente</div></div>`;
    return;
  }

  const platColor = p => PLAT_COLORS[p]||'#1a237e';

  const formatsRows = formats.length ? formats.map(f=>`
    <tr>
      <td><span class="plat-badge" style="background:${platColor(f.plat)}22;color:${platColor(f.plat)}">${f.plat||'—'}</span></td>
      <td>${f.fmt||'—'}</td>
      <td>${f.dim||'—'}</td>
      <td>${f.tipo||'—'}</td>
      <td>${f.dur||'—'}</td>
      <td>${f.size||'—'}</td>
      <td style="text-align:center">${f.qtd||1}</td>
      <td>${f.variantes||'—'}</td>
    </tr>
    ${f.obs?`<tr><td colspan="8" style="font-size:.72rem;color:#888;font-style:italic;padding:2px 8px 6px">↳ ${f.obs}</td></tr>`:''}
  `).join('') : '<tr><td colspan="8" class="placeholder">Nenhum formato adicionado</td></tr>';

  const copySection = (headline||cta||tagline||restricoes) ? `
    <div class="brief-section">
      <div class="brief-section-title">Diretrizes de Copy</div>
      <div class="brief-copy-block">
        ${headline?`<div><strong>Headline:</strong> ${headline}</div>`:''}
        ${tagline?`<div><strong>Tagline:</strong> ${tagline}</div>`:''}
        ${cta?`<div><strong>CTA:</strong> ${cta}</div>`:''}
        ${restricoes?`<div style="margin-top:6px"><strong>Restrições de marca:</strong><br><span style="white-space:pre-line">${restricoes}</span></div>`:''}
      </div>
    </div>
  ` : '';

  const refSection = `
    <div class="brief-section">
      <div class="brief-section-title">Referências Visuais</div>
      <div class="brief-copy-block">
        ${refUrl?`<div><strong>URL:</strong> <a href="${refUrl}" target="_blank" style="color:#1F36C7">${refUrl}</a></div>`:''}
        <div style="margin-top:6px"><strong>Paleta de cores:</strong>
          <div class="brief-colors">
            <span class="color-swatch" style="background:${c1}" title="${c1}"></span><span style="font-size:.75rem">${c1}</span>
            <span class="color-swatch" style="background:${c2}" title="${c2}"></span><span style="font-size:.75rem">${c2}</span>
            <span class="color-swatch" style="background:${c3}" title="${c3}"></span><span style="font-size:.75rem">${c3}</span>
          </div>
        </div>
        ${fonte?`<div style="margin-top:4px"><strong>Fonte:</strong> ${fonte}</div>`:''}
      </div>
    </div>
  `;

  document.getElementById('brief-output').innerHTML = `
    <div class="brief-doc">
      <div class="brief-header">
        <h2>📋 BRIEF DE CRIATIVO — MÍDIA DIGITAL</h2>
        <div class="meta">${anunciante} · ${campanha}</div>
        <div class="meta" style="margin-top:4px">Emitido por: ${agencia}${contato?' · '+contato:''} &nbsp;|&nbsp; Data: ${dataEnvio} &nbsp;|&nbsp; Prazo de entrega: <strong>${prazo}</strong></div>
      </div>

      <div class="brief-section">
        <div class="brief-section-title">Objetivo da Campanha</div>
        <div class="brief-copy-block"><strong>${objetivo}</strong></div>
      </div>

      <div class="brief-section">
        <div class="brief-section-title">Formatos Solicitados</div>
        <table class="brief-table">
          <thead><tr><th>Plataforma</th><th>Formato</th><th>Dimensões</th><th>Arquivo</th><th>Duração</th><th>Tam. máx.</th><th>Qtd.</th><th>Variantes</th></tr></thead>
          <tbody>${formatsRows}</tbody>
        </table>
      </div>

      ${copySection}
      ${refSection}

      <div class="brief-section">
        <div class="brief-section-title">Instruções de Entrega</div>
        <div class="brief-copy-block">
          <div><strong>Via:</strong> ${entrega}</div>
          ${destinatario?`<div><strong>Destinatário:</strong> ${destinatario}</div>`:''}
          <div style="margin-top:4px"><strong>Nomenclatura dos arquivos:</strong><br><code style="background:#e8ecfd;padding:2px 6px;border-radius:4px;font-size:.8rem">${nomenclatura.replace('ANUNCIANTE',anunciante!='[Anunciante]'?anunciante:'ANUNCIANTE')}</code></div>
          ${obsEntrega?`<div style="margin-top:6px;white-space:pre-line">${obsEntrega}</div>`:''}
        </div>
      </div>

      <div class="brief-footer">Gerado em ${new Date().toLocaleDateString('pt-BR')} · NC Tool AdOps Suite · https://falssp.github.io/Projeto-NC/ferramentas/</div>
    </div>
  `;
}

function copyHTML(){
  const html = document.getElementById('brief-output').innerHTML;
  navigator.clipboard.writeText(html).then(()=>showToast('HTML copiado!'));
}

function copyText(){
  const el = document.getElementById('brief-output');
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(()=>showToast('Texto copiado!'));
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;right:24px;background:#1a237e;color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2000);
}

function saveState(){
  try{
    const state={
      anunciante:g('anunciante'),campanha:g('campanha'),agencia:g('agencia'),contato:g('contato'),
      dataEnvio:g('data-envio'),prazo:g('prazo'),objetivo:g('objetivo'),
      headline:g('headline'),cta:g('cta'),tagline:g('tagline'),restricoes:g('restricoes'),
      refUrl:g('ref-url'),c1:g('hex1'),c2:g('hex2'),c3:g('hex3'),fonte:g('fonte'),
      entrega:g('entrega'),destinatario:g('destinatario'),nomenclatura:g('nomenclatura'),obsEntrega:g('obs-entrega'),
      formats,fmtCounter
    };
    localStorage.setItem('brief-criativo-state',JSON.stringify(state));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem('brief-criativo-state');
    if(!raw)return;
    const s=JSON.parse(raw);
    const setVal=(id,v)=>{const el=document.getElementById(id);if(el&&v!==undefined)el.value=v;};
    setVal('anunciante',s.anunciante);setVal('campanha',s.campanha);setVal('agencia',s.agencia);setVal('contato',s.contato);
    setVal('data-envio',s.dataEnvio);setVal('prazo',s.prazo);setVal('objetivo',s.objetivo);
    setVal('headline',s.headline);setVal('cta',s.cta);setVal('tagline',s.tagline);setVal('restricoes',s.restricoes);
    setVal('ref-url',s.refUrl);setVal('hex1',s.c1);setVal('hex2',s.c2);setVal('hex3',s.c3);
    if(s.c1){document.getElementById('cor1').value=s.c1;}
    if(s.c2){document.getElementById('cor2').value=s.c2;}
    if(s.c3){document.getElementById('cor3').value=s.c3;}
    setVal('fonte',s.fonte);setVal('entrega',s.entrega);setVal('destinatario',s.destinatario);
    setVal('nomenclatura',s.nomenclatura);setVal('obs-entrega',s.obsEntrega);
    if(s.formats){formats=s.formats;fmtCounter=s.fmtCounter||0;}
  }catch(e){}
}

function clearAll(){
  if(!confirm('Limpar todos os campos?'))return;
  formats=[];fmtCounter=0;
  document.querySelectorAll('input,select,textarea').forEach(el=>{
    if(el.type==='color')return;
    if(el.id==='nomenclatura'){el.value='ANUNCIANTE_FORMATO_DIMENSAO_VERSAO';return;}
    if(el.type==='number')el.value='';
    else el.value='';
  });
  document.getElementById('cor1').value='#1F36C7';document.getElementById('hex1').value='#1F36C7';
  document.getElementById('cor2').value='#ffffff';document.getElementById('hex2').value='#ffffff';
  document.getElementById('cor3').value='#f4f5fb';document.getElementById('hex3').value='#f4f5fb';
  localStorage.removeItem('brief-criativo-state');
  renderFormats();
  renderPreview();
}

// Init
document.getElementById('data-envio').value = new Date().toISOString().split('T')[0];
loadState();
renderFormats();
renderPreview();
</script>
</body>
</html>
