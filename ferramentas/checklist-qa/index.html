<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Checklist | NC Tool</title>
<style>
:root {
  --navy:#0D2137;--navy2:#1A3F63;--accent:#38BDF8;
  --bg:#F0F4F8;--surface:#fff;--border:#DDE3EC;
  --text:#0D2137;--mid:#4A5568;--light:#8B9BBF;
  --green:#10B981;--yellow:#F59E0B;--red:#EF4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

header{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;gap:16px;height:56px}
.logo{color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.logo span{color:var(--accent)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn-reset{padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:rgba(255,255,255,.1);color:#fff}
.btn-export{padding:6px 14px;border-radius:6px;border:none;background:var(--accent);color:var(--navy);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-export:hover{background:#7DD3FC}

.plat-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:56px;z-index:99}
.plat-inner{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.plat-inner::-webkit-scrollbar{display:none}
.plat-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.plat-btn:hover{border-color:#2563EB;color:#2563EB}
.plat-btn.active{background:#2563EB;border-color:#2563EB;color:#fff}

main{padding:20px 24px 60px;max-width:860px;margin:0 auto}

.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:20px}
.progress-ring{position:relative;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#EEF3FA;stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s,stroke .3s}
.ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-size:18px;font-weight:800;color:var(--text)}
.ring-sub{font-size:10px;color:var(--light)}
.progress-info{flex:1}
.progress-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.progress-detail{font-size:12px;color:var(--mid)}
.progress-bar-wrap{margin-top:10px;height:6px;background:#EEF3FA;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.stat-pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat-pill{font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px}
.pill-ok{background:#D1FAE5;color:#065F46}
.pill-pend{background:#FEF3C7;color:#92400E}
.pill-na{background:#F1F5F9;color:var(--mid)}

.section{margin-bottom:20px}
.section-hdr{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--light);padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}

.item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .1s;border:1px solid transparent}
.item:hover{background:#F7FAFC}
.item.checked{background:#F0FDF4;border-color:#D1FAE5}
.item.na-state{opacity:.5}

.checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
.item.checked .checkbox{background:var(--green);border-color:var(--green)}
.item.checked .checkbox::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.na-btn{font-size:10px;font-weight:600;color:var(--light);background:#F1F5F9;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;flex-shrink:0;margin-top:3px;white-space:nowrap;transition:all .15s}
.na-btn:hover{background:#E2E8F0;color:var(--mid)}
.item.na-state .na-btn{background:#E2E8F0;color:var(--mid)}

.item-content{flex:1}
.item-label{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.item.checked .item-label{text-decoration:line-through;color:var(--light)}
.item-desc{font-size:11px;color:var(--mid);line-height:1.5;margin-top:2px}
.item-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:4px;margin-top:4px}
.tag-critico{background:#FEE2E2;color:#991B1B}
.tag-importante{background:#FEF3C7;color:#92400E}
.tag-recomendado{background:#DBEAFE;color:#1E40AF}

footer{text-align:center;color:var(--light);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">QA <span>Checklist</span></div>
    <div class="header-right">
      <button class="btn-reset" onclick="resetAll()">↺ Resetar</button>
      <button class="btn-export" onclick="exportPDF()">⬇ Exportar</button>
    </div>
  </div>
</header>

<div class="plat-bar">
  <div class="plat-inner" id="plat-tabs"></div>
</div>

<main>
  <div class="progress-card">
    <div class="progress-ring">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="ring-bg" cx="36" cy="36" r="30"/>
        <circle class="ring-fill" id="ring" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
      </svg>
      <div class="ring-label">
        <div class="ring-pct" id="ring-pct">0%</div>
        <div class="ring-sub">QA</div>
      </div>
    </div>
    <div class="progress-info">
      <div class="progress-title" id="prog-plat">Selecione uma plataforma</div>
      <div class="progress-detail" id="prog-detail">—</div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
      <div class="stat-pills" id="stat-pills"></div>
    </div>
  </div>

  <div id="checklist-wrap"></div>
</main>

<footer>QA Checklist · <a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none;">← Projeto NC</a></footer>

let currentPlat = Object.keys(PLATS)[0];
let state = {}; // {plat: {itemKey: 'checked'|'na'}}
Object.keys(PLATS).forEach(p => state[p] = {});

// Build platform tabs
const tabWrap = document.getElementById('plat-tabs');
Object.entries(PLATS).forEach(([name, data], i) => {
  const btn = document.createElement('button');
  btn.className = 'plat-btn' + (i===0?' active':'');
  btn.textContent = data.icon + ' ' + name;
  btn.onclick = () => {
    document.querySelectorAll('.plat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPlat = name;
    render();
  };
  tabWrap.appendChild(btn);
});

function itemKey(section, idx) { return section+'::'+idx; }

function render() {
  const plat = PLATS[currentPlat];
  const wrap = document.getElementById('checklist-wrap');
  wrap.innerHTML = '';
  let total=0, done=0, naCount=0;

  Object.entries(plat.sections).forEach(([sec, items]) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.innerHTML = `<div class="section-hdr">${sec}</div>`;
    items.forEach((item, idx) => {
      total++;
      const key = itemKey(sec, idx);
      const st = state[currentPlat][key] || '';
      if(st==='checked') done++;
      if(st==='na') naCount++;

      const div = document.createElement('div');
      div.className = 'item'+(st==='checked'?' checked':st==='na'?' na-state':'');
      div.innerHTML = `
        <div class="checkbox"></div>
        <div class="item-content">
          <div class="item-label">${item.l}</div>
          ${item.d?`<div class="item-desc">${item.d}</div>`:''}
          <span class="item-tag tag-${item.t}">${item.t==='critico'?'Crítico':item.t==='importante'?'Importante':'Recomendado'}</span>
        </div>
        <button class="na-btn">${st==='na'?'✓ N/A':'N/A'}</button>`;
      div.querySelector('.na-btn').addEventListener('click', e => {
        e.stopPropagation();
        state[currentPlat][key] = st==='na' ? '' : 'na';
        render();
      });
      div.addEventListener('click', () => {
        if(state[currentPlat][key]==='na') return;
        state[currentPlat][key] = state[currentPlat][key]==='checked' ? '' : 'checked';
        render();
      });
      secDiv.appendChild(div);
    });
    wrap.appendChild(secDiv);
  });

  const pct = total ? Math.round((done/total)*100) : 0;
  const circ = 188.5;
  document.getElementById('ring').style.strokeDashoffset = circ - (circ*pct/100);
  document.getElementById('ring').style.stroke = pct===100?'var(--green)':pct>50?'var(--yellow)':'var(--accent)';
  document.getElementById('ring-pct').textContent = pct+'%';
  document.getElementById('prog-plat').textContent = PLATS[currentPlat].icon+' '+currentPlat;
  document.getElementById('prog-detail').textContent = `${done} de ${total} itens concluídos`;
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-bar').style.background = pct===100?'var(--green)':pct>50?'var(--yellow)':'var(--accent)';
  const pending = total-done-naCount;
  document.getElementById('stat-pills').innerHTML =
    `<span class="stat-pill pill-ok">✓ ${done} OK</span>`+
    (pending?`<span class="stat-pill pill-pend">⏳ ${pending} pendentes</span>`:'')+
    (naCount?`<span class="stat-pill pill-na">— ${naCount} N/A</span>`:'');
}

function resetAll() {
  if(!confirm('Resetar todos os itens desta plataforma?')) return;
  state[currentPlat] = {};
  render();
}

function exportPDF() {
  const plat = PLATS[currentPlat];
  let txt = `QA CHECKLIST — ${currentPlat}\n${'='.repeat(40)}\n\n`;
  Object.entries(plat.sections).forEach(([sec, items]) => {
    txt += `\n${sec.toUpperCase()}\n${'-'.repeat(sec.length)}\n`;
    items.forEach((item, idx) => {
      const key = itemKey(sec, idx);
      const st = state[currentPlat][key] || '';
      const mark = st==='checked'?'[✓]':st==='na'?'[N/A]':'[ ]';
      txt += `${mark} ${item.l}\n`;
    });
  });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `QA_${currentPlat.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

render();
</script>
</body>
</html>
