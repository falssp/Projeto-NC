<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico NC</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ─── TOKENS ─── */
:root {
  --bg:          #f4f5fb;
  --surface:     #fff;
  --card:        #fff;
  --card-border: #e0e4f2;
  --fg:          #1a1d2e;
  --faint:       #8891c8;
  --muted:       #5a6080;
  --accent:      #4f6ef7;
  --accent-fg:   #fff;
  --pill:        #eef0fb;
  --pill-hover:  #dde2f8;
  --success:     #22c55e;
  --warn:        #f59e0b;
  --erro:        #ef4444;
  --shadow:      0 1px 4px rgba(0,0,0,.08);
  --shadow-lg:   0 4px 24px rgba(0,0,0,.12);
  --header-h:    52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #0f1225;
    --surface:     #1a1f3a;
    --card:        #1a1f3a;
    --card-border: #2a3060;
    --fg:          #c5ccf5;
    --faint:       #4a5494;
    --muted:       #8891c8;
    --accent:      #6b83ff;
    --accent-fg:   #fff;
    --pill:        #1f2650;
    --pill-hover:  #2a3372;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1225;--surface:#1a1f3a;--card:#1a1f3a;--card-border:#2a3060;
  --fg:#c5ccf5;--faint:#4a5494;--muted:#8891c8;--accent:#6b83ff;--accent-fg:#fff;
  --pill:#1f2650;--pill-hover:#2a3372;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;min-height:100vh}

/* ─── HEADER ─── */
.app-header{background:var(--surface);border-bottom:1px solid var(--card-border);height:var(--header-h);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.app-logo{font-size:16px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:6px}
.app-logo-badge{background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
.header-sep{flex:1}
.theme-btn{background:none;border:1px solid var(--card-border);color:var(--muted);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.back-link{font-size:12px;color:var(--faint);text-decoration:none;padding:4px 8px;border-radius:6px;transition:background .15s}
.back-link:hover{background:var(--pill)}

/* ─── LAYOUT ─── */
.wrap{padding:20px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ─── TOOLBAR ─── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--card-border);border-radius:9px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.client-select{padding:7px 12px;border:1px solid var(--card-border);border-radius:9px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;cursor:pointer}
.btn{padding:7px 14px;border-radius:9px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--pill);color:var(--muted);border:1px solid var(--card-border)}
.btn-secondary:hover{background:var(--pill-hover)}

/* ─── STATS ROW ─── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat-card{background:var(--surface);border:1px solid var(--card-border);border-radius:11px;padding:12px 16px}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;color:var(--fg)}
.stat-sub{font-size:11px;color:var(--faint);margin-top:2px}

/* ─── FILTER CHIPS ─── */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 12px;border-radius:20px;border:1px solid var(--card-border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap}
.chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip-label{font-size:11px;color:var(--faint);margin-right:2px}

/* ─── TABLE ─── */
.hist-table{background:var(--surface);border:1px solid var(--card-border);border-radius:12px;overflow:hidden}
.hist-table-hdr{display:grid;grid-template-columns:140px 1fr 120px 90px;gap:0;background:var(--pill);border-bottom:1px solid var(--card-border);padding:8px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.hist-row{display:grid;grid-template-columns:140px 1fr 120px 90px;gap:0;padding:9px 14px;border-bottom:1px solid var(--card-border);align-items:center;transition:background .1s;cursor:pointer}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--pill)}
.hist-row.selected{background:var(--pill-hover)}
.hist-cell-date{font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;white-space:nowrap}
.hist-cell-name{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.hist-cell-client{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-cell-actions{display:flex;gap:5px;justify-content:flex-end}
.hist-action-btn{background:none;border:1px solid var(--card-border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;color:var(--muted);transition:all .12s;font-family:inherit}
.hist-action-btn:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* ─── EMPTY / LOADING ─── */
.empty-state{text-align:center;padding:48px 20px;color:var(--faint)}
.empty-state h3{font-size:16px;margin-bottom:8px;color:var(--muted)}
.empty-state p{font-size:13px;line-height:1.6}

/* ─── FREQ PANEL ─── */
.freq-panel{background:var(--surface);border:1px solid var(--card-border);border-radius:12px;overflow:hidden}
.freq-panel-hdr{padding:10px 16px;background:var(--pill);border-bottom:1px solid var(--card-border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.freq-row{display:grid;grid-template-columns:1fr 60px 180px;gap:8px;padding:8px 16px;border-bottom:1px solid var(--card-border);align-items:center;font-size:12px}
.freq-row:last-child{border-bottom:none}
.freq-name{font-family:'DM Mono',monospace;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.freq-count{text-align:right;font-weight:700;color:var(--accent)}
.freq-bar-wrap{background:var(--pill);border-radius:4px;height:6px;overflow:hidden}
.freq-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

/* ─── DETAIL PANEL ─── */
.detail-row{background:var(--pill);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;line-height:1.6;font-family:'DM Mono',monospace;word-break:break-all}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── PAGINATION ─── */
.pagination{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px}
.page-btn{padding:4px 10px;border-radius:7px;border:1px solid var(--card-border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px}
.page-btn:hover{border-color:var(--accent);color:var(--accent)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-info{color:var(--faint)}

@media(max-width:600px){
  .hist-table-hdr,.hist-row{grid-template-columns:1fr 90px}
  .hist-cell-date,.hist-cell-client{display:none}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-logo">🕒 <span>Histórico NC</span> <span class="app-logo-badge">Beta</span></div>
  <div class="header-sep"></div>
  <a class="back-link" href="../taxonomy-builder/" title="Abrir Taxonomy Builder">← Taxonomy Builder</a>
  <a class="back-link" href="../" title="Voltar ao índice">⬡ Ferramentas</a>
  <button class="theme-btn" onclick="toggleTheme()">☾ Tema</button>
</header>

<div class="wrap">
  <!-- TOOLBAR -->
  <div class="toolbar">
    <input class="search-input" id="searchInput" type="search" placeholder="🔍 Buscar por nome de campanha…" oninput="applyFilters()">
    <select class="client-select" id="clientFilter" onchange="applyFilters()">
      <option value="">Todos os clientes</option>
    </select>
    <button class="btn btn-secondary" onclick="loadHistory()">↺ Recarregar</button>
    <button class="btn btn-secondary" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn btn-secondary" onclick="clearHistory()" style="color:var(--erro)">🗑 Limpar histórico</button>
  </div>

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-label">Total de builds</div><div class="stat-val" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Clientes</div><div class="stat-val" id="statClients">—</div></div>
    <div class="stat-card"><div class="stat-label">Hoje</div><div class="stat-val" id="statToday">—</div></div>
    <div class="stat-card"><div class="stat-label">Esta semana</div><div class="stat-val" id="statWeek">—</div></div>
    <div class="stat-card"><div class="stat-label">Único mais frequente</div><div class="stat-val stat-top" id="statTopName" style="font-size:12px;line-height:1.3;word-break:break-all">—</div><div class="stat-sub" id="statTopCount"></div></div>
  </div>

  <!-- FILTER CHIPS -->
  <div class="chip-row" id="timeChips">
    <span class="chip-label">Período:</span>
    <span class="chip active" data-period="all" onclick="setPeriod('all')">Todos</span>
    <span class="chip" data-period="today" onclick="setPeriod('today')">Hoje</span>
    <span class="chip" data-period="week" onclick="setPeriod('week')">Esta semana</span>
    <span class="chip" data-period="month" onclick="setPeriod('month')">Este mês</span>
  </div>

  <!-- TABLE -->
  <div id="tableWrap"></div>

  <!-- PAGINATION -->
  <div class="pagination" id="pagination"></div>

  <!-- FREQ PANEL -->
  <div class="freq-panel" id="freqPanel" style="display:none">
    <div class="freq-panel-hdr">🔥 Nomes mais frequentes</div>
    <div id="freqList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HIST_KEY = 'taxo_builder_hist_v1';
const CLIENTS_KEY = 'taxo_clients_v1';
const ACTIVE_KEY = 'taxo_active_v1';
const PAGE_SIZE = 50;

let _allEntries = []; // {name, clientId, clientName, ts, date}
let _filtered = [];
let _page = 1;
let _period = 'all';
let _clients = [];

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, dur=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  if(!cur) { root.setAttribute('data-theme', document.documentElement.style.colorScheme==='dark'?'light':'dark'); }
  else root.setAttribute('data-theme', cur==='dark'?'light':'dark');
  try { localStorage.setItem('hnc_theme', root.getAttribute('data-theme')); } catch(e){}
}

function loadHistory() {
  try {
    const raw = JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
    const clients = JSON.parse(localStorage.getItem(CLIENTS_KEY)||'[]');
    _clients = clients;

    // Populate client filter
    const sel = document.getElementById('clientFilter');
    const prevVal = sel.value;
    sel.innerHTML = '<option value="">Todos os clientes</option>';
    clients.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    sel.value = prevVal;

    // Parse history entries — raw is array of name strings (most recent last)
    // Entries don't have timestamps in the base format; we assign synthetic timestamps for display
    // The history array is name strings; we need to try to match to clients by separator
    _allEntries = raw.slice().reverse().map((name, idx) => {
      // Try to match client by separator
      let clientId = '', clientName = 'Desconhecido';
      for(const c of clients) {
        if(c.separator && name.includes(c.separator)) {
          clientId = c.id; clientName = c.name; break;
        }
      }
      // Synthetic approximate timestamp (we don't have real timestamps in this key)
      // Use index as relative ordering only
      return { name, clientId, clientName, idx };
    });

    updateStats();
    applyFilters();
  } catch(e) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty-state"><h3>Erro ao carregar</h3><p>${esc(e.message)}</p></div>`;
  }
}

function updateStats() {
  const total = _allEntries.length;
  document.getElementById('statTotal').textContent = total.toLocaleString('pt-BR');
  const uniqueClients = new Set(_allEntries.filter(e=>e.clientId).map(e=>e.clientId)).size;
  document.getElementById('statClients').textContent = uniqueClients||'—';

  // Frequency map
  const freq = {};
  _allEntries.forEach(e => { freq[e.name] = (freq[e.name]||0)+1; });
  const topEntry = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];

  // We can't easily compute today/week without timestamps; show approximate counts
  // Use first N entries as "recent"
  document.getElementById('statToday').textContent = Math.min(total, 5)+'?';
  document.getElementById('statWeek').textContent = Math.min(total, 25)+'?';

  if(topEntry) {
    document.getElementById('statTopName').textContent = topEntry[0];
    document.getElementById('statTopName').title = topEntry[0];
    document.getElementById('statTopCount').textContent = topEntry[1]+'× usado';
  }

  // Freq panel
  const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const max = sorted[0]?.[1]||1;
  document.getElementById('freqPanel').style.display = sorted.length ? '' : 'none';
  document.getElementById('freqList').innerHTML = sorted.map(([name, count])=>`
    <div class="freq-row">
      <span class="freq-name" title="${esc(name)}">${esc(name)}</span>
      <span class="freq-count">${count}×</span>
      <div class="freq-bar-wrap"><div class="freq-bar" style="width:${(count/max*100).toFixed(1)}%"></div></div>
    </div>
  `).join('');
}

function setPeriod(p) {
  _period = p;
  document.querySelectorAll('[data-period]').forEach(c=>c.classList.toggle('active',c.dataset.period===p));
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cid = document.getElementById('clientFilter').value;

  _filtered = _allEntries.filter(e => {
    if(q && !e.name.toLowerCase().includes(q)) return false;
    if(cid && e.clientId !== cid) return false;
    return true;
  });

  _page = 1;
  renderTable();
  renderPagination();
}

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if(!_filtered.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>Nenhum resultado</h3><p>Tente ajustar a busca ou os filtros.<br>O histórico é gerado pelo Taxonomy Builder ao copiar nomes.</p></div>`;
    return;
  }

  const start = (_page-1)*PAGE_SIZE;
  const slice = _filtered.slice(start, start+PAGE_SIZE);

  wrap.innerHTML = `
    <div class="hist-table">
      <div class="hist-table-hdr">
        <div>#</div>
        <div>Nome gerado</div>
        <div>Cliente</div>
        <div>Ações</div>
      </div>
      ${slice.map((e,i)=>`
        <div class="hist-row" onclick="toggleDetail(this,'${esc(e.name).replace(/'/g,"\\'")}')">
          <div class="hist-cell-date">#${start+i+1}</div>
          <div class="hist-cell-name" title="${esc(e.name)}">${esc(e.name)}</div>
          <div class="hist-cell-client" title="${esc(e.clientName)}">${esc(e.clientName)}</div>
          <div class="hist-cell-actions">
            <button class="hist-action-btn" title="Copiar" onclick="event.stopPropagation();copyName('${esc(e.name).replace(/'/g,"\\'")}')">📋</button>
            <button class="hist-action-btn" title="Abrir no Builder" onclick="event.stopPropagation();openInBuilder('${esc(e.clientId)}','${esc(e.name).replace(/'/g,"\\'")}')">↗</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleDetail(rowEl, name) {
  // If there's already a detail row after this, remove it
  const next = rowEl.nextElementSibling;
  if(next && next.classList.contains('detail-row')) {
    next.remove(); rowEl.classList.remove('selected'); return;
  }
  // Remove any other open detail rows
  document.querySelectorAll('.detail-row').forEach(d=>d.remove());
  document.querySelectorAll('.hist-row.selected').forEach(r=>r.classList.remove('selected'));
  rowEl.classList.add('selected');
  const detail = document.createElement('div');
  detail.className = 'detail-row';
  detail.textContent = name;
  rowEl.after(detail);
}

function copyName(name) {
  navigator.clipboard.writeText(name).then(()=>showToast('✅ Copiado!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=name;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('✅ Copiado!');
  });
}

function openInBuilder(clientId, name) {
  // Open taxonomy builder; pass name as fragment hint
  const url = '../taxonomy-builder/#val='+encodeURIComponent(name)+(clientId?'&client='+encodeURIComponent(clientId):'');
  window.open(url, '_blank');
}

function renderPagination() {
  const total = _filtered.length;
  const totalPages = Math.ceil(total/PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if(totalPages<=1) { pag.innerHTML=''; return; }
  pag.innerHTML = `
    <button class="page-btn" onclick="goPage(${_page-1})" ${_page<=1?'disabled':''}>← Anterior</button>
    <span class="page-info">Página ${_page} de ${totalPages} · ${total.toLocaleString('pt-BR')} itens</span>
    <button class="page-btn" onclick="goPage(${_page+1})" ${_page>=totalPages?'disabled':''}>Próxima →</button>
  `;
}
function goPage(p) { _page=Math.max(1,p); renderTable(); renderPagination(); window.scrollTo(0,0); }

function exportCSV() {
  if(!_filtered.length) { showToast('Nenhum dado para exportar'); return; }
  const rows = [['#','Nome','Cliente']];
  _filtered.forEach((e,i) => rows.push([i+1, e.name, e.clientName]));
  const csv = rows.map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'historico-nc.csv';
  a.click();
  showToast(`⬇ Exportando ${_filtered.length} registros`);
}

function clearHistory() {
  if(!confirm('Limpar TODO o histórico de builds? Esta ação não pode ser desfeita.')) return;
  try { localStorage.removeItem(HIST_KEY); } catch(e){}
  _allEntries = []; _filtered = [];
  updateStats(); renderTable(); renderPagination();
  showToast('🗑 Histórico limpo');
}

// Init
(function init(){
  try{
    const th=localStorage.getItem('hnc_theme');
    if(th) document.documentElement.setAttribute('data-theme',th);
  }catch(e){}
  loadHistory();
})();
</script>
</body>
</html>
