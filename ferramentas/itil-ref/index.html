<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITIL 4 — Referência</title>
<style>
  :root {
    --azul: #1F36C7;
    --azul-escuro: #1a237e;
    --azul-light: #e8ecfd;
    --cinza: #0f1117;
    --borda: #2e3248;
    --text: #e8eaf0;
    --text-muted: #8890aa;
    --white: #1a1d27;
    --cat-svs: #1F36C7;
    --cat-svs-bg: #e8ecfd;
    --cat-practices: #7c3aed;
    --cat-practices-bg: #f3f0ff;
    --cat-metrics: #d97706;
    --cat-metrics-bg: #fffbeb;
    --cat-roles: #059669;
    --cat-roles-bg: #ecfdf5;
    --cat-concepts: #94a3b8;
    --cat-concepts-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cinza); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 100%);
    color: #fff; padding: 28px 40px 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

  .search-wrap { background: var(--azul-escuro); padding: 0 40px 28px; }
  .search-box { position: relative; max-width: 700px; }
  .search-box input {
    width: 100%; padding: 14px 20px 14px 48px; font-size: 1rem;
    border: none; border-radius: 10px; outline: none;
    background: rgba(255,255,255,0.12); color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.6); font-size: 1.1rem; pointer-events: none;
  }

  .filters-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 14px 40px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px;
    border-radius: 20px; border: 1.5px solid var(--borda);
    background: var(--white); color: var(--text-muted);
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--azul); color: var(--azul); }
  .filter-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .filter-btn[data-cat="svs"].active      { background: var(--cat-svs);       border-color: var(--cat-svs); }
  .filter-btn[data-cat="practices"].active{ background: var(--cat-practices);  border-color: var(--cat-practices); }
  .filter-btn[data-cat="metrics"].active  { background: var(--cat-metrics);    border-color: var(--cat-metrics); }
  .filter-btn[data-cat="roles"].active    { background: var(--cat-roles);      border-color: var(--cat-roles); }
  .filter-btn[data-cat="concepts"].active { background: var(--cat-concepts);   border-color: var(--cat-concepts); }
  .filters-right { margin-left: auto; font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }

  .az-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 8px 40px; display: flex; gap: 3px; flex-wrap: wrap;
  }
  .az-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    color: var(--azul); transition: all 0.15s; background: none; border: none; text-decoration: none;
  }
  .az-btn:hover { background: var(--azul-light); }
  .az-btn.disabled { color: var(--borda); cursor: default; }
  .az-btn.disabled:hover { background: none; }

  .content { padding: 30px 40px 60px; }
  .letter-section { margin-bottom: 36px; }
  .letter-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .letter-heading h2 { font-size: 1.6rem; font-weight: 800; color: var(--azul-escuro); min-width: 36px; }
  .letter-heading hr { flex: 1; border: none; border-top: 2px solid var(--borda); }
  .terms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .term-card {
    background: var(--white); border: 1.5px solid var(--borda);
    border-radius: 10px; padding: 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.35); border-color: #3d4a7a; }
  .term-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .term-name { font-size: 0.97rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .term-acronym {
    font-size: 0.78rem; font-weight: 600; color: var(--azul);
    background: var(--azul-light); padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .term-def { font-size: 0.85rem; color: #c8ccd8; line-height: 1.55; margin-bottom: 8px; }
  .term-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
    border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
  }
  .cat-svs       { color: var(--cat-svs);       background: var(--cat-svs-bg); }
  .cat-practices { color: var(--cat-practices);  background: var(--cat-practices-bg); }
  .cat-metrics   { color: var(--cat-metrics);    background: var(--cat-metrics-bg); }
  .cat-roles     { color: var(--cat-roles);      background: var(--cat-roles-bg); }
  .cat-concepts  { color: var(--cat-concepts);   background: var(--cat-concepts-bg); }
  .term-aka { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div style="background:#1a1d27;border-bottom:1px solid #2e3248;padding:.55rem 1.5rem;font-size:.8rem;color:#8890aa"><a href="../governanca-ti/" style="color:#1F36C7;text-decoration:none;font-weight:600">← Hub de Governança de TI</a></div>
<header>
  <h1>⚙️ ITIL 4 — Referência</h1>
  <p>Service Value System, práticas de gestão de serviço, métricas, papéis e conceitos fundamentais</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar termo, prática ou sigla…" autocomplete="off">
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="svs">🔵 SVS / Framework</button>
  <button class="filter-btn" data-cat="practices">🟣 Práticas</button>
  <button class="filter-btn" data-cat="metrics">🟠 Métricas &amp; SLA</button>
  <button class="filter-btn" data-cat="roles">🟢 Papéis</button>
  <button class="filter-btn" data-cat="concepts">⚫ Conceitos</button>
  <div class="filters-right" id="countDisplay"></div>
</div>

<div class="az-bar" id="azBar"></div>
<div class="content" id="content"></div>

<script>
const TERMS = [
  // SVS / FRAMEWORK
  { name: "4 Dimensões", acronym: "", cat: "svs", def: "As quatro perspectivas que toda organização deve considerar para gerenciar serviços de TI de forma holística: Organizações e Pessoas; Informação e Tecnologia; Parceiros e Fornecedores; Fluxos de Valor e Processos.", aka: "Four Dimensions" },
  { name: "Cadeia de Valor de Serviço", acronym: "SVC", cat: "svs", def: "Conjunto de seis atividades interconectadas no SVS: Planejar, Melhorar, Engajar, Projetar e Transformar, Obter/Construir, Entregar e Suportar. Cada serviço passa por uma combinação dessas atividades.", aka: "Service Value Chain" },
  { name: "Continual Improvement", acronym: "", cat: "svs", def: "Uma das práticas centrais do ITIL 4 e atividade presente em toda a Cadeia de Valor. Baseia-se no modelo ITIL Continual Improvement Model de 7 passos: What is the vision? → Where are we now? → Where do we want to be? → How do we get there? → Take action → Did we get there? → How do we keep the momentum?", aka: "Melhoria Contínua" },
  { name: "Guiding Principles", acronym: "", cat: "svs", def: "Sete princípios orientadores que guiam decisões e ações no ITIL 4: Foque no valor; Comece onde você está; Progrida iterativamente com feedback; Colabore e promova visibilidade; Pense e trabalhe holisticamente; Mantenha a simplicidade e praticidade; Otimize e automatize.", aka: "Princípios Orientadores" },
  { name: "ITIL 4", acronym: "Information Technology Infrastructure Library", cat: "svs", def: "Framework de melhores práticas para gestão de serviços de TI (ITSM), publicado pelo AXELOS. A versão 4 (2019) introduz o Service Value System, 34 práticas e alinhamento com Agile, DevOps e Lean.", aka: "" },
  { name: "Service Value System", acronym: "SVS", cat: "svs", def: "Modelo do ITIL 4 que descreve como todos os componentes e atividades de uma organização trabalham juntos para criar valor. Composto por: Princípios Orientadores, Governança, Cadeia de Valor, Práticas e Melhoria Contínua.", aka: "SVS" },

  // PRÁTICAS
  { name: "Change Enablement", acronym: "", cat: "practices", def: "Prática de maximizar o número de mudanças bem-sucedidas, avaliando riscos, autorizando e garantindo que a Cadeia de Valor de Serviço trate mudanças de forma adequada. Classifica mudanças em Standard, Normal e Emergency.", aka: "Gestão de Mudanças" },
  { name: "Configuration Management", acronym: "CMDB", cat: "practices", def: "Prática de garantir que informações precisas e confiáveis sobre a configuração de serviços e os itens de configuração (CIs) que os suportam estejam disponíveis quando necessário.", aka: "CMDB — Configuration Management Database" },
  { name: "Event Management", acronym: "", cat: "practices", def: "Prática de observar sistematicamente serviços e CIs e registrar e relatar mudanças de estado com significado para o gerenciamento de serviços. Eventos podem ser informativos, alertas ou exceções.", aka: "Gestão de Eventos" },
  { name: "Incident Management", acronym: "", cat: "practices", def: "Prática de minimizar o impacto negativo de incidentes restaurando a operação normal do serviço o mais rápido possível. Um incidente é uma interrupção não planejada ou redução na qualidade de um serviço.", aka: "Gestão de Incidentes" },
  { name: "IT Asset Management", acronym: "ITAM", cat: "practices", def: "Prática de planejar e gerenciar todo o ciclo de vida de ativos de TI, maximizando valor, controlando custos e suportando decisões de compra, reutilização e descarte.", aka: "ITAM" },
  { name: "Monitoramento e Gestão de Eventos", acronym: "", cat: "practices", def: "Prática que permite observar sistematicamente serviços e CIs para detectar e relatar condições relevantes. Inclui monitoramento ativo (polling) e passivo (traps/logs). Base para operações proativas.", aka: "Monitoring and Event Management" },
  { name: "Problem Management", acronym: "", cat: "practices", def: "Prática de reduzir a probabilidade e o impacto de incidentes identificando causas reais e potenciais, gerenciando workarounds e erros conhecidos. Atua em três fases: identificação, controle de problemas e controle de erros.", aka: "Gestão de Problemas" },
  { name: "Release Management", acronym: "", cat: "practices", def: "Prática de tornar serviços e recursos novos e modificados disponíveis para uso. Coordena o planejamento, agendamento e implementação de releases em produção.", aka: "Gestão de Releases" },
  { name: "Request Fulfillment", acronym: "", cat: "practices", def: "Prática de suportar a qualidade acordada de um serviço tratando todas as requisições de serviço pré-aprovadas de forma eficiente e amigável. Inclui solicitações de informação, acesso e mudanças padrão.", aka: "Gestão de Requisições de Serviço" },
  { name: "Service Catalog Management", acronym: "", cat: "practices", def: "Prática de fornecer uma fonte única e consistente de informações sobre todos os serviços e ofertas de serviço disponíveis para usuários e clientes.", aka: "Gestão do Catálogo de Serviços" },
  { name: "Service Continuity Management", acronym: "ITSCM", cat: "practices", def: "Prática de garantir que a disponibilidade e o desempenho de um serviço sejam mantidos em níveis adequados no caso de desastre. Inclui planos de continuidade e recuperação.", aka: "ITSCM" },
  { name: "Service Design", acronym: "", cat: "practices", def: "Prática de projetar produtos e serviços que sejam adequados para o propósito, adequados para o uso e que possam ser entregues pela organização e seus ecossistemas de parceiros.", aka: "Projeto de Serviço" },
  { name: "Service Desk", acronym: "", cat: "practices", def: "Prática de capturar demandas de suporte e resolução de incidentes, sendo o ponto único de contato (SPOC) entre a organização de TI e usuários. Registra, prioriza e acompanha todos os contatos.", aka: "Ponto Único de Contato, SPOC" },
  { name: "Service Level Management", acronym: "SLM", cat: "practices", def: "Prática de estabelecer metas claras de nível de serviço baseadas em negócio, garantindo que a entrega de serviços seja corretamente avaliada, monitorada e gerenciada em relação a essas metas.", aka: "SLM, Gestão de Níveis de Serviço" },

  // MÉTRICAS E SLA
  { name: "Availability", acronym: "", cat: "metrics", def: "Capacidade de um serviço ou componente de executar uma função requerida em determinado momento ou período de tempo. Medida como: (Tempo acordado − Tempo de downtime) / Tempo acordado × 100%.", aka: "Disponibilidade" },
  { name: "Backlog", acronym: "", cat: "metrics", def: "Lista priorizada de incidentes, requisições ou tarefas pendentes de resolução. Usado para gestão de capacidade da equipe e visibilidade do volume de trabalho represado.", aka: "" },
  { name: "MTBF", acronym: "Mean Time Between Failures", cat: "metrics", def: "Tempo médio entre falhas de um serviço ou componente. Mede confiabilidade: quanto maior o MTBF, mais confiável é o serviço. Usado para planejar manutenção preventiva.", aka: "Tempo médio entre falhas" },
  { name: "MTRS", acronym: "Mean Time to Restore Service", cat: "metrics", def: "Tempo médio para restaurar um serviço após uma falha. Foco em restabelecimento do serviço (não necessariamente resolução da causa raiz). Equivalente ao MTTR em muitos contextos.", aka: "MTTR — Mean Time to Restore/Repair/Resolve" },
  { name: "OLA", acronym: "Operational Level Agreement", cat: "metrics", def: "Acordo entre grupos internos de TI que suportam um SLA. Define responsabilidades e metas de desempenho entre equipes internas (ex: equipe de redes se compromete a restaurar links em X horas).", aka: "Acordo de Nível Operacional" },
  { name: "SLA", acronym: "Service Level Agreement", cat: "metrics", def: "Acordo documentado entre um provedor de serviços e um cliente que identifica os serviços e define metas de nível de serviço. Inclui disponibilidade, desempenho, suporte e penalidades.", aka: "Acordo de Nível de Serviço" },
  { name: "SLO", acronym: "Service Level Objective", cat: "metrics", def: "Meta específica e mensurável dentro de um SLA. Ex: 'Incidentes P1 serão resolvidos em até 4 horas.' Os SLOs são os compromissos concretos que compõem o SLA.", aka: "Objetivo de Nível de Serviço" },
  { name: "Time to Detect", acronym: "TTD", cat: "metrics", def: "Tempo entre a ocorrência de um incidente ou problema e sua detecção pela organização. Reduzir TTD é objetivo chave do monitoramento proativo.", aka: "TTD" },
  { name: "Time to Resolve", acronym: "TTR", cat: "metrics", def: "Tempo total entre o registro de um incidente ou requisição e sua resolução completa, dentro dos parâmetros de SLA acordados.", aka: "TTR, Tempo de resolução" },
  { name: "UC", acronym: "Underpinning Contract", cat: "metrics", def: "Contrato entre um provedor de serviços de TI e um fornecedor externo, estabelecendo metas de serviço que suportam a entrega de um SLA ao cliente final.", aka: "Contrato de apoio" },

  // PAPÉIS
  { name: "Change Authority", acronym: "", cat: "roles", def: "Pessoa ou grupo com autoridade para aprovar um tipo específico de mudança. Em ITIL 4 substitui o conceito de CAB (Change Advisory Board) para mudanças mais ágeis, mantendo o CAB para mudanças complexas.", aka: "Change Advisory Board, CAB" },
  { name: "Incident Manager", acronym: "", cat: "roles", def: "Responsável por gerenciar o ciclo de vida de todos os incidentes, garantindo que sejam resolvidos dentro dos SLAs acordados. Coordena equipes de suporte e comunica status às partes interessadas.", aka: "Gerente de Incidentes" },
  { name: "Problem Manager", acronym: "", cat: "roles", def: "Responsável por identificar e gerenciar problemas (causas raízes de incidentes), coordenar investigações, documentar erros conhecidos e garantir que workarounds estejam disponíveis.", aka: "Gerente de Problemas" },
  { name: "Service Owner", acronym: "", cat: "roles", def: "Responsável pelo desempenho e resultado de um serviço específico do ponto de vista do cliente, atuando como ponto de escalonamento e representante do serviço em reuniões de negócio.", aka: "Dono do Serviço" },
  { name: "Service Request Analyst", acronym: "", cat: "roles", def: "Profissional responsável por receber, registrar, classificar e atender requisições de serviço dos usuários, garantindo que sejam cumpridas dentro dos SLAs e catálogo estabelecidos.", aka: "Analista de Suporte N1/N2" },

  // CONCEITOS
  { name: "Change Standard", acronym: "", cat: "concepts", def: "Tipo de mudança pré-aprovada, de baixo risco, frequente e bem compreendida. Segue um procedimento documentado e não precisa de aprovação adicional a cada execução. Ex: reset de senha, instalação de software padrão.", aka: "Mudança padrão" },
  { name: "Configuration Item", acronym: "CI", cat: "concepts", def: "Qualquer componente que precise ser gerenciado para entregar um serviço de TI: hardware, software, documentação, servidores, contratos. Registrado e gerenciado no CMDB.", aka: "Item de Configuração, CI" },
  { name: "Erro Conhecido", acronym: "", cat: "concepts", def: "Problema para o qual a causa raiz foi determinada e um workaround documentado. Registrado no banco de erros conhecidos (KEDB) para acelerar resolução de incidentes futuros.", aka: "Known Error, KEDB" },
  { name: "Escalation", acronym: "", cat: "concepts", def: "Transferência de um incidente, requisição ou problema para um nível superior de suporte (funcional) ou de autoridade (hierárquica) quando o nível atual não consegue resolvê-lo dentro do SLA.", aka: "Escalonamento" },
  { name: "Incidente", acronym: "", cat: "concepts", def: "Interrupção não planejada de um serviço de TI ou redução na qualidade de um serviço de TI. Deve ser registrado, classificado por prioridade e resolvido dentro do SLA.", aka: "" },
  { name: "Prioritization Matrix", acronym: "", cat: "concepts", def: "Combinação de Urgência × Impacto para determinar a prioridade de incidentes e requisições. Exemplo: P1 = Crítico (impacto alto + urgência alta); P4 = Baixo (impacto baixo + urgência baixa).", aka: "Matriz de Priorização" },
  { name: "Problema", acronym: "", cat: "concepts", def: "Causa ou causa potencial de um ou mais incidentes. Diferente do incidente: o incidente é a interrupção; o problema é a causa raiz a ser eliminada para evitar recorrência.", aka: "" },
  { name: "RCA", acronym: "Root Cause Analysis", cat: "concepts", def: "Processo estruturado para identificar a causa fundamental de um problema ou incidente. Técnicas comuns: 5 Porquês, Diagrama de Ishikawa (espinha de peixe), Árvore de Falhas.", aka: "Análise de Causa Raiz" },
  { name: "Valor", acronym: "", cat: "concepts", def: "Conceito central do ITIL 4: um serviço tem valor quando gera Resultados desejados pelo cliente, habilitando esses resultados sem custos e riscos indesejados. Valor = Utilidade + Garantia.", aka: "Value (Utility + Warranty)" },
  { name: "Workaround", acronym: "", cat: "concepts", def: "Solução temporária para reduzir ou eliminar o impacto de um incidente ou problema para o qual uma solução permanente ainda não está disponível. Documentado para uso imediato em casos recorrentes.", aka: "Contorno, Solução temporária" },

  // PRÁTICAS ADICIONAIS
  { name: "Deployment Management", acronym: "", cat: "practices", def: "Prática ITIL 4 responsável por mover hardware, software, documentação e componentes para ambientes de produção ou outros ambientes. Distinto de Release Management: deployment é o ato técnico de mover; release é tornar disponível ao usuário.", aka: "Gestão de Implantação" },
  { name: "IT Asset Management", acronym: "ITAM", cat: "practices", def: "Prática ITIL 4 de planejar e gerenciar todo o ciclo de vida dos ativos de TI para maximizar valor, controlar custos, gerenciar riscos e garantir conformidade com requisitos regulatórios.", aka: "Gestão de Ativos de TI" },
  { name: "Knowledge Management", acronym: "KM", cat: "practices", def: "Prática ITIL 4 de manter e melhorar o uso eficaz da informação e do conhecimento em toda a organização. Base para o SKMS (Service Knowledge Management System) e para redução de esforço repetido em suporte.", aka: "Gestão do Conhecimento" },
  { name: "Monitoring and Event Management", acronym: "MEM", cat: "practices", def: "Prática ITIL 4 de observar sistematicamente serviços e componentes de infraestrutura, além de registrar e relatar mudanças de estado selecionadas (eventos). Fundação para operações proativas e detecção antecipada de incidentes.", aka: "Gestão de Eventos" },
  { name: "Release Management", acronym: "", cat: "practices", def: "Prática ITIL 4 de tornar serviços e funcionalidades novos ou alterados disponíveis para uso. Coordena os aspectos técnicos e de negócio de uma release, trabalhando em conjunto com Change Enablement e Deployment Management.", aka: "Gestão de Releases" }
];

TERMS.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const CAT_LABELS = {
  svs: "🔵 SVS / Framework",
  practices: "🟣 Práticas",
  metrics: "🟠 Métricas & SLA",
  roles: "🟢 Papéis",
  concepts: "⚫ Conceitos"
};

let currentCat = "all";
let currentSearch = "";

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === "all" || t.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.acronym.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.aka.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const content = document.getElementById("content");
  const countDisplay = document.getElementById("countDisplay");
  countDisplay.textContent = `${filtered.length} de ${TERMS.length} termos`;

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum termo encontrado</h3><p>Tente buscar por outra palavra ou limpe os filtros.</p></div>`;
    return;
  }

  const byLetter = {};
  filtered.forEach(t => {
    const letter = t.name[0].toUpperCase();
    if (!byLetter[letter]) byLetter[letter] = [];
    byLetter[letter].push(t);
  });

  let html = "";
  Object.keys(byLetter).sort().forEach(letter => {
    html += `<div class="letter-section" id="letter-${letter}">
      <div class="letter-heading"><h2>${letter}</h2><hr></div>
      <div class="terms-grid">`;
    byLetter[letter].forEach(t => {
      html += `<div class="term-card">
        <div class="term-header">
          <div class="term-name">${t.name}</div>
          ${t.acronym ? `<div class="term-acronym">${t.acronym}</div>` : ""}
        </div>
        <div class="term-def">${t.def}</div>
        <div class="term-footer">
          <span class="cat-tag cat-${t.cat}">${CAT_LABELS[t.cat]}</span>
          ${t.aka ? `<span class="term-aka">Tb. conhecido como: ${t.aka}</span>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter) {
  const bar = document.getElementById("azBar");
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  bar.innerHTML = all.map(l => {
    if (byLetter && byLetter[l]) return `<a class="az-btn" href="#letter-${l}">${l}</a>`;
    return `<span class="az-btn disabled">${l}</span>`;
  }).join("");
}

updateAZBar(null);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
