<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NC Glossário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--card:#fff;--border:#e4e4e7;
  --fg:#18181b;--muted:#71717a;--mono:'JetBrains Mono',monospace;
  --accent:#8b5cf6;--accent-fg:#fff;--accent-light:#ede9fe;
  --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#2e1065;
}}
:root[data-theme="dark"]{
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#2e1065;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;padding:0 0 60px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700;flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-primary:hover{opacity:.88}
.btn-sm{padding:5px 10px;font-size:11px}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}
@media(max-width:700px){.layout{grid-template-columns:1fr}}

/* Sidebar */
.sidebar{position:sticky;top:65px;height:max-content}
.sidebar-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.seg-nav{display:flex;flex-direction:column;gap:4px}
.seg-btn{padding:8px 12px;border-radius:8px;text-align:left;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;display:flex;align-items:center;justify-content:space-between}
.seg-btn:hover{background:var(--border);color:var(--fg)}
.seg-btn.active{background:var(--accent-light);color:var(--accent)}
.seg-count{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--border);color:var(--muted)}
.seg-btn.active .seg-count{background:var(--accent);color:#fff}

/* search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:14px}

/* section */
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-title{font-size:16px;font-weight:800}
.add-btn{margin-left:auto}

/* term cards */
.terms-grid{display:flex;flex-direction:column;gap:10px}
.term-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:.15s}
.term-card:hover{border-color:var(--accent)}
.term-head{display:flex;align-items:flex-start;gap:10px}
.term-value{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);flex:1;word-break:break-all}
.term-label{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.term-actions{display:flex;gap:5px;flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;padding:3px 8px;transition:.12s}
.icon-btn:hover{background:var(--border);color:var(--fg)}
.term-desc{font-size:12px;line-height:1.6;color:var(--fg);margin-top:8px}
.term-ex{margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--muted);border-left:3px solid var(--accent)}
.term-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:var(--accent-light);color:var(--accent)}
.term-meta{font-size:10px;color:var(--muted);margin-top:8px}

.empty-seg{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.empty-seg .eicon{font-size:32px;margin-bottom:8px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:14px;padding:22px 24px;width:min(520px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal h2{font-size:15px;font-weight:800;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;transition:.15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{min-height:70px;resize:vertical;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* seg modal */
.seg-modal-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.seg-row{display:flex;align-items:center;gap:8px}
.seg-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12px;font-family:var(--mono);font-weight:600}
.seg-del-btn{background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 8px}
.seg-del-btn:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#18181b;color:#fff;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:600;transition:.25s;opacity:0;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <span style="font-size:18px">📖</span>
  <h1>NC Glossário</h1>
  <button class="btn" onclick="openSegModal()">⚙ Segmentos</button>
  <button class="btn" onclick="exportJSON()">↓ JSON</button>
  <button class="btn btn-primary" onclick="openTermModal(null)">+ Termo</button>
  <button class="btn" id="themeBtn" onclick="toggleTheme()">◑</button>
</header>

<div class="wrap">
  <div class="search-wrap" style="margin-bottom:20px">
    <span class="search-icon">🔍</span>
    <input id="globalSearch" type="text" placeholder="Buscar em todos os segmentos…" oninput="renderAll()">
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Segmentos</div>
      <div class="seg-nav" id="segNav"></div>
    </aside>
    <main>
      <div id="mainArea"></div>
    </main>
  </div>
</div>

<!-- Term modal -->
<div class="modal-bg" id="termModal" onclick="if(event.target===this)closeTermModal()">
  <div class="modal">
    <h2 id="termModalTitle">Novo Termo</h2>
    <div class="form-group">
      <label>Segmento</label>
      <select id="fSeg"></select>
    </div>
    <div class="form-group">
      <label>Valor (NC value)</label>
      <input id="fVal" type="text" placeholder="ex: brand_x">
    </div>
    <div class="form-group">
      <label>Label legível</label>
      <input id="fLabel" type="text" placeholder="ex: Marca X">
    </div>
    <div class="form-group">
      <label>Definição</label>
      <textarea id="fDesc" placeholder="O que este valor representa e quando deve ser usado?"></textarea>
    </div>
    <div class="form-group">
      <label>Exemplo de NC</label>
      <input id="fEx" type="text" placeholder="ex: camp_brand_x_q1_social">
    </div>
    <div class="form-group">
      <label>Tags (vírgula)</label>
      <input id="fTags" type="text" placeholder="ex: pago, awareness">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeTermModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTerm()">Salvar</button>
    </div>
  </div>
</div>

<!-- Seg modal -->
<div class="modal-bg" id="segModal" onclick="if(event.target===this)closeSegModal()">
  <div class="modal">
    <h2>Gerenciar Segmentos</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Os segmentos organizam os termos do glossário por categoria NC.</p>
    <div class="seg-modal-list" id="segModalList"></div>
    <button class="btn btn-sm" onclick="addSegRow()">+ Adicionar segmento</button>
    <div class="modal-actions">
      <button class="btn" onclick="closeSegModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSegs()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='nc_glossary_v1';
const THEME_KEY='ncglos_theme';
let _data={segs:[],terms:[]};
let _activeSeg=null;
let _editIdx=null;

// ── Storage ──────────────────────────────────────────────────────────────
function load(){
  try{const s=localStorage.getItem(KEY);if(s)_data=JSON.parse(s);}catch(e){}
  if(!_data.segs) _data.segs=[];
  if(!_data.terms) _data.terms=[];
  if(!_data.segs.length){
    _data.segs=['canal','objetivo','produto','formato','audiencia','periodo'];
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(_data));}catch(e){}}

// ── Theme ────────────────────────────────────────────────────────────────
function initTheme(){
  const t=localStorage.getItem(THEME_KEY)||'system';
  if(t!=='system') document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(THEME_KEY,next);
}

// ── Render ───────────────────────────────────────────────────────────────
function renderNav(){
  const q=(document.getElementById('globalSearch').value||'').toLowerCase();
  const nav=document.getElementById('segNav');
  nav.innerHTML=_data.segs.map(seg=>{
    const count=_data.terms.filter(t=>t.seg===seg&&(!q||(t.val+t.label+t.desc+t.ex+(t.tags||'')).toLowerCase().includes(q))).length;
    const active=(!q&&_activeSeg===seg)||(q&&count>0&&(_activeSeg===seg||_activeSeg===null));
    return `<button class="seg-btn${active?' active':''}" onclick="setActiveSeg('${esc(seg)}')">
      <span>${esc(seg)}</span>
      <span class="seg-count">${count}</span>
    </button>`;
  }).join('');
  if(_data.segs.length&&_activeSeg===null) {
    _activeSeg=_data.segs[0];
    renderNav();
  }
}

function renderMain(){
  const q=(document.getElementById('globalSearch').value||'').toLowerCase();
  const area=document.getElementById('mainArea');
  if(!_data.segs.length){
    area.innerHTML=`<div class="empty-seg"><div class="eicon">📖</div><p>Nenhum segmento ainda.</p><p style="margin-top:4px">Clique em <strong>⚙ Segmentos</strong> para criar.</p></div>`;
    return;
  }

  const segsToShow=q?_data.segs:(_activeSeg?[_activeSeg]:_data.segs);
  area.innerHTML=segsToShow.map(seg=>{
    let terms=_data.terms.filter(t=>t.seg===seg);
    if(q) terms=terms.filter(t=>(t.val+t.label+t.desc+t.ex+(t.tags||'')).toLowerCase().includes(q));
    return `<div class="section" id="sec-${esc(seg)}" style="margin-bottom:28px">
      <div class="section-header">
        <div class="section-title">📌 ${esc(seg)}</div>
        <button class="btn btn-sm add-btn" onclick="openTermModal('${esc(seg)}')">+ Termo</button>
      </div>
      <div class="terms-grid">${terms.length?terms.map((t,i)=>termHtml(t,_data.terms.indexOf(t))).join(''):`<div class="empty-seg" style="padding:24px"><div class="eicon" style="font-size:22px">📂</div><p style="font-size:12px">Nenhum termo neste segmento.</p></div>`}</div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderNav();
  renderMain();
}

function termHtml(t,idx){
  const tags=(t.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  return `<div class="term-card">
    <div class="term-head">
      <div>
        <div class="term-value">${esc(t.val)}</div>
        ${t.label?`<div class="term-label">${esc(t.label)}</div>`:''}
      </div>
      <div class="term-actions">
        <button class="icon-btn" title="Copiar valor" onclick="copyVal('${esc(t.val)}')">⎘</button>
        <button class="icon-btn" title="Editar" onclick="openTermModal(null,${idx})">✎</button>
        <button class="icon-btn" title="Remover" onclick="deleteTerm(${idx})">✕</button>
      </div>
    </div>
    ${t.desc?`<div class="term-desc">${esc(t.desc)}</div>`:''}
    ${t.ex?`<div class="term-ex">${esc(t.ex)}</div>`:''}
    ${tags.length?`<div class="term-tags">${tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join('')}</div>`:''}
    <div class="term-meta">Atualizado ${t.updated||t.created||'—'}</div>
  </div>`;
}

function setActiveSeg(seg){
  _activeSeg=seg;
  document.getElementById('globalSearch').value='';
  renderAll();
}

// ── Term CRUD ────────────────────────────────────────────────────────────
function openTermModal(seg,idx){
  _editIdx=idx??null;
  document.getElementById('termModalTitle').textContent=_editIdx===null?'Novo Termo':'Editar Termo';
  const selSeg=document.getElementById('fSeg');
  selSeg.innerHTML=_data.segs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if(seg) selSeg.value=seg;
  else if(_activeSeg) selSeg.value=_activeSeg;

  if(_editIdx!==null){
    const t=_data.terms[_editIdx];
    selSeg.value=t.seg;
    document.getElementById('fVal').value=t.val||'';
    document.getElementById('fLabel').value=t.label||'';
    document.getElementById('fDesc').value=t.desc||'';
    document.getElementById('fEx').value=t.ex||'';
    document.getElementById('fTags').value=t.tags||'';
  } else {
    ['fVal','fLabel','fDesc','fEx','fTags'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('termModal').classList.add('open');
  document.getElementById('fVal').focus();
}
function closeTermModal(){document.getElementById('termModal').classList.remove('open');}
function saveTerm(){
  const val=document.getElementById('fVal').value.trim();
  if(!val){showToast('Valor obrigatório');return;}
  const seg=document.getElementById('fSeg').value;
  const now=new Date().toLocaleDateString('pt-BR');
  const entry={
    seg,val,
    label:document.getElementById('fLabel').value.trim(),
    desc:document.getElementById('fDesc').value.trim(),
    ex:document.getElementById('fEx').value.trim(),
    tags:document.getElementById('fTags').value.trim(),
    updated:now,
    created:now,
  };
  if(_editIdx!==null){
    entry.created=_data.terms[_editIdx].created||now;
    _data.terms[_editIdx]=entry;
  } else {
    // check dup
    if(_data.terms.some(t=>t.seg===seg&&t.val.toLowerCase()===val.toLowerCase())){
      showToast('Valor já existe neste segmento');return;
    }
    _data.terms.push(entry);
  }
  save();
  _activeSeg=seg;
  closeTermModal();
  renderAll();
  showToast(_editIdx===null?'✓ Termo criado':'✓ Termo atualizado');
  _editIdx=null;
}
function deleteTerm(idx){
  if(!confirm('Remover este termo?')) return;
  _data.terms.splice(idx,1);
  save();
  renderAll();
  showToast('Termo removido');
}

// ── Seg CRUD ─────────────────────────────────────────────────────────────
function openSegModal(){
  renderSegModalList();
  document.getElementById('segModal').classList.add('open');
}
function closeSegModal(){document.getElementById('segModal').classList.remove('open');}
function renderSegModalList(){
  document.getElementById('segModalList').innerHTML=_data.segs.map((s,i)=>`
    <div class="seg-row">
      <input type="text" value="${esc(s)}" id="segrow_${i}">
      <button class="seg-del-btn" onclick="removeSegRow(${i})">✕</button>
    </div>`).join('');
}
function addSegRow(){
  _data.segs.push('novo-segmento');
  renderSegModalList();
}
function removeSegRow(i){
  if(_data.terms.some(t=>t.seg===_data.segs[i])){
    if(!confirm(`O segmento "${_data.segs[i]}" tem termos. Remover mesmo assim?`)) return;
    _data.terms=_data.terms.filter(t=>t.seg!==_data.segs[i]);
  }
  _data.segs.splice(i,1);
  renderSegModalList();
}
function saveSegs(){
  const inputs=document.querySelectorAll('#segModalList .seg-row input');
  const newSegs=[...inputs].map(inp=>inp.value.trim()).filter(Boolean);
  _data.segs=newSegs;
  if(_activeSeg&&!newSegs.includes(_activeSeg)) _activeSeg=newSegs[0]||null;
  save();
  closeSegModal();
  renderAll();
  showToast('✓ Segmentos salvos');
}

// ── Export ───────────────────────────────────────────────────────────────
function exportJSON(){
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(_data,null,2));
  a.download='nc-glossario.json';
  a.click();
  showToast('✓ JSON exportado');
}

function copyVal(v){
  navigator.clipboard.writeText(v).then(()=>showToast('✓ Copiado')).catch(()=>showToast(v));
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let _toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

initTheme();
load();
renderAll();
</script>
</body>
</html>
