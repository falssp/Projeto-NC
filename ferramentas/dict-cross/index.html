<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dict Cross-Client</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--fg:#0f172a;--card:#fff;--accent:#7c3aed;--accent-soft:rgba(124,58,237,.08);
  --border:#e2e8f0;--faint:#64748b;--input-bg:#fff;--divider:#f1f5f9;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--err:#dc2626;--err-bg:#fef2f2;
  --shadow:0 1px 4px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#a78bfa;--accent-soft:rgba(167,139,250,.1);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;--divider:#1e293b;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.08);--err:#f87171;--err-bg:rgba(248,113,113,.08);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#a78bfa;--accent-soft:rgba(167,139,250,.1);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;--divider:#1e293b;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.08);--err:#f87171;--err-bg:rgba(248,113,113,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.btn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn:hover{background:var(--border);}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
.page{max-width:1100px;margin:0 auto;padding:18px;}
/* Selectors */
.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.sel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.sel-label{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
select{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);color:var(--fg);font-size:13px;outline:none;cursor:pointer;}
/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center;}
.stat-val{font-size:18px;font-weight:800;}
.stat-label{font-size:11px;color:var(--faint);margin-top:1px;}
/* Filter chips */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.chip{padding:4px 10px;border-radius:12px;border:1px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;background:var(--card);}
.chip.active{background:var(--accent);color:#fff;border-color:transparent;}
/* Table */
.results-table{width:100%;border-collapse:collapse;}
.results-table th{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:2px solid var(--border);text-align:left;background:var(--card);position:sticky;top:0;}
.results-table td{padding:6px 10px;border-bottom:1px solid var(--divider);font-size:12px;font-family:'JetBrains Mono',monospace;vertical-align:middle;}
.results-table tr:hover td{background:var(--divider);}
.badge{font-size:9.5px;padding:1px 7px;border-radius:8px;font-weight:700;white-space:nowrap;}
.badge.shared{background:rgba(22,163,74,.12);color:var(--ok);}
.badge.only-a{background:rgba(37,99,235,.1);color:#2563eb;}
.badge.only-b{background:rgba(124,58,237,.1);color:var(--accent);}
.badge.similar{background:rgba(245,158,11,.1);color:var(--warn);}
[data-theme="dark"] .badge.only-a{color:#93c5fd;}
[data-theme="dark"] .badge.only-b{color:#c4b5fd;}
/* Seg filter */
.seg-pill{padding:3px 9px;border-radius:10px;border:1px solid var(--border);font-size:11px;cursor:pointer;background:var(--card);}
.seg-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:#1e293b;color:#f1f5f9;padding:8px 16px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:all .3s;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Scroll area */
.table-wrap{max-height:60vh;overflow-y:auto;border-radius:9px;border:1px solid var(--border);}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">🔀</span>
    <div>
      <div style="font-size:15px;font-weight:800">Comparador de Dicionários</div>
      <div style="font-size:11px;color:var(--faint)">Termos compartilhados, exclusivos e candidatos a consolidação entre clientes</div>
    </div>
  </div>
  <div style="display:flex;gap:7px">
    <button class="btn" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn" onclick="toggleTheme()">🌙</button>
    <button class="btn primary" onclick="compare()">🔀 Comparar</button>
  </div>
</div>

<div class="page">
  <!-- Client selectors -->
  <div class="selectors">
    <div class="sel-card">
      <div class="sel-label">🔵 Cliente A (referência)</div>
      <select id="selA" onchange="onClientChange()">
        <option value="">— selecione —</option>
      </select>
      <div id="infoA" style="font-size:11px;color:var(--faint);margin-top:6px"></div>
    </div>
    <div class="sel-card">
      <div class="sel-label">🟣 Cliente B (comparar)</div>
      <select id="selB" onchange="onClientChange()">
        <option value="">— selecione —</option>
      </select>
      <div id="infoB" style="font-size:11px;color:var(--faint);margin-top:6px"></div>
    </div>
  </div>

  <div id="resultsPanel">
    <div style="text-align:center;padding:50px;color:var(--faint)">
      <div style="font-size:36px;margin-bottom:10px">🔀</div>
      <div>Selecione dois clientes e clique em <strong>Comparar</strong></div>
      <div style="font-size:11px;margin-top:6px;opacity:.7">Requer dados do Taxonomy Builder no mesmo navegador</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Theme
let _theme=null;try{_theme=localStorage.getItem('dictcross_theme');}catch(e){}
if(_theme) document.documentElement.setAttribute('data-theme',_theme);
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  _theme=isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme',_theme);
  try{localStorage.setItem('dictcross_theme',_theme);}catch(e){}
  document.querySelector('.btn[onclick="toggleTheme()"]').textContent=_theme==='dark'?'☀️':'🌙';
}
(function(){const cur=document.documentElement.getAttribute('data-theme');const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);const btn=document.querySelector('.btn[onclick="toggleTheme()"]');if(btn)btn.textContent=isDark?'☀️':'🌙';})();

function getClients(){
  try{return JSON.parse(localStorage.getItem('taxo_clients_v1')||'[]');}catch(e){return [];}
}
function getClient(id){return getClients().find(c=>c.id===id)||null;}

function loadSelects(){
  const clients=getClients().filter(c=>!c.archived);
  const opts='<option value="">— selecione —</option>'+clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  document.getElementById('selA').innerHTML=opts;
  document.getElementById('selB').innerHTML=opts;
  if(clients.length<2){
    document.getElementById('resultsPanel').innerHTML=`<div style="text-align:center;padding:40px;color:var(--faint)"><div style="font-size:36px;margin-bottom:10px">⚠️</div><div>São necessários pelo menos 2 clientes no Taxonomy Builder.</div><div style="margin-top:8px"><a href="../taxonomy-builder/" target="_blank" style="color:var(--accent)">Abrir Taxonomy Builder</a></div></div>`;
  }
}

function onClientChange(){
  const idA=document.getElementById('selA').value;
  const idB=document.getElementById('selB').value;
  const c=getClient(idA);const d=getClient(idB);
  document.getElementById('infoA').textContent=c?`${c.segments.length} segs · ${Object.values(c.dictionary||{}).reduce((a,b)=>a+b.length,0)} termos`:'';
  document.getElementById('infoB').textContent=d?`${d.segments.length} segs · ${Object.values(d.dictionary||{}).reduce((a,b)=>a+b.length,0)} termos`:'';
}

let _results=[];
let _filter='all';
let _segFilter='all';

function getAllTerms(c){
  // Returns [{value,seg,segId}]
  const out=[];
  (c.segments||[]).forEach(s=>{
    (c.dictionary[s.id]||[]).forEach(t=>{
      out.push({value:t.value,seg:s.label,segId:s.id,uses:t.uses||0});
    });
  });
  return out;
}

// Levenshtein distance (simple)
function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function similarity(a,b){
  const maxLen=Math.max(a.length,b.length);
  if(!maxLen) return 1;
  return 1-lev(a,b)/maxLen;
}

function compare(){
  const idA=document.getElementById('selA').value;
  const idB=document.getElementById('selB').value;
  if(!idA||!idB){showToast('Selecione dois clientes');return;}
  if(idA===idB){showToast('Selecione clientes diferentes');return;}
  const cA=getClient(idA); const cB=getClient(idB);
  if(!cA||!cB){showToast('Cliente não encontrado');return;}

  const termsA=getAllTerms(cA);
  const termsB=getAllTerms(cB);

  const valsA=new Map(); // value_lower → {value,seg,uses}
  termsA.forEach(t=>valsA.set(t.value.toLowerCase(),t));
  const valsB=new Map();
  termsB.forEach(t=>valsB.set(t.value.toLowerCase(),t));

  const rows=[];

  // Shared: exact match (case-insensitive)
  valsA.forEach((ta,k)=>{
    if(valsB.has(k)){
      rows.push({type:'shared',value:ta.value,segA:ta.seg,segB:valsB.get(k).seg,usesA:ta.uses,usesB:valsB.get(k).uses});
    }
  });

  // Only A
  valsA.forEach((ta,k)=>{
    if(!valsB.has(k)){
      rows.push({type:'only-a',value:ta.value,segA:ta.seg,segB:'—',usesA:ta.uses,usesB:0});
    }
  });

  // Only B
  valsB.forEach((tb,k)=>{
    if(!valsA.has(k)){
      rows.push({type:'only-b',value:tb.value,segA:'—',segB:tb.seg,usesA:0,usesB:tb.uses});
    }
  });

  // Similar (fuzzy, only-a × only-b, sim >= 0.7, max 200 pairs)
  const onlyA=rows.filter(r=>r.type==='only-a').map(r=>r.value);
  const onlyB=rows.filter(r=>r.type==='only-b').map(r=>r.value);
  const simPairs=[];
  const checked=new Set();
  for(let i=0;i<Math.min(onlyA.length,100);i++){
    for(let j=0;j<Math.min(onlyB.length,100);j++){
      const key=onlyA[i]+'||'+onlyB[j];
      if(checked.has(key)) continue; checked.add(key);
      const sim=similarity(onlyA[i].toLowerCase(),onlyB[j].toLowerCase());
      if(sim>=0.7&&sim<1) simPairs.push({a:onlyA[i],b:onlyB[j],sim:Math.round(sim*100)});
    }
  }
  simPairs.sort((a,b)=>b.sim-a.sim);
  simPairs.slice(0,50).forEach(p=>{
    const ta=valsA.get(p.a.toLowerCase());
    const tb=valsB.get(p.b.toLowerCase());
    rows.push({type:'similar',value:p.a,valueB:p.b,sim:p.sim,segA:ta?.seg||'—',segB:tb?.seg||'—',usesA:ta?.uses||0,usesB:tb?.uses||0});
  });

  _results=rows;
  _filter='all';
  _segFilter='all';
  renderResults(cA.name,cB.name,cA,cB);
}

function renderResults(nameA,nameB,cA,cB){
  const counts={
    all:_results.length,
    shared:_results.filter(r=>r.type==='shared').length,
    'only-a':_results.filter(r=>r.type==='only-a').length,
    'only-b':_results.filter(r=>r.type==='only-b').length,
    similar:_results.filter(r=>r.type==='similar').length,
  };

  // Segments for filter
  const allSegs=[...new Set([
    ...(cA.segments||[]).map(s=>s.label),
    ...(cB.segments||[]).map(s=>s.label)
  ])];

  const filtered=_results.filter(r=>{
    if(_filter!=='all' && r.type!==_filter) return false;
    if(_segFilter!=='all' && r.segA!==_segFilter && r.segB!==_segFilter) return false;
    return true;
  });

  document.getElementById('resultsPanel').innerHTML=`
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat"><div class="stat-val" style="color:var(--ok)">${counts.shared}</div><div class="stat-label">Compartilhados</div></div>
      <div class="stat"><div class="stat-val" style="color:#2563eb">${counts['only-a']}</div><div class="stat-label">Só em ${esc(nameA.length>12?nameA.slice(0,10)+'…':nameA)}</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--accent)">${counts['only-b']}</div><div class="stat-label">Só em ${esc(nameB.length>12?nameB.slice(0,10)+'…':nameB)}</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--warn)">${counts.similar}</div><div class="stat-label">Similares</div></div>
      <div class="stat"><div class="stat-val">${counts.all}</div><div class="stat-label">Total</div></div>
    </div>

    <!-- Filters -->
    <div class="filter-row">
      <span style="font-size:11px;color:var(--faint);font-weight:600">Tipo:</span>
      ${['all','shared','only-a','only-b','similar'].map(f=>`
        <span class="chip ${_filter===f?'active':''}" onclick="setFilter('${f}')">${
          f==='all'?`Todos (${counts.all})`:
          f==='shared'?`✓ Compartilhados (${counts.shared})`:
          f==='only-a'?`🔵 Só A (${counts['only-a']})`:
          f==='only-b'?`🟣 Só B (${counts['only-b']})`:
          `≈ Similares (${counts.similar})`
        }</span>`).join('')}
    </div>
    <div class="filter-row">
      <span style="font-size:11px;color:var(--faint);font-weight:600">Segmento:</span>
      <span class="seg-pill ${_segFilter==='all'?'active':''}" onclick="setSegFilter('all')">Todos</span>
      ${allSegs.map(s=>`<span class="seg-pill ${_segFilter===s?'active':''}" onclick="setSegFilter(${JSON.stringify(s).replace(/"/g,'&quot;')})">${esc(s)}</span>`).join('')}
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="results-table">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Valor (A)</th>
            <th>Valor (B)</th>
            <th>Seg A</th>
            <th>Seg B</th>
            <th>Uso A</th>
            <th>Uso B</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length?filtered.map(r=>`
            <tr>
              <td><span class="badge ${r.type}">${
                r.type==='shared'?'✓ Compartilhado':
                r.type==='only-a'?'🔵 Só A':
                r.type==='only-b'?'🟣 Só B':
                `≈ Similar ${r.sim}%`
              }</span></td>
              <td onclick="navigator.clipboard.writeText('${esc((r.value||'').replace(/'/g,"\\'"))}').then(()=>showToast('✓ Copiado')).catch(()=>{})" style="cursor:pointer" title="Clique para copiar">${esc(r.value||'—')}</td>
              <td onclick="navigator.clipboard.writeText('${esc(((r.valueB||r.value)||'').replace(/'/g,"\\'"))}').then(()=>showToast('✓ Copiado')).catch(()=>{})" style="cursor:pointer" title="Clique para copiar">${esc(r.type==='similar'?r.valueB:r.type==='only-b'?r.value:'—')}</td>
              <td style="font-family:'Inter',sans-serif;font-size:11px;color:var(--faint)">${esc(r.segA)}</td>
              <td style="font-family:'Inter',sans-serif;font-size:11px;color:var(--faint)">${esc(r.segB)}</td>
              <td style="text-align:center">${r.usesA||''}</td>
              <td style="text-align:center">${r.usesB||''}</td>
            </tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--faint)">Nenhum resultado</td></tr>`}
        </tbody>
      </table>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:6px;text-align:right">${filtered.length} de ${_results.length} registros · Clique em um valor para copiar</div>
  `;
}

function setFilter(f){
  _filter=f;
  const idA=document.getElementById('selA').value;
  const idB=document.getElementById('selB').value;
  const cA=getClient(idA);const cB=getClient(idB);
  if(cA&&cB) renderResults(cA.name,cB.name,cA,cB);
}
function setSegFilter(s){
  _segFilter=s;
  const idA=document.getElementById('selA').value;
  const idB=document.getElementById('selB').value;
  const cA=getClient(idA);const cB=getClient(idB);
  if(cA&&cB) renderResults(cA.name,cB.name,cA,cB);
}

function exportCSV(){
  if(!_results.length){showToast('Compare primeiro');return;}
  const rows=[['tipo','valor_a','valor_b','seg_a','seg_b','uso_a','uso_b','similaridade']];
  _results.forEach(r=>{
    rows.push([r.type,r.value||'',r.type==='similar'?r.valueB:r.type==='only-b'?r.value:'',r.segA,r.segB,r.usesA,r.usesB,r.sim||'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dict_cross.csv';a.click();
  showToast(`⬇ ${rows.length-1} linhas exportadas`);
}

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')compare();});
loadSelects();
</script>
</body>
</html>
