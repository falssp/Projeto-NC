<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta de Mídia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a237e;--accent:#1F36C7;--hl:#e8ecfd;--border:#d6dbf2;--bg:#f4f5fb;
  --surface:#fff;--text:#1a237e;--body:#3d4a8a;--muted:#9fa8da;
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px;flex-shrink:0}
header .ico{font-size:1.5rem}
header h1{font-size:1.1rem;font-weight:700;letter-spacing:-.2px}
header p{font-size:.78rem;opacity:.7;margin-top:2px}
.wrap{display:flex;flex:1;min-width:0;overflow:hidden}

/* LEFT FORM */
.form-panel{width:42%;min-width:320px;background:var(--surface);border-right:1.5px solid var(--border);overflow-y:auto;padding:20px 20px 40px;flex-shrink:0}
.section-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.section-label:first-child{margin-top:0}
.field{margin-bottom:10px}
.field label{display:block;font-size:.75rem;font-weight:600;color:var(--body);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:.82rem;color:var(--text);background:var(--bg);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* PLACEMENTS TABLE */
.placements-wrap{overflow-x:auto;margin:10px 0}
table.pt{width:100%;border-collapse:collapse;font-size:.72rem}
table.pt th{background:var(--hl);color:var(--navy);font-weight:600;padding:5px 6px;white-space:nowrap;border-bottom:1.5px solid var(--border);text-align:left}
table.pt td{padding:4px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
table.pt td input,table.pt td select{border:1px solid var(--border);border-radius:5px;padding:4px 5px;font-size:.72rem;font-family:inherit;width:100%;background:#fff;color:var(--text)}
table.pt td input:focus,table.pt td select:focus{outline:none;border-color:var(--accent)}
table.pt .num{font-weight:700;color:var(--accent);text-align:center;width:28px}
table.pt .del{text-align:center;width:26px}
table.pt .del button{background:none;border:none;cursor:pointer;color:#ef4444;font-size:1rem;line-height:1;padding:0}
table.pt .del button:hover{color:#dc2626}
table.pt .total-row td{background:var(--hl);font-weight:700;font-size:.72rem;color:var(--navy);padding:5px 6px}
.add-btn{margin-top:8px;background:none;border:1.5px dashed var(--accent);color:var(--accent);border-radius:7px;padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;width:100%;transition:.15s}
.add-btn:hover{background:var(--hl)}

/* RIGHT PREVIEW */
.preview-panel{flex:1;min-width:0;overflow-y:auto;padding:20px;background:var(--bg)}
.preview-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pbtn{border:none;border-radius:7px;padding:7px 16px;font-size:.78rem;font-weight:600;cursor:pointer;transition:.15s}
.pbtn-primary{background:var(--accent);color:#fff}
.pbtn-primary:hover{background:var(--navy)}
.pbtn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--body)}
.pbtn-outline:hover{border-color:var(--accent);color:var(--accent)}
.preview-doc{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:32px 36px;min-height:400px;box-shadow:0 2px 12px rgba(26,35,126,.06)}

/* PROPOSAL DOC STYLES */
.prop-header{background:var(--navy);color:#fff;border-radius:8px;padding:22px 26px;margin-bottom:24px}
.prop-header .prop-title{font-size:1.3rem;font-weight:700;letter-spacing:-.3px}
.prop-header .prop-sub{font-size:.88rem;opacity:.8;margin-top:4px}
.prop-header .prop-meta{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.prop-header .prop-meta span{font-size:.75rem;opacity:.75;background:rgba(255,255,255,.12);border-radius:5px;padding:3px 8px}
.prop-section{margin-bottom:22px}
.prop-section-title{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--border);padding-bottom:6px;margin-bottom:12px}
.obj-box{background:var(--hl);border-radius:8px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:16px}
.obj-item{display:flex;flex-direction:column;gap:2px}
.obj-item .lbl{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.obj-item .val{font-size:.9rem;font-weight:700;color:var(--navy)}
table.prop-table{width:100%;border-collapse:collapse;font-size:.8rem}
table.prop-table th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:.72rem}
table.prop-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--body)}
table.prop-table tr:last-child td{border-bottom:none}
table.prop-table .total-row td{background:var(--hl);font-weight:700;color:var(--navy)}
table.prop-table td:nth-child(5),table.prop-table td:nth-child(6),table.prop-table td:nth-child(7),
table.prop-table th:nth-child(5),table.prop-table th:nth-child(6),table.prop-table th:nth-child(7){text-align:right}
.bar-chart{display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar-segment{height:100%;transition:.3s;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.bar-legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--body)}
.bar-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cond-box{background:#f8f9fe;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:.8rem;color:var(--body);line-height:1.6}
.prop-footer{text-align:center;font-size:.68rem;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .e-ico{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.85rem}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;border-radius:8px;padding:10px 20px;font-size:.82rem;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}

@media print{
  header,.form-panel,.preview-toolbar,.toast{display:none!important}
  .wrap{display:block}
  .preview-panel{padding:0;background:#fff}
  .preview-doc{border:none;border-radius:0;box-shadow:none;padding:0}
  body{background:#fff}
}
</style>
</head>
<body>

<header>
  <div class="ico">📝</div>
  <div>
    <h1>Gerador de Proposta de Mídia</h1>
    <p>Preencha o formulário e gere a proposta formatada ao vivo</p>
  </div>
</header>

<div class="wrap">
  <!-- FORM PANEL -->
  <div class="form-panel">
    <div class="section-label">Dados do Cliente</div>
    <div class="field"><label>Cliente / Anunciante</label><input type="text" id="f-cliente" placeholder="Ex: Unilever Brasil" oninput="render()"></div>
    <div class="field"><label>Produto / Campanha</label><input type="text" id="f-campanha" placeholder="Ex: Dove — Campanha Verão 2027" oninput="render()"></div>
    <div class="row2">
      <div class="field"><label>Agência</label><input type="text" id="f-agencia" placeholder="Opcional" oninput="render()"></div>
      <div class="field"><label>Responsável</label><input type="text" id="f-resp" placeholder="Nome do contato" oninput="render()"></div>
    </div>
    <div class="row3">
      <div class="field"><label>Nº da Proposta</label><input type="text" id="f-num" oninput="render()"></div>
      <div class="field"><label>Data</label><input type="date" id="f-data" oninput="render()"></div>
      <div class="field"><label>Validade</label><input type="date" id="f-validade" oninput="render()"></div>
    </div>

    <div class="section-label">Objetivo da Campanha</div>
    <div class="row2">
      <div class="field"><label>Objetivo Principal</label>
        <select id="f-objetivo" onchange="render()">
          <option value="">Selecionar…</option>
          <option>Awareness / Branding</option>
          <option>Consideração / Engajamento</option>
          <option>Conversão / Performance</option>
          <option>Full-Funnel</option>
        </select>
      </div>
      <div class="field"><label>KPI Principal</label>
        <select id="f-kpi" onchange="render()">
          <option value="">Selecionar…</option>
          <option>Impressões</option>
          <option>Alcance</option>
          <option>Frequência</option>
          <option>Cliques</option>
          <option>CTR</option>
          <option>Leads</option>
          <option>Vendas</option>
          <option>ROAS</option>
          <option>Visualizações de Vídeo</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Meta do KPI</label><input type="text" id="f-meta" placeholder="Ex: 5.000.000" oninput="render()"></div>
      <div class="field"><label>Budget Total (R$)</label><input type="number" id="f-budget" placeholder="0,00" oninput="render()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Período Início</label><input type="date" id="f-inicio" oninput="render()"></div>
      <div class="field"><label>Período Fim</label><input type="date" id="f-fim" oninput="render()"></div>
    </div>

    <div class="section-label">Placements</div>
    <div class="placements-wrap">
      <table class="pt" id="pl-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Plataforma</th>
            <th>Formato</th>
            <th>Impressões</th>
            <th>CPM R$</th>
            <th>Invest. R$</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pl-body"></tbody>
        <tfoot id="pl-foot"></tfoot>
      </table>
    </div>
    <button class="add-btn" onclick="addRow()">+ Adicionar Placement</button>

    <div class="section-label" style="margin-top:20px">Observações e Condições</div>
    <div class="field"><label>Notas Técnicas</label><textarea id="f-notas" placeholder="Especificações, formatos aprovados, requisitos de tracking…" oninput="render()"></textarea></div>
    <div class="field"><label>Condições Comerciais</label><textarea id="f-cond" oninput="render()"></textarea></div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-toolbar">
      <button class="pbtn pbtn-primary" onclick="printProp()">🖨️ Imprimir / PDF</button>
      <button class="pbtn pbtn-outline" onclick="copyHTML()">📋 Copiar HTML</button>
      <button class="pbtn pbtn-outline" onclick="copyText()">📄 Copiar como texto</button>
    </div>
    <div class="preview-doc" id="preview-doc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLAT_COLORS = {
  'Meta Ads':'#1877F2','Google Ads':'#4285F4','DV360':'#1a73e8',
  'LinkedIn':'#0A66C2','TikTok':'#000000','X Ads':'#1DA1F2',
  'Display Direto':'#6366f1','YouTube':'#FF0000',
  'Programático Aberto':'#7c3aed','Outro':'#64748b'
};

let rows = [];
let rowId = 0;

function init(){
  const today = new Date();
  const fmt = d => d.toISOString().slice(0,10);
  const valid = new Date(today); valid.setDate(valid.getDate()+7);
  document.getElementById('f-data').value = fmt(today);
  document.getElementById('f-validade').value = fmt(valid);
  document.getElementById('f-num').value = 'PROP-' + today.getFullYear() + '-001';
  document.getElementById('f-cond').value = 'Proposta válida por 7 dias corridos. Sujeito à disponibilidade de inventário. Valores em Reais (BRL). Impostos não inclusos.';
  addRow(); addRow();
  render();
}

function addRow(){
  const id = rowId++;
  rows.push({id, plat:'Meta Ads', fmt:'', imp:'', cpm:'', inv:'', kpi:'', periodo:''});
  renderTable();
  render();
}

function delRow(id){
  rows = rows.filter(r=>r.id!==id);
  renderTable();
  render();
}

function getVal(id){ return document.getElementById(id)?.value||''; }

function fmtNum(n){
  if(!n && n!==0) return '';
  return Number(n).toLocaleString('pt-BR');
}
function fmtMoney(n){
  if(!n && n!==0) return '';
  return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function parseMoney(s){ return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0; }

function readRows(){
  return rows.map(r=>{
    const imp = parseFloat(document.getElementById('ri'+r.id)?.value)||0;
    const cpm = parseFloat(document.getElementById('rc'+r.id)?.value)||0;
    const invEl = document.getElementById('rv'+r.id);
    let inv = parseFloat(invEl?.value)||0;
    if(imp>0 && cpm>0 && (!invEl?.dataset.manual || invEl.dataset.manual==='0')) inv = imp*cpm/1000;
    return {
      id: r.id,
      plat: document.getElementById('rp'+r.id)?.value||'',
      fmt: document.getElementById('rf'+r.id)?.value||'',
      imp, cpm, inv,
      kpi: document.getElementById('rk'+r.id)?.value||'',
      periodo: document.getElementById('rd'+r.id)?.value||''
    };
  });
}

function renderTable(){
  const tbody = document.getElementById('pl-body');
  const tfoot = document.getElementById('pl-foot');
  tbody.innerHTML = rows.map((r,i)=>`
    <tr>
      <td class="num">${i+1}</td>
      <td><select id="rp${r.id}" onchange="render()" style="min-width:110px">
        ${Object.keys(PLAT_COLORS).map(p=>`<option${p===r.plat?' selected':''}>${p}</option>`).join('')}
      </select></td>
      <td><input type="text" id="rf${r.id}" placeholder="Formato" oninput="render()" style="min-width:90px"></td>
      <td><input type="number" id="ri${r.id}" placeholder="0" oninput="autoCalc(${r.id})" style="width:90px"></td>
      <td><input type="number" id="rc${r.id}" placeholder="0.00" step="0.01" oninput="autoCalc(${r.id})" style="width:70px"></td>
      <td><input type="number" id="rv${r.id}" placeholder="auto" step="0.01" oninput="manualInv(${r.id})" style="width:90px"></td>
      <td class="del"><button onclick="delRow(${r.id})">✕</button></td>
    </tr>
  `).join('');
  updateTotals();
}

function autoCalc(id){
  const imp = parseFloat(document.getElementById('ri'+id)?.value)||0;
  const cpm = parseFloat(document.getElementById('rc'+id)?.value)||0;
  const invEl = document.getElementById('rv'+id);
  if(invEl && (!invEl.dataset.manual||invEl.dataset.manual==='0')){
    if(imp>0&&cpm>0) invEl.value = (imp*cpm/1000).toFixed(2);
    else invEl.value = '';
  }
  render();
}

function manualInv(id){
  const el = document.getElementById('rv'+id);
  if(el) el.dataset.manual = el.value?'1':'0';
  render();
}

function updateTotals(){
  const data = readRows();
  const totImp = data.reduce((s,r)=>s+r.imp,0);
  const totInv = data.reduce((s,r)=>s+r.inv,0);
  const tfoot = document.getElementById('pl-foot');
  tfoot.innerHTML = `<tr class="total-row">
    <td colspan="3">TOTAL</td>
    <td>${fmtNum(totImp)}</td>
    <td></td>
    <td>${fmtMoney(totInv)}</td>
    <td></td>
  </tr>`;
}

function render(){
  updateTotals();
  const data = readRows();
  const budget = parseFloat(getVal('f-budget'))||0;
  const totInv = data.reduce((s,r)=>s+r.inv,0);
  const totImp = data.reduce((s,r)=>s+r.imp,0);

  const cliente = getVal('f-cliente');
  const campanha = getVal('f-campanha');
  const agencia = getVal('f-agencia');
  const resp = getVal('f-resp');
  const num = getVal('f-num');
  const dataP = getVal('f-data');
  const validade = getVal('f-validade');
  const objetivo = getVal('f-objetivo');
  const kpi = getVal('f-kpi');
  const meta = getVal('f-meta');
  const inicio = getVal('f-inicio');
  const fim = getVal('f-fim');
  const notas = getVal('f-notas');
  const cond = getVal('f-cond');

  const fmtDate = s => { if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };

  if(!cliente && !campanha){
    document.getElementById('preview-doc').innerHTML = `<div class="empty-state"><div class="e-ico">📝</div><p>Preencha os dados do cliente para visualizar a proposta</p></div>`;
    return;
  }

  // Build budget bar
  const platMap = {};
  data.forEach(r=>{ if(r.plat&&r.inv>0){ platMap[r.plat]=(platMap[r.plat]||0)+r.inv; }});
  const platEntries = Object.entries(platMap).sort((a,b)=>b[1]-a[1]);
  let barHTML = '';
  if(platEntries.length>0){
    const total = platEntries.reduce((s,[,v])=>s+v,0);
    barHTML = `
    <div class="prop-section">
      <div class="prop-section-title">Distribuição de Budget</div>
      <div class="bar-chart">${platEntries.map(([p,v])=>{
        const pct = total>0?(v/total*100).toFixed(1):0;
        const col = PLAT_COLORS[p]||'#64748b';
        return `<div class="bar-segment" style="width:${pct}%;background:${col}" title="${p}: ${fmtMoney(v)} (${pct}%)">${pct>8?p:''}</div>`;
      }).join('')}</div>
      <div class="bar-legend">${platEntries.map(([p,v])=>{
        const pct = total>0?(v/total*100).toFixed(1):0;
        return `<div class="bar-legend-item"><div class="bar-legend-dot" style="background:${PLAT_COLORS[p]||'#64748b'}"></div><span>${p} — ${fmtMoney(v)} (${pct}%)</span></div>`;
      }).join('')}</div>
    </div>`;
  }

  // Placements table
  const hasData = data.some(r=>r.plat||r.fmt||r.imp||r.inv);
  let tableHTML = '';
  if(hasData){
    tableHTML = `
    <div class="prop-section">
      <div class="prop-section-title">Planejamento de Mídia</div>
      <table class="prop-table">
        <thead><tr>
          <th>#</th><th>Plataforma</th><th>Formato</th><th>Período</th>
          <th>Impressões</th><th>CPM</th><th>Investimento</th><th>% Budget</th><th>KPI Esperado</th>
        </tr></thead>
        <tbody>${data.filter(r=>r.plat||r.fmt||r.imp).map((r,i)=>`
          <tr>
            <td style="color:var(--accent);font-weight:700;text-align:center">${i+1}</td>
            <td style="font-weight:600">${r.plat||'—'}</td>
            <td>${r.fmt||'—'}</td>
            <td>${r.periodo||'—'}</td>
            <td style="text-align:right">${r.imp?fmtNum(r.imp):'—'}</td>
            <td style="text-align:right">${r.cpm?'R$ '+r.cpm.toFixed(2).replace('.',','):'—'}</td>
            <td style="text-align:right;font-weight:600">${r.inv?fmtMoney(r.inv):'—'}</td>
            <td style="text-align:right">${budget>0&&r.inv?(r.inv/budget*100).toFixed(1)+'%':'—'}</td>
            <td>${r.kpi||'—'}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr class="total-row">
          <td colspan="4">TOTAL</td>
          <td style="text-align:right">${fmtNum(totImp)||'—'}</td>
          <td></td>
          <td style="text-align:right">${fmtMoney(totInv)}</td>
          <td style="text-align:right">${budget>0?(totInv/budget*100).toFixed(1)+'%':''}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>`;
  }

  document.getElementById('preview-doc').innerHTML = `
    <div class="prop-header">
      <div class="prop-title">PROPOSTA DE MÍDIA DIGITAL</div>
      <div class="prop-sub">${cliente||'—'}${agencia?' × '+agencia:''} ${campanha?'— '+campanha:''}</div>
      <div class="prop-meta">
        <span>Proposta Nº ${num||'—'}</span>
        <span>Emitida em ${fmtDate(dataP)}</span>
        <span>Válida até ${fmtDate(validade)}</span>
        ${resp?`<span>Attn: ${resp}</span>`:''}
      </div>
    </div>

    <div class="prop-section">
      <div class="prop-section-title">Objetivo da Campanha</div>
      <div class="obj-box">
        <div class="obj-item"><span class="lbl">Objetivo</span><span class="val">${objetivo||'—'}</span></div>
        <div class="obj-item"><span class="lbl">KPI Principal</span><span class="val">${kpi||'—'}</span></div>
        ${meta?`<div class="obj-item"><span class="lbl">Meta</span><span class="val">${meta}</span></div>`:''}
        <div class="obj-item"><span class="lbl">Período</span><span class="val">${fmtDate(inicio)} → ${fmtDate(fim)}</span></div>
        <div class="obj-item"><span class="lbl">Budget Total</span><span class="val">${budget?fmtMoney(budget):'—'}</span></div>
      </div>
    </div>

    ${tableHTML}
    ${barHTML}

    ${notas?`<div class="prop-section">
      <div class="prop-section-title">Notas Técnicas</div>
      <div class="cond-box">${notas.replace(/\n/g,'<br>')}</div>
    </div>`:''}

    ${cond?`<div class="prop-section">
      <div class="prop-section-title">Condições Comerciais</div>
      <div class="cond-box">${cond.replace(/\n/g,'<br>')}</div>
    </div>`:''}

    <div class="prop-footer">Documento gerado por NC Tool — AdOps Suite &nbsp;·&nbsp; ${new Date().toLocaleDateString('pt-BR')}</div>
  `;
}

function printProp(){ window.print(); }

function copyHTML(){
  const html = document.getElementById('preview-doc').innerHTML;
  navigator.clipboard.writeText(html).then(()=>toast('HTML copiado!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=html; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('HTML copiado!');
  });
}

function copyText(){
  const el = document.getElementById('preview-doc');
  const text = el.innerText||el.textContent;
  navigator.clipboard.writeText(text).then(()=>toast('Texto copiado!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('Texto copiado!');
  });
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

init();
</script>
