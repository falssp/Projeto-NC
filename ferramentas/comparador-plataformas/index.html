<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador de Plataformas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a237e;--accent:#1F36C7;--hl:#e8ecfd;--border:#d6dbf2;
  --bg:#f4f5fb;--surface:#fff;--muted:#9fa8da;--text:#1a237e;--body:#3d4a8a;
  --green:#059669;--red:#dc2626;--yellow:#d97706;--gray:#94a3b8;
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:var(--navy);color:#fff;padding:16px 32px;display:flex;align-items:center;gap:16px}
.header-icon{font-size:1.5rem}
.header-title{font-size:1.1rem;font-weight:700}
.header-sub{font-size:.8rem;opacity:.7;margin-top:2px}

/* MAIN */
.main{padding:24px 32px;min-width:0}

/* SELECTOR */
.selector-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px}
.selector-title{font-size:.85rem;font-weight:600;color:var(--body);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.selector-title span{background:var(--hl);color:var(--accent);border-radius:4px;padding:2px 8px;font-size:.75rem}
.platform-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--body);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--hl)}
.chip.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.chip.selected .chip-emoji{filter:none}
.chip.disabled{opacity:.4;cursor:not-allowed}
.chip-emoji{font-size:1.1rem}
.selector-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:600;color:var(--body);transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--hl)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1629a0}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.9rem}

/* COMPARISON TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.table-header{display:flex;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:10;background:var(--surface)}
.th-label{flex:0 0 220px;padding:14px 20px;font-size:.78rem;font-weight:600;color:var(--muted);border-right:1px solid var(--border);background:#f9faff}
.th-platform{flex:1;padding:12px 16px;text-align:center;border-right:1px solid var(--border);min-width:140px}
.th-platform:last-child{border-right:none}
.th-plat-name{font-size:.85rem;font-weight:700;color:var(--text)}
.th-plat-emoji{font-size:1.3rem;margin-bottom:4px}
.th-plat-type{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:4px;margin-top:4px;display:inline-block}
.type-social{background:#fce7f3;color:#db2777}
.type-search{background:#fef3c7;color:#d97706}
.type-dsp{background:#ede9fe;color:#7c3aed}
.type-adserver{background:#d1fae5;color:#059669}
.type-display{background:#dbeafe;color:#1d4ed8}
.type-ecommerce{background:#ffedd5;color:#ea580c}

/* SECTION */
.section{}
.section-toggle{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#f9faff;border-bottom:1px solid var(--border);cursor:pointer;font-size:.82rem;font-weight:700;color:var(--body);user-select:none;transition:background .1s}
.section-toggle:hover{background:var(--hl)}
.section-toggle .arrow{margin-left:auto;transition:transform .2s;font-size:.7rem;color:var(--muted)}
.section-toggle.open .arrow{transform:rotate(90deg)}
.section-body{display:none}
.section-body.open{display:block}

/* ROW */
.row{display:flex;border-bottom:1px solid #f0f2fd}
.row:last-child{border-bottom:none}
.row:hover{background:#fafbff}
.row-label{flex:0 0 220px;padding:10px 20px;font-size:.78rem;font-weight:500;color:var(--body);border-right:1px solid var(--border);display:flex;align-items:center;background:#fafbff}
.row-cell{flex:1;padding:10px 16px;font-size:.78rem;text-align:center;border-right:1px solid var(--border);min-width:140px;display:flex;align-items:center;justify-content:center}
.row-cell:last-child{border-right:none}
.cell-val{padding:3px 8px;border-radius:5px;font-weight:600;font-size:.75rem}
.cv-green{background:#d1fae5;color:#059669}
.cv-red{background:#fee2e2;color:#dc2626}
.cv-yellow{background:#fef3c7;color:#d97706}
.cv-blue{background:var(--hl);color:var(--accent)}
.cv-purple{background:#ede9fe;color:#7c3aed}
.cv-gray{background:#f1f5f9;color:#94a3b8}
.cv-plain{color:var(--body)}
.best-badge{display:block;font-size:.65rem;color:var(--green);font-weight:700;margin-top:2px}

/* COPY FEEDBACK */
.copy-toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:.82rem;font-weight:600;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:999}
.copy-toast.show{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  .main{padding:16px}
  .th-label,.row-label{flex:0 0 130px;font-size:.7rem;padding:8px 10px}
  .header{padding:12px 16px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🔄</div>
  <div>
    <div class="header-title">Comparador de Plataformas</div>

  </div>
</div>

    <div class="selector-actions">

</div>

let selected = [];
const MAX = 4;

function typeClass(t){
  return {social:'type-social',search:'type-search',dsp:'type-dsp',adserver:'type-adserver',display:'type-display',ecommerce:'type-ecommerce'}[t]||'type-display';
}

function cellClass(val){
  if(!val||val==='N/A'||val==='Não aplicável') return 'cv-gray';
  const v = val.toLowerCase();
  if(v==='sim'||v==='muito alta'||v==='avançado (plataforma)'||v.startsWith('nativo')) return 'cv-green';
  if(v==='não') return 'cv-red';
  if(v==='básico'||v==='parcial'||v==='parcialmente') return 'cv-yellow';
  if(v==='avançado') return 'cv-purple';
  if(v==='n/a'||v==='n/a (não compra mídia)'||v==='n/a (não é canal de mídia)') return 'cv-gray';
  return 'cv-blue';
}

function renderChips(){
  const grid = document.getElementById('platform-grid');
  grid.innerHTML = Object.entries(PLATFORMS).map(([id,p])=>{
    const sel = selected.includes(id);
    const dis = !sel && selected.length>=MAX;
    return `<button class="chip${sel?' selected':''}${dis?' disabled':''}" onclick="togglePlatform('${id}')" title="${p.name}">
      <span class="chip-emoji">${p.emoji}</span>${p.name}
    </button>`;
  }).join('');
  document.getElementById('sel-count').textContent = `${selected.length} / ${MAX} selecionadas`;
}

function togglePlatform(id){
  if(selected.includes(id)){
    selected = selected.filter(s=>s!==id);
  } else {
    if(selected.length>=MAX) return;
    selected.push(id);
  }
  renderChips();
  renderTable();
}

function compareAll(){
  selected = Object.keys(PLATFORMS).slice(0,MAX);
  renderChips();
  renderTable();
}

function clearSelection(){
  selected=[];
  renderChips();
  renderTable();
}

function renderTable(){
  const area = document.getElementById('comparison-area');
  if(selected.length<2){
    area.innerHTML=`<div class="empty"><div class="empty-icon">🔄</div><p>Selecione pelo menos 2 plataformas para comparar.</p></div>`;
    return;
  }
  const platforms = selected.map(id=>({id,...PLATFORMS[id]}));

  let html = `<div class="table-wrap">`;

  // Header
  html += `<div class="table-header"><div class="th-label">Atributo</div>`;
  platforms.forEach(p=>{
    html += `<div class="th-platform">
      <div class="th-plat-emoji">${p.emoji}</div>
      <div class="th-plat-name">${p.name}</div>
      <div class="th-plat-type ${typeClass(p.type)}">${p.typeLabel}</div>
    </div>`;
  });
  html += `</div>`;

  // Sections
  SECTIONS.forEach(sec=>{
    html += `<div class="section">
      <div class="section-toggle open" onclick="toggleSection(this)">
        ${sec.label}<span class="arrow">▶</span>
      </div>
      <div class="section-body open">`;

    sec.fields.forEach(field=>{
      const vals = platforms.map(p=> p[sec.id]?.[field.key] || '—');
      const unique = [...new Set(vals.filter(v=>v!=='—'))];
      const allSame = unique.length<=1;

      html += `<div class="row"><div class="row-label">${field.label}</div>`;
      vals.forEach(val=>{
        const cls = cellClass(val);
        const diff = !allSame && val!=='—' ? ' style="background:#fffbeb"' : '';
        html += `<div class="row-cell"${diff}><span class="cell-val ${cls}">${val}</span></div>`;
      });
      html += `</div>`;
    });

    html += `</div></div>`;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function toggleSection(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function copyComparison(){
  if(selected.length<2){alert('Selecione ao menos 2 plataformas.');return;}
  const platforms = selected.map(id=>({id,...PLATFORMS[id]}));
  let txt = `COMPARADOR DE PLATAFORMAS\n${'='.repeat(60)}\n`;
  txt += platforms.map(p=>p.name).join(' | ')+'\n\n';

  SECTIONS.forEach(sec=>{
    txt += `\n${sec.label}\n${'-'.repeat(40)}\n`;
    sec.fields.forEach(field=>{
      const vals = platforms.map(p=>p[sec.id]?.[field.key]||'—');
      txt += `${field.label.padEnd(32)} ${vals.join(' | ')}\n`;
    });
  });

  navigator.clipboard.writeText(txt).then(()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  });
}
