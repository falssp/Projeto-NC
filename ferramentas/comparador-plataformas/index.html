<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador de Plataformas | NC Tool</title>
<style>
:root{
  --navy:#0D2137;--navy2:#1A3F63;--accent:#38BDF8;
  --bg:#F0F4F8;--surface:#fff;--border:#DDE3EC;
  --text:#0D2137;--mid:#4A5568;--light:#8B9BBF;
  --green:#10B981;--blue:#2563EB;--purple:#7C3AED;--orange:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

header{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;gap:16px;height:56px}
.logo{color:#fff;font-size:15px;font-weight:700}
.logo span{color:var(--accent)}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--light);width:16px;height:16px;pointer-events:none}
#search{width:100%;padding:7px 12px 7px 34px;border:1px solid #2A4A6E;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;outline:none}
#search::placeholder{color:#6B84A8}
#search:focus{border-color:var(--accent)}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:56px;z-index:99}
.filter-inner{display:flex;align-items:center;gap:6px;height:44px;overflow-x:auto;scrollbar-width:none}
.filter-inner::-webkit-scrollbar{display:none}
.filter-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.filter-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px}

main{padding:20px 24px 60px}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:900px}
thead tr{background:var(--navy)}
thead th{padding:12px 14px;text-align:left;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
thead th:last-child{border-right:none}
thead th.th-plat{color:#fff;font-size:13px;text-transform:none;letter-spacing:0}
.th-icon{font-size:18px;display:block;margin-bottom:2px}

tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:#F7FAFC}
tbody tr:hover{background:#EBF3FF}
td{padding:10px 14px;vertical-align:top;border-right:1px solid var(--border);font-size:12px}
td:last-child{border-right:none}
.td-attr{font-weight:700;color:var(--text);white-space:nowrap;font-size:12px}
.td-sub{font-size:10px;font-weight:400;color:var(--light);display:block;margin-top:1px}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;margin:1px}
.b-green{background:#D1FAE5;color:#065F46}
.b-blue{background:#DBEAFE;color:#1E40AF}
.b-purple{background:#EDE9FE;color:#5B21B6}
.b-orange{background:#FEF3C7;color:#92400E}
.b-red{background:#FEE2E2;color:#991B1B}
.b-gray{background:#F1F5F9;color:var(--mid)}
.b-navy{background:#1E3A5F;color:#93C5FD}

.stars{color:#F59E0B;letter-spacing:-1px}
.stars-empty{color:#E2E8F0}

.section-row td{background:#F0F4F8;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--light);padding:6px 14px}

.no-results{text-align:center;padding:48px;color:var(--light);display:none}
footer{text-align:center;color:var(--light);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Comparador de <span>Plataformas</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
      <input id="search" type="text" placeholder="Buscar atributo…" autocomplete="off">
    </div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="filter-btn active" data-f="all">Todos</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-f="obj:Awareness">Awareness</button>
    <button class="filter-btn" data-f="obj:Consideration">Consideration</button>
    <button class="filter-btn" data-f="obj:Conversão">Conversão</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-f="cat:Mídia Paga">Mídia Paga</button>
    <button class="filter-btn" data-f="cat:Social">Social</button>
    <button class="filter-btn" data-f="cat:Search">Search</button>
    <button class="filter-btn" data-f="cat:Programático">Programático</button>
    <button class="filter-btn" data-f="cat:Vídeo">Vídeo</button>
  </div>
</div>

<main>
<div class="table-wrap">
<table id="main-table">
<thead>
  <tr>
    <th style="width:18%">Atributo</th>
    <th class="th-plat"><span class="th-icon">📘</span>Meta Ads</th>
    <th class="th-plat"><span class="th-icon">🎵</span>TikTok Ads</th>
    <th class="th-plat"><span class="th-icon">💼</span>LinkedIn Ads</th>
    <th class="th-plat"><span class="th-icon">🔍</span>Google Search</th>
    <th class="th-plat"><span class="th-icon">📺</span>YouTube</th>
    <th class="th-plat"><span class="th-icon">📡</span>DV360/PG</th>
    <th class="th-plat"><span class="th-icon">🎯</span>CM360</th>
  </tr>
</thead>
<tbody id="tbody">
</tbody>
</table>
</div>
<div class="no-results" id="no-results">Nenhum resultado para <b id="no-term"></b></div>
</main>
<footer>Comparador de Plataformas · <a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none;">← Projeto NC</a></footer>

<script>
function b(cls,txt){return`<span class="badge ${cls}">${txt}</span>`}
function stars(n,max=5){return'<span class="stars">'+'★'.repeat(n)+'</span><span class="stars-empty">'+'★'.repeat(max-n)+'</span>'}

const ROWS = [
  {cat:"Objetivos & KPIs", items:[
    {attr:"Objetivos principais",sub:"",tags:["Awareness","Consideration","Conversão"],
      Meta:b('b-green','Awareness')+b('b-blue','Consid.')+b('b-purple','Conversão'),
      TikTok:b('b-green','Awareness')+b('b-blue','Tráfego')+b('b-purple','Conversão'),
      LinkedIn:b('b-green','Awareness')+b('b-blue','Leads')+b('b-purple','Conversão'),
      Search:b('b-purple','Conversão')+b('b-blue','Tráfego'),
      YouTube:b('b-green','Awareness')+b('b-blue','Consid.'),
      DV360:b('b-green','Awareness')+b('b-blue','Consid.')+b('b-purple','Conversão'),
      CM360:'Ad server — serve todos os objetivos'},
    {attr:"KPI primário",sub:"mais comum",tags:["Awareness","Consideration","Conversão"],
      Meta:'CPM · CPA · ROAS',TikTok:'CPM · CPA · CPV',LinkedIn:'CPL · CPM · CPC',
      Search:'CPC · CPA · ROAS',YouTube:'CPV · CPM',DV360:'CPM · CPA · Viewability',CM360:'Impression · Click · Conv.'},
    {attr:"Força em Awareness",sub:"",tags:["Awareness"],
      Meta:stars(5),TikTok:stars(5),LinkedIn:stars(3),Search:stars(2),YouTube:stars(5),DV360:stars(4),CM360:'N/A'},
    {attr:"Força em Conversão",sub:"",tags:["Conversão"],
      Meta:stars(5),TikTok:stars(4),LinkedIn:stars(3),Search:stars(5),YouTube:stars(3),DV360:stars(3),CM360:'N/A'},
    {attr:"Força em Leads B2B",sub:"",tags:["Consideration"],
      Meta:stars(4),TikTok:stars(2),LinkedIn:stars(5),Search:stars(4),YouTube:stars(3),DV360:stars(2),CM360:'N/A'},
  ]},
  {cat:"Segmentação", items:[
    {attr:"Segmentação por interesse",sub:"",tags:["Mídia Paga","Social","Programático"],
      Meta:b('b-green','Ampla'),TikTok:b('b-green','Ampla'),LinkedIn:b('b-blue','Profissional'),
      Search:b('b-gray','Limitada'),YouTube:b('b-green','Ampla'),DV360:b('b-green','Ampla'),CM360:'N/A'},
    {attr:"Segmentação por cargo/empresa",sub:"B2B",tags:["Social"],
      Meta:b('b-blue','Parcial'),TikTok:b('b-gray','Limitada'),LinkedIn:b('b-green','Nativo'),
      Search:b('b-gray','Não'),YouTube:b('b-gray','Não'),DV360:b('b-blue','Via audience'),CM360:'N/A'},
    {attr:"Segmentação por palavra-chave",sub:"",tags:["Search"],
      Meta:b('b-gray','Não'),TikTok:b('b-gray','Não'),LinkedIn:b('b-gray','Não'),
      Search:b('b-green','Nativo'),YouTube:b('b-blue','Parcial'),DV360:b('b-blue','Contextual'),CM360:'N/A'},
    {attr:"Custom Audience (1st party)",sub:"Upload de lista",tags:["Mídia Paga","Social","Programático"],
      Meta:b('b-green','Sim'),TikTok:b('b-green','Sim'),LinkedIn:b('b-green','Sim'),
      Search:b('b-green','Sim'),YouTube:b('b-green','Sim'),DV360:b('b-green','Sim'),CM360:'N/A'},
    {attr:"Lookalike",sub:"",tags:["Mídia Paga","Social"],
      Meta:b('b-green','Sim (Advantage+)'),TikTok:b('b-green','Sim'),LinkedIn:b('b-green','Sim'),
      Search:b('b-blue','Similar audiences'),YouTube:b('b-green','Sim'),DV360:b('b-blue','Via DMP'),CM360:'N/A'},
    {attr:"Retargeting de site",sub:"Pixel/Tag",tags:["Mídia Paga","Social","Programático"],
      Meta:b('b-green','Meta Pixel'),TikTok:b('b-green','TikTok Pixel'),LinkedIn:b('b-green','Insight Tag'),
      Search:b('b-green','Remarketing lists'),YouTube:b('b-green','Sim'),DV360:b('b-green','Floodlight'),CM360:b('b-green','Floodlight')},
    {attr:"Segmentação geográfica",sub:"",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:'País · Estado · Cidade · Raio',TikTok:'País · Estado · Cidade',LinkedIn:'País · Estado · Cidade',
      Search:'País · Estado · Cidade · Raio',YouTube:'País · Estado · Cidade',DV360:'País · Estado · DMA',CM360:'N/A'},
  ]},
  {cat:"Formatos & Criativos", items:[
    {attr:"Formatos de imagem",sub:"",tags:["Mídia Paga","Social"],
      Meta:'1:1 · 1.91:1 · 4:5',TikTok:'9:16 · 1:1',LinkedIn:'1.91:1 · 1:1',
      Search:'N/A',YouTube:'Companion 300×250',DV360:'Banner IAB',CM360:'Banner IAB · Rich Media'},
    {attr:"Formatos de vídeo",sub:"",tags:["Vídeo","Social"],
      Meta:'9:16 · 1:1 · 4:5 · 16:9',TikTok:'9:16 (obrigatório)',LinkedIn:'16:9 · 1:1 · 9:16',
      Search:'N/A',YouTube:'16:9 · 9:16 (Shorts)',DV360:'16:9 · VAST',CM360:'VAST · VPAID · SIMID'},
    {attr:"Vídeo skippable",sub:"",tags:["Vídeo"],
      Meta:b('b-blue','Após 3–5s'),TikTok:b('b-gray','Não'),LinkedIn:b('b-gray','Não'),
      Search:b('b-gray','N/A'),YouTube:b('b-green','Sim (5s)'),DV360:b('b-green','Configurável'),CM360:b('b-blue','Via VAST')},
    {attr:"Rich Media / HTML5",sub:"",tags:["Mídia Paga","Programático"],
      Meta:b('b-gray','Não'),TikTok:b('b-gray','Não'),LinkedIn:b('b-gray','Não'),
      Search:b('b-gray','Não'),YouTube:b('b-gray','Não'),DV360:b('b-green','Sim'),CM360:b('b-green','Sim')},
    {attr:"Criativo gerado pela plataforma",sub:"IA/automation",tags:["Mídia Paga","Social"],
      Meta:b('b-green','Advantage+ Creative'),TikTok:b('b-green','Smart Creative'),LinkedIn:b('b-blue','Dynamic Ads'),
      Search:b('b-green','RSA + PMax'),YouTube:b('b-green','Video builder'),DV360:b('b-gray','Não'),CM360:b('b-gray','Não')},
  ]},
  {cat:"Compra & Pricing", items:[
    {attr:"Modelo de compra",sub:"",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:'Leilão (CPM/CPC/CPA)',TikTok:'Leilão (CPM/CPV/CPA)',LinkedIn:'Leilão (CPM/CPC/CPL)',
      Search:'Leilão (CPC/CPA)',YouTube:'Leilão (CPV/CPM)',DV360:'RTB · PMP · PG',CM360:'N/A — ad server'},
    {attr:"CPM médio Brasil",sub:"referência 2025",tags:["Mídia Paga","Social","Vídeo","Programático"],
      Meta:'R$ 8–20',TikTok:'R$ 15–35',LinkedIn:'R$ 60–150',
      Search:'N/A (CPC)',YouTube:'R$ 12–35',DV360:'R$ 5–40 (varia)',CM360:'N/A'},
    {attr:"Compra direta/reserva",sub:"",tags:["Programático"],
      Meta:b('b-gray','Não'),TikTok:b('b-blue','Parcial (TopView)'),LinkedIn:b('b-blue','Parcial'),
      Search:b('b-gray','Não'),YouTube:b('b-green','Masthead'),DV360:b('b-green','Programmatic Guaranteed'),CM360:'N/A'},
    {attr:"Investimento mínimo",sub:"",tags:["Mídia Paga","Social","Search"],
      Meta:'~R$5/dia',TikTok:'~R$25/dia',LinkedIn:'~R$50/dia',
      Search:'~R$10/dia',YouTube:'Sem mínimo formal',DV360:'Sem mínimo (DSP)',CM360:'Licença/CPM'},
  ]},
  {cat:"Mensuração & Brand Safety", items:[
    {attr:"Viewability (padrão MRC)",sub:"",tags:["Mídia Paga","Programático"],
      Meta:b('b-blue','Parcial — não MRC oficial'),TikTok:b('b-blue','Parcial'),LinkedIn:b('b-blue','Parcial'),
      Search:b('b-gray','N/A'),YouTube:b('b-green','Active View (MRC)'),DV360:b('b-green','IAS/DV integrado'),CM360:b('b-green','IAS/DV integrado')},
    {attr:"Brand Safety (IAS/DV/DoubleVerify)",sub:"",tags:["Mídia Paga","Programático"],
      Meta:b('b-blue','Limitado'),TikTok:b('b-blue','IAS/DV parcial'),LinkedIn:b('b-blue','Limitado'),
      Search:b('b-gray','N/A'),YouTube:b('b-green','Brand Suitability'),DV360:b('b-green','Pre-bid IAS/DV'),CM360:b('b-blue','Post-bid')},
    {attr:"Atribuição multi-touch",sub:"",tags:["Mídia Paga","Programático"],
      Meta:b('b-blue','Atrib. própria'),TikTok:b('b-gray','Limitada'),LinkedIn:b('b-gray','Last touch'),
      Search:b('b-green','Data-driven'),YouTube:b('b-blue','Google Ads'),DV360:b('b-green','Floodlight'),CM360:b('b-green','Floodlight cross-channel')},
    {attr:"Relatório em tempo real",sub:"",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:b('b-green','Sim'),TikTok:b('b-green','Sim'),LinkedIn:b('b-green','Sim'),
      Search:b('b-green','Sim'),YouTube:b('b-green','Sim'),DV360:b('b-blue','~3h delay'),CM360:b('b-blue','~6h delay')},
    {attr:"Integração com CM360",sub:"ad serving",tags:["Programático"],
      Meta:b('b-blue','Via tag'),TikTok:b('b-blue','Via tag'),LinkedIn:b('b-blue','Via tag'),
      Search:b('b-gray','Não'),YouTube:b('b-green','Nativa'),DV360:b('b-green','Nativa'),CM360:'—'},
  ]},
  {cat:"Tecnologia & Operação", items:[
    {attr:"Ad server necessário",sub:"",tags:["Programático"],
      Meta:b('b-gray','Não'),TikTok:b('b-gray','Não'),LinkedIn:b('b-gray','Não'),
      Search:b('b-gray','Não'),YouTube:b('b-blue','Opcional (CM360)'),DV360:b('b-green','CM360'),CM360:'—'},
    {attr:"API de automação",sub:"",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:b('b-green','Meta Marketing API'),TikTok:b('b-green','TikTok Ads API'),LinkedIn:b('b-green','Marketing API'),
      Search:b('b-green','Google Ads API'),YouTube:b('b-green','YouTube Data API'),DV360:b('b-green','DV360 API'),CM360:b('b-green','DCM/DFA API')},
    {attr:"Curva de aprendizado",sub:"para operação",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:stars(2),TikTok:stars(2),LinkedIn:stars(3),
      Search:stars(3),YouTube:stars(3),DV360:stars(5),CM360:stars(4)},
    {attr:"Self-serve",sub:"",tags:["Mídia Paga","Social","Search","Programático"],
      Meta:b('b-green','Sim'),TikTok:b('b-green','Sim'),LinkedIn:b('b-green','Sim'),
      Search:b('b-green','Sim'),YouTube:b('b-green','Sim'),DV360:b('b-blue','Acesso restrito'),CM360:b('b-blue','Acesso restrito')},
  ]},
];

const COLS = ['Meta','TikTok','LinkedIn','Search','YouTube','DV360','CM360'];
let activeFilter = 'all';

function render(q='') {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let visible = 0;
  ROWS.forEach(group => {
    const items = group.items.filter(item => {
      const hay = [item.attr, item.sub, ...Object.values(item)].join(' ').toLowerCase();
      const matchQ = !q || hay.includes(q.toLowerCase());
      const matchF = activeFilter==='all' ||
        (activeFilter.startsWith('obj:') && (item.tags||[]).includes(activeFilter.slice(4))) ||
        (activeFilter.startsWith('cat:') && (item.tags||[]).includes(activeFilter.slice(4)));
      return matchQ && matchF;
    });
    if(!items.length) return;
    visible += items.length;
    const secTr = document.createElement('tr');
    secTr.className = 'section-row';
    secTr.innerHTML = `<td colspan="8">${group.cat}</td>`;
    tbody.appendChild(secTr);
    items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="td-attr">${item.attr}</span>${item.sub?`<span class="td-sub">${item.sub}</span>`:''}</td>`+
        COLS.map(c=>`<td>${item[c]||'—'}</td>`).join('');
      tbody.appendChild(tr);
    });
  });
  document.getElementById('no-results').style.display = visible?'none':'block';
  if(!visible) document.getElementById('no-term').textContent = `"${q||activeFilter}"`;
}

document.getElementById('search').addEventListener('input', e => render(e.target.value.trim()));
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    render(document.getElementById('search').value.trim());
  });
});

render();
</script>
</body>
</html>
