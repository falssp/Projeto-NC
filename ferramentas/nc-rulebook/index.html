<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NC Rulebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--card:#fff;--border:#e4e4e7;
  --fg:#18181b;--muted:#71717a;--mono:'JetBrains Mono',monospace;
  --accent:#0ea5e9;--accent-fg:#fff;--accent-light:#e0f2fe;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-border:#bbf7d0;
  --err:#dc2626;--err-bg:#fef2f2;--err-border:#fecaca;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#082f49;
  --ok-bg:#052e16;--ok-border:#166534;
  --err-bg:#450a0a;--err-border:#991b1b;
  --warn-bg:#1c1407;--warn-border:#92400e;
}}
:root[data-theme="dark"]{
  --bg:#0f0f11;--surface:#18181b;--card:#1e1e21;--border:#27272a;
  --fg:#fafafa;--muted:#a1a1aa;--accent-light:#082f49;
  --ok-bg:#052e16;--ok-border:#166534;
  --err-bg:#450a0a;--err-border:#991b1b;
  --warn-bg:#1c1407;--warn-border:#92400e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;padding:0 0 60px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700;flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-primary:hover{opacity:.88}
.btn-sm{padding:5px 10px;font-size:11px}
.wrap{max-width:860px;margin:0 auto;padding:24px}

/* hero name */
.rulebook-name{font-size:22px;font-weight:800;margin-bottom:4px}
.rulebook-ver{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:24px}

/* section card */
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title span{font-size:16px}

/* form elements */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;outline:none;transition:.15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:60px;resize:vertical;line-height:1.5}
.form-group input[type=number]{font-family:var(--mono)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.mono-input input{font-family:var(--mono);font-size:12px}

/* segments order */
.seg-order-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.seg-order-row{display:flex;align-items:center;gap:8px}
.seg-pos{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px;text-align:right}
.seg-order-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12px;font-family:var(--mono);font-weight:600;outline:none}
.seg-order-row select{padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:11px;background:var(--surface);color:var(--fg)}
.seg-del-btn{background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 8px;transition:.12s}
.seg-del-btn:hover{background:#fee2e2;border-color:#fca5a5;color:var(--err)}

/* examples */
.example-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.example-row{display:flex;align-items:center;gap:8px}
.example-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12px;font-family:var(--mono);font-weight:600;outline:none}
.ex-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px;flex-shrink:0}
.ex-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.ex-bad{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.example-del{background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 8px}
.example-del:hover{color:var(--err)}

/* preview */
.preview-panel{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.preview-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:10px}
.preview-nc{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--fg);margin-bottom:6px;word-break:break-all}
.preview-breakdown{display:flex;flex-wrap:wrap;gap:4px}
.pv-seg{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface);color:var(--fg);border:1px solid var(--border)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#18181b;color:#fff;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:600;transition:.25s;opacity:0;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.save-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;justify-content:flex-end;z-index:50}
.save-hint{font-size:11px;color:var(--muted);flex:1}
</style>
</head>
<body>

<header>
  <span style="font-size:18px">📋</span>
  <h1>NC Rulebook</h1>
  <button class="btn" onclick="exportJSON()">↓ JSON</button>
  <button class="btn" onclick="exportMarkdown()">↓ Markdown</button>
  <button class="btn" id="themeBtn" onclick="toggleTheme()">◑</button>
</header>

<div class="wrap">
  <!-- Identity -->
  <div class="form-group">
    <label>Nome da naming convention</label>
    <input id="rbName" type="text" placeholder="ex: NC Padrão Campanhas 2025" oninput="updatePreview()">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Versão</label>
      <input id="rbVer" type="text" placeholder="ex: v3.1" class="mono-input">
    </div>
    <div class="form-group">
      <label>Responsável</label>
      <input id="rbOwner" type="text" placeholder="ex: Time de Analytics">
    </div>
  </div>
  <div class="form-group">
    <label>Descrição</label>
    <textarea id="rbDesc" placeholder="Descreva o objetivo e escopo desta naming convention…"></textarea>
  </div>

  <!-- Estrutura -->
  <div class="sec">
    <div class="sec-title"><span>🧩</span>Estrutura & Separador</div>
    <div class="form-row">
      <div class="form-group">
        <label>Separador oficial</label>
        <select id="rbSep" onchange="updatePreview()">
          <option value="_">_ underscore</option>
          <option value="-">- hífen</option>
          <option value=".">. ponto</option>
          <option value="|">| pipe</option>
        </select>
      </div>
      <div class="form-group">
        <label>Case</label>
        <select id="rbCase">
          <option value="lower">Apenas minúsculas</option>
          <option value="upper">Apenas maiúsculas</option>
          <option value="mixed">Misto (sem restrição)</option>
          <option value="camel">camelCase</option>
          <option value="snake">snake_case</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mínimo de segmentos</label>
        <input id="rbMin" type="number" min="1" max="20" value="3" oninput="updatePreview()">
      </div>
      <div class="form-group">
        <label>Máximo de segmentos</label>
        <input id="rbMax" type="number" min="1" max="20" value="6" oninput="updatePreview()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Comprimento máximo (chars)</label>
        <input id="rbLen" type="number" min="10" max="500" value="80" oninput="updatePreview()">
      </div>
      <div class="form-group">
        <label>Regex permitida (opcional)</label>
        <input id="rbRegex" type="text" placeholder="ex: ^[a-z0-9_]+$" class="mono-input">
        <div class="hint">Deixe em branco para usar as regras de case</div>
      </div>
    </div>
  </div>

  <!-- Segments order -->
  <div class="sec">
    <div class="sec-title"><span>📌</span>Ordem dos Segmentos</div>
    <div class="seg-order-list" id="segOrderList"></div>
    <button class="btn btn-sm" onclick="addSegRow()">+ Segmento</button>
    <div id="previewPanel" class="preview-panel" style="margin-top:16px">
      <div class="preview-title">Prévia estrutural</div>
      <div class="preview-nc" id="prevNc">—</div>
      <div class="preview-breakdown" id="prevBreak"></div>
    </div>
  </div>

  <!-- Rules -->
  <div class="sec">
    <div class="sec-title"><span>⚠️</span>Regras Adicionais</div>
    <div class="form-group">
      <label>Proibições</label>
      <textarea id="rbForbid" placeholder="ex: Não usar datas no formato DD/MM/AAAA&#10;Não usar nomes de pessoas&#10;Não usar acentos ou caracteres especiais"></textarea>
    </div>
    <div class="form-group">
      <label>Obrigações</label>
      <textarea id="rbRequired" placeholder="ex: Sempre incluir o segmento de canal&#10;O segmento de período deve estar no formato YYYYMM"></textarea>
    </div>
  </div>

  <!-- Examples -->
  <div class="sec">
    <div class="sec-title"><span>✅</span>Exemplos Corretos</div>
    <div class="example-list" id="okList"></div>
    <button class="btn btn-sm" onclick="addExample('ok')">+ Exemplo</button>
  </div>

  <div class="sec">
    <div class="sec-title"><span>❌</span>Exemplos Incorretos</div>
    <div class="example-list" id="badList"></div>
    <button class="btn btn-sm" onclick="addExample('bad')">+ Exemplo</button>
  </div>

  <!-- Notes -->
  <div class="sec">
    <div class="sec-title"><span>📝</span>Notas & Exceções</div>
    <textarea id="rbNotes" placeholder="Documente casos especiais, exceções aprovadas ou decisões de design…" style="width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;line-height:1.5;outline:none"></textarea>
  </div>
</div>

<div class="save-bar">
  <span class="save-hint" id="saveHint">Alterações não salvas</span>
  <button class="btn" onclick="resetForm()">Resetar</button>
  <button class="btn btn-primary" onclick="saveRulebook()">💾 Salvar</button>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='nc_rulebook_v1';
const THEME_KEY='ncbook_theme';
let _segs=[];
let _okEx=[];
let _badEx=[];
let _dirty=false;

// ── Theme ────────────────────────────────────────────────────────────────
function initTheme(){
  const t=localStorage.getItem(THEME_KEY)||'system';
  if(t!=='system') document.documentElement.setAttribute('data-theme',t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(THEME_KEY,next);
}

// ── Load/Save ────────────────────────────────────────────────────────────
function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(!s) return;
    const d=JSON.parse(s);
    document.getElementById('rbName').value=d.name||'';
    document.getElementById('rbVer').value=d.version||'';
    document.getElementById('rbOwner').value=d.owner||'';
    document.getElementById('rbDesc').value=d.desc||'';
    document.getElementById('rbSep').value=d.sep||'_';
    document.getElementById('rbCase').value=d.caseRule||'lower';
    document.getElementById('rbMin').value=d.min??3;
    document.getElementById('rbMax').value=d.max??6;
    document.getElementById('rbLen').value=d.maxLen??80;
    document.getElementById('rbRegex').value=d.regex||'';
    document.getElementById('rbForbid').value=d.forbid||'';
    document.getElementById('rbRequired').value=d.required||'';
    document.getElementById('rbNotes').value=d.notes||'';
    _segs=d.segs||[];
    _okEx=d.okEx||[];
    _badEx=d.badEx||[];
  }catch(e){}
  if(!_segs.length) _segs=[{name:'canal',required:true},{name:'objetivo',required:true},{name:'produto',required:false},{name:'formato',required:false}];
  if(!_okEx.length) _okEx=[''];
  if(!_badEx.length) _badEx=[''];
  renderSegList();
  renderExamples();
  updatePreview();
  _dirty=false;
  document.getElementById('saveHint').textContent='Sem alterações';
}

function collectData(){
  return {
    name:document.getElementById('rbName').value.trim(),
    version:document.getElementById('rbVer').value.trim(),
    owner:document.getElementById('rbOwner').value.trim(),
    desc:document.getElementById('rbDesc').value.trim(),
    sep:document.getElementById('rbSep').value,
    caseRule:document.getElementById('rbCase').value,
    min:parseInt(document.getElementById('rbMin').value)||3,
    max:parseInt(document.getElementById('rbMax').value)||6,
    maxLen:parseInt(document.getElementById('rbLen').value)||80,
    regex:document.getElementById('rbRegex').value.trim(),
    forbid:document.getElementById('rbForbid').value.trim(),
    required:document.getElementById('rbRequired').value.trim(),
    notes:document.getElementById('rbNotes').value.trim(),
    segs:collectSegs(),
    okEx:collectExamples('ok'),
    badEx:collectExamples('bad'),
    savedAt:new Date().toISOString(),
  };
}

function saveRulebook(){
  const d=collectData();
  try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
  _dirty=false;
  document.getElementById('saveHint').textContent='Salvo em '+new Date().toLocaleTimeString('pt-BR');
  showToast('✓ Rulebook salvo');
}

function markDirty(){
  if(!_dirty){_dirty=true;document.getElementById('saveHint').textContent='Alterações não salvas';}
}
document.addEventListener('input',markDirty);

function resetForm(){
  if(!confirm('Resetar tudo?')) return;
  localStorage.removeItem(KEY);
  _segs=[];_okEx=[];_badEx=[];
  load();
  showToast('Resetado');
}

// ── Segments ─────────────────────────────────────────────────────────────
function renderSegList(){
  const list=document.getElementById('segOrderList');
  list.innerHTML=_segs.map((s,i)=>`
    <div class="seg-order-row">
      <span class="seg-pos">${i+1}.</span>
      <input type="text" value="${esc(s.name)}" id="seg_${i}" oninput="updatePreview()" placeholder="nome do segmento">
      <select id="segReq_${i}" title="Obrigatório?">
        <option value="1" ${s.required?'selected':''}>Obrigatório</option>
        <option value="0" ${!s.required?'selected':''}>Opcional</option>
      </select>
      <button class="seg-del-btn" onclick="delSeg(${i})">✕</button>
    </div>`).join('');
}

function collectSegs(){
  return _segs.map((_,i)=>({
    name:(document.getElementById('seg_'+i)||{}).value||_segs[i].name,
    required:document.getElementById('segReq_'+i)?.value==='1'
  }));
}

function addSegRow(){
  _segs.push({name:'novo',required:false});
  renderSegList();
  updatePreview();
}
function delSeg(i){
  _segs.splice(i,1);
  renderSegList();
  updatePreview();
}

// ── Examples ─────────────────────────────────────────────────────────────
function renderExamples(){
  renderExList('ok',_okEx);
  renderExList('bad',_badEx);
}
function renderExList(type,arr){
  const id=type==='ok'?'okList':'badList';
  document.getElementById(id).innerHTML=arr.map((v,i)=>`
    <div class="example-row">
      <span class="ex-badge ${type==='ok'?'ex-ok':'ex-bad'}">${type==='ok'?'✓ OK':'✗ RUIM'}</span>
      <input type="text" value="${esc(v)}" id="ex_${type}_${i}" placeholder="exemplo de NC…" style="font-family:var(--mono);font-size:12px">
      <button class="example-del" onclick="delExample('${type}',${i})">✕</button>
    </div>`).join('');
}
function collectExamples(type){
  const arr=type==='ok'?_okEx:_badEx;
  return arr.map((_,i)=>document.getElementById(`ex_${type}_${i}`)?.value||'').filter(Boolean);
}
function addExample(type){
  if(type==='ok') _okEx.push('');
  else _badEx.push('');
  renderExamples();
}
function delExample(type,i){
  if(type==='ok') _okEx.splice(i,1);
  else _badEx.splice(i,1);
  renderExamples();
}

// ── Preview ───────────────────────────────────────────────────────────────
function updatePreview(){
  const sep=document.getElementById('rbSep').value||'_';
  const segsNow=_segs.map((_,i)=>{
    const el=document.getElementById('seg_'+i);
    return el?el.value||_segs[i].name:_segs[i].name;
  });
  const nc=segsNow.join(sep)||'—';
  document.getElementById('prevNc').textContent=nc;
  const colors=['#6366f1','#8b5cf6','#ec4899','#14b8a6','#f59e0b','#ef4444','#06b6d4','#10b981'];
  document.getElementById('prevBreak').innerHTML=segsNow.map((s,i)=>
    `<span class="pv-seg" style="border-color:${colors[i%colors.length]};color:${colors[i%colors.length]}">${esc(s)}</span>`
  ).join('');
}

// ── Export ────────────────────────────────────────────────────────────────
function exportJSON(){
  const d=collectData();
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='nc-rulebook.json';a.click();
  showToast('✓ JSON exportado');
}
function exportMarkdown(){
  const d=collectData();
  const sep=d.sep||'_';
  const segsRows=d.segs.map((s,i)=>`| ${i+1} | \`${s.name}\` | ${s.required?'✅ Sim':'➖ Opcional'} |`).join('\n');
  const okRows=(d.okEx||[]).filter(Boolean).map(e=>`- ✅ \`${e}\``).join('\n');
  const badRows=(d.badEx||[]).filter(Boolean).map(e=>`- ❌ \`${e}\``).join('\n');
  const md=`# ${d.name||'NC Rulebook'}
Versão: **${d.version||'—'}** | Responsável: **${d.owner||'—'}**

> ${d.desc||''}

## Estrutura

| Propriedade | Valor |
|-------------|-------|
| Separador | \`${sep}\` |
| Case | ${d.caseRule||'lower'} |
| Segmentos | ${d.min}–${d.max} |
| Comprimento máx. | ${d.maxLen} chars |
${d.regex?`| Regex | \`${d.regex}\` |`:''}

## Ordem dos Segmentos

| Pos | Segmento | Obrigatório |
|-----|----------|-------------|
${segsRows}

**Prévia:** \`${d.segs.map(s=>s.name).join(sep)}\`

## Regras

### Proibições
${d.forbid||'—'}

### Obrigações
${d.required||'—'}

## Exemplos

### Corretos
${okRows||'—'}

### Incorretos
${badRows||'—'}

## Notas & Exceções
${d.notes||'—'}

---
*Gerado em ${new Date().toLocaleString('pt-BR')} via NC Rulebook*
`;
  const a=document.createElement('a');
  a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(md);
  a.download='nc-rulebook.md';a.click();
  showToast('✓ Markdown exportado');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let _toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

initTheme();
load();
</script>
</body>
</html>
