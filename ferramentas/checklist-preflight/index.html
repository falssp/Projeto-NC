<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist de Pre-flight | NC Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;
  --bg:#f0f2ff;--surface:#fff;--border:#d6dbf2;--muted:#9fa8da;
  --text:#1a237e;--body:#3d4a8a;
  --ok:#2e7d32;--ok-bg:#f1f8e9;--warn:#e65100;--warn-bg:#fff3e0;
  --danger:#c62828;--danger-bg:#ffebee;
}
[data-theme="dark"]{
  --azul:#7c8fff;--escuro:#c5cae9;--light:#1e2340;
  --bg:#0f1117;--surface:#161b2a;--border:#263060;--muted:#5c6a9e;
  --text:#c5cae9;--body:#9fa8da;--ok:#a5d6a7;--ok-bg:#0a2010;--warn:#ffcc80;--warn-bg:#2a1800;
  --danger:#ef9a9a;--danger-bg:#2a0a0a;
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--azul);text-decoration:none;opacity:.7;padding:16px 24px 0}
a.back:hover{opacity:1}
.header{padding:12px 24px 0}
h1{font-size:22px;font-weight:700;color:var(--escuro)}
.subtitle{font-size:13px;color:var(--body);margin-top:4px;margin-bottom:12px}
.main{padding:0 24px 32px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
button{padding:7px 16px;font-size:13px;font-weight:600;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--azul);color:#fff}.btn-primary:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:12px;background:var(--light);color:var(--azul);border:1px solid var(--border)}.btn-sm:hover{background:var(--border)}
input[type=text]{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--escuro);outline:none;width:100%}
input[type=text]:focus{border-color:var(--azul)}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.fixed-btns{position:fixed;top:14px;right:18px;z-index:900;display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--azul);background:var(--surface);color:var(--azul);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:all .15s;font-family:inherit}
.icon-btn:hover{background:var(--azul);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a237e;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* progress bar */
.progress-wrap{background:var(--border);border-radius:8px;height:10px;overflow:hidden;margin:8px 0 2px}
.progress-fill{height:100%;border-radius:8px;transition:width .3s,background .3s}
.prog-label{font-size:12px;color:var(--body);margin-bottom:4px}

/* filter chips */
.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:3px 11px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--body)}
.chip.active{background:var(--azul);color:#fff;border-color:var(--azul)}

/* category */
.cat-block{margin-bottom:14px}
.cat-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;user-select:none}
.cat-icon{font-size:16px}
.cat-title{font-size:13px;font-weight:700;color:var(--escuro)}
.cat-prog{font-size:11px;color:var(--muted);margin-left:auto}
.cat-toggle{font-size:11px;color:var(--muted);margin-left:4px}

/* checklist item */
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.cl-item:first-child{border-top:0}
.cl-cb{width:18px;height:18px;accent-color:var(--azul);cursor:pointer;margin-top:2px;flex-shrink:0}
.cl-body{flex:1;min-width:0}
.cl-label{font-size:13px;color:var(--text);cursor:pointer;line-height:1.4}
.cl-label.done{text-decoration:line-through;color:var(--muted)}
.cl-hint{font-size:11px;color:var(--muted);margin-top:2px}
.cl-prio{padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;margin-left:5px}
.prio-must{background:var(--danger-bg);color:var(--danger)}
.prio-high{background:var(--warn-bg);color:var(--warn)}
.prio-nice{background:var(--light);color:var(--azul)}

/* summary */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum-tile{background:var(--light);border-radius:8px;padding:8px 10px;text-align:center}
.sum-val{font-size:20px;font-weight:700;color:var(--azul)}
.sum-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ready-banner{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:10px;padding:12px 16px;text-align:center;font-weight:700;color:var(--ok);font-size:15px;display:none}
.notready-banner{background:var(--danger-bg);border:1.5px solid var(--danger);border-radius:10px;padding:12px 16px;text-align:center;font-weight:700;color:var(--danger);font-size:15px;display:none}
</style>
</head>
<body>
<div class="fixed-btns">
  <button class="icon-btn" onclick="toggleDark()" id="theme-btn">🌙</button>
</div>
<div id="toast" class="toast"></div>
<a class="back" href="/Projeto-NC/ferramentas/">← Ferramentas</a>
<div class="header">
  <h1>Checklist de Pre-flight de Campanha</h1>
  <p class="subtitle">Verifique tudo antes de ativar a campanha. Itens marcados como MUST são bloqueantes para o go-live.</p>
</div>
<div class="main">

<div class="card">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <input type="text" id="campaign-name" placeholder="Nome da campanha (opcional)">
    </div>
    <button class="btn-sm" onclick="resetAll()">↺ Resetar tudo</button>
    <button class="btn-sm" onclick="copyReport()">📋 Copiar relatório</button>
  </div>
  <div style="margin-top:12px">
    <div class="prog-label" id="prog-label">0 de 0 itens concluídos</div>
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="summary-row" style="margin-top:10px" id="summary-row"></div>
  <div id="ready-banner" class="ready-banner" style="margin-top:10px">✅ Campanha pronta para go-live!</div>
  <div id="notready-banner" class="notready-banner" style="margin-top:10px">🚫 Itens MUST pendentes — não ative ainda.</div>
</div>

<div class="card">
  <div class="chip-row" id="filter-row"></div>
  <div id="checklist"></div>
</div>

</div>
<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
function toggleDark(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('theme-btn').textContent=d?'🌙':'☀️';}

const CATEGORIES=[
  {id:'setup',icon:'⚙️',title:'Setup Geral',items:[
    {id:'c1',label:'Datas de início e fim corretas no ad server',hint:'Verifique fuso horário — o ad server pode estar em UTC.',prio:'must'},
    {id:'c2',label:'Budget total e cap diário configurados',hint:'Confirme se é budget diário ou flight total.',prio:'must'},
    {id:'c3',label:'Naming convention seguido em todas as entidades',hint:'Campanha, Line Item, Creative — use a ferramenta Naming Convention Builder.',prio:'must'},
    {id:'c4',label:'Advertiser e Floodlight Configuration corretos',hint:'Especialmente em contas com múltiplos anunciantes.',prio:'must'},
    {id:'c5',label:'Pacing configurado (even / front-loaded / ASAP)',prio:'high'},
    {id:'c6',label:'Frequência cap definida',hint:'Recomendado: 3–5 por semana para branding; sem cap para performance.',prio:'high'},
  ]},
  {id:'criativos',icon:'🎨',title:'Criativos',items:[
    {id:'cr1',label:'Todos os criativos aprovados pela plataforma',prio:'must'},
    {id:'cr2',label:'Dimensões e peso dentro das specs da plataforma',hint:'Verifique em Specs de Criativos se precisar.',prio:'must'},
    {id:'cr3',label:'Click-through URL correta e sem macros não substituídas',prio:'must'},
    {id:'cr4',label:'Landing page abre corretamente em mobile e desktop',prio:'must'},
    {id:'cr5',label:'Criativos atribuídos a todas as line items',prio:'must'},
    {id:'cr6',label:'UTMs presentes na URL de destino',hint:'Use o Gerador de UTM.',prio:'high'},
    {id:'cr7',label:'Variantes de criativo (A/B) configuradas se necessário',prio:'nice'},
    {id:'cr8',label:'AdChoices / Label de publicidade presente (se obrigatório)',prio:'high'},
  ]},
  {id:'tags',icon:'🏷️',title:'Tags & Pixels',items:[
    {id:'t1',label:'Tag de impression tracker disparando corretamente',hint:'Teste com o Inspector de Tag CM360.',prio:'must'},
    {id:'t2',label:'Tag de click tracker disparando corretamente',prio:'must'},
    {id:'t3',label:'Floodlight de conversão instalado e validado',hint:'Confirme via CM360 Tag Manager ou console do browser.',prio:'must'},
    {id:'t4',label:'Cachebuster dinâmico presente na tag ([timestamp] ou macro equivalente)',prio:'must'},
    {id:'t5',label:'Macros de GDPR/consent configuradas (${GDPR}, ${GDPR_CONSENT_NNN})',prio:'high'},
    {id:'t6',label:'Pixel de remarketing instalado na página de produto',prio:'high'},
    {id:'t7',label:'Teste de disparo do Floodlight documentado (screenshot ou HAR)',prio:'nice'},
  ]},
  {id:'targeting',icon:'🎯',title:'Targeting',items:[
    {id:'tg1',label:'Geo targeting configurado e revisado',prio:'must'},
    {id:'tg2',label:'Audiência-alvo aplicada nas line items corretas',prio:'must'},
    {id:'tg3',label:'Brand safety / category exclusions ativas',prio:'high'},
    {id:'tg4',label:'Listas de exclusão (competitor keywords, placements) aplicadas',prio:'high'},
    {id:'tg5',label:'Dispositivos e ambientes corretos (desktop/mobile/app/CTV)',prio:'high'},
    {id:'tg6',label:'Horário de veiculação (dayparting) configurado se necessário',prio:'nice'},
    {id:'tg7',label:'Viewability target configurado (se programático)',prio:'nice'},
  ]},
  {id:'tracking',icon:'📊',title:'Tracking & Relatórios',items:[
    {id:'tr1',label:'Plano de métricas e KPIs documentado',prio:'must'},
    {id:'tr2',label:'Dashboard de monitoramento configurado',prio:'high'},
    {id:'tr3',label:'Alertas de pacing e spend configurados',hint:'Alertas de subeentrega ≤80% ou sobreentrega ≥110%.',prio:'high'},
    {id:'tr4',label:'Integração GA4/Analytics validada (se aplicável)',prio:'high'},
    {id:'tr5',label:'Relatório de discrepância agendado (se múltiplos ad servers)',prio:'nice'},
    {id:'tr6',label:'Acesso ao dashboard compartilhado com o cliente',prio:'nice'},
  ]},
  {id:'legal',icon:'⚖️',title:'Legal & Compliance',items:[
    {id:'l1',label:'Consent Management Platform (CMP) ativa na landing page',prio:'must'},
    {id:'l2',label:'Criativos revisados pelo jurídico / compliance do cliente',prio:'must'},
    {id:'l3',label:'Disclaimers legais presentes (se produto financeiro, farma, etc.)',prio:'must'},
    {id:'l4',label:'LGPD/GDPR: dados de remarketing coletados com opt-in',prio:'must'},
    {id:'l5',label:'Criativos não direcionados a menores (COPPA/TFUA configurado)',prio:'high'},
  ]},
  {id:'billing',icon:'💳',title:'Billing & Ordem',items:[
    {id:'b1',label:'IO (Insertion Order) assinado',prio:'must'},
    {id:'b2',label:'Budget aprovado pelo cliente',prio:'must'},
    {id:'b3',label:'Flighting alinhado com a OV do cliente',prio:'must'},
    {id:'b4',label:'Taxa de agência / markup configurado corretamente',prio:'high'},
  ]},
];

let _state={};
let _filter='all';

function getState(){return _state;}

function toggleItem(id){
  _state[id]=!_state[id];
  renderProgress();
  renderChecklist();
  saveLocal();
}

function resetAll(){
  _state={};
  saveLocal();
  renderProgress();
  renderChecklist();
}

function saveLocal(){try{localStorage.setItem('preflight_state',JSON.stringify(_state));}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem('preflight_state');if(s)_state=JSON.parse(s);}catch(e){}}

function allItems(){return CATEGORIES.flatMap(c=>c.items);}

function renderProgress(){
  const all=allItems();
  const done=all.filter(i=>_state[i.id]).length;
  const must=all.filter(i=>i.prio==='must');
  const mustDone=must.filter(i=>_state[i.id]).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  const fill=document.getElementById('prog-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct===100?'var(--ok)':pct>=70?'var(--azul)':'var(--warn)';
  document.getElementById('prog-label').textContent=`${done} de ${all.length} itens concluídos (${pct}%)`;

  const high=all.filter(i=>i.prio==='high');
  const highDone=high.filter(i=>_state[i.id]).length;
  const nice=all.filter(i=>i.prio==='nice');
  const niceDone=nice.filter(i=>_state[i.id]).length;

  document.getElementById('summary-row').innerHTML=`
    <div class="sum-tile"><div class="sum-val" style="color:${mustDone===must.length?'var(--ok)':'var(--danger)'}">${mustDone}/${must.length}</div><div class="sum-label">Must</div></div>
    <div class="sum-tile"><div class="sum-val" style="color:${highDone===high.length?'var(--ok)':'var(--warn)'}">${highDone}/${high.length}</div><div class="sum-label">High</div></div>
    <div class="sum-tile"><div class="sum-val">${niceDone}/${nice.length}</div><div class="sum-label">Nice to have</div></div>
    <div class="sum-tile"><div class="sum-val">${pct}%</div><div class="sum-label">Total</div></div>
  `;

  const allMustDone=mustDone===must.length;
  document.getElementById('ready-banner').style.display=allMustDone&&done===all.length?'block':'none';
  document.getElementById('notready-banner').style.display=!allMustDone?'block':'none';
}

function renderFilters(){
  const all=allItems();
  const done=all.filter(i=>_state[i.id]).length;
  const pending=all.length-done;
  const filters=[
    {id:'all',label:'Todos'},
    {id:'must',label:'Must'},
    {id:'high',label:'High'},
    {id:'pending',label:`Pendentes (${pending})`},
    ...CATEGORIES.map(c=>({id:'cat_'+c.id,label:c.icon+' '+c.title}))
  ];
  document.getElementById('filter-row').innerHTML=filters.map(f=>`
    <div class="chip${_filter===f.id?' active':''}" onclick="setFilter('${f.id}')">${f.label}</div>`).join('');
}

function setFilter(f){_filter=f;renderFilters();renderChecklist();}

function renderChecklist(){
  renderFilters();
  let html='';
  CATEGORIES.forEach(cat=>{
    let items=cat.items;
    if(_filter==='must')items=items.filter(i=>i.prio==='must');
    else if(_filter==='high')items=items.filter(i=>i.prio==='high');
    else if(_filter==='pending')items=items.filter(i=>!_state[i.id]);
    else if(_filter.startsWith('cat_'))items=_filter==='cat_'+cat.id?items:[];
    if(!items.length)return;
    const done=cat.items.filter(i=>_state[i.id]).length;
    html+=`<div class="cat-block">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-prog">${done}/${cat.items.length}</span>
      </div>
      ${items.map(item=>`
        <div class="cl-item">
          <input type="checkbox" class="cl-cb" id="cb_${item.id}" ${_state[item.id]?'checked':''} onchange="toggleItem('${item.id}')">
          <div class="cl-body">
            <label class="cl-label${_state[item.id]?' done':''}" for="cb_${item.id}">${item.label}<span class="cl-prio prio-${item.prio}">${item.prio==='nice'?'nice to have':item.prio}</span></label>
            ${item.hint?`<div class="cl-hint">💡 ${item.hint}</div>`:''}
          </div>
        </div>`).join('')}
    </div>`;
  });
  document.getElementById('checklist').innerHTML=html;
}

function copyReport(){
  const camp=document.getElementById('campaign-name').value;
  const all=allItems();
  const done=all.filter(i=>_state[i.id]).length;
  const pct=Math.round(done/all.length*100);
  const must=all.filter(i=>i.prio==='must');
  const mustDone=must.filter(i=>_state[i.id]).length;
  let txt=`CHECKLIST PRE-FLIGHT${camp?' — '+camp:''}\n`;
  txt+=`Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
  txt+=`Progresso: ${done}/${all.length} (${pct}%)\n`;
  txt+=`Must: ${mustDone}/${must.length}\n\n`;
  CATEGORIES.forEach(cat=>{
    txt+=`## ${cat.title}\n`;
    cat.items.forEach(i=>{txt+=`${_state[i.id]?'[x]':'[ ]'} [${i.prio.toUpperCase()}] ${i.label}\n`;});
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>toast('Relatório copiado!'));
}

loadLocal();
renderProgress();
renderChecklist();
</script>
</body>
</html>
