<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Safety Checklist — NC Tool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#f4f5fb;color:#1a1a2e;min-height:100vh}
header{background:#1a237e;color:#fff;padding:16px 32px}
header h1{font-size:1.3rem;font-weight:700}
header p{font-size:.82rem;opacity:.7;margin-top:2px}
.main{padding:28px 32px;min-width:0}
.card{background:#fff;border:1px solid #d6dbf2;border-radius:10px;padding:20px;margin-bottom:20px}
.card-title{font-size:1rem;font-weight:700;color:#1a237e;margin-bottom:14px;display:flex;align-items:center;gap:8px}
label{font-size:.82rem;font-weight:600;color:#444}
input[type=text],select,textarea{width:100%;padding:8px 11px;border:1.5px solid #d6dbf2;border-radius:7px;font-family:inherit;font-size:.88rem;color:#1a1a2e;background:#fff}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:#1F36C7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:7px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#1F36C7;color:#fff}.btn-primary:hover{background:#1a2ea8}
.btn-secondary{background:#e8ecfd;color:#1F36C7}.btn-secondary:hover{background:#d6dbf2}
.btn-sm{padding:5px 10px;font-size:.78rem}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f4f5fb;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid #e8ecfd}
.section-header:hover{background:#e8ecfd}
.section-title{font-weight:700;font-size:.93rem;color:#1a237e;display:flex;align-items:center;gap:8px}
.section-badge{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:12px}
.badge-ok{background:#dcfce7;color:#15803d}
.badge-warn{background:#fef9c3;color:#a16207}
.badge-error{background:#fee2e2;color:#dc2626}
.section-body{display:none;border:1px solid #e8ecfd;border-top:none;border-radius:0 0 8px 8px;padding:0 2px 8px}
.section-body.open{display:block}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid #f4f5fb;transition:background .1s}
.check-item:hover{background:#f8f9ff}
.check-item:last-child{border-bottom:none}
.check-toggle{display:flex;gap:6px;flex-shrink:0;margin-top:1px}
.check-toggle button{border:none;border-radius:5px;padding:4px 8px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-ok{background:#dcfce7;color:#15803d}.btn-ok.active{background:#16a34a;color:#fff}
.btn-warn{background:#fef9c3;color:#a16207}.btn-warn.active{background:#ca8a04;color:#fff}
.btn-na{background:#f4f5fb;color:#666}.btn-na.active{background:#9ca3af;color:#fff}
.check-content{flex:1}
.check-label{font-weight:600;font-size:.88rem;margin-bottom:2px}
.check-desc{font-size:.8rem;color:#666;line-height:1.4}
.check-note{margin-top:6px}
.check-note input{font-size:.8rem;padding:5px 8px}
.score-ring{width:80px;height:80px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-weight:700;font-size:1rem;color:#1F36C7}
.score-lbl{font-size:.65rem;color:#888;display:block}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#e8ecfd;border-radius:8px;padding:10px 16px;text-align:center;min-width:80px}
.stat-val{font-size:1.3rem;font-weight:700;color:#1F36C7}
.stat-lbl{font-size:.72rem;color:#555;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.platform-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.plt-tab{padding:5px 12px;border-radius:20px;border:1.5px solid #d6dbf2;background:#fff;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.plt-tab.active{border-color:#1F36C7;background:#e8ecfd;color:#1F36C7}
footer{text-align:center;padding:20px;color:#999;font-size:.78rem;border-top:1px solid #d6dbf2;margin-top:40px}
@media(max-width:768px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🛡️ Brand Safety Checklist</h1>
  <p>Avalie e documente configurações de brand safety em campanhas digitais — NC Tool AdOps Suite</p>
</header>

<div class="main">
  <div class="card">
    <div class="card-title">📋 Informações da campanha</div>
    <div class="grid3">
      <div><label>Anunciante</label><input type="text" id="advName" placeholder="ex: Nike Brasil" oninput="saveState()"></div>
      <div><label>Campanha</label><input type="text" id="campName" placeholder="ex: Brand Awareness Nov24" oninput="saveState()"></div>
      <div><label>Responsável</label><input type="text" id="responsible" placeholder="ex: João Silva" oninput="saveState()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🌐 Plataformas em avaliação</div>
    <div class="platform-tabs" id="platformTabs"></div>
    <button class="btn btn-secondary btn-sm" onclick="addPlatform()">+ Plataforma</button>
  </div>

  <div class="card">
    <div class="card-title">📊 Resumo geral</div>
    <div class="stat-row" id="summaryStats"></div>
    <div id="summaryProgress"></div>
  </div>

  <div id="checklistSections"></div>

  <div class="actions">
    <button class="btn btn-primary btn-sm" onclick="exportReport()">📄 Exportar relatório</button>
    <button class="btn btn-secondary btn-sm" onclick="copyReport()">📋 Copiar resumo</button>
    <button class="btn btn-secondary btn-sm" onclick="resetChecklist()">↺ Reiniciar</button>
  </div>
</div>

<footer>NC Tool — AdOps Suite · Brand Safety Checklist · Offline · v1.0</footer>

<script>
const SECTIONS = [
  {
    id:'inventory',
    title:'🏷️ Inventário e Contexto',
    items:[
      {id:'wl_bl',label:'Whitelist/Blacklist de sites configurada',desc:'Defina quais domínios são permitidos ou bloqueados para o anúncio aparecer.'},
      {id:'content_cat',label:'Categorias de conteúdo excluídas',desc:'Ex: violência, conteúdo adulto, política, desastres. Configure no plano/campanha.'},
      {id:'garm',label:'Categorias GARM aplicadas',desc:'Global Alliance for Responsible Media: 11 categorias de alto risco (terrorismo, pornografia, discurso de ódio etc.)'},
      {id:'ias_dv',label:'IAS / DoubleVerify / Moat ativo',desc:'Ferramenta de verificação terceira habilitada para brand safety e viewability.'},
      {id:'private_market',label:'PMPs/Deal IDs prioritários',desc:'Inventário premium via Private Marketplace tem menor risco de brand safety vs. open exchange.'},
    ]
  },
  {
    id:'targeting',
    title:'🎯 Segmentação e Contexto',
    items:[
      {id:'ctx_target',label:'Segmentação contextual ativa',desc:'Anúncios servidos apenas em páginas com contexto relevante e seguro para a marca.'},
      {id:'keyword_excl',label:'Keywords negativas configuradas',desc:'Excluir páginas que contenham termos sensíveis ao posicionamento da marca.'},
      {id:'geo_excl',label:'Exclusões geográficas revisadas',desc:'Verificar se regiões com restrições legais ou sensibilidade de marca estão excluídas.'},
      {id:'audience_excl',label:'Exclusões de audiência revisadas',desc:'Garantir que públicos incompatíveis com a campanha estejam excluídos.'},
    ]
  },
  {
    id:'fraud',
    title:'🤖 Fraude e Tráfego Inválido',
    items:[
      {id:'ivt_filter',label:'Filtro de IVT (tráfego inválido) ativo',desc:'Invalid Traffic — bots, cliques fraudulentos e impressões inválidas. Ativar via IAS/DV360/Meta.'},
      {id:'viewability',label:'Meta de viewability configurada',desc:'Exemplo: mínimo 70% viewable para display, 50% vídeo. Alinha com padrão MRC/IAB.'},
      {id:'frequency',label:'Cap de frequência definido',desc:'Limitar exposição por usuário para evitar fadiga e comportamento anômalo de entrega.'},
      {id:'bot_excl',label:'Exclusão de tráfego não-humano',desc:'Listas de exclusão de datacenters, proxies e ambientes bot-detectados ativas.'},
    ]
  },
  {
    id:'creative',
    title:'🎨 Criativo e Compliance',
    items:[
      {id:'ad_specs',label:'Criativos dentro das specs de cada plataforma',desc:'Dimensões, formatos e pesos corretos. Evitar rejeições e servição em posições não intencionais.'},
      {id:'landing_safe',label:'Landing pages revisadas e funcionando',desc:'Links quebrados ou páginas com conteúdo inadequado afetam brand safety.'},
      {id:'brand_guide',label:'Criativos revisados pelo time de marca',desc:'Aprovação do visual e mensagem pela equipe de brand ou agência criativa.'},
      {id:'age_gate',label:'Age gate para conteúdo age-restricted',desc:'Para marcas com restrição de idade (álcool, jogos, etc.): verificação de idade ativa.'},
    ]
  },
  {
    id:'monitoring',
    title:'📡 Monitoramento e Resposta',
    items:[
      {id:'alerts',label:'Alertas de brand safety configurados',desc:'Notificações automáticas quando o anúncio aparece em contexto impróprio.'},
      {id:'daily_check',label:'Rotina de checagem diária nos primeiros dias',desc:'Revisar placement reports, domínios de entrega e taxa de bloqueio nos primeiros 72h.'},
      {id:'escalation',label:'Processo de escalada definido',desc:'Quem acionar e em quanto tempo em caso de incidente de brand safety.'},
      {id:'exclude_post',label:'Processo de exclusão pós-veiculação ativo',desc:'Sites identificados como inadequados durante a campanha são adicionados à blacklist imediatamente.'},
    ]
  }
];

let state = {};
let platforms = ['Meta','Google/DV360','Programático'];
let activePlatform = 0;

function getKey(item) { return `${platforms[activePlatform]}_${item.id}`; }

function renderPlatformTabs(){
  document.getElementById('platformTabs').innerHTML = platforms.map((p,i)=>`
    <div class="plt-tab ${i===activePlatform?'active':''}" onclick="switchPlatform(${i})">${p}</div>
  `).join('');
}

function switchPlatform(i){
  activePlatform=i;
  renderPlatformTabs();
  renderChecklist();
  updateSummary();
}

function addPlatform(){
  const name = prompt('Nome da plataforma:','TikTok Ads');
  if(name){ platforms.push(name); activePlatform=platforms.length-1; renderPlatformTabs(); renderChecklist(); updateSummary(); }
}

function setItem(key, val){
  state[key]=val;
  renderChecklist();
  updateSummary();
  saveState();
}

function renderChecklist(){
  const html = SECTIONS.map(sec=>{
    const items = sec.items;
    let ok=0,warn=0,na=0;
    items.forEach(it=>{ const v=state[getKey(it)]; if(v==='ok')ok++; else if(v==='warn')warn++; else if(v==='na')na++; });
    const done = ok+warn+na;
    const badge = done===items.length?(warn>0?'badge-warn':'badge-ok'):'badge-error';
    const badgeText = done===items.length?(warn>0?`⚠️ ${warn} atenção`:'✅ Completo'):`${done}/${items.length}`;

    return `<div style="margin-bottom:12px">
      <div class="section-header" onclick="toggleSection('${sec.id}')">
        <span class="section-title">${sec.title}</span>
        <span class="section-badge ${badge}">${badgeText}</span>
      </div>
      <div class="section-body" id="sec-${sec.id}">
        ${items.map(it=>{
          const key=getKey(it);
          const v=state[key]||'';
          const noteKey=key+'_note';
          return `<div class="check-item">
            <div class="check-toggle">
              <button class="btn-ok ${v==='ok'?'active':''}" onclick="setItem('${key}','ok')">✅</button>
              <button class="btn-warn ${v==='warn'?'active':''}" onclick="setItem('${key}','warn')">⚠️</button>
              <button class="btn-na ${v==='na'?'active':''}" onclick="setItem('${key}','na')">N/A</button>
            </div>
            <div class="check-content">
              <div class="check-label">${it.label}</div>
              <div class="check-desc">${it.desc}</div>
              <div class="check-note"><input type="text" placeholder="Nota ou observação..." value="${state[noteKey]||''}" oninput="state['${noteKey}']=this.value;saveState()"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  document.getElementById('checklistSections').innerHTML = html;
  // Open first section by default
  const first = document.getElementById('sec-'+SECTIONS[0].id);
  if(first) first.classList.add('open');
}

function toggleSection(id){
  const el = document.getElementById('sec-'+id);
  el.classList.toggle('open');
}

function updateSummary(){
  const all = SECTIONS.flatMap(s=>s.items.map(it=>state[getKey(it)]));
  const total = all.length;
  const ok = all.filter(v=>v==='ok').length;
  const warn = all.filter(v=>v==='warn').length;
  const na = all.filter(v=>v==='na').length;
  const pend = total-ok-warn-na;
  document.getElementById('summaryStats').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Total itens</div></div>
    <div class="stat"><div class="stat-val" style="color:#15803d">${ok}</div><div class="stat-lbl">✅ OK</div></div>
    <div class="stat"><div class="stat-val" style="color:#a16207">${warn}</div><div class="stat-lbl">⚠️ Atenção</div></div>
    <div class="stat"><div class="stat-val" style="color:#9ca3af">${na}</div><div class="stat-lbl">N/A</div></div>
    <div class="stat"><div class="stat-val" style="color:#dc2626">${pend}</div><div class="stat-lbl">Pendente</div></div>
  `;
  const pct = Math.round((ok+na)/total*100);
  document.getElementById('summaryProgress').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${pct>=80?'#22c55e':pct>=50?'#f59e0b':'#ef4444'};border-radius:5px;transition:width .3s"></div>
      </div>
      <span style="font-weight:700;color:#1F36C7;min-width:40px">${pct}%</span>
    </div>
    <div style="font-size:.8rem;color:#666;margin-top:4px">Plataforma: <strong>${platforms[activePlatform]}</strong></div>
  `;
}

function copyReport(){
  const adv = document.getElementById('advName').value||'—';
  const camp = document.getElementById('campName').value||'—';
  const lines = [`Brand Safety Checklist\nAnunciante: ${adv} | Campanha: ${camp} | Plataforma: ${platforms[activePlatform]}\n`];
  SECTIONS.forEach(sec=>{
    lines.push(`\n${sec.title}`);
    sec.items.forEach(it=>{
      const v = state[getKey(it)]||'pendente';
      const icon = v==='ok'?'✅':v==='warn'?'⚠️':v==='na'?'N/A':'❌';
      lines.push(`  ${icon} ${it.label}`);
    });
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('Relatório copiado!'));
}

function exportReport(){
  const adv = document.getElementById('advName').value||'adv';
  const rows = ['Seção,Item,Status,Nota'];
  SECTIONS.forEach(sec=>{
    sec.items.forEach(it=>{
      const v=state[getKey(it)]||'pendente';
      const note=state[getKey(it)+'_note']||'';
      rows.push(`"${sec.title}","${it.label}","${v}","${note}"`);
    });
  });
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(rows.join('\n'));
  a.download=`brand_safety_${adv.replace(/\s+/g,'_')}_${Date.now()}.csv`;a.click();
}

function resetChecklist(){
  if(confirm('Reiniciar checklist? Os dados não salvos serão perdidos.')){state={};renderChecklist();updateSummary();}
}

function saveState(){
  try{ localStorage.setItem('nc_bsafety',JSON.stringify({state,platforms,activePlatform})); } catch(e){}
}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('nc_bsafety')||'{}');
    if(s.state) state=s.state;
    if(s.platforms?.length) platforms=s.platforms;
    if(s.activePlatform>=0) activePlatform=s.activePlatform;
    if(s.advName) document.getElementById('advName').value=s.advName;
    if(s.campName) document.getElementById('campName').value=s.campName;
  } catch(e){}
}

loadState();
renderPlatformTabs();
renderChecklist();
updateSummary();
</script>
</body>
</html>
