<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Encerramento de Campanha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --header:#1a237e;--accent:#1F36C7;--hl-bg:#e8ecfd;--border:#d6dbf2;--page-bg:#f4f5fb;
  --red:#dc3545;--yellow:#f59e0b;--green:#22c55e;--gray:#6b7280;
  --white:#fff;--text:#1e2a3a;--muted:#64748b;
}
body{font-family:'Space Grotesk',sans-serif;background:var(--page-bg);color:var(--text);min-height:100vh}
header{background:var(--header);color:#fff;padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header h1{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
header .subtitle{font-size:.8rem;opacity:.7;margin-top:2px}
.hdr-left{flex:1}
.campaign-select-wrap{display:flex;align-items:center;gap:8px}
.campaign-select-wrap select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 10px;font-family:inherit;font-size:.85rem;cursor:pointer}
.campaign-select-wrap select option{color:#111;background:#fff}
.btn-new-campaign{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 12px;font-size:.8rem;font-family:inherit;cursor:pointer;transition:background .15s}
.btn-new-campaign:hover{background:rgba(255,255,255,.28)}

.main{padding:28px 32px;min-width:0}

.campaign-info-bar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 24px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
.ci-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
.ci-field label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ci-field input{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:.9rem;color:var(--text);background:var(--hl-bg);transition:border .15s}
.ci-field input:focus{outline:none;border-color:var(--accent)}

.progress-bar-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.progress-label{font-size:.85rem;font-weight:600;white-space:nowrap;min-width:110px}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress-pct{font-size:.85rem;font-weight:700;color:var(--accent);min-width:40px;text-align:right}
.progress-status{font-size:.8rem;color:var(--muted)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:6px}
.tab-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-badge{background:rgba(255,255,255,.25);border-radius:99px;padding:1px 7px;font-size:.72rem;font-weight:700}
.tab-btn:not(.active) .tab-badge{background:var(--hl-bg);color:var(--accent)}

.section-panel{display:none}
.section-panel.active{display:block}

.checklist-section{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.section-title{padding:14px 20px;font-weight:700;font-size:.95rem;background:var(--hl-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section-icon{font-size:1.1rem}
.section-progress{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:600}

.checklist-item{border-bottom:1px solid var(--border);padding:0}
.checklist-item:last-child{border-bottom:none}
.item-main{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;cursor:pointer;transition:background .1s}
.item-main:hover{background:#fafbff}
.item-main.checked-row{background:#f0fdf4}
.item-cb{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:1px}
.item-content{flex:1}
.item-label{font-size:.88rem;font-weight:500;line-height:1.4}
.item-label.checked{text-decoration:line-through;color:var(--muted)}
.item-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.priority{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:99px}
.p-critico{background:#fee2e2;color:#dc2626}
.p-importante{background:#fef3c7;color:#d97706}
.p-recomendado{background:#f1f5f9;color:var(--muted)}
.btn-why{background:none;border:none;font-family:inherit;font-size:.72rem;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.item-expand{padding:0 20px 0 50px;overflow:hidden;max-height:0;transition:max-height .2s}
.item-expand.open{max-height:300px}
.why-box{background:var(--hl-bg);border-radius:6px;padding:10px 14px;font-size:.82rem;color:var(--muted);margin-bottom:8px;line-height:1.5}
.item-notes{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:.82rem;color:var(--text);background:#fff;resize:vertical;min-height:40px;margin-bottom:10px}
.item-notes:focus{outline:none;border-color:var(--accent)}

.bottom-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.btn{padding:9px 18px;border-radius:7px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1730a8}
.btn-outline{background:#fff;color:var(--accent);border-color:var(--accent)}
.btn-outline:hover{background:var(--hl-bg)}
.btn-danger{background:#fff;color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fee2e2}

.toast{position:fixed;bottom:24px;right:24px;background:#1e2a3a;color:#fff;padding:12px 20px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  .main{padding:16px}
  .campaign-info-bar{flex-direction:column}
  .ci-field{min-width:100%}
}
@media print{
  header,.tabs,.bottom-bar,.btn-why,.item-notes{display:none!important}
  .item-expand{max-height:none!important}
  .section-panel{display:block!important}
  .checklist-section{break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <div class="subtitle">NC Tool · AdOps Suite</div>
    <h1>✅ Checklist de Encerramento de Campanha</h1>
  </div>
  <div class="campaign-select-wrap">
    <select id="campaignSelect" onchange="loadCampaign(this.value)">
    </select>
    <button class="btn-new-campaign" onclick="newCampaign()">+ Nova</button>
  </div>
</header>

<div class="main">

  <div class="campaign-info-bar">
    <div class="ci-field">
      <label>Nome da Campanha</label>
      <input type="text" id="campName" placeholder="Ex: Unilever — OMO — Nov 2026" oninput="saveMeta()">
    </div>
    <div class="ci-field">
      <label>Data de Encerramento</label>
      <input type="date" id="campDate" oninput="saveMeta()">
    </div>
    <div class="ci-field">
      <label>Responsável</label>
      <input type="text" id="campResp" placeholder="Seu nome" oninput="saveMeta()">
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-label">Progresso geral</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
    <div class="progress-status" id="progressStatus">0 / 0 itens</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <div class="bottom-bar">
    <button class="btn btn-primary" onclick="copyReport()">📋 Copiar relatório de encerramento</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Exportar PDF</button>
    <button class="btn btn-danger" onclick="clearCampaign()">🗑️ Limpar campanha atual</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  {
    id:'plataformas', icon:'📡', title:'Plataformas e Entrega',
    items:[
      {id:'p1', label:'Confirmar data de fim configurada corretamente em todas as plataformas', priority:'critico', why:'Uma campanha ativa além da data acordada gera gasto não autorizado e pode comprometer o budget do próximo período.'},
      {id:'p2', label:'Verificar entrega final vs meta de impressões — underpace > 10% requer justificativa', priority:'critico', why:'O cliente paga por um volume contratado. Desvio significativo precisa ser documentado e comunicado para decisão de make-good.'},
      {id:'p3', label:'Confirmar budget realizado vs budget contratado — desvio > 5% documentar', priority:'critico', why:'Desvio de budget é o principal gatilho de questionamento financeiro pós-campanha. Ter o número exato antes do fechamento evita surpresas.'},
      {id:'p4', label:'Pausar ou arquivar campanhas encerradas em cada plataforma (Meta, Google, DV360, LinkedIn, TikTok, CM360)', priority:'critico', why:'Plataformas podem continuar entregando após o fim do budget se não forem explicitamente pausadas, especialmente em modelos de leilão.'},
      {id:'p5', label:'Registrar motivo se campanha encerrou antes do prazo (budget esgotado / decisão cliente / erro)', priority:'importante', why:'Histórico de encerramento antecipado é referência para calibrar budgets futuros e evitar o mesmo cenário.'},
      {id:'p6', label:'Capturar print/screenshot da entrega final de cada plataforma', priority:'importante', why:'Evidência visual da entrega final protege o time operacional em caso de questionamento posterior pelo cliente ou financeiro.'},
    ]
  },
  {
    id:'tags', icon:'🏷️', title:'Tags e Pixels',
    items:[
      {id:'t1', label:'Confirmar que tags Floodlight (CM360) foram desativadas após o encerramento', priority:'critico', why:'Floodlights ativos após a campanha continuam coletando dados e podem inflar métricas de conversão de períodos futuros.'},
      {id:'t2', label:'Verificar se pixels de remarketing devem ser mantidos ativos para audiências pós-campanha', priority:'importante', why:'Pixels de audience building podem ser mantidos mesmo após o encerramento da campanha — a decisão precisa ser intencional, não por esquecimento.'},
      {id:'t3', label:'Checar se há tags de terceiros (pixels de cliente, verification) que precisam ser notificados', priority:'importante', why:'Verificação, brand safety e pixels de cliente geralmente têm contratos ou protocolos próprios de desativação.'},
      {id:'t4', label:'Confirmar que tags de conversion não estão gerando eventos pós-voo', priority:'critico', why:'Tags de conversão disparando após o encerramento podem gerar dados errados em relatórios consolidados e futuros modelos de atribuição.'},
      {id:'t5', label:'Documentar quais tags ficam ativas e quais foram desativadas', priority:'importante', why:'Rastreabilidade do status das tags é essencial para auditorias futuras e onboarding de novos membros na conta.'},
    ]
  },
  {
    id:'relatorios', icon:'📊', title:'Relatórios e Dados',
    items:[
      {id:'r1', label:'Exportar relatório de entrega final do CM360 (placement level)', priority:'critico', why:'O relatório de ad server é a fonte de verdade contratual. Deve ser exportado antes que dados históricos sejam alterados por tráfego inválido ou ajustes retroativos.'},
      {id:'r2', label:'Exportar relatório de conversões / Floodlight do CM360', priority:'critico', why:'Dados de Floodlight são base para cálculo de CPA e ROAS — exportar antes do encerramento garante a janela de lookback correta.'},
      {id:'r3', label:'Exportar relatório de cada plataforma social (Meta, Google, LinkedIn, TikTok)', priority:'critico', why:'Dados de plataformas podem ser alterados retroativamente por reconciliação de IVT. Exportar no encerramento registra o estado final.'},
      {id:'r4', label:'Exportar Path to Conversion se campanha tinha Floodlight ativo', priority:'recomendado', why:'O P2C captura o journey completo de touchpoints — dado valioso para análise de atribuição e planejamento do próximo voo.'},
      {id:'r5', label:'Verificar discrepância final entre ad server e plataformas — documentar se > 20%', priority:'importante', why:'Discrepância alta precisa ser explicada ao cliente. Ter a análise pronta no encerramento evita improvisação.'},
      {id:'r6', label:'Salvar relatórios em pasta organizada no Drive/servidor', priority:'importante', why:'Organização de arquivo garante acesso fácil em auditorias, renovações e referências futuras. Sem isso, dados se perdem.'},
    ]
  },
  {
    id:'criativos', icon:'🎨', title:'Criativos',
    items:[
      {id:'c1', label:'Arquivar todos os criativos aprovados com versão final e tamanhos', priority:'importante', why:'Criativos aprovados são ativos reutilizáveis. Sem arquivamento estruturado, o time de produção refaz trabalho já pago.'},
      {id:'c2', label:'Registrar quais criativos performaram melhor (CTR, conversão)', priority:'recomendado', why:'Histórico de performance criativa alimenta o briefing das próximas campanhas com dados reais, não opinião.'},
      {id:'c3', label:'Confirmar se há ativos que precisam ser devolvidos ao cliente/produtora', priority:'importante', why:'Criativos de campanha podem conter assets com licença temporária (imagens, músicas). Manter após o prazo é risco jurídico.'},
      {id:'c4', label:'Documentar aprendizados de criativo para próximas campanhas', priority:'recomendado', why:'Lição aprendida sobre formato, copy e visual impacta diretamente a performance do próximo voo. Vale 10 minutos agora.'},
      {id:'c5', label:'Verificar se criativos com data de validade (promoções) foram desativados', priority:'critico', why:'Criativos com preço, data de promoção ou oferta expirada rodando após o prazo geram reclamação de consumidor e risco de compliance.'},
    ]
  },
  {
    id:'financeiro', icon:'💰', title:'Financeiro e Faturamento',
    items:[
      {id:'f1', label:'Confirmar budget realizado total (soma de todas as plataformas)', priority:'critico', why:'O número consolidado de investimento é a base do faturamento. Erros aqui impactam diretamente receita e relação com cliente.'},
      {id:'f2', label:'Verificar se há bônus ou créditos de plataforma não aplicados', priority:'importante', why:'Créditos de plataforma (Meta MDF, Google MatchBack, etc.) devem ser aplicados ou comunicados ao cliente antes do fechamento.'},
      {id:'f3', label:'Documentar qualquer desvio de budget para o cliente', priority:'critico', why:'Transparência sobre desvio de budget previne desgaste de relacionamento e é requisito em contratos de agência.'},
      {id:'f4', label:'Confirmar alinhamento com área financeira para faturamento', priority:'critico', why:'Timing de faturamento depende de confirmação operacional. Delay nessa comunicação atrasa o ciclo de caixa da agência.'},
      {id:'f5', label:'Arquivar comprovantes/prints de investimento por plataforma', priority:'importante', why:'Comprovantes são necessários em auditorias financeiras e processos de conciliação de NF.'},
      {id:'f6', label:'Checar se há make-good ou compensação a executar', priority:'importante', why:'Make-goods acordados que não são executados geram passivo financeiro e desgaste de relacionamento com veículos e cliente.'},
    ]
  },
  {
    id:'analise', icon:'🔍', title:'Análise e Pós-voo',
    items:[
      {id:'a1', label:'Calcular performance final vs KPIs planejados', priority:'critico', why:'Sem a comparação planejado × realizado, não há como aprender com a campanha nem justificar o investimento ao cliente.'},
      {id:'a2', label:'Identificar top 3 insights da campanha', priority:'importante', why:'3 insights concretos são o mínimo para uma reunião de pós-voo produtiva. Preparar antes evita improviso.'},
      {id:'a3', label:'Registrar hipóteses para o próximo voo', priority:'recomendado', why:'Hipóteses documentadas viram testes do próximo voo. É assim que campanhas evoluem de forma estruturada.'},
      {id:'a4', label:'Preencher relatório de pós-voo (se previsto no escopo)', priority:'importante', why:'Relatório de pós-voo é entrega contratual em muitos escopos — não entregar é descumprimento de SOW.'},
      {id:'a5', label:'Alinhar call/reunião de post-mortem com cliente (se aplicável)', priority:'recomendado', why:'Reunião de pós-voo fortalece o relacionamento e posiciona a agência como parceiro estratégico, não só executor.'},
      {id:'a6', label:'Atualizar histórico de benchmarks internos com resultados desta campanha', priority:'recomendado', why:'Benchmarks internos atualizados melhoram a precisão de estimativas de próximas propostas.'},
    ]
  },
  {
    id:'comunicacao', icon:'📣', title:'Comunicação e Handoff',
    items:[
      {id:'com1', label:'Enviar relatório de encerramento ao cliente', priority:'critico', why:'Relatório de encerramento fecha o ciclo formal da campanha. Ausência dele gera incerteza sobre o status no lado do cliente.'},
      {id:'com2', label:'Confirmar recebimento e aprovação do relatório pelo cliente', priority:'importante', why:'Confirmação de recebimento é evidência de entrega — necessária em caso de disputa contratual.'},
      {id:'com3', label:'Comunicar encerramento a stakeholders internos relevantes', priority:'importante', why:'Time de planejamento, financeiro e account precisam saber que a campanha encerrou para atualizar forecasts e pipelines.'},
      {id:'com4', label:'Atualizar status da campanha no sistema de gestão (Jira, Sheets, etc.)', priority:'importante', why:'Status desatualizado no sistema de gestão gera confusão operacional e atrapalha reporting de squad/diretoria.'},
      {id:'com5', label:'Arquivar todos os documentos em pasta final organizada', priority:'importante', why:'Pasta bem organizada é o legado de cada campanha — facilita onboarding, auditorias e renovações futuras.'},
      {id:'com6', label:'Brief de próxima campanha criado (se houver continuidade)', priority:'recomendado', why:'Aproveitar o contexto fresco do encerramento para iniciar o próximo brief economiza tempo e mantém continuidade estratégica.'},
    ]
  }
];

const PRIORITY_LABEL = {critico:'🔴 Crítico', importante:'🟡 Importante', recomendado:'⚪ Recomendado'};
const PRIORITY_CLASS = {critico:'p-critico', importante:'p-importante', recomendado:'p-recomendado'};

let currentCampaign = null;
let campaigns = {};

function getCampaigns(){
  try{ return JSON.parse(localStorage.getItem('enc_campaigns')||'{}'); }catch(e){return {};}
}
function saveCampaigns(){
  try{ localStorage.setItem('enc_campaigns', JSON.stringify(campaigns)); }catch(e){}
}
function getCurrentId(){
  try{ return localStorage.getItem('enc_current')||null; }catch(e){return null;}
}
function setCurrentId(id){
  try{ localStorage.setItem('enc_current', id); }catch(e){}
}

function genId(){ return 'camp_'+Date.now(); }

function newCampaign(){
  const id = genId();
  campaigns[id] = {meta:{name:'Nova Campanha',date:'',resp:''}, checks:{}, notes:{}};
  saveCampaigns();
  currentCampaign = id;
  setCurrentId(id);
  renderCampaignSelect();
  loadUI();
}

function loadCampaign(id){
  currentCampaign = id;
  setCurrentId(id);
  loadUI();
}

function loadUI(){
  const c = campaigns[currentCampaign];
  if(!c) return;
  document.getElementById('campName').value = c.meta.name||'';
  document.getElementById('campDate').value = c.meta.date||'';
  document.getElementById('campResp').value = c.meta.resp||'';
  renderAll();
  updateProgress();
}

function saveMeta(){
  if(!currentCampaign) return;
  campaigns[currentCampaign].meta = {
    name: document.getElementById('campName').value,
    date: document.getElementById('campDate').value,
    resp: document.getElementById('campResp').value
  };
  saveCampaigns();
  renderCampaignSelect();
}

function renderCampaignSelect(){
  const sel = document.getElementById('campaignSelect');
  const ids = Object.keys(campaigns).slice(-5);
  sel.innerHTML = ids.map(id=>{
    const name = campaigns[id]?.meta?.name || 'Campanha';
    return `<option value="${id}" ${id===currentCampaign?'selected':''}>${name}</option>`;
  }).join('');
}

let activeTab = 0;

function renderAll(){
  renderTabs();
  renderPanels();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = SECTIONS.map((s,i)=>{
    const total = s.items.length;
    const done = s.items.filter(it=>campaigns[currentCampaign]?.checks?.[it.id]).length;
    return `<button class="tab-btn ${i===activeTab?'active':''}" onclick="setTab(${i})">
      ${s.icon} ${s.title} <span class="tab-badge">${done}/${total}</span>
    </button>`;
  }).join('');
}

function renderPanels(){
  const panels = document.getElementById('panels');
  panels.innerHTML = SECTIONS.map((s,i)=>{
    const checks = campaigns[currentCampaign]?.checks||{};
    const notes = campaigns[currentCampaign]?.notes||{};
    const done = s.items.filter(it=>checks[it.id]).length;
    const total = s.items.length;
    return `<div class="section-panel ${i===activeTab?'active':''}" id="panel_${i}">
      <div class="checklist-section">
        <div class="section-title">
          <span class="section-icon">${s.icon}</span> ${s.title}
          <span class="section-progress">${done}/${total} concluídos</span>
        </div>
        ${s.items.map(it=>{
          const checked = !!checks[it.id];
          const note = notes[it.id]||'';
          return `<div class="checklist-item" id="item_${it.id}">
            <div class="item-main ${checked?'checked-row':''}" onclick="toggleItem('${it.id}',event)">
              <input type="checkbox" class="item-cb" ${checked?'checked':''} onclick="toggleItem('${it.id}',event)" onchange="toggleItem('${it.id}',event)">
              <div class="item-content">
                <div class="item-label ${checked?'checked':''}">${it.label}</div>
                <div class="item-meta">
                  <span class="priority ${PRIORITY_CLASS[it.priority]}">${PRIORITY_LABEL[it.priority]}</span>
                  <button class="btn-why" onclick="toggleWhy('${it.id}',event)">Por que fazer isso?</button>
                </div>
              </div>
            </div>
            <div class="item-expand" id="exp_${it.id}">
              <div class="why-box">ℹ️ ${it.why}</div>
              <textarea class="item-notes" placeholder="Notas (opcional)..." oninput="saveNote('${it.id}',this.value)">${note}</textarea>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function setTab(i){
  activeTab = i;
  renderAll();
}

function toggleItem(id, e){
  if(e && (e.target.tagName==='BUTTON'||e.target.classList.contains('item-notes'))) return;
  if(!currentCampaign) return;
  campaigns[currentCampaign].checks = campaigns[currentCampaign].checks||{};
  campaigns[currentCampaign].checks[id] = !campaigns[currentCampaign].checks[id];
  saveCampaigns();
  renderAll();
  updateProgress();
}

function toggleWhy(id, e){
  e.stopPropagation();
  const el = document.getElementById('exp_'+id);
  el.classList.toggle('open');
}

function saveNote(id, val){
  if(!currentCampaign) return;
  campaigns[currentCampaign].notes = campaigns[currentCampaign].notes||{};
  campaigns[currentCampaign].notes[id] = val;
  saveCampaigns();
}

function updateProgress(){
  if(!currentCampaign) return;
  const checks = campaigns[currentCampaign]?.checks||{};
  const total = SECTIONS.reduce((a,s)=>a+s.items.length,0);
  const done = Object.values(checks).filter(Boolean).length;
  const pct = total?Math.round(done/total*100):0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressStatus').textContent = `${done} / ${total} itens`;
}

function copyReport(){
  if(!currentCampaign) return showToast('Nenhuma campanha ativa.');
  const c = campaigns[currentCampaign];
  const checks = c.checks||{};
  const total = SECTIONS.reduce((a,s)=>a+s.items.length,0);
  const done = Object.values(checks).filter(Boolean).length;
  const pending = [];
  SECTIONS.forEach(s=>s.items.forEach(it=>{ if(!checks[it.id]) pending.push('• '+it.label); }));
  const name = c.meta.name||'—';
  const date = c.meta.date||'—';
  const resp = c.meta.resp||'—';
  const lines = [
    '══════════════════════════════════════',
    'CHECKLIST DE ENCERRAMENTO DE CAMPANHA',
    '══════════════════════════════════════',
    `Campanha: ${name}`,
    `Data: ${date}`,
    `Responsável: ${resp}`,
    `Progresso: ${done}/${total} itens (${Math.round(done/total*100)}%)`,
    '',
    pending.length ? `ITENS PENDENTES (${pending.length}):` : '✅ Todos os itens concluídos.',
    ...pending,
    '',
    'Gerado por NC Tool — AdOps Suite'
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('Relatório copiado!')).catch(()=>showToast('Erro ao copiar.'));
}

function clearCampaign(){
  if(!confirm('Limpar todos os dados desta campanha? Esta ação não pode ser desfeita.')) return;
  if(!currentCampaign) return;
  campaigns[currentCampaign] = {meta:{name:'Nova Campanha',date:'',resp:''},checks:{},notes:{}};
  saveCampaigns();
  loadUI();
  showToast('Campanha limpa.');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Init
campaigns = getCampaigns();
const savedId = getCurrentId();
if(savedId && campaigns[savedId]){
  currentCampaign = savedId;
} else if(Object.keys(campaigns).length){
  currentCampaign = Object.keys(campaigns).slice(-1)[0];
} else {
  newCampaign();
}
renderCampaignSelect();
loadUI();
</script>
