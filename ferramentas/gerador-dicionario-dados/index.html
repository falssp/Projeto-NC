<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dicionário de Dados AdOps — AdOps Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;--bg:#f0f2ff;
  --card:#fff;--border:#d0d6f7;--text:#111827;--muted:#6b7280;
  --green:#16a34a;--red:#dc2626;--radius:12px;--mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{--bg:#0d0f1a;--card:#141828;--border:#2a3060;--text:#e8ecff;--muted:#8892b0;--light:#1e2548;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--azul);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:700}
header a{color:rgba(255,255,255,.75);font-size:.85rem;text-decoration:none}
.theme-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;font-family:inherit}
main{padding:24px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}
label{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--card);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul)}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--azul);color:#fff}
.btn-primary:hover{background:var(--escuro)}
.btn-ghost{background:transparent;color:var(--azul);border:1.5px solid var(--azul)}
.btn-ghost:hover{background:var(--light)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
/* Search */
#searchInput{padding:10px 16px;font-size:.95rem;border-radius:30px}
/* Term card */
.term-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border .15s}
.term-card:hover{border-color:var(--azul)}
.term-header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.term-name{font-size:.95rem;font-weight:700}
.term-abbr{font-family:var(--mono);font-size:.8rem;color:var(--azul);background:var(--light);padding:2px 7px;border-radius:6px}
.term-category{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px}
.cat-metric{background:#dcfce7;color:#15803d}
.cat-tech{background:#dbeafe;color:#1d4ed8}
.cat-auction{background:#fef9c3;color:#854d0e}
.cat-brand{background:#fce7f3;color:#9d174d}
.cat-data{background:#ede9fe;color:#6d28d9}
.cat-creative{background:#ffedd5;color:#c2410c}
.term-def{font-size:.85rem;color:var(--muted);line-height:1.6}
.term-formula{font-family:var(--mono);font-size:.8rem;background:var(--light);padding:6px 10px;border-radius:6px;margin-top:6px;display:none}
.term-expanded .term-formula{display:block}
.term-example{font-size:.82rem;border-left:3px solid var(--azul);padding-left:10px;margin-top:6px;display:none;color:var(--muted)}
.term-expanded .term-example{display:block}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{padding:5px 12px;border-radius:16px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted)}
.cat-btn.active{background:var(--azul);color:#fff;border-color:var(--azul)}
#noResults{display:none;text-align:center;padding:32px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <a href="../">← Ferramentas</a>
    <h1 style="margin-top:2px">📖 Dicionário de Dados AdOps</h1>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">◐ Tema</button>
</header>
<main>

<div class="card">
  <input id="searchInput" type="search" placeholder="🔍 Buscar termos (ex: CPM, viewability, RTB, floodlight…)" oninput="filterTerms()">
  <div class="cat-filter" id="catFilter" style="margin-top:12px"></div>
  <div style="font-size:.8rem;color:var(--muted)"><span id="countLabel">0</span> termos · Clique em um termo para ver fórmula e exemplo</div>
</div>

<div id="termsList"></div>
<div id="noResults">Nenhum termo encontrado. Tente outro termo.</div>

</main>
<script>
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'light';
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  localStorage.setItem('dict_theme',cur==='dark'?'light':'dark');
}
document.documentElement.setAttribute('data-theme',localStorage.getItem('dict_theme')||'light');

const TERMS=[
  // Metrics
  {name:'CPM',abbr:'CPM',cat:'metric',catLabel:'Métrica',def:'Custo por Mil Impressões. Modelo de precificação padrão em display e vídeo. Representa o valor pago a cada 1.000 vezes que um anúncio é exibido.',formula:'CPM = (Budget / Impressões) × 1.000',example:'Budget R$10.000 / 500.000 imps × 1.000 = CPM R$20'},
  {name:'CPC',abbr:'CPC',cat:'metric',catLabel:'Métrica',def:'Custo por Clique. Modelo de cobrança por cliques em anúncios. Usado em Search, Social e comparadores de preço.',formula:'CPC = Budget / Cliques',example:'R$5.000 / 2.000 cliques = CPC R$2,50'},
  {name:'CPA',abbr:'CPA',cat:'metric',catLabel:'Métrica',def:'Custo por Aquisição (ou Ação). Valor pago por cada conversão ou ação desejada — compra, cadastro, lead, instalação.',formula:'CPA = Budget / Conversões',example:'R$20.000 / 400 vendas = CPA R$50'},
  {name:'CPV',abbr:'CPV',cat:'metric',catLabel:'Métrica',def:'Custo por View. Modelo de cobrança por visualização de vídeo. No YouTube, uma view é contada após 30s ou interação.',formula:'CPV = Budget / Views',example:'R$3.000 / 150.000 views = CPV R$0,02'},
  {name:'CTR',abbr:'CTR',cat:'metric',catLabel:'Métrica',def:'Click-Through Rate. Percentual de impressões que geraram um clique. Indica engajamento com o criativo.',formula:'CTR = (Cliques / Impressões) × 100',example:'500 cliques / 100.000 imps × 100 = CTR 0,5%'},
  {name:'VTR',abbr:'VTR',cat:'metric',catLabel:'Métrica',def:'View-Through Rate. Percentual de impressões de vídeo que foram assistidas até o fim (ou até o ponto definido).',formula:'VTR = (Completions / Impressões) × 100',example:'40.000 completes / 200.000 imps = VTR 20%'},
  {name:'ROAS',abbr:'ROAS',cat:'metric',catLabel:'Métrica',def:'Return on Ad Spend. Receita gerada por cada real investido em publicidade. Break-even é 1/margem.',formula:'ROAS = Receita / Investimento em Mídia',example:'R$150.000 / R$30.000 = ROAS 5×'},
  {name:'ROI',abbr:'ROI',cat:'metric',catLabel:'Métrica',def:'Return on Investment. Retorno líquido sobre o investimento, descontando o custo dos produtos/serviços.',formula:'ROI = (Lucro Bruto − Investimento) / Investimento × 100',example:'(R$120k − R$30k) / R$30k = ROI 300%'},
  {name:'eCPM',abbr:'eCPM',cat:'metric',catLabel:'Métrica',def:'CPM Efetivo. Valor real por 1.000 impressões após descontar viewability, IVT, block rate e adicionar taxas de tecnologia.',formula:'eCPM = CPM ÷ viewab% ÷ (1−IVT%) × (1+fees%)',example:'CPM R$15 ÷ 70% ÷ 92% × 1,20 = eCPM ~R$28'},
  {name:'Viewability',abbr:'',cat:'metric',catLabel:'Métrica',def:'Percentual de impressões consideradas "viewable" pelo MRC. Display: ≥50% pixels × 1s. Vídeo: ≥50% pixels × 2s.',formula:'Viewability% = Imps Viewable / Imps Mensuráveis × 100',example:'700k viewable / 1M mensurável = 70% viewability'},
  {name:'IVT',abbr:'IVT',cat:'metric',catLabel:'Métrica',def:'Invalid Traffic. Tráfego gerado por bots, scrapers ou fraudes. GIVT (geral) e SIVT (sofisticado/fraude). Meta: <10% GIVT, <3% SIVT.',formula:'IVT% = Imps Inválidas / Total Imps × 100',example:''},
  {name:'GRP',abbr:'GRP',cat:'metric',catLabel:'Métrica',def:'Gross Rating Points. Soma total dos ratings de cada inserção de mídia. Medida clássica de TV — representa o volume bruto de exposição.',formula:'GRP = Reach% × Frequency',example:'Reach 65% × Freq 4× = 260 GRPs'},
  {name:'TRP',abbr:'TRP',cat:'metric',catLabel:'Métrica',def:'Target Rating Points. GRP calculado apenas sobre o público-alvo (target), não o universo total. Mais preciso para planejamento.',formula:'TRP = Reach_target% × Frequency',example:''},
  {name:'Reach',abbr:'',cat:'metric',catLabel:'Métrica',def:'Alcance. Número ou percentual de pessoas únicas expostas ao anúncio pelo menos uma vez em um período.',formula:'Reach% = Pessoas únicas / Universo × 100',example:'2M pessoas únicas / 10M universo = Reach 20%'},
  {name:'Frequency',abbr:'',cat:'metric',catLabel:'Métrica',def:'Frequência. Número médio de vezes que cada pessoa alcançada foi exposta ao anúncio.',formula:'Frequency = Impressões / Pessoas únicas',example:'10M imps / 2M pessoas = Freq 5×'},
  // Tech
  {name:'DSP',abbr:'DSP',cat:'tech',catLabel:'Tecnologia',def:'Demand-Side Platform. Plataforma usada por anunciantes/agências para comprar inventário de mídia programaticamente em múltiplos SSPs/exchanges.',formula:'',example:'Google DV360, The Trade Desk, Xandr, MediaMath'},
  {name:'SSP',abbr:'SSP',cat:'tech',catLabel:'Tecnologia',def:'Supply-Side Platform. Plataforma usada por publishers para monetizar seu inventário de ad space via leilões programáticos.',formula:'',example:'Google Ad Manager, Magnite, OpenX, PubMatic'},
  {name:'DMP',abbr:'DMP',cat:'tech',catLabel:'Tecnologia',def:'Data Management Platform. Plataforma para coletar, organizar e ativar dados de audiência de 1st, 2nd e 3rd party para segmentação.',formula:'',example:'Oracle DMP, Adobe Audience Manager'},
  {name:'CDP',abbr:'CDP',cat:'tech',catLabel:'Tecnologia',def:'Customer Data Platform. Base de dados centralizada com identidade unificada do cliente (CRM + digital + offline). Diferente do DMP: persistente e 1st party.',formula:'',example:'Segment, mParticle, Adobe Real-Time CDP'},
  {name:'Ad Server',abbr:'',cat:'tech',catLabel:'Tecnologia',def:'Servidor de anúncios. Plataforma que armazena, serve e rastreia anúncios. Atribui impressões, cliques e conversões via pixels/tags.',formula:'',example:'CM360 (DoubleClick), Sizmek, Innovid (CTV)'},
  {name:'Floodlight',abbr:'',cat:'tech',catLabel:'Tecnologia',def:'Tag de conversão do CM360/DV360. Registra ações pós-clique e pós-view no site do anunciante. Tipos: Counter (atividades) e Sales (transações).',formula:'<script type="text/javascript" src="https://fls.doubleclick.net/activityi;src=XXXX;type=XXXX;cat=XXXX;u1=[var];ord=[timestamp]">',example:''},
  {name:'VAST',abbr:'VAST',cat:'tech',catLabel:'Tecnologia',def:'Video Ad Serving Template. Padrão IAB de XML que descreve um anúncio de vídeo: mediafiles, tracking events, clicks e extensões.',formula:'',example:'VAST 4.1 define InLine, Wrapper, MediaFile, Impression, TrackingEvents'},
  {name:'VPAID',abbr:'VPAID',cat:'tech',catLabel:'Tecnologia',def:'Video Player Ad Interface Definition. Protocolo de comunicação entre player e ad unit interativo. Deprecado em favor de SIMID no VAST 4.x.',formula:'',example:''},
  {name:'UTM',abbr:'UTM',cat:'tech',catLabel:'Tecnologia',def:'Urchin Tracking Module. Parâmetros de URL para rastrear origem de tráfego no GA4: source, medium, campaign, content, term.',formula:'?utm_source=X&utm_medium=Y&utm_campaign=Z',example:'?utm_source=google&utm_medium=cpc&utm_campaign=brand_q1'},
  {name:'Pixel',abbr:'',cat:'tech',catLabel:'Tecnologia',def:'Tag de rastreamento (1×1 px transparente ou JS). Disparada ao carregar uma página ou evento, registra impressão, clique ou conversão no ad server.',formula:'',example:'<img src="https://..." width="1" height="1" />'},
  // Auction
  {name:'RTB',abbr:'RTB',cat:'auction',catLabel:'Leilão',def:'Real-Time Bidding. Leilão programático em tempo real (ms) onde DSPs disputam cada impressão individualmente. Base do programático moderno.',formula:'',example:''},
  {name:'First Price Auction',abbr:'',cat:'auction',catLabel:'Leilão',def:'Leilão de primeiro preço. O vencedor paga exatamente o valor do seu lance. Padrão no mercado desde 2019 (Google migrou de 2nd para 1st price).',formula:'Clearing price = bid do vencedor',example:'Lance R$12 → paga R$12'},
  {name:'Second Price Auction',abbr:'',cat:'auction',catLabel:'Leilão',def:'Leilão de segundo preço (Vickrey). O vencedor paga o 2º maior lance + R$0,01. Incentiva lances no valor real percebido.',formula:'Clearing price = 2º lance + $0,01',example:'1º R$12, 2º R$9 → vencedor paga R$9,01'},
  {name:'Floor Price',abbr:'',cat:'auction',catLabel:'Leilão',def:'Preço mínimo definido pelo publisher abaixo do qual nenhum lance é aceito. Hard floor = rígido; Soft floor = influencia a dinâmica do leilão.',formula:'',example:'Floor R$5: lances abaixo de R$5 são descartados'},
  {name:'Bid Shading',abbr:'',cat:'auction',catLabel:'Leilão',def:'Algoritmo dos DSPs para reduzir lances em leilões de 1º preço, estimando o menor preço suficiente para vencer. Poupa budget sem perder imps.',formula:'Bid shaded = bid_original × (1 − shade_factor)',example:'Lance R$12, shade 20% → submete R$9,60'},
  {name:'Unified Auction',abbr:'',cat:'auction',catLabel:'Leilão',def:'Leilão unificado (Google). Todos os compradores — header bidding, Open Bidding, Ad Exchange — competem simultaneamente na mesma chamada.',formula:'',example:'Header bidding + DV360 + direct deals no mesmo leilão'},
  {name:'Deal ID',abbr:'',cat:'auction',catLabel:'Leilão',def:'Identificador de negócio privado entre publisher e comprador. PMP (Private Marketplace) usa Deal ID para garantir inventory prioritário com preço acordado.',formula:'',example:'Deal ID: 1234567 — exclusivo para Anunciante X, CPM floor R$25'},
  {name:'Header Bidding',abbr:'',cat:'auction',catLabel:'Leilão',def:'Técnica onde o publisher chama múltiplos SSPs simultaneamente antes de enviar ao ad server, aumentando a competição e os yields.',formula:'',example:'Prebid.js chama Magnite, PubMatic, Index Exchange antes do GAM'},
  // Brand Safety
  {name:'Brand Safety',abbr:'',cat:'brand',catLabel:'Brand Safety',def:'Conjunto de medidas para garantir que anúncios não apareçam em conteúdo impróprio ou prejudicial à marca (violência, adulto, discurso de ódio).',formula:'',example:'GARM Framework: 11 categorias de exclusão (adulto, violência, drogas…)'},
  {name:'GARM',abbr:'GARM',cat:'brand',catLabel:'Brand Safety',def:'Global Alliance for Responsible Media. Framework da WFA com categorias padronizadas de brand safety e suitability para o mercado digital.',formula:'',example:'Floor Categories (sempre bloquear) + Brand Suitability (opcional)'},
  {name:'Block List',abbr:'',cat:'brand',catLabel:'Brand Safety',def:'Lista de domínios, apps ou canais excluídos de receber impressões da campanha. Gerenciada no DSP, ad server ou verificador (IAS/DV).',formula:'',example:'blocklist.csv com 500 domínios de notícias falsas'},
  {name:'Allow List',abbr:'',cat:'brand',catLabel:'Brand Safety',def:'Lista de domínios/apps aprovados onde os anúncios podem ser exibidos. Mais restritiva que blocklist — só o que está na lista é permitido.',formula:'',example:'Apenas portais de news tier-1: Globo, Folha, UOL'},
  // Data
  {name:'1st Party Data',abbr:'',cat:'data',catLabel:'Dados',def:'Dados coletados diretamente pelo anunciante sobre seus próprios clientes/visitantes. CRM, site, app, email. Base do marketing pós-cookie.',formula:'',example:'Lista de clientes, visitantes do site, usuários do app'},
  {name:'3rd Party Data',abbr:'',cat:'data',catLabel:'Dados',def:'Dados de audiência comprados de provedores externos (DMPs, data brokers). Dependem de cookies — impactados pelas mudanças de privacidade.',formula:'',example:'Oracle, Acxiom, Nielsen — segmentos de interesse e comportamento'},
  {name:'Lookalike',abbr:'',cat:'data',catLabel:'Dados',def:'Modelagem que identifica usuários similares a uma seed audience. Plataformas (Meta, Google) usam ML para expandir o alcance com perfil semelhante.',formula:'',example:'Seed: 10k clientes → Lookalike 1%: ~500k pessoas similares'},
  {name:'Retargeting',abbr:'',cat:'data',catLabel:'Dados',def:'Estratégia de impactar usuários que já interagiram com a marca (site, app, vídeo). Geralmente 1st party data via pixel.',formula:'',example:'Visitou página de produto mas não comprou → recebe banner de remarketing'},
  // Creative
  {name:'Rich Media',abbr:'',cat:'creative',catLabel:'Criativo',def:'Formato de anúncio interativo com animação, vídeo, expand ou jogabilidade. Taxas de engajamento maiores que banner estático. Requer ad server compatível.',formula:'',example:'Banner expand, Interscroller, Rewarded video'},
  {name:'Native Ads',abbr:'',cat:'creative',catLabel:'Criativo',def:'Anúncios com visual e formato integrado ao conteúdo editorial. Maior percepção de qualidade e menor ad blindness.',formula:'',example:'Artigo patrocinado, card de conteúdo em feeds de notícia'},
  {name:'DCO',abbr:'DCO',cat:'creative',catLabel:'Criativo',def:'Dynamic Creative Optimization. Sistema que monta criativos personalizados em tempo real com base em dados do usuário (localização, comportamento, produto).',formula:'',example:'Banner que mostra o produto visualizado + preço dinâmico'},
  {name:'OTS',abbr:'OTS',cat:'creative',catLabel:'Criativo',def:'Opportunity To See. Número mínimo de exposições para que o anúncio gere impacto mensurável. Varia por objetivo e canal.',formula:'',example:'Branding: OTS mínimo 3×, ideal 7–9× (Recency Theory)'},
];

const CATEGORIES=[
  {id:'all',label:'Todos'},
  {id:'metric',label:'Métricas'},
  {id:'tech',label:'Tecnologia'},
  {id:'auction',label:'Leilão'},
  {id:'brand',label:'Brand Safety'},
  {id:'data',label:'Dados'},
  {id:'creative',label:'Criativo'},
];

let activecat='all';
let expanded=new Set();

function renderCats(){
  document.getElementById('catFilter').innerHTML=CATEGORIES.map(c=>
    `<button class="cat-btn ${activecat===c.id?'active':''}" onclick="setCat('${c.id}')">${c.label}</button>`
  ).join('');
}

function setCat(id){activecat=id;filterTerms();}

function filterTerms(){
  renderCats();
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const filtered=TERMS.filter(t=>{
    const matchCat=activecat==='all'||t.cat===activecat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.abbr&&t.abbr.toLowerCase().includes(q))||t.def.toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('countLabel').textContent=filtered.length;
  document.getElementById('noResults').style.display=filtered.length?'none':'block';
  document.getElementById('termsList').innerHTML=filtered.map(t=>`
    <div class="term-card ${expanded.has(t.name)?'term-expanded':''}" onclick="toggle('${t.name}')">
      <div class="term-header">
        <span class="term-name">${t.name}</span>
        ${t.abbr&&t.abbr!==t.name?`<span class="term-abbr">${t.abbr}</span>`:''}
        <span class="term-category cat-${t.cat}">${t.catLabel}</span>
      </div>
      <div class="term-def">${t.def}</div>
      ${t.formula?`<div class="term-formula"><b>Fórmula:</b> ${t.formula}</div>`:''}
      ${t.example?`<div class="term-example"><b>Exemplo:</b> ${t.example}</div>`:''}
    </div>`).join('');
}

function toggle(name){
  if(expanded.has(name))expanded.delete(name);else expanded.add(name);
  filterTerms();
}

renderCats();
filterTerms();
</script>
</body>
</html>
