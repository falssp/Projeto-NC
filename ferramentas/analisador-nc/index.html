<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Analisador NC</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f1f5f9;
  --surface:  #ffffff;
  --border:   rgba(0,0,0,.09);
  --text:     #0f172a;
  --muted:    #64748b;
  --accent:   #2563eb;
  --ok:       #16a34a;
  --ok-bg:    #dcfce7;
  --warn:     #d97706;
  --warn-bg:  #fef3c7;
  --erro:     #dc2626;
  --erro-bg:  #fee2e2;
  --shadow:   0 1px 3px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a;--surface:#1e293b;--border:rgba(255,255,255,.09);
    --text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;
    --ok:#22c55e;--ok-bg:rgba(22,163,74,.15);
    --warn:#f59e0b;--warn-bg:rgba(217,119,6,.15);
    --erro:#f87171;--erro-bg:rgba(220,38,38,.15);
    --shadow:0 1px 3px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a;--surface:#1e293b;--border:rgba(255,255,255,.09);
  --text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;
  --ok:#22c55e;--ok-bg:rgba(22,163,74,.15);
  --warn:#f59e0b;--warn-bg:rgba(217,119,6,.15);
  --erro:#f87171;--erro-bg:rgba(220,38,38,.15);
  --shadow:0 1px 3px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent)}

/* Layout */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.app-header .back{font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none}
.app-header .back:hover{color:var(--accent)}
.app-header h1{font-size:1rem;font-weight:700;line-height:1}
.app-header .badge{font-size:.65rem;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(37,99,235,.1);color:var(--accent);border:1px solid rgba(37,99,235,.2)}
.theme-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:.72rem;cursor:pointer;color:var(--muted);font-family:inherit}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

.main{display:grid;grid-template-columns:380px 1fr;gap:0;height:calc(100vh - 53px);overflow:hidden}
@media(max-width:900px){.main{grid-template-columns:1fr;height:auto;overflow:visible}}

/* Left panel */
.left-panel{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.section-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.select-input,.text-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
.select-input:focus,.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.nc-textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;outline:none;resize:vertical;transition:border-color .15s}
.nc-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.nc-textarea::placeholder{color:var(--muted);font-family:'Inter',sans-serif}
.hint{font-size:.7rem;color:var(--muted);margin-top:4px;line-height:1.5}

.analyze-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.analyze-btn:hover{opacity:.88}
.analyze-btn:disabled{opacity:.45;cursor:not-allowed}

.opts-row{display:flex;flex-direction:column;gap:6px}
.opt-check{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);cursor:pointer}
.opt-check input{accent-color:var(--accent)}

/* Right panel */
.right-panel{overflow-y:auto;padding:20px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;text-align:center;color:var(--muted)}
.empty-state .icon{font-size:2.5rem;opacity:.4}
.empty-state p{font-size:.88rem;line-height:1.6;max-width:280px}

/* Summary strip */
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.summary-strip{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
.stat-card .num{font-size:1.5rem;font-weight:700;line-height:1}
.stat-card .lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.stat-card.ok .num{color:var(--ok)}
.stat-card.warn .num{color:var(--warn)}
.stat-card.erro .num{color:var(--erro)}

/* Per-NC results */
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.results-header h3{font-size:.88rem;font-weight:700}
.export-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
.export-btn:hover{border-color:var(--accent);color:var(--accent)}

.nc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.nc-row{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--border)}
.nc-row.ok{border-left-color:var(--ok)}
.nc-row.warn{border-left-color:var(--warn)}
.nc-row.erro{border-left-color:var(--erro)}
.nc-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nc-value{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;word-break:break-all}
.nc-status-badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-erro{background:var(--erro-bg);color:var(--erro)}
.nc-line{font-size:.7rem;color:var(--muted);margin-left:2px;font-weight:500}
.nc-parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.nc-part{font-size:.72rem;padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--border)}
.nc-part.match{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.nc-part.nomatch{background:var(--erro-bg);border-color:transparent;color:var(--erro)}
.nc-part.empty{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.nc-part .part-seg{font-size:.6rem;font-weight:700;opacity:.7;margin-right:3px}
.nc-errors{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.nc-err-msg{font-size:.7rem;color:var(--erro);padding:1px 0}
.nc-warn-msg{font-size:.7rem;color:var(--warn);padding:1px 0}

/* Frequency analysis */
.freq-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.freq-section h4{font-size:.78rem;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.freq-seg{margin-bottom:12px}
.freq-seg-label{font-size:.75rem;font-weight:600;margin-bottom:5px}
.freq-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.72rem}
.freq-bar-label{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:.68rem}
.freq-bar-wrap{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.freq-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.freq-bar-count{color:var(--muted);min-width:30px;text-align:right;font-size:.68rem}

/* Issues summary */
.issues-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.issues-section h4{font-size:.78rem;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.issue-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:.78rem}
.issue-row:last-child{border-bottom:none}
.issue-count{font-weight:700;color:var(--erro);min-width:28px;text-align:right}
.issue-count.warn{color:var(--warn)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;font-size:.8rem}
.page-btn{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;font-family:inherit;color:var(--text)}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{color:var(--muted)}

/* Filter tabs */
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-tab{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}
.filter-tab:hover,.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>

<header class="app-header">
  <a class="back" href="../">← Ferramentas</a>
  <h1>Analisador NC</h1>
  <span class="badge">Offline</span>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 Escuro</button>
</header>

<div class="main">
  <!-- LEFT PANEL -->
  <div class="left-panel">

    <div>
      <div class="section-label">Cliente (Taxonomy Builder)</div>
      <select class="select-input" id="clientSel" onchange="onClientChange()">
        <option value="">— selecione um cliente —</option>
      </select>
    </div>

    <div>
      <div class="section-label">Estrutura (opcional)</div>
      <select class="select-input" id="structSel">
        <option value="">— qualquer estrutura —</option>
      </select>
    </div>

    <div>
      <div class="section-label">Lista de NCs <span style="font-weight:400;color:var(--muted)">(uma por linha)</span></div>
      <textarea class="nc-textarea" id="ncInput" placeholder="Cole aqui as naming conventions para analisar…
Ex:
marca_produto_canal_objetivo_formato
marca_produto2_outro_canal_branding"></textarea>
      <p class="hint">Aceita separadores: ponto, underline, pipe, traço e barra. O analisador detecta automaticamente.</p>
    </div>

    <div>
      <div class="section-label">Opções</div>
      <div class="opts-row">
        <label class="opt-check">
          <input type="checkbox" id="optCase" checked> Ignorar diferença de maiúsculas/minúsculas
        </label>
        <label class="opt-check">
          <input type="checkbox" id="optTrim" checked> Ignorar espaços extras
        </label>
        <label class="opt-check">
          <input type="checkbox" id="optWarn"> Alertar segmentos sem termos no dicionário
        </label>
        <label class="opt-check">
          <input type="checkbox" id="optFreq" checked> Mostrar análise de frequência
        </label>
      </div>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">🔍 Analisar</button>
    <div id="clientInfo" style="font-size:.72rem;color:var(--muted);display:none"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <p>Selecione um cliente, cole as NCs e clique em <strong>Analisar</strong>.</p>
    </div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────────
const TAXO_KEY = 'taxo_clients_v1';
const THEME_KEY = 'analisadornc_theme';

let _clients = [];
let _activeClient = null;
let _results = [];
let _filtered = [];
let _page = 0;
const PAGE_SIZE = 50;
let _filterMode = 'all'; // all | ok | warn | erro

function loadClients() {
  try {
    const raw = localStorage.getItem(TAXO_KEY);
    _clients = raw ? JSON.parse(raw) : [];
  } catch(e) { _clients = []; }
  const sel = document.getElementById('clientSel');
  sel.innerHTML = '<option value="">— selecione um cliente —</option>';
  _clients.filter(c=>!c.archived).forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name + (c.archived?' [arquivado]':'');
    sel.appendChild(opt);
  });
  // Try to pre-select active client
  try {
    const actId = localStorage.getItem('taxo_active_v1');
    if(actId) sel.value = actId;
    if(sel.value) onClientChange();
  } catch(e){}
}

function onClientChange() {
  const id = document.getElementById('clientSel').value;
  _activeClient = _clients.find(c=>c.id===id)||null;
  renderStructSel();
  renderClientInfo();
}

function renderStructSel() {
  const sel = document.getElementById('structSel');
  sel.innerHTML = '<option value="">— qualquer estrutura —</option>';
  if(!_activeClient) return;
  (_activeClient.structures||[]).forEach(st=>{
    const opt = document.createElement('option');
    opt.value = st.id;
    opt.textContent = st.label + (st.pattern?` (${st.pattern})`:'');
    sel.appendChild(opt);
  });
}

function renderClientInfo() {
  const el = document.getElementById('clientInfo');
  if(!_activeClient) { el.style.display='none'; return; }
  const c = _activeClient;
  const totalTerms = Object.values(c.dictionary||{}).reduce((a,v)=>a+(v?.length||0),0);
  el.style.display='block';
  el.innerHTML = `📋 ${c.segments.length} segmentos · 📚 ${totalTerms} termos · Sep: <code style="font-size:.72rem">${esc(c.separator||'_')}</code>`;
}

// ── Analysis ─────────────────────────────────────────────────────────
function analyze() {
  if(!_activeClient) { alert('Selecione um cliente.'); return; }
  const raw = document.getElementById('ncInput').value.trim();
  if(!raw) { alert('Cole pelo menos uma NC.'); return; }

  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const c = _activeClient;
  const sep = c.separator || '_';
  const ignoreCase = document.getElementById('optCase').checked;
  const trim = document.getElementById('optTrim').checked;
  const warnNoDict = document.getElementById('optWarn').checked;

  // Build dict lookup maps (value → term)
  const dictMap = {}; // segId → Map<normalizedValue, term>
  c.segments.forEach(s=>{
    const terms = c.dictionary[s.id]||[];
    dictMap[s.id] = new Map();
    terms.forEach(t=>{
      const key = ignoreCase ? t.value.toLowerCase() : t.value;
      dictMap[s.id].set(key, t);
    });
  });

  // Detect separator from NCs (use client separator as primary)
  // Also try to detect if the NC uses a different separator
  function detectSep(nc) {
    // Count occurrences of each candidate
    const candidates = [sep, '_', '.', '-', '|', '/'];
    const counts = candidates.map(s=>({s, n:(nc.match(new RegExp('\\'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length}));
    counts.sort((a,b)=>b.n-a.n);
    return counts[0].n > 0 ? counts[0].s : sep;
  }

  const strictSepRe = new RegExp('\\' + sep.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));

  _results = lines.map((nc, lineIdx) => {
    const val = trim ? nc.trim() : nc;
    const detectedSep = detectSep(val);
    const parts = val.split(detectedSep);
    const errors = [];
    const warnings = [];
    const segParts = [];

    // Check segment count
    const expectedSegs = c.segments.length;
    if(parts.length > expectedSegs) {
      errors.push(`Mais segmentos que o esperado (${parts.length} vs ${expectedSegs})`);
    } else if(parts.length < expectedSegs) {
      const missing = c.segments.slice(parts.length);
      const reqMissing = missing.filter(s=>s.required);
      if(reqMissing.length) errors.push(`Segmento(s) obrigatório(s) ausente(s): ${reqMissing.map(s=>s.label).join(', ')}`);
      else warnings.push(`Faltam ${expectedSegs-parts.length} segmento(s) opcional(is)`);
    }

    // Check separator mismatch
    if(detectedSep !== sep && parts.length > 1) {
      warnings.push(`Separador detectado "${detectedSep}" difere do cliente "${sep}"`);
    }

    // Check each part against dictionary
    c.segments.forEach((seg, i) => {
      const partVal = parts[i];
      if(partVal === undefined || partVal === '') {
        if(seg.required) errors.push(`Segmento obrigatório vazio: ${seg.label}`);
        segParts.push({segLabel:seg.label, segId:seg.id, value:'', status:'empty'});
        return;
      }
      const lookup = ignoreCase ? partVal.toLowerCase() : partVal;
      const dictTerms = dictMap[seg.id];
      if(!dictTerms || dictTerms.size === 0) {
        if(warnNoDict) warnings.push(`Segmento sem dicionário: ${seg.label}`);
        segParts.push({segLabel:seg.label, segId:seg.id, value:partVal, status:'nodict'});
        return;
      }
      if(dictTerms.has(lookup)) {
        const term = dictTerms.get(lookup);
        segParts.push({segLabel:seg.label, segId:seg.id, value:partVal, status:'match', termLabel:term.label});
      } else {
        errors.push(`"${partVal}" não reconhecido em ${seg.label}`);
        // Find suggestions (simple prefix match)
        const suggestions = [];
        dictTerms.forEach((t,k)=>{ if(k.startsWith(lookup.slice(0,3))) suggestions.push(t.value); });
        const hint = suggestions.length ? ` · sugestão: ${suggestions.slice(0,2).join(', ')}` : '';
        segParts[segParts.length] = {segLabel:seg.label, segId:seg.id, value:partVal, status:'nomatch', hint};
      }
    });

    // Char limit check
    if(c.charLimit && val.length > c.charLimit) {
      warnings.push(`Excede limite de caracteres (${val.length}/${c.charLimit})`);
    }

    const status = errors.length > 0 ? 'erro' : warnings.length > 0 ? 'warn' : 'ok';
    return {nc:val, parts, segParts, errors, warnings, status, lineIdx};
  });

  _page = 0;
  _filterMode = 'all';
  renderResults();
}

// ── Render results ────────────────────────────────────────────────────
function renderResults() {
  const panel = document.getElementById('rightPanel');
  if(!_results.length) { panel.innerHTML='<div class="empty-state"><div class="icon">🔍</div><p>Nenhuma NC para exibir.</p></div>'; return; }

  const total = _results.length;
  const okCount = _results.filter(r=>r.status==='ok').length;
  const warnCount = _results.filter(r=>r.status==='warn').length;
  const erroCount = _results.filter(r=>r.status==='erro').length;

  // Filter
  _filtered = _filterMode === 'all' ? _results
    : _results.filter(r=>r.status===_filterMode);

  // Paginate
  const pageStart = _page * PAGE_SIZE;
  const pageEnd = pageStart + PAGE_SIZE;
  const pageItems = _filtered.slice(pageStart, pageEnd);
  const totalPages = Math.ceil(_filtered.length / PAGE_SIZE);

  let html = '';

  // Summary strip
  html += `<div class="summary-strip">
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Total NCs</div></div>
    <div class="stat-card ok"><div class="num">${okCount}</div><div class="lbl">Válidas</div></div>
    <div class="stat-card warn"><div class="num">${warnCount}</div><div class="lbl">Com avisos</div></div>
    <div class="stat-card erro"><div class="num">${erroCount}</div><div class="lbl">Com erros</div></div>
  </div>`;

  // Issues summary
  const issueMap = new Map();
  _results.forEach(r=>{
    r.errors.forEach(e=>{ issueMap.set(e, (issueMap.get(e)||0)+1); });
    r.warnings.forEach(w=>{ const k='⚠ '+w; issueMap.set(k,(issueMap.get(k)||0)+1); });
  });
  if(issueMap.size) {
    const sorted = [...issueMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
    html += `<div class="issues-section">
      <h4>Erros mais frequentes</h4>
      ${sorted.map(([msg,cnt])=>`<div class="issue-row">
        <span style="font-size:.74rem">${esc(msg)}</span>
        <span class="issue-count ${msg.startsWith('⚠')?'warn':''}">${cnt}×</span>
      </div>`).join('')}
    </div>`;
  }

  // Frequency analysis
  if(document.getElementById('optFreq')?.checked) {
    const freqBySegId = {};
    _results.forEach(r=>{
      r.segParts.forEach(sp=>{
        if(!sp.value||sp.status!=='match') return;
        if(!freqBySegId[sp.segId]) freqBySegId[sp.segId] = {label:sp.segLabel, counts:{}};
        freqBySegId[sp.segId].counts[sp.value] = (freqBySegId[sp.segId].counts[sp.value]||0)+1;
      });
    });
    const segs = Object.entries(freqBySegId);
    if(segs.length) {
      html += `<div class="freq-section"><h4>Frequência de termos por segmento</h4>`;
      segs.forEach(([segId, data])=>{
        const sorted = Object.entries(data.counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
        const max = sorted[0]?.[1]||1;
        html += `<div class="freq-seg">
          <div class="freq-seg-label">${esc(data.label)}</div>
          ${sorted.map(([val,cnt])=>`<div class="freq-bar-row">
            <span class="freq-bar-label" title="${esc(val)}">${esc(val)}</span>
            <div class="freq-bar-wrap"><div class="freq-bar-fill" style="width:${Math.round(cnt/max*100)}%"></div></div>
            <span class="freq-bar-count">${cnt}</span>
          </div>`).join('')}
        </div>`;
      });
      html += `</div>`;
    }
  }

  // Filter tabs
  html += `<div class="results-header">
    <h3>${_filtered.length} NC${_filtered.length!==1?'s':''} ${_filterMode!=='all'?`(${_filterMode})`:'no total'}</h3>
    <button class="export-btn" onclick="exportCSV()">⬇ CSV</button>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab ${_filterMode==='all'?'active':''}" onclick="setFilter('all')">Todas (${total})</button>
    <button class="filter-tab ${_filterMode==='ok'?'active':''}" onclick="setFilter('ok')">✓ Válidas (${okCount})</button>
    <button class="filter-tab ${_filterMode==='warn'?'active':''}" onclick="setFilter('warn')">⚠ Avisos (${warnCount})</button>
    <button class="filter-tab ${_filterMode==='erro'?'active':''}" onclick="setFilter('erro')">✕ Erros (${erroCount})</button>
  </div>`;

  // NC list
  html += `<div class="nc-list">`;
  pageItems.forEach(r=>{
    const statusLabel = r.status==='ok'?'Válida':r.status==='warn'?'Aviso':'Erro';
    const badgeCls = r.status==='ok'?'badge-ok':r.status==='warn'?'badge-warn':'badge-erro';
    html += `<div class="nc-row ${r.status}">
      <div class="nc-row-top">
        <span class="nc-value">${esc(r.nc)}</span>
        <span class="nc-status-badge ${badgeCls}">${statusLabel}</span>
        <span class="nc-line" style="color:var(--muted)">linha ${r.lineIdx+1}</span>
      </div>
      ${r.segParts.length?`<div class="nc-parts">${r.segParts.map(sp=>{
        const cls = sp.status==='match'?'match':sp.status==='nomatch'?'nomatch':sp.status==='empty'?'empty':'';
        return `<span class="nc-part ${cls}"><span class="part-seg">${esc(sp.segLabel)}</span>${esc(sp.value||'—')}${sp.termLabel?` <span style="opacity:.6;font-size:.6rem">(${esc(sp.termLabel)})</span>`:''}${sp.hint?` <span style="opacity:.6;font-size:.6rem">${esc(sp.hint)}</span>`:''}</span>`;
      }).join('')}</div>`:''}
      ${r.errors.length?`<div class="nc-errors">${r.errors.map(e=>`<div class="nc-err-msg">✕ ${esc(e)}</div>`).join('')}</div>`:''}
      ${r.warnings.length?`<div class="nc-errors">${r.warnings.map(w=>`<div class="nc-warn-msg">⚠ ${esc(w)}</div>`).join('')}</div>`:''}
    </div>`;
  });
  html += `</div>`;

  // Pagination
  if(totalPages > 1) {
    html += `<div class="pagination">
      <button class="page-btn" onclick="goPage(${_page-1})" ${_page===0?'disabled':''}>← Ant.</button>
      <span class="page-info">Página ${_page+1} de ${totalPages} (${_filtered.length} NCs)</span>
      <button class="page-btn" onclick="goPage(${_page+1})" ${_page>=totalPages-1?'disabled':''}>Próx. →</button>
    </div>`;
  }

  panel.innerHTML = html;
}

function setFilter(mode) {
  _filterMode = mode;
  _page = 0;
  renderResults();
}

function goPage(p) {
  _page = p;
  renderResults();
  document.getElementById('rightPanel').scrollTop = 0;
}

// ── Export CSV ────────────────────────────────────────────────────────
function exportCSV() {
  if(!_results.length) return;
  const rows = [['linha','nc','status','erros','avisos','segmentos_ok','segmentos_erro']];
  _results.forEach(r=>{
    const segsOk = r.segParts.filter(s=>s.status==='match').length;
    const segsErr = r.segParts.filter(s=>s.status==='nomatch'||s.status==='empty').length;
    rows.push([
      r.lineIdx+1,
      r.nc,
      r.status,
      r.errors.join(' | '),
      r.warnings.join(' | '),
      segsOk,
      segsErr
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const clientName = _activeClient?.id||'nc';
  a.download = `analise_nc_${clientName}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Theme ─────────────────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.dataset.theme = t||'';
  document.getElementById('themeBtn').textContent = t==='dark'?'☀️ Claro':'🌙 Escuro';
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur==='dark'?'light':'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
}

// ── Helpers ───────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Init ──────────────────────────────────────────────────────────────
(function init(){
  try { const t=localStorage.getItem(THEME_KEY); if(t) applyTheme(t); } catch(e){}
  loadClients();
  // Listen for storage updates (taxonomy builder open in another tab)
  window.addEventListener('storage', e=>{ if(e.key===TAXO_KEY) loadClients(); });
})();
</script>
