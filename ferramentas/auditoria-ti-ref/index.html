<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria de TI — Referência</title>
<style>
  :root {
    --process: #0369a1;
    --controls:#7c3aed;
    --findings:#dc2626;
    --isaca:   #d97706;
    --concepts:#374151;
    --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .breadcrumb{background:#fff;border-bottom:1px solid var(--border);padding:.55rem 1.5rem;font-size:.8rem;color:var(--muted);}
  .breadcrumb a{color:var(--process);text-decoration:none;font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}
  header{background:linear-gradient(135deg,#1a0533 0%,var(--controls) 100%);color:#fff;padding:2rem 1.5rem 1.5rem;}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
  header p{opacity:.85;margin-top:.4rem;font-size:.95rem;}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .controls input{flex:1;min-width:200px;padding:.55rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;}
  .controls input:focus{outline:2px solid var(--controls);border-color:transparent;}
  .filter-btn{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .filter-btn:hover{border-color:#94a3b8;}
  .filter-btn.active{color:#fff;border-color:transparent;}
  .filter-btn[data-cat="all"].active     {background:#334155;}
  .filter-btn[data-cat="process"].active {background:var(--process);}
  .filter-btn[data-cat="controls"].active{background:var(--controls);}
  .filter-btn[data-cat="findings"].active{background:var(--findings);}
  .filter-btn[data-cat="isaca"].active   {background:var(--isaca);}
  .filter-btn[data-cat="concepts"].active{background:var(--concepts);}
  main{max-width:900px;margin:0 auto;padding:1.5rem;}
  .letter-group{margin-bottom:2rem;}
  .letter-anchor{font-size:1.3rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:2px solid var(--border);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.65rem;border-left:4px solid #94a3b8;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .card[data-cat="process"] {border-left-color:var(--process);}
  .card[data-cat="controls"]{border-left-color:var(--controls);}
  .card[data-cat="findings"]{border-left-color:var(--findings);}
  .card[data-cat="isaca"]   {border-left-color:var(--isaca);}
  .card[data-cat="concepts"]{border-left-color:var(--concepts);}
  .card-header{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .card-name{font-size:1rem;font-weight:700;}
  .card-acronym{font-size:.82rem;color:var(--muted);font-weight:400;}
  .card-tag{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:#fff;margin-left:auto;white-space:nowrap;}
  .card[data-cat="process"] .card-tag{background:var(--process);}
  .card[data-cat="controls"].card-tag{background:var(--controls);}
  .card[data-cat="findings"].card-tag{background:var(--findings);}
  .card[data-cat="isaca"]   .card-tag{background:var(--isaca);}
  .card[data-cat="concepts"].card-tag{background:var(--concepts);}
  .card-def{font-size:.88rem;color:#334155;line-height:1.55;}
  .card-aka{font-size:.78rem;color:var(--muted);margin-top:.35rem;}
  .card-aka span{font-style:italic;}
  .az-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:1rem 1.5rem .5rem;}
  .az-btn{font-size:.78rem;font-weight:600;padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .12s;}
  .az-btn:hover{background:var(--controls);color:#fff;border-color:transparent;}
  #empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted);}
  .count{font-size:.82rem;color:var(--muted);padding:0 1.5rem .5rem;}
</style>
</head>
<body>
<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>
<header>
  <h1>🔎 Auditoria de TI — Referência</h1>
  <p>ISACA · CISA · Processo de Auditoria · Controles · Achados e Recomendações · Evidências</p>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="process">Processo de Auditoria</button>
  <button class="filter-btn" data-cat="controls">Controles de TI</button>
  <button class="filter-btn" data-cat="findings">Achados e Relatórios</button>
  <button class="filter-btn" data-cat="isaca">ISACA e Certificações</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Frameworks</button>
</div>
<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>
<script>
const CAT_LABELS={process:"Processo de Auditoria",controls:"Controles de TI",findings:"Achados e Relatórios",isaca:"ISACA e Certificações",concepts:"Conceitos e Frameworks"};
const TERMS=[
  // Processo de Auditoria
  {name:"Planejamento da Auditoria",acronym:"",cat:"process",def:"Primeira fase do processo de auditoria de TI. Inclui: definição de escopo e objetivos, análise de risco (risk-based audit planning), identificação de sistemas e processos no escopo, estimativa de recursos e prazo, e comunicação com a gestão auditada. Resultado: Plano de Auditoria aprovado pelo Comitê de Auditoria ou pela liderança.",aka:"Audit Planning · Risk-Based Audit Planning"},
  {name:"Teste de Controles",acronym:"",cat:"process",def:"Fase de execução da auditoria onde o auditor verifica se os controles existem (design adequado) e se funcionam efetivamente (efetividade operacional). Tipos de teste: Inquiry (entrevistas), Observation (observação direta), Inspection (revisão de documentos), Re-performance (refazer o controle), Walkthrough (percurso end-to-end de um processo). Resultado: evidências de auditoria.",aka:"Control Testing · ToD · ToE · Design vs Operating Effectiveness"},
  {name:"Amostragem em Auditoria",acronym:"",cat:"process",def:"Técnica de selecionar uma amostra representativa da população para testar controles ou transações. Métodos: Random Sampling (aleatório simples), Systematic Sampling (intervalo fixo), Judgmental Sampling (critério do auditor), Statistical Sampling (cálculo de tamanho de amostra com confiança definida). O PCAOB e ISA definem orientações para amostragem em auditorias financeiras.",aka:"Audit Sampling · Statistical Sampling · Judgmental Sampling"},
  {name:"Evidência de Auditoria",acronym:"",cat:"process",def:"Informações coletadas pelo auditor para sustentar suas conclusões e achados. Deve ser: Suficiente (quantidade adequada), Apropriada (relevante e confiável). Tipos: physical evidence (observação direta), documentary evidence (logs, contratos, prints), testimonial evidence (entrevistas documentadas), analytical evidence (recálculos, comparações). Armazenada nos Papéis de Trabalho.",aka:"Audit Evidence · Working Papers · Papéis de Trabalho"},
  {name:"Papéis de Trabalho",acronym:"",cat:"process",def:"Documentação que registra os procedimentos de auditoria executados, as evidências obtidas e as conclusões. Devem ser: completos (alguém externo pode entender), claros, revisados e aprovados pelo supervisor. Sujeitos a retenção legal (geralmente 5-7 anos). Ferramentas: TeamMate, AuditBoard, CaseWare, SharePoint estruturado.",aka:"Working Papers · Audit File · TeamMate · AuditBoard"},
  {name:"Follow-up de Auditoria",acronym:"",cat:"process",def:"Processo de verificar se a gestão implementou as ações corretivas para os achados identificados. Realizado após prazo acordado no plano de ação. O auditor re-testa os controles para confirmar efetividade. Achados não remediados no prazo devem ser escalados para a gestão sênior ou Comitê de Auditoria. Essencial para o valor da auditoria.",aka:"Audit Follow-up · Remediation Tracking · Plano de Ação"},
  // Controles de TI
  {name:"ITGC",acronym:"IT General Controls",cat:"controls",def:"Controles gerais de TI que suportam a confiabilidade de sistemas e dados. Categorias típicas: (1) Controles de acesso lógico (quem pode acessar o quê); (2) Change Management (controle de mudanças em sistemas); (3) Backup & Recovery (cópia e restauração de dados); (4) Computer Operations (operação e monitoramento de sistemas); (5) Program Development (desenvolvimento de sistemas). Base para auditorias SOX.",aka:"IT General Controls · Controles Gerais de TI · SOX IT Controls"},
  {name:"ITAC",acronym:"IT Application Controls",cat:"controls",def:"Controles específicos de uma aplicação (sistema) que garantem a integridade dos dados e transações. Categorias: Input Controls (validação de entrada — completude, exatidão, autorização), Processing Controls (processamento correto das transações), Output Controls (completude e precisão das saídas), Interface Controls (integridade de dados entre sistemas). Contrastam com ITGCs — são controles do aplicativo, não da infraestrutura.",aka:"IT Application Controls · Controles de Aplicação · Input Output Processing Controls"},
  {name:"Controles Preventivos vs Detectivos vs Corretivos",acronym:"",cat:"controls",def:"Classificação de controles por objetivo. Preventivos: evitam que o risco ocorra (ex: MFA evita acesso não autorizado). Detectivos: identificam quando o risco ocorreu (ex: revisão de logs de acesso, alertas SIEM). Corretivos: corrigem o problema após ser detectado (ex: restauração de backup após incidente). Uma boa estrutura de controles combina os três tipos.",aka:"Preventive Detective Corrective Controls · Control Classification"},
  {name:"Segregação de Funções",acronym:"SoD",cat:"controls",def:"Princípio que divide responsabilidades críticas entre diferentes pessoas para prevenir fraude ou erros. No contexto de TI: a mesma pessoa não deve ter permissão para autorizar E executar uma transação. Exemplo: o desenvolvedor não deve ter acesso de deploy em produção. Conflitos SoD são identificados em revisões de acesso e mapeados em matrizes SoD (ex: Segregation of Duties Matrix).",aka:"Segregation of Duties · SoD Matrix · Separação de Funções"},
  {name:"COSO Internal Control",acronym:"",cat:"controls",def:"Framework de controle interno do COSO (1992, atualizado 2013). 5 componentes: (1) Control Environment (tone at the top, ética, competência); (2) Risk Assessment (identificar e avaliar riscos); (3) Control Activities (políticas e procedimentos); (4) Information & Communication; (5) Monitoring Activities. Base para auditorias SOX Section 302 e 404. 17 princípios derivados dos 5 componentes.",aka:"COSO 2013 · Internal Control Integrated Framework · SOX 302 · SOX 404"},
  // Achados e Relatórios
  {name:"Achado de Auditoria",acronym:"",cat:"findings",def:"Resultado de um teste de auditoria que identifica uma deficiência ou desvio. Estrutura de um achado de qualidade: Condição (o que foi encontrado), Critério (o que deveria ser — norma, política, lei), Causa (por que existe a deficiência), Efeito/Risco (impacto potencial), Recomendação (ação corretiva proposta). Classificado por severidade: Crítico, Alto, Médio, Baixo.",aka:"Audit Finding · Condição Critério Causa Efeito · Observation"},
  {name:"Deficiência de Controle",acronym:"",cat:"findings",def:"Classificação de achados no contexto de auditorias SOX/financeiras. Escala: (1) Control Deficiency (deficiência — falha no design ou operação de controle); (2) Significant Deficiency (deficiência significativa — poderia resultar em distorção material); (3) Material Weakness (fraqueza material — probabilidade razoável de distorção material nas demonstrações financeiras — a mais grave, deve ser divulgada publicamente). Usada pelo PCAOB e SEC.",aka:"Control Deficiency · Significant Deficiency · Material Weakness · PCAOB · SOX"},
  {name:"Relatório de Auditoria",acronym:"",cat:"findings",def:"Documento formal que comunica os resultados da auditoria. Estrutura típica: (1) Sumário Executivo (para a alta gestão); (2) Escopo e objetivos; (3) Metodologia; (4) Achados e recomendações; (5) Resposta da gestão (management response); (6) Conclusão geral. Tipos: relatório preliminar (draft para validação) e relatório final. Distribuído ao Comitê de Auditoria, gestão e, quando exigido, ao regulador.",aka:"Audit Report · Management Letter · Relatório Final · Draft Report"},
  {name:"Plano de Ação",acronym:"",cat:"findings",def:"Resposta formal da gestão aos achados de auditoria, comprometendo ações corretivas com prazo e responsável. Deve ser: específico (o que será feito), mensurável (como será verificado), com prazo definido e dono designado. O auditor avalia se a ação proposta de fato mitiga o risco identificado (adequabilidade da resposta) antes de aceitar. Rastreado no follow-up.",aka:"Management Action Plan · MAP · Remediation Plan · Action Owner"},
  // ISACA
  {name:"ISACA",acronym:"Information Systems Audit and Control Association",cat:"isaca",def:"Associação profissional global focada em governança, gestão de riscos, controle e auditoria de sistemas de informação. Fundada em 1969. Mantém certificações, frameworks (COBIT) e publicações. Publicações relevantes: ITAF (IT Audit Framework), GTAG (Global Technology Audit Guides — guias práticos por tópico), IS Audit Standards. Capítulos locais em dezenas de países, incluindo Brasil.",aka:"Information Systems Audit and Control Association · ITAF · GTAG"},
  {name:"CISA",acronym:"Certified Information Systems Auditor",cat:"isaca",def:"Certificação ISACA para profissionais de auditoria, controle e segurança de sistemas de informação. Exame de 150 questões cobrindo 5 domínios: (1) IS Audit Process (21%); (2) Governance & Management of IT (17%); (3) IS Acquisition, Development & Implementation (12%); (4) IS Operations & Business Resilience (23%); (5) Protection of Information Assets (27%). Reconhecida globalmente como a principal certificação de auditoria de TI.",aka:"Certified Information Systems Auditor · CISA Exam"},
  {name:"CRISC",acronym:"Certified in Risk and Information Systems Control",cat:"isaca",def:"Certificação ISACA para profissionais de gestão de riscos e controles de TI. 4 domínios: (1) Governance (26%); (2) IT Risk Assessment (20%); (3) Risk Response and Reporting (32%); (4) Information Technology and Security (22%). Voltada a risk managers, compliance officers e profissionais de segurança que gerenciam riscos de TI. Considerada uma das 15 certificações de TI mais bem pagas.",aka:"Certified in Risk and Information Systems Control · CRISC Exam"},
  // Conceitos e Frameworks
  {name:"SOX IT",acronym:"Sarbanes-Oxley Act",cat:"concepts",def:"Lei dos EUA (2002) que exige que empresas de capital aberto (NYSE, NASDAQ) controlem e reportem sobre controles internos financeiros. Para TI: Section 302 (CEO/CFO certificam eficácia dos controles) e Section 404 (auditores externos validam os ITGCs que suportam processos financeiros). No Brasil: companhias listadas na NYSE/NASDAQ ou com ADRs seguem SOX.",aka:"Sarbanes-Oxley · SOX 302 · SOX 404 · PCAOB · Controles Financeiros"},
  {name:"PCI-DSS",acronym:"Payment Card Industry Data Security Standard",cat:"concepts",def:"Padrão de segurança para organizações que armazenam, processam ou transmitem dados de cartão de pagamento. Versão atual: PCI-DSS v4.0 (2022). 12 requisitos em 6 objetivos: rede segura, proteção de dados, gerenciamento de vulnerabilidades, controle de acesso, monitoramento, política de segurança. Auditoria: QSA (Qualified Security Assessor) emite ROC (Report on Compliance) ou SAQ para menores volumes.",aka:"PCI DSS v4 · QSA · ROC · SAQ · Dados de Cartão"},
  {name:"ITAF",acronym:"IT Assurance Framework",cat:"concepts",def:"Framework da ISACA que define padrões, diretrizes e ferramentas para profissionais de auditoria e assurance de TI. Estrutura: IS Audit Standards (obrigatórios), IS Audit Guidelines (diretrizes aplicáveis ao bom julgamento), IS Audit Tools and Techniques (ferramentas práticas). Referência para auditorias de TI conduzidas por profissionais CISA e relacionados.",aka:"IT Assurance Framework · IS Audit Standards · IS Audit Guidelines"},
  {name:"Auditoria Contínua",acronym:"",cat:"concepts",def:"Abordagem que usa automação e dados para realizar auditoria de forma contínua, em vez de pontual (anual). Componentes: Continuous Control Monitoring (CCM — monitoramento automatizado de controles), Continuous Risk Assessment, analytics de dados (análise de 100% das transações). Ferramentas: ACL/Galvanize (agora Diligent), IDEA, scripts SQL/Python. Permite detecção de anomalias em tempo real.",aka:"Continuous Audit · Continuous Monitoring · CCM · Data Analytics em Auditoria"},
];
TERMS.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
let currentCat='all',currentQ='';
function firstLetter(s){const c=s.trim().toUpperCase()[0];return/[A-Z]/.test(c)?c:'#';}
function render(){
  const q=currentQ.toLowerCase(),cat=currentCat;
  const filtered=TERMS.filter(t=>{
    const matchCat=cat==='all'||t.cat===cat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.acronym||'').toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.aka||'').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('count').textContent=`${filtered.length} termo${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const groups={};
  filtered.forEach(t=>{const l=firstLetter(t.name);if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  document.getElementById('azBar').innerHTML=letters.map(l=>`<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list=document.getElementById('list');list.innerHTML='';
  if(!filtered.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';
  letters.forEach(l=>{
    const grp=document.createElement('div');grp.className='letter-group';grp.id=`grp-${l}`;
    grp.innerHTML=`<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t=>{
      const aka=t.aka?`<div class="card-aka">Também: <span>${t.aka}</span></div>`:'';
      const acr=t.acronym?`<span class="card-acronym">— ${t.acronym}</span>`:'';
      grp.innerHTML+=`<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}
document.getElementById('search').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;render();});
});
render();
</script>
</body>
</html>
