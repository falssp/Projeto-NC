:root{

  --short-bg:#e8f0fe;--short:#1557b0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--surface);color:var(--text);font-size:14px;}
header{background:var(--ul-dark);color:#fff;padding:18px 24px 14px;}
header h1{font-size:18px;font-weight:700;}
header p{font-size:12px;color:#aab2d8;margin-top:3px}
.toolbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:180px;height:34px;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:0 12px;background:var(--surface)}
.toolbar input:focus{outline:none;border-color:var(--ul-blue);box-shadow:0 0 0 2px #1F36C720}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--ul-blue);color:#fff;border-color:var(--ul-blue)}
.count{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.main{padding:12px 16px 32px}
.block{margin-bottom:20px}
.block-header{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bdesc{font-weight:400;color:#8a90b0;font-size:10px;}
.bcnt{background:var(--accent-bg);color:var(--ul-blue);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:5px}
.item{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 10px;cursor:pointer;transition:border-color .1s}
.item:hover{border-color:#99a6e0}
.item.open{border-color:var(--ul-blue);background:var(--accent-bg)}
.item-v{font-size:13px;color:var(--text);font-weight:500;word-break:break-all}
.item-detail{display:none;margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.item.open .item-detail{display:block}
.short-badge{display:inline-block;background:var(--short-bg);color:var(--short);font-size:10px;padding:1px 6px;border-radius:4px;font-family:Consolas,monospace}
.no-short{color:var(--muted);font-size:11px}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>

const DESC={"Brand-Name":"Nome da marca no sistema Galileo.","Campaign-Name":"Nome da campanha (slug utilizado no naming).","Campaign-ID":"ID único da campanha no Galileo (ex: cn003995).","Market-Name-(PCAT)":"Categoria de produto (PCat) — nome longo e abreviação curta.","Engine":"Mecanismo de veiculação.","Objective":"Objetivo da campanha conforme estrutura IAIC.","Gender":"Segmentação por gênero e abreviação no naming.","Lower-Age":"Faixa etária mínima.","Upper-Age":"Faixa etária máxima (+ = sem limite).","Audience-Name":"Nome do segmento de audiência e abreviação curta (até 80).","Audience-Party":"Origem dos dados de audiência.","Buy-Type":"Modelo de compra (Google Search).","Format-Type":"Tipo de formato do criativo.","Landing-Page-Type":"Tipo de página de destino e abreviação.","Retailer":"Varejista de destino e abreviação (até 80).","Keyword-Type":"Tipo de palavra-chave (Search).","Keyword-Match":"Tipo de correspondência de keyword.","Position":"Posição do anúncio.","LocationType":"Tipo de localização geográfica.","Location":"Localização geográfica no naming (até 80).","Audience-Type":"Tipo de audiência.","BuyingType":"Tipo de compra de mídia.","Pilar-da-Campanha":"Pilar estratégico da campanha."};
const KEYS=Object.keys(D);
let active=null;
let open=new Set();

function buildPills(){
  const el=document.getElementById('pills');
  el.innerHTML='';
  function mkPill(label,key){
    const p=document.createElement('button');
    p.className='pill'+(active===key?' on':'');
    p.textContent=label;
    p.onclick=()=>{active=(active===key?null:key);render();};
    el.appendChild(p);
  }
  mkPill('Todos',null);
  KEYS.forEach(k=>mkPill(k,k));
}

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  let total=0,html='';
  const keys=active?[active]:KEYS;
  keys.forEach(k=>{
    const items=D[k].filter(it=>!q||it.v.toLowerCase().includes(q)||(it.s&&it.s.toLowerCase().includes(q)));
    if(!items.length)return;
    total+=items.length;
    html+='<div class="block"><div class="block-header">'+k
      +'<span class="bdesc">'+( DESC[k]||'')+'</span>'
      +'<span class="bcnt">'+items.length+'</span></div><div class="grid">';
    items.forEach(it=>{
      const id=k+'::'+it.v;
      const isOpen=open.has(id);
      const detail=it.s
        ?'<span class="short-badge">'+it.s+'</span>'
        :'<span class="no-short">sem abreviação</span>';
      html+='<div class="item'+(isOpen?' open':'')+'" data-id="'+id+'">'
        +'<div class="item-v">'+it.v+'</div>'
        +'<div class="item-detail">'+detail+'</div></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('main').innerHTML=html||'<div class="empty">Nenhum resultado.</div>';
  document.getElementById('cnt').textContent=total+' valores';
  document.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.id;
      open.has(id)?open.delete(id):open.add(id);
      render();
    };
  });
  buildPills();
}

buildPills();
render();
</script>
