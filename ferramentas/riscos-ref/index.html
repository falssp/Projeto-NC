<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Riscos — Referência</title>
<style>
  :root {
    --process:  #0369a1;
    --concepts: #7c3aed;
    --erm:      #d97706;
    --types:    #dc2626;
    --metrics:  #0f766e;
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
    --text: #1e293b; --muted: #64748b; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .breadcrumb { background: #fff; border-bottom: 1px solid var(--border); padding: .55rem 1.5rem; font-size: .8rem; color: var(--muted); }
  .breadcrumb a { color: var(--process); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }

  header { background: linear-gradient(135deg, #7c2d12 0%, var(--types) 100%); color: #fff; padding: 2rem 1.5rem 1.5rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header p  { opacity: .85; margin-top: .4rem; font-size: .95rem; }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; padding: 1.25rem 1.5rem; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .controls input { flex: 1; min-width: 200px; padding: .55rem .9rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; }
  .controls input:focus { outline: 2px solid var(--types); border-color: transparent; }

  .filter-btn { padding: .45rem .9rem; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font-size: .82rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .filter-btn:hover { border-color: #94a3b8; }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-cat="all"].active      { background: #334155; }
  .filter-btn[data-cat="process"].active  { background: var(--process); }
  .filter-btn[data-cat="concepts"].active { background: var(--concepts); }
  .filter-btn[data-cat="erm"].active      { background: var(--erm); }
  .filter-btn[data-cat="types"].active    { background: var(--types); }
  .filter-btn[data-cat="metrics"].active  { background: var(--metrics); }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  .letter-group { margin-bottom: 2rem; }
  .letter-anchor { font-size: 1.3rem; font-weight: 700; color: var(--muted); margin-bottom: .75rem; padding-bottom: .3rem; border-bottom: 2px solid var(--border); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .65rem; border-left: 4px solid #94a3b8; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .card[data-cat="process"]  { border-left-color: var(--process); }
  .card[data-cat="concepts"] { border-left-color: var(--concepts); }
  .card[data-cat="erm"]      { border-left-color: var(--erm); }
  .card[data-cat="types"]    { border-left-color: var(--types); }
  .card[data-cat="metrics"]  { border-left-color: var(--metrics); }

  .card-header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
  .card-name   { font-size: 1rem; font-weight: 700; }
  .card-acronym { font-size: .82rem; color: var(--muted); font-weight: 400; }
  .card-tag    { font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; color: #fff; margin-left: auto; white-space: nowrap; }
  .card[data-cat="process"]  .card-tag { background: var(--process); }
  .card[data-cat="concepts"] .card-tag { background: var(--concepts); }
  .card[data-cat="erm"]      .card-tag { background: var(--erm); }
  .card[data-cat="types"]    .card-tag { background: var(--types); }
  .card[data-cat="metrics"]  .card-tag { background: var(--metrics); }

  .card-def  { font-size: .88rem; color: #334155; line-height: 1.55; }
  .card-aka  { font-size: .78rem; color: var(--muted); margin-top: .35rem; }
  .card-aka span { font-style: italic; }

  .az-bar { display: flex; flex-wrap: wrap; gap: .3rem; padding: 1rem 1.5rem .5rem; }
  .az-btn { font-size: .78rem; font-weight: 600; padding: .2rem .5rem; border-radius: 5px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--muted); text-decoration: none; transition: all .12s; }
  .az-btn:hover { background: var(--types); color: #fff; border-color: transparent; }

  #empty { display: none; text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .count { font-size: .82rem; color: var(--muted); padding: 0 1.5rem .5rem; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>

<header>
  <h1>⚠️ Gestão de Riscos — Referência</h1>
  <p>ISO 31000:2018 · COSO ERM 2017 · Conceitos de Risco Corporativo e de TI</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="process">Processo ISO 31000</button>
  <button class="filter-btn" data-cat="concepts">Conceitos Fundamentais</button>
  <button class="filter-btn" data-cat="erm">ERM / COSO</button>
  <button class="filter-btn" data-cat="types">Tipos de Risco</button>
  <button class="filter-btn" data-cat="metrics">Métricas e Monitoramento</button>
</div>

<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>

<script>
const CAT_LABELS = {
  process:  "Processo ISO 31000",
  concepts: "Conceitos Fundamentais",
  erm:      "ERM / COSO",
  types:    "Tipos de Risco",
  metrics:  "Métricas e Monitoramento",
};

const TERMS = [
  // ── ISO 31000 — PROCESSO ──────────────────────────────────────────────────
  { name: "ISO 31000:2018", acronym: "", cat: "process", def: "Norma internacional que fornece princípios, estrutura e processo para gestão de riscos. Revisão de 2018 simplificou e alinhou com outras normas ISO. Aplicável a qualquer organização, setor, tipo ou tamanho de risco. Não é certificável — é uma norma de orientação, não de requisitos.", aka: "Gestão de Riscos — Diretrizes" },
  { name: "Processo de Gestão de Riscos (ISO 31000)", acronym: "", cat: "process", def: "Ciclo iterativo: (1) Comunicação e Consulta → (2) Escopo, Contexto e Critérios → (3) Avaliação de Riscos [Identificação → Análise → Avaliação] → (4) Tratamento de Riscos → (5) Monitoramento e Revisão → (6) Registro e Reporte. Comunicação e Consulta permeiam todas as etapas.", aka: "Risk Management Process" },
  { name: "Identificação de Riscos", acronym: "", cat: "process", def: "Primeira etapa da avaliação de riscos: encontrar, reconhecer e descrever riscos. Deve ser abrangente — riscos não identificados não são gerenciados. Técnicas: brainstorming, entrevistas, análise de cenários, análise de causa raiz, checklists, análise SWOT, revisão de incidentes históricos.", aka: "Risk Identification" },
  { name: "Análise de Riscos", acronym: "", cat: "process", def: "Segunda etapa: compreender a natureza do risco e determinar seu nível. Considera causas e fontes, probabilidade (likelihood) e consequências (impact), controles existentes e sua eficácia. Pode ser qualitativa (baixo/médio/alto), semiquantitativa (escalas numéricas) ou quantitativa (valores monetários/estatísticos).", aka: "Risk Analysis" },
  { name: "Avaliação de Riscos", acronym: "", cat: "process", def: "Terceira etapa: comparar os resultados da análise com os critérios de risco estabelecidos para decidir se o risco requer tratamento adicional e qual a prioridade. O resultado é uma lista priorizada de riscos com recomendação de tratamento.", aka: "Risk Evaluation" },
  { name: "Tratamento de Riscos", acronym: "", cat: "process", def: "Processo de selecionar e implementar opções para lidar com riscos. As 4 opções: (1) Evitar — eliminar a atividade que gera o risco; (2) Mitigar/Reduzir — diminuir probabilidade ou impacto; (3) Transferir/Compartilhar — passar o risco para terceiro (seguro, contrato); (4) Aceitar — sem ação adicional, documentado e aprovado.", aka: "Risk Treatment · Resposta ao Risco" },
  { name: "Contexto Externo e Interno", acronym: "", cat: "process", def: "Etapa inicial do processo ISO 31000: entender o ambiente no qual a organização opera. Contexto externo: ambiente político, econômico, social, tecnológico, ambiental e legal. Contexto interno: estrutura organizacional, estratégia, cultura, capacidades, sistemas e processos.", aka: "Context Establishment" },
  { name: "Comunicação e Consulta", acronym: "", cat: "process", def: "Atividade transversal do processo ISO 31000 que ocorre em todas as etapas. Envolve todas as partes interessadas (stakeholders) no processo de gestão de riscos. Garante que informações sobre riscos sejam compartilhadas e que as decisões reflitam múltiplas perspectivas.", aka: "" },

  // ── CONCEITOS FUNDAMENTAIS ────────────────────────────────────────────────
  { name: "Risco", acronym: "", cat: "concepts", def: "Efeito da incerteza nos objetivos. Um risco pode ser positivo (oportunidade) ou negativo (ameaça). Definição ISO 31000. O risco é expresso em termos de fontes de risco, eventos potenciais, suas consequências e probabilidades.", aka: "Risk" },
  { name: "Ameaça", acronym: "", cat: "concepts", def: "Causa potencial de um incidente que pode resultar em dano a um sistema, organização ou indivíduo. No contexto de segurança da informação (ISO 27001): agente ou evento com potencial para explorar uma vulnerabilidade.", aka: "Threat" },
  { name: "Vulnerabilidade", acronym: "", cat: "concepts", def: "Fraqueza de um ativo ou controle que pode ser explorada por uma ameaça. A vulnerabilidade por si só não causa dano — requer uma ameaça que a explore. Gestão de vulnerabilidades (Vulnerability Management) envolve identificação, classificação, remediação e mitigação.", aka: "Vulnerability · Fraqueza" },
  { name: "Impacto", acronym: "", cat: "concepts", def: "Consequência da materialização de um risco sobre os objetivos da organização. Pode ser financeiro, reputacional, operacional, legal ou estratégico. A análise de impacto considera severidade, escopo e duração das consequências.", aka: "Impact · Consequência" },
  { name: "Probabilidade", acronym: "", cat: "concepts", def: "Chance de ocorrência de um evento de risco, em determinado período. Pode ser expressa como frequência (número de ocorrências por ano) ou como probabilidade (0 a 1 ou %). Na análise qualitativa, usa-se escala descritiva: Raro, Improvável, Possível, Provável, Quase Certo.", aka: "Likelihood · Frequência" },
  { name: "Apetite a Risco", acronym: "", cat: "concepts", def: "Nível e tipo de risco que uma organização está disposta a aceitar em busca de seus objetivos. Declaração estratégica definida pela alta liderança. Diferente de tolerância: o apetite é a postura estratégica; a tolerância é a variação aceitável em relação a uma meta.", aka: "Risk Appetite" },
  { name: "Tolerância a Risco", acronym: "", cat: "concepts", def: "Variação aceitável em relação a uma meta específica. Enquanto o apetite a risco é estratégico e qualitativo, a tolerância é operacional e quantitativa. Exemplo: apetite 'baixo para riscos de conformidade'; tolerância '95% dos dados devem ser processados dentro do SLA'.", aka: "Risk Tolerance" },
  { name: "Limiar de Risco", acronym: "", cat: "concepts", def: "Nível de risco acima do qual uma resposta específica é desencadeada. Usado no monitoramento de riscos para alertas automáticos e escalonamento. Diferente da tolerância: o limiar é o gatilho para ação, a tolerância é o limite máximo aceitável.", aka: "Risk Threshold · Limite de Risco" },
  { name: "Risco Inerente", acronym: "", cat: "concepts", def: "Nível de risco existente antes da aplicação de qualquer controle. Representa a exposição bruta ao risco. Fórmula simplificada: Risco Inerente = Probabilidade × Impacto (sem controles).", aka: "Inherent Risk" },
  { name: "Risco Residual", acronym: "", cat: "concepts", def: "Risco remanescente após a implementação de controles de tratamento. O risco residual deve estar dentro do apetite a risco da organização. Fórmula: Risco Residual = Risco Inerente − Eficácia dos Controles.", aka: "Residual Risk · Risco Líquido" },
  { name: "Controle", acronym: "", cat: "concepts", def: "Medida que modifica o risco — reduzindo probabilidade, mitigando impacto ou aumentando a probabilidade de oportunidades. Controles preventivos evitam que o risco se materialize; controles detectivos identificam a ocorrência; controles corretivos reduzem o impacto após a ocorrência.", aka: "Control · Salvaguarda" },
  { name: "Matriz de Risco", acronym: "", cat: "concepts", def: "Ferramenta visual que classifica riscos cruzando probabilidade e impacto em uma grade (geralmente 5×5 ou 3×3). Zonas típicas: verde (baixo), amarelo (médio), laranja (alto), vermelho (crítico). Usada para priorizar riscos e comunicar exposição à liderança.", aka: "Heat Map · Risk Matrix" },

  // ── ERM / COSO ────────────────────────────────────────────────────────────
  { name: "ERM", acronym: "Enterprise Risk Management", cat: "erm", def: "Gestão de Riscos Corporativos — abordagem integrada e estratégica para gerenciar todos os riscos que podem afetar os objetivos de uma organização. Vai além do risco financeiro ou de TI: abrange riscos estratégicos, operacionais, de conformidade e de reporte. Frameworks principais: COSO ERM 2017, ISO 31000.", aka: "Gestão de Riscos Corporativos · GRC" },
  { name: "COSO ERM 2017", acronym: "", cat: "erm", def: "Framework do Committee of Sponsoring Organizations of the Treadway Commission para Gestão de Riscos Corporativos. Revisão de 2017 integrou ERM à estratégia e desempenho. 5 componentes: (1) Governança e Cultura; (2) Estratégia e Definição de Objetivos; (3) Desempenho; (4) Revisão e Revisão; (5) Informação, Comunicação e Reporte.", aka: "COSO Enterprise Risk Management" },
  { name: "COSO — Controles Internos", acronym: "", cat: "erm", def: "Framework COSO de Controles Internos (2013) define 5 componentes: Ambiente de Controle, Avaliação de Riscos, Atividades de Controle, Informação e Comunicação, e Monitoramento. Muito usado para conformidade com SOX. Complementar ao COSO ERM.", aka: "COSO Internal Control — Integrated Framework" },
  { name: "GRC", acronym: "Governance, Risk and Compliance", cat: "erm", def: "Disciplina integrada que combina Governança (direcionamento e accountability), Gestão de Riscos e Conformidade (compliance) em uma abordagem coerente. Plataformas GRC (ex: RSA Archer, ServiceNow GRC, MetricStream) centralizam políticas, riscos, controles e auditorias.", aka: "Governança, Risco e Conformidade" },
  { name: "Três Linhas de Defesa", acronym: "", cat: "erm", def: "Modelo de governança de risco: 1ª linha — gestão operacional (dono do processo/risco); 2ª linha — funções de risco e conformidade (gestão de riscos, compliance, segurança); 3ª linha — auditoria interna independente. Atualizado pelo IIA em 2020 como 'Modelo das Três Linhas'.", aka: "Three Lines Model · 3 Lines of Defense" },
  { name: "RCSA", acronym: "Risk and Control Self-Assessment", cat: "erm", def: "Processo pelo qual os donos de processos identificam, avaliam e gerenciam seus próprios riscos e controles. Ferramenta de autoavaliação estruturada, típica da 1ª linha de defesa. Pode ser baseada em workshops ou questionários eletrônicos. Resultado alimenta o mapa de riscos corporativo.", aka: "Autoavaliação de Riscos e Controles" },
  { name: "Registro de Riscos", acronym: "", cat: "erm", def: "Documento central de gestão de riscos que registra: identificação do risco, descrição, categoria, causa, consequência, probabilidade, impacto, nível de risco, controles existentes, dono do risco, plano de tratamento e status. Base do monitoramento e reporte de riscos.", aka: "Risk Register · Inventário de Riscos" },

  // ── TIPOS DE RISCO ────────────────────────────────────────────────────────
  { name: "Risco Estratégico", acronym: "", cat: "types", def: "Risco decorrente de decisões de negócio inadequadas, implementação inadequada de decisões ou falta de resposta a mudanças no setor. Exemplos: mudança tecnológica disruptiva, perda de market share, fusão mal-sucedida. É responsabilidade da alta liderança e do board.", aka: "Strategic Risk" },
  { name: "Risco Operacional", acronym: "", cat: "types", def: "Risco de perda resultante de processos internos inadequados ou falhos, pessoas, sistemas ou eventos externos. Definição do Comitê de Basileia II (setor financeiro). Exemplos: falha de sistema crítico, erro humano, fraude interna, desastre natural. Um dos tipos mais gerenciados em TI.", aka: "Operational Risk" },
  { name: "Risco de Conformidade", acronym: "", cat: "types", def: "Risco de sanções legais, regulatórias, financeiras ou reputacionais decorrentes de não-conformidade com leis, regulamentos, normas internas ou contratos. Cresce com o aumento da regulação (LGPD, GDPR, NIS2, DORA, SOX, PCI-DSS). A função de Compliance é a 2ª linha de defesa para este risco.", aka: "Compliance Risk · Risco Regulatório" },
  { name: "Risco de Crédito", acronym: "", cat: "types", def: "Risco de perda financeira pela inadimplência de um devedor. Principal no setor financeiro. Em TI, relevante para processos de faturamento, contratos de fornecedores e gestão de recebíveis em sistemas de pagamento.", aka: "Credit Risk" },
  { name: "Risco de Liquidez", acronym: "", cat: "types", def: "Risco de não ter caixa suficiente para honrar obrigações no curto prazo, mesmo que a organização seja solvente no longo prazo. Em TI, pode impactar a capacidade de pagar fornecedores críticos ou investir em resiliência.", aka: "Liquidity Risk" },
  { name: "Risco de Terceiros", acronym: "", cat: "types", def: "Risco decorrente de relacionamentos com fornecedores, parceiros, prestadores de serviços e outros terceiros. Inclui risco de concentração (dependência de poucos fornecedores), risco de conformidade (terceiros que não cumprem regulação) e risco de segurança (cadeia de suprimentos de TI).", aka: "Third-Party Risk · Vendor Risk · TPRM" },
  { name: "Risco Cibernético", acronym: "", cat: "types", def: "Risco decorrente de ameaças ao ambiente digital: malware, ransomware, phishing, DDoS, violação de dados, exploração de vulnerabilidades. Considerado risco sistêmico por reguladores como o BCE e o Banco Central do Brasil. Gerenciado por Segurança da Informação e referenciado no NIST CSF.", aka: "Cyber Risk · Risco de Segurança da Informação" },
  { name: "Risco de Continuidade", acronym: "", cat: "types", def: "Risco de interrupção das operações críticas por desastres, falhas de infraestrutura, pandemias ou outros eventos disruptivos. Gerenciado pelo BCM (Business Continuity Management) — ISO 22301. Métricas centrais: RTO (Recovery Time Objective) e RPO (Recovery Point Objective).", aka: "Business Continuity Risk · Risco Operacional Disruptivo" },

  // ── MÉTRICAS E MONITORAMENTO ──────────────────────────────────────────────
  { name: "KRI", acronym: "Key Risk Indicator", cat: "metrics", def: "Indicador-chave de risco: métrica que fornece alerta antecipado sobre aumento de exposição a riscos. Diferente do KPI (que mede desempenho realizado): o KRI é prospectivo. Exemplos em TI: número de vulnerabilidades críticas abertas > 30 dias, % de funcionários sem treinamento de segurança.", aka: "Indicador-Chave de Risco" },
  { name: "KPI de Risco", acronym: "", cat: "metrics", def: "Métricas que medem a eficácia do programa de gestão de riscos: taxa de riscos tratados dentro do prazo, % de controles efetivos, número de incidentes por categoria, tempo médio de resposta a incidentes. Diferentes dos KRIs (antecipados) — os KPIs de risco medem o que já aconteceu.", aka: "Risk KPI" },
  { name: "Mapa de Calor de Riscos", acronym: "", cat: "metrics", def: "Visualização gráfica do portfólio de riscos posicionando cada risco na matriz probabilidade × impacto. Ferramenta de comunicação eficaz para a alta liderança e o conselho de administração. Deve ser atualizado periodicamente e refletir tanto riscos inerentes quanto residuais.", aka: "Risk Heat Map · Radar de Riscos" },
  { name: "Valor em Risco", acronym: "VaR", cat: "metrics", def: "Value at Risk: técnica estatística que estima a perda máxima esperada em um portfólio ou processo, dado um nível de confiança e um horizonte de tempo. Muito usado no mercado financeiro. Em gestão de riscos corporativos, complementado por análises de cenário e stress test.", aka: "Value at Risk" },
  { name: "Custo do Risco", acronym: "CoR", cat: "metrics", def: "Total dos custos relacionados ao gerenciamento de riscos em um período: prêmios de seguro + perdas não seguradas + custos de gestão de risco (pessoal, sistemas, consultores) + custo de controles internos. Métrica para justificar investimentos em gestão de riscos à liderança.", aka: "Cost of Risk" },
  { name: "Stress Test", acronym: "", cat: "metrics", def: "Simulação de cenários extremos (mas plausíveis) para avaliar impacto em sistemas, processos ou finanças. Exigido por reguladores do setor financeiro (Banco Central, ECB). Em TI, aplicado a sistemas críticos para verificar comportamento sob carga extrema, falhas encadeadas ou ataques simulados.", aka: "Teste de Estresse · Análise de Cenário" },
];

TERMS.sort((a,b) => a.name.localeCompare(b.name, 'pt'));

let currentCat = 'all', currentQ = '';

function firstLetter(s) {
  const c = s.trim().toUpperCase()[0];
  return /[A-Z]/.test(c) ? c : '#';
}

function render() {
  const q = currentQ.toLowerCase(), cat = currentCat;
  const filtered = TERMS.filter(t => {
    const matchCat = cat === 'all' || t.cat === cat;
    const matchQ = !q || t.name.toLowerCase().includes(q) || (t.acronym||'').toLowerCase().includes(q) || t.def.toLowerCase().includes(q) || (t.aka||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('count').textContent = `${filtered.length} termo${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const groups = {};
  filtered.forEach(t => { const l = firstLetter(t.name); if (!groups[l]) groups[l] = []; groups[l].push(t); });
  const letters = Object.keys(groups).sort();

  document.getElementById('azBar').innerHTML = letters.map(l => `<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!filtered.length) { document.getElementById('empty').style.display = 'block'; return; }
  document.getElementById('empty').style.display = 'none';

  letters.forEach(l => {
    const grp = document.createElement('div');
    grp.className = 'letter-group'; grp.id = `grp-${l}`;
    grp.innerHTML = `<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t => {
      const aka = t.aka ? `<div class="card-aka">Também: <span>${t.aka}</span></div>` : '';
      const acr = t.acronym ? `<span class="card-acronym">— ${t.acronym}</span>` : '';
      grp.innerHTML += `<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}

document.getElementById('search').addEventListener('input', e => { currentQ = e.target.value; render(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
