<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBIT 2019 — Referência</title>
<style>
  :root {
    --azul: #1F36C7;
    --azul-escuro: #1a237e;
    --azul-light: #e8ecfd;
    --cinza: #f4f5fb;
    --borda: #d6dbf2;
    --text: #1a1f3a;
    --text-muted: #6b7280;
    --white: #fff;
    --cat-governance: #1F36C7;
    --cat-governance-bg: #e8ecfd;
    --cat-management: #7c3aed;
    --cat-management-bg: #f3f0ff;
    --cat-components: #d97706;
    --cat-components-bg: #fffbeb;
    --cat-concepts: #374151;
    --cat-concepts-bg: #f3f4f6;
    --cat-design: #059669;
    --cat-design-bg: #ecfdf5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cinza); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 100%);
    color: #fff; padding: 28px 40px 24px;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

  .search-wrap { background: var(--azul-escuro); padding: 0 40px 28px; }
  .search-box { position: relative; max-width: 700px; }
  .search-box input {
    width: 100%; padding: 14px 20px 14px 48px; font-size: 1rem;
    border: none; border-radius: 10px; outline: none;
    background: rgba(255,255,255,0.12); color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.6); font-size: 1.1rem; pointer-events: none;
  }

  .filters-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 14px 40px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px;
    border-radius: 20px; border: 1.5px solid var(--borda);
    background: var(--white); color: var(--text-muted);
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--azul); color: var(--azul); }
  .filter-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .filter-btn[data-cat="governance"].active { background: var(--cat-governance); border-color: var(--cat-governance); }
  .filter-btn[data-cat="management"].active { background: var(--cat-management); border-color: var(--cat-management); }
  .filter-btn[data-cat="components"].active { background: var(--cat-components); border-color: var(--cat-components); }
  .filter-btn[data-cat="concepts"].active   { background: var(--cat-concepts);   border-color: var(--cat-concepts); }
  .filter-btn[data-cat="design"].active     { background: var(--cat-design);     border-color: var(--cat-design); }
  .filters-right { margin-left: auto; font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }

  .az-bar {
    background: var(--white); border-bottom: 1.5px solid var(--borda);
    padding: 8px 40px; display: flex; gap: 3px; flex-wrap: wrap;
  }
  .az-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    color: var(--azul); transition: all 0.15s; background: none; border: none; text-decoration: none;
  }
  .az-btn:hover { background: var(--azul-light); }
  .az-btn.disabled { color: var(--borda); cursor: default; }
  .az-btn.disabled:hover { background: none; }

  .content { padding: 30px 40px 60px; }
  .letter-section { margin-bottom: 36px; }
  .letter-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .letter-heading h2 { font-size: 1.6rem; font-weight: 800; color: var(--azul-escuro); min-width: 36px; }
  .letter-heading hr { flex: 1; border: none; border-top: 2px solid var(--borda); }
  .terms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .term-card {
    background: var(--white); border: 1.5px solid var(--borda);
    border-radius: 10px; padding: 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover { box-shadow: 0 2px 12px rgba(31,54,199,0.08); border-color: #b8c4f0; }
  .term-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .term-name { font-size: 0.97rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .term-acronym {
    font-size: 0.78rem; font-weight: 600; color: var(--azul);
    background: var(--azul-light); padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .term-def { font-size: 0.85rem; color: #374151; line-height: 1.55; margin-bottom: 8px; }
  .term-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
    border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.3px;
  }
  .cat-governance  { color: var(--cat-governance);  background: var(--cat-governance-bg); }
  .cat-management  { color: var(--cat-management);  background: var(--cat-management-bg); }
  .cat-components  { color: var(--cat-components);  background: var(--cat-components-bg); }
  .cat-concepts    { color: var(--cat-concepts);    background: var(--cat-concepts-bg); }
  .cat-design      { color: var(--cat-design);      background: var(--cat-design-bg); }
  .term-aka { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:.55rem 1.5rem;font-size:.8rem;color:#64748b"><a href="../governanca-ti/" style="color:#1F36C7;text-decoration:none;font-weight:600">← Hub de Governança de TI</a></div>
<header>
  <h1>🏛️ COBIT 2019 — Referência</h1>
  <p>Objetivos de governança e gestão, componentes do sistema, design factors e conceitos fundamentais</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar objetivo, componente ou sigla…" autocomplete="off">
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="governance">🔵 Governança (EDM)</button>
  <button class="filter-btn" data-cat="management">🟣 Gestão (APO/BAI/DSS/MEA)</button>
  <button class="filter-btn" data-cat="components">🟠 Componentes</button>
  <button class="filter-btn" data-cat="design">🟢 Design Factors</button>
  <button class="filter-btn" data-cat="concepts">⚫ Conceitos</button>
  <div class="filters-right" id="countDisplay"></div>
</div>

<div class="az-bar" id="azBar"></div>
<div class="content" id="content"></div>

<script>
const TERMS = [
  // GOVERNANÇA (EDM)
  { name: "EDM01 — Garantir Definição e Manutenção do Framework", acronym: "EDM01", cat: "governance", def: "Objetivo de governança: garantir que o framework de governança de TI da empresa seja definido, mantido e validado. Inclui papéis, responsabilidades e princípios de governança.", aka: "" },
  { name: "EDM02 — Garantir Entrega de Benefícios", acronym: "EDM02", cat: "governance", def: "Garantir que os investimentos em TI sejam avaliados quanto ao potencial de criação de valor, priorizando iniciativas que maximizem benefícios para a organização.", aka: "" },
  { name: "EDM03 — Garantir Otimização do Risco", acronym: "EDM03", cat: "governance", def: "Garantir que o apetite e a tolerância ao risco da empresa sejam compreendidos, gerenciados e comunicados, e que os riscos de TI não excedam o apetite ao risco.", aka: "" },
  { name: "EDM04 — Garantir Otimização de Recursos", acronym: "EDM04", cat: "governance", def: "Garantir que os recursos de TI (pessoas, processos, tecnologia) sejam obtidos, mantidos e alocados de forma adequada para suportar os objetivos estratégicos.", aka: "" },
  { name: "EDM05 — Garantir Transparência para Partes Interessadas", acronym: "EDM05", cat: "governance", def: "Garantir que o desempenho e a conformidade de TI da empresa sejam comunicados com precisão e oportunidade às partes interessadas, para suportar decisões de governança.", aka: "" },

  // GESTÃO
  { name: "APO01 — Gerenciar o Framework de Gestão de TI", acronym: "APO01", cat: "management", def: "Domínio Align, Plan and Organize: clarificar e manter a missão e visão de TI, implementar e manter os mecanismos e autoridades para gestão de informação e tecnologia.", aka: "" },
  { name: "APO02 — Gerenciar Estratégia", acronym: "APO02", cat: "management", def: "Fornecer visão holística de negócios e TI para alinhar estratégias e garantir que os planos de TI suportem os objetivos estratégicos corporativos.", aka: "" },
  { name: "APO03 — Gerenciar Arquitetura Empresarial", acronym: "APO03", cat: "management", def: "Estabelecer uma arquitetura comum composta por processos de negócio, informação, dados, aplicações e tecnologia para realizar estratégias de TI e negócios de forma eficaz.", aka: "" },
  { name: "APO06 — Gerenciar Orçamento e Custos", acronym: "APO06", cat: "management", def: "Gerenciar as atividades financeiras relacionadas a TI nas funções de negócio e TI, cobrindo budget, custo/benefício e priorização de gastos.", aka: "" },
  { name: "APO07 — Gerenciar Recursos Humanos", acronym: "APO07", cat: "management", def: "Fornecer abordagem estruturada para garantir estrutura ótima, posicionamento, direitos de decisão e habilidades de RH de TI.", aka: "" },
  { name: "APO12 — Gerenciar Risco", acronym: "APO12", cat: "management", def: "Identificar, avaliar e reduzir riscos relacionados a TI de forma contínua, dentro de níveis de tolerância estabelecidos pela gestão sênior.", aka: "" },
  { name: "BAI01 — Gerenciar Programas", acronym: "BAI01", cat: "management", def: "Domínio Build, Acquire and Implement: gerenciar todos os programas do portfólio de investimentos de TI de acordo com a estratégia e coordenar atividades de projetos e programas.", aka: "" },
  { name: "BAI06 — Gerenciar Mudanças de TI", acronym: "BAI06", cat: "management", def: "Gerenciar todas as mudanças de forma controlada, incluindo mudanças padrão e emergenciais, para minimizar o risco de impacto negativo na estabilidade e disponibilidade do ambiente de TI.", aka: "" },
  { name: "BAI10 — Gerenciar Configuração", acronym: "BAI10", cat: "management", def: "Definir e manter descrições e relacionamentos entre recursos-chave de TI, e fornecer informações precisas de configuração quando e onde necessário para suportar gestão de serviços.", aka: "CMDB" },
  { name: "DSS01 — Gerenciar Operações", acronym: "DSS01", cat: "management", def: "Domínio Deliver, Service and Support: coordenar e executar as atividades e procedimentos operacionais necessários para entregar serviços de TI internos e terceirizados.", aka: "" },
  { name: "DSS02 — Gerenciar Requisições e Incidentes de Serviço", acronym: "DSS02", cat: "management", def: "Fornecer resposta oportuna e eficaz às requisições de usuário e resolução de todos os tipos de incidentes para restaurar o serviço normal.", aka: "" },
  { name: "DSS03 — Gerenciar Problemas", acronym: "DSS03", cat: "management", def: "Identificar e classificar problemas, investigar suas causas raízes e fornecer soluções para prevenir incidentes recorrentes e minimizar impacto.", aka: "" },
  { name: "DSS04 — Gerenciar Continuidade", acronym: "DSS04", cat: "management", def: "Estabelecer e manter um plano para permitir que negócios e TI respondam a incidentes e interrupções a fim de continuar as operações de processos críticos de negócio.", aka: "" },
  { name: "DSS05 — Gerenciar Serviços de Segurança", acronym: "DSS05", cat: "management", def: "Proteger informações corporativas para manter o nível de risco de segurança de informação aceitável para a empresa, de acordo com a política de segurança.", aka: "" },
  { name: "MEA01 — Gerenciar Monitoramento de Desempenho e Conformidade", acronym: "MEA01", cat: "management", def: "Domínio Monitor, Evaluate and Assess: coletar, validar e avaliar objetivos, métricas e medições de negócios e de TI para monitorar se processos estão performando conforme acordado.", aka: "" },
  { name: "MEA02 — Gerenciar Sistema de Controles Internos", acronym: "MEA02", cat: "management", def: "Obter transparência para partes interessadas sobre a adequação do sistema de controles internos e fomentar transparência e conformidade com leis e regulamentos relevantes.", aka: "" },

  // COMPONENTES
  { name: "Cultura e Comportamento", acronym: "", cat: "components", def: "Componente do sistema de governança COBIT: valores, crenças e comportamentos tanto de indivíduos quanto de grupos da empresa. Determinam a efetividade dos outros componentes.", aka: "" },
  { name: "Fluxos e Itens de Informação", acronym: "", cat: "components", def: "Componente que representa toda a informação produzida e usada pelo objetivo de governança ou gestão. Inclui inputs e outputs necessários para executar atividades do objetivo.", aka: "Information Items" },
  { name: "Pessoas, Habilidades e Competências", acronym: "", cat: "components", def: "Componente que representa as habilidades e experiências necessárias para concluir atividades e tomar decisões corretas. Inclui capacidades individuais, treinamento e recrutamento.", aka: "" },
  { name: "Políticas e Procedimentos", acronym: "", cat: "components", def: "Componente que inclui instruções para traduzir o comportamento desejado em orientações práticas do dia a dia dentro de um objetivo de governança ou gestão.", aka: "" },
  { name: "Princípios e Políticas", acronym: "", cat: "components", def: "Mecanismo para traduzir o comportamento desejado em orientações práticas de gestão. Políticas são declarações de intenção e direção; procedimentos, como implementá-las.", aka: "" },
  { name: "Processos", acronym: "", cat: "components", def: "Componente central de cada objetivo COBIT: conjunto organizado de práticas e atividades para atingir certos objetivos e produzir outputs que suportem metas de TI e negócios.", aka: "" },
  { name: "Serviços, Infraestrutura e Aplicações", acronym: "", cat: "components", def: "Componente que inclui a infraestrutura, tecnologia e aplicações que fornecem aos objetivos de governança/gestão as capacidades de processamento de TI necessárias.", aka: "" },
  { name: "Estruturas Organizacionais", acronym: "", cat: "components", def: "Componente que representa as principais entidades de tomada de decisão dentro de uma organização, como comitês executivos, comitê de risco de TI, comitê de investimento.", aka: "" },

  // DESIGN FACTORS
  { name: "Estratégia Empresarial", acronym: "", cat: "design", def: "Design factor: o tipo de estratégia empresarial (crescimento/aquisição, inovação/diferenciação, redução de custo/eficiência) que determina as prioridades de governança de TI.", aka: "" },
  { name: "Goals Cascade", acronym: "", cat: "design", def: "Mecanismo COBIT que traduz stakeholder needs → Enterprise Goals → Alignment Goals → Governance & Management Objectives. Permite identificar quais objetivos COBIT priorizar conforme o contexto.", aka: "Cascata de Objetivos" },
  { name: "Metas de Alinhamento", acronym: "", cat: "design", def: "Conjunto de 13 Alignment Goals no COBIT 2019 que conectam objetivos de negócio (Enterprise Goals) a objetivos de governança e gestão de TI. Intermediários na cascata de objetivos.", aka: "Alignment Goals" },
  { name: "Metas Empresariais", acronym: "", cat: "design", def: "Conjunto de 13 Enterprise Goals no COBIT 2019 que representam objetivos típicos de negócio. Classificados em Financeiro, Cliente, Interno e Aprendizado & Crescimento (perspectiva BSC).", aka: "Enterprise Goals" },
  { name: "Papel de TI", acronym: "", cat: "design", def: "Design factor: como a TI é posicionada na organização — suporte (cost center), habilitador estratégico ou parceiro estratégico. Define o escopo e profundidade da governança necessária.", aka: "" },
  { name: "Perfil de Risco", acronym: "", cat: "design", def: "Design factor: avaliação do nível de risco atual de TI e da tolerância ao risco da organização. Alto perfil de risco requer objetivos de gestão de risco mais robustos.", aka: "" },
  { name: "Tamanho da Organização", acronym: "", cat: "design", def: "Design factor: organizações maiores e mais complexas geralmente requerem um sistema de governança mais elaborado; pequenas empresas podem adaptar o COBIT de forma mais simplificada.", aka: "" },

  // CONCEITOS
  { name: "Apetite ao Risco", acronym: "", cat: "concepts", def: "Nível de risco que uma organização está disposta a aceitar em busca de seus objetivos de negócio. Distinto da tolerância ao risco (limite máximo aceitável em situações específicas).", aka: "Risk Appetite" },
  { name: "COBIT", acronym: "Control Objectives for Information and Related Technologies", cat: "concepts", def: "Framework de governança e gestão de TI desenvolvido pela ISACA, publicado em 2019 na versão atual. Fornece conjunto abrangente de objetivos de governança (EDM) e gestão (APO, BAI, DSS, MEA) com componentes para implementação.", aka: "" },
  { name: "Conformidade", acronym: "", cat: "concepts", def: "Aderência a leis, regulamentos, políticas, contratos e obrigações. No COBIT, gerenciada principalmente pelos objetivos MEA02 (controles internos) e MEA03 (conformidade externa).", aka: "Compliance" },
  { name: "Controle Interno", acronym: "", cat: "concepts", def: "Conjunto de processos, políticas, procedimentos e estruturas organizacionais projetados para mitigar riscos e garantir que os objetivos da organização sejam alcançados.", aka: "" },
  { name: "Foco Areas", acronym: "", cat: "concepts", def: "Conjuntos de objetivos COBIT pré-selecionados para contextos específicos: Segurança da Informação, DevOps, Privacidade de Dados, Risco de TI, Cloud Computing. Facilitam implementação direcionada.", aka: "" },
  { name: "ISACA", acronym: "Information Systems Audit and Control Association", cat: "concepts", def: "Associação internacional que desenvolve e publica o framework COBIT, além de certificações como CISA, CISM e CRISC. Referência global em governança, auditoria e segurança de TI.", aka: "" },
  { name: "Maturidade de Capacidade", acronym: "", cat: "concepts", def: "Escala COBIT 2019 de 0 a 5 que mede o quão desenvolvida e gerenciada é a prática de um objetivo: 0-Incompleto, 1-Executado, 2-Gerenciado, 3-Estabelecido, 4-Previsível, 5-Otimizado.", aka: "Capability Maturity Level" },
  { name: "Necessidades dos Stakeholders", acronym: "", cat: "concepts", def: "Ponto de partida da Goals Cascade: as necessidades de partes interessadas (valor, risco e recursos) são traduzidas em objetivos empresariais mensuráveis para orientar a governança de TI.", aka: "Stakeholder Needs" },
  { name: "NIS2", acronym: "Network and Information Security Directive 2", cat: "concepts", def: "Diretiva europeia de cibersegurança (2022/2555) que substitui a NIS original, ampliando o escopo para mais setores e impondo requisitos mais rigorosos de gestão de risco, resposta a incidentes e cadeia de suprimentos. O COBIT é usado como framework para demonstrar conformidade com a NIS2.", aka: "" },
  { name: "DORA", acronym: "Digital Operational Resilience Act", cat: "concepts", def: "Regulamento europeu para o setor financeiro (2022/2554) que exige resiliência operacional digital: gestão de risco de TIC, testes de resiliência, gestão de incidentes e risco de terceiros. O COBIT, especialmente DSS04 (Continuidade) e APO12 (Risco), apoia a conformidade com DORA.", aka: "" },
  { name: "RACI", acronym: "Responsible, Accountable, Consulted, Informed", cat: "concepts", def: "Matriz de responsabilidade usada no COBIT para cada objetivo: quem Executa (R), quem é Responsável final (A), quem deve ser Consultado (C) e quem deve ser Informado (I).", aka: "Matriz RACI" },
  { name: "Sistema de Governança", acronym: "", cat: "concepts", def: "No COBIT 2019, o sistema de governança de TI é composto por sete componentes: Processos; Estruturas Organizacionais; Princípios e Políticas; Informação; Cultura e Comportamento; Pessoas e Competências; Serviços e Tecnologia.", aka: "Governance System" },
  { name: "Governança de IA com COBIT", acronym: "", cat: "concepts", def: "Uso do COBIT como framework para governança de sistemas de IA: aplicação dos objetivos EDM03 (risco), APO02 (estratégia), APO12 (gestão de risco) e MEA01 (monitoramento) para garantir que iniciativas de IA sejam responsáveis, auditáveis e alinhadas ao negócio. Iniciativa reconhecida pela ISACA com publicação dedicada.", aka: "AI Governance" },

  // OBJETIVOS ADICIONAIS
  { name: "APO09 — Gerenciar Acordos de Serviço", acronym: "APO09", cat: "management", def: "Domínio Align, Plan and Organize: alinhar serviços de TI e níveis de serviço com as necessidades e expectativas da empresa, incluindo identificação, especificação, design, publicação, acordo e monitoramento de serviços de TI, SLAs e OLAs.", aka: "" },
  { name: "APO10 — Gerenciar Fornecedores", acronym: "APO10", cat: "management", def: "Gerenciar serviços e produtos de TI fornecidos por terceiros para atender às necessidades da empresa, incluindo seleção de fornecedores, gestão de relacionamentos, contratos e monitoramento de desempenho.", aka: "" },
  { name: "DSS06 — Gerenciar Controles de Processos de Negócio", acronym: "DSS06", cat: "management", def: "Domínio Deliver, Service and Support: definir e manter controles apropriados de processos de negócio para garantir que informações processadas por esses processos satisfaçam todos os requisitos relevantes de controle da informação.", aka: "" },
  { name: "MEA03 — Gerenciar Conformidade com Requisitos Externos", acronym: "MEA03", cat: "management", def: "Domínio Monitor, Evaluate and Assess: avaliar que os processos de TI e suporte aos negócios estão em conformidade com leis, regulamentos e obrigações contratuais. Obter confirmação de conformidade e garantir que as não-conformidades sejam tratadas.", aka: "" }
];

TERMS.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

const CAT_LABELS = {
  governance:  "🔵 Governança (EDM)",
  management:  "🟣 Gestão",
  components:  "🟠 Componentes",
  design:      "🟢 Design Factors",
  concepts:    "⚫ Conceitos"
};

let currentCat = "all";
let currentSearch = "";

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === "all" || t.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.acronym.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.aka.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const content = document.getElementById("content");
  const countDisplay = document.getElementById("countDisplay");
  countDisplay.textContent = `${filtered.length} de ${TERMS.length} termos`;

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum termo encontrado</h3><p>Tente buscar por outra palavra ou limpe os filtros.</p></div>`;
    return;
  }

  const byLetter = {};
  filtered.forEach(t => {
    const letter = t.name[0].toUpperCase();
    if (!byLetter[letter]) byLetter[letter] = [];
    byLetter[letter].push(t);
  });

  let html = "";
  Object.keys(byLetter).sort().forEach(letter => {
    html += `<div class="letter-section" id="letter-${letter}">
      <div class="letter-heading"><h2>${letter}</h2><hr></div>
      <div class="terms-grid">`;
    byLetter[letter].forEach(t => {
      html += `<div class="term-card">
        <div class="term-header">
          <div class="term-name">${t.name}</div>
          ${t.acronym ? `<div class="term-acronym">${t.acronym}</div>` : ""}
        </div>
        <div class="term-def">${t.def}</div>
        <div class="term-footer">
          <span class="cat-tag cat-${t.cat}">${CAT_LABELS[t.cat]}</span>
          ${t.aka ? `<span class="term-aka">Tb. conhecido como: ${t.aka}</span>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html;
  updateAZBar(byLetter);
}

function updateAZBar(byLetter) {
  const bar = document.getElementById("azBar");
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  bar.innerHTML = all.map(l => {
    if (byLetter && byLetter[l]) return `<a class="az-btn" href="#letter-${l}">${l}</a>`;
    return `<span class="az-btn disabled">${l}</span>`;
  }).join("");
}

updateAZBar(null);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
