<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevSecOps — Referência</title>
<style>
  :root {
    --sdlc:     #0f766e;
    --testing:  #7c3aed;
    --supply:   #d97706;
    --ops:      #0369a1;
    --concepts: #94a3b8;
    --bg: #0f1117; --card: #1a1d27; --border: #2e3248;
    --text: #e8eaf0; --muted: #8890aa; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .breadcrumb { background: #1a1d27; border-bottom: 1px solid var(--border); padding: .55rem 1.5rem; font-size: .8rem; color: var(--muted); }
  .breadcrumb a { color: var(--sdlc); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }

  header { background: linear-gradient(135deg, #064e3b 0%, var(--sdlc) 100%); color: #fff; padding: 2rem 1.5rem 1.5rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header p  { opacity: .85; margin-top: .4rem; font-size: .95rem; }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; padding: 1.25rem 1.5rem; background: #1a1d27; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .controls input { flex: 1; min-width: 200px; padding: .55rem .9rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; background: #12141e; color: var(--text); }
  .controls input:focus { outline: 2px solid var(--sdlc); border-color: transparent; }

  .filter-btn { padding: .45rem .9rem; border-radius: 999px; border: 1.5px solid var(--border); background: #1a1d27; font-size: .82rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--text); }
  .filter-btn:hover { border-color: #94a3b8; }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-cat="all"].active      { background: #3d4f6b; color: #e8eaf0; }
  .filter-btn[data-cat="sdlc"].active     { background: var(--sdlc); }
  .filter-btn[data-cat="testing"].active  { background: var(--testing); }
  .filter-btn[data-cat="supply"].active   { background: var(--supply); }
  .filter-btn[data-cat="ops"].active      { background: var(--ops); }
  .filter-btn[data-cat="concepts"].active { background: var(--concepts); }

  main { width: 100%; box-sizing: border-box; padding: 1.5rem 3rem; }
  .letter-group { margin-bottom: 2rem; }
  .letter-anchor { font-size: 1.3rem; font-weight: 700; color: var(--muted); margin-bottom: .75rem; padding-bottom: .3rem; border-bottom: 2px solid var(--border); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .65rem; border-left: 4px solid #94a3b8; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .card[data-cat="sdlc"]     { border-left-color: var(--sdlc); }
  .card[data-cat="testing"]  { border-left-color: var(--testing); }
  .card[data-cat="supply"]   { border-left-color: var(--supply); }
  .card[data-cat="ops"]      { border-left-color: var(--ops); }
  .card[data-cat="concepts"] { border-left-color: var(--concepts); }

  .card-header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
  .card-name   { font-size: 1rem; font-weight: 700; }
  .card-acronym { font-size: .82rem; color: var(--muted); font-weight: 400; }
  .card-tag    { font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; color: #fff; margin-left: auto; white-space: nowrap; }
  .card[data-cat="sdlc"]     .card-tag { background: var(--sdlc); }
  .card[data-cat="testing"]  .card-tag { background: var(--testing); }
  .card[data-cat="supply"]   .card-tag { background: var(--supply); }
  .card[data-cat="ops"]      .card-tag { background: var(--ops); }
  .card[data-cat="concepts"] .card-tag { background: var(--concepts); }

  .card-def  { font-size: .88rem; color: #c8ccd8; line-height: 1.55; }
  .card-aka  { font-size: .78rem; color: var(--muted); margin-top: .35rem; }
  .card-aka span { font-style: italic; }

  .az-bar { display: flex; flex-wrap: wrap; gap: .3rem; padding: 1rem 1.5rem .5rem; }
  .az-btn { font-size: .78rem; font-weight: 600; padding: .2rem .5rem; border-radius: 5px; border: 1px solid var(--border); background: #1a1d27; cursor: pointer; color: var(--muted); text-decoration: none; transition: all .12s; }
  .az-btn:hover { background: var(--sdlc); color: #fff; border-color: transparent; }

  #empty { display: none; text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .count { font-size: .82rem; color: var(--muted); padding: 0 1.5rem .5rem; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>

<header>
  <h1>🛡️ DevSecOps — Referência</h1>
  <p>Secure SDLC · SAST / DAST / SCA · SBOM · Supply Chain Security · Pipeline Security</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="sdlc">Secure SDLC</button>
  <button class="filter-btn" data-cat="testing">Testes de Segurança</button>
  <button class="filter-btn" data-cat="supply">Supply Chain</button>
  <button class="filter-btn" data-cat="ops">Operações e Pipeline</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Frameworks</button>
</div>

<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>

<script>
const CAT_LABELS = {
  sdlc:     "Secure SDLC",
  testing:  "Testes de Segurança",
  supply:   "Supply Chain",
  ops:      "Operações e Pipeline",
  concepts: "Conceitos e Frameworks",
};

const TERMS = [
  // ── SECURE SDLC ───────────────────────────────────────────────────────────
  { name: "DevSecOps", acronym: "", cat: "sdlc", def: "Extensão do DevOps que integra segurança em todas as fases do ciclo de desenvolvimento de software — do design ao deploy e operações. O princípio central é 'security as code': automação de verificações de segurança no pipeline CI/CD para detectar vulnerabilidades cedo (shift-left) e continuamente.", aka: "Development Security Operations" },
  { name: "Secure SDLC", acronym: "S-SDLC", cat: "sdlc", def: "Ciclo de Desenvolvimento de Software Seguro: metodologia que incorpora práticas de segurança em cada fase do SDLC. Fases com atividades de segurança: Requisitos (modelagem de ameaças), Design (arquitetura segura, revisão de design), Desenvolvimento (padrões de codificação segura, SAST), Teste (DAST, pen test), Release (revisão de segurança), Operação (monitoramento, patch management).", aka: "Secure Software Development Life Cycle · Microsoft SDL · OWASP SAMM" },
  { name: "Shift-Left Security", acronym: "", cat: "sdlc", def: "Princípio de mover verificações de segurança para as fases mais iniciais do desenvolvimento (para a 'esquerda' no pipeline). Quanto mais cedo uma vulnerabilidade é descoberta, menor o custo de correção. Implementado com: linting de segurança no IDE, pre-commit hooks, SAST no pipeline CI, revisão de código com foco em segurança.", aka: "Segurança à Esquerda" },
  { name: "Threat Modeling", acronym: "", cat: "sdlc", def: "Processo estruturado para identificar, quantificar e abordar riscos de segurança em um sistema. Realizado na fase de design. Frameworks populares: STRIDE (Spoofing, Tampering, Repudiation, Information Disclosure, DoS, Elevation of Privilege), PASTA, LINDDUN (focado em privacidade), Attack Trees. Resultado: lista de ameaças e contramedidas.", aka: "Modelagem de Ameaças · STRIDE · PASTA" },
  { name: "Secure Coding Standards", acronym: "", cat: "sdlc", def: "Conjunto de regras e diretrizes para escrever código resistente a vulnerabilidades. Referências: OWASP Top 10 (vulnerabilidades web mais críticas), SANS CWE Top 25 (fraquezas de software mais perigosas), SEI CERT Coding Standards (C, C++, Java). Implementados com code reviews, linters (Semgrep, Checkstyle), training de desenvolvedores.", aka: "Padrões de Codificação Segura · OWASP Top 10 · CWE" },
  { name: "Security Champions", acronym: "", cat: "sdlc", def: "Desenvolvedores ou engenheiros de times de produto treinados em segurança que atuam como ponto de contato do time de AppSec dentro de suas equipes de desenvolvimento. Responsáveis por promover cultura de segurança, realizar revisões de código com foco em segurança, e ser a ponte entre o time de produto e o time de segurança.", aka: "Security Ambassador · AppSec Champion" },

  // ── TESTES DE SEGURANÇA ───────────────────────────────────────────────────
  { name: "SAST", acronym: "Static Application Security Testing", cat: "testing", def: "Análise do código-fonte, bytecode ou binário em busca de vulnerabilidades sem executar a aplicação (white-box). Pode ser integrado ao IDE e ao pipeline CI. Detecta: injeções SQL/XSS, uso de funções inseguras, hardcoded credentials, lógica de controle de acesso incorreta. Ferramentas: Semgrep, Checkmarx, Veracode, SonarQube (SAST), Bandit (Python), Brakeman (Ruby).", aka: "Análise Estática · White-box Testing" },
  { name: "DAST", acronym: "Dynamic Application Security Testing", cat: "testing", def: "Teste da aplicação em execução, simulando ataques externos sem acesso ao código-fonte (black-box). Detecta vulnerabilidades que só se manifestam em runtime: configurações erradas, problemas de autenticação/sessão, falhas de injeção não detectadas pelo SAST. Ferramentas: OWASP ZAP, Burp Suite, Nikto. Executado em ambiente de staging/homologação.", aka: "Análise Dinâmica · Black-box Testing" },
  { name: "IAST", acronym: "Interactive Application Security Testing", cat: "testing", def: "Abordagem híbrida que instrumenta a aplicação com agentes que monitoram o comportamento durante a execução de testes funcionais. Combina vantagens do SAST (acesso ao código) e do DAST (execução real). Menor taxa de falsos positivos. Ferramentas: Contrast Security, Seeker (Synopsys). Adequado para aplicações com testes funcionais automatizados.", aka: "Teste Interativo de Segurança" },
  { name: "SCA", acronym: "Software Composition Analysis", cat: "testing", def: "Análise automatizada de bibliotecas e dependências open-source usadas pela aplicação, identificando vulnerabilidades conhecidas (CVEs) e problemas de licença. Essencial para o supply chain security. Ferramentas: Dependabot (GitHub), Snyk, OWASP Dependency-Check, Mend (WhiteSource), Trivy. Integrado ao pipeline CI para alertar sobre dependências vulneráveis.", aka: "Análise de Composição de Software · Dependency Scanning" },
  { name: "Penetration Testing", acronym: "Pen Test", cat: "testing", def: "Simulação controlada de ataque real para avaliar a segurança de um sistema. Tipos: Black-box (sem conhecimento prévio), Gray-box (conhecimento parcial), White-box (acesso total ao código e infraestrutura). Fases: Reconhecimento → Enumeração → Exploração → Pós-exploração → Relatório. Deve ser autorizado formalmente (Rules of Engagement).", aka: "Teste de Invasão · Ethical Hacking · Red Team" },
  { name: "Fuzzing", acronym: "Fuzz Testing", cat: "testing", def: "Técnica que envia inputs aleatórios, inesperados ou malformados para uma aplicação para descobrir bugs, crashes e vulnerabilidades. Tipos: dumb fuzzing (completamente aleatório), mutation-based (mutação de inputs válidos), generation-based (geração inteligente baseada em gramáticas). Ferramentas: AFL++, libFuzzer, Boofuzz. Eficaz para encontrar vulnerabilidades de memória em software nativo.", aka: "Fuzz Testing" },
  { name: "DAST vs SAST", acronym: "", cat: "testing", def: "Comparação prática: SAST — mais rápido, integrado ao desenvolvimento, sem ambiente de execução necessário, mais falsos positivos, não detecta vulnerabilidades de runtime. DAST — mais lento, requer ambiente rodando, menos falsos positivos, detecta vulnerabilidades de configuração e runtime, não enxerga todo o código. Estratégia recomendada: usar ambos no pipeline.", aka: "Comparação SAST DAST" },

  // ── SUPPLY CHAIN SECURITY ─────────────────────────────────────────────────
  { name: "SBOM", acronym: "Software Bill of Materials", cat: "supply", def: "Lista formal de todos os componentes, bibliotecas e dependências de um software — a 'lista de ingredientes' do software. Formatos padrão: SPDX (Linux Foundation) e CycloneDX (OWASP). Exigido por regulações como o Executive Order 14028 (EUA) e sendo incorporado a requisitos de contratos governamentais. Permite identificar rapidamente softwares afetados por CVEs como Log4Shell.", aka: "Lista de Materiais de Software · SPDX · CycloneDX" },
  { name: "Supply Chain Attack", acronym: "", cat: "supply", def: "Ataque que compromete o software ou hardware de um fornecedor para atingir seus clientes downstream. Exemplos notórios: SolarWinds (2020) — código malicioso injetado no processo de build; Log4Shell (2021) — vulnerabilidade em biblioteca amplamente usada; typosquatting — pacotes maliciosos com nomes similares aos legítimos. Mitigado com SCA, SBOM, verificação de integridade.", aka: "Ataque à Cadeia de Suprimentos · SolarWinds · Log4Shell" },
  { name: "Dependency Confusion", acronym: "", cat: "supply", def: "Tipo de ataque supply chain onde o atacante publica um pacote malicioso em um repositório público (npm, PyPI) com o mesmo nome de um pacote privado interno de uma organização, fazendo gerenciadores de pacotes instalarem o malicioso. Descoberto por Alex Birsan em 2021 afetando Microsoft, Apple, Uber. Mitigado com escopo de namespace, repositórios privados e verificação de integridade.", aka: "Namespace Confusion Attack" },
  { name: "SLSA", acronym: "Supply chain Levels for Software Artifacts", cat: "supply", def: "Framework do Google para avaliar e melhorar a integridade do supply chain de software. 4 níveis: L1 (documentação de proveniência), L2 (proveniência assinada pelo serviço de CI), L3 (serviço de CI hardened, não-falsificável), L4 (revisão de duas partes, processo hermético). Foca na proteção de artefatos desde o commit até o deploy.", aka: "SLSA Framework · Software Provenance" },
  { name: "Sigstore", acronym: "", cat: "supply", def: "Projeto open-source (Linux Foundation) para assinatura, verificação e proteção do software. Componentes: Cosign (assinatura de containers e artefatos), Fulcio (CA para certificados de código), Rekor (log de transparência imutável). Permite assinar e verificar artefatos de software sem gerenciar chaves privadas longas — usa identidade OIDC (GitHub Actions, etc.).", aka: "Cosign · Fulcio · Rekor · Software Signing" },

  // ── OPERAÇÕES E PIPELINE ──────────────────────────────────────────────────
  { name: "Security Gate", acronym: "", cat: "ops", def: "Ponto de verificação no pipeline CI/CD que bloqueia o avanço do código se critérios de segurança não forem atendidos. Exemplos: bloqueio se SAST encontrar vulnerabilidades críticas, se SCA encontrar CVEs com score CVSS > 7, ou se a imagem Docker tiver vulnerabilidades altas. Implementa o 'fail fast' de segurança no pipeline.", aka: "Quality Gate de Segurança · Policy as Code" },
  { name: "CSPM", acronym: "Cloud Security Posture Management", cat: "ops", def: "Ferramentas que monitoram e avaliam continuamente a configuração de ambientes cloud (AWS, Azure, GCP) em busca de misconfigurations e desvios de compliance. Detectam: buckets S3 públicos, security groups permissivos, MFA desabilitada, criptografia ausente. Ferramentas: Prisma Cloud, Wiz, AWS Security Hub, Azure Defender for Cloud.", aka: "Gerenciamento de Postura de Segurança Cloud" },
  { name: "IaC Security", acronym: "", cat: "ops", def: "Análise de segurança de código Infrastructure as Code (Terraform, CloudFormation, Helm, Kubernetes YAML) antes do deploy. Detecta misconfigurations como portas abertas, criptografia desabilitada, permissões excessivas no IaC antes que sejam provisionadas. Ferramentas: Checkov, tfsec, Terrascan, KICS. Integrado ao pipeline CI junto com o plano de Terraform.", aka: "Infrastructure as Code Security · Checkov · tfsec" },
  { name: "Container Security", acronym: "", cat: "ops", def: "Conjunto de práticas para proteger containers Docker/OCI: imagens base mínimas (distroless, alpine), não rodar como root, scan de vulnerabilidades em imagens (Trivy, Grype, Snyk Container), assinatura de imagens (Sigstore/Cosign), runtime security (Falco — detecta comportamento suspeito em runtime), políticas de admissão (OPA/Gatekeeper no Kubernetes).", aka: "Docker Security · Container Hardening · Falco" },
  { name: "Secrets Management", acronym: "", cat: "ops", def: "Gestão centralizada e segura de credenciais, chaves de API, certificados e outros segredos. Ferramentas: HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager. Práticas: nunca hardcodar secrets no código, usar variáveis de ambiente injetadas em runtime, rotação automática de credenciais, auditoria de acesso a secrets. Detecção de secrets vazados: git-secrets, Gitleaks, truffleHog.", aka: "Gestão de Segredos · HashiCorp Vault · Gitleaks" },
  { name: "SIEM no DevSecOps", acronym: "", cat: "ops", def: "Security Information and Event Management integrado ao pipeline e operações: coleta e correlaciona logs de CI/CD, containers, APIs e aplicações para detectar comportamentos anômalos. No contexto DevSecOps: alertas sobre builds com falhas de segurança repetidas, deployments fora de horário, picos de erros de autenticação. Ferramentas: Splunk, Elastic SIEM, Microsoft Sentinel.", aka: "SIEM · SOC · Security Monitoring" },

  // ── CONCEITOS E FRAMEWORKS ────────────────────────────────────────────────
  { name: "OWASP", acronym: "Open Web Application Security Project", cat: "concepts", def: "Fundação sem fins lucrativos que produz padrões, ferramentas e documentação gratuitos sobre segurança de aplicações. Recursos chave: OWASP Top 10 (vulnerabilidades web mais críticas), OWASP SAMM (modelo de maturidade AppSec), OWASP ASVS (padrão de verificação de segurança), OWASP ZAP (ferramenta DAST open-source), OWASP Cheat Sheet Series.", aka: "OWASP Top 10 · SAMM · ASVS · ZAP" },
  { name: "CVSS", acronym: "Common Vulnerability Scoring System", cat: "concepts", def: "Sistema padronizado para avaliar a severidade de vulnerabilidades de segurança. Score de 0 a 10: 0.1-3.9 (Low), 4.0-6.9 (Medium), 7.0-8.9 (High), 9.0-10.0 (Critical). Métricas: Base (exploitabilidade e impacto), Temporal (maturidade do exploit), Ambiental (contexto específico). Versão atual: CVSS v3.1. Usado para priorizar patching.", aka: "Common Vulnerability Scoring · CVE · NVD" },
  { name: "CVE", acronym: "Common Vulnerabilities and Exposures", cat: "concepts", def: "Sistema de nomenclatura padronizado para vulnerabilidades de segurança publicamente conhecidas. Formato: CVE-AAAA-NNNNN (ex: CVE-2021-44228 = Log4Shell). Mantido pelo MITRE. O National Vulnerability Database (NVD) do NIST enriquece os CVEs com scores CVSS, referências e enumerações CWE. Base para ferramentas SCA e gerenciamento de vulnerabilidades.", aka: "Common Vulnerabilities and Exposures · NVD · MITRE" },
  { name: "Zero Trust no DevSecOps", acronym: "", cat: "concepts", def: "Aplicação do modelo Zero Trust ao ambiente de desenvolvimento: 'nunca confiar, sempre verificar' em pipelines CI/CD, repositórios de artefatos e ambientes de deploy. Práticas: autenticação por OIDC para pipelines (sem chaves longas), menor privilégio para tokens de CI, verificação de integridade de artefatos (assinatura), rede de CI/CD segmentada.", aka: "Zero Trust Architecture · OIDC para CI/CD" },
  { name: "Policy as Code", acronym: "PaC", cat: "concepts", def: "Prática de expressar políticas de segurança e compliance como código, versionável e automaticamente aplicável. Ferramentas: Open Policy Agent (OPA), Sentinel (HashiCorp), Cedar (AWS). Aplicações: políticas de admissão Kubernetes, security gates no pipeline CI, controle de configuração cloud. Permite revisar e auditar políticas como qualquer código de software.", aka: "Open Policy Agent · OPA · Gatekeeper" },
  { name: "Vulnerability Management", acronym: "VM", cat: "concepts", def: "Processo contínuo de identificar, avaliar, tratar e relatar vulnerabilidades em sistemas e software. Ciclo: Descoberta (scanners, bug bounty, disclosure) → Avaliação (CVSS, contexto) → Priorização (risco real vs. CVSS bruto) → Remediação (patch, workaround, aceitar) → Verificação → Relatório. Ferramentas: Tenable, Qualys, Rapid7. SLA típico: Critical < 24h, High < 7 dias, Medium < 30 dias.", aka: "Gestão de Vulnerabilidades · Patch Management · SLA de Vulnerabilidades" },
];

TERMS.sort((a,b) => a.name.localeCompare(b.name, 'pt'));

let currentCat = 'all', currentQ = '';

function firstLetter(s) {
  const c = s.trim().toUpperCase()[0];
  return /[A-Z]/.test(c) ? c : '#';
}

function render() {
  const q = currentQ.toLowerCase(), cat = currentCat;
  const filtered = TERMS.filter(t => {
    const matchCat = cat === 'all' || t.cat === cat;
    const matchQ = !q || t.name.toLowerCase().includes(q) || (t.acronym||'').toLowerCase().includes(q) || t.def.toLowerCase().includes(q) || (t.aka||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('count').textContent = `${filtered.length} termo${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const groups = {};
  filtered.forEach(t => { const l = firstLetter(t.name); if (!groups[l]) groups[l] = []; groups[l].push(t); });
  const letters = Object.keys(groups).sort();

  document.getElementById('azBar').innerHTML = letters.map(l => `<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!filtered.length) { document.getElementById('empty').style.display = 'block'; return; }
  document.getElementById('empty').style.display = 'none';

  letters.forEach(l => {
    const grp = document.createElement('div');
    grp.className = 'letter-group'; grp.id = `grp-${l}`;
    grp.innerHTML = `<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t => {
      const aka = t.aka ? `<div class="card-aka">Também: <span>${t.aka}</span></div>` : '';
      const acr = t.acronym ? `<span class="card-acronym">— ${t.acronym}</span>` : '';
      grp.innerHTML += `<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}

document.getElementById('search').addEventListener('input', e => { currentQ = e.target.value; render(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); currentCat = btn.dataset.cat; render();
  });
});
render();
</script>
</body>
</html>
