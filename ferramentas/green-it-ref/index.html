<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green IT e Sustentabilidade — Referência</title>
<style>
  :root {
    --infra:   #15803d;
    --metrics: #0369a1;
    --esg:     #d97706;
    --circular:#0f766e;
    --concepts:#374151;
    --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .breadcrumb{background:#fff;border-bottom:1px solid var(--border);padding:.55rem 1.5rem;font-size:.8rem;color:var(--muted);}
  .breadcrumb a{color:var(--infra);text-decoration:none;font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}
  header{background:linear-gradient(135deg,#052e16 0%,var(--infra) 100%);color:#fff;padding:2rem 1.5rem 1.5rem;}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
  header p{opacity:.85;margin-top:.4rem;font-size:.95rem;}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .controls input{flex:1;min-width:200px;padding:.55rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;}
  .controls input:focus{outline:2px solid var(--infra);border-color:transparent;}
  .filter-btn{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .filter-btn:hover{border-color:#94a3b8;}
  .filter-btn.active{color:#fff;border-color:transparent;}
  .filter-btn[data-cat="all"].active     {background:#334155;}
  .filter-btn[data-cat="infra"].active   {background:var(--infra);}
  .filter-btn[data-cat="metrics"].active {background:var(--metrics);}
  .filter-btn[data-cat="esg"].active     {background:var(--esg);}
  .filter-btn[data-cat="circular"].active{background:var(--circular);}
  .filter-btn[data-cat="concepts"].active{background:var(--concepts);}
  main{max-width:900px;margin:0 auto;padding:1.5rem;}
  .letter-group{margin-bottom:2rem;}
  .letter-anchor{font-size:1.3rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:2px solid var(--border);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.65rem;border-left:4px solid #94a3b8;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .card[data-cat="infra"]   {border-left-color:var(--infra);}
  .card[data-cat="metrics"] {border-left-color:var(--metrics);}
  .card[data-cat="esg"]     {border-left-color:var(--esg);}
  .card[data-cat="circular"]{border-left-color:var(--circular);}
  .card[data-cat="concepts"]{border-left-color:var(--concepts);}
  .card-header{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .card-name{font-size:1rem;font-weight:700;}
  .card-acronym{font-size:.82rem;color:var(--muted);font-weight:400;}
  .card-tag{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:#fff;margin-left:auto;white-space:nowrap;}
  .card[data-cat="infra"]   .card-tag{background:var(--infra);}
  .card[data-cat="metrics"] .card-tag{background:var(--metrics);}
  .card[data-cat="esg"]     .card-tag{background:var(--esg);}
  .card[data-cat="circular"].card-tag{background:var(--circular);}
  .card[data-cat="concepts"].card-tag{background:var(--concepts);}
  .card-def{font-size:.88rem;color:#334155;line-height:1.55;}
  .card-aka{font-size:.78rem;color:var(--muted);margin-top:.35rem;}
  .card-aka span{font-style:italic;}
  .az-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:1rem 1.5rem .5rem;}
  .az-btn{font-size:.78rem;font-weight:600;padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .12s;}
  .az-btn:hover{background:var(--infra);color:#fff;border-color:transparent;}
  #empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted);}
  .count{font-size:.82rem;color:var(--muted);padding:0 1.5rem .5rem;}
</style>
</head>
<body>
<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>
<header>
  <h1>🌱 Green IT e Sustentabilidade — Referência</h1>
  <p>PUE · Carbon Footprint de TI · E-waste · ESG · ISO 14001 · GHG Protocol · Datacenter Sustentável</p>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="infra">Infraestrutura Verde</button>
  <button class="filter-btn" data-cat="metrics">Métricas e Indicadores</button>
  <button class="filter-btn" data-cat="esg">ESG e Relatórios</button>
  <button class="filter-btn" data-cat="circular">Economia Circular e E-waste</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Frameworks</button>
</div>
<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>
<script>
const CAT_LABELS={infra:"Infraestrutura Verde",metrics:"Métricas e Indicadores",esg:"ESG e Relatórios",circular:"Economia Circular e E-waste",concepts:"Conceitos e Frameworks"};
const TERMS=[
  // Infraestrutura Verde
  {name:"Datacenter Verde",acronym:"",cat:"infra",def:"Instalação de datacenter projetada para maximizar eficiência energética e minimizar impacto ambiental. Componentes: resfriamento eficiente (free cooling, liquid cooling, economizadores), energia renovável (solar, eólica, certificados RECs), servidores de alta eficiência, virtualização para aumentar densidade de uso, design modular. Certificações: LEED (Leadership in Energy and Environmental Design), BREEAM, ISO 50001 (gestão de energia). Hiperscalers (AWS, Azure, GCP) publicam metas de zero carbono.",aka:"Green Datacenter · Sustainable Datacenter · LEED Datacenter · ISO 50001 · RECs"},
  {name:"Energia Renovável em TI",acronym:"REC",cat:"infra",def:"Renewable Energy Certificate: certificado que comprova que uma quantidade específica de energia foi gerada a partir de fontes renováveis (solar, eólica, hidrelétrica, biomassa). Empresas compram RECs para compensar o consumo de energia de datacenters e operações de TI. Alternativas: PPAs (Power Purchase Agreements — contratos diretos com geradores renováveis), on-site generation (painéis solares no próprio datacenter). Meta comum: 100% renewable energy (RE100 — iniciativa empresarial global).",aka:"REC · Renewable Energy Certificate · PPA · Power Purchase Agreement · RE100 · Energia Renovável TI"},
  {name:"Resfriamento de Datacenter",acronym:"",cat:"infra",def:"Sistema de controle térmico do datacenter, responsável por 30-40% do consumo de energia. Tecnologias: CRAC/CRAH (Computer Room Air Conditioning/Handler), Economizadores de Ar (free cooling — usa ar externo frio), Economizadores de Água, Liquid Cooling (resfriamento direto nos chips — mais eficiente), Imersão em Líquido Dielétrico (servidores submersos em fluido não condutor — eficiência máxima). Configuração de corredor quente/frio (hot aisle/cold aisle containment) é prática mínima.",aka:"Datacenter Cooling · Free Cooling · Liquid Cooling · Hot Aisle Cold Aisle · CRAC CRAH · Immersion Cooling"},
  // Métricas e Indicadores
  {name:"PUE",acronym:"Power Usage Effectiveness",cat:"metrics",def:"Métrica padrão de eficiência energética de datacenters definida pelo The Green Grid. PUE = Energia Total do Datacenter / Energia dos Equipamentos de TI. PUE ideal = 1,0 (todo consumo é de TI, sem overhead). Referências: PUE 1,2 (excelente), 1,5 (médio), 2,0+ (ineficiente). Hiperscalers: Google (~1,10), Meta (~1,10), AWS (~1,2). PUE médio mundial: ~1,58 (Uptime Institute 2022). Limitação: não mede uso de energia renovável, apenas eficiência do resfriamento.",aka:"Power Usage Effectiveness · PUE · DCiE · Data Center Infrastructure Efficiency · The Green Grid"},
  {name:"Carbon Footprint de TI",acronym:"",cat:"metrics",def:"Pegada de carbono das operações de TI: total de emissões de GEE (Gases de Efeito Estufa) em CO₂ equivalente (CO₂e) atribuídas a hardware, software, datacenters e redes. Escopo 1 (emissões diretas — geradores diesel), Escopo 2 (emissões indiretas de energia elétrica consumida), Escopo 3 (cadeia de valor — fabricação de hardware, fim de vida, trabalho remoto dos funcionários). Ferramentas de medição: Cloud Carbon Footprint (AWS/GCP/Azure), Climatiq, OpenCO2.",aka:"IT Carbon Footprint · CO2e TI · Emissões de TI · Cloud Carbon Footprint · GHG TI"},
  {name:"WUE",acronym:"Water Usage Effectiveness",cat:"metrics",def:"Métrica de eficiência no uso de água em datacenters definida pelo The Green Grid. WUE = Consumo Anual de Água (litros) / Energia dos Equipamentos de TI (kWh). Mede a água usada para resfriamento. Datacenters podem consumir milhões de litros de água por ano em torres de resfriamento evaporativo. Alternativas de baixo WUE: free cooling a ar (WUE = 0 sem torre de resfriamento), liquid cooling fechado. Meta: WUE < 1,0 L/kWh para datacenters eficientes.",aka:"Water Usage Effectiveness · WUE · Water Consumption Datacenter · The Green Grid"},
  {name:"GCI",acronym:"Grid Carbon Intensity",cat:"metrics",def:"Intensidade de Carbono da Rede Elétrica: quantidade de CO₂ emitida por kWh de energia gerada na rede elétrica de uma região. Varia por localização (Brasil — matriz hidrelétrica — tem GCI baixo; Polônia — matriz carvão — tem GCI alto) e por horário do dia (picos de demanda ativam usinas mais poluentes). Usado em Temporal Shifting (deslocar cargas computacionais para períodos de menor GCI) e Location Shifting (processar em regiões com GCI mais baixo).",aka:"Grid Carbon Intensity · GCI · Carbon Aware Computing · Temporal Shifting · Location Shifting"},
  // ESG e Relatórios
  {name:"ESG em TI",acronym:"",cat:"esg",def:"Environmental, Social and Governance aplicado à área de TI. Dimensão E (ambiental): emissões de GEE de datacenters e dispositivos, consumo de energia renovável, gestão de e-waste, eficiência hídrica. Dimensão S (social): acessibilidade digital, privacidade de dados, impacto social da automação e IA no trabalho, diversidade em equipes de TI. Dimensão G (governança): segurança da informação, ética em IA, compliance regulatório, gestão de riscos cibernéticos. TI é agora material para ESG em virtualmente todos os setores.",aka:"ESG TI · Environmental Social Governance TI · Green IT · Sustainable IT"},
  {name:"GHG Protocol",acronym:"",cat:"esg",def:"Greenhouse Gas Protocol: padrão global mais amplamente utilizado para medir e gerenciar emissões de GEE de empresas e organizações, desenvolvido pelo WRI e WBCSD. Define: Escopo 1 (emissões diretas), Escopo 2 (emissões de energia comprada — market-based e location-based), Escopo 3 (cadeia de valor — 15 categorias, inclui uso de produtos vendidos e compras de TI). Fundamental para relatórios de sustentabilidade (GRI, CDP, TCFD). Base para metas Science Based Targets (SBTi).",aka:"GHG Protocol · Greenhouse Gas Protocol · Escopo 1 2 3 · SBTi · Science Based Targets"},
  {name:"Relatório de Sustentabilidade",acronym:"",cat:"esg",def:"Divulgação pública do desempenho socioambiental e de governança de uma organização. Padrões: GRI (Global Reporting Initiative — mais usado globalmente), SASB (Sustainability Accounting Standards Board — setorial), TCFD (Task Force on Climate-related Financial Disclosures — riscos climáticos), ESRS (European Sustainability Reporting Standards — obrigatório na UE pela CSRD, Diretiva 2022/2464). No Brasil: B3 recomenda GRI; CVM exige TCFD para companhias abertas (Resolução CVM 193/2023).",aka:"Sustainability Report · GRI · SASB · TCFD · CSRD · ESRS · Relatório ESG"},
  // Economia Circular e E-waste
  {name:"E-waste",acronym:"REEE",cat:"circular",def:"Resíduos de Equipamentos Eletroeletrônicos: equipamentos eletrônicos e elétricos descartados (computadores, servidores, smartphones, monitores, baterias, impressoras). Maior categoria de resíduo sólido de crescimento mais rápido no mundo (53,6 Mt em 2019 — ONU). No Brasil: Lei 12.305/2010 (Política Nacional de Resíduos Sólidos) e Acordo Setorial de REEE (2019) obrigam fabricantes e distribuidores de EEE à logística reversa. ABNT NBR 16156 define critérios para destinação ambientalmente adequada.",aka:"E-waste · Lixo Eletrônico · REEE · Resíduos Eletroeletrônicos · Lei 12305 · PNRS · ABNT NBR 16156"},
  {name:"Logística Reversa de TI",acronym:"",cat:"circular",def:"Processo de retorno de equipamentos de TI ao fim de vida útil à cadeia de suprimentos para reaproveitamento, reciclagem ou descarte adequado. Obrigação legal no Brasil (Lei 12.305/2010) para fabricantes, importadores, distribuidores e comerciantes de equipamentos eletroeletrônicos. Processo: coleta → triagem → reuso/refurbishment → desmontagem → reciclagem → destinação final de rejeitos. Dados devem ser destruídos (NIST SP 800-88) antes da logística reversa.",aka:"Reverse Logistics · Logística Reversa · Take-back Program · PNRS TI · Descarte de TI"},
  {name:"Economia Circular em TI",acronym:"",cat:"circular",def:"Modelo econômico aplicado a TI que substitui o modelo linear 'fabricar-usar-descartar' por ciclos fechados: reparar, reutilizar, refazer (remanufatura), reciclar. Práticas: extensão da vida útil de dispositivos (reparabilidade — direito ao reparo), refurbishment (recondicionamento para revenda), remanufatura (restauração a condição original), Design for Disassembly (produtos projetados para desmontagem fácil). EU Ecodesign Regulation exige maior durabilidade e reparabilidade de produtos eletrônicos.",aka:"Circular Economy IT · Economia Circular TI · Right to Repair · Ecodesign · Refurbishment · Remanufatura"},
  // Conceitos e Frameworks
  {name:"ISO 14001",acronym:"",cat:"concepts",def:"Norma internacional para Sistemas de Gestão Ambiental (SGA). Requisitos: compreensão do contexto, política ambiental, planejamento (aspectos e impactos ambientais, objetivos ambientais), suporte, operação, avaliação de desempenho, melhoria contínua. Certificável por auditoria de terceiros. Aplicada a datacenters e operações de TI para gerenciar impactos como consumo energético, resíduos eletrônicos, emissões e uso de água. Complementada pela ISO 50001 (gestão de energia).",aka:"ISO 14001 · Sistema de Gestão Ambiental · SGA · ISO 50001 · Gestão de Energia"},
  {name:"Green Software",acronym:"",cat:"concepts",def:"Disciplina de engenharia de software voltada a construir aplicações que emitem menos carbono. 8 princípios da Green Software Foundation: Eficiência de Carbono, Eficiência de Energia, Intensidade de Carbono, Carbono Incorporado (Embodied Carbon — emissões de fabricação do hardware), Proporcionalidade de Energia (usar mais quando a rede é mais limpa), Redes (minimizar dados transferidos), Demand Shaping (moldar demanda ao carbon intensity), Medição e Otimização. Certificação: GSF Green Software Practitioner.",aka:"Green Software · Sustainable Software Engineering · Green Software Foundation · Carbon Aware · Embodied Carbon"},
  {name:"CSRD",acronym:"Corporate Sustainability Reporting Directive",cat:"concepts",def:"Diretiva da UE (2022/2464) que substituiu a NFRD e ampliou significativamente as obrigações de reporte de sustentabilidade para empresas europeias e multinacionais com operações na UE. Padrão: ESRS (European Sustainability Reporting Standards). Obriga reporte de: mudanças climáticas (ESRS E1), poluição, biodiversidade, uso de recursos, trabalhadores, comunidades afetadas, conduta de negócios. Dupla materialidade: impacto da empresa no ambiente E impacto do ambiente na empresa. Afeta empresas brasileiras com subsidiárias/filiais na UE.",aka:"CSRD · Corporate Sustainability Reporting Directive · ESRS · NFRD · Dupla Materialidade · ESG Reporting EU"},
];
TERMS.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
let currentCat='all',currentQ='';
function firstLetter(s){const c=s.trim().toUpperCase()[0];return/[A-Z]/.test(c)?c:'#';}
function render(){
  const q=currentQ.toLowerCase(),cat=currentCat;
  const filtered=TERMS.filter(t=>{
    const matchCat=cat==='all'||t.cat===cat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.acronym||'').toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.aka||'').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('count').textContent=`${filtered.length} termo${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const groups={};
  filtered.forEach(t=>{const l=firstLetter(t.name);if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  document.getElementById('azBar').innerHTML=letters.map(l=>`<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list=document.getElementById('list');list.innerHTML='';
  if(!filtered.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';
  letters.forEach(l=>{
    const grp=document.createElement('div');grp.className='letter-group';grp.id=`grp-${l}`;
    grp.innerHTML=`<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t=>{
      const aka=t.aka?`<div class="card-aka">Também: <span>${t.aka}</span></div>`:'';
      const acr=t.acronym?`<span class="card-acronym">— ${t.acronym}</span>`:'';
      grp.innerHTML+=`<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}
document.getElementById('search').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;render();});
});
render();
</script>
</body>
</html>
