<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specs de Criativos | NC Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;
  --bg:#f0f2ff;--surface:#fff;--border:#d6dbf2;--muted:#9fa8da;
  --text:#1a237e;--body:#3d4a8a;--mono:'JetBrains Mono',monospace;
  --ok:#2e7d32;--ok-bg:#f1f8e9;--warn:#e65100;--warn-bg:#fff3e0;
}
[data-theme="dark"]{
  --azul:#7c8fff;--escuro:#c5cae9;--light:#1e2340;
  --bg:#0f1117;--surface:#161b2a;--border:#263060;--muted:#5c6a9e;
  --text:#c5cae9;--body:#9fa8da;--ok:#a5d6a7;--ok-bg:#0a2010;--warn:#ffcc80;--warn-bg:#2a1800;
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--azul);text-decoration:none;opacity:.7;padding:16px 24px 0}
a.back:hover{opacity:1}
.header{padding:12px 24px 0}
h1{font-size:22px;font-weight:700;color:var(--escuro)}
.subtitle{font-size:13px;color:var(--body);margin-top:4px;margin-bottom:12px}
.main{padding:0 24px 32px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
input[type=text]{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--escuro);outline:none;width:100%}
input[type=text]:focus{border-color:var(--azul)}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.fixed-btns{position:fixed;top:14px;right:18px;z-index:900;display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--azul);background:var(--surface);color:var(--azul);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:all .15s;font-family:inherit}
.icon-btn:hover{background:var(--azul);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a237e;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* platform tabs */
.plat-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.plat-chip{padding:5px 13px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--body);transition:all .15s}
.plat-chip.active{background:var(--azul);color:#fff;border-color:var(--azul)}

/* format type tabs */
.type-row{display:flex;gap:4px;margin-bottom:10px}
.type-tab{padding:4px 12px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-family:inherit}
.type-tab.active{background:var(--light);color:var(--azul);border-color:var(--azul)}

/* specs table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--light);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;text-align:left;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--border);color:var(--body);vertical-align:top}
td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;margin:1px}
.b-display{background:var(--light);color:var(--azul)}
.b-video{background:var(--ok-bg);color:var(--ok)}
.b-native{background:var(--warn-bg);color:var(--warn)}
.b-stories{background:#f3e5f5;color:#7b1fa2}
.b-search{background:#e3f2fd;color:#1565c0}
.note{font-size:10px;color:var(--muted);margin-top:2px}
.search-wrap{margin-bottom:10px}
</style>
</head>
<body>
<div class="fixed-btns">
  <button class="icon-btn" onclick="toggleDark()" id="theme-btn">🌙</button>
</div>
<div id="toast" class="toast"></div>
<a class="back" href="/Projeto-NC/ferramentas/">← Ferramentas</a>
<div class="header">
  <h1>Specs de Criativos por Plataforma</h1>
  <p class="subtitle">Dimensões, peso máximo, formatos aceitos e duração por plataforma. Atualizado com as specs mais comuns do mercado BR.</p>
</div>
<div class="main">

<div class="card">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Buscar por formato, dimensão ou plataforma…" oninput="render()">
  </div>
  <div class="section-title">Plataforma</div>
  <div class="plat-row" id="plat-row"></div>
  <div class="type-row" id="type-row"></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Formato / Tamanho</th>
        <th>Dimensões</th>
        <th>Peso máx.</th>
        <th>Tipos aceitos</th>
        <th>Duração máx.</th>
        <th>Notas</th>
      </tr></thead>
      <tbody id="specs-body"></tbody>
    </table>
  </div>
</div>

</div>
<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
function toggleDark(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.getElementById('theme-btn').textContent=d?'🌙':'☀️';}

// format: {name, dim, weight, types[], dur, notes, plat[], ftype}
// ftype: display|video|native|stories|search
const SPECS=[
  // CM360 / Display & Video
  {name:'Leaderboard',dim:'728×90',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'IAB padrão; HTML5 animado até 15s',plat:['cm360','gdn','dv360'],ftype:'display'},
  {name:'Medium Rectangle',dim:'300×250',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'Formato mais entregue globalmente',plat:['cm360','gdn','dv360','meta'],ftype:'display'},
  {name:'Half Page / Billboard',dim:'300×600',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'Alta viewability',plat:['cm360','gdn','dv360'],ftype:'display'},
  {name:'Wide Skyscraper',dim:'160×600',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'',plat:['cm360','gdn','dv360'],ftype:'display'},
  {name:'Billboard',dim:'970×250',weight:'200KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'Formato premium desktop',plat:['cm360','dv360'],ftype:'display'},
  {name:'Super Leaderboard',dim:'970×90',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'',plat:['cm360','dv360'],ftype:'display'},
  {name:'Mobile Banner',dim:'320×50',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'IAB mobile padrão',plat:['cm360','gdn','dv360'],ftype:'display'},
  {name:'Mobile Interstitial',dim:'320×480',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'Full-screen mobile',plat:['cm360','dv360'],ftype:'display'},
  {name:'Large Rectangle',dim:'336×280',weight:'150KB',types:['JPG','PNG','GIF','HTML5'],dur:'-',notes:'',plat:['gdn','cm360'],ftype:'display'},
  // Video
  {name:'Pre-roll (VAST)',dim:'16:9 (1920×1080)',weight:'—',types:['MP4','WEBM','VAST'],dur:'60s max (15s skip)',notes:'Skip após 5s; formato VAST 2.0+',plat:['cm360','dv360','youtube'],ftype:'video'},
  {name:'Bumper Ad',dim:'16:9 (1280×720)',weight:'—',types:['MP4','VAST'],dur:'6s',notes:'Não pulável; YouTube/GDN',plat:['youtube','gdn'],ftype:'video'},
  {name:'Mid-roll (VAST)',dim:'16:9 (1920×1080)',weight:'—',types:['MP4','VAST'],dur:'30s max',notes:'Apenas conteúdo 10min+',plat:['youtube','cm360'],ftype:'video'},
  {name:'Outstream / Native Video',dim:'16:9 (1280×720)',weight:'—',types:['MP4','WEBM'],dur:'30s recomendado',notes:'Autoplay muted',plat:['cm360','dv360'],ftype:'video'},
  {name:'CTV / OTT (Pre-roll)',dim:'16:9 (1920×1080)',weight:'—',types:['MP4'],dur:'15s, 30s, 60s',notes:'Não pulável; bitrate mínimo 2Mbps',plat:['dv360','cm360'],ftype:'video'},
  // Meta
  {name:'Feed Estático',dim:'1080×1080 (1:1) ou 1200×628',weight:'30MB',types:['JPG','PNG'],dur:'-',notes:'Texto < 20% da imagem recomendado',plat:['meta'],ftype:'display'},
  {name:'Feed Carrossel',dim:'1080×1080 por card',weight:'30MB/card',types:['JPG','PNG'],dur:'-',notes:'2–10 cards; mesmo formato para todos',plat:['meta'],ftype:'display'},
  {name:'Reels / Stories',dim:'1080×1920 (9:16)',weight:'4GB',types:['MP4','MOV'],dur:'60s (Reels); 15s (Stories)',notes:'Safe zone 250px top/bottom; vertical obrigatório',plat:['meta'],ftype:'stories'},
  {name:'Feed Vídeo',dim:'1:1 ou 16:9',weight:'4GB',types:['MP4','MOV'],dur:'241min max',notes:'15–30s recomendado; H.264',plat:['meta'],ftype:'video'},
  {name:'Native (Advantage+)',dim:'1200×628',weight:'30MB',types:['JPG','PNG'],dur:'-',notes:'Título 40 chars; desc 125 chars',plat:['meta'],ftype:'native'},
  // TikTok
  {name:'In-Feed Ad',dim:'1080×1920 (9:16)',weight:'500MB',types:['MP4','MOV'],dur:'9–60s',notes:'9:16 obrigatório; H.264; skip após 1.5s possível',plat:['tiktok'],ftype:'video'},
  {name:'TopView',dim:'1080×1920',weight:'500MB',types:['MP4'],dur:'5–60s',notes:'Autoplay com som; primeiro ad do dia',plat:['tiktok'],ftype:'video'},
  {name:'Spark Ad (boost orgânico)',dim:'Mesmo do post',weight:'-',types:['nativo'],dur:'-',notes:'Usa post orgânico existente',plat:['tiktok'],ftype:'native'},
  // LinkedIn
  {name:'Single Image Ad',dim:'1200×627 recomendado',weight:'5MB',types:['JPG','PNG','GIF'],dur:'-',notes:'Descrição: 150 chars; título: 70 chars',plat:['linkedin'],ftype:'display'},
  {name:'Video Ad',dim:'4:5 até 16:9',weight:'200MB',types:['MP4'],dur:'3s–30min',notes:'15–30s recomendado; H.264; legendas recomendadas',plat:['linkedin'],ftype:'video'},
  {name:'Carrossel',dim:'1080×1080 por card',weight:'10MB/card',types:['JPG','PNG'],dur:'-',notes:'2–10 cards',plat:['linkedin'],ftype:'display'},
  {name:'Sponsored Message',dim:'-',weight:'-',types:['Texto'],dur:'-',notes:'Limite: 1 msg/membro a cada 30 dias',plat:['linkedin'],ftype:'native'},
  // Google Ads / Search
  {name:'Responsive Display',dim:'Variável',weight:'150KB img / 5MB logo',types:['JPG','PNG','GIF'],dur:'-',notes:'Título: 30 chars; desc: 90 chars; logo 1:1 ou 4:1',plat:['gdn'],ftype:'display'},
  {name:'Responsive Search',dim:'-',weight:'-',types:['Texto'],dur:'-',notes:'15 títulos (30 chars) + 4 desc (90 chars)',plat:['google_ads'],ftype:'search'},
  {name:'Performance Max (asset)',dim:'1200×628 / 1:1 / 9:16',weight:'5MB',types:['JPG','PNG','MP4'],dur:'10–60s vídeo',notes:'Mínimo: 1 img paisagem + 1 logo; vídeo opcional mas recomendado',plat:['google_ads'],ftype:'display'},
  // YouTube
  {name:'Skippable In-Stream',dim:'16:9 (1280×720+)',weight:'—',types:['MP4','WEBM'],dur:'Sem limite (skip após 5s)',notes:'30s+ recomendado; CTA overlay disponível',plat:['youtube'],ftype:'video'},
  {name:'Non-skippable In-Stream',dim:'16:9 (1920×1080)',weight:'—',types:['MP4'],dur:'15s ou 20s (EMEA)',notes:'Sem opção de pular; CPM buying',plat:['youtube'],ftype:'video'},
  {name:'Discovery / In-Feed',dim:'16:9 / thumbnail 1280×720',weight:'—',types:['MP4'],dur:'Qualquer',notes:'Aparece em resultados de busca YouTube',plat:['youtube'],ftype:'video'},
];

const PLATFORMS=[
  {id:'all',label:'Todas'},
  {id:'cm360',label:'CM360'},
  {id:'dv360',label:'DV360'},
  {id:'gdn',label:'Google Display'},
  {id:'google_ads',label:'Google Ads'},
  {id:'youtube',label:'YouTube'},
  {id:'meta',label:'Meta'},
  {id:'tiktok',label:'TikTok'},
  {id:'linkedin',label:'LinkedIn'},
];

const FTYPES=[
  {id:'all',label:'Todos'},
  {id:'display',label:'Display'},
  {id:'video',label:'Vídeo'},
  {id:'stories',label:'Stories/Reels'},
  {id:'native',label:'Native'},
  {id:'search',label:'Search'},
];

let _plat='all',_ftype='all';

function setPlatform(id){_plat=id;render();}
function setFtype(id){_ftype=id;render();}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const rows=SPECS.filter(s=>{
    if(_plat!=='all'&&!s.plat.includes(_plat))return false;
    if(_ftype!=='all'&&s.ftype!==_ftype)return false;
    if(q){
      const hay=(s.name+s.dim+s.weight+s.types.join()+s.notes+s.plat.join()).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });

  const ftypeClass={display:'b-display',video:'b-video',native:'b-native',stories:'b-stories',search:'b-search'};

  document.getElementById('specs-body').innerHTML=rows.map(s=>`
    <tr>
      <td>${s.name}<br><span class="badge ${ftypeClass[s.ftype]||'b-display'}">${s.ftype}</span></td>
      <td style="font-family:var(--mono);font-size:11px">${s.dim}</td>
      <td style="font-family:var(--mono);font-size:11px">${s.weight}</td>
      <td>${s.types.map(t=>`<span class="badge b-display">${t}</span>`).join(' ')}</td>
      <td style="font-family:var(--mono);font-size:11px">${s.dur}</td>
      <td><div style="font-size:11px;color:var(--body)">${s.notes||'-'}</div>
        <div style="margin-top:3px">${s.plat.map(p=>`<span class="badge b-native">${p}</span>`).join(' ')}</div>
      </td>
    </tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">Nenhum resultado encontrado.</td></tr>';

  document.getElementById('plat-row').innerHTML=PLATFORMS.map(p=>`
    <div class="plat-chip${_plat===p.id?' active':''}" onclick="setPlatform('${p.id}')">${p.label}</div>`).join('');
  document.getElementById('type-row').innerHTML=FTYPES.map(f=>`
    <button class="type-tab${_ftype===f.id?' active':''}" onclick="setFtype('${f.id}')">${f.label}</button>`).join('');
}

render();
</script>
</body>
</html>
