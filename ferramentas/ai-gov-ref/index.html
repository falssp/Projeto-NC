<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Governança de IA — Referência</title>
<style>
  :root {
    --euai:    #7c3aed;
    --nist:    #0369a1;
    --ethics:  #d97706;
    --ops:     #0f766e;
    --concepts:#374151;
    --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .breadcrumb{background:#fff;border-bottom:1px solid var(--border);padding:.55rem 1.5rem;font-size:.8rem;color:var(--muted);}
  .breadcrumb a{color:var(--euai);text-decoration:none;font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}
  header{background:linear-gradient(135deg,#2e1065 0%,var(--euai) 100%);color:#fff;padding:2rem 1.5rem 1.5rem;}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
  header p{opacity:.85;margin-top:.4rem;font-size:.95rem;}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .controls input{flex:1;min-width:200px;padding:.55rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;}
  .controls input:focus{outline:2px solid var(--euai);border-color:transparent;}
  .filter-btn{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .filter-btn:hover{border-color:#94a3b8;}
  .filter-btn.active{color:#fff;border-color:transparent;}
  .filter-btn[data-cat="all"].active     {background:#334155;}
  .filter-btn[data-cat="euai"].active    {background:var(--euai);}
  .filter-btn[data-cat="nist"].active    {background:var(--nist);}
  .filter-btn[data-cat="ethics"].active  {background:var(--ethics);}
  .filter-btn[data-cat="ops"].active     {background:var(--ops);}
  .filter-btn[data-cat="concepts"].active{background:var(--concepts);}
  main{max-width:1400px;margin:0 auto;padding:1.5rem;}
  .letter-group{margin-bottom:2rem;}
  .letter-anchor{font-size:1.3rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:2px solid var(--border);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.65rem;border-left:4px solid #94a3b8;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .card[data-cat="euai"]    {border-left-color:var(--euai);}
  .card[data-cat="nist"]    {border-left-color:var(--nist);}
  .card[data-cat="ethics"]  {border-left-color:var(--ethics);}
  .card[data-cat="ops"]     {border-left-color:var(--ops);}
  .card[data-cat="concepts"]{border-left-color:var(--concepts);}
  .card-header{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .card-name{font-size:1rem;font-weight:700;}
  .card-acronym{font-size:.82rem;color:var(--muted);font-weight:400;}
  .card-tag{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:#fff;margin-left:auto;white-space:nowrap;}
  .card[data-cat="euai"]    .card-tag{background:var(--euai);}
  .card[data-cat="nist"]    .card-tag{background:var(--nist);}
  .card[data-cat="ethics"]  .card-tag{background:var(--ethics);}
  .card[data-cat="ops"]     .card-tag{background:var(--ops);}
  .card[data-cat="concepts"].card-tag{background:var(--concepts);}
  .card-def{font-size:.88rem;color:#334155;line-height:1.55;}
  .card-aka{font-size:.78rem;color:var(--muted);margin-top:.35rem;}
  .card-aka span{font-style:italic;}
  .az-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:1rem 1.5rem .5rem;}
  .az-btn{font-size:.78rem;font-weight:600;padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .12s;}
  .az-btn:hover{background:var(--euai);color:#fff;border-color:transparent;}
  #empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted);}
  .count{font-size:.82rem;color:var(--muted);padding:0 1.5rem .5rem;}
</style>
</head>
<body>
<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>
<header>
  <h1>🤖 Governança de IA — Referência</h1>
  <p>EU AI Act · ISO 42001 · NIST AI RMF · Ética em IA · Bias · Explicabilidade · MLOps</p>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="euai">EU AI Act</button>
  <button class="filter-btn" data-cat="nist">NIST AI RMF e ISO 42001</button>
  <button class="filter-btn" data-cat="ethics">Ética e Responsabilidade</button>
  <button class="filter-btn" data-cat="ops">MLOps e Ciclo de Vida</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Técnicas</button>
</div>
<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>
<script>
const CAT_LABELS={euai:"EU AI Act",nist:"NIST AI RMF e ISO 42001",ethics:"Ética e Responsabilidade",ops:"MLOps e Ciclo de Vida",concepts:"Conceitos e Técnicas"};
const TERMS=[
  // EU AI Act
  {name:"EU AI Act",acronym:"",cat:"euai",def:"Regulamento da União Europeia sobre Inteligência Artificial (Regulamento (UE) 2024/1689), em vigor desde agosto de 2024 com aplicação progressiva até 2027. Primeira regulação abrangente de IA no mundo. Abordagem baseada em risco: (1) Risco inaceitável (proibido): manipulação subliminar, scoring social, biometria em tempo real em espaços públicos para fins policiais; (2) Alto risco: infraestrutura crítica, educação, emprego, serviços essenciais, aplicação da lei, migração — exige conformidade rigorosa; (3) Risco limitado: obrigações de transparência (chatbots devem se identificar); (4) Risco mínimo: livre uso.",aka:"EU AI Act · Regulamento IA · AI Act EU · Regulamento 2024/1689 · Artificial Intelligence Act"},
  {name:"Sistemas de Alto Risco",acronym:"",cat:"euai",def:"Classificação do EU AI Act para sistemas de IA que representam risco significativo para saúde, segurança ou direitos fundamentais. Anexo III lista os domínios: infraestrutura crítica, educação e formação profissional, emprego e gestão de trabalhadores, acesso a serviços essenciais (crédito, seguros), aplicação da lei, gestão de migração e fronteiras, administração da justiça, processos democráticos. Requisitos: avaliação de conformidade, documentação técnica, registro no banco de dados EU, supervisão humana.",aka:"Alto Risco EU AI Act · High-Risk AI · Annex III AI Act · Conformidade IA"},
  {name:"Avaliação de Impacto de IA",acronym:"AIIA",cat:"euai",def:"Processo de avaliar riscos e impactos de sistemas de IA antes e durante seu uso. No EU AI Act, chamada de Avaliação de Conformidade (Conformity Assessment) para sistemas de alto risco. Análoga ao DPIA da LGPD/GDPR. Deve cobrir: finalidade do sistema, dados de treinamento, desempenho e limitações, riscos para direitos fundamentais, medidas de mitigação, supervisão humana. Documentada e arquivada. No Brasil, o Marco Legal da IA (PL 2338/2023) prevê instrumento similar.",aka:"AIIA · AI Impact Assessment · Conformity Assessment · FRIA · Fundamental Rights Impact Assessment"},
  {name:"GPAI",acronym:"General Purpose AI",cat:"euai",def:"IA de Uso Geral: modelos de IA treinados com grandes volumes de dados que demonstram generalidade significativa e são capazes de executar uma ampla gama de tarefas distintas, podendo ser integrados em diferentes produtos e aplicações. No EU AI Act, modelos GPAI com impacto sistêmico (acima de 10²⁵ FLOPs de treinamento) têm obrigações adicionais: avaliações de risco, adversarial testing, relatório ao escritório de IA da UE. Exemplos: GPT-4, Gemini, Claude.",aka:"General Purpose AI · GPAI Model · Foundation Model · LLM · Large Language Model"},
  // NIST AI RMF e ISO 42001
  {name:"NIST AI RMF",acronym:"AI Risk Management Framework",cat:"nist",def:"Framework do NIST (EUA) para gerenciar riscos de IA, publicado em janeiro de 2023. 4 funções: GOVERN (cultura, políticas, papéis de responsabilidade de risco de IA), MAP (identificar e categorizar riscos), MEASURE (analisar e avaliar riscos — métricas, testes, benchmarks), MANAGE (priorizar e tratar riscos). Complementado pelo NIST AI RMF Playbook com práticas concretas. Referência global amplamente adotada por organizações fora dos EUA.",aka:"NIST AI RMF · AI Risk Management Framework · NIST AI 100-1 · AI RMF Playbook"},
  {name:"ISO 42001",acronym:"",cat:"nist",def:"ISO/IEC 42001:2023 — Sistema de Gestão de IA: primeira norma internacional certificável para gestão responsável de IA em organizações. Estrutura similar ao ISO 27001: contexto, liderança, planejamento, suporte, operação, avaliação de desempenho, melhoria. Inclui Anexo A com controles específicos de IA: objetivos do sistema de IA, dados de IA, impacto em partes interessadas, ciclo de vida de desenvolvimento, transparência. Certificação por terceiros auditores credenciados.",aka:"ISO IEC 42001 · AI Management System · AIMS · Certificação IA"},
  {name:"AI TRiSM",acronym:"AI Trust, Risk and Security Management",cat:"nist",def:"Framework do Gartner (2023) para governança de IA centrado em 4 pilares: (1) Explicabilidade/XAI (modelos interpretáveis, SHAP, LIME); (2) ModelOps (ciclo de vida, monitoramento de drift, retreinamento); (3) AI AppSec (segurança de modelos — adversarial attacks, model inversion, data poisoning); (4) Privacy (conformidade de dados de treinamento com LGPD/GDPR). Organizações que implementam AI TRiSM têm 50% menos incidentes de IA não intencionais.",aka:"AI TRiSM · Gartner AI Trust Risk · AI Trust Risk Security Management · XAI"},
  // Ética e Responsabilidade
  {name:"Bias em IA",acronym:"",cat:"ethics",def:"Viés algorítmico: tendência sistemática de um sistema de IA de produzir resultados injustos ou discriminatórios. Tipos: Bias de dados históricos (dados de treinamento refletem discriminações passadas), Bias de representação (grupos sub-representados no treinamento), Bias de automação (humanos confiam cegamente nos outputs), Bias de agregação (modelo treinado em população heterogênea trata todos igual). Detecção: testes de equidade (fairness testing), métricas demográficas de paridade.",aka:"Viés Algorítmico · Algorithmic Bias · Fairness · Discrimination · Disparate Impact"},
  {name:"Explicabilidade",acronym:"XAI",cat:"ethics",def:"Explainable AI: capacidade de um sistema de IA de fornecer explicações compreensíveis para seus outputs. Espectro: modelos intrinsecamente explicáveis (árvores de decisão, regressão linear) vs. modelos caixa-preta (deep learning, transformers — requerem técnicas pós-hoc). Técnicas: SHAP (SHapley Additive exPlanations), LIME (Local Interpretable Model-agnostic Explanations), atenção (attention maps em transformers), counterfactual explanations. Exigida pelo EU AI Act para sistemas de alto risco.",aka:"Explainable AI · XAI · SHAP · LIME · Interpretabilidade · Black Box · Caixa Preta"},
  {name:"Supervisão Humana",acronym:"HITL",cat:"ethics",def:"Human-in-the-Loop: princípio de que sistemas de IA de alto risco devem ter supervisão humana efetiva antes que suas decisões produzam efeitos. Níveis: HITL (humano aprova cada decisão), HOTL — Human-on-the-Loop (humano monitora e pode intervir), HITR — Human-in-the-Room (humano é informado). EU AI Act exige supervisão humana para sistemas de alto risco. Direito de revisão humana: LGPD Art. 20, GDPR Art. 22 — decisões puramente automatizadas que afetem o titular.",aka:"Human-in-the-Loop · HITL · Human Oversight · Revisão Humana · LGPD Art 20 · GDPR Art 22"},
  {name:"Responsabilidade de IA",acronym:"",cat:"ethics",def:"Accountability em IA: princípio de que organizações e indivíduos que desenvolvem e implantam sistemas de IA devem ser responsáveis por seus resultados. Questões: quem responde por dano causado por IA autônoma (desenvolvedor, operador, usuário)? Como atribuir causalidade em sistemas opacos? No EU AI Act: obrigações claras para fornecedores e implantadores de IA. Proposta de Diretiva de Responsabilidade por IA (AI Liability Directive) da UE. No Brasil: Marco Legal da IA em tramitação.",aka:"AI Accountability · Responsabilidade Algorítmica · AI Liability · AI Liability Directive · PL 2338"},
  // MLOps e Ciclo de Vida
  {name:"MLOps",acronym:"Machine Learning Operations",cat:"ops",def:"Conjunto de práticas para padronizar e otimizar o ciclo de vida de modelos de ML em produção: desenvolvimento, treinamento, validação, deploy, monitoramento e retreinamento. Pipeline típico: coleta de dados → preparação → feature engineering → treinamento → avaliação → deploy (CI/CD de modelos) → monitoramento (data drift, model drift) → retreinamento. Ferramentas: MLflow, Kubeflow, SageMaker, Vertex AI, Azure ML, DVC.",aka:"MLOps · Machine Learning Operations · LLMOps · ModelOps · ML Pipeline · Feature Store"},
  {name:"Model Drift",acronym:"",cat:"ops",def:"Degradação do desempenho de um modelo de ML em produção ao longo do tempo. Tipos: Data Drift (a distribuição dos dados de entrada mudou em relação ao treinamento — ex: comportamento de consumidor pós-pandemia), Concept Drift (a relação entre features e target mudou — ex: definição de fraude evoluiu), Covariate Drift (distribuição de features mudou). Detectado por: testes estatísticos (PSI, KS test), monitoramento de métricas de desempenho. Resposta: retreinamento ou recalibragem do modelo.",aka:"Model Drift · Data Drift · Concept Drift · Covariate Shift · Model Degradation · Performance Decay"},
  {name:"Cartão de Modelo",acronym:"",cat:"ops",def:"Model Card: documento de transparência que acompanha um modelo de ML publicado. Proposto pelo Google em 2019. Seções: detalhes do modelo (arquitetura, dados de treinamento, versão), uso pretendido e casos não recomendados, fatores (grupos demográficos, condições de uso), métricas de desempenho desagregadas por subgrupos, avaliações éticas. Exigido pelo EU AI Act para modelos GPAI como documentação técnica. Exemplos: Model Cards do Hugging Face.",aka:"Model Card · Model Documentation · AI Transparency · AI Fact Sheet · Hugging Face Model Card"},
  // Conceitos e Técnicas
  {name:"Alucinação",acronym:"",cat:"concepts",def:"Hallucination: fenômeno em LLMs (Large Language Models) onde o modelo gera informações plausíveis mas incorretas, inventadas ou sem base factual. Tipos: Factual hallucination (afirmações factuais falsas), Intrinsic hallucination (contradiz o contexto fornecido), Extrinsic hallucination (informação não verificável). Mitigação: RAG (Retrieval-Augmented Generation), grounding em fontes verificáveis, temperature baixa, chain-of-thought prompting, fine-tuning em dados de qualidade.",aka:"Hallucination · LLM Hallucination · AI Confabulation · RAG · Retrieval-Augmented Generation"},
  {name:"Prompt Injection",acronym:"",cat:"concepts",def:"Ataque de segurança específico para sistemas baseados em LLM onde entradas maliciosas manipulam o comportamento do modelo, contornando instruções do sistema. Tipos: Direct injection (usuário insere instrução adversarial no prompt), Indirect injection (instrução maliciosa está em conteúdo que o LLM processa — um site, documento ou e-mail). Riscos: exfiltração de dados, execução de ações não autorizadas (em agentes autônomos), bypass de guardrails. Mitigação: validação de input, privilege separation, monitoring.",aka:"Prompt Injection · LLM Security · Indirect Prompt Injection · AI Security · OWASP LLM Top 10"},
  {name:"Dados de Treinamento",acronym:"",cat:"concepts",def:"Conjunto de dados usado para treinar um modelo de ML/IA. Aspectos de governança: (1) Qualidade (completude, consistência, acurácia, atualidade); (2) Viés (representatividade de subgrupos, dados históricos discriminatórios); (3) Privacidade (dados pessoais nos dados de treinamento — LGPD/GDPR — consentimento, minimização, direito ao esquecimento); (4) Propriedade intelectual (copyright de dados usados sem autorização); (5) Rastreabilidade (data lineage, data cards). EU AI Act exige documentação de dados de treinamento para sistemas de alto risco.",aka:"Training Data · Dataset · Data Quality · Data Bias · Data Lineage · Data Card · LGPD Dados de Treinamento"},
  {name:"Marco Legal da IA",acronym:"PL 2338/2023",cat:"concepts",def:"Projeto de Lei brasileiro de regulação de IA, aprovado pelo Senado em dezembro de 2024 e enviado à Câmara. Baseado em princípios (não em risco como o EU AI Act): centralidade da pessoa, transparência, explicabilidade, não discriminação, responsabilização, privacidade. Prevê: avaliação de impacto algorítmico, direito de revisão humana para decisões automatizadas significativas, sanções. Será regulamentado por autoridade competente (possivelmente ANPD). Em tramitação na Câmara dos Deputados.",aka:"Marco Legal da IA · PL 2338 · Regulação IA Brasil · Lei de IA Brasil · AI Regulation Brazil"},
];
TERMS.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
let currentCat='all',currentQ='';
function firstLetter(s){const c=s.trim().toUpperCase()[0];return/[A-Z]/.test(c)?c:'#';}
function render(){
  const q=currentQ.toLowerCase(),cat=currentCat;
  const filtered=TERMS.filter(t=>{
    const matchCat=cat==='all'||t.cat===cat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.acronym||'').toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.aka||'').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('count').textContent=`${filtered.length} termo${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const groups={};
  filtered.forEach(t=>{const l=firstLetter(t.name);if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  document.getElementById('azBar').innerHTML=letters.map(l=>`<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list=document.getElementById('list');list.innerHTML='';
  if(!filtered.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';
  letters.forEach(l=>{
    const grp=document.createElement('div');grp.className='letter-group';grp.id=`grp-${l}`;
    grp.innerHTML=`<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t=>{
      const aka=t.aka?`<div class="card-aka">Também: <span>${t.aka}</span></div>`:'';
      const acr=t.acronym?`<span class="card-acronym">— ${t.acronym}</span>`:'';
      grp.innerHTML+=`<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}
document.getElementById('search').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;render();});
});
render();
</script>
</body>
</html>
