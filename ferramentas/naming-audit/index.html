<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Naming Audit</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f1f4f9;--fg:#1a1d23;--card:#ffffff;--card-border:rgba(0,0,0,.08);
  --header:#0d1117;--header-fg:#e6edf3;--accent:#2563eb;--accent-soft:rgba(37,99,235,.1);
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.08);--ok-border:rgba(34,197,94,.22);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,.08);--warn-border:rgba(245,158,11,.22);
  --erro:#ef4444;--erro-bg:rgba(239,68,68,.08);--erro-border:rgba(239,68,68,.22);
  --faint:rgba(0,0,0,.38);--pill:#e2e8f0;--input-bg:#fff;--input-border:rgba(0,0,0,.18);
  --shadow:0 1px 4px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.18);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117;--fg:#e6edf3;--card:#161b22;--card-border:rgba(255,255,255,.08);
    --faint:rgba(255,255,255,.38);--pill:#21262d;--input-bg:#0d1117;
    --input-border:rgba(255,255,255,.18);--accent-soft:rgba(37,99,235,.18);
    --ok-bg:rgba(34,197,94,.12);--ok-border:rgba(34,197,94,.3);
    --warn-bg:rgba(245,158,11,.12);--warn-border:rgba(245,158,11,.3);
    --erro-bg:rgba(239,68,68,.12);--erro-border:rgba(239,68,68,.3);
    --shadow:0 1px 4px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
    --shadow-lg:0 8px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117;--fg:#e6edf3;--card:#161b22;--card-border:rgba(255,255,255,.08);
  --faint:rgba(255,255,255,.38);--pill:#21262d;--input-bg:#0d1117;
  --input-border:rgba(255,255,255,.18);--accent-soft:rgba(37,99,235,.18);
  --ok-bg:rgba(34,197,94,.12);--ok-border:rgba(34,197,94,.3);
  --warn-bg:rgba(245,158,11,.12);--warn-border:rgba(245,158,11,.3);
  --erro-bg:rgba(239,68,68,.12);--erro-border:rgba(239,68,68,.3);
  --shadow:0 1px 4px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --shadow-lg:0 8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}

.header{background:var(--header);color:var(--header-fg);padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;}
.header-logo{font-weight:800;font-size:16px;letter-spacing:-.5px;color:#38bdf8;}
.header-title{font-size:14px;font-weight:600;opacity:.85;}
.header-sep{opacity:.3;font-size:16px;}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
.theme-btn{background:none;border:1px solid rgba(255,255,255,.2);border-radius:7px;color:var(--header-fg);cursor:pointer;padding:4px 10px;font-size:13px;}
.theme-btn:hover{background:rgba(255,255,255,.1);}

.container{max-width:1100px;margin:0 auto;padding:20px 20px 60px;}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover:not(:disabled){background:#1d4ed8;}
.btn.secondary{background:var(--pill);color:var(--fg);border:1px solid var(--card-border);}
.btn.secondary:hover:not(:disabled){filter:brightness(.95);}
.btn.sm{padding:5px 10px;font-size:11px;}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
.controls select,.controls input{padding:7px 10px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);color:var(--fg);font-size:13px;outline:none;font-family:inherit;}
.controls select:focus,.controls input:focus{border-color:var(--accent);}
.controls input{width:200px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.kpi-val{font-size:26px;font-weight:800;line-height:1;}
.kpi-val.ok{color:var(--ok);}
.kpi-val.warn{color:var(--warn);}
.kpi-val.err{color:var(--erro);}
.kpi-val.accent{color:var(--accent);}
.kpi-label{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

/* NC rows */
.nc-list{display:flex;flex-direction:column;gap:6px;}
.nc-row{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);}
.nc-row.ok{border-color:var(--ok-border);background:var(--ok-bg);}
.nc-row.warn{border-color:var(--warn-border);background:var(--warn-bg);}
.nc-row.err{border-color:var(--erro-border);background:var(--erro-bg);}
.nc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nc-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nc-ts{font-size:11px;color:var(--faint);white-space:nowrap;}
.nc-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;}
.nc-status.ok{background:rgba(34,197,94,.12);color:#15803d;}
.nc-status.warn{background:rgba(245,158,11,.12);color:#92400e;}
.nc-status.err{background:rgba(239,68,68,.12);color:#b91c1c;}
.nc-segs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.seg-chip{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--card-border);background:var(--pill);}
.seg-chip.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.22);color:#15803d;}
.seg-chip.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.22);color:#92400e;}
.seg-chip.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.22);color:#b91c1c;}
.seg-chip.info{background:var(--accent-soft);border-color:rgba(37,99,235,.22);color:var(--accent);}
.seg-chip.skip{opacity:.5;}
.nc-issues{margin-top:6px;display:flex;flex-direction:column;gap:3px;}
.issue-line{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:5px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--faint);}
.empty-state .icon{font-size:40px;margin-bottom:12px;}
.empty-state .msg{font-size:15px;font-weight:600;}
.empty-state .sub{font-size:13px;margin-top:4px;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1e293b;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9000;transition:transform .22s ease,opacity .22s ease;opacity:0;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:600px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div class="header">
  <span class="header-logo">NC</span>
  <span class="header-sep">|</span>
  <span class="header-title">🧾 Naming Audit — validação do histórico</span>
  <div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    <button class="btn secondary sm" onclick="exportCSV()" id="btnExport" disabled>⬇ CSV</button>
    <button class="btn primary sm" onclick="runAudit()">🔄 Atualizar</button>
  </div>
</div>

<div class="container">
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-val accent" id="kpiTotal">—</div><div class="kpi-label">NCs no histórico</div></div>
    <div class="kpi-card"><div class="kpi-val ok" id="kpiOk">—</div><div class="kpi-label">Válidas</div></div>
    <div class="kpi-card"><div class="kpi-val warn" id="kpiWarn">—</div><div class="kpi-label">Com avisos</div></div>
    <div class="kpi-card"><div class="kpi-val err" id="kpiErr">—</div><div class="kpi-label">Com erros</div></div>
    <div class="kpi-card"><div class="kpi-val accent" id="kpiUnknown">—</div><div class="kpi-label">Cliente não identificado</div></div>
  </div>

  <div class="controls">
    <select id="filterClient" onchange="applyFilters()">
      <option value="">Todos os clientes</option>
    </select>
    <select id="filterStatus" onchange="applyFilters()">
      <option value="">Todos os status</option>
      <option value="ok">✓ Válidas</option>
      <option value="warn">⚠ Avisos</option>
      <option value="err">✕ Erros</option>
      <option value="unknown">? Não identificadas</option>
    </select>
    <input type="text" id="searchNc" placeholder="Buscar NC…" oninput="applyFilters()">
    <span id="countLabel" style="font-size:12px;color:var(--faint)"></span>
  </div>

  <div id="ncList">
    <div class="empty-state">
      <div class="icon">🧾</div>
      <div class="msg">Analisando histórico…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* helpers */
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;}
function showToast(msg,ms=2200){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),ms);
}

/* theme */
function toggleTheme(){
  const r=document.documentElement;const cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
  try{localStorage.setItem('naming_audit_theme',r.getAttribute('data-theme'));}catch(e){}
}
(()=>{try{const t=localStorage.getItem('naming_audit_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

/* data */
const CLIENTS_KEY='taxo_clients_v1';
const HIST_KEY='taxo_builder_hist_v1';

function getClients(){try{return JSON.parse(localStorage.getItem(CLIENTS_KEY)||'[]');}catch(e){return[];}}
function getHist(){try{return JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){return[];}}

/* audit logic */
let _results=[];
let _filtered=[];

function runAudit(){
  const clients=getClients().filter(c=>!c.archived);
  const hist=getHist();

  if(!hist.length){
    document.getElementById('ncList').innerHTML=`<div class="empty-state">
      <div class="icon">📭</div>
      <div class="msg">Histórico do Builder vazio</div>
      <div class="sub">Gere NCs no <a href="../taxonomy-builder/" style="color:var(--accent)">Taxonomy Builder</a> e elas aparecerão aqui</div>
    </div>`;
    updateKPIs([]);
    document.getElementById('btnExport').disabled=true;
    return;
  }

  // Build a lookup: for each NC string, find which client it belongs to
  // Strategy: try each client's separator and see if split count matches segment count
  _results=[];

  hist.forEach((entry,idx)=>{
    const nc=typeof entry==='string'?entry:(entry?.nc||'');
    const ts=entry?.ts||null;
    if(!nc.trim()) return;

    // Try to match a client
    let matched=null;
    let matchedSegs=null;
    let matchedVals=null;

    for(const client of clients){
      const sep=client.separator||'_';
      const parts=nc.split(sep);
      const segs=client.segments||[];
      if(parts.length!==segs.length) continue;
      // Treat as candidate — validate each part
      const segResults=segs.map((seg,i)=>{
        const val=parts[i]||'';
        const terms=client.dictionary?.[seg.id]||[];
        const termVals=terms.map(t=>t.value);
        const found=termVals.some(v=>v.toLowerCase()===val.toLowerCase());
        const foundExact=termVals.includes(val);
        return {seg,val,found,foundExact,terms,required:!!seg.required};
      });
      // Score: how many segs have valid values
      const validCount=segResults.filter(r=>r.found).length;
      // Pick the client with the most valid segments
      if(!matched||validCount>(matchedVals?.filter(r=>r.found).length||0)){
        matched=client;
        matchedSegs=segResults;
        matchedVals=segResults;
      }
    }

    // Build issues
    const issues=[];
    let statusLevel='ok'; // ok, warn, err

    if(!matched){
      issues.push({lvl:'err',msg:'Nenhum cliente encontrado com esse separador e número de segmentos'});
      statusLevel='unknown';
    } else {
      matchedSegs.forEach(r=>{
        if(!r.val&&r.required){issues.push({lvl:'err',msg:`Segmento obrigatório "${r.seg.label||r.seg.id}" está vazio`});statusLevel='err';}
        else if(!r.val&&!r.required){/* skip — optional empty is ok */}
        else if(!r.found&&r.val){
          issues.push({lvl:'warn',msg:`"${r.val}" não está no dicionário de "${r.seg.label||r.seg.id}"`});
          if(statusLevel==='ok') statusLevel='warn';
        } else if(r.found&&!r.foundExact){
          issues.push({lvl:'warn',msg:`"${r.val}" encontrado com capitalização diferente no dicionário de "${r.seg.label||r.seg.id}"`});
          if(statusLevel==='ok') statusLevel='warn';
        }
      });
    }

    _results.push({
      nc, ts, matched, matchedSegs: matched?matchedSegs:null,
      issues, status: statusLevel, histIdx: idx
    });
  });

  // Reverse so most recent first
  _results.reverse();

  // Populate client filter
  const sel=document.getElementById('filterClient');
  const existing=new Set(Array.from(sel.options).map(o=>o.value));
  clients.forEach(c=>{
    if(!existing.has(c.id)){
      const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);
    }
  });

  updateKPIs(_results);
  document.getElementById('btnExport').disabled=!_results.length;
  applyFilters();
}

function updateKPIs(results){
  document.getElementById('kpiTotal').textContent=results.length||'—';
  document.getElementById('kpiOk').textContent=results.filter(r=>r.status==='ok').length||'—';
  document.getElementById('kpiWarn').textContent=results.filter(r=>r.status==='warn').length||'—';
  document.getElementById('kpiErr').textContent=results.filter(r=>r.status==='err').length||'—';
  document.getElementById('kpiUnknown').textContent=results.filter(r=>r.status==='unknown').length||'—';
}

function applyFilters(){
  const fc=document.getElementById('filterClient').value;
  const fs=document.getElementById('filterStatus').value;
  const sq=document.getElementById('searchNc').value.trim().toLowerCase();

  _filtered=_results.filter(r=>{
    if(fc&&r.matched?.id!==fc) return false;
    if(fs==='unknown'&&r.status!=='unknown') return false;
    else if(fs&&fs!=='unknown'&&r.status!==fs) return false;
    if(sq&&!r.nc.toLowerCase().includes(sq)) return false;
    return true;
  });

  document.getElementById('countLabel').textContent=`${_filtered.length} de ${_results.length}`;
  renderList(_filtered);
}

function renderList(rows){
  const el=document.getElementById('ncList');
  if(!rows.length){
    el.innerHTML=`<div class="empty-state"><div class="icon">🔍</div><div class="msg">Nenhum resultado</div><div class="sub">Ajuste os filtros</div></div>`;
    return;
  }

  el.innerHTML=`<div class="nc-list">`+rows.map(r=>{
    const statusLabel={'ok':'✓ Válida','warn':'⚠ Avisos','err':'✕ Erros','unknown':'? Não identificada'}[r.status]||r.status;
    const tsStr=r.ts?new Date(r.ts).toLocaleString('pt-BR'):'';

    const segsHtml=r.matchedSegs?r.matchedSegs.map(s=>{
      const cls=!s.val?'skip':s.found&&s.foundExact?'ok':s.found?'warn':'err';
      return `<span class="seg-chip ${cls}" title="${esc(s.seg.label||s.seg.id)}: ${s.val||'(vazio)'}">${esc(s.seg.label||s.seg.id)}: <b>${esc(s.val||'—')}</b></span>`;
    }).join(''):'';

    const clientHtml=r.matched?`<span style="font-size:11px;color:var(--faint)">${esc(r.matched.name)}</span>`:'<span style="font-size:11px;color:var(--erro)">? desconhecido</span>';

    const issuesHtml=r.issues.length?`<div class="nc-issues">`+r.issues.map(i=>
      `<div class="issue-line"><span>${i.lvl==='err'?'✕':'⚠'}</span><span>${esc(i.msg)}</span></div>`
    ).join('')+`</div>`:'';

    return `<div class="nc-row ${r.status}">
      <div class="nc-head">
        <span class="nc-val" title="${esc(r.nc)}">${esc(r.nc)}</span>
        ${clientHtml}
        <span class="nc-status ${r.status}">${statusLabel}</span>
        ${tsStr?`<span class="nc-ts">${esc(tsStr)}</span>`:''}
      </div>
      ${segsHtml?`<div class="nc-segs">${segsHtml}</div>`:''}
      ${issuesHtml}
    </div>`;
  }).join('')+`</div>`;
}

/* CSV export */
function exportCSV(){
  if(!_filtered.length){showToast('Nada para exportar');return;}
  const esc2=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const header=['nc','cliente','status','issues','timestamp'];
  const rows=_filtered.map(r=>[
    r.nc, r.matched?.name||'', r.status,
    r.issues.map(i=>i.msg).join(' | '),
    r.ts?new Date(r.ts).toISOString():''
  ]);
  const csv=[header,...rows].map(row=>row.map(esc2).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`naming-audit-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(a.href);
  showToast(`📥 ${rows.length} NCs exportadas`);
}

/* init */
runAudit();
</script>
</body>
</html>
