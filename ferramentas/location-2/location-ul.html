<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UL · Taxonomia Location</title>
<style>
:root{
  --ul-blue:#003087;--ul-blue-l:#E6EBF5;
  --ul-red:#E4002B;--ul-red-l:#FDEAED;
  --bg:#F2F4F8;--surface:#FFF;--border:#D8DCE8;
  --text:#0D1117;--sub:#5A6478;--green:#16864A;
  --r:8px;--sh:0 1px 3px rgba(0,40,120,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 40px;font-size:14px;}

.header{background:var(--ul-blue);padding:14px 20px;display:flex;align-items:center;gap:12px;}
.hlogo{width:34px;height:34px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.hbar{width:4px;height:34px;background:var(--ul-red);border-radius:2px;flex-shrink:0;}
.htitle{color:#fff;font-size:15px;font-weight:700;}
.hsub{color:rgba(255,255,255,.6);font-size:11.5px;margin-top:1px;}
.hreset{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
.hreset:hover{background:rgba(255,255,255,.25);}

.inner{padding:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--sub);margin-bottom:14px;}

/* STEPS */
.steps{display:flex;flex-direction:column;gap:16px;}
.step{display:flex;gap:12px;align-items:flex-start;}
.snum{width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}
.snum.idle   {background:#ECEEF3;color:#B0B7C8;}
.snum.active {background:var(--ul-blue-l);color:var(--ul-blue);}
.snum.done   {background:var(--ul-blue);color:#fff;}
.snum.active-r{background:var(--ul-red-l);color:var(--ul-red);}
.snum.done-r  {background:var(--ul-red);color:#fff;}
.sbody{flex:1;min-width:0;}
.stitle{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
.stitle.off{color:#B0B7C8;}

/* NACIONAL */
.nac-tog{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;background:var(--bg);}
.nac-tog:hover,.nac-tog.on{border-color:var(--ul-blue);background:var(--ul-blue-l);}
.nac-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s;flex-shrink:0;}
.nac-tog.on .nac-dot{background:var(--ul-blue);border-color:var(--ul-blue);}
.nac-lbl{font-size:13px;font-weight:600;color:var(--sub);}
.nac-tog.on .nac-lbl{color:var(--ul-blue);}
.nac-tag{font-family:monospace;font-size:11px;font-weight:700;background:var(--ul-blue);color:#fff;padding:2px 7px;border-radius:3px;margin-left:auto;}

/* SELECT */
.sw{position:relative;}
.sw select{width:100%;padding:9px 32px 9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;appearance:none;cursor:pointer;transition:border-color .15s,background .15s;}
.sw select:focus{border-color:var(--ul-blue);background:#fff;}
.sw select:disabled{opacity:.35;cursor:not-allowed;background:#F5F6FA;}
.sw-arr{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--sub);font-size:12px;}

/* SLOTS cidade */
.slots{display:flex;flex-direction:column;gap:8px;}
.srow{display:flex;gap:8px;align-items:center;}
.sidx{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ul-blue-l);color:var(--ul-blue);}
.iw{position:relative;flex:1;}
.iw input{width:100%;padding:8px 12px 8px 30px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s,background .15s;}
.iw input:focus{border-color:var(--ul-blue);background:#fff;}
.ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#9BA3B5;font-size:12px;pointer-events:none;}
.clr{background:none;border:none;cursor:pointer;color:#9BA3B5;font-size:13px;padding:4px;opacity:0;transition:opacity .15s,color .15s;flex-shrink:0;}
.clr.on{opacity:1;}.clr:hover{color:var(--ul-red);}
.drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:200;display:none;}
.drop.open{display:block;}
.di{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;}
.di:hover,.di.hi{background:var(--ul-blue-l);}
.dsig{font-family:monospace;font-size:10px;font-weight:700;color:#fff;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.dsig.b{background:var(--ul-blue);}
.dsig.iata{background:var(--ul-red);}
.de{padding:12px;font-size:13px;color:var(--sub);text-align:center;}
.chint{font-size:11.5px;color:var(--sub);margin-top:4px;}

/* LOADING */
.loading{display:flex;align-items:center;gap:10px;padding:20px;font-size:13px;color:var(--sub);}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--ul-blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RESULTADO */
.re{font-size:13px;color:var(--sub);text-align:center;padding:18px 0;}
.rs{display:none;}
.rbox{background:var(--ul-blue);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.rval{font-size:20px;font-weight:800;font-family:monospace;flex:1;word-break:break-all;letter-spacing:.3px;color:#fff;}
.cpy{background:#fff;color:var(--ul-blue);border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0;}
.cpy:hover{background:var(--ul-blue-l);}
.cpy.ok{background:var(--green);color:#fff;}
.rbc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-top:2px;}
.bci{display:flex;align-items:center;gap:4px;}
.bcd{width:6px;height:6px;border-radius:50%;}
.bcd.b{background:var(--ul-blue);}
.bcd.r{background:var(--ul-red);}
.bcl{color:var(--sub);}
.bcs{color:#D1D5DB;font-size:10px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(50px);background:#0D1117;color:#fff;padding:9px 20px;border-radius:7px;font-size:13px;font-weight:500;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s;opacity:0;pointer-events:none;z-index:999;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="hlogo">📍</div>
  <div class="hbar"></div>
  <div>
    <div class="htitle">Taxonomia · Location</div>
    <div class="hsub">Unilever BR · Nacional → Região → Estado → Cidade</div>
  </div>
  <button class="hreset" onclick="resetTudo()">↺ Limpar</button>
</div>

<div class="inner">

  <div class="card" id="loading-card">
    <div class="loading"><div class="spin"></div>Carregando base de localidades...</div>
  </div>

  <div class="card" id="main-card" style="display:none">
    <div class="lbl">Selecione o nível de localidade</div>
    <div class="steps">

      <!-- 1. NACIONAL -->
      <div class="step">
        <div class="snum idle" id="sn-nac">1</div>
        <div class="sbody">
          <div class="stitle off" id="st-nac">Nacional</div>
          <div class="nac-tog" id="nac-tog" onclick="toggleNac()">
            <div class="nac-dot"></div>
            <span class="nac-lbl">Abrangência nacional</span>
            <span class="nac-tag">nac</span>
          </div>
        </div>
      </div>

      <!-- 2. REGIÃO -->
      <div class="step">
        <div class="snum idle" id="sn-reg">2</div>
        <div class="sbody">
          <div class="stitle off" id="st-reg">Região</div>
          <div class="sw">
            <select id="sel-reg" onchange="onReg()" disabled>
              <option value="">— selecione a região —</option>
            </select>
            <span class="sw-arr">▾</span>
          </div>
        </div>
      </div>

      <!-- 3. ESTADO -->
      <div class="step">
        <div class="snum idle" id="sn-est">3</div>
        <div class="sbody">
          <div class="stitle off" id="st-est">Estado</div>
          <div class="sw">
            <select id="sel-est" onchange="onEst()" disabled>
              <option value="">— selecione o estado —</option>
            </select>
            <span class="sw-arr">▾</span>
          </div>
        </div>
      </div>

      <!-- 4. CIDADE -->
      <div class="step">
        <div class="snum idle" id="sn-cid">4</div>
        <div class="sbody">
          <div class="stitle off" id="st-cid">Cidade</div>
          <div class="slots" id="slots-cid"></div>
          <div class="chint" id="hint-cid" style="display:none">↑↓ navega · Enter seleciona · Esc fecha · até 3 cidades</div>
        </div>
      </div>

    </div>
  </div>

  <!-- RESULTADO -->
  <div class="card">
    <div class="lbl">Resultado</div>
    <div class="re" id="re">Faça uma seleção acima</div>
    <div class="rs" id="rs">
      <div class="rbox">
        <div class="rval" id="rval"></div>
        <button class="cpy" id="cpy" onclick="copiarRes()">Copiar</button>
      </div>
      <div class="rbc" id="rbc"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── DADOS ─────────────────────────────────────────────────────────────────────
let DB = null;
// Estado da seleção
let nacOn  = false;
let regVal = '';    // sigla da região selecionada
let regLbl = '';
let estVal = '';    // uf do estado selecionado
let estLbl = '';
let cidSels = [null, null, null];

// UF → sigla de região (para filtrar estados por região)
const UF_REG = {
  AC:'no',AM:'no',AP:'no',PA:'no',RO:'no',RR:'no',TO:'no',
  AL:'ne',BA:'ne',CE:'ne',MA:'ne',PB:'ne',PE:'ne',PI:'ne',RN:'ne',SE:'ne',
  DF:'co',GO:'co',MS:'co',MT:'co',
  ES:'se',MG:'se',RJ:'se',SP:'se',
  PR:'su',RS:'su',SC:'su'
};

// ── CARREGAR ──────────────────────────────────────────────────────────────────
function carregarDados() {
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.withSuccessHandler(init).withFailureHandler(fetchJSON).getDados();
  } else { fetchJSON(); }
}
function fetchJSON() {
  fetch('location.json')
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(init)
    .catch(err=>{
      document.getElementById('loading-card').innerHTML=
        `<div style="padding:16px;text-align:center;font-size:13px;color:#C0392B">
          Erro ao carregar.<br><small>${err}</small><br>
          <button onclick="location.reload()" style="margin-top:8px;padding:6px 14px;border:1px solid #D8DCE8;border-radius:6px;cursor:pointer;font-size:12px">Tentar novamente</button>
        </div>`;
    });
}

function init(dados) {
  DB = {
    regiao: (dados.regiao||dados.região||[]).sort((a,b)=>a.label.localeCompare(b.label,'pt')),
    estado: (dados.estado||[]).sort((a,b)=>a.label.localeCompare(b.label,'pt')),
    cidade: dados.cidade||[],
  };

  document.getElementById('loading-card').style.display='none';
  document.getElementById('main-card').style.display='block';

  // Popular regiões (fixo)
  const sr=document.getElementById('sel-reg');
  DB.regiao.forEach(r=>{
    const o=document.createElement('option');
    o.value=r.sigla; o.textContent=r.label; sr.appendChild(o);
  });

  buildCidSlots();
  renderUI();
}
carregarDados();

// ── RENDER CENTRAL ────────────────────────────────────────────────────────────
// Toda mudança de estado chama renderUI() — ela decide o que habilitar/desabilitar
function renderUI() {
  const selReg = document.getElementById('sel-reg');
  const selEst = document.getElementById('sel-est');

  // NACIONAL
  document.getElementById('nac-tog').classList.toggle('on', nacOn);
  setStep('nac', nacOn ? 'done' : 'active');

  if (nacOn) {
    // Bloqueia tudo abaixo
    selReg.disabled = true;
    selEst.disabled = true;
    lockCids(true);
    setStep('reg','idle'); setStep('est','idle'); setStep('cid','idle');
    showRes([{label:'Nacional',c:'b'}], 'nac');
    return;
  }

  // REGIÃO — sempre habilitada se não nacional
  selReg.disabled = false;
  setStep('reg', regVal ? 'done-r' : 'active-r');

  // ESTADO — habilitado sempre (mostra todos se sem região, filtrado se com região)
  selEst.disabled = false;
  // Repopular estados conforme região
  const ufsDaReg = regVal
    ? Object.entries(UF_REG).filter(([,r])=>r===regVal).map(([uf])=>uf)
    : null; // null = todos

  const estAtual = selEst.value;
  selEst.innerHTML = '<option value="">— selecione o estado —</option>';
  DB.estado
    .filter(e => !ufsDaReg || ufsDaReg.includes(e.uf))
    .forEach(e=>{
      const o=document.createElement('option');
      o.value=e.uf; o.textContent=e.label; selEst.appendChild(o);
    });
  // Restaurar seleção se ainda válida
  if (estVal && (!ufsDaReg || ufsDaReg.includes(estVal))) {
    selEst.value = estVal;
  } else if (estVal && ufsDaReg && !ufsDaReg.includes(estVal)) {
    // Estado não pertence à região selecionada — limpar
    estVal=''; estLbl=''; cidSels=[null,null,null]; resetCidSlots();
  }

  setStep('est', estVal ? 'done' : 'active');

  // CIDADE — só habilita se tiver estado
  if (estVal) {
    setStep('cid','active');
    document.getElementById('hint-cid').style.display='block';
    lockCids(false);
  } else {
    setStep('cid','idle');
    document.getElementById('hint-cid').style.display='none';
    lockCids(true);
  }

  // RESULTADO — nível mais profundo com seleção
  const cidsAtivas = cidSels.filter(Boolean);
  if (cidsAtivas.length) {
    const slugs = cidsAtivas.map(c=>c.sigla.replace(/^cid-/,''));
    const bc = [
      regVal ? {label:regLbl,c:'r'} : null,
      estVal ? {label:estLbl,c:'b'} : null,
      ...cidsAtivas.map(c=>({label:c.label+(c.iata?` (${c.iata})`:''),c:'b'}))
    ].filter(Boolean);
    showRes(bc, 'cid-'+slugs.join('-'));
    setStep('cid','done');
  } else if (estVal) {
    const bc = [
      regVal ? {label:regLbl,c:'r'} : null,
      {label:estLbl,c:'b'}
    ].filter(Boolean);
    showRes(bc, `est-${estVal.toLowerCase()}`);
  } else if (regVal) {
    showRes([{label:regLbl,c:'r'}], `reg-${regVal}`);
  } else {
    clearRes();
  }
}

// ── PASSO A PASSO ─────────────────────────────────────────────────────────────
function toggleNac() {
  nacOn = !nacOn;
  if (nacOn) {
    // Limpar seleções abaixo
    regVal=''; estVal=''; cidSels=[null,null,null];
    document.getElementById('sel-reg').value='';
    document.getElementById('sel-est').value='';
    resetCidSlots();
  }
  renderUI();
}

function onReg() {
  const val = document.getElementById('sel-reg').value;
  regVal = val;
  regLbl = val ? DB.regiao.find(r=>r.sigla===val)?.label||'' : '';
  // Limpar estado e cidades ao trocar região
  estVal=''; estLbl='';
  document.getElementById('sel-est').value='';
  cidSels=[null,null,null]; resetCidSlots();
  renderUI();
}

function onEst() {
  const val = document.getElementById('sel-est').value;
  estVal = val;
  estLbl = val ? DB.estado.find(e=>e.uf===val)?.label||'' : '';
  // Limpar cidades ao trocar estado
  cidSels=[null,null,null]; resetCidSlots();
  renderUI();
}

// ── CIDADES ───────────────────────────────────────────────────────────────────
function buildCidSlots() {
  const c=document.getElementById('slots-cid');
  c.innerHTML='';
  for(let s=1;s<=3;s++){
    const row=document.createElement('div');
    row.className='srow'; row.id=`crow-${s}`;
    row.style.display=s===1?'flex':'none';
    row.innerHTML=`
      <div class="sidx">${s}</div>
      <div class="iw">
        <span class="ico">⌕</span>
        <input type="text" id="ci-${s}" placeholder="Buscar cidade${s>1?' (opcional)':''}..." autocomplete="off" disabled>
        <div class="drop" id="cd-${s}"></div>
      </div>
      <button class="clr" id="cc-${s}" onclick="clearCid(${s})">✕</button>`;
    c.appendChild(row);
    bindCid(s);
  }
}

function lockCids(lock) {
  for(let s=1;s<=3;s++){
    const inp=document.getElementById(`ci-${s}`);
    if(inp) inp.disabled=lock;
  }
}

function resetCidSlots() {
  for(let s=1;s<=3;s++){
    const row=document.getElementById(`crow-${s}`);
    if(row) row.style.display=s===1?'flex':'none';
    const inp=document.getElementById(`ci-${s}`);
    if(inp){inp.value='';inp.disabled=true;}
    const cc=document.getElementById(`cc-${s}`);
    if(cc) cc.classList.remove('on');
  }
  document.getElementById('hint-cid').style.display='none';
}

function bindCid(s) {
  const inp=document.getElementById(`ci-${s}`);
  inp.addEventListener('input',()=>{
    if(cidSels[s-1]&&inp.value!==cidSels[s-1].label){
      cidSels[s-1]=null; document.getElementById(`cc-${s}`).classList.remove('on'); renderUI();
    }
    renderCidDrop(s,inp.value.trim());
  });
  inp.addEventListener('focus',()=>renderCidDrop(s,inp.value.trim()));
  inp.addEventListener('keydown',e=>{
    const d=document.getElementById(`cd-${s}`);
    const items=[...d.querySelectorAll('.di')];
    let idx=items.findIndex(el=>el.classList.contains('hi'));
    if(e.key==='ArrowDown'){e.preventDefault();if(idx<items.length-1){if(idx>=0)items[idx].classList.remove('hi');items[idx+1].classList.add('hi');items[idx+1].scrollIntoView({block:'nearest'});}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(idx>0){items[idx].classList.remove('hi');items[idx-1].classList.add('hi');items[idx-1].scrollIntoView({block:'nearest'});}}
    else if(e.key==='Enter'){e.preventDefault();const hi=d.querySelector('.di.hi');if(hi)hi.dispatchEvent(new Event('mousedown'));}
    else if(e.key==='Escape'){closeDrps();}
  });
}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function renderCidDrop(s,q) {
  const d=document.getElementById(`cd-${s}`);
  const usadas=new Set(cidSels.filter(Boolean).map(x=>x.sigla));
  let lista=DB.cidade.filter(c=>{
    if(usadas.has(c.sigla)&&!(cidSels[s-1]&&cidSels[s-1].sigla===c.sigla)) return false;
    if(estVal && c.uf!==estVal) return false;
    return true;
  });
  if(q){const nq=norm(q);lista=lista.filter(c=>norm(c.label).includes(nq)||c.sigla.includes(nq));}
  lista=lista.slice(0,50);
  d.innerHTML='';
  if(!lista.length){d.innerHTML='<div class="de">Nenhuma cidade encontrada</div>';d.classList.add('open');return;}
  for(const c of lista){
    const it=document.createElement('div'); it.className='di';
    const bcls=c.iata?'iata':'b';
    const tag=c.iata||c.sigla;
    it.innerHTML=`<span class="dsig ${bcls}">${tag}</span>${c.label}`;
    it.addEventListener('mousedown',e=>{e.preventDefault();selCid(s,c);});
    d.appendChild(it);
  }
  d.classList.add('open');
}

function selCid(s,c) {
  cidSels[s-1]=c;
  document.getElementById(`ci-${s}`).value=c.label;
  document.getElementById(`cc-${s}`).classList.add('on');
  closeDrps();
  if(s<3){
    document.getElementById(`crow-${s+1}`).style.display='flex';
    document.getElementById(`ci-${s+1}`).disabled=false;
  }
  renderUI();
}

function clearCid(s) {
  cidSels[s-1]=null;
  document.getElementById(`ci-${s}`).value='';
  document.getElementById(`cc-${s}`).classList.remove('on');
  for(let i=s+1;i<=3;i++){
    cidSels[i-1]=null;
    document.getElementById(`crow-${i}`).style.display='none';
    document.getElementById(`ci-${i}`).value='';
    document.getElementById(`cc-${i}`).classList.remove('on');
  }
  renderUI();
}

// ── STEPS ─────────────────────────────────────────────────────────────────────
function setStep(s, state) {
  const n=document.getElementById(`sn-${s}`);
  const t=document.getElementById(`st-${s}`);
  if(!n) return;
  const map={
    'idle':     ['idle','off'],
    'active':   ['active',''],
    'active-r': ['active-r',''],
    'done':     ['done',''],
    'done-r':   ['done-r',''],
  };
  const [nc,tc]=map[state]||['idle','off'];
  n.className=`snum ${nc}`;
  t.className=`stitle${tc?' '+tc:''}`;
}

// ── RESULTADO ─────────────────────────────────────────────────────────────────
function showRes(bc, valor) {
  document.getElementById('re').style.display='none';
  document.getElementById('rs').style.display='block';
  document.getElementById('rval').textContent=valor;
  const btn=document.getElementById('cpy');
  btn.textContent='Copiar'; btn.classList.remove('ok');
  document.getElementById('rbc').innerHTML=(bc||[]).filter(b=>b&&b.label).map((b,i)=>`
    ${i>0?'<span class="bcs">›</span>':''}
    <span class="bci"><span class="bcd ${b.c}"></span><span class="bcl">${b.label}</span></span>`).join('');
}
function clearRes(){
  document.getElementById('re').style.display='block';
  document.getElementById('rs').style.display='none';
}

// ── RESET TOTAL ───────────────────────────────────────────────────────────────
function resetTudo(){
  nacOn=false; regVal=''; regLbl=''; estVal=''; estLbl='';
  cidSels=[null,null,null];
  document.getElementById('sel-reg').value='';
  document.getElementById('sel-est').value='';
  resetCidSlots();
  renderUI();
}

function closeDrps(){document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'));}
function copiarRes(){cpClip(document.getElementById('rval').textContent,'cpy');}
function cpClip(t,btnId){
  navigator.clipboard.writeText(t).then(()=>{
    if(btnId){const b=document.getElementById(btnId);const o=b.textContent;b.textContent='Copiado ✓';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok');},2000);}
    showToast(`"${t}" copiado`);
  });
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
document.addEventListener('click',e=>{if(!e.target.closest('.iw'))closeDrps();});
</script>
