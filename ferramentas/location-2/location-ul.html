<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UL · Taxonomia Location</title>
<style>
:root{
  --ul-blue:#003087;--ul-blue-l:#E6EBF5;
  --ul-red:#E4002B;--ul-red-l:#FDEAED;
  --bg:#F2F4F8;--surface:#FFF;--border:#D8DCE8;
  --text:#0D1117;--sub:#5A6478;--green:#16864A;
  --r:8px;--sh:0 1px 3px rgba(0,40,120,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 40px;font-size:14px;}

/* HEADER */
.header{background:var(--ul-blue);padding:14px 20px;display:flex;align-items:center;gap:12px;}
.hlogo{width:34px;height:34px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.hbar{width:4px;height:34px;background:var(--ul-red);border-radius:2px;flex-shrink:0;}
.htitle{color:#fff;font-size:15px;font-weight:700;}
.hsub{color:rgba(255,255,255,.6);font-size:11.5px;margin-top:1px;}
.hreset{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
.hreset:hover{background:rgba(255,255,255,.25);}

.inner{padding:16px;}

/* SECTION CARDS */
.sec{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
.sec.active{border-color:var(--ul-blue);}
.sec.active-r{border-color:var(--ul-red);}
.sec-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;}
.sec-num{width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.sec-num.idle{background:#ECEEF3;color:#B0B7C8;}
.sec-num.active{background:var(--ul-blue);color:#fff;}
.sec-num.active-r{background:var(--ul-red);color:#fff;}
.sec-label{font-size:13px;font-weight:700;color:var(--sub);flex:1;}
.sec.active .sec-label,.sec.active-r .sec-label{color:var(--text);}
.sec-tag{font-family:monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;display:none;}
.sec.active .sec-tag,.sec.active-r .sec-tag{display:inline-block;}
.sec-tag.b{background:var(--ul-blue);color:#fff;}
.sec-tag.r{background:var(--ul-red);color:#fff;}
.sec-body{padding:0 16px 14px;border-top:1px solid var(--border);display:none;}
.sec.open .sec-body{display:block;}
.sec-hint{font-size:11.5px;color:#9BA3B5;padding:10px 16px 0;display:none;}
.sec.open .sec-hint{display:block;}

/* NACIONAL */
.nac-tog{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;background:var(--bg);margin-top:10px;}
.nac-tog:hover,.nac-tog.on{border-color:var(--ul-blue);background:var(--ul-blue-l);}
.nac-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s;flex-shrink:0;}
.nac-tog.on .nac-dot{background:var(--ul-blue);border-color:var(--ul-blue);}
.nac-lbl{font-size:13px;font-weight:600;color:var(--sub);}
.nac-tog.on .nac-lbl{color:var(--ul-blue);}
.nac-val{font-family:monospace;font-size:11px;font-weight:700;background:var(--ul-blue);color:#fff;padding:2px 7px;border-radius:3px;margin-left:auto;}

/* SELECT */
.sw{position:relative;}
.sw select{width:100%;padding:9px 32px 9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;appearance:none;cursor:pointer;transition:border-color .15s;}
.sw select:focus{border-color:var(--ul-blue);background:#fff;}
.sw-arr{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--sub);font-size:12px;}

/* REGIÕES — checkboxes */
.reg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.reg-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;background:var(--bg);}
.reg-item:hover{border-color:var(--ul-red);background:var(--ul-red-l);}
.reg-item.sel{border-color:var(--ul-red);background:var(--ul-red-l);}
.reg-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s;flex-shrink:0;}
.reg-item.sel .reg-dot{background:var(--ul-red);border-color:var(--ul-red);}
.reg-name{font-size:13px;font-weight:600;color:var(--sub);}
.reg-item.sel .reg-name{color:var(--ul-red);}
.reg-sig{font-family:monospace;font-size:10px;color:#9BA3B5;margin-left:auto;}
.reg-item.sel .reg-sig{color:var(--ul-red);}

/* ESTADOS — select normal */
.est-wrap{margin-top:10px;}

/* CIDADES — slots com estado próprio */
.cid-slots{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.cid-slot{display:flex;gap:8px;align-items:flex-start;}
.cid-slot-num{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;background:var(--ul-blue-l);color:var(--ul-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:9px;}
.cid-slot-inner{flex:1;display:flex;flex-direction:column;gap:6px;}
.cid-slot-row{display:flex;gap:6px;align-items:center;}
.cid-est-sel{flex:0 0 160px;}
.cid-est-sel select{width:100%;padding:8px 28px 8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;color:var(--text);background:var(--bg);outline:none;appearance:none;cursor:pointer;}
.cid-est-sel select:focus{border-color:var(--ul-blue);background:#fff;}
.cid-est-sel .sw-arr{font-size:11px;}
.iw{position:relative;flex:1;}
.iw input{width:100%;padding:8px 12px 8px 30px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s;}
.iw input:focus{border-color:var(--ul-blue);background:#fff;}
.iw input:disabled{opacity:.35;cursor:not-allowed;}
.ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#9BA3B5;font-size:12px;pointer-events:none;}
.clr{background:none;border:none;cursor:pointer;color:#9BA3B5;font-size:13px;padding:4px;opacity:0;transition:opacity .15s,color .15s;flex-shrink:0;margin-top:6px;}
.clr.on{opacity:1;}.clr:hover{color:var(--ul-red);}
.drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;z-index:200;display:none;}
.drop.open{display:block;}
.di{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;}
.di:hover,.di.hi{background:var(--ul-blue-l);}
.dsig{font-family:monospace;font-size:10px;font-weight:700;color:#fff;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.dsig.b{background:var(--ul-blue);}
.dsig.iata{background:var(--ul-red);}
.de{padding:12px;font-size:13px;color:var(--sub);text-align:center;}
.add-slot{margin-top:4px;background:none;border:1.5px dashed var(--border);border-radius:7px;width:100%;padding:7px;font-size:12px;color:var(--sub);cursor:pointer;transition:all .15s;}
.add-slot:hover{border-color:var(--ul-blue);color:var(--ul-blue);background:var(--ul-blue-l);}

/* LOADING */
.loading{display:flex;align-items:center;gap:10px;padding:20px;font-size:13px;color:var(--sub);}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--ul-blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RESULTADO */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--sub);margin-bottom:12px;}
.re{font-size:13px;color:var(--sub);text-align:center;padding:14px 0;}
.rs{display:none;}
.rbox{background:var(--ul-blue);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.rval{font-size:20px;font-weight:800;font-family:monospace;flex:1;word-break:break-all;letter-spacing:.3px;color:#fff;}
.cpy{background:#fff;color:var(--ul-blue);border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0;}
.cpy:hover{background:var(--ul-blue-l);}
.cpy.ok{background:var(--green);color:#fff;}
.rbc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-top:4px;}
.bci{display:flex;align-items:center;gap:4px;}
.bcd{width:6px;height:6px;border-radius:50%;}
.bcd.b{background:var(--ul-blue);}
.bcd.r{background:var(--ul-red);}
.bcl{color:var(--sub);}
.bcs{color:#D1D5DB;font-size:10px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(50px);background:#0D1117;color:#fff;padding:9px 20px;border-radius:7px;font-size:13px;font-weight:500;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s;opacity:0;pointer-events:none;z-index:999;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="hlogo">📍</div>
  <div class="hbar"></div>
  <div>
    <div class="htitle">Taxonomia · Location</div>
    <div class="hsub">Unilever BR · Selecione um nível por vez</div>
  </div>
  <button class="hreset" onclick="resetTudo()">↺ Limpar</button>
</div>

<div class="inner">

  <div class="card" id="loading-card">
    <div class="loading"><div class="spin"></div>Carregando base de localidades...</div>
  </div>

  <div id="sections" style="display:none">

    <!-- NACIONAL -->
    <div class="sec open" id="sec-nac" onclick="toggleSec('nac')">
      <div class="sec-header">
        <div class="sec-num idle" id="snum-nac">1</div>
        <div class="sec-label">Nacional</div>
        <span class="sec-tag b">nac</span>
      </div>
      <div class="sec-body" onclick="e=>e.stopPropagation()">
        <div class="nac-tog" id="nac-tog" onclick="event.stopPropagation();toggleNac()">
          <div class="nac-dot"></div>
          <span class="nac-lbl">Abrangência nacional</span>
          <span class="nac-val">nac</span>
        </div>
      </div>
    </div>

    <!-- REGIÃO -->
    <div class="sec" id="sec-reg" onclick="toggleSec('reg')">
      <div class="sec-header">
        <div class="sec-num idle" id="snum-reg">2</div>
        <div class="sec-label">Região <span style="font-weight:400;font-size:12px;color:#9BA3B5">· até 3</span></div>
        <span class="sec-tag r" id="tag-reg"></span>
      </div>
      <div class="sec-body" onclick="event.stopPropagation()">
        <div class="reg-grid" id="reg-grid"></div>
      </div>
    </div>

    <!-- ESTADO -->
    <div class="sec" id="sec-est" onclick="toggleSec('est')">
      <div class="sec-header">
        <div class="sec-num idle" id="snum-est">3</div>
        <div class="sec-label">Estado <span style="font-weight:400;font-size:12px;color:#9BA3B5">· até 3</span></div>
        <span class="sec-tag b" id="tag-est"></span>
      </div>
      <div class="sec-body" onclick="event.stopPropagation()">
        <div class="est-wrap">
          <div class="sw" style="margin-bottom:8px">
            <select id="sel-est-filt" onchange="filtrarEst()">
              <option value="">Filtrar por região (opcional)</option>
            </select>
            <span class="sw-arr">▾</span>
          </div>
          <div id="est-slots"></div>
          <button class="add-slot" id="add-est" onclick="addEstSlot()" style="display:none">+ Adicionar estado</button>
        </div>
      </div>
    </div>

    <!-- CIDADE -->
    <div class="sec" id="sec-cid" onclick="toggleSec('cid')">
      <div class="sec-header">
        <div class="sec-num idle" id="snum-cid">4</div>
        <div class="sec-label">Cidade <span style="font-weight:400;font-size:12px;color:#9BA3B5">· até 3</span></div>
        <span class="sec-tag b" id="tag-cid"></span>
      </div>
      <div class="sec-body" onclick="event.stopPropagation()">
        <div class="cid-slots" id="cid-slots"></div>
        <button class="add-slot" id="add-cid" onclick="addCidSlot()" style="display:none">+ Adicionar cidade</button>
      </div>
    </div>

  </div>

  <!-- RESULTADO -->
  <div class="card">
    <div class="lbl">Resultado</div>
    <div class="re" id="re">Selecione um nível acima</div>
    <div class="rs" id="rs">
      <div class="rbox">
        <div class="rval" id="rval"></div>
        <button class="cpy" id="cpy" onclick="copiarRes()">Copiar</button>
      </div>
      <div class="rbc" id="rbc"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── DADOS ─────────────────────────────────────────────────────────────────────
let DB = null;
let activeLevel = null; // 'nac'|'reg'|'est'|'cid'
let nacOn = false;
let regSels = [];       // [{sigla,label}]
let estSels = [null, null, null];
let cidSels = [null, null, null]; // [{label,sigla,iata,uf, estUF}]
let estSlotCount = 1;
let cidSlotCount = 1;

// ── CARREGAR ──────────────────────────────────────────────────────────────────
(function(){
  if(typeof google!=='undefined'&&google.script){
    google.script.run.withSuccessHandler(init).withFailureHandler(fetchJSON).getDados();
  } else { fetchJSON(); }
})();

function fetchJSON(){
  fetch('location.json')
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(init)
    .catch(err=>{
      document.getElementById('loading-card').innerHTML=
        `<div style="padding:16px;text-align:center;font-size:13px;color:#C0392B">
          Erro ao carregar.<br><small>${err}</small><br>
          <button onclick="location.reload()" style="margin-top:8px;padding:6px 14px;border:1px solid #D8DCE8;border-radius:6px;cursor:pointer;font-size:12px">Tentar novamente</button>
        </div>`;
    });
}

function init(dados){
  DB={
    regiao:(dados.regiao||dados.região||[]).sort((a,b)=>a.label.localeCompare(b.label,'pt')),
    estado:(dados.estado||[]).sort((a,b)=>a.label.localeCompare(b.label,'pt')),
    cidade:dados.cidade||[],
  };
  document.getElementById('loading-card').style.display='none';
  document.getElementById('sections').style.display='block';

  // Regiões — grid de checkboxes
  const rg=document.getElementById('reg-grid');
  DB.regiao.forEach(r=>{
    const el=document.createElement('div');
    el.className='reg-item'; el.id=`ri-${r.sigla}`;
    el.dataset.sigla=r.sigla; el.dataset.label=r.label;
    el.innerHTML=`<div class="reg-dot"></div><span class="reg-name">${r.label}</span><span class="reg-sig">reg-${r.sigla}</span>`;
    el.addEventListener('click',e=>{e.stopPropagation();toggleReg(r.sigla,r.label,el);});
    rg.appendChild(el);
  });

  // Filtro de região para estados
  const sf=document.getElementById('sel-est-filt');
  DB.regiao.forEach(r=>{
    const o=document.createElement('option');
    o.value=r.sigla; o.textContent=r.label; sf.appendChild(o);
  });

  // Slots de estado e cidade iniciais
  buildEstSlot(0);
  buildCidSlot(0);
}

// ── SEÇÕES (accordion exclusivo) ──────────────────────────────────────────────
function toggleSec(lvl){
  const isOpen=document.getElementById(`sec-${lvl}`).classList.contains('open');
  // Fechar todas
  ['nac','reg','est','cid'].forEach(l=>{
    document.getElementById(`sec-${l}`).classList.remove('open');
  });
  if(!isOpen){
    document.getElementById(`sec-${lvl}`).classList.add('open');
  }
}

// ── LÓGICA DE NÍVEL ATIVO ─────────────────────────────────────────────────────
function setLevel(lvl){
  // Limpar outros níveis
  if(lvl!=='nac'){ nacOn=false; document.getElementById('nac-tog').classList.remove('on'); }
  if(lvl!=='reg'){ regSels=[]; document.querySelectorAll('.reg-item').forEach(el=>el.classList.remove('sel')); }
  if(lvl!=='est'){ estSels=[null,null,null]; estSlotCount=1; rebuildEstSlots(); }
  if(lvl!=='cid'){ cidSels=[null,null,null]; cidSlotCount=1; rebuildCidSlots(); }

  activeLevel=lvl||null;
  renderAll();
}

// ── NACIONAL ──────────────────────────────────────────────────────────────────
function toggleNac(){
  if(activeLevel==='nac'){ activeLevel=null; nacOn=false; }
  else { nacOn=true; setLevel('nac'); return; }
  renderAll();
}

// ── REGIÃO ────────────────────────────────────────────────────────────────────
function toggleReg(sigla,label,el){
  const idx=regSels.findIndex(r=>r.sigla===sigla);
  if(idx>=0){
    regSels.splice(idx,1); el.classList.remove('sel');
  } else {
    if(regSels.length>=3) return;
    regSels.push({sigla,label}); el.classList.add('sel');
  }
  if(regSels.length>0){ activeLevel='reg'; }
  else if(activeLevel==='reg'){ activeLevel=null; }
  // Limpar outros
  if(regSels.length>0){
    nacOn=false; document.getElementById('nac-tog').classList.remove('on');
    estSels=[null,null,null]; estSlotCount=1; rebuildEstSlots();
    cidSels=[null,null,null]; cidSlotCount=1; rebuildCidSlots();
  }
  renderAll();
}

// ── ESTADO ────────────────────────────────────────────────────────────────────
const UF_REG={
  AC:'no',AM:'no',AP:'no',PA:'no',RO:'no',RR:'no',TO:'no',
  AL:'ne',BA:'ne',CE:'ne',MA:'ne',PB:'ne',PE:'ne',PI:'ne',RN:'ne',SE:'ne',
  DF:'co',GO:'co',MS:'co',MT:'co',
  ES:'se',MG:'se',RJ:'se',SP:'se',
  PR:'su',RS:'su',SC:'su'
};

function filtrarEst(){
  // Repopular todos os selects de estado com o filtro aplicado
  const filt=document.getElementById('sel-est-filt').value;
  for(let s=0;s<3;s++){
    const sel=document.getElementById(`est-sel-${s}`);
    if(!sel) continue;
    const cur=sel.value;
    sel.innerHTML='<option value="">— estado —</option>';
    DB.estado
      .filter(e=>!filt||UF_REG[e.uf]===filt)
      .forEach(e=>{
        const o=document.createElement('option');
        o.value=e.uf; o.textContent=e.label; sel.appendChild(o);
      });
    // Restaurar se ainda válido
    if(cur && (!filt||UF_REG[cur]===filt)) sel.value=cur;
    else if(cur){ estSels[s]=null; sel.value=''; }
  }
  renderAll();
}

function buildEstSlot(s){
  const container=document.getElementById('est-slots');
  const row=document.createElement('div');
  row.id=`est-row-${s}`; row.className='sw'; row.style.marginBottom='6px';
  row.innerHTML=`
    <select id="est-sel-${s}" onchange="onEstChange(${s})">
      <option value="">— selecione o estado —</option>
    </select>
    <span class="sw-arr">▾</span>`;
  container.appendChild(row);

  const sel=row.querySelector('select');
  const filt=document.getElementById('sel-est-filt').value;
  DB.estado.filter(e=>!filt||UF_REG[e.uf]===filt).forEach(e=>{
    const o=document.createElement('option');
    o.value=e.uf; o.textContent=e.label; sel.appendChild(o);
  });
}

function rebuildEstSlots(){
  const c=document.getElementById('est-slots'); c.innerHTML='';
  estSlotCount=1;
  buildEstSlot(0);
  document.getElementById('add-est').style.display='none';
}

function onEstChange(s){
  const val=document.getElementById(`est-sel-${s}`).value;
  if(val){
    estSels[s]=DB.estado.find(e=>e.uf===val)||null;
    activeLevel='est';
    // Limpar outros níveis
    nacOn=false; document.getElementById('nac-tog').classList.remove('on');
    regSels=[]; document.querySelectorAll('.reg-item').forEach(el=>el.classList.remove('sel'));
    cidSels=[null,null,null]; cidSlotCount=1; rebuildCidSlots();
    // Mostrar botão adicionar se < 3 slots e este preenchido
    if(s===estSlotCount-1 && estSlotCount<3){
      document.getElementById('add-est').style.display='block';
    }
  } else {
    estSels[s]=null;
    // Limpar slots após este
    for(let i=s+1;i<3;i++){
      estSels[i]=null;
      const sel=document.getElementById(`est-sel-${i}`);
      if(sel){ sel.value=''; const row=document.getElementById(`est-row-${i}`); if(row&&i>=1) row.style.display='none'; }
    }
    if(!estSels.filter(Boolean).length) activeLevel=null;
    document.getElementById('add-est').style.display='none';
  }
  renderAll();
}

function addEstSlot(){
  if(estSlotCount>=3) return;
  const s=estSlotCount; estSlotCount++;
  buildEstSlot(s);
  document.getElementById('add-est').style.display='none';
}

// ── CIDADE ────────────────────────────────────────────────────────────────────
function buildCidSlot(s){
  const container=document.getElementById('cid-slots');
  const slot=document.createElement('div');
  slot.className='cid-slot'; slot.id=`cid-slot-${s}`;
  slot.innerHTML=`
    <div class="cid-slot-num">${s+1}</div>
    <div class="cid-slot-inner">
      <div class="cid-slot-row">
        <div class="cid-est-sel sw">
          <select id="ce-${s}" onchange="onCidEstChange(${s})">
            <option value="">— estado —</option>
          </select>
          <span class="sw-arr">▾</span>
        </div>
        <div class="iw">
          <span class="ico">⌕</span>
          <input type="text" id="ci-${s}" placeholder="Buscar cidade..." autocomplete="off" disabled>
          <div class="drop" id="cd-${s}"></div>
        </div>
        <button class="clr" id="cc-${s}" onclick="clearCid(${s})">✕</button>
      </div>
    </div>`;
  container.appendChild(slot);

  // Popular estados neste slot
  const sel=slot.querySelector(`#ce-${s}`);
  DB.estado.sort((a,b)=>a.label.localeCompare(b.label,'pt')).forEach(e=>{
    const o=document.createElement('option');
    o.value=e.uf; o.textContent=e.label; sel.appendChild(o);
  });

  bindCidInput(s);
}

function rebuildCidSlots(){
  const c=document.getElementById('cid-slots'); c.innerHTML='';
  cidSlotCount=1; cidSels=[null,null,null];
  buildCidSlot(0);
  document.getElementById('add-cid').style.display='none';
}

function onCidEstChange(s){
  const uf=document.getElementById(`ce-${s}`).value;
  // Limpar cidade deste slot
  cidSels[s]=null;
  document.getElementById(`ci-${s}`).value='';
  document.getElementById(`cc-${s}`).classList.remove('on');
  // Habilitar/desabilitar input
  document.getElementById(`ci-${s}`).disabled=!uf;
  closeDrps();
  renderAll();
}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function bindCidInput(s){
  const inp=document.getElementById(`ci-${s}`);
  inp.addEventListener('input',()=>{
    if(cidSels[s]&&inp.value!==cidSels[s].label){ cidSels[s]=null; document.getElementById(`cc-${s}`).classList.remove('on'); renderAll(); }
    renderCidDrop(s,inp.value.trim());
  });
  inp.addEventListener('focus',()=>renderCidDrop(s,inp.value.trim()));
  inp.addEventListener('keydown',e=>{
    const d=document.getElementById(`cd-${s}`);
    const items=[...d.querySelectorAll('.di')];
    let idx=items.findIndex(el=>el.classList.contains('hi'));
    if(e.key==='ArrowDown'){e.preventDefault();if(idx<items.length-1){if(idx>=0)items[idx].classList.remove('hi');items[idx+1].classList.add('hi');items[idx+1].scrollIntoView({block:'nearest'});}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(idx>0){items[idx].classList.remove('hi');items[idx-1].classList.add('hi');items[idx-1].scrollIntoView({block:'nearest'});}}
    else if(e.key==='Enter'){e.preventDefault();const hi=d.querySelector('.di.hi');if(hi)hi.dispatchEvent(new Event('mousedown'));}
    else if(e.key==='Escape'){closeDrps();}
  });
}

function renderCidDrop(s,q){
  const d=document.getElementById(`cd-${s}`);
  const uf=document.getElementById(`ce-${s}`).value;
  if(!uf){d.classList.remove('open');return;}
  const usadas=new Set(cidSels.filter(Boolean).map(x=>x.sigla));
  let lista=DB.cidade.filter(c=>{
    if(c.uf!==uf) return false;
    if(usadas.has(c.sigla)&&!(cidSels[s]&&cidSels[s].sigla===c.sigla)) return false;
    return true;
  });
  if(q){const nq=norm(q);lista=lista.filter(c=>norm(c.label).includes(nq)||c.sigla.includes(nq));}
  lista=lista.slice(0,50);
  d.innerHTML='';
  if(!lista.length){d.innerHTML='<div class="de">Nenhuma cidade encontrada</div>';d.classList.add('open');return;}
  for(const c of lista){
    const it=document.createElement('div'); it.className='di';
    const bcls=c.iata?'iata':'b'; const tag=c.iata||c.sigla;
    it.innerHTML=`<span class="dsig ${bcls}">${tag}</span>${c.label}`;
    it.addEventListener('mousedown',e=>{e.preventDefault();selCid(s,c);});
    d.appendChild(it);
  }
  d.classList.add('open');
}

function selCid(s,c){
  cidSels[s]=c;
  document.getElementById(`ci-${s}`).value=c.label;
  document.getElementById(`cc-${s}`).classList.add('on');
  closeDrps();
  activeLevel='cid';
  // Limpar outros níveis
  nacOn=false; document.getElementById('nac-tog').classList.remove('on');
  regSels=[]; document.querySelectorAll('.reg-item').forEach(el=>el.classList.remove('sel'));
  estSels=[null,null,null]; estSlotCount=1; rebuildEstSlots();
  // Mostrar botão adicionar
  if(s===cidSlotCount-1&&cidSlotCount<3){
    document.getElementById('add-cid').style.display='block';
  }
  renderAll();
}

function clearCid(s){
  cidSels[s]=null;
  document.getElementById(`ci-${s}`).value='';
  document.getElementById(`cc-${s}`).classList.remove('on');
  if(!cidSels.filter(Boolean).length) activeLevel=null;
  document.getElementById('add-cid').style.display=
    cidSels.filter(Boolean).length>0&&cidSlotCount<3?'block':'none';
  renderAll();
}

function addCidSlot(){
  if(cidSlotCount>=3) return;
  const s=cidSlotCount; cidSlotCount++;
  buildCidSlot(s);
  document.getElementById('add-cid').style.display='none';
}

// ── RENDER VISUAL ─────────────────────────────────────────────────────────────
function renderAll(){
  const lvl=activeLevel;

  // Seção styles
  ['nac','reg','est','cid'].forEach(l=>{
    const sec=document.getElementById(`sec-${l}`);
    const num=document.getElementById(`snum-${l}`);
    const isReg=l==='reg';
    const isActive=l===lvl;
    sec.classList.remove('active','active-r');
    if(isActive) sec.classList.add(isReg?'active-r':'active');
    num.className='sec-num '+(isActive?(isReg?'active-r':'active'):'idle');
  });

  // Tags de resultado em cada seção
  if(lvl==='nac'){ setTag('nac','nac','b'); } else setTag('nac','','b');
  if(lvl==='reg'&&regSels.length){
    setTag('reg','reg-'+regSels.map(r=>r.sigla).join('-'),'r');
  } else setTag('reg','','r');
  if(lvl==='est'){
    const ativas=estSels.filter(Boolean);
    setTag('est',ativas.length?'est-'+ativas.map(e=>e.uf.toLowerCase()).join('-'):'','b');
  } else setTag('est','','b');
  if(lvl==='cid'){
    const ativas=cidSels.filter(Boolean);
    if(ativas.length){
      const slugs=ativas.map(c=>c.sigla.replace(/^cid-/,''));
      setTag('cid','cid-'+slugs.join('-'),'b');
    } else setTag('cid','','b');
  } else setTag('cid','','b');

  // Resultado final
  if(!lvl){clearRes();return;}
  if(lvl==='nac'){ showRes([{label:'Nacional',c:'b'}],'nac'); return; }
  if(lvl==='reg'&&regSels.length){
    showRes(regSels.map(r=>({label:r.label,c:'r'})),'reg-'+regSels.map(r=>r.sigla).join('-')); return;
  }
  if(lvl==='est'){
    const ativas=estSels.filter(Boolean);
    if(ativas.length){
      showRes(ativas.map(e=>({label:e.label,c:'b'})),'est-'+ativas.map(e=>e.uf.toLowerCase()).join('-')); return;
    }
  }
  if(lvl==='cid'){
    const ativas=cidSels.filter(Boolean);
    if(ativas.length){
      const slugs=ativas.map(c=>c.sigla.replace(/^cid-/,''));
      const bc=ativas.map(c=>({label:`${c.label} (${c.uf})`,c:'b'}));
      showRes(bc,'cid-'+slugs.join('-')); return;
    }
  }
  clearRes();
}

function setTag(lvl,val,cls){
  const t=document.getElementById(`tag-${lvl}`);
  if(!t) return;
  t.textContent=val; t.className=`sec-tag ${cls}`;
  t.style.display=val?'inline-block':'none';
}

function showRes(bc,valor){
  document.getElementById('re').style.display='none';
  document.getElementById('rs').style.display='block';
  document.getElementById('rval').textContent=valor;
  const btn=document.getElementById('cpy');
  btn.textContent='Copiar'; btn.classList.remove('ok');
  document.getElementById('rbc').innerHTML=(bc||[]).filter(b=>b&&b.label).map((b,i)=>`
    ${i>0?'<span class="bcs">›</span>':''}
    <span class="bci"><span class="bcd ${b.c}"></span><span class="bcl">${b.label}</span></span>`).join('');
}
function clearRes(){
  document.getElementById('re').style.display='block';
  document.getElementById('rs').style.display='none';
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetTudo(){
  activeLevel=null; nacOn=false;
  regSels=[]; document.querySelectorAll('.reg-item').forEach(el=>el.classList.remove('sel'));
  estSels=[null,null,null]; estSlotCount=1; rebuildEstSlots();
  document.getElementById('sel-est-filt').value='';
  cidSels=[null,null,null]; cidSlotCount=1; rebuildCidSlots();
  document.getElementById('nac-tog').classList.remove('on');
  renderAll();
}

function closeDrps(){document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'));}
function copiarRes(){cpClip(document.getElementById('rval').textContent,'cpy');}
function cpClip(t,btnId){
  navigator.clipboard.writeText(t).then(()=>{
    if(btnId){const b=document.getElementById(btnId);const o=b.textContent;b.textContent='Copiado ✓';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok');},2000);}
    showToast(`"${t}" copiado`);
  });
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
document.addEventListener('click',e=>{if(!e.target.closest('.iw'))closeDrps();});
</script>
</body>
