<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparador de Tag | NC Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;
  --bg:#f0f2ff;--surface:#fff;--border:#d6dbf2;--muted:#9fa8da;
  --text:#1a237e;--body:#3d4a8a;
  --add:#166534;--add-bg:#f0fdf4;--add-bd:#bbf7d0;
  --rem:#9f1239;--rem-bg:#fff1f2;--rem-bd:#fecdd3;
  --chg:#92400e;--chg-bg:#fffbeb;--chg-bd:#fde68a;
  --same:#3d4a8a;--same-bg:#f0f2ff;--same-bd:#d6dbf2;
  --mono:'JetBrains Mono',monospace;
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--azul);text-decoration:none;opacity:.7;padding:16px 24px 0;transition:opacity .15s}
a.back:hover{opacity:1}
.header{padding:20px 24px 0;max-width:1600px;margin:0 auto}
h1{font-size:22px;font-weight:700;color:var(--escuro)}
.subtitle{font-size:13px;color:var(--body);margin-top:4px;margin-bottom:20px}
.main{max-width:1600px;margin:0 auto;padding:0 24px 48px}
.inputs-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:700px){.inputs-row{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.input-label{font-size:12px;font-weight:600;color:var(--body);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.badge-a{background:#dbeafe;color:#1d4ed8;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.badge-b{background:#fce7f3;color:#be185d;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
textarea{width:100%;font-family:var(--mono);font-size:11.5px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--escuro);resize:vertical;min-height:90px;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--azul)}
.btn-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button{padding:8px 18px;font-size:13px;font-weight:600;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--azul);color:#fff}
.btn-primary:hover{background:var(--escuro)}
.btn-secondary{background:var(--light);color:var(--azul);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
/* summary bar */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{padding:8px 14px;border-radius:8px;border:1px solid;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.stat-add{background:var(--add-bg);border-color:var(--add-bd);color:var(--add)}
.stat-rem{background:var(--rem-bg);border-color:var(--rem-bd);color:var(--rem)}
.stat-chg{background:var(--chg-bg);border-color:var(--chg-bd);color:var(--chg)}
.stat-same{background:var(--same-bg);border-color:var(--same-bd);color:var(--same)}
/* diff table */
.diff-table{width:100%;border-collapse:collapse;font-size:12px}
.diff-table th{background:var(--bg);padding:8px 10px;text-align:left;font-weight:700;color:var(--body);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border)}
.diff-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.diff-table tr:last-child td{border-bottom:none}
.param-key{font-family:var(--mono);font-weight:600;color:var(--azul)}
.val{font-family:var(--mono);word-break:break-all;max-width:280px}
.val-a{color:#1d4ed8}
.val-b{color:#be185d}
.status-add{font-weight:700;color:var(--add)}
.status-rem{font-weight:700;color:var(--rem)}
.status-chg{font-weight:700;color:var(--chg)}
.status-same{color:var(--muted)}
/* raw diff */
.raw-diff{font-family:var(--mono);font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all;border-radius:8px;padding:12px;border:1px solid var(--border);background:var(--bg);max-height:300px;overflow-y:auto}
.line-add{background:#bbf7d0;color:#14532d;display:block;padding:0 6px;margin:0 -6px;border-left:3px solid var(--add)}
.line-rem{background:#fecdd3;color:#881337;display:block;padding:0 6px;margin:0 -6px;border-left:3px solid var(--rem)}
.line-same{color:var(--body)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px}
.vtab{padding:7px 16px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:all .15s}
.vtab:hover{color:var(--azul)}
.vtab.active{color:var(--azul);border-bottom-color:var(--azul)}
.panel{display:none}
.panel.active{display:block}
</style>
</head>
<body>

<a class="back" href="/Projeto-NC/ferramentas/">← Ferramentas</a>

<div class="header">
  <h1>Comparador de Tag</h1>
  <p class="subtitle">Cola duas versões de uma tag ou URL — veja exatamente quais parâmetros foram adicionados, removidos ou alterados, com destaque visual.</p>
</div>

<div class="main">

  <div class="card">
    <div class="inputs-row">
      <div>
        <div class="input-label"><span class="badge-a">A</span> Tag / URL original (antes)</div>
        <textarea id="tag-a" rows="5" placeholder="Cole aqui a versão original…" oninput="autoCompare()"></textarea>
      </div>
      <div>
        <div class="input-label"><span class="badge-b">B</span> Tag / URL nova (depois)</div>
        <textarea id="tag-b" rows="5" placeholder="Cole aqui a versão nova…" oninput="autoCompare()"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="compare()">Comparar</button>
      <button class="btn-secondary" onclick="swap()">↕ Inverter A/B</button>
      <button class="btn-secondary" onclick="clearAll()">Limpar</button>
    </div>
  </div>

  <div id="result"></div>

</div>

<script>
let timer=null;
function autoCompare(){clearTimeout(timer);timer=setTimeout(compare,600);}

function swap(){
  const a=document.getElementById('tag-a').value;
  const b=document.getElementById('tag-b').value;
  document.getElementById('tag-a').value=b;
  document.getElementById('tag-b').value=a;
  compare();
}
function clearAll(){
  document.getElementById('tag-a').value='';
  document.getElementById('tag-b').value='';
  document.getElementById('result').innerHTML='';
}

/* ── PARSING ── */
function extractUrl(raw){
  const m=raw.match(/https?:\/\/[^\s"'<>]+/);
  return m?m[0]:'';
}

function parseTagType(raw){
  if(/ad\.doubleclick\.net\/ddm\/activity/.test(raw)) return 'floodlight';
  if(/ad\.doubleclick\.net\/ddm\/clk/.test(raw)) return 'click_tracker';
  if(/<Tracking event=/.test(raw)||/CDATA.*doubleclick/.test(raw)) return 'vast';
  if(/fbevents\.js|fbq\(/.test(raw)) return 'meta_pixel';
  if(/gtag\(|gtm\.js|googletagmanager/.test(raw)) return 'gtag';
  if(/adsafeprotected\.com/.test(raw)) return 'ias';
  if(/doubleverify\.com/.test(raw)) return 'doubleverify';
  return 'generic';
}

function parseParams(url){
  // ;key=value; format (Floodlight)
  const params={};
  if(!url) return params;
  const semi=url.replace(/^https?:\/\/[^/]+\/[^?]+\//,'').replace(/\?.*$/,'');
  if(semi.includes(';')){
    semi.split(';').forEach(s=>{
      const eq=s.indexOf('=');
      if(eq<0)return;
      params[s.slice(0,eq)]=s.slice(eq+1);
    });
  }
  // ?key=value& format (query string)
  const qs=(url.match(/\?([^#]+)/)||[])[1]||'';
  qs.split('&').forEach(s=>{
    const eq=s.indexOf('=');
    if(eq<0)return;
    params[s.slice(0,eq)]=decodeURIComponent(s.slice(eq+1));
  });
  // clean empty host
  delete params[''];
  return params;
}

function parseGtagParams(raw){
  const params={};
  // send_to
  const st=raw.match(/['"]send_to['"]\s*:\s*['"]([^'"]+)['"]/);
  if(st) params['send_to']=st[1];
  // allow_custom_scripts
  const ac=raw.match(/allow_custom_scripts['"\s:]+(\w+)/);
  if(ac) params['allow_custom_scripts']=ac[1];
  // DC ID
  const dc=raw.match(/DC-(\d+)/);
  if(dc) params['DC-ID']='DC-'+dc[1];
  return params;
}

/* ── DIFF ── */
function diffParams(pA,pB){
  const allKeys=new Set([...Object.keys(pA),...Object.keys(pB)]);
  const rows=[];
  allKeys.forEach(k=>{
    const va=pA[k],vb=pB[k];
    let status;
    if(va===undefined) status='add';
    else if(vb===undefined) status='rem';
    else if(va!==vb) status='chg';
    else status='same';
    rows.push({k,va:va??'',vb:vb??'',status});
  });
  // Sort: changes first, then add/rem, then same
  const order={chg:0,add:1,rem:1,same:2};
  rows.sort((a,b)=>order[a.status]-order[b.status]||a.k.localeCompare(b.k));
  return rows;
}

function lineDiff(textA,textB){
  const linesA=textA.split('\n');
  const linesB=textB.split('\n');
  const out=[];
  const maxLen=Math.max(linesA.length,linesB.length);
  for(let i=0;i<maxLen;i++){
    const a=linesA[i],b=linesB[i];
    if(a===undefined) out.push({type:'add',line:b});
    else if(b===undefined) out.push({type:'rem',line:a});
    else if(a!==b){out.push({type:'rem',line:a});out.push({type:'add',line:b});}
    else out.push({type:'same',line:a});
  }
  return out;
}

function compare(){
  const rawA=document.getElementById('tag-a').value.trim();
  const rawB=document.getElementById('tag-b').value.trim();
  if(!rawA&&!rawB){document.getElementById('result').innerHTML='';return;}
  if(!rawA||!rawB){
    document.getElementById('result').innerHTML='<div class="card" style="color:var(--body);font-size:13px">Cole uma tag em cada campo para comparar.</div>';
    return;
  }

  const typeA=parseTagType(rawA),typeB=parseTagType(rawB);
  const urlA=extractUrl(rawA),urlB=extractUrl(rawB);

  let pA={},pB={};
  if(typeA==='gtag'||typeA==='meta_pixel') pA=parseGtagParams(rawA);
  else pA=parseParams(urlA||rawA);
  if(typeB==='gtag'||typeB==='meta_pixel') pB=parseGtagParams(rawB);
  else pB=parseParams(urlB||rawB);

  const rows=diffParams(pA,pB);
  const adds=rows.filter(r=>r.status==='add').length;
  const rems=rows.filter(r=>r.status==='rem').length;
  const chgs=rows.filter(r=>r.status==='chg').length;
  const sames=rows.filter(r=>r.status==='same').length;
  const lineDiffs=lineDiff(rawA,rawB);
  const hasLineDiff=lineDiffs.some(l=>l.type!=='same');

  // Base URL changed?
  const baseA=(urlA||rawA).split(';')[0].split('?')[0];
  const baseB=(urlB||rawB).split(';')[0].split('?')[0];
  const baseChanged=baseA!==baseB;

  document.getElementById('result').innerHTML=`
    <div class="card">
      <div class="tabs">
        <button class="vtab active" onclick="switchTab('params',this)">Parâmetros</button>
        <button class="vtab" onclick="switchTab('raw',this)">Diff de texto</button>
      </div>

      ${typeA!==typeB?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 12px;font-size:12px;color:#92400e;margin-bottom:12px">⚠️ Tipos diferentes: <b>${typeA}</b> (A) vs <b>${typeB}</b> (B) — compare com atenção.</div>`:''}
      ${baseChanged?`<div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:7px;padding:8px 12px;font-size:12px;color:#9f1239;margin-bottom:12px">⛔ URL base diferente:<br><code style="font-size:10px;word-break:break-all">${escHtml(baseA)}</code><br>→ <code style="font-size:10px;word-break:break-all">${escHtml(baseB)}</code></div>`:''}

      <div class="summary">
        ${adds>0?`<div class="stat stat-add">✅ +${adds} adicionado${adds!==1?'s':''}</div>`:''}
        ${rems>0?`<div class="stat stat-rem">❌ −${rems} removido${rems!==1?'s':''}</div>`:''}
        ${chgs>0?`<div class="stat stat-chg">✏️ ${chgs} alterado${chgs!==1?'s':''}</div>`:''}
        <div class="stat stat-same">${sames} igual${sames!==1?'s':''}</div>
        ${!hasLineDiff&&!adds&&!rems&&!chgs?'<div class="stat stat-same" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">✅ Tags idênticas</div>':''}
      </div>

      <div id="panel-params" class="panel active">
        ${rows.length>0?`
        <table class="diff-table">
          <thead><tr><th>Parâmetro</th><th>A (antes)</th><th>B (depois)</th><th>Status</th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td class="param-key">${escHtml(r.k)}=</td>
                <td class="val val-a">${r.va===''?'<span style="color:var(--muted)">(vazio)</span>':escHtml(r.va)||'<span style="color:var(--muted)">—</span>'}</td>
                <td class="val val-b">${r.vb===''?'<span style="color:var(--muted)">(vazio)</span>':escHtml(r.vb)||'<span style="color:var(--muted)">—</span>'}</td>
                <td class="status-${r.status}">${r.status==='add'?'✅ Adicionado':r.status==='rem'?'❌ Removido':r.status==='chg'?'✏️ Alterado':'= Igual'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`:'<div style="font-size:13px;color:var(--body)">Nenhum parâmetro detectado. Veja a aba "Diff de texto" para comparação linha a linha.</div>'}
      </div>

      <div id="panel-raw" class="panel">
        <div class="raw-diff">${lineDiffs.map(l=>`<span class="${l.type==='add'?'line-add':l.type==='rem'?'line-rem':'line-same'}">${escHtml(l.line)}</span>`).join('\n')}</div>
      </div>
    </div>`;
}

function switchTab(id,btn){
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
