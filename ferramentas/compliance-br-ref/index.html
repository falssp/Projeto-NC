<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conformidade Regulatória BR — Referência</title>
<style>
  :root {
    --bacen:   #15803d;
    --susep:   #0369a1;
    --open:    #7c3aed;
    --anpd:    #d97706;
    --concepts:#374151;
    --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .breadcrumb{background:#fff;border-bottom:1px solid var(--border);padding:.55rem 1.5rem;font-size:.8rem;color:var(--muted);}
  .breadcrumb a{color:var(--bacen);text-decoration:none;font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}
  header{background:linear-gradient(135deg,#052e16 0%,var(--bacen) 100%);color:#fff;padding:2rem 1.5rem 1.5rem;}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
  header p{opacity:.85;margin-top:.4rem;font-size:.95rem;}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .controls input{flex:1;min-width:200px;padding:.55rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;}
  .controls input:focus{outline:2px solid var(--bacen);border-color:transparent;}
  .filter-btn{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .filter-btn:hover{border-color:#94a3b8;}
  .filter-btn.active{color:#fff;border-color:transparent;}
  .filter-btn[data-cat="all"].active     {background:#334155;}
  .filter-btn[data-cat="bacen"].active   {background:var(--bacen);}
  .filter-btn[data-cat="susep"].active   {background:var(--susep);}
  .filter-btn[data-cat="open"].active    {background:var(--open);}
  .filter-btn[data-cat="anpd"].active    {background:var(--anpd);}
  .filter-btn[data-cat="concepts"].active{background:var(--concepts);}
  main{max-width:900px;margin:0 auto;padding:1.5rem;}
  .letter-group{margin-bottom:2rem;}
  .letter-anchor{font-size:1.3rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:2px solid var(--border);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.65rem;border-left:4px solid #94a3b8;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .card[data-cat="bacen"]   {border-left-color:var(--bacen);}
  .card[data-cat="susep"]   {border-left-color:var(--susep);}
  .card[data-cat="open"]    {border-left-color:var(--open);}
  .card[data-cat="anpd"]    {border-left-color:var(--anpd);}
  .card[data-cat="concepts"]{border-left-color:var(--concepts);}
  .card-header{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .card-name{font-size:1rem;font-weight:700;}
  .card-acronym{font-size:.82rem;color:var(--muted);font-weight:400;}
  .card-tag{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:#fff;margin-left:auto;white-space:nowrap;}
  .card[data-cat="bacen"]   .card-tag{background:var(--bacen);}
  .card[data-cat="susep"]   .card-tag{background:var(--susep);}
  .card[data-cat="open"]    .card-tag{background:var(--open);}
  .card[data-cat="anpd"]    .card-tag{background:var(--anpd);}
  .card[data-cat="concepts"].card-tag{background:var(--concepts);}
  .card-def{font-size:.88rem;color:#334155;line-height:1.55;}
  .card-aka{font-size:.78rem;color:var(--muted);margin-top:.35rem;}
  .card-aka span{font-style:italic;}
  .az-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:1rem 1.5rem .5rem;}
  .az-btn{font-size:.78rem;font-weight:600;padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .12s;}
  .az-btn:hover{background:var(--bacen);color:#fff;border-color:transparent;}
  #empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted);}
  .count{font-size:.82rem;color:var(--muted);padding:0 1.5rem .5rem;}
</style>
</head>
<body>
<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>
<header>
  <h1>🇧🇷 Conformidade Regulatória BR — Referência</h1>
  <p>BACEN · SUSEP · Open Finance · ANPD · CMN · CVM · COAF · Regulação Setorial Financeira</p>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, regulação ou norma…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="bacen">BACEN e Sistema Financeiro</button>
  <button class="filter-btn" data-cat="susep">SUSEP e Seguros</button>
  <button class="filter-btn" data-cat="open">Open Finance e Pagamentos</button>
  <button class="filter-btn" data-cat="anpd">ANPD e Privacidade</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Programas</button>
</div>
<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>
<script>
const CAT_LABELS={bacen:"BACEN e Sistema Financeiro",susep:"SUSEP e Seguros",open:"Open Finance e Pagamentos",anpd:"ANPD e Privacidade",concepts:"Conceitos e Programas"};
const TERMS=[
  // BACEN
  {name:"Resolução CMN 4.893/2021",acronym:"",cat:"bacen",def:"Dispõe sobre a política de segurança cibernética e os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem para instituições financeiras autorizadas pelo Banco Central. Revogou a Resolução 4.658/2018. Exige: política de segurança cibernética aprovada pelo board, plano de resposta a incidentes, cenários de continuidade de negócios, comunicação de incidentes relevantes ao BACEN em até 72h.",aka:"Res CMN 4893 · Segurança Cibernética BACEN · Res 4658 · Política de Segurança Cibernética"},
  {name:"Resolução CMN 4.557/2017",acronym:"",cat:"bacen",def:"Dispõe sobre a estrutura de gerenciamento de riscos e a estrutura de gerenciamento de capital. Exige que instituições financeiras de maior porte tenham estruturas dedicadas para: risco de crédito, risco de mercado, risco operacional, risco de liquidez e risco socioambiental. Define ILAAP (Internal Liquidity Adequacy Assessment Process) e ICAAP (Internal Capital Adequacy Assessment Process).",aka:"Res CMN 4557 · Gestão de Riscos BACEN · ICAAP · ILAAP · Risco Operacional BACEN"},
  {name:"Circular BACEN 3.909/2018",acronym:"",cat:"bacen",def:"Disciplina os requisitos para a contratação de serviços de processamento e armazenamento de dados e de computação em nuvem pelas instituições financeiras. Define obrigações em relação a: contratos com provedores (cláusulas mínimas sobre auditoria, segurança, continuidade), comunicação prévia ao BACEN para contratação de provedores relevantes no exterior, e requisitos de segurança da informação.",aka:"Circular 3909 · Cloud BACEN · Nuvem Financeira · Circular 3682"},
  {name:"BACEN",acronym:"Banco Central do Brasil",cat:"bacen",def:"Autoridade monetária e regulador do sistema financeiro nacional. Supervisiona: bancos, fintechs, cooperativas de crédito, instituições de pagamento. No contexto de TI e segurança: emite resoluções e circulares que definem requisitos de segurança cibernética, gestão de riscos, continuidade de negócios e uso de cloud para o setor financeiro. Penas por descumprimento: multas e restrições operacionais.",aka:"Banco Central do Brasil · BCB · BACEN · SFN · Sistema Financeiro Nacional"},
  {name:"Risco Operacional — SFN",acronym:"",cat:"bacen",def:"No contexto do Sistema Financeiro Nacional (Resolução CMN 4.557): risco de perda resultante de falha, deficiência ou inadequação de processos internos, pessoas, sistemas ou de eventos externos. Inclui risco legal, mas exclui risco estratégico e reputacional. Categorias de evento: fraude interna/externa, práticas de emprego, danos a ativos físicos, interrupção de negócios e falhas de sistemas, execução de processos e entrega de produtos. Requer capital regulatório (Basileia III).",aka:"Risco Operacional · Basileia III · Risco Sistêmico · Res 4557"},
  // SUSEP
  {name:"SUSEP",acronym:"Superintendência de Seguros Privados",cat:"susep",def:"Autarquia federal que regula e fiscaliza o mercado de seguros privados, previdência complementar aberta, capitalização e resseguros no Brasil. Para TI: emite circulares sobre segurança cibernética, gestão de riscos operacionais e continuidade de negócios específicas para seguradoras. Autoriza operação de insurtechs (sandbox regulatório). Alinhada com a IAIS (International Association of Insurance Supervisors).",aka:"SUSEP · Superintendência de Seguros Privados · Insurtechs · Sandbox SUSEP"},
  {name:"Circular SUSEP 638/2021",acronym:"",cat:"susep",def:"Dispõe sobre a política de segurança cibernética das sociedades supervisionadas pela SUSEP. Requisitos similares à Resolução BACEN 4.893: política de segurança cibernética aprovada pela diretoria, programa de resposta a incidentes, gestão de continuidade de negócios, comunicação de incidentes ao regulador, gestão de terceiros (fornecedores com acesso a sistemas/dados). Exige designação de Diretor de Segurança Cibernética.",aka:"Circular 638 · Segurança Cibernética SUSEP · Circular SUSEP 637"},
  {name:"CNSP",acronym:"Conselho Nacional de Seguros Privados",cat:"susep",def:"Órgão normativo superior do sistema nacional de seguros privados, integrado por ministros e chefes de agências. Responsável por fixar as diretrizes e normas da política de seguros privados. As resoluções do CNSP são regulamentadas por circulares da SUSEP. Exemplos: CNSP Resolução 382/2020 (gestão de riscos), CNSP Resolução 416/2021 (prevenção à lavagem de dinheiro).",aka:"CNSP · Conselho Nacional de Seguros Privados · Resoluções CNSP"},
  // Open Finance e Pagamentos
  {name:"Open Finance",acronym:"",cat:"open",def:"Sistema Financeiro Aberto: ecossistema regulado pelo BACEN e CMN que permite o compartilhamento padronizado de dados financeiros e serviços entre instituições autorizadas, mediante consentimento do cliente. 4 fases: (1) Dados abertos das instituições; (2) Dados de clientes (cadastrais, transacionais); (3) Iniciação de pagamentos; (4) Dados de outros produtos financeiros. Substituiu e ampliou o Open Banking. Base técnica: APIs REST, OAuth 2.0, FAPI.",aka:"Open Finance · Open Banking · SFO · Sistema Financeiro Aberto · FAPI"},
  {name:"PIX",acronym:"",cat:"open",def:"Sistema de pagamento instantâneo criado pelo Banco Central do Brasil, operacional desde novembro de 2020. Opera 24/7, 365 dias. Chaves Pix: CPF/CNPJ, e-mail, celular, chave aleatória. Para TI: integração via API do BACEN (SPI — Sistema de Pagamentos Instantâneos), autenticação via certificados digitais ICP-Brasil, obrigatoriedade de MFA para transações de maior valor. Instituições com >500k clientes ativos são obrigadas a oferecer Pix.",aka:"PIX · Sistema de Pagamentos Instantâneos · SPI · Chaves Pix · DICT"},
  {name:"SPB",acronym:"Sistema de Pagamentos Brasileiro",cat:"open",def:"Conjunto de regras, instrumentos, procedimentos e sistemas integrados para transferir fundos entre agentes econômicos. Componentes: STR (Sistema de Transferência de Reservas — liquidação bruta em tempo real), SILOC (cheques e TEDs), SPI (Pix), CIP. Regulado pelo BACEN, Lei 10.214/2001. Participantes: bancos, fintechs, cooperativas de crédito, instituições de pagamento.",aka:"Sistema de Pagamentos Brasileiro · SPB · STR · SPI · TEF · TED"},
  {name:"Sandbox Regulatório",acronym:"",cat:"open",def:"Ambiente controlado criado por reguladores (BACEN, CVM, SUSEP, ANATEL) para permitir que empresas inovadoras (fintechs, insurtechs) testem produtos e serviços financeiros com clientes reais com menos exigências regulatórias temporárias. Objetivo: fomentar inovação sem abrir mão da proteção ao consumidor. Empresa participante fica isenta de certas obrigações regulatórias por período definido e sob monitoramento intenso.",aka:"Sandbox · Laboratório Regulatório · BACEN Sandbox · SUSEP Sandbox · CVM Sandbox"},
  // ANPD
  {name:"ANPD",acronym:"Autoridade Nacional de Proteção de Dados",cat:"anpd",def:"Órgão da administração pública federal responsável por zelar pela proteção de dados pessoais, fiscalizar o cumprimento da LGPD, editar normas e procedimentos, realizar estudos sobre proteção de dados e fomentar o conhecimento sobre o tema. Poder sancionatório: advertência, multa simples (até 2% do faturamento, limitada a R$ 50 milhões por infração), multa diária, publicização da infração, bloqueio ou eliminação dos dados.",aka:"Autoridade Nacional de Proteção de Dados · ANPD · Fiscalização LGPD · Sanções LGPD"},
  {name:"Relatório de Impacto",acronym:"RIPD",cat:"anpd",def:"Relatório de Impacto à Proteção de Dados Pessoais: documento do controlador que descreve os processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e direitos fundamentais. Exigido pela LGPD (Art. 38) em situações de maior risco: dados sensíveis em larga escala, vigilância sistemática, decisões automatizadas com efeitos legais. Equivalente ao DPIA (Data Protection Impact Assessment) do GDPR.",aka:"RIPD · DPIA · Data Protection Impact Assessment · Art 38 LGPD · Avaliação de Impacto"},
  {name:"Comunicação de Incidente",acronym:"",cat:"anpd",def:"Obrigação prevista no Art. 48 da LGPD: o controlador deve comunicar à ANPD e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares. Prazo definido pela ANPD: 3 dias úteis para notificação inicial à ANPD (Resolução CD/ANPD nº 15/2024). A comunicação deve descrever: natureza dos dados afetados, número de titulares, medidas técnicas adotadas e plano de remediação.",aka:"Notificação de Incidente LGPD · Art 48 LGPD · Breach Notification · Resolução ANPD 15/2024"},
  // Conceitos
  {name:"Programa de Compliance",acronym:"",cat:"concepts",def:"Conjunto de mecanismos e ações internas de uma organização para prevenir, detectar e responder a desvios éticos e violações legais e regulatórias. Pilares (DOJ Guidance): (1) Padrões e procedimentos (código de ética, políticas); (2) Supervisão e recursos (CCO, Comitê de Compliance); (3) Treinamento e comunicação; (4) Monitoramento, auditoria e due diligence; (5) Resposta a problemas (canal de denúncias, investigação, remediação).",aka:"Compliance Program · Programa de Integridade · CCO · Chief Compliance Officer · Canal de Denúncias"},
  {name:"COAF",acronym:"Conselho de Controle de Atividades Financeiras",cat:"concepts",def:"Unidade de inteligência financeira brasileira, vinculada ao Banco Central desde 2019. Responsável por receber, examinar e identificar ocorrências suspeitas de lavagem de dinheiro e financiamento ao terrorismo (LD/FT). Obrigações de reporte (Lei 9.613/1998 e regulamentações setoriais): bancos, seguradoras, corretoras, fintechs, empresas de fomento mercantil. Comunicação de operações suspeitas ao COAF via sistema SISCOAF.",aka:"COAF · Financial Intelligence Unit · FIU · Lavagem de Dinheiro · PLD/FT · SISCOAF"},
  {name:"KYC",acronym:"Know Your Customer",cat:"concepts",def:"Conjunto de procedimentos de identificação e verificação da identidade de clientes usados por instituições financeiras para cumprir regulações de Prevenção à Lavagem de Dinheiro e Financiamento ao Terrorismo (PLD/FT). Componentes: Customer Identification Program (CIP), Customer Due Diligence (CDD), Enhanced Due Diligence (EDD) para clientes de alto risco (PEPs — Pessoas Expostas Politicamente), monitoramento contínuo de transações.",aka:"Know Your Customer · KYC · CDD · PLD · AML · Prevenção à Lavagem de Dinheiro · PEP"},
  {name:"ICP-Brasil",acronym:"Infraestrutura de Chaves Públicas Brasileira",cat:"concepts",def:"Cadeia hierárquica de autoridades certificadoras que viabiliza a emissão de certificados digitais com validade jurídica no Brasil. Regulada pelo ITI (Instituto Nacional de Tecnologia da Informação). Certificados A1 (armazenados em software), A3 (token ou smartcard), A4. Aplicações: assinatura digital de documentos (MP 2.200-2/2001), NF-e, e-CPF, e-CNPJ, NFSe, contratos eletrônicos, integração com Open Finance.",aka:"ICP-Brasil · Certificado Digital · AC Raiz · ITI · e-CPF · e-CNPJ · Assinatura Digital"},
];
TERMS.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
let currentCat='all',currentQ='';
function firstLetter(s){const c=s.trim().toUpperCase()[0];return/[A-Z]/.test(c)?c:'#';}
function render(){
  const q=currentQ.toLowerCase(),cat=currentCat;
  const filtered=TERMS.filter(t=>{
    const matchCat=cat==='all'||t.cat===cat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.acronym||'').toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.aka||'').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('count').textContent=`${filtered.length} termo${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const groups={};
  filtered.forEach(t=>{const l=firstLetter(t.name);if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  document.getElementById('azBar').innerHTML=letters.map(l=>`<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list=document.getElementById('list');list.innerHTML='';
  if(!filtered.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';
  letters.forEach(l=>{
    const grp=document.createElement('div');grp.className='letter-group';grp.id=`grp-${l}`;
    grp.innerHTML=`<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t=>{
      const aka=t.aka?`<div class="card-aka">Também: <span>${t.aka}</span></div>`:'';
      const acr=t.acronym?`<span class="card-acronym">— ${t.acronym}</span>`:'';
      grp.innerHTML+=`<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}
document.getElementById('search').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;render();});
});
render();
</script>
</body>
</html>
