<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Ativos de TI — Referência</title>
<style>
  :root {
    --itam:    #0369a1;
    --cmdb:    #7c3aed;
    --sam:     #d97706;
    --lifecycle:#0f766e;
    --concepts:#374151;
    --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .breadcrumb{background:#fff;border-bottom:1px solid var(--border);padding:.55rem 1.5rem;font-size:.8rem;color:var(--muted);}
  .breadcrumb a{color:var(--itam);text-decoration:none;font-weight:600;}
  .breadcrumb a:hover{text-decoration:underline;}
  header{background:linear-gradient(135deg,#0c2a4a 0%,var(--itam) 100%);color:#fff;padding:2rem 1.5rem 1.5rem;}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
  header p{opacity:.85;margin-top:.4rem;font-size:.95rem;}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.25rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .controls input{flex:1;min-width:200px;padding:.55rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;}
  .controls input:focus{outline:2px solid var(--itam);border-color:transparent;}
  .filter-btn{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .filter-btn:hover{border-color:#94a3b8;}
  .filter-btn.active{color:#fff;border-color:transparent;}
  .filter-btn[data-cat="all"].active      {background:#334155;}
  .filter-btn[data-cat="itam"].active     {background:var(--itam);}
  .filter-btn[data-cat="cmdb"].active     {background:var(--cmdb);}
  .filter-btn[data-cat="sam"].active      {background:var(--sam);}
  .filter-btn[data-cat="lifecycle"].active{background:var(--lifecycle);}
  .filter-btn[data-cat="concepts"].active {background:var(--concepts);}
  main{max-width:900px;margin:0 auto;padding:1.5rem;}
  .letter-group{margin-bottom:2rem;}
  .letter-anchor{font-size:1.3rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;padding-bottom:.3rem;border-bottom:2px solid var(--border);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.65rem;border-left:4px solid #94a3b8;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .card[data-cat="itam"]     {border-left-color:var(--itam);}
  .card[data-cat="cmdb"]     {border-left-color:var(--cmdb);}
  .card[data-cat="sam"]      {border-left-color:var(--sam);}
  .card[data-cat="lifecycle"]{border-left-color:var(--lifecycle);}
  .card[data-cat="concepts"] {border-left-color:var(--concepts);}
  .card-header{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
  .card-name{font-size:1rem;font-weight:700;}
  .card-acronym{font-size:.82rem;color:var(--muted);font-weight:400;}
  .card-tag{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;color:#fff;margin-left:auto;white-space:nowrap;}
  .card[data-cat="itam"]     .card-tag{background:var(--itam);}
  .card[data-cat="cmdb"]     .card-tag{background:var(--cmdb);}
  .card[data-cat="sam"]      .card-tag{background:var(--sam);}
  .card[data-cat="lifecycle"].card-tag{background:var(--lifecycle);}
  .card[data-cat="concepts"] .card-tag{background:var(--concepts);}
  .card-def{font-size:.88rem;color:#334155;line-height:1.55;}
  .card-aka{font-size:.78rem;color:var(--muted);margin-top:.35rem;}
  .card-aka span{font-style:italic;}
  .az-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:1rem 1.5rem .5rem;}
  .az-btn{font-size:.78rem;font-weight:600;padding:.2rem .5rem;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .12s;}
  .az-btn:hover{background:var(--itam);color:#fff;border-color:transparent;}
  #empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted);}
  .count{font-size:.82rem;color:var(--muted);padding:0 1.5rem .5rem;}
</style>
</head>
<body>
<div class="breadcrumb"><a href="../governanca-ti/">← Hub de Governança de TI</a></div>
<header>
  <h1>🖥️ Gestão de Ativos de TI — Referência</h1>
  <p>ITAM · CMDB · SAM · HAM · Ciclo de Vida de Ativos · ISO 19770 · IAITAM</p>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar termo, sigla ou conceito…" autocomplete="off">
  <button class="filter-btn active" data-cat="all">Todos</button>
  <button class="filter-btn" data-cat="itam">ITAM</button>
  <button class="filter-btn" data-cat="cmdb">CMDB e Configuração</button>
  <button class="filter-btn" data-cat="sam">SAM — Licenças de Software</button>
  <button class="filter-btn" data-cat="lifecycle">Ciclo de Vida de Ativos</button>
  <button class="filter-btn" data-cat="concepts">Conceitos e Frameworks</button>
</div>
<div class="az-bar" id="azBar"></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div id="empty">Nenhum termo encontrado.</div>
<script>
const CAT_LABELS={itam:"ITAM",cmdb:"CMDB e Configuração",sam:"SAM — Licenças de Software",lifecycle:"Ciclo de Vida de Ativos",concepts:"Conceitos e Frameworks"};
const TERMS=[
  // ITAM
  {name:"ITAM",acronym:"IT Asset Management",cat:"itam",def:"Gestão de Ativos de TI: conjunto de práticas de negócio para gerenciar o ciclo de vida de ativos de TI da organização, incluindo hardware, software, cloud e outros ativos digitais. Objetivos: maximizar valor dos ativos, controlar custos (evitar over-provisioning), garantir conformidade de licenças, gerenciar riscos e suportar decisões estratégicas. Suportado por ISO 19770 e IAITAM.",aka:"IT Asset Management · Gestão de Ativos de TI · HAM · SAM"},
  {name:"Inventário de Ativos",acronym:"",cat:"itam",def:"Registro completo e atualizado de todos os ativos de TI da organização. Deve conter: identificação única (asset tag), tipo de ativo, fabricante/modelo, número de série, localização, responsável, estado (ativo, em estoque, em manutenção, descartado), datas de aquisição e garantia, custo e valor contábil. Base para: segurança da informação (ISO 27001 Anexo A — 5.9), auditoria, conformidade e planejamento de renovação.",aka:"Asset Inventory · Inventário de Hardware · Asset Register · CMDB"},
  {name:"HAM",acronym:"Hardware Asset Management",cat:"itam",def:"Gestão de Ativos de Hardware: disciplina do ITAM focada em rastrear e gerenciar o ciclo de vida de ativos físicos de TI (computadores, servidores, dispositivos de rede, periféricos, dispositivos móveis). Inclui: recebimento e registro, etiquetagem (asset tag), distribuição, manutenção, controle de localização, garantia e suporte, e descarte seguro (Decommissioning). Suportado por ISO 19770-5.",aka:"Hardware Asset Management · HAM · Gestão de Hardware · ISO 19770-5"},
  {name:"Descoberta de Ativos",acronym:"",cat:"itam",def:"Processo automatizado de identificar ativos de TI conectados à rede. Ferramentas como ServiceNow Discovery, Lansweeper, Tanium, Microsoft SCCM/Intune escaneiam a rede e identificam hardware (IP, MAC address, hostname, OS, especificações) e software instalado. A descoberta alimenta o CMDB e reconcilia com o inventário físico para identificar ativos não gerenciados (shadow IT).",aka:"Asset Discovery · Network Discovery · Lansweeper · ServiceNow Discovery · SCCM"},
  // CMDB
  {name:"CMDB",acronym:"Configuration Management Database",cat:"cmdb",def:"Base de Dados de Gerenciamento de Configuração: repositório que armazena informações sobre Itens de Configuração (CIs) e seus relacionamentos. No ITIL 4, faz parte do Sistema de Gerenciamento de Configuração de Serviço (SCMS). Um CI pode ser: hardware, software, serviço, documento ou qualquer componente que precise ser gerenciado. A CMDB é a 'fonte da verdade' para decisões de mudança, incidente e problema.",aka:"Configuration Management Database · CI · Item de Configuração · SCMS · ServiceNow CMDB"},
  {name:"CI",acronym:"Configuration Item",cat:"cmdb",def:"Item de Configuração: qualquer componente que precisa ser gerenciado para entregar serviços de TI. CIs incluem: hardware (servidores, switches, estações de trabalho), software (aplicações, sistemas operacionais, licenças), serviços de TI, documentação e contratos. Atributos de um CI: identificação única, tipo, proprietário, estado, localização, versão e relacionamentos com outros CIs. Gerenciados no CMDB.",aka:"Configuration Item · Item de Configuração · CI Type · CI Attribute"},
  {name:"CSDM",acronym:"Common Service Data Model",cat:"cmdb",def:"Modelo de dados padrão do ServiceNow que define como estruturar o CMDB alinhado a serviços de negócio. 4 domínios: (1) Build (como o serviço é desenvolvido — aplicações, código); (2) Sell/Consume (como é oferecido — service offerings, contratos); (3) Fulfill (como é entregue — infraestrutura, CIs técnicos); (4) Design (como é concebido — business capabilities, serviços de negócio). Fundamental para implementações bem-sucedidas de CMDB no ServiceNow.",aka:"Common Service Data Model · CSDM · ServiceNow CSDM · CMDB Health"},
  {name:"Reconciliação de CMDB",acronym:"",cat:"cmdb",def:"Processo de comparar os dados do CMDB com fontes de descoberta (scanners, agentes, fontes externas) e fontes autorizadas (contratos, registros de compra) para identificar e corrigir inconsistências. Tipos de discrepâncias: CIs fantasmas (no CMDB mas não encontrados na rede), CIs não gerenciados (encontrados na rede mas não no CMDB), atributos desatualizados. Medido por CMDB Health Score.",aka:"CMDB Reconciliation · CMDB Health · Data Quality · CI Orphans"},
  // SAM
  {name:"SAM",acronym:"Software Asset Management",cat:"sam",def:"Gestão de Ativos de Software: processo de gerenciar e otimizar o ciclo de vida de licenças de software. Objetivos: evitar não-conformidade (uso sem licença — risco de auditoria do fabricante), evitar over-licensing (pagar por mais do que usa) e suportar decisões de renovação. ISO 19770-1 define os requisitos de SAM. Suportado por ferramentas como Snow Software, Flexera, ServiceNow SAM.",aka:"Software Asset Management · SAM · ISO 19770-1 · Snow Software · Flexera"},
  {name:"Auditoria de Software",acronym:"",cat:"sam",def:"Verificação formal conduzida por um fabricante de software (Microsoft, Oracle, SAP, Adobe) ou terceiro autorizado (BSA, KPMG) para verificar se a organização está usando software dentro dos termos de licença. Pode resultar em: compra retroativa de licenças, multas e penalidades contratuais. Fatores de risco: crescimento por fusão/aquisição, virtualização não declarada, uso de software legacy. Preparação: manter inventário atualizado e posição de licença clara.",aka:"Software Audit · License Audit · Microsoft Audit · Oracle Audit · BSA Audit"},
  {name:"Posição de Licença",acronym:"ELP",cat:"sam",def:"Effective License Position: cálculo que compara o que a organização tem direito de usar (licenças adquiridas/subscrições ativas) com o que está realmente usando (descoberta de instalações). ELP positiva: sobra de licenças (over-licensed — custo evitável). ELP negativa: falta de licenças (under-licensed — risco de auditoria e multa). Base para decisões de renovação, upgrade e realocação de licenças.",aka:"Effective License Position · ELP · License Position · Under-licensed · Over-licensed"},
  {name:"SaaS Management",acronym:"",cat:"sam",def:"Gestão de aplicações SaaS (Software as a Service): área emergente do SAM que trata a proliferação de subscrições em nuvem. Desafios: shadow SaaS (apps contratados sem TI central), seats não utilizados, sobreposição de ferramentas com mesma função, renewals automáticos. Plataformas: Zylo, Torii, BetterCloud, Productiv. Integra com SSO (Okta) para medir utilização real.",aka:"SaaS Management Platform · SMP · Shadow SaaS · SaaS Sprawl · Zylo"},
  // Ciclo de Vida
  {name:"Ciclo de Vida de Ativos",acronym:"",cat:"lifecycle",def:"Estágios pelo qual um ativo de TI passa desde a aquisição até o descarte. Estágios: (1) Planejamento (definição de necessidade, orçamento, especificação); (2) Aquisição (compra, recebimento, registro); (3) Implantação (configuração, etiquetagem, entrega ao usuário); (4) Operação (manutenção, suporte, controle); (5) Manutenção (reparos, upgrades, garantia); (6) Descarte (descomissionamento seguro, apagamento de dados, destinação).",aka:"Asset Lifecycle · Hardware Lifecycle · Software Lifecycle · EOL · EOS"},
  {name:"EOL / EOS",acronym:"End of Life / End of Support",cat:"lifecycle",def:"End of Life (EOL): data após a qual o fabricante não disponibiliza mais o produto para venda ou desenvolvimento. End of Support (EOS): data após a qual o fabricante não oferece mais patches de segurança, correções de bug ou suporte técnico. Usar software em EOS é risco de segurança crítico (vulnerabilidades não corrigidas) e risco de conformidade (PCI-DSS, ISO 27001). Mapeado no inventário para planejar substituição com antecedência.",aka:"End of Life · End of Support · EOL · EOS · End of Extended Support"},
  {name:"Decommissioning",acronym:"",cat:"lifecycle",def:"Processo de desativação e descarte seguro de ativos de TI. Etapas: (1) Identificação (ativos EOL, sem uso, substitutos adquiridos); (2) Backup e migração de dados; (3) Revogação de acessos e certificados; (4) Sanitização de dados (apagamento seguro conforme NIST SP 800-88 — purge, clear, destroy; destruição física para dados sensíveis); (5) Remoção do CMDB e inventário; (6) Destinação (revenda, doação, reciclagem ABNT NBR 16156).",aka:"Descomissionamento · Asset Disposal · Data Sanitization · NIST SP 800-88 · ABNT NBR 16156"},
  // Conceitos
  {name:"ISO 19770",acronym:"",cat:"concepts",def:"Família de normas internacionais para Gestão de Ativos de TI: ISO 19770-1 (SAM — requisitos de processo), ISO 19770-2 (Software Identification Tags — SWID tags, formato XML para identificar software), ISO 19770-3 (Entitlements Schema — direitos de licença), ISO 19770-4 (Resource Utilization Measurement), ISO 19770-5 (Visão geral e vocabulário). ISO 19770-1 é a certificável, auditável e complementar ao ISO 27001.",aka:"ISO IEC 19770 · SAM Standard · SWID Tags · ISO 19770-1"},
  {name:"IAITAM",acronym:"International Association of IT Asset Managers",cat:"concepts",def:"Associação profissional de ITAM que define o Body of Knowledge (BOK) para gestão de ativos de TI. Certificações: CHAMP (hardware), CSAM (software), CITAM (gestão geral), CAMSE (executivo). O IAITAM BOK abrange 14 áreas de processo de ITAM, incluindo: policy, financial, vendor, contract, compliance, security, mobile asset, service e communication management.",aka:"IAITAM · CHAMP · CSAM · CITAM · ITAM BOK"},
  {name:"Shadow IT",acronym:"",cat:"concepts",def:"Uso de sistemas, dispositivos, software, aplicativos ou serviços de TI sem aprovação explícita do departamento de TI. Exemplos: uso de Dropbox pessoal para arquivos corporativos, contratar ferramentas SaaS via cartão corporativo sem aprovação, usar dispositivos pessoais para acessar sistemas corporativos. Riscos: vazamento de dados, não-conformidade LGPD, vulnerabilidades de segurança. Detectado por: gateway de rede, Cloud Access Security Broker (CASB), Discovery.",aka:"Shadow IT · Shadow SaaS · Rogue IT · Unsanctioned IT"},
];
TERMS.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
let currentCat='all',currentQ='';
function firstLetter(s){const c=s.trim().toUpperCase()[0];return/[A-Z]/.test(c)?c:'#';}
function render(){
  const q=currentQ.toLowerCase(),cat=currentCat;
  const filtered=TERMS.filter(t=>{
    const matchCat=cat==='all'||t.cat===cat;
    const matchQ=!q||t.name.toLowerCase().includes(q)||(t.acronym||'').toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.aka||'').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('count').textContent=`${filtered.length} termo${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;
  const groups={};
  filtered.forEach(t=>{const l=firstLetter(t.name);if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  document.getElementById('azBar').innerHTML=letters.map(l=>`<a class="az-btn" href="#grp-${l}">${l}</a>`).join('');
  const list=document.getElementById('list');list.innerHTML='';
  if(!filtered.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';
  letters.forEach(l=>{
    const grp=document.createElement('div');grp.className='letter-group';grp.id=`grp-${l}`;
    grp.innerHTML=`<div class="letter-anchor">${l}</div>`;
    groups[l].forEach(t=>{
      const aka=t.aka?`<div class="card-aka">Também: <span>${t.aka}</span></div>`:'';
      const acr=t.acronym?`<span class="card-acronym">— ${t.acronym}</span>`:'';
      grp.innerHTML+=`<div class="card" data-cat="${t.cat}"><div class="card-header"><span class="card-name">${t.name}</span>${acr}<span class="card-tag">${CAT_LABELS[t.cat]}</span></div><div class="card-def">${t.def}</div>${aka}</div>`;
    });
    list.appendChild(grp);
  });
}
document.getElementById('search').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=btn.dataset.cat;render();});
});
render();
</script>
</body>
</html>
