<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calculadora de Alcance e Budget | NC Tool</title>
<style>
:root{--navy:#0D2137;--navy2:#1A3F63;--accent:#38BDF8;--bg:#F0F4F8;--surface:#fff;--border:#DDE3EC;--text:#0D2137;--mid:#4A5568;--light:#8B9BBF;--green:#10B981;--yellow:#F59E0B;--red:#EF4444;--blue:#2563EB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:center;height:56px;gap:12px}
.logo{color:#fff;font-size:15px;font-weight:700}.logo span{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:680px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:sticky;top:76px}
.panel h3{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--light);margin-bottom:14px}
.form-g{margin-bottom:12px}
.form-g label{font-size:11px;font-weight:600;color:var(--mid);display:block;margin-bottom:3px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);outline:none;font-family:inherit;transition:border-color .15s}
input:focus,select:focus{border-color:var(--blue)}
.sep{height:1px;background:var(--border);margin:12px 0}
.btn-calc{width:100%;padding:10px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-calc:hover{background:#1D4ED8}
.btn-clear{width:100%;padding:7px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px}

.result-col{display:flex;flex-direction:column;gap:14px}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-val{font-size:22px;font-weight:900;color:var(--navy);line-height:1}
.kpi-key{font-size:10px;font-weight:600;color:var(--light);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}

.scenarios-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.scenarios-card h4{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--light);padding:12px 16px;background:#F8FAFC;border-bottom:1px solid var(--border)}
.scen-table{width:100%;border-collapse:collapse;font-size:12px}
.scen-table th{padding:6px 12px;background:#F0F4F8;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--light);text-align:left}
.scen-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.scen-table tr:last-child td{border-bottom:none}
.scen-table tr.highlight{background:#EFF6FF}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}

.cpm-ref{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cpm-ref h4{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--light);padding:12px 16px;background:#F8FAFC;border-bottom:1px solid var(--border)}

.empty-state{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:48px;text-align:center;color:var(--light)}

footer{text-align:center;color:var(--light);font-size:11px;padding:16px;grid-column:1/-1}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Calculadora de <span>Alcance & Budget</span></div>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <h3>Parâmetros</h3>

    <div class="form-g">
      <label>Canal / Ambiente</label>
      <select id="canal" onchange="updateCPM()">
        <option value="social_feed">Social — Feed (Meta, Instagram)</option>
        <option value="social_stories">Social — Stories / Reels</option>
        <option value="display_prog">Display Programático (Open)</option>
        <option value="display_pmp">Display Programático (PMP)</option>
        <option value="video_yt">Video — YouTube</option>
        <option value="video_ctv">Video — CTV / Streaming</option>
        <option value="search">Search (Google/Bing)</option>
        <option value="tiktok">TikTok Ads</option>
        <option value="linkedin">LinkedIn Ads</option>
        <option value="ooh">OOH Digital</option>
      </select>
    </div>

    <div class="form-g">
      <label>CPM estimado (R$)</label>
      <input type="number" id="cpm" step="0.01" placeholder="Ex: 12.00" oninput="calc()">
      <p style="font-size:10px;color:var(--light);margin-top:3px" id="cpm-hint">Referência para o canal selecionado</p>
    </div>

    <div class="form-g">
      <label>Frequência média esperada (x)</label>
      <input type="number" id="freq" value="3" min="1" step="0.1" oninput="calc()">
    </div>

    <div class="sep"></div>

    <p style="font-size:11px;color:var(--light);margin-bottom:10px">Preencha <b>dois</b> dos três campos abaixo:</p>

    <div class="form-g">
      <label>Budget (R$)</label>
      <input type="number" id="budget" placeholder="Ex: 50000" oninput="calc('budget')">
    </div>
    <div class="form-g">
      <label>Alcance único (pessoas)</label>
      <input type="number" id="alcance" placeholder="Ex: 1000000" oninput="calc('alcance')">
    </div>
    <div class="form-g">
      <label>Impressões</label>
      <input type="number" id="impressoes" placeholder="Ex: 3000000" oninput="calc('impressoes')">
    </div>

    <button class="btn-calc" onclick="calc()">📐 Calcular</button>
    <button class="btn-clear" onclick="clearAll()">↺ Limpar</button>
  </div>

  <!-- RESULTS -->
  <div class="result-col" id="result-col">
    <div class="empty-state">Configure os parâmetros para calcular alcance e budget</div>
  </div>

  <footer><a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none">← Projeto NC</a></footer>
</div>

<script>
const CPM_REF = {
  social_feed:  {min:8, avg:15, max:30, label:'Social Feed'},
  social_stories:{min:6,avg:12,max:25, label:'Social Stories'},
  display_prog: {min:2, avg:7,  max:15, label:'Display Programático Open'},
  display_pmp:  {min:8, avg:18, max:40, label:'Display PMP'},
  video_yt:     {min:10,avg:20, max:45, label:'YouTube'},
  video_ctv:    {min:20,avg:35, max:80, label:'CTV / Streaming'},
  search:       {min:1, avg:4,  max:12, label:'Search (CPC→CPM equiv.)'},
  tiktok:       {min:8, avg:18, max:40, label:'TikTok Ads'},
  linkedin:     {min:30,avg:55, max:120,label:'LinkedIn Ads'},
  ooh:          {min:5, avg:12, max:30, label:'OOH Digital'},
};

function updateCPM(){
  const canal = document.getElementById('canal').value;
  const ref = CPM_REF[canal];
  document.getElementById('cpm').value = ref.avg;
  document.getElementById('cpm-hint').textContent = `Benchmark: R$ ${ref.min}–${ref.max} | Avg: R$ ${ref.avg}`;
  calc();
}

function fmtN(n){if(n>=1e6)return(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.?0+$/,'')+'K';return Math.round(n).toLocaleString('pt-BR')}
function fmtR(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function calc(changed){
  const cpm    = parseFloat(document.getElementById('cpm').value)||0;
  const freq   = parseFloat(document.getElementById('freq').value)||1;
  let budget    = parseFloat(document.getElementById('budget').value)||0;
  let alcance   = parseFloat(document.getElementById('alcance').value)||0;
  let impressoes = parseFloat(document.getElementById('impressoes').value)||0;

  if(!cpm) return;

  // Solve for missing field
  // imp = alcance * freq
  // budget = imp / 1000 * cpm
  if(budget && alcance && !impressoes){
    impressoes = alcance * freq;
    document.getElementById('impressoes').value = Math.round(impressoes);
  } else if(budget && impressoes && !alcance){
    alcance = impressoes / freq;
    document.getElementById('alcance').value = Math.round(alcance);
  } else if(alcance && impressoes && !budget){
    budget = impressoes / 1000 * cpm;
    document.getElementById('budget').value = budget.toFixed(2);
  } else if(budget && !alcance && !impressoes){
    impressoes = budget / cpm * 1000;
    alcance = impressoes / freq;
    document.getElementById('impressoes').value = Math.round(impressoes);
    document.getElementById('alcance').value = Math.round(alcance);
  } else if(alcance && !budget && !impressoes){
    impressoes = alcance * freq;
    budget = impressoes / 1000 * cpm;
    document.getElementById('impressoes').value = Math.round(impressoes);
    document.getElementById('budget').value = budget.toFixed(2);
  } else if(impressoes && !budget && !alcance){
    budget = impressoes / 1000 * cpm;
    alcance = impressoes / freq;
    document.getElementById('budget').value = budget.toFixed(2);
    document.getElementById('alcance').value = Math.round(alcance);
  }

  if(!budget||!alcance||!impressoes) return;

  const canal = document.getElementById('canal').value;
  const ref = CPM_REF[canal];
  const budgetPerPerson = budget / alcance;
  const cpmActual = budget / impressoes * 1000;

  // Scenarios: freq 1x, 3x, 5x, 7x — and budget ×0.5, ×1, ×2
  const scen = [
    {label:'Budget ×0.5',  bud:budget*.5,  alcance:budget*.5/cpmActual*1000/freq, imp:budget*.5/cpmActual*1000},
    {label:'Atual',        bud:budget,      alcance:alcance,                        imp:impressoes, highlight:true},
    {label:'Budget ×1.5',  bud:budget*1.5,  alcance:budget*1.5/cpmActual*1000/freq, imp:budget*1.5/cpmActual*1000},
    {label:'Budget ×2',    bud:budget*2,    alcance:budget*2/cpmActual*1000/freq,   imp:budget*2/cpmActual*1000},
  ];

  document.getElementById('result-col').innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val">${fmtR(budget)}</div><div class="kpi-key">Budget</div></div>
      <div class="kpi"><div class="kpi-val">${fmtN(Math.round(alcance))}</div><div class="kpi-key">Alcance único</div></div>
      <div class="kpi"><div class="kpi-val">${fmtN(Math.round(impressoes))}</div><div class="kpi-key">Impressões</div></div>
      <div class="kpi"><div class="kpi-val">${freq.toFixed(1)}x</div><div class="kpi-key">Frequência</div></div>
      <div class="kpi"><div class="kpi-val">${fmtR(cpmActual)}</div><div class="kpi-key">CPM efetivo</div></div>
      <div class="kpi"><div class="kpi-val">${fmtR(budgetPerPerson)}</div><div class="kpi-key">Custo por pessoa</div></div>
    </div>

    <div class="scenarios-card">
      <h4>Cenários de Budget × Alcance</h4>
      <table class="scen-table">
        <thead><tr><th>Cenário</th><th>Budget</th><th>Impressões</th><th>Alcance único</th><th>Freq.</th></tr></thead>
        <tbody>
          ${scen.map(s=>`<tr${s.highlight?' class="highlight"':''}>
            <td>${s.highlight?'<b>'+s.label+' ★</b>':s.label}</td>
            <td>${fmtR(s.bud)}</td>
            <td>${fmtN(Math.round(s.imp))}</td>
            <td>${fmtN(Math.round(s.alcance))}</td>
            <td>${freq.toFixed(1)}x</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="cpm-ref">
      <h4>Benchmark de CPM — ${ref.label}</h4>
      <div style="padding:14px 16px">
        <div style="display:flex;gap:12px;margin-bottom:10px">
          <div style="flex:1;background:var(--bg);border-radius:8px;padding:12px">
            <div style="font-size:18px;font-weight:800;color:var(--green)">R$ ${ref.min}</div>
            <div style="font-size:10px;color:var(--light);font-weight:700;text-transform:uppercase;margin-top:2px">CPM mínimo</div>
          </div>
          <div style="flex:1;background:var(--bg);border-radius:8px;padding:12px;border:2px solid var(--blue)">
            <div style="font-size:18px;font-weight:800;color:var(--blue)">R$ ${ref.avg}</div>
            <div style="font-size:10px;color:var(--light);font-weight:700;text-transform:uppercase;margin-top:2px">CPM médio</div>
          </div>
          <div style="flex:1;background:var(--bg);border-radius:8px;padding:12px">
            <div style="font-size:18px;font-weight:800;color:var(--yellow)">R$ ${ref.max}</div>
            <div style="font-size:10px;color:var(--light);font-weight:700;text-transform:uppercase;margin-top:2px">CPM máximo</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--mid);line-height:1.7">
          ${cpmActual < ref.min ? '✅ CPM abaixo do mínimo de benchmark — ótima eficiência ou audiência muito ampla.' :
            cpmActual <= ref.avg ? '✅ CPM dentro da faixa saudável para o canal.' :
            cpmActual <= ref.max ? '⚠️ CPM acima da média — validar se targeting está muito restrito.' :
            '❌ CPM acima do benchmark máximo — revisar segmentação ou negociação.'}
        </div>
      </div>
    </div>
  `;
}

function clearAll(){
  ['budget','alcance','impressoes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('result-col').innerHTML='<div class="empty-state">Configure os parâmetros para calcular alcance e budget</div>';
}

// Init
updateCPM();
</script>
</body>
</html>
