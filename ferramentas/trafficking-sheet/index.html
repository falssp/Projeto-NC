<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trafficking Sheet Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#1a237e;
  --blue:#1F36C7;
  --hl:#e8ecfd;
  --border:#d6dbf2;
  --bg:#f4f5fb;
  --white:#fff;
  --text:#1a237e;
  --body:#3d4a8a;
  --muted:#9fa8da;
  --red:#dc2626;
  --green:#059669;
}

body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header .logo{font-size:1.1rem;font-weight:700;letter-spacing:-.5px}
header .sub{font-size:.78rem;color:#9fa8da;margin-left:auto}

/* MODE TOGGLE */
.mode-bar{background:var(--white);border-bottom:2px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.mode-bar label{font-size:.82rem;font-weight:600;color:var(--muted)}
.mode-btn{padding:7px 18px;border-radius:6px;border:2px solid var(--border);background:var(--white);color:var(--body);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.mode-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* MAIN SPLIT */
.main{display:flex;flex:1;overflow:hidden;min-height:0}

/* LEFT FORM PANEL */
.form-panel{width:50%;border-right:2px solid var(--border);overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}

/* RIGHT PREVIEW PANEL */
.preview-panel{width:50%;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}

/* SECTION CARD */
.card{background:var(--white);border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.card-header{background:var(--hl);padding:10px 16px;font-size:.8rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--border)}
.card-body{padding:16px}

/* FORM GRID */
.fg{display:grid;gap:12px}
.fg-2{grid-template-columns:1fr 1fr}
.fg-3{grid-template-columns:1fr 1fr 1fr}

label.lbl{font-size:.78rem;font-weight:600;color:var(--body);display:block;margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;
  font-family:inherit;font-size:.82rem;color:var(--text);background:var(--white);outline:none;
  transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:52px}

/* PLACEMENT TABLE */
.placement-wrap{overflow-x:auto}
table.pt{width:100%;border-collapse:collapse;font-size:.75rem;min-width:900px}
table.pt th{background:var(--hl);padding:7px 8px;text-align:left;font-weight:700;color:var(--navy);border:1px solid var(--border);white-space:nowrap}
table.pt td{padding:4px 5px;border:1px solid var(--border);vertical-align:top}
table.pt td input,table.pt td select,table.pt td textarea{border:none;background:transparent;padding:3px 4px;width:100%;font-size:.75rem;min-width:60px}
table.pt td input:focus,table.pt td select:focus,table.pt td textarea:focus{background:var(--hl);border-radius:3px;outline:1px solid var(--blue)}
table.pt .num-cell{background:var(--hl);text-align:center;font-weight:700;color:var(--muted);width:28px}
table.pt .del-cell{text-align:center;width:28px}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1}
.del-btn:hover{color:#991b1b}

.add-btn{margin-top:10px;padding:8px 16px;background:var(--hl);border:1.5px dashed var(--blue);border-radius:6px;color:var(--blue);font-weight:600;font-size:.8rem;cursor:pointer;width:100%;font-family:inherit;transition:all .15s}
.add-btn:hover{background:var(--blue);color:#fff;border-style:solid}

/* PREVIEW */
.preview-header{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:16px}
.preview-header h2{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.preview-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.preview-meta .m{font-size:.78rem;color:var(--body)}
.preview-meta .m span{font-weight:600;color:var(--navy)}

.preview-table-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.preview-table-wrap h3{padding:10px 16px;font-size:.8rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;background:var(--hl);border-bottom:1.5px solid var(--border)}
.preview-table-wrap .pt-wrap{overflow-x:auto}
table.prev{width:100%;border-collapse:collapse;font-size:.72rem}
table.prev th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;white-space:nowrap;font-weight:600}
table.prev td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:top}
table.prev tr:nth-child(even) td{background:#f8f9ff}
table.prev tr:last-child td{border-bottom:none}
.empty-row td{text-align:center;color:var(--muted);font-style:italic;padding:20px!important}

.preview-summary{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:14px 16px}
.preview-summary h3{font-size:.8rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum-item{background:var(--hl);border-radius:8px;padding:10px 12px;text-align:center}
.sum-item .sv{font-size:1.1rem;font-weight:700;color:var(--blue)}
.sum-item .sk{font-size:.72rem;color:var(--body);margin-top:2px}

.preview-footer{font-size:.7rem;color:var(--muted);text-align:center;padding:8px}

/* ACTION BUTTONS */
.action-bar{display:flex;gap:10px;flex-wrap:wrap}
.btn-copy,.btn-csv{padding:9px 18px;border-radius:7px;border:none;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-copy{background:var(--blue);color:#fff}
.btn-copy:hover{background:var(--navy)}
.btn-csv{background:var(--white);color:var(--blue);border:1.5px solid var(--blue)}
.btn-csv:hover{background:var(--hl)}
.copy-ok{font-size:.78rem;color:var(--green);font-weight:600;align-self:center;display:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:900px){
  .main{flex-direction:column}
  .form-panel,.preview-panel{width:100%;border-right:none}
  .form-panel{border-bottom:2px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <span class="logo">📋 Trafficking Sheet Generator</span>
  <span class="sub">AdOps Suite</span>
</header>

<div class="mode-bar">
  <label>Modo:</label>
  <button class="mode-btn active" id="modeDisplay" onclick="setMode('display')">🖼 Display / Social</button>
  <button class="mode-btn" id="modeAdServer" onclick="setMode('adserver')">⚙️ Ad Server (CM360)</button>
</div>

<div class="main">

  <!-- LEFT: FORM -->
  <div class="form-panel">

    <div class="card">
      <div class="card-header">📌 Informações Gerais</div>
      <div class="card-body">
        <div class="fg fg-2">
          <div>
            <label class="lbl">Cliente / Anunciante</label>
            <input type="text" id="cliente" placeholder="Ex: Unilever Brasil" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Campanha</label>
            <input type="text" id="campanha" placeholder="Ex: Dove — Q4 2026" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Produto / Marca</label>
            <input type="text" id="produto" placeholder="Ex: Dove Body Wash" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Responsável</label>
            <input type="text" id="responsavel" placeholder="Ex: Felipe Lima" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Data Início</label>
            <input type="date" id="dataInicio" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Data Fim</label>
            <input type="date" id="dataFim" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Budget Total (R$)</label>
            <input type="number" id="budgetTotal" placeholder="0.00" min="0" step="0.01" oninput="updatePreview()">
          </div>
          <div>
            <label class="lbl">Data de Emissão</label>
            <input type="date" id="dataEmissao" oninput="updatePreview()">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">🗂 Placements</div>
      <div class="card-body">
        <div class="placement-wrap">
          <table class="pt" id="placementsTable">
            <thead id="placementHead"></thead>
            <tbody id="placementBody"></tbody>
          </table>
        </div>
        <button class="add-btn" onclick="addRow()">+ Adicionar Placement</button>
      </div>
    </div>

  </div>

  <!-- RIGHT: PREVIEW -->
  <div class="preview-panel">

    <div class="action-bar">
      <button class="btn-copy" onclick="copyTable()">📋 Copiar tabela</button>
      <button class="btn-csv" onclick="downloadCSV()">⬇ Baixar CSV</button>
      <span class="copy-ok" id="copyOk">✔ Copiado!</span>
    </div>

    <div class="preview-header">
      <h2>Trafficking Sheet</h2>
      <div class="preview-meta" id="previewMeta"></div>
    </div>

    <div class="preview-table-wrap">
      <h3>Placements</h3>
      <div class="pt-wrap">
        <table class="prev" id="previewTable">
          <thead id="previewHead"></thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </div>

    <div class="preview-summary" id="previewSummary"></div>

    <div class="preview-footer">Documento gerado por NC Tool — AdOps Suite</div>

  </div>
</div>

<script>
let mode = 'display';
let rows = [];
let rowId = 0;

const PLATS = ['Meta Ads','Google Ads','DV360','LinkedIn','TikTok','X Ads','Display Direto','Outro'];
const TAG_TYPES = ['iFrame','JavaScript','VAST In-Stream','VAST Companion','Click Tracker','Impression Tracker'];
const ROTATIONS = ['Even','Optimized','Sequential','Custom'];
const STATUSES = ['Pendente','Enviado ao Publisher','Implementado','Testado ✅'];

function setMode(m){
  mode = m;
  document.getElementById('modeDisplay').classList.toggle('active', m==='display');
  document.getElementById('modeAdServer').classList.toggle('active', m==='adserver');
  renderTableHead();
  rows.forEach(r => renderRow(r.id));
  updatePreview();
}

function fmt(n){ return n ? Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; }
function fmtImp(n){ return n ? Number(n).toLocaleString('pt-BR') : '—'; }
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }

const displayCols = ['#','Plataforma','Placement / Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Observações',''];
const adsCols = ['#','Plataforma','Site / Publisher','Placement / Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Tipo de Tag','Tag URL / Código','Floodlight Activity','Creative ID','Rotation','Status','Observações',''];

function renderTableHead(){
  const cols = mode==='display' ? displayCols : adsCols;
  document.getElementById('placementHead').innerHTML =
    '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
}

function addRow(){
  const id = ++rowId;
  rows.push({id});
  renderRow(id);
  updatePreview();
}

function removeRow(id){
  rows = rows.filter(r=>r.id!==id);
  document.getElementById(`row-${id}`)?.remove();
  renumberRows();
  updatePreview();
}

function renumberRows(){
  document.querySelectorAll('.row-num').forEach((el,i)=>{ el.textContent=i+1; });
}

function getVal(id){ return (document.getElementById(id)||{}).value||''; }

function renderRow(id){
  const tbody = document.getElementById('placementBody');
  let tr = document.getElementById(`row-${id}`);
  const isNew = !tr;
  if(isNew){ tr = document.createElement('tr'); tr.id=`row-${id}`; }

  const def_inicio = getVal('dataInicio');
  const def_fim = getVal('dataFim');
  const periodo_def = def_inicio&&def_fim ? `${fmtDate(def_inicio)} a ${fmtDate(def_fim)}` : '';

  const platOpts = PLATS.map(p=>`<option>${p}</option>`).join('');

  let cells = `
    <td class="num-cell"><span class="row-num">${rows.findIndex(r=>r.id===id)+1}</span></td>
    <td><select onchange="updatePreview()" id="p_plat_${id}">${platOpts}</select></td>`;

  if(mode==='adserver'){
    cells += `<td><input type="text" placeholder="publisher.com.br" onchange="updatePreview()" id="p_site_${id}"></td>`;
  }

  cells += `
    <td><input type="text" placeholder="Feed Mobile" oninput="updatePreview()" id="p_pos_${id}"></td>
    <td><input type="text" placeholder="Vídeo 15s" oninput="updatePreview()" id="p_fmt_${id}"></td>
    <td><input type="text" placeholder="1080×1080" oninput="updatePreview()" id="p_dim_${id}"></td>
    <td><input type="text" value="${periodo_def}" oninput="updatePreview()" id="p_per_${id}"></td>
    <td><input type="number" placeholder="0" min="0" oninput="calcInvest(${id})" id="p_imp_${id}" style="min-width:80px"></td>
    <td><input type="number" placeholder="0.00" min="0" step="0.01" oninput="calcInvest(${id})" id="p_cpm_${id}" style="min-width:60px"></td>
    <td><input type="number" placeholder="0.00" min="0" step="0.01" oninput="updatePreview()" id="p_inv_${id}" style="min-width:70px"></td>
    <td><input type="text" placeholder="criativo_v1" oninput="updatePreview()" id="p_cri_${id}"></td>
    <td><input type="text" placeholder="https://..." oninput="updatePreview()" id="p_url_${id}" style="min-width:120px"></td>
    <td><input type="text" placeholder="utm_source=..." oninput="updatePreview()" id="p_utm_${id}" style="min-width:100px"></td>`;

  if(mode==='adserver'){
    const tagOpts = TAG_TYPES.map(t=>`<option>${t}</option>`).join('');
    const rotOpts = ROTATIONS.map(r=>`<option>${r}</option>`).join('');
    const stOpts = STATUSES.map(s=>`<option>${s}</option>`).join('');
    cells += `
      <td><select onchange="updatePreview()" id="p_tag_${id}">${tagOpts}</select></td>
      <td><textarea placeholder="https://ad.doubleclick.net/..." oninput="updatePreview()" id="p_tagcode_${id}" style="min-width:140px;min-height:38px;font-size:.7rem"></textarea></td>
      <td><input type="text" placeholder="FL_Compra" oninput="updatePreview()" id="p_fl_${id}"></td>
      <td><input type="text" placeholder="123456789" oninput="updatePreview()" id="p_crid_${id}"></td>
      <td><select onchange="updatePreview()" id="p_rot_${id}">${rotOpts}</select></td>
      <td><select onchange="updatePreview()" id="p_st_${id}">${stOpts}</select></td>`;
  }

  cells += `
    <td><input type="text" placeholder="obs..." oninput="updatePreview()" id="p_obs_${id}"></td>
    <td class="del-cell"><button class="del-btn" onclick="removeRow(${id})" title="Remover">×</button></td>`;

  tr.innerHTML = cells;
  if(isNew) tbody.appendChild(tr);
}

function calcInvest(id){
  const imp = parseFloat(document.getElementById(`p_imp_${id}`)?.value||0);
  const cpm = parseFloat(document.getElementById(`p_cpm_${id}`)?.value||0);
  if(imp && cpm){
    const inv = (imp * cpm / 1000);
    const el = document.getElementById(`p_inv_${id}`);
    if(el) el.value = inv.toFixed(2);
  }
  updatePreview();
}

function getRowData(id){
  const g = k => (document.getElementById(k)||{}).value||'';
  return {
    plat: g(`p_plat_${id}`),
    site: g(`p_site_${id}`),
    pos: g(`p_pos_${id}`),
    fmt: g(`p_fmt_${id}`),
    dim: g(`p_dim_${id}`),
    per: g(`p_per_${id}`),
    imp: g(`p_imp_${id}`),
    cpm: g(`p_cpm_${id}`),
    inv: g(`p_inv_${id}`),
    cri: g(`p_cri_${id}`),
    url: g(`p_url_${id}`),
    utm: g(`p_utm_${id}`),
    tag: g(`p_tag_${id}`),
    tagcode: g(`p_tagcode_${id}`),
    fl: g(`p_fl_${id}`),
    crid: g(`p_crid_${id}`),
    rot: g(`p_rot_${id}`),
    st: g(`p_st_${id}`),
    obs: g(`p_obs_${id}`)
  };
}

function updatePreview(){
  const cliente = getVal('cliente');
  const campanha = getVal('campanha');
  const produto = getVal('produto');
  const resp = getVal('responsavel');
  const inicio = getVal('dataInicio');
  const fim = getVal('dataFim');
  const budget = getVal('budgetTotal');
  const emissao = getVal('dataEmissao');

  // META
  const meta = document.getElementById('previewMeta');
  meta.innerHTML = `
    <div class="m">Cliente: <span>${cliente||'—'}</span></div>
    <div class="m">Campanha: <span>${campanha||'—'}</span></div>
    <div class="m">Produto / Marca: <span>${produto||'—'}</span></div>
    <div class="m">Responsável: <span>${resp||'—'}</span></div>
    <div class="m">Período: <span>${inicio&&fim ? fmtDate(inicio)+' a '+fmtDate(fim) : '—'}</span></div>
    <div class="m">Budget Total: <span>R$ ${budget ? fmt(budget) : '—'}</span></div>
    <div class="m">Emissão: <span>${emissao ? fmtDate(emissao) : '—'}</span></div>`;

  // TABLE HEAD
  const cols = mode==='display'
    ? ['#','Plataforma','Posição','Formato','Dimensões','Período','Impressões','CPM','Investimento','Criativo','URL','UTM','Obs']
    : ['#','Plataforma','Publisher','Posição','Formato','Dim','Período','Impressões','CPM','Investimento','Criativo','URL','UTM','Tipo Tag','Tag','Floodlight','Creative ID','Rotation','Status','Obs'];

  document.getElementById('previewHead').innerHTML =
    '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';

  // TABLE BODY
  const tbody = document.getElementById('previewBody');
  if(!rows.length){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${cols.length}">Nenhum placement adicionado</td></tr>`;
  } else {
    tbody.innerHTML = rows.map((r,i)=>{
      const d = getRowData(r.id);
      let cells = mode==='display'
        ? [i+1,d.plat,d.pos,d.fmt,d.dim,d.per,d.imp?fmtImp(d.imp):'—',d.cpm?'R$ '+fmt(d.cpm):'—',d.inv?'R$ '+fmt(d.inv):'—',d.cri,d.url,d.utm,d.obs]
        : [i+1,d.plat,d.site,d.pos,d.fmt,d.dim,d.per,d.imp?fmtImp(d.imp):'—',d.cpm?'R$ '+fmt(d.cpm):'—',d.inv?'R$ '+fmt(d.inv):'—',d.cri,d.url,d.utm,d.tag,d.tagcode?'✓ Tag':'—',d.fl,d.crid,d.rot,d.st,d.obs];
      return '<tr>'+cells.map(c=>`<td>${c||'—'}</td>`).join('')+'</tr>';
    }).join('');
  }

  // SUMMARY
  const totalImp = rows.reduce((s,r)=>{ const v=parseFloat((document.getElementById(`p_imp_${r.id}`)||{}).value||0); return s+v; },0);
  const totalInv = rows.reduce((s,r)=>{ const v=parseFloat((document.getElementById(`p_inv_${r.id}`)||{}).value||0); return s+v; },0);
  document.getElementById('previewSummary').innerHTML = `
    <h3>Resumo</h3>
    <div class="sum-grid">
      <div class="sum-item"><div class="sv">${rows.length}</div><div class="sk">Placements</div></div>
      <div class="sum-item"><div class="sv">${fmtImp(totalImp)||'0'}</div><div class="sk">Impressões Est.</div></div>
      <div class="sum-item"><div class="sv">R$ ${fmt(totalInv)}</div><div class="sk">Investimento Total</div></div>
    </div>`;
}

function copyTable(){
  const cols = mode==='display'
    ? ['#','Plataforma','Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Observações']
    : ['#','Plataforma','Site/Publisher','Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Tipo de Tag','Tag','Floodlight Activity','Creative ID','Rotation','Status','Observações'];

  const header = [
    `TRAFFICKING SHEET`,
    `Cliente: ${getVal('cliente')}\tCampanha: ${getVal('campanha')}`,
    `Produto: ${getVal('produto')}\tResponsável: ${getVal('responsavel')}`,
    `Período: ${getVal('dataInicio')&&getVal('dataFim')?fmtDate(getVal('dataInicio'))+' a '+fmtDate(getVal('dataFim')):'—'}\tBudget Total: R$ ${fmt(getVal('budgetTotal'))}`,
    `Emissão: ${getVal('dataEmissao')?fmtDate(getVal('dataEmissao')):'—'}`,
    '',
    cols.join('\t')
  ];

  const dataRows = rows.map((r,i)=>{
    const d = getRowData(r.id);
    return mode==='display'
      ? [i+1,d.plat,d.pos,d.fmt,d.dim,d.per,d.imp,d.cpm,d.inv,d.cri,d.url,d.utm,d.obs].join('\t')
      : [i+1,d.plat,d.site,d.pos,d.fmt,d.dim,d.per,d.imp,d.cpm,d.inv,d.cri,d.url,d.utm,d.tag,d.tagcode,d.fl,d.crid,d.rot,d.st,d.obs].join('\t');
  });

  const totalImp = rows.reduce((s,r)=>s+parseFloat((document.getElementById(`p_imp_${r.id}`)||{}).value||0),0);
  const totalInv = rows.reduce((s,r)=>s+parseFloat((document.getElementById(`p_inv_${r.id}`)||{}).value||0),0);

  const footer = ['',`Total Placements: ${rows.length}\tTotal Impressões: ${fmtImp(totalImp)}\tTotal Investimento: R$ ${fmt(totalInv)}`,'','Documento gerado por NC Tool — AdOps Suite'];

  navigator.clipboard.writeText([...header,...dataRows,...footer].join('\n')).then(()=>{
    const el = document.getElementById('copyOk');
    el.style.display='inline';
    setTimeout(()=>el.style.display='none',2000);
  });
}

function downloadCSV(){
  const cols = mode==='display'
    ? ['#','Plataforma','Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Observações']
    : ['#','Plataforma','Site/Publisher','Posição','Formato','Dimensões','Período','Impressões Est.','CPM (R$)','Investimento (R$)','Criativo','URL de Destino','UTM','Tipo de Tag','Tag URL/Código','Floodlight Activity','Creative ID','Rotation','Status','Observações'];

  const esc = v => `"${String(v).replace(/"/g,'""')}"`;

  const header = [
    ['TRAFFICKING SHEET'].map(esc).join(','),
    ['Cliente',getVal('cliente'),'Campanha',getVal('campanha')].map(esc).join(','),
    ['Produto',getVal('produto'),'Responsável',getVal('responsavel')].map(esc).join(','),
    ['Período',getVal('dataInicio')&&getVal('dataFim')?fmtDate(getVal('dataInicio'))+' a '+fmtDate(getVal('dataFim')):'—','Budget Total','R$ '+fmt(getVal('budgetTotal'))].map(esc).join(','),
    ['Emissão',getVal('dataEmissao')?fmtDate(getVal('dataEmissao')):'—'].map(esc).join(','),
    '',
    cols.map(esc).join(',')
  ];

  const dataRows = rows.map((r,i)=>{
    const d = getRowData(r.id);
    return (mode==='display'
      ? [i+1,d.plat,d.pos,d.fmt,d.dim,d.per,d.imp,d.cpm,d.inv,d.cri,d.url,d.utm,d.obs]
      : [i+1,d.plat,d.site,d.pos,d.fmt,d.dim,d.per,d.imp,d.cpm,d.inv,d.cri,d.url,d.utm,d.tag,d.tagcode,d.fl,d.crid,d.rot,d.st,d.obs]
    ).map(esc).join(',');
  });

  const csv = '﻿'+[...header,...dataRows].join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const camp = getVal('campanha')||'campanha';
  a.download = `trafficking_sheet_${camp.replace(/\s+/g,'_').toLowerCase()}.csv`;
  a.click();
}
