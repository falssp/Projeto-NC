<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimensões & Specs — Mercado Digital</title>
<style>
  :root {
    --navy: #0D2137;
    --navy-mid: #1A3F63;
    --blue: #2563EB;
    --accent: #38BDF8;
    --bg: #F0F4F8;
    --surface: #FFFFFF;
    --border: #DDE3EC;
    --text: #0D2137;
    --text-mid: #4A5568;
    --text-light: #8B9BBF;
    --row-alt: #F7FAFC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  header { background: var(--navy); padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .header-inner { display: flex; align-items: center; gap: 16px; height: 56px; }
  .logo { color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 16px; height: 16px; pointer-events: none; }
  #search { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid #2A4A6E; border-radius: 6px; background: rgba(255,255,255,.08); color: #fff; font-size: 13px; outline: none; transition: border-color .15s; }
  #search::placeholder { color: #6B84A8; }
  #search:focus { border-color: var(--accent); background: rgba(255,255,255,.12); }
  .header-count { color: var(--text-light); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .header-count b { color: var(--accent); }

  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 56px; z-index: 99; }
  .filter-inner { display: flex; align-items: center; gap: 6px; height: 44px; overflow-x: auto; scrollbar-width: none; }
  .filter-inner::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-mid); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0; }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 2px; }

  main { padding: 20px 24px 48px; }

  .section { margin-bottom: 24px; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--navy-mid); border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; }
  .section-header h2 { color: #fff; font-size: 13px; font-weight: 600; flex: 1; }
  .section-header .sec-count { color: rgba(255,255,255,.5); font-size: 12px; }
  .section-header .chevron { color: rgba(255,255,255,.6); transition: transform .2s; }
  .section-header.collapsed .chevron { transform: rotate(-90deg); }
  .section-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #EEF3FA; }
  thead th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-mid); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #EBF3FF; }
  td { padding: 9px 12px; vertical-align: middle; }

  .td-nome { font-weight: 600; color: var(--text); font-size: 13px; }
  .td-dim { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--blue); background: #EFF6FF; padding: 2px 8px; border-radius: 4px; white-space: nowrap; display: inline-block; }
  .td-peso { font-size: 12px; color: var(--text-mid); }
  .td-obs { font-size: 12px; color: var(--text-mid); line-height: 1.5; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-canal  { background: #1E3A5F; color: #93C5FD; }
  .badge-fmt    { background: #1A3A2A; color: #6EE7B7; }
  .badge-disp   { background: #2A1F4A; color: #DDD6FE; }
  .badge-tag    { background: #1F3020; color: #86EFAC; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .badge-warn   { background: #3A2A1F; color: #FCD34D; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }

  .no-results { text-align: center; padding: 48px 24px; color: var(--text-light); display: none; }

  footer { text-align: center; color: var(--text-light); font-size: 11px; padding: 20px; }
</style>

  </div>

    <button class="filter-btn" data-filter="canal:Video">Video</button>
    <button class="filter-btn" data-filter="canal:Audio">Audio</button>
    <button class="filter-btn" data-filter="canal:Social">Social</button>
    <button class="filter-btn" data-filter="canal:CTV">CTV / OTT</button>
    <button class="filter-btn" data-filter="canal:Rich Media">Rich Media</button>
    <button class="filter-btn" data-filter="canal:Search">Search</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="disp:Mobile">Mobile</button>
    <button class="filter-btn" data-filter="disp:Desktop">Desktop</button>
    <button class="filter-btn" data-filter="disp:TV">TV</button>
  </div>
</div>

<main>

// ─────────────────────────────────────────────────────────────────────────────
const SECTIONS_ORDER = [
  "Display IAB","Rich Media","Video","CTV / OTT","Audio",
  "Social — Meta","Social — TikTok","Social — LinkedIn",
  "Social — Pinterest","Social — Snapchat","Social — X (Twitter)",
  "YouTube","Search & Shopping"
];

const SECTION_TOTALS = {};
SECTIONS_ORDER.forEach(s => {
  SECTION_TOTALS[s] = DATA.filter(d => d.section === s).length;
});

function buildSections(data) {
  const wrap = document.getElementById("sections-wrap");
  wrap.innerHTML = "";
  const groups = {};
  SECTIONS_ORDER.forEach(s => groups[s] = []);
  data.forEach(d => { if (groups[d.section]) groups[d.section].push(d); });

  let rendered = 0;
  SECTIONS_ORDER.forEach(sec => {
    const rows = groups[sec];
    if (!rows.length) return;
    rendered += rows.length;

    const div = document.createElement("div");
    div.className = "section";
    div.innerHTML = `
      <div class="section-header" onclick="toggleSection(this)">
        <h2>${sec}</h2>
        <span class="sec-count">${rows.length} de ${SECTION_TOTALS[sec]}</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="section-body">
        <table>
          <thead><tr>
            <th style="width:20%">Formato / Nome</th>
            <th style="width:10%">Dimensões</th>
            <th style="width:7%">Ratio</th>
            <th style="width:7%">Peso máx</th>
            <th style="width:8%">Dispositivo</th>
            <th style="width:12%">Extensões aceitas</th>
            <th>Observações</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
            <tr>
              <td class="td-nome">${r.nome}</td>
              <td><span class="td-dim">${r.dim}</span></td>
              <td style="font-size:12px;color:var(--text-mid)">${r.ratio}</td>
              <td style="font-size:12px;color:var(--text-mid)">${r.peso}</td>
              <td><span class="badge badge-disp">${r.disp}</span></td>
              <td style="font-size:12px;color:var(--text-mid)">${r.ext}</td>
              <td class="td-obs">${r.obs || '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    wrap.appendChild(div);
  });
  return rendered;
}

function toggleSection(hdr) {
  hdr.classList.toggle("collapsed");
  hdr.nextElementSibling.style.display = hdr.classList.contains("collapsed") ? "none" : "";
}

let activeFilter = "all";
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});
document.getElementById("search").addEventListener("input", applyFilters);

function matches(d, q, filter) {
  const hay = [d.nome, d.dim, d.ratio, d.peso, d.ext, d.obs, d.canal, d.fmt, d.disp, d.section].join(" ").toLowerCase();
  if (q && !hay.includes(q.toLowerCase())) return false;
  if (filter === "all") return true;
  const [key, val] = filter.split(":");
  if (key === "canal") return d.canal === val || d.section.includes(val);
  if (key === "disp") return d.disp.includes(val);
  return true;
}

function applyFilters() {
  const q = document.getElementById("search").value.trim();
  const filtered = DATA.filter(d => matches(d, q, activeFilter));
  const vis = buildSections(filtered);
  document.getElementById("count-vis").textContent = vis;
  const noRes = document.getElementById("no-results");
  document.getElementById("sections-wrap").style.display = vis ? "" : "none";
  noRes.style.display = vis ? "none" : "block";
  if (!vis) document.getElementById("no-results-term").textContent = `"${q || activeFilter}"`;
}

document.getElementById("count-total").textContent = DATA.length;
applyFilters();
</script>
