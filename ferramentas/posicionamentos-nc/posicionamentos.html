<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicionário de Posicionamentos — Mercado Digital</title>
<style>
  :root {
    --navy: #0D2137;
    --navy-mid: #1A3F63;
    --blue: #2563EB;
    --blue-light: #3B82F6;
    --accent: #38BDF8;
    --bg: #F0F4F8;
    --surface: #FFFFFF;
    --border: #DDE3EC;
    --text: #0D2137;
    --text-mid: #4A5568;
    --text-light: #8B9BBF;
    --row-alt: #F7FAFC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  header {
    background: var(--navy); padding: 0 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .header-inner {
    max-width: 100%; margin: 0;
    display: flex; align-items: center; gap: 16px; height: 56px;
  }
  .logo { color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 16px; height: 16px; pointer-events: none; }
  #search { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid #2A4A6E; border-radius: 6px; background: rgba(255,255,255,.08); color: #fff; font-size: 13px; outline: none; transition: border-color .15s, background .15s; }
  #search::placeholder { color: #6B84A8; }
  #search:focus { border-color: var(--accent); background: rgba(255,255,255,.12); }
  .header-count { color: var(--text-light); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .header-count b { color: var(--accent); }

  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 56px; z-index: 99; }
  .filter-inner { max-width: 100%; margin: 0; display: flex; align-items: center; gap: 6px; height: 44px; overflow-x: auto; scrollbar-width: none; }
  .filter-inner::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-mid); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0; }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 2px; }

  main { max-width: 100%; margin: 0; padding: 20px 24px 48px; }

  .section { margin-bottom: 24px; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--navy-mid); border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; }
  .section-header h2 { color: #fff; font-size: 13px; font-weight: 600; flex: 1; }
  .section-header .sec-count { color: rgba(255,255,255,.5); font-size: 12px; }
  .section-header .chevron { color: rgba(255,255,255,.6); transition: transform .2s; }
  .section-header.collapsed .chevron { transform: rotate(-90deg); }
  .section-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #EEF3FA; }
  thead th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-mid); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #EBF3FF; }
  tbody tr.expanded { background: #EBF3FF; }
  td { padding: 9px 12px; vertical-align: middle; }
  .td-pos { font-weight: 600; color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .td-abbr { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: var(--blue); background: #EFF6FF; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .col-pos  { width: 18%; }
  .col-abbr { width: 8%; }
  .col-plat { width: 19%; }
  .col-fmt  { width: 9%; }
  .col-skip { width: 9%; }
  .col-dur  { width: 6%; }
  .col-obj  { width: 10%; }
  .col-kpi  { width: 8%; }
  .col-ads  { width: 9%; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-plat { background: #1E3A5F; color: #93C5FD; white-space: normal; word-break: break-word; }
  .badge-fmt  { background: #1A3A2A; color: #6EE7B7; }
  .badge-obj  { background: #3A1F5A; color: #C4B5FD; }
  .badge-skip-s  { background: #1F3A1F; color: #86EFAC; }
  .badge-skip-ns { background: #3A1F1F; color: #FCA5A5; }
  .badge-skip-na { background: #2A2A3A; color: #CBD5E0; }
  .badge-ads-y { background: #1F2F3A; color: #7DD3FC; }
  .badge-ads-n { background: #2A2A2A; color: #9CA3AF; }

  .expand-row { display: none; }
  .expand-row.open { display: table-row; }
  .expand-row td { padding: 0; }
  .expand-inner {
    padding: 16px 20px 20px; background: #F0F6FF; border-top: 1px solid #C3D9F5;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
  }
  .detail-item label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-light); margin-bottom: 4px; }
  .detail-item p { font-size: 13px; color: var(--text); line-height: 1.5; }
  .detail-item.full { grid-column: 1 / -1; }

  .no-results { text-align: center; padding: 48px 24px; color: var(--text-light); display: none; }
  .no-results svg { display: block; margin: 0 auto 12px; opacity: .3; }

  footer { text-align: center; color: var(--text-light); font-size: 11px; padding: 20px; }
</style>
</head>

<header>
  <div class="header-inner">
    <div class="logo">Dicionário de <span>Posicionamentos</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
      <input id="search" type="text" placeholder="Buscar posicionamento, sigla, plataforma, ad server…" autocomplete="off">
    </div>
    <div class="header-count">Exibindo <b id="count-vis">0</b> de <b id="count-total">0</b></div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="fmt:Video">Video</button>
    <button class="filter-btn" data-filter="fmt:Display">Display</button>
    <button class="filter-btn" data-filter="fmt:Audio">Audio</button>
    <button class="filter-btn" data-filter="fmt:Native">Native</button>
    <button class="filter-btn" data-filter="fmt:Rich Media">Rich Media</button>
    <button class="filter-btn" data-filter="fmt:Search">Search</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="skip:Skippable">Skippable</button>
    <button class="filter-btn" data-filter="skip:Non-Skippable">Non-Skippable</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="obj:Awareness">Awareness</button>
    <button class="filter-btn" data-filter="obj:Consideration">Consideration</button>
    <button class="filter-btn" data-filter="obj:Conversão">Conversão</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="ads:Sim">Requer Ad Server</button>
  </div>
</div>

<main>
  <div id="sections-wrap"></div>
  <div class="no-results" id="no-results">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Nenhum resultado para <b id="no-results-term"></b>
  </div>
</main>

<footer>Dicionário de Posicionamentos · Mercado Digital · <a href="https://falssp.github.io/Projeto-NC/" style="color:var(--accent);text-decoration:none;">← Projeto NC</a></footer>

function buildSections(data){
  const wrap = document.getElementById("sections-wrap");
  wrap.innerHTML = "";
  const groups = {};
  SECTIONS_ORDER.forEach(s=>groups[s]=[]);
  data.forEach(d=>{ if(groups[d.section]) groups[d.section].push(d); });

  let rendered = 0;
  SECTIONS_ORDER.forEach(sec=>{
    const rows = groups[sec];
    if(!rows.length) return;
    rendered += rows.length;

    const div = document.createElement("div");
    div.className = "section";

    div.innerHTML = `
      <div class="section-header" onclick="toggleSection(this)">
        <h2>${sec}</h2>
        <span class="sec-count" data-sec="${sec}">${rows.length} de ${SECTION_TOTALS[sec]}</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="section-body">
        <table>
          <thead><tr>
            <th class="col-pos">Posicionamento</th>
            <th class="col-abbr">Sigla</th>
            <th class="col-plat">Plataforma</th>
            <th class="col-fmt">Formato</th>
            <th class="col-skip">Skip Type</th>
            <th class="col-dur">Duração</th>
            <th class="col-obj">Objetivo</th>
            <th class="col-kpi">KPI</th>
            <th class="col-ads">Ad Servers</th>
          </tr></thead>
          <tbody>
            ${rows.map((r,i)=>{
              const rid = `row-${sec.replace(/\W+/g,'-')}-${i}`;
              return `
              <tr onclick="toggleRow(this,'${rid}')">
                <td class="td-pos">${r.pos}</td>
                <td><span class="td-abbr">${r.abbr}</span></td>
                <td><span class="badge badge-plat">${r.plat}</span></td>
                <td><span class="badge badge-fmt">${r.fmt}</span></td>
                <td><span class="badge ${skipClass(r.skip)}">${r.skip}</span></td>
                <td style="font-size:12px">${r.dur}</td>
                <td><span class="badge badge-obj">${r.obj}</span></td>
                <td style="font-size:12px;color:var(--text-mid)">${r.kpi}</td>
                <td><span class="badge ${adClass(r.ads)}">${r.ads}</span></td>
              </tr>
              <tr class="expand-row" id="${rid}">
                <td colspan="9">
                  <div class="expand-inner">
                    <div class="detail-item"><label>Ambiente</label><p>${r.amb}</p></div>
                    <div class="detail-item"><label>Tipo de Compra</label><p>${r.compra}</p></div>
                    <div class="detail-item"><label>Dispositivo</label><p>${r.disp}</p></div>
                    <div class="detail-item"><label>Dimensões / Specs</label><p>${r.specs}</p></div>
                    <div class="detail-item"><label>KPI Principal</label><p>${r.kpi}</p></div>
                    <div class="detail-item"><label>Ad Servers Compatíveis</label><p>${r.adsComp}</p></div>
                    <div class="detail-item"><label>Brand Safety</label><p>${r.bs}</p></div>
                    <div class="detail-item"><label>Viewability</label><p>${r.view}</p></div>
                    <div class="detail-item full"><label>Segmentação</label><p>${r.seg}</p></div>
                    ${r.obs?`<div class="detail-item full"><label>Observações</label><p>${r.obs}</p></div>`:''}
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    wrap.appendChild(div);
  });
  return rendered;
}

function toggleSection(hdr){
  hdr.classList.toggle("collapsed");
  hdr.nextElementSibling.style.display = hdr.classList.contains("collapsed")?"none":"";
}
function toggleRow(tr, id){
  const exp = document.getElementById(id);
  if(!exp) return;
  const open = exp.classList.toggle("open");
  tr.classList.toggle("expanded", open);
}

let activeFilter = "all";
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});
document.getElementById("search").addEventListener("input", applyFilters);

function matches(d, q, filter){
  const hay = [d.pos,d.abbr,d.plat,d.fmt,d.skip,d.obj,d.kpi,d.seg,d.obs,d.section,d.adsComp].join(" ").toLowerCase();
  if(q && !hay.includes(q.toLowerCase())) return false;
  if(filter==="all") return true;
  const [key,val] = filter.split(":");
  if(key==="fmt") return d.fmt.toLowerCase().includes(val.toLowerCase());
  if(key==="skip") return d.skip===val;
  if(key==="obj") return d.obj.includes(val);
  if(key==="ads") return d.ads===val;
  return true;
}

function applyFilters(){
  const q = document.getElementById("search").value.trim();
  const filtered = DATA.filter(d=>matches(d,q,activeFilter));
  const vis = buildSections(filtered);
  document.getElementById("count-vis").textContent = vis;
  const noRes = document.getElementById("no-results");
  document.getElementById("sections-wrap").style.display = vis?"":"none";
  noRes.style.display = vis?"none":"block";
  if(!vis) document.getElementById("no-results-term").textContent = `"${q||activeFilter}"`;
}

document.getElementById("count-total").textContent = DATA.length;
applyFilters();
</script>
</body>
</html>
