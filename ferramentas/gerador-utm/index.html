<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de UTM — AdOps Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;--bg:#f0f2ff;--card:#fff;--border:#d0d5f0;--text:#1a1a2e;--muted:#5a5f8a;--green:#1b8c3e;--red:#c0392b;--warn:#e67e22;}
[data-theme="dark"]{--bg:#0d0f1a;--card:#161827;--border:#2a2d4a;--text:#e8ecff;--muted:#8890c0;--light:#1e2140;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,var(--escuro),var(--azul));padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;}
header a{color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem;}
header a:hover{color:#fff;}
h1{color:#fff;font-size:1.4rem;font-weight:700;}
.sub{color:rgba(255,255,255,.75);font-size:.85rem;margin-top:.2rem;}
.theme-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.8rem;}
.wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
@media(max-width:650px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1.2rem;color:var(--azul);}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em;}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--bg);color:var(--text);transition:.2s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);}
.field{margin-bottom:1rem;}
.row{display:flex;gap:.6rem;align-items:flex-end;}
.row .field{flex:1;margin-bottom:0;}
.btn{padding:.6rem 1.2rem;border:none;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.9rem;transition:.15s;}
.btn-primary{background:var(--azul);color:#fff;}
.btn-primary:hover{background:var(--escuro);}
.btn-secondary{background:var(--light);color:var(--azul);}
.btn-secondary:hover{background:var(--border);}
.btn-sm{padding:.4rem .8rem;font-size:.8rem;}
.btn-danger{background:#fce4e4;color:var(--red);}
.btn-danger:hover{background:#f9c0c0;}
.output-box{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:.82rem;word-break:break-all;color:var(--text);min-height:3rem;line-height:1.6;}
.output-box a{color:var(--azul);text-decoration:none;}
.copy-row{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap;}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:600;}
.badge-must{background:#fde8e8;color:var(--red);}
.badge-rec{background:#e8f5e9;color:var(--green);}
.badge-opt{background:var(--light);color:var(--azul);}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
.preset-btn{padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;cursor:pointer;transition:.15s;}
.preset-btn:hover{border-color:var(--azul);color:var(--azul);}
.preset-btn.active{background:var(--azul);color:#fff;border-color:var(--azul);}
.history-list{list-style:none;display:flex;flex-direction:column;gap:.5rem;max-height:300px;overflow-y:auto;}
.history-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;word-break:break-all;cursor:pointer;transition:.15s;position:relative;}
.history-item:hover{border-color:var(--azul);}
.history-item .h-date{font-family:'Space Grotesk',sans-serif;font-size:.7rem;color:var(--muted);margin-bottom:.3rem;}
.history-item .h-del{position:absolute;top:.5rem;right:.5rem;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9rem;line-height:1;}
.history-item .h-del:hover{color:var(--red);}
.empty{color:var(--muted);font-size:.85rem;padding:.5rem 0;}
.section-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.info-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:20px;font-size:.78rem;background:var(--light);color:var(--azul);margin-bottom:1rem;}
</style>
</head>
<body>
<header>
  <div>
    <div style="font-size:.8rem;margin-bottom:.3rem;"><a href="../">← Ferramentas AdOps</a></div>
    <h1>🔗 Gerador de UTM</h1>
    <div class="sub">Construa URLs com parâmetros UTM — com presets, validação e histórico</div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙 Tema</button>
</header>

<div class="wrap">
  <div class="grid2">
    <!-- BUILDER -->
    <div>
      <div class="card">
        <h2>Construtor de URL</h2>

        <div class="section-title" style="font-size:.8rem;">Presets de plataforma</div>
        <div class="presets" id="presets"></div>

        <div class="field">
          <label>URL de destino <span class="badge badge-must">obrigatório</span></label>
          <input type="url" id="url" placeholder="https://www.seusite.com.br/pagina" oninput="build()">
        </div>
        <div class="field">
          <label>utm_source <span class="badge badge-must">obrigatório</span></label>
          <input id="source" placeholder="google, meta, newsletter…" oninput="build()">
        </div>
        <div class="field">
          <label>utm_medium <span class="badge badge-must">obrigatório</span></label>
          <input id="medium" placeholder="cpc, display, email, social…" oninput="build()">
        </div>
        <div class="field">
          <label>utm_campaign <span class="badge badge-must">obrigatório</span></label>
          <input id="campaign" placeholder="nome_da_campanha" oninput="build()">
        </div>
        <div class="field">
          <label>utm_content <span class="badge badge-rec">recomendado</span></label>
          <input id="content" placeholder="banner_300x250, cta_compre" oninput="build()">
        </div>
        <div class="field">
          <label>utm_term <span class="badge badge-opt">opcional</span></label>
          <input id="term" placeholder="palavra-chave (links pagos)" oninput="build()">
        </div>
        <div class="field">
          <label>utm_id <span class="badge badge-opt">opcional</span></label>
          <input id="utmid" placeholder="ID único da campanha / order ID" oninput="build()">
        </div>

        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;">
          <button class="btn btn-secondary btn-sm" onclick="clearAll()">Limpar</button>
          <button class="btn btn-secondary btn-sm" onclick="loadSample()">Exemplo</button>
        </div>
      </div>
    </div>

    <!-- OUTPUT + HISTORY -->
    <div style="display:flex;flex-direction:column;gap:1.5rem;">
      <div class="card">
        <h2>URL gerada</h2>
        <div class="output-box" id="output">Preencha os campos ao lado…</div>
        <div class="copy-row">
          <button class="btn btn-primary btn-sm" onclick="copyUrl()">📋 Copiar URL</button>
          <button class="btn btn-secondary btn-sm" onclick="copyShort()">Só parâmetros</button>
          <button class="btn btn-secondary btn-sm" onclick="saveHistory()">💾 Salvar</button>
        </div>
        <div id="validation" style="margin-top:.8rem;display:flex;flex-wrap:wrap;gap:.4rem;"></div>
      </div>

      <div class="card">
        <h2>Parâmetros em tabela</h2>
        <div id="param-table"></div>
      </div>

      <div class="card">
        <h2>Histórico</h2>
        <div id="history-wrap">
          <p class="empty">Nenhuma URL salva ainda.</p>
        </div>
        <button class="btn btn-danger btn-sm" style="margin-top:.8rem;" onclick="clearHistory()">🗑 Limpar histórico</button>
      </div>
    </div>
  </div>
</div>

<script>
const PRESETS = [
  {id:'google',label:'Google Ads',source:'google',medium:'cpc'},
  {id:'meta',label:'Meta',source:'meta',medium:'paid_social'},
  {id:'dv360',label:'DV360',source:'dv360',medium:'display'},
  {id:'cm360',label:'CM360',source:'cm360',medium:'display'},
  {id:'linkedin',label:'LinkedIn',source:'linkedin',medium:'paid_social'},
  {id:'tiktok',label:'TikTok',source:'tiktok',medium:'paid_social'},
  {id:'email',label:'E-mail',source:'newsletter',medium:'email'},
  {id:'organic',label:'Orgânico',source:'google',medium:'organic'},
];

let _history = [];
try{_history = JSON.parse(localStorage.getItem('utm_history')||'[]');}catch(e){}

function init(){
  const wrap = document.getElementById('presets');
  PRESETS.forEach(p=>{
    const b = document.createElement('button');
    b.className='preset-btn';
    b.id='preset-'+p.id;
    b.textContent=p.label;
    b.onclick=()=>applyPreset(p);
    wrap.appendChild(b);
  });
  renderHistory();
  build();
}

function applyPreset(p){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('preset-'+p.id).classList.add('active');
  document.getElementById('source').value=p.source;
  document.getElementById('medium').value=p.medium;
  build();
}

function getValues(){
  return {
    url: document.getElementById('url').value.trim(),
    source: document.getElementById('source').value.trim(),
    medium: document.getElementById('medium').value.trim(),
    campaign: document.getElementById('campaign').value.trim(),
    content: document.getElementById('content').value.trim(),
    term: document.getElementById('term').value.trim(),
    utmid: document.getElementById('utmid').value.trim(),
  };
}

function build(){
  const v = getValues();
  const out = document.getElementById('output');
  const val = document.getElementById('validation');
  const ptbl = document.getElementById('param-table');

  // validation
  const issues = [];
  if(!v.url) issues.push({t:'URL de destino obrigatória',cls:'badge-must'});
  else { try{new URL(v.url);}catch(e){issues.push({t:'URL inválida',cls:'badge-must'});} }
  if(!v.source) issues.push({t:'utm_source obrigatório',cls:'badge-must'});
  if(!v.medium) issues.push({t:'utm_medium obrigatório',cls:'badge-must'});
  if(!v.campaign) issues.push({t:'utm_campaign obrigatório',cls:'badge-must'});
  if(v.source && /\s/.test(v.source)) issues.push({t:'utm_source tem espaços',cls:'badge-must'});
  if(v.medium && /\s/.test(v.medium)) issues.push({t:'utm_medium tem espaços',cls:'badge-must'});
  if(v.campaign && /\s/.test(v.campaign)) issues.push({t:'utm_campaign tem espaços',cls:'badge-must'});

  val.innerHTML = issues.map(i=>`<span class="badge ${i.cls}">${i.t}</span>`).join('');

  // build params
  const params = [];
  if(v.source) params.push(['utm_source',v.source]);
  if(v.medium) params.push(['utm_medium',v.medium]);
  if(v.campaign) params.push(['utm_campaign',v.campaign]);
  if(v.content) params.push(['utm_content',v.content]);
  if(v.term) params.push(['utm_term',v.term]);
  if(v.utmid) params.push(['utm_id',v.utmid]);

  if(!v.url||issues.some(i=>i.cls==='badge-must'&&i.t.includes('URL'))){
    if(params.length){
      const qs='?'+params.map(([k,val])=>`${k}=${encodeURIComponent(val)}`).join('&');
      out.textContent=qs;
    } else {
      out.textContent='Preencha os campos…';
    }
    ptbl.innerHTML='';
    return;
  }

  let base = v.url;
  const sep = base.includes('?')?'&':'?';
  const qs = params.map(([k,val])=>`${k}=${encodeURIComponent(val)}`).join('&');
  const full = params.length ? base+sep+qs : base;
  out.textContent = full;

  // param table
  if(params.length){
    ptbl.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:.82rem;">
      <thead><tr style="border-bottom:2px solid var(--border);">
        <th style="text-align:left;padding:.4rem .5rem;color:var(--muted);font-weight:600;">Parâmetro</th>
        <th style="text-align:left;padding:.4rem .5rem;color:var(--muted);font-weight:600;">Valor</th>
      </tr></thead>
      <tbody>
        ${params.map(([k,val])=>`<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:.4rem .5rem;font-family:'JetBrains Mono',monospace;color:var(--azul);">${k}</td>
          <td style="padding:.4rem .5rem;word-break:break-all;">${escHtml(val)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  } else {
    ptbl.innerHTML='<p class="empty">Nenhum parâmetro preenchido.</p>';
  }
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getFullUrl(){
  const v = getValues();
  const params=[];
  if(v.source) params.push(['utm_source',v.source]);
  if(v.medium) params.push(['utm_medium',v.medium]);
  if(v.campaign) params.push(['utm_campaign',v.campaign]);
  if(v.content) params.push(['utm_content',v.content]);
  if(v.term) params.push(['utm_term',v.term]);
  if(v.utmid) params.push(['utm_id',v.utmid]);
  if(!v.url||!params.length) return null;
  const sep=v.url.includes('?')?'&':'?';
  return v.url+sep+params.map(([k,vv])=>`${k}=${encodeURIComponent(vv)}`).join('&');
}

function copyUrl(){
  const url=getFullUrl();
  if(!url){alert('Preencha os campos obrigatórios primeiro.');return;}
  navigator.clipboard.writeText(url);
  flash('copyUrl','✅ Copiado!','📋 Copiar URL');
}

function copyShort(){
  const v=getValues();
  const params=[];
  if(v.source) params.push(['utm_source',v.source]);
  if(v.medium) params.push(['utm_medium',v.medium]);
  if(v.campaign) params.push(['utm_campaign',v.campaign]);
  if(v.content) params.push(['utm_content',v.content]);
  if(v.term) params.push(['utm_term',v.term]);
  if(v.utmid) params.push(['utm_id',v.utmid]);
  if(!params.length){alert('Nenhum parâmetro preenchido.');return;}
  const qs='?'+params.map(([k,vv])=>`${k}=${encodeURIComponent(vv)}`).join('&');
  navigator.clipboard.writeText(qs);
  flash('copyShort','✅ Copiado!','Só parâmetros');
}

function flash(id,msg,orig){
  // find button by text
  const btns=document.querySelectorAll('.btn');
  let btn=null;
  btns.forEach(b=>{if(b.textContent.trim()===orig.trim())btn=b;});
  if(!btn)return;
  const prev=btn.textContent;
  btn.textContent=msg;
  setTimeout(()=>{btn.textContent=prev;},1500);
}

function saveHistory(){
  const url=getFullUrl();
  if(!url){alert('Preencha os campos obrigatórios primeiro.');return;}
  const v=getValues();
  const item={url,source:v.source,medium:v.medium,campaign:v.campaign,ts:Date.now()};
  _history.unshift(item);
  if(_history.length>30)_history=_history.slice(0,30);
  try{localStorage.setItem('utm_history',JSON.stringify(_history));}catch(e){}
  renderHistory();
}

function renderHistory(){
  const wrap=document.getElementById('history-wrap');
  if(!_history.length){wrap.innerHTML='<p class="empty">Nenhuma URL salva ainda.</p>';return;}
  const list=document.createElement('ul');
  list.className='history-list';
  _history.forEach((item,idx)=>{
    const li=document.createElement('li');
    li.className='history-item';
    const d=new Date(item.ts);
    li.innerHTML=`<div class="h-date">${d.toLocaleString('pt-BR')} · ${escHtml(item.source)} / ${escHtml(item.medium)}</div>${escHtml(item.url)}<button class="h-del" onclick="deleteHistory(${idx})" title="Remover">×</button>`;
    li.querySelector('.h-del').onclick=(e)=>{e.stopPropagation();deleteHistory(idx);};
    li.onclick=()=>loadFromHistory(item);
    list.appendChild(li);
  });
  wrap.innerHTML='';
  wrap.appendChild(list);
}

function deleteHistory(idx){
  _history.splice(idx,1);
  try{localStorage.setItem('utm_history',JSON.stringify(_history));}catch(e){}
  renderHistory();
}

function loadFromHistory(item){
  try{
    const u=new URL(item.url);
    const p=u.searchParams;
    document.getElementById('url').value=u.origin+u.pathname+(u.search.replace(/utm_[^&]+&?/g,'').replace(/[?&]$/,''));
    document.getElementById('source').value=p.get('utm_source')||'';
    document.getElementById('medium').value=p.get('utm_medium')||'';
    document.getElementById('campaign').value=p.get('utm_campaign')||'';
    document.getElementById('content').value=p.get('utm_content')||'';
    document.getElementById('term').value=p.get('utm_term')||'';
    document.getElementById('utmid').value=p.get('utm_id')||'';
    build();
  }catch(e){
    document.getElementById('url').value=item.url;
    build();
  }
}

function clearHistory(){
  if(!confirm('Limpar todo o histórico?'))return;
  _history=[];
  try{localStorage.removeItem('utm_history');}catch(e){}
  renderHistory();
}

function clearAll(){
  ['url','source','medium','campaign','content','term','utmid'].forEach(id=>{document.getElementById(id).value='';});
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  build();
}

function loadSample(){
  document.getElementById('url').value='https://www.stormx.com.br/produto/oferta-especial';
  document.getElementById('source').value='google';
  document.getElementById('medium').value='cpc';
  document.getElementById('campaign').value='black_friday_2024';
  document.getElementById('content').value='banner_300x250_desconto';
  document.getElementById('term').value='';
  document.getElementById('utmid').value='';
  document.getElementById('preset-google').classList.add('active');
  build();
}

function toggleTheme(){
  const html=document.documentElement;
  html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');
}

init();
</script>
</body>
</html>
