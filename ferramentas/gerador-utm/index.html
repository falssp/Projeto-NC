<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de UTM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--fg:#0f172a;--card:#fff;--accent:#0891b2;--accent-soft:rgba(8,145,178,.08);
  --border:#e2e8f0;--faint:#64748b;--input-bg:#fff;--divider:#f1f5f9;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--erro:#dc2626;
  --shadow:0 1px 4px rgba(0,0,0,.08);--mono:'JetBrains Mono',monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.08);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.08);
  --border:#334155;--faint:#94a3b8;--input-bg:#0f172a;
  --ok:#22c55e;--ok-bg:rgba(22,197,94,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.btn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s;}
.btn:hover{background:var(--border);}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
.btn.primary:hover{opacity:.9;}
.page{max-width:860px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:flex;align-items:center;gap:5px;}
.req{color:var(--erro);}
.field input,.field select,.field textarea{padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);color:var(--fg);font-size:13px;outline:none;width:100%;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field input.error{border-color:var(--erro);}
.field-hint{font-size:10px;color:var(--faint);}
/* Preset chips */
.preset-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.preset-chip{font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:var(--input-bg);cursor:pointer;font-weight:500;transition:all .15s;}
.preset-chip:hover,.preset-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
/* Result box */
.result-box{background:var(--divider);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.6;word-break:break-all;color:var(--fg);min-height:48px;position:relative;}
.url-part{color:var(--faint);}
.utm-part{color:var(--accent);font-weight:600;}
/* Params preview */
.params-preview{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.param-pill{font-size:11px;padding:3px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px;}
.param-pill .pk{color:var(--faint);font-weight:500;}
/* History */
.hist-row{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.hist-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);}
.hist-url{font-family:var(--mono);font-size:11px;word-break:break-all;flex:1;color:var(--fg);cursor:pointer;}
.hist-url:hover{color:var(--accent);}
.hist-meta{font-size:10px;color:var(--faint);white-space:nowrap;}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#f1f5f9;padding:8px 16px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:all .3s;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">🔗</span>
    <div>
      <div style="font-size:15px;font-weight:800">Gerador de UTM</div>
      <div style="font-size:11px;color:var(--faint)">Crie parâmetros de rastreamento para campanhas</div>
    </div>
  </div>
  <div style="display:flex;gap:7px">
    <button class="btn" onclick="clearForm()">✕ Limpar</button>
    <button class="btn" onclick="toggleTheme()">🌙</button>
    <button class="btn primary" onclick="generateAndCopy()">📋 Gerar & Copiar</button>
  </div>
</div>

<div class="page">
  <!-- Form -->
  <div class="card">
    <div class="card-title">⚙ Parâmetros UTM</div>
    <div style="margin-bottom:14px">
      <div class="field-label">Presets de canal</div>
      <div class="preset-row" id="presetRow"></div>
    </div>
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1">
        <div class="field-label">URL de destino <span class="req">*</span></div>
        <input type="url" id="fUrl" placeholder="https://exemplo.com/pagina" oninput="updatePreview()">
        <span class="field-hint">URL base sem parâmetros UTM</span>
      </div>
      <div class="field">
        <div class="field-label">utm_source <span class="req">*</span></div>
        <input type="text" id="fSource" placeholder="google, facebook, email…" oninput="updatePreview()">
        <div class="preset-row" id="sourcePresets"></div>
      </div>
      <div class="field">
        <div class="field-label">utm_medium <span class="req">*</span></div>
        <input type="text" id="fMedium" placeholder="cpc, email, organic…" oninput="updatePreview()">
        <div class="preset-row" id="mediumPresets"></div>
      </div>
      <div class="field">
        <div class="field-label">utm_campaign <span class="req">*</span></div>
        <input type="text" id="fCampaign" placeholder="nome_campanha" oninput="updatePreview()">
      </div>
      <div class="field">
        <div class="field-label">utm_content</div>
        <input type="text" id="fContent" placeholder="banner_topo, cta_botao…" oninput="updatePreview()">
      </div>
      <div class="field">
        <div class="field-label">utm_term</div>
        <input type="text" id="fTerm" placeholder="palavra-chave" oninput="updatePreview()">
      </div>
      <div class="field">
        <div class="field-label">utm_id</div>
        <input type="text" id="fId" placeholder="ID único da campanha" oninput="updatePreview()">
      </div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
        <input type="checkbox" id="optLower" checked onchange="updatePreview()"> Forçar minúsculas
      </label>
      <label style="display:flex;align-items:center;gap=6px;font-size:12px;cursor:pointer;margin-left:8px">
        <input type="checkbox" id="optEncode" checked onchange="updatePreview()"> Codificar espaços como +
      </label>
    </div>
  </div>

  <!-- Preview -->
  <div class="card" id="previewCard" style="display:none">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>🔍 Preview</span>
      <button class="btn primary" onclick="copyURL()" id="copyBtn">📋 Copiar URL</button>
    </div>
    <div class="result-box" id="resultBox"></div>
    <div class="params-preview" id="paramsPills"></div>
  </div>

  <!-- History -->
  <div class="card" id="histCard" style="display:none">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>📜 Histórico</span>
      <button class="btn" onclick="clearHistory()">🗑 Limpar</button>
    </div>
    <div class="hist-row" id="histList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Theme
let _theme=null; try{_theme=localStorage.getItem('geradonutm_theme');}catch(e){}
if(_theme) document.documentElement.setAttribute('data-theme',_theme);
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  _theme=isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme',_theme);
  try{localStorage.setItem('geradonutm_theme',_theme);}catch(e){}
  document.querySelector('.btn[onclick="toggleTheme()"]').textContent=_theme==='dark'?'☀️':'🌙';
}
(function(){const cur=document.documentElement.getAttribute('data-theme');const isDark=cur==='dark'||(cur===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);const btn=document.querySelector('.btn[onclick="toggleTheme()"]');if(btn)btn.textContent=isDark?'☀️':'🌙';})();

// Presets
const CHANNEL_PRESETS = [
  {label:'Google Ads', source:'google', medium:'cpc'},
  {label:'Meta Ads', source:'facebook', medium:'cpc'},
  {label:'TikTok', source:'tiktok', medium:'cpc'},
  {label:'LinkedIn', source:'linkedin', medium:'cpc'},
  {label:'Email', source:'newsletter', medium:'email'},
  {label:'YouTube', source:'youtube', medium:'video'},
  {label:'Programático', source:'programatico', medium:'display'},
  {label:'Orgânico', source:'google', medium:'organic'},
];
const SOURCE_PRESETS=['google','facebook','instagram','tiktok','linkedin','twitter','email','direct'];
const MEDIUM_PRESETS=['cpc','display','email','video','social','organic','referral','affiliate'];

function renderPresets(){
  const row=document.getElementById('presetRow');
  row.innerHTML=CHANNEL_PRESETS.map(p=>`<span class="preset-chip" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${esc(p.label)}</span>`).join('');
  const sp=document.getElementById('sourcePresets');
  sp.innerHTML=SOURCE_PRESETS.map(s=>`<span class="preset-chip" style="font-size:10px;padding:1px 7px" onclick="document.getElementById('fSource').value='${s}';updatePreview()">${s}</span>`).join('');
  const mp=document.getElementById('mediumPresets');
  mp.innerHTML=MEDIUM_PRESETS.map(s=>`<span class="preset-chip" style="font-size:10px;padding:1px 7px" onclick="document.getElementById('fMedium').value='${s}';updatePreview()">${s}</span>`).join('');
}
renderPresets();

function applyPreset(p){
  document.getElementById('fSource').value=p.source||'';
  document.getElementById('fMedium').value=p.medium||'';
  updatePreview();
  showToast(`Preset "${p.label}" aplicado`);
}

function normalizeVal(v){
  const lower=document.getElementById('optLower').checked;
  const encode=document.getElementById('optEncode').checked;
  let s=lower?v.toLowerCase():v;
  if(encode) s=s.replace(/\s+/g,'+');
  else s=encodeURIComponent(s).replace(/%20/g,'+');
  return s;
}

function buildURL(){
  const url=(document.getElementById('fUrl').value||'').trim();
  const source=(document.getElementById('fSource').value||'').trim();
  const medium=(document.getElementById('fMedium').value||'').trim();
  const campaign=(document.getElementById('fCampaign').value||'').trim();
  const content=(document.getElementById('fContent').value||'').trim();
  const term=(document.getElementById('fTerm').value||'').trim();
  const id=(document.getElementById('fId').value||'').trim();
  if(!url||!source||!medium||!campaign) return null;
  const params=[];
  if(source) params.push(`utm_source=${normalizeVal(source)}`);
  if(medium) params.push(`utm_medium=${normalizeVal(medium)}`);
  if(campaign) params.push(`utm_campaign=${normalizeVal(campaign)}`);
  if(id) params.push(`utm_id=${normalizeVal(id)}`);
  if(content) params.push(`utm_content=${normalizeVal(content)}`);
  if(term) params.push(`utm_term=${normalizeVal(term)}`);
  const sep=url.includes('?')?'&':'?';
  return {full: url+sep+params.join('&'), base:url, params};
}

function updatePreview(){
  const result=buildURL();
  const card=document.getElementById('previewCard');
  if(!result){card.style.display='none';return;}
  card.style.display='block';
  const rb=document.getElementById('resultBox');
  rb.innerHTML=`<span class="url-part">${esc(result.base)}</span><span class="url-part">${result.base.includes('?')?'&amp;':'?'}</span><span class="utm-part">${esc(result.params.join('&'))}</span>`;
  const pills=document.getElementById('paramsPills');
  pills.innerHTML=result.params.map(p=>{const[k,v]=p.split('=');return`<span class="param-pill"><span class="pk">${esc(k)}=</span>${esc(decodeURIComponent(v.replace(/\+/g,' ')))}</span>`;}).join('');
}

let _currentURL='';
function copyURL(){
  const result=buildURL();
  if(!result){showToast('Preencha os campos obrigatórios');return;}
  _currentURL=result.full;
  navigator.clipboard.writeText(result.full).then(()=>{
    showToast('✓ URL copiada!');
    addHistory(result.full);
  }).catch(()=>{showToast('Erro ao copiar — selecione manualmente');});
}

function generateAndCopy(){
  // Validate
  const fields=['fUrl','fSource','fMedium','fCampaign'];
  let ok=true;
  fields.forEach(id=>{
    const el=document.getElementById(id);
    if(!el.value.trim()){el.classList.add('error');ok=false;}
    else el.classList.remove('error');
  });
  if(!ok){showToast('Preencha os campos obrigatórios (*)');return;}
  updatePreview();
  copyURL();
}

// History
const HIST_KEY='utm_hist_v1';
const HIST_MAX=30;

function addHistory(url){
  try{
    let h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
    h=h.filter(x=>x.url!==url);
    h.unshift({url, ts:Date.now()});
    if(h.length>HIST_MAX) h=h.slice(0,HIST_MAX);
    localStorage.setItem(HIST_KEY,JSON.stringify(h));
    renderHistory();
  }catch(e){}
}

function renderHistory(){
  let h=[];try{h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){}
  const card=document.getElementById('histCard');
  if(!h.length){card.style.display='none';return;}
  card.style.display='block';
  const list=document.getElementById('histList');
  list.innerHTML=h.map((item,i)=>{
    const d=new Date(item.ts);
    const dt=`${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    return `<div class="hist-item">
      <span class="hist-url" onclick="loadHistItem(${i})" title="Clique para carregar">${esc(item.url)}</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="hist-meta">${esc(dt)}</span>
        <div style="display:flex;gap:5px">
          <button class="btn" style="height:24px;font-size:10px" onclick="copyHistItem(${i})">📋</button>
          <button class="btn" style="height:24px;font-size:10px" onclick="deleteHistItem(${i})">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function loadHistItem(i){
  let h=[];try{h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){}
  const item=h[i]; if(!item) return;
  // Parse URL and fill form
  try{
    const [base, qs]=item.url.split('?');
    document.getElementById('fUrl').value=base||'';
    if(qs){
      const params=new URLSearchParams(qs);
      document.getElementById('fSource').value=params.get('utm_source')||'';
      document.getElementById('fMedium').value=params.get('utm_medium')||'';
      document.getElementById('fCampaign').value=params.get('utm_campaign')||'';
      document.getElementById('fContent').value=params.get('utm_content')||'';
      document.getElementById('fTerm').value=params.get('utm_term')||'';
      document.getElementById('fId').value=params.get('utm_id')||'';
    }
    updatePreview();
    showToast('URL carregada no formulário');
  }catch(err){showToast('Erro ao carregar URL');}
}

function copyHistItem(i){
  let h=[];try{h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){}
  const item=h[i]; if(!item) return;
  navigator.clipboard.writeText(item.url).then(()=>showToast('✓ Copiado!')).catch(()=>{});
}

function deleteHistItem(i){
  try{
    let h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
    h.splice(i,1);
    localStorage.setItem(HIST_KEY,JSON.stringify(h));
    renderHistory();
  }catch(e){}
}

function clearHistory(){
  try{localStorage.removeItem(HIST_KEY);}catch(e){}
  renderHistory();
}

function clearForm(){
  ['fUrl','fSource','fMedium','fCampaign','fContent','fTerm','fId'].forEach(id=>{
    const el=document.getElementById(id);if(el){el.value='';el.classList.remove('error');}
  });
  document.getElementById('previewCard').style.display='none';
}

// Init
renderHistory();
</script>
</body>
</html>
