<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de UTM — AdOps Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;--bg:#f0f2ff;
  --card:#fff;--border:#d0d6f7;--text:#111827;--muted:#6b7280;
  --green:#16a34a;--red:#dc2626;--orange:#ea580c;--yellow:#ca8a04;
  --radius:12px;--mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0d0f1a;--card:#141828;--border:#2a3060;--text:#e8ecff;
  --muted:#8892b0;--light:#1e2548;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--azul);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:700}
header a{color:rgba(255,255,255,.75);font-size:.85rem;text-decoration:none}
header a:hover{color:#fff}
.theme-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;font-family:inherit}
main{max-width:980px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
label{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:var(--card);color:var(--text);transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul)}
textarea{resize:vertical;min-height:80px}
.hint{font-size:.75rem;color:var(--muted);margin-top:3px}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--azul);color:#fff}
.btn-primary:hover{background:var(--escuro)}
.btn-ghost{background:transparent;color:var(--azul);border:1.5px solid var(--azul)}
.btn-ghost:hover{background:var(--light)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
/* Resultado */
.result-box{background:var(--light);border:1.5px solid var(--border);border-radius:8px;padding:14px;margin-top:12px}
.url-output{font-family:var(--mono);font-size:.82rem;word-break:break-all;color:var(--azul);line-height:1.6}
.copy-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.copy-btn{padding:5px 14px;border-radius:6px;border:1.5px solid var(--azul);background:transparent;color:var(--azul);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.copy-btn.copied{background:var(--azul);color:#fff}
/* Chips de preset */
.preset-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s}
.chip:hover,.chip.active{background:var(--azul);color:#fff;border-color:var(--azul)}
/* Histórico */
.history-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.history-item{background:var(--light);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.history-url{font-family:var(--mono);font-size:.77rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--azul)}
.history-time{font-size:.72rem;color:var(--muted);white-space:nowrap}
/* Bulk */
.bulk-textarea{font-family:var(--mono);font-size:.8rem;min-height:120px}
.bulk-results{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;margin-top:10px}
.bulk-row{font-family:var(--mono);font-size:.78rem;padding:7px 10px;background:var(--light);border-radius:6px;word-break:break-all;cursor:pointer;transition:background .15s}
.bulk-row:hover{background:var(--border)}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:9px 20px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--azul);border-bottom-color:var(--azul)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.empty{text-align:center;color:var(--muted);font-size:.88rem;padding:24px}
/* Params display */
.params-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.8rem;margin-top:8px}
.param-key{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.param-val{font-family:var(--mono);color:var(--text);word-break:break-all}
</style>
</head>
<body>
<header>
  <div>
    <a href="../">← Ferramentas</a>
    <h1 style="margin-top:2px">🔗 Gerador de UTM</h1>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">◐ Tema</button>
</header>
<main>

<div class="card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('single')">URL Única</div>
    <div class="tab" onclick="switchTab('bulk')">Bulk / CSV</div>
    <div class="tab" onclick="switchTab('history')">Histórico</div>
  </div>

  <!-- SINGLE -->
  <div id="tab-single" class="tab-panel active">
    <div class="section-label">Preset de mídia</div>
    <div class="preset-chips" id="presetChips"></div>

    <div class="form-grid">
      <div>
        <label>URL de destino *</label>
        <input id="baseUrl" type="url" placeholder="https://www.exemplo.com.br/landing" oninput="generate()">
      </div>
      <div>
        <label>Campanha (utm_campaign) *</label>
        <input id="campaign" placeholder="black-friday-2024" oninput="generate()">
      </div>
      <div>
        <label>Fonte (utm_source) *</label>
        <input id="source" placeholder="google" oninput="generate()">
      </div>
      <div>
        <label>Mídia (utm_medium) *</label>
        <input id="medium" placeholder="cpc" oninput="generate()">
      </div>
      <div>
        <label>Conteúdo (utm_content)</label>
        <input id="content" placeholder="banner-300x250-v1" oninput="generate()">
      </div>
      <div>
        <label>Termo (utm_term)</label>
        <input id="term" placeholder="comprar+tênis+masculino" oninput="generate()">
      </div>
      <div>
        <label>ID da campanha (utm_id)</label>
        <input id="utmId" placeholder="12345" oninput="generate()">
      </div>
      <div>
        <label>Parâmetro extra</label>
        <input id="extra" placeholder="chave=valor" oninput="generate()">
      </div>
    </div>

    <div id="resultBox" class="result-box" style="display:none">
      <div class="section-label" style="margin-bottom:6px">URL gerada</div>
      <div class="url-output" id="urlOutput"></div>
      <div class="params-grid" id="paramsGrid"></div>
      <div class="copy-row">
        <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copiar URL</button>
        <button class="copy-btn" onclick="addToHistory()" style="border-color:var(--green);color:var(--green)">+ Histórico</button>
        <button class="copy-btn" onclick="clearForm()" style="border-color:var(--muted);color:var(--muted)">Limpar</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" onclick="loadSample()">Exemplo</button>
    </div>
  </div>

  <!-- BULK -->
  <div id="tab-bulk" class="tab-panel">
    <div class="hint" style="margin-bottom:10px">Cole uma URL por linha. Os parâmetros UTM abaixo serão aplicados a todas.</div>
    <div class="form-grid">
      <div>
        <label>Fonte (utm_source)</label>
        <input id="b_source" placeholder="google" oninput="generateBulk()">
      </div>
      <div>
        <label>Mídia (utm_medium)</label>
        <input id="b_medium" placeholder="cpc" oninput="generateBulk()">
      </div>
      <div>
        <label>Campanha (utm_campaign)</label>
        <input id="b_campaign" placeholder="black-friday-2024" oninput="generateBulk()">
      </div>
      <div>
        <label>Conteúdo (utm_content)</label>
        <input id="b_content" placeholder="opcional" oninput="generateBulk()">
      </div>
    </div>
    <div style="margin-top:12px">
      <label>URLs de destino (uma por linha)</label>
      <textarea id="b_urls" class="bulk-textarea" placeholder="https://exemplo.com/pagina-1&#10;https://exemplo.com/pagina-2&#10;https://exemplo.com/pagina-3" oninput="generateBulk()"></textarea>
    </div>
    <div id="bulkResults" class="bulk-results"></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-primary btn-sm" onclick="copyAllBulk()">Copiar todas</button>
      <button class="btn btn-ghost btn-sm" onclick="exportBulkCsv()">Exportar CSV</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" class="tab-panel">
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" onclick="clearHistory()">Limpar histórico</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>
</div>

</main>
<script>
const PRESETS=[
  {label:'Google Ads',source:'google',medium:'cpc'},
  {label:'Meta Ads',source:'facebook',medium:'paid-social'},
  {label:'TikTok',source:'tiktok',medium:'paid-social'},
  {label:'LinkedIn',source:'linkedin',medium:'paid-social'},
  {label:'Display',source:'gdn',medium:'display'},
  {label:'Email',source:'email',medium:'email'},
  {label:'Organic',source:'organic',medium:'social'},
  {label:'Newsletter',source:'newsletter',medium:'email'},
];

let currentTab='single';
let history_=JSON.parse(localStorage.getItem('utm_history')||'[]');
let bulkUrls=[];

function init(){
  renderPresets();
  renderHistory();
  document.documentElement.setAttribute('data-theme',
    localStorage.getItem('utm_theme')||'light');
}

function renderPresets(){
  document.getElementById('presetChips').innerHTML=PRESETS.map((p,i)=>
    `<div class="chip" onclick="applyPreset(${i})">${p.label}</div>`
  ).join('');
}

function applyPreset(i){
  const p=PRESETS[i];
  document.getElementById('source').value=p.source;
  document.getElementById('medium').value=p.medium;
  document.querySelectorAll('#presetChips .chip').forEach((c,ci)=>
    c.classList.toggle('active',ci===i));
  generate();
}

function sanitize(v){return encodeURIComponent(v.trim()).replace(/%20/g,'+')}

function generate(){
  const base=document.getElementById('baseUrl').value.trim();
  const campaign=document.getElementById('campaign').value.trim();
  const source=document.getElementById('source').value.trim();
  const medium=document.getElementById('medium').value.trim();
  const content=document.getElementById('content').value.trim();
  const term=document.getElementById('term').value.trim();
  const uid=document.getElementById('utmId').value.trim();
  const extra=document.getElementById('extra').value.trim();

  if(!base||!source||!medium||!campaign){
    document.getElementById('resultBox').style.display='none';
    return;
  }

  const params=[];
  const paramsList=[];
  if(source){params.push(`utm_source=${sanitize(source)}`);paramsList.push(['utm_source',source]);}
  if(medium){params.push(`utm_medium=${sanitize(medium)}`);paramsList.push(['utm_medium',medium]);}
  if(campaign){params.push(`utm_campaign=${sanitize(campaign)}`);paramsList.push(['utm_campaign',campaign]);}
  if(content){params.push(`utm_content=${sanitize(content)}`);paramsList.push(['utm_content',content]);}
  if(term){params.push(`utm_term=${sanitize(term)}`);paramsList.push(['utm_term',term]);}
  if(uid){params.push(`utm_id=${sanitize(uid)}`);paramsList.push(['utm_id',uid]);}
  if(extra){params.push(extra);paramsList.push(['extra',extra]);}

  const sep=base.includes('?')?'&':'?';
  const url=base+sep+params.join('&');

  document.getElementById('urlOutput').textContent=url;
  document.getElementById('paramsGrid').innerHTML=paramsList.map(([k,v])=>
    `<div class="param-key">${k}</div><div class="param-val">${v}</div>`
  ).join('');
  document.getElementById('resultBox').style.display='block';
  document.getElementById('resultBox')._url=url;
}

function copyUrl(){
  const url=document.getElementById('urlOutput').textContent;
  navigator.clipboard.writeText(url).then(()=>{
    const btn=document.getElementById('copyBtn');
    btn.textContent='✓ Copiado!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copiar URL';btn.classList.remove('copied');},1800);
  });
}

function addToHistory(){
  const url=document.getElementById('urlOutput').textContent;
  if(!url)return;
  history_.unshift({url,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  if(history_.length>50)history_.pop();
  localStorage.setItem('utm_history',JSON.stringify(history_));
  renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!history_.length){el.innerHTML='<div class="empty">Nenhuma URL salva ainda.</div>';return;}
  el.innerHTML=history_.map((h,i)=>`
    <div class="history-item">
      <div class="history-url" title="${h.url}">${h.url}</div>
      <div class="history-time">${h.time}</div>
      <button class="copy-btn" onclick="copyHistoryItem(${i})" style="white-space:nowrap">Copiar</button>
    </div>
  `).join('');
}

function copyHistoryItem(i){
  navigator.clipboard.writeText(history_[i].url).then(()=>{
    const btns=document.querySelectorAll('#historyList .copy-btn');
    if(btns[i]){btns[i].textContent='✓';btns[i].classList.add('copied');
      setTimeout(()=>{btns[i].textContent='Copiar';btns[i].classList.remove('copied');},1500);}
  });
}

function clearHistory(){
  history_=[];localStorage.removeItem('utm_history');renderHistory();
}

// BULK
function buildUtm(url,src,med,camp,cont){
  if(!url.trim())return null;
  const params=[];
  if(src)params.push(`utm_source=${sanitize(src)}`);
  if(med)params.push(`utm_medium=${sanitize(med)}`);
  if(camp)params.push(`utm_campaign=${sanitize(camp)}`);
  if(cont)params.push(`utm_content=${sanitize(cont)}`);
  if(!params.length)return url.trim();
  const sep=url.includes('?')?'&':'?';
  return url.trim()+sep+params.join('&');
}

function generateBulk(){
  const src=document.getElementById('b_source').value.trim();
  const med=document.getElementById('b_medium').value.trim();
  const camp=document.getElementById('b_campaign').value.trim();
  const cont=document.getElementById('b_content').value.trim();
  const raw=document.getElementById('b_urls').value.trim();
  const el=document.getElementById('bulkResults');
  if(!raw){el.innerHTML='';return;}
  const lines=raw.split('\n').filter(l=>l.trim());
  const results=lines.map(l=>buildUtm(l,src,med,camp,cont)).filter(Boolean);
  bulkUrls=results;
  el.innerHTML=results.map((u,i)=>`<div class="bulk-row" onclick="copyBulkRow(${i})" title="Clique para copiar">${u}</div>`).join('');
}

function copyBulkRow(i){
  navigator.clipboard.writeText(bulkUrls[i]).then(()=>{
    const rows=document.querySelectorAll('.bulk-row');
    if(rows[i]){rows[i].style.background='var(--azul)';rows[i].style.color='#fff';
      setTimeout(()=>{rows[i].style.background='';rows[i].style.color='';},1200);}
  });
}

function copyAllBulk(){
  if(!bulkUrls.length)return;
  navigator.clipboard.writeText(bulkUrls.join('\n'));
}

function exportBulkCsv(){
  if(!bulkUrls.length)return;
  const src=document.getElementById('b_source').value.trim();
  const med=document.getElementById('b_medium').value.trim();
  const camp=document.getElementById('b_campaign').value.trim();
  const cont=document.getElementById('b_content').value.trim();
  const raw=document.getElementById('b_urls').value.trim().split('\n').filter(l=>l.trim());
  const rows=[['URL Original','URL com UTM','utm_source','utm_medium','utm_campaign','utm_content']];
  raw.forEach((orig,i)=>{
    if(bulkUrls[i])rows.push([orig.trim(),bulkUrls[i],src,med,camp,cont]);
  });
  const csv=rows.map(r=>r.map(c=>`"${c.replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download='utm-bulk.csv';a.click();
}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    const tabs=['single','bulk','history'];
    el.classList.toggle('active',tabs[i]===t);
  });
  document.querySelectorAll('.tab-panel').forEach(el=>{el.classList.remove('active')});
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='history')renderHistory();
}

function clearForm(){
  ['baseUrl','campaign','source','medium','content','term','utmId','extra']
    .forEach(id=>{document.getElementById(id).value='';});
  document.querySelectorAll('#presetChips .chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('resultBox').style.display='none';
}

function loadSample(){
  document.getElementById('baseUrl').value='https://www.exemplo.com.br/produto/tenis-masculino';
  document.getElementById('source').value='google';
  document.getElementById('medium').value='cpc';
  document.getElementById('campaign').value='tenis-search-2024';
  document.getElementById('content').value='rsa-marca-v2';
  document.getElementById('term').value='tênis masculino';
  document.getElementById('utmId').value='987654';
  generate();
}

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'light';
  const nxt=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nxt);
  localStorage.setItem('utm_theme',nxt);
}

init();
</script>
</body>
</html>
