<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Mix de Mídia — AdOps Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F36C7;--escuro:#1a237e;--light:#e8ecff;--bg:#f0f2ff;--card:#fff;--text:#0d0f1a;--muted:#6b7280;--border:#d1d5ef;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626;--radius:12px;--shadow:0 2px 12px rgba(31,54,199,.08)}
[data-theme="dark"]{--bg:#0d0f1a;--card:#161827;--text:#e8ecff;--muted:#9ca3af;--border:#2a2d4a;--light:#1e2240}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,var(--escuro),var(--azul));color:#fff;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:16px}
.back-btn{color:#fff;text-decoration:none;opacity:.8;font-size:14px}.back-btn:hover{opacity:1}
h1{font-size:1.5rem;font-weight:700}.subtitle{opacity:.8;font-size:.9rem}
.theme-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit}
main{padding:32px 24px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;padding:24px}
.section-title{font-size:1rem;font-weight:700;margin:0 0 12px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--azul)}
.btn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--azul);color:#fff}.btn-primary:hover{background:var(--escuro)}
.btn-secondary{background:var(--light);color:var(--azul);border:1px solid var(--border)}
.btn-sm{padding:6px 14px;font-size:.82rem}
.btn-danger{background:#fee2e2;color:var(--red);border:1px solid #fca5a5}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.channel-row{display:grid;grid-template-columns:2fr 1.5fr 1.2fr 1.2fr 1.2fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.channel-row:last-child{border-bottom:none}
.channel-header{display:grid;grid-template-columns:2fr 1.5fr 1.2fr 1.2fr 1.2fr auto;gap:10px;padding:6px 0;margin-bottom:4px}
.channel-header span{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.channel-row input{padding:7px 10px;font-size:.87rem}
.btn-icon{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.btn-icon:hover{border-color:var(--red);color:var(--red)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.kpi{background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:12px;text-align:center}
.kpi-label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;color:var(--azul)}
.kpi-sub{font-size:.72rem;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:.87rem;margin-top:12px}
th{background:var(--light);color:var(--azul);font-weight:600;padding:10px 14px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.bar-wrap{background:var(--border);border-radius:4px;height:8px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.alloc-warning{font-size:.85rem;color:var(--red);font-weight:600;margin-left:8px}
.alloc-ok{font-size:.85rem;color:var(--green);font-weight:600;margin-left:8px}
canvas{width:100%;border-radius:8px;display:block;margin-top:16px}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.tag-ok{background:#dcfce7;color:var(--green)}.tag-warn{background:#fef9c3;color:var(--yellow)}.tag-bad{background:#fee2e2;color:var(--red)}
[data-theme="dark"] .tag-ok{background:#14532d;color:#86efac}
[data-theme="dark"] .tag-warn{background:#422006;color:#fde047}
[data-theme="dark"] .tag-bad{background:#450a0a;color:#fca5a5}
.info-box{background:var(--light);border-radius:8px;padding:14px 16px;margin:12px 0;font-size:.88rem;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a class="back-btn" href="../">← Ferramentas</a>
    <div>
      <h1>🎛️ Mix de Mídia</h1>
      <div class="subtitle">Distribua budget por canal e compare performance, CPA e eficiência</div>
    </div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙 Tema</button>
</header>
<main>
  <div class="card">
    <div class="section-title">Configuração</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="form-group" style="margin:0">
        <label>Budget total (R$)</label>
        <input type="number" id="budgetTotal" placeholder="100000" oninput="updateAlloc()">
      </div>
      <div class="form-group" style="margin:0">
        <label>Objetivo da campanha</label>
        <select id="objetivo">
          <option value="awareness">Awareness / Alcance</option>
          <option value="consideration">Consideração / Tráfego</option>
          <option value="performance" selected>Performance / Conversão</option>
          <option value="retargeting">Retargeting</option>
        </select>
      </div>
    </div>

    <div class="section-title">Canais</div>
    <div class="channel-header">
      <span>Canal</span><span>Budget (R$)</span><span>CPA alvo (R$)</span><span>Conv. esperadas</span><span>ROAS esperado</span><span></span>
    </div>
    <div id="channelRows"></div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:12px">
      <span style="font-size:.88rem;color:var(--muted)">Alocado: <strong id="totalAlloc">R$ 0</strong></span>
      <span id="allocStatus"></span>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="addChannel()">+ Canal</button>
      <button class="btn btn-primary" onclick="analyze()">Analisar mix</button>
      <button class="btn btn-secondary btn-sm" onclick="loadExample()">Exemplo</button>
    </div>
  </div>

  <div class="card" id="outputCard" style="display:none">
    <div class="section-title">Resultados do mix</div>
    <div class="kpi-grid" id="kpis"></div>
    <canvas id="chart" height="260"></canvas>
    <div id="tableOut" style="margin-top:20px"></div>
    <div id="recBox" class="info-box" style="margin-top:16px"></div>
  </div>
</main>
<script>
const COLORS=['#1F36C7','#7c3aed','#0891b2','#16a34a','#ca8a04','#dc2626','#9333ea','#0d9488'];
let channels=[];let chId=0;

function addChannel(name='',budget='',cpa='',conv='',roas=''){
  const id=chId++;
  channels.push({id});
  const row=document.createElement('div');
  row.className='channel-row';row.id='ch-'+id;
  row.innerHTML=`
    <input type="text" placeholder="ex: Google Search" value="${name}" onchange="channels.find(c=>c.id===${id}).name=this.value" style="font-size:.87rem;padding:7px 10px">
    <input type="number" placeholder="20000" value="${budget}" oninput="channels.find(c=>c.id===${id}).budget=parseFloat(this.value)||0;updateAlloc()" style="font-size:.87rem;padding:7px 10px">
    <input type="number" placeholder="80" value="${cpa}" oninput="channels.find(c=>c.id===${id}).cpa=parseFloat(this.value)||0" style="font-size:.87rem;padding:7px 10px">
    <input type="number" placeholder="250" value="${conv}" oninput="channels.find(c=>c.id===${id}).conv=parseFloat(this.value)||0" style="font-size:.87rem;padding:7px 10px">
    <input type="number" placeholder="4" value="${roas}" step="0.1" oninput="channels.find(c=>c.id===${id}).roas=parseFloat(this.value)||0" style="font-size:.87rem;padding:7px 10px">
    <button class="btn-icon" onclick="removeChannel(${id})">🗑</button>`;
  document.getElementById('channelRows').appendChild(row);
  if(name){channels[channels.length-1].name=name;channels[channels.length-1].budget=parseFloat(budget)||0;channels[channels.length-1].cpa=parseFloat(cpa)||0;channels[channels.length-1].conv=parseFloat(conv)||0;channels[channels.length-1].roas=parseFloat(roas)||0;}
  updateAlloc();
}

function removeChannel(id){
  channels=channels.filter(c=>c.id!==id);
  document.getElementById('ch-'+id).remove();
  updateAlloc();
}

function updateAlloc(){
  // sync all budgets from DOM inputs
  document.querySelectorAll('#channelRows .channel-row').forEach(row=>{
    const id=parseInt(row.id.replace('ch-',''));
    const inputs=row.querySelectorAll('input');
    const ch=channels.find(c=>c.id===id);
    if(ch){ch.name=inputs[0].value;ch.budget=parseFloat(inputs[1].value)||0;ch.cpa=parseFloat(inputs[2].value)||0;ch.conv=parseFloat(inputs[3].value)||0;ch.roas=parseFloat(inputs[4].value)||0;}
  });
  const total=channels.reduce((s,c)=>s+(c.budget||0),0);
  const bt=parseFloat(document.getElementById('budgetTotal').value)||0;
  document.getElementById('totalAlloc').textContent='R$ '+fmt(total);
  const status=document.getElementById('allocStatus');
  if(!bt){status.textContent='';return;}
  const diff=total-bt;
  if(Math.abs(diff)<1){status.innerHTML='<span class="alloc-ok">✅ 100% alocado</span>';}
  else if(diff>0){status.innerHTML=`<span class="alloc-warning">⚠️ R$ ${fmt(diff)} acima do budget</span>`;}
  else{status.innerHTML=`<span class="alloc-warning">📉 R$ ${fmt(-diff)} ainda não alocado</span>`;}
}

function analyze(){
  updateAlloc();
  const bt=parseFloat(document.getElementById('budgetTotal').value)||0;
  const chs=channels.filter(c=>c.budget>0);
  if(!chs.length)return;
  const totalBudget=chs.reduce((s,c)=>s+c.budget,0);
  const totalConv=chs.reduce((s,c)=>s+c.conv,0);
  const totalRec=chs.reduce((s,c)=>s+c.budget*(c.roas||0),0);
  const blendedCPA=totalConv?totalBudget/totalConv:0;
  const blendedROAS=totalBudget?totalRec/totalBudget:0;
  document.getElementById('outputCard').style.display='block';
  document.getElementById('kpis').innerHTML=[
    {l:'Budget total',v:'R$ '+fmt(totalBudget),s:`${bt?((totalBudget/bt)*100).toFixed(1)+'% do budget':'—'}`},
    {l:'Canais ativos',v:chs.length,s:'no mix'},
    {l:'Conversões est.',v:fmt(totalConv),s:blendedCPA?'CPA blend R$ '+fmt(blendedCPA):'—'},
    {l:'ROAS blended',v:blendedROAS?blendedROAS.toFixed(2)+'×':'—',s:'receita est. R$ '+fmt(totalRec)},
  ].map(k=>`<div class="kpi"><div class="kpi-label">${k.l}</div><div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join('');
  drawChart(chs,totalBudget);
  const minCPA=Math.min(...chs.filter(c=>c.cpa>0).map(c=>c.cpa));
  const maxROAS=Math.max(...chs.filter(c=>c.roas>0).map(c=>c.roas));
  document.getElementById('tableOut').innerHTML=`<table><thead><tr><th>Canal</th><th>Budget</th><th>% Mix</th><th>CPA alvo</th><th>Conv.</th><th>ROAS</th><th>Eficiência CPA</th></tr></thead><tbody>${chs.map((c,i)=>{
    const pct=(c.budget/totalBudget*100).toFixed(1);
    const eff=c.cpa&&minCPA?c.cpa<=minCPA*1.2?'tag-ok':c.cpa<=minCPA*2?'tag-warn':'tag-bad':'';
    const color=COLORS[i%COLORS.length];
    return`<tr>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px"></span>${c.name||'Canal '+(i+1)}</td>
      <td>R$ ${fmt(c.budget)}</td>
      <td><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>${pct}%</td>
      <td>${c.cpa?'R$ '+fmt(c.cpa):'—'}</td>
      <td>${c.conv?fmt(c.conv):'—'}</td>
      <td>${c.roas?c.roas.toFixed(2)+'×':'—'}</td>
      <td>${eff?`<span class="tag ${eff}">${c.cpa<=minCPA*1.2?'Eficiente':c.cpa<=minCPA*2?'Médio':'Alto CPA'}</span>`:'—'}</td>
    </tr>`;}).join('')}</tbody></table>`;
  // recommendation
  const objetivo=document.getElementById('objetivo').value;
  const best=chs.filter(c=>c.cpa>0).sort((a,b)=>a.cpa-b.cpa)[0];
  const worst=chs.filter(c=>c.cpa>0).sort((a,b)=>b.cpa-a.cpa)[0];
  let rec='';
  if(best&&worst&&best.id!==worst.id){rec=`<strong>Recomendação:</strong> Para objetivo de ${objetivo}, <strong>${best.name||'melhor canal'}</strong> tem o menor CPA (R$ ${fmt(best.cpa)}). Considere realocar verba de <strong>${worst.name||'pior canal'}</strong> (CPA R$ ${fmt(worst.cpa)}) para canais mais eficientes.`;}
  else{rec='Preencha CPA alvo e conversões esperadas em cada canal para ver recomendações de otimização.';}
  document.getElementById('recBox').innerHTML=`💡 ${rec}`;
}

function drawChart(chs,total){
  const canvas=document.getElementById('chart');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth*2;canvas.height=520;ctx.scale(2,2);
  const W=canvas.offsetWidth/2,H=260;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  ctx.fillRect(0,0,W,H);
  const pad={l:50,r:20,t:20,b:40};
  const bw=(W-pad.l-pad.r)/chs.length*0.6;
  const gap=(W-pad.l-pad.r)/chs.length;
  const maxBudget=Math.max(...chs.map(c=>c.budget));
  function ry(v){return pad.t+(H-pad.t-pad.b)*(1-v/maxBudget);}
  // grid
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  ctx.lineWidth=0.5;ctx.setLineDash([4,3]);
  for(let i=0;i<=4;i++){
    const y=pad.t+(H-pad.t-pad.b)*(i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    ctx.font='10px Space Grotesk';ctx.textAlign='right';
    ctx.fillText('R$'+fmtK(maxBudget*(1-i/4)),pad.l-4,y+4);
  }
  ctx.setLineDash([]);
  chs.forEach((c,i)=>{
    const x=pad.l+gap*i+(gap-bw)/2;
    const y=ry(c.budget);
    const barH=H-pad.b-y;
    const color=COLORS[i%COLORS.length];
    ctx.fillStyle=color+'cc';
    ctx.beginPath();ctx.roundRect(x,y,bw,barH,4);ctx.fill();
    ctx.fillStyle=color;ctx.font='bold 10px Space Grotesk';ctx.textAlign='center';
    ctx.fillText('R$'+fmtK(c.budget),x+bw/2,y-5);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    ctx.font='9px Space Grotesk';
    const lbl=c.name||'Canal '+(i+1);
    ctx.fillText(lbl.length>10?lbl.slice(0,9)+'…':lbl,x+bw/2,H-pad.b+14);
  });
}

function loadExample(){
  document.getElementById('budgetTotal').value=120000;
  document.getElementById('objetivo').value='performance';
  document.getElementById('channelRows').innerHTML='';
  channels=[];chId=0;
  addChannel('Google Search',35000,65,538,4.2);
  addChannel('Meta Ads',30000,80,375,3.8);
  addChannel('YouTube',20000,120,166,3.0);
  addChannel('TikTok Ads',15000,95,157,3.5);
  addChannel('Display',12000,180,66,2.5);
  addChannel('LinkedIn',8000,210,38,2.0);
  updateAlloc();
}

function fmt(n){return Number(Math.round(n)).toLocaleString('pt-BR');}
function fmtK(v){return v>=1000?(v/1000).toFixed(0)+'K':v.toFixed(0);}
function toggleTheme(){const d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'':'dark');try{localStorage.setItem('theme',d.getAttribute('data-theme'));}catch{}}
(()=>{try{const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch{}})();
// init with 3 empty rows
addChannel();addChannel();addChannel();
</script>
</body>
</html>
