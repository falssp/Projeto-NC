<title>NC Vocab Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#ffffff;--bg2:#f8fafc;--bg3:#f1f5f9;
    --border:#e2e8f0;--border2:#cbd5e1;
    --fg:#0f172a;--fg2:#475569;--fg3:#94a3b8;
    --accent:#0d9488;--accent-bg:#f0fdfa;--accent-border:#99f6e4;
    --radius:10px;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
    --border:#334155;--border2:#475569;
    --fg:#f1f5f9;--fg2:#94a3b8;--fg3:#64748b;
    --accent:#2dd4bf;--accent-bg:#042f2e;--accent-border:#134e4a;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
    --border:#334155;--border2:#475569;
    --fg:#f1f5f9;--fg2:#94a3b8;--fg3:#64748b;
    --accent:#2dd4bf;--accent-bg:#042f2e;--accent-border:#134e4a;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
  .header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .header-left{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
  .title{font-size:16px;font-weight:700}
  .subtitle{font-size:12px;color:var(--fg2)}
  .btn-theme{background:none;border:1px solid var(--border2);border-radius:6px;color:var(--fg2);cursor:pointer;font-size:14px;padding:4px 8px}
  .btn-theme:hover{background:var(--bg3)}
  .workspace{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:calc(100vh - 73px)}
  @media(max-width:800px){.workspace{grid-template-columns:1fr}}
  .panel{padding:20px 24px;border-right:1px solid var(--border)}
  .panel:last-child{border-right:none}
  .sec{font-size:11px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:16px}
  .sec:first-child{margin-top:0}
  label{font-size:12px;color:var(--fg2);font-weight:500;display:block;margin-bottom:4px}
  input[type=text],input[type=number],select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:12px;padding:6px 10px;outline:none;font-family:inherit}
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
  textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:12px;padding:12px;resize:vertical;outline:none;line-height:1.6}
  textarea:focus{border-color:var(--accent)}
  textarea::placeholder{color:var(--fg3)}
  .btn{border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;transition:.15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{opacity:.88}
  .btn-secondary{background:var(--bg3);border:1px solid var(--border2);color:var(--fg2)}
  .btn-secondary:hover{background:var(--bg2)}
  .btn-sm{font-size:11px;padding:4px 10px;font-weight:500}
  .btn-xs{font-size:10px;padding:3px 8px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  /* pos tabs */
  .pos-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .pos-tab{background:var(--bg2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;padding:4px 10px;font-family:inherit;color:var(--fg2)}
  .pos-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  /* vocab list */
  .vocab-table{width:100%;border-collapse:collapse;margin-top:4px}
  .vocab-table th{background:var(--bg3);font-size:11px;color:var(--fg2);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
  .vocab-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  .vocab-table tr:last-child td{border-bottom:none}
  .vocab-table input[type=text]{border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:4px}
  .vocab-table input[type=text]:focus{border-color:var(--accent);background:var(--bg)}
  .del-btn{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:14px;padding:0 4px}
  .del-btn:hover{color:#ef4444}
  /* from-nc panel */
  .kpi-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex:1;min-width:70px}
  .kpi-val{font-size:18px;font-weight:700;line-height:1}
  .kpi-lbl{font-size:10px;color:var(--fg2);margin-top:2px}
  .kpi.teal{border-color:var(--accent-border);background:var(--accent-bg)}
  .kpi.teal .kpi-val{color:var(--accent)}
  /* coverage */
  .cov-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
  .cov-row:last-child{border-bottom:none}
  .cov-label{font-size:11px;color:var(--fg2);min-width:50px}
  .cov-bar{flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
  .cov-fill{height:100%;border-radius:5px;background:var(--accent)}
  .cov-cnt{font-size:11px;color:var(--fg2);min-width:28px;text-align:right;font-family:'JetBrains Mono',monospace}
  .unknown-chip{background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 7px;cursor:pointer;display:inline-block;margin:2px}
  .unknown-chip:hover{border-color:var(--accent)}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:999}
  #toast.show{opacity:1}
</style>

<div class="header">
  <div class="header-left">
    <div class="logo">📚</div>
    <div>
      <div class="title">NC Vocab Builder</div>
      <div class="subtitle">Dicionário de valores permitidos por posição · verifica cobertura em NCs existentes</div>
    </div>
  </div>
  <button class="btn-theme" onclick="toggleTheme()">◑</button>
</div>

<div class="workspace">
  <!-- LEFT: vocab editor -->
  <div class="panel">
    <div class="sec">Vocabulário por Posição</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1">
        <label>Separador</label>
        <input id="cfgSep" type="text" value="_" maxlength="3" style="width:60px;font-family:'JetBrains Mono',monospace">
      </div>
      <div>
        <label>Posições</label>
        <input id="cfgPos" type="number" min="1" max="12" value="6" style="width:60px">
      </div>
      <button class="btn btn-secondary btn-sm" onclick="rebuildTabs()">Atualizar</button>
    </div>

    <div class="pos-tabs" id="posTabs"></div>
    <div id="vocabPanel"></div>

    <div class="actions">
      <button class="btn btn-secondary btn-sm" onclick="addRow()">+ Termo</button>
      <button class="btn btn-secondary btn-sm" onclick="clearPos()">Limpar posição</button>
      <button class="btn btn-primary btn-sm" onclick="saveVocab()">💾 Salvar vocab</button>
    </div>

    <div class="sec" style="margin-top:20px">Importar de NCs existentes</div>
    <div style="margin-bottom:8px">
      <label>Cole NCs para extrair valores (uma por linha)</label>
      <textarea id="importInput" rows="5" placeholder="camp_perf_app_venda_q1_stories&#10;camp_brand_web_lanc_q2_feed&#10;..."></textarea>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="importFromNCs()">↑ Extrair para vocab</button>
  </div>

  <!-- RIGHT: coverage check -->
  <div class="panel">
    <div class="sec">Verificar Cobertura</div>
    <div style="margin-bottom:8px">
      <label>NCs a verificar (uma por linha)</label>
      <textarea id="checkInput" rows="8" placeholder="Cole NCs aqui para ver quais valores estão fora do vocab..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="checkCoverage()">🔎 Verificar</button>

    <div id="coverageResults" style="margin-top:16px"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const STORE_KEY = 'ncvocab_v2';
let vocab = {};      // { posIdx: { term: description } }
let numPos = 6;
let activePos = 0;

function loadVocab() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    vocab = saved.vocab || {};
    numPos = saved.numPos || 6;
    document.getElementById('cfgPos').value = numPos;
  } catch(e) {}
}

function saveVocab() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ vocab, numPos }));
    showToast('Vocab salvo!');
  } catch(e) { showToast('Erro ao salvar'); }
}

function rebuildTabs() {
  numPos = parseInt(document.getElementById('cfgPos').value) || 6;
  if (activePos >= numPos) activePos = 0;
  renderTabs();
  renderVocabPanel();
}

function renderTabs() {
  const container = document.getElementById('posTabs');
  container.innerHTML = '';
  for (let i = 0; i < numPos; i++) {
    const btn = document.createElement('button');
    btn.className = 'pos-tab' + (i === activePos ? ' active' : '');
    const cnt = vocab[i] ? Object.keys(vocab[i]).length : 0;
    btn.textContent = `P${i+1}${cnt ? ` (${cnt})` : ''}`;
    btn.onclick = () => { activePos = i; renderTabs(); renderVocabPanel(); };
    container.appendChild(btn);
  }
}

function renderVocabPanel() {
  const entries = vocab[activePos] ? Object.entries(vocab[activePos]) : [];
  let html = `<table class="vocab-table">
    <thead><tr><th>Valor</th><th>Descrição (opcional)</th><th></th></tr></thead>
    <tbody id="vocabBody">`;
  entries.forEach(([term, desc], i) => {
    html += `<tr>
      <td><input type="text" value="${esc(term)}" data-idx="${i}" data-field="term" onchange="updateEntry(${i},this)" style="font-family:'JetBrains Mono',monospace"></td>
      <td><input type="text" value="${esc(desc)}" data-idx="${i}" data-field="desc" onchange="updateEntry(${i},this)"></td>
      <td><button class="del-btn" onclick="delEntry('${esc(term)}')">×</button></td>
    </tr>`;
  });
  if (!entries.length) {
    html += `<tr><td colspan="3" style="font-size:11px;color:var(--fg3);padding:8px 10px">Nenhum termo. Adicione ou importe de NCs.</td></tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById('vocabPanel').innerHTML = html;
}

function addRow() {
  if (!vocab[activePos]) vocab[activePos] = {};
  vocab[activePos][''] = '';
  renderVocabPanel();
}

function updateEntry(idx, input) {
  const entries = Object.entries(vocab[activePos] || {});
  const [oldTerm, oldDesc] = entries[idx] || ['',''];
  const newVal = input.value;
  const field = input.getAttribute('data-field');
  if (field === 'term') {
    delete vocab[activePos][oldTerm];
    vocab[activePos][newVal] = oldDesc;
  } else {
    vocab[activePos][oldTerm] = newVal;
  }
}

function delEntry(term) {
  if (vocab[activePos]) {
    delete vocab[activePos][term];
    renderTabs();
    renderVocabPanel();
  }
}

function clearPos() {
  vocab[activePos] = {};
  renderTabs();
  renderVocabPanel();
}

function importFromNCs() {
  const raw = document.getElementById('importInput').value.trim();
  if (!raw) { showToast('Cole NCs!'); return; }
  const sep = document.getElementById('cfgSep').value || '_';
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(nc => {
    nc.split(sep).forEach((seg, i) => {
      if (i >= numPos || !seg) return;
      if (!vocab[i]) vocab[i] = {};
      if (!vocab[i][seg]) { vocab[i][seg] = ''; added++; }
    });
  });
  saveVocab();
  renderTabs();
  renderVocabPanel();
  showToast(`${added} termos novos adicionados`);
}

function checkCoverage() {
  const raw = document.getElementById('checkInput').value.trim();
  if (!raw) { showToast('Cole NCs!'); return; }
  const sep = document.getElementById('cfgSep').value || '_';
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);

  const perPos = {};
  for (let i = 0; i < numPos; i++) {
    perPos[i] = { known: 0, unknown: 0, unknownVals: new Set() };
  }

  lines.forEach(nc => {
    nc.split(sep).forEach((seg, i) => {
      if (i >= numPos) return;
      const dict = vocab[i] || {};
      if (dict[seg] !== undefined) perPos[i].known++;
      else { perPos[i].unknown++; perPos[i].unknownVals.add(seg); }
    });
  });

  const total = lines.length;
  let html = `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val">${total}</div><div class="kpi-lbl">NCs verificadas</div></div>
    <div class="kpi teal"><div class="kpi-val">${numPos}</div><div class="kpi-lbl">posições</div></div>
  </div>`;

  for (let i = 0; i < numPos; i++) {
    const p = perPos[i];
    const posTotal = p.known + p.unknown;
    if (!posTotal) continue;
    const pct = Math.round(p.known/posTotal*100);
    html += `<div class="cov-row">
      <span class="cov-label">P${i+1}</span>
      <div class="cov-bar"><div class="cov-fill" style="width:${pct}%"></div></div>
      <span class="cov-cnt">${pct}%</span>
    </div>`;
    if (p.unknownVals.size > 0) {
      html += `<div style="padding:4px 0 8px 58px;display:flex;flex-wrap:wrap;gap:3px">`;
      for (const v of [...p.unknownVals].slice(0, 20)) {
        html += `<span class="unknown-chip" onclick="addToVocab(${i},'${esc(v)}')" title="Clique para adicionar ao vocab">${esc(v)}</span>`;
      }
      if (p.unknownVals.size > 20) html += `<span style="font-size:10px;color:var(--fg3);padding:4px">+${p.unknownVals.size-20} mais</span>`;
      html += `</div>`;
    }
  }

  document.getElementById('coverageResults').innerHTML = html;
}

function addToVocab(posIdx, term) {
  if (!vocab[posIdx]) vocab[posIdx] = {};
  vocab[posIdx][term] = '';
  saveVocab();
  renderTabs();
  if (activePos === posIdx) renderVocabPanel();
  showToast(`"${term}" adicionado à P${posIdx+1}`);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');}

loadVocab();
renderTabs();
renderVocabPanel();
</script>
