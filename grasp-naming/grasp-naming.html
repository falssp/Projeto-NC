<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estrutura de Naming — Grasp 2026 · Unilever BR</title>
<style>
:root{
  --ul-blue:#1F36C7;--ul-dark:#0d1b6e;--surface:#f5f6fb;--border:#dde1f0;
  --text:#1a1a2e;--muted:#6b7299;--accent:#eef0fb;
  --c-badge:#fff3cd;--a-badge:#d4edda;--n-badge:#fce4ec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--surface);color:var(--text);font-size:14px}
header{background:var(--ul-dark);color:#fff;padding:18px 24px 14px}
header h1{font-size:18px;font-weight:700}
header p{font-size:12px;color:#aab2d8;margin-top:3px}
.toolbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{height:34px;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:0 10px;min-width:160px}
.toolbar input:focus{outline:none;border-color:var(--ul-blue)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--ul-blue);color:#fff;border-color:var(--ul-blue)}
.main{padding:14px 16px 40px;max-width:1000px;margin:0 auto}
.plat-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.plat-header{padding:12px 16px;background:var(--accent);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer}
.plat-name{font-weight:700;font-size:14px;color:var(--ul-dark);flex:1}
.plat-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--ul-blue);color:#fff;font-weight:600}
.toggle{font-size:16px;color:var(--muted);user-select:none}
.plat-body{display:none;padding:14px 16px}
.plat-body.open{display:block}
.level{margin-bottom:12px}
.level-label{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.formula{font-family:Consolas,monospace;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;line-height:1.7;word-break:break-all}
.formula .seg{display:inline-block;margin:1px 2px;padding:1px 5px;border-radius:3px;font-size:11px}
.seg-c{background:var(--c-badge);color:#856404}
.seg-a{background:var(--a-badge);color:#155724}
.seg-n{background:var(--n-badge);color:#880e4f}
.sep{color:#999;font-size:10px;margin:0 1px}
.ft-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ft-tag{font-size:10px;padding:2px 7px;border-radius:4px;background:#f0f4ff;color:#3a4cc0;border:1px solid #c5cdf5}
.empty-note{font-size:12px;color:var(--muted);font-style:italic}
.legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:12px;height:12px;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>Estrutura de Naming — Grasp 2026</h1>
  <p>Fórmulas de Campaign, Ad Group e Ad Name por plataforma · Unilever BR</p>
</header>
<div class="toolbar">
  <input type="text" id="q" placeholder="Filtrar plataforma…" oninput="render()">
  <div class="pills" id="pills"></div>
</div>
<div class="main">
  <div class="legend">
    <span class="leg-item"><span class="leg-dot" style="background:#fff3cd"></span>Campo Galileo (sistema)</span>
    <span class="leg-item"><span class="leg-dot" style="background:#d4edda"></span>Campo da Plataforma</span>
    <span class="leg-item"><span class="leg-dot" style="background:#fce4ec"></span>Freetext / Manual</span>
  </div>
  <div id="main"></div>
</div>

  },
  {

    group: "YouTube",
    campaign: ["CN-Code","Campaign-Name","Market-Short-Name-(PCat)","Brand-Name","Buy-Model","Objective","CampaignLocal"],
    campFT: ["Brandlift-YesorNo","Pilar-da-Campanha","MidiaCampaignLocal-Extra"],
    adgroup: ["Audience-Party","Audience-Name","Gender","Age-(lower-upper)","BuyModel"],
    adgroupFT: ["ObjetivodeOtimização","Publisher","BuyingType","LocationType","Location","Midiagroup-Extra"],

    adnameFT: ["Position","InfluencerorBrand","InfluencerName","Brandlift-YesorNo","Pilar-da-Campanha","MidiaName-Extra"]
  },

    group: "Social",

  },

    campaign: ["CN-Code","Campaign-Name","Market-Short-Name-(PCat)","Brand-Name","Buy-Model","Objective","CampaignLocal"],
    campFT: ["Brandlift-YesorNo","Pilar-da-Campanha","amplify"],
    adgroup: ["Audience-Party","Audience-Name","Gender","Age-(lower-upper)","Placement-Type","Device-Type","CampaignLocal"],
    adgroupFT: ["ObjetivodeOtimização","Publisher","BuyingType","LocationType","Location","Midiagroup-Extra"],

    adnameFT: ["Position","InfluencerorBrand","Brandlift-YesorNo","Pilar-da-Campanha","MidiaName-Extra"]
  },
  {

    campaign: ["CN-Code","Campaign-Name","Brand-Name","Market-Short-Name-(PCat)","Objective","CampaignLocal"],

    adgroup: null, adgroupFT:[],
    adname: ["CN-Code","Campaign-Name","Market-Short-Name-(PCat)","Placement-Type","Creative-Name","Landing-Page-Type","Retailer","Objective","CampaignLocal"],
    adnameFT: ["MidiaCampaignLocal-Extra","ObjetivodeOtimização","Publisher","BuyingType","Location-Type","Location","AudienceType","MidiaGroup-Extra","FormatType","Position","Influencer-or-Brand","InfluencerName","Brandlift-YesorNo","Seconds","Pilar-da-Campanha","MidiaName-Extra"]
  },

    adgroup: ["Audience-Party","Audience-Name","Gender","Age-(lower-upper)","Placement-Type","Device-Type","CampaignLocal"],
    adgroupFT: ["ObjetivodeOtimização","Publisher","BuyingType","LocationType","Location","Midiagroup-Extra"],
    adname: ["Placement-Type","Format-Size","Creative-Name","Landing-Page-Type","Retailer","Influencer"],
    adnameFT: ["Position","InfluencerorBrand","[Influencer-Handle]","Brandlift-YesorNo","Pilar-da-Campanha","MidiaName-Extra"]
  },
];

const GROUPS = [...new Set(PLATS.map(p=>p.group))];
let activeGroup = null;
let openSet = new Set();

function buildPills(){
  const el = document.getElementById('pills');
  el.innerHTML = '';
  function p(label, g){
    const btn = document.createElement('button');
    btn.className = 'pill'+(activeGroup===g?' on':'');
    btn.textContent = label;
    btn.onclick = ()=>{ activeGroup=(activeGroup===g?null:g); render(); };
    el.appendChild(btn);
  }
  p('Todos', null);
  GROUPS.forEach(g=>p(g,g));
}

function formatFormula(segs, type){
  // type: 'g'=galileo(amarelo), 'p'=plataforma(verde)
  return segs.map(s=>`<span class="seg seg-${type}">${s}</span><span class="sep">_</span>`).join('').replace(/<span class="sep">_<\/span>$/,'');
}

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  let html = '';
  PLATS
    .filter(p=>!activeGroup||p.group===activeGroup)
    .filter(p=>!q||p.name.toLowerCase().includes(q)||p.group.toLowerCase().includes(q))
    .forEach(p=>{
      const id = p.name;
      const isOpen = openSet.has(id);
      let body = '';

      // Campaign
      body += '<div class="level"><div class="level-label">CAMPAIGN / INSERTION ORDER</div><div class="formula">';
      if(p.campaign) body += formatFormula(p.campaign,'c');
      if(p.campFT && p.campFT.length){
        body += '<br><span style="color:#999;font-size:10px">Flashtalking fields: </span>';
        body += formatFormula(p.campFT,'n');
      }
      body += '</div></div>';

      // Ad Group
      body += '<div class="level"><div class="level-label">AD GROUP / LINE ITEM</div><div class="formula">';
      if(p.adgroup) body += formatFormula(p.adgroup,'a');
      else body += '<span class="empty-note">Não possui Ad Group</span>';
      if(p.adgroupFT && p.adgroupFT.length){
        body += '<br><span style="color:#999;font-size:10px">Flashtalking fields: </span>';
        body += formatFormula(p.adgroupFT,'n');
      }
      body += '</div></div>';

      // Ad Name
      body += '<div class="level"><div class="level-label">AD NAME / CREATIVE</div><div class="formula">';
      if(p.adname) body += formatFormula(p.adname,'a');
      else body += '<span class="empty-note">Não possui Ad Name</span>';
      if(p.adnameFT && p.adnameFT.length){
        body += '<br><span style="color:#999;font-size:10px">Flashtalking fields: </span>';
        body += formatFormula(p.adnameFT,'n');
      }
      body += '</div></div>';

      html += `<div class="plat-card">
        <div class="plat-header" data-id="${id}">
          <div class="plat-name">${p.name}</div>
          <span class="plat-badge">${p.group}</span>
          <span class="toggle">${isOpen?'▲':'▼'}</span>
        </div>
        <div class="plat-body${isOpen?' open':''}">${body}</div>
      </div>`;
    });

  document.getElementById('main').innerHTML = html || '<p style="color:var(--muted);padding:20px">Nenhuma plataforma encontrada.</p>';
  document.querySelectorAll('.plat-header').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      openSet.has(id)?openSet.delete(id):openSet.add(id);
      render();
    };
  });
  buildPills();
}

buildPills();
render();
</script>
</body>
</html>
