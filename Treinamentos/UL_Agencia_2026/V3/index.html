<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>UL | Treinamento Agência V3 — Em breve — StormX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#14D7FF;--amber:#FFAB40;--muted:#83869A;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#1B1C27;}
  body{font-family:'Inter',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .center{text-align:center;max-width:480px;padding:2rem;}
  .mark{display:inline-flex;flex-direction:column;gap:3px;width:32px;margin:0 auto 1.5rem;}
  .mark span{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.4);}
  .mark span:nth-child(1){width:100%;}.mark span:nth-child(2){width:70%;}.mark span:nth-child(3){width:45%;}
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;margin-bottom:.3rem;color:rgba(255,255,255,.4);}
  .wordmark span{color:rgba(20,215,255,.5);}
  .badge{display:inline-block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);border-radius:999px;padding:.35rem 1rem;font-size:.78rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:.5px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;color:rgba(255,255,255,.35);margin:0 0 .8rem;}
  p{color:rgba(176,180,200,.5);line-height:1.6;margin:0 0 2rem;font-size:.9rem;}
  .icon{font-size:3rem;margin-bottom:1rem;opacity:.3;}
  .back{display:inline-flex;align-items:center;gap:.5rem;color:rgba(20,215,255,.5);font-size:.82rem;text-decoration:none;border-bottom:1px solid rgba(20,215,255,.2);padding-bottom:2px;}
  .back:hover{color:var(--cyan);border-bottom-color:var(--cyan);}
</style>
</head>
<body>
<div class="center">
  <div class="mark"><span></span><span></span><span></span></div>
  <div class="wordmark">Storm<span>X</span></div>
  <div class="badge">VERSÃO 3 — EM BREVE</div>
  <div class="icon">🔒</div>
  <h1>Treinamento Agência V3</h1>
  <p>Esta versão ainda está sendo preparada. Volte em breve para acessar o conteúdo atualizado.</p>
  <a class="back" href="../V1/index.html">← Acessar V1</a>
</div>
</body>
</html>
