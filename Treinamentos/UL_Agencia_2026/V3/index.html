<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=v2/">
<title>Treinamento Taxonomia RROI — UL Agência 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1C1E2E;color:#fff;font-family:'Inter',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:32px;padding:24px}
h1{font-size:1.1rem;color:rgba(255,255,255,.5);font-weight:400;text-align:center}
.versions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
a.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:28px 40px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;text-decoration:none;color:#fff;
  transition:background .2s,border-color .2s;min-width:160px;
}
a.card:hover{background:rgba(255,255,255,.12);border-color:rgba(20,215,255,.4)}
a.card.latest{border-color:rgba(20,215,255,.35)}
.tag{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
  background:#14D7FF;color:#1C1E2E;border-radius:4px;padding:2px 7px;font-weight:700}
.ver{font-size:2rem;font-weight:700;line-height:1}
.label{font-size:.8rem;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<h1>Treinamento Taxonomia RROI — UL Agência 2026</h1>
<div class="versions">
  <a class="card latest" href="v2/">
    <span class="tag">Atual</span>
    <span class="ver">v2</span>
    <span class="label">Versão corrigida</span>
  </a>
  <a class="card" href="v1/">
    <span class="ver">v1</span>
    <span class="label">Versão anterior</span>
  </a>
</div>
</body>
</html>
