<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Updates & Processos Unilever — StormX 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#494C67;--navy-deep:#3B3D54;--cyan:#14D7FF;--amber:#FFAB40;
  --bg:#1C1E2E;--ctrl-h:52px;
}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif;overflow:hidden}

/* ── VIEWER ── */
#viewer{
  position:fixed;inset:0;bottom:var(--ctrl-h);
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
#viewer img{
  display:none;
  max-width:100%;max-height:100%;
  object-fit:contain;
  width:100%;height:100%;
}
#viewer img.active{display:block}

/* ── PROGRESS BAR ── */
#pbar{
  position:fixed;top:0;left:0;height:3px;
  background:var(--cyan);width:0;
  transition:width .3s ease;z-index:10;
}

/* ── CONTROLS ── */
#ctrl{
  position:fixed;bottom:0;left:0;right:0;height:var(--ctrl-h);
  background:rgba(28,30,46,.97);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:0 12px;z-index:20;
}
.nb{
  background:none;border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:6px;padding:5px 14px;
  font-size:1rem;cursor:pointer;transition:background .15s;
  font-family:inherit;
}
.nb:hover{background:rgba(255,255,255,.1)}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:60vw}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.25);cursor:pointer;
  transition:background .2s,transform .2s;flex-shrink:0;
}
.dot.active{background:var(--cyan);transform:scale(1.3)}
#ctr{
  font-size:.75rem;color:rgba(255,255,255,.55);
  white-space:nowrap;min-width:52px;text-align:center;
  font-variant-numeric:tabular-nums;
}
#fsBtn{
  background:none;border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.7);border-radius:6px;
  padding:5px 10px;font-size:.85rem;cursor:pointer;
  font-family:inherit;transition:background .15s;
}
#fsBtn:hover{background:rgba(255,255,255,.1)}

/* ── FULLSCREEN ── */
:fullscreen #ctrl,:-webkit-full-screen #ctrl{display:flex}
:fullscreen #viewer,:-webkit-full-screen #viewer{bottom:var(--ctrl-h)}
</style>
</head>
<body>

<div id="pbar"></div>

<div id="ctrl">
  <button class="nb" id="prev">&#8592;</button>
  <div id="dots"></div>
  <span id="ctr">1 / 51</span>
  <button class="nb" id="next">&#8594;</button>
  <button id="fsBtn" title="Tela cheia">&#x26F6;</button>
</div>

<script>
const TOTAL=51;
let cur=0;
const imgs=document.querySelectorAll('#viewer img');
const dots=document.getElementById('dots');
const pbar=document.getElementById('pbar');
const ctr=document.getElementById('ctr');

// preload next slide
function preload(n){if(n>=0&&n<TOTAL)imgs[n].src=imgs[n].src;}

// build dots
for(let i=0;i<TOTAL;i++){
  const d=document.createElement('span');
  d.className='dot'+(i===0?' active':'');
  d.addEventListener('click',()=>go(i));
  dots.appendChild(d);
}

function go(n){
  if(n<0||n>=TOTAL||n===cur)return;
  imgs[cur].classList.remove('active');
  cur=n;
  imgs[cur].classList.add('active');
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
  pbar.style.width=((cur+1)/TOTAL*100)+'%';
  ctr.textContent=(cur+1)+' / '+TOTAL;
  preload(cur+1);preload(cur-1);
}

document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.getElementById('fsBtn').addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.addEventListener('keydown',e=>{
  if(['ArrowRight',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  if(e.key==='f')document.getElementById('fsBtn').click();
});

let tx=0;
document.getElementById('viewer').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('viewer').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40)go(dx<0?cur+1:cur-1);
},{passive:true});

pbar.style.width=(1/TOTAL*100)+'%';
preload(1);
</script>
</body>
</html>
