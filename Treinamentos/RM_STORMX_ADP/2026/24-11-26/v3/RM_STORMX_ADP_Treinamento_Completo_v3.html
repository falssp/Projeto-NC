<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM STORMX ADP — Treinamento Completo v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #0D0D14;
  --bg2:      #12121C;
  --bg3:      #1A1A28;
  --surface:  #1E1E2E;
  --border:   #2A2A3E;
  --teal:     #4FE0C8;
  --blue:     #3FB6FF;
  --purple:   #6C7BFF;
  --violet:   #A35CFF;
  --lilac:    #E08BFF;
  --yellow:   #EBFF24;
  --white:    #F7F7F4;
  --muted:    #CFCBE0;
  --dim:      #7A7898;
  --amber:    #FFAB40;

  --slide-w: 1280px;
  --slide-h: 720px;
  --nav-h: 52px;
}

/* ─── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--white);
}

/* ─── LAYOUT ─────────────────────────────────────────────── */
#deck {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
}
#viewport {
  flex: 1;
  position: relative;
  overflow: hidden;
  padding: 0;
}
#scaler {
  position: absolute;
  top: 50%; left: 50%;
  width: var(--slide-w);
  height: var(--slide-h);
  transform-origin: center center;
}

/* ─── NAV BAR ────────────────────────────────────────────── */
#navbar {
  height: var(--nav-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}
.nav-brand {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: .08em;
  color: var(--teal);
  text-transform: uppercase;
  margin-right: 4px;
}
.nav-sep { width: 1px; height: 20px; background: var(--border); }
#counter {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px; font-weight: 500;
  color: var(--muted); min-width: 48px;
}
#progress-track {
  flex: 1; height: 2px;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
#progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--teal), var(--blue));
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
#dots {
  display: flex; gap: 5px; align-items: center;
}
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--border); transition: background .2s, transform .2s;
  cursor: pointer;
}
.dot.active { background: var(--teal); transform: scale(1.5); }
.nav-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
  flex-shrink: 0;
}
.nav-btn:hover { background: var(--border); color: var(--white); }
.nav-btn svg { width: 14px; height: 14px; pointer-events: none; }
#fsBtn { margin-left: 4px; }

/* ─── SLIDE BASE ─────────────────────────────────────────── */
.slide {
  position: absolute; inset: 0;
  background: var(--bg);
  overflow: hidden;
  opacity: 0; pointer-events: none;
  transform: translateX(32px);
  transition: opacity .35s ease, transform .35s ease;
}
.slide.active {
  opacity: 1; pointer-events: all; transform: translateX(0);
}
.slide.prevslide {
  opacity: 0; transform: translateX(-32px);
}

/* ─── FOOTER ─────────────────────────────────────────────── */
.slide-footer {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 36px; padding: 0 36px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid rgba(255,255,255,.06);
}
.slide-footer .sf-left {
  font-size: 9px; color: var(--dim); letter-spacing: .04em;
}
.slide-footer .sf-right {
  font-size: 9px; color: var(--dim); letter-spacing: .04em;
  text-align: right;
}

/* ─── SLIDE CONTENT AREA ─────────────────────────────────── */
.s-body {
  position: absolute; inset: 0 0 36px;
  padding: 48px 72px 40px;
  display: flex; flex-direction: column;
  justify-content: space-between;
}
.s-tag {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--teal);
  margin-bottom: 10px;
}
.s-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px; font-weight: 700; line-height: 1.1;
  color: var(--white);
}
.s-subtitle {
  font-size: 16px; color: var(--muted);
  margin-top: 12px; line-height: 1.6;
}
.s-head {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 30px; font-weight: 700; line-height: 1.2;
  color: var(--white); margin-bottom: 24px;
  flex-shrink: 0;
}
.s-head .accent { color: var(--teal); }
.s-head .accent-b { color: var(--blue); }
.s-head .accent-p { color: var(--purple); }

/* ─── DECORATIVE BG SHAPES ───────────────────────────────── */
.bg-glow {
  position: absolute; border-radius: 50%;
  filter: blur(100px); pointer-events: none; z-index: 0;
}
.s-body, .s-head, .s-tag, .s-title, .s-subtitle,
.s-content, .columns { position: relative; z-index: 1; }

/* ─── PILL / BADGE ───────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  border: 1px solid;
}
.pill-teal  { color: var(--teal);   border-color: rgba(79,224,200,.3);  background: rgba(79,224,200,.08); }
.pill-blue  { color: var(--blue);   border-color: rgba(63,182,255,.3);  background: rgba(63,182,255,.08); }
.pill-purple{ color: var(--purple); border-color: rgba(108,123,255,.3); background: rgba(108,123,255,.08); }
.pill-violet{ color: var(--violet); border-color: rgba(163,92,255,.3);  background: rgba(163,92,255,.08); }
.pill-amber { color: var(--amber);  border-color: rgba(255,171,64,.3);  background: rgba(255,171,64,.08); }
.pill-yellow{ color: var(--yellow); border-color: rgba(235,255,36,.3);  background: rgba(235,255,36,.08); }

/* ─── LIST ITEMS ─────────────────────────────────────────── */
.item-list { display: flex; flex-direction: column; gap: 14px; }
.item-list li {
  list-style: none;
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 15px; color: var(--muted); line-height: 1.65;
}
.item-list li::before {
  content: '';
  flex-shrink: 0; margin-top: 7px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--teal);
}

/* ─── COLUMNS ────────────────────────────────────────────── */
.columns {
  display: grid; gap: 24px;
}
.col-2 { grid-template-columns: 1fr 1fr; }
.col-3 { grid-template-columns: 1fr 1fr 1fr; }

/* ─── CARD ───────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
}
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600;
  margin-bottom: 10px;
}
.card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.card .item-list { margin-top: 8px; }

/* ─── STEP CHAIN ─────────────────────────────────────────── */
.step-chain {
  display: flex; align-items: stretch; gap: 0;
  margin-top: 16px;
}
.step-node {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; text-align: center; position: relative;
}
.step-node::after {
  content: '';
  position: absolute; top: 20px; left: 50%;
  width: 100%; height: 1px;
  background: linear-gradient(90deg, var(--teal) 0%, var(--blue) 100%);
}
.step-node:last-child::after { display: none; }
.step-num {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  background: var(--bg3); border: 2px solid var(--teal);
  color: var(--teal); position: relative; z-index: 1;
}
.step-label {
  margin-top: 10px; font-size: 12px; color: var(--muted);
  line-height: 1.4; max-width: 120px;
}

/* ─── SWATCH ─────────────────────────────────────────────── */
.swatch-row { display: flex; gap: 12px; }
.swatch-item { flex: 1; }
.swatch-color {
  height: 48px; border-radius: 6px; margin-bottom: 6px;
}
.swatch-label { font-size: 11px; color: var(--muted); font-weight: 500; }
.swatch-hex { font-size: 10px; color: var(--dim); font-family: monospace; }

/* ─── RULE BOX ───────────────────────────────────────────── */
.rule-box {
  background: var(--bg3);
  border-left: 3px solid var(--blue);
  border-radius: 0 6px 6px 0;
  padding: 14px 18px;
  font-size: 14px; color: var(--muted); line-height: 1.65;
}
.rule-box.warn { border-left-color: var(--amber); }
.rule-box.tip  { border-left-color: var(--teal);  }
.rule-box strong { color: var(--white); }

/* ─── SLA TABLE ─────────────────────────────────────────── */
.sla-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.sla-table th {
  text-align: left; padding: 10px 14px;
  font-size: 11px; font-weight: 600; letter-spacing: .07em;
  color: var(--dim); border-bottom: 1px solid var(--border);
}
.sla-table td {
  padding: 10px 14px;
  color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.04);
}
.sla-table td:first-child { color: var(--white); font-weight: 500; }
.sla-table td .hi { color: var(--teal); font-weight: 600; }

/* ─── VCARD (veículo card) ───────────────────────────────── */
.vcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.vcard {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px 22px;
}
.vcard-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--white);
  margin-bottom: 8px;
}
.vcard p { font-size: 13px; color: var(--dim); line-height: 1.6; }

/* ─── TAXONOMY INTRO — CATEGORY CARDS (S19) ──────────────── */
.tax-cat-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  grid-template-rows: repeat(3,136px); gap: 8px;
  flex-shrink: 0;
}
.tax-cat-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  padding: 0 24px; display: flex; align-items: center; gap: 14px;
  height: 136px;
}
.tax-cat-dot {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
}
.tax-cat-name { font-size: 16px; font-weight: 600; color: var(--white); flex: 1; }
.tax-cat-count {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px; font-weight: 700; line-height: 1;
}

/* ─── TAXONOMY CATEGORY SLIDES (generated) ──────────────── */
/* back-to-index button */
.tax-back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(79,224,200,.08); border: 1px solid rgba(79,224,200,.25);
  border-radius: 8px; padding: 6px 14px;
  font-size: 11px; font-weight: 600; color: var(--teal);
  cursor: pointer; transition: all .15s; flex-shrink: 0;
  font-family: 'Inter', sans-serif;
}
.tax-back-btn:hover { background: rgba(79,224,200,.15); }
/* page indicator e.g. "1 / 2" */
.tax-page-ind {
  font-size: 11px; color: var(--dim);
  font-family: 'IBM Plex Mono', monospace;
  flex-shrink: 0;
}
/* rule card — full detail, always visible */
.tax-rule-card {
  border-left: 3px solid var(--rule-color, #4FE0C8);
  background: var(--bg3);
  border-radius: 0 10px 10px 0;
  padding: 14px 20px 14px 18px;
  display: flex; flex-direction: column; gap: 0;
}
.tax-rule-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--white);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.tax-rule-title-dot { display: none; }
/* field label inside rule card */
.tax-field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--dim); margin: 10px 0 3px;
}
.tax-field-label:first-of-type { margin-top: 0; }
.tax-field-text {
  font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0;
}
/* attention / callout */
.tax-callout {
  border-left: 3px solid var(--amber);
  background: rgba(255,171,64,.07);
  border-radius: 0 6px 6px 0;
  padding: 7px 12px; margin-top: 4px;
}
.tax-callout li {
  font-size: 11px; line-height: 1.55; color: var(--amber);
  padding: 2px 0 2px 14px; position: relative; list-style: none;
}
.tax-callout li::before {
  content: "!"; position: absolute; left: 0; top: 2px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px;
}
/* not-use list */
.tax-notuse {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px;
}
.tax-notuse span {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; padding: 2px 8px; border-radius: 4px;
  background: rgba(255,171,64,.1); color: var(--amber);
  border: 1px solid rgba(255,171,64,.25);
}
/* limits mini-table */
.tax-limits-table {
  width: 100%; border-collapse: collapse; font-size: 10px;
  margin-top: 4px;
}
.tax-limits-table th {
  text-align: left; padding: 4px 8px;
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--dim); border-bottom: 1px solid var(--border);
}
.tax-limits-table td {
  padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,.04);
  color: var(--muted); vertical-align: top;
}
.tax-limits-table tr:last-child td { border-bottom: none; }
/* grid for rule cards on a slide */
.tax-rules-grid {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: space-evenly; gap: 0;
}

/* make S19 cat cards clickable feel */
.tax-cat-card { cursor: pointer; transition: border-color .15s, background .15s; }
.tax-cat-card:hover { border-color: rgba(79,224,200,.4); background: rgba(79,224,200,.06); }

/* ─── REVEAL ANIMATION ───────────────────────────────────── */
.reveal {
  animation: fadeUp .5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal:nth-child(1) { animation-delay: .05s; }
.reveal:nth-child(2) { animation-delay: .15s; }
.reveal:nth-child(3) { animation-delay: .25s; }
.reveal:nth-child(4) { animation-delay: .35s; }
.reveal:nth-child(5) { animation-delay: .45s; }
.reveal:nth-child(6) { animation-delay: .55s; }

/* ─── UTILITY ────────────────────────────────────────────── */
.mt-auto { margin-top: auto; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mt-32 { margin-top: 32px; }
.gap-8  { gap: 8px; }
.gap-12 { gap: 12px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.text-teal   { color: var(--teal); }
.text-blue   { color: var(--blue); }
.text-purple { color: var(--purple); }
.text-violet { color: var(--violet); }
.text-amber  { color: var(--amber); }
.text-yellow { color: var(--yellow); }
.text-white  { color: var(--white); }
.text-muted  { color: var(--muted); }
.text-dim    { color: var(--dim); }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.fs-11  { font-size: 12px; }
.fs-12  { font-size: 13px; }
.fs-13  { font-size: 14px; }
.fs-14  { font-size: 15px; }
.font-sg { font-family: 'Space Grotesk', sans-serif; }

/* ─── COLUMN CHILDREN HEIGHT FILL ───────────────────────── */
.columns > div { display: flex; flex-direction: column; }
.columns > div > div { flex: 1; }

.slide{background:#000}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}

</style>
</head>
<body>
<div id="deck">
  <div id="viewport">
    <div id="scaler">
<div class="slide active" id="s1"><img data-src="slides/slide-01.jpg" alt="Slide 1: Olá, somos | Operação Unilever | Novembro/ 2026" draggable="false"></div>
<div class="slide" id="s2"><img data-src="slides/slide-02.jpg" alt="Slide 2: Treinamento | RM_STORMX e ADP | Como preencher cada campo, evitar erros comuns e garantir a qualidade do banco de dados. | Unilever BR  //  Camphouse  →  RM_STORMX  →  StormX" draggable="false"></div>
<div class="slide" id="s3"><img data-src="slides/slide-03.jpg" alt="Slide 3: 01 | Fluxo Completo | AGENDA | O que | vamos | ver hoje | 02 | RM × ADP | 03 | Importação do Plano | 04 | Abas e Plataformas | 05 | Código de Cores | 06 | Validação e Erros | 07 | SLAs e Prazos" draggable="false"></div>
<div class="slide" id="s4"><img data-src="slides/slide-04.jpg" alt="Slide 4: Fluxo Completo | Processo | 01 | 02 | 03 | 04 | 05 | Camphouse | RM_STORMX | ADP | StormX | QA Final | Fonte das informações do plano de mídia | Mídia preenche e envia para StormX | StormX gerencia a taxonomia e IDs | Implementação e QA das campanhas | Validação da string e banco de dados | Dica  Qualquer campanha urgente sem taxonomia criada deve ser comunicada à StormX por e-mail com autorização do cliente. Prazo máximo de 24h para regularização." draggable="false"></div>
<div class="slide" id="s5"><img data-src="slides/slide-05.jpg" alt="Slide 5: RM_STORMX × ADP | Comparativo | RM_STORMX | Mídia preenche | ADP | StormX gerencia | Plano de mídia importado do Camphouse | Taxonomia criada pela StormX | Campos de campanha, ad group e ad name | Campaign Names aprovados pela Unilever | Datas de início e término | IDs únicos por ad group e ad name | Orçamento e investimento por linha | Atualizado toda segunda-feira | Plataforma e formato de compra | Referência para preenchimento do RM" draggable="false"></div>
<div class="slide" id="s6"><img data-src="slides/slide-06.jpg" alt="Slide 6: Importando o Plano de Mídia | Passo a passo | 01 | 02 | 03 | Exportar do Camphouse | Copiar para o RM | Colar como Valores | Baixe o plano de mídia atualizado em formato Excel. Certifique-se de que todos os campos obrigatórios estão preenchidos. | Copie as linhas do plano exportado. Selecione as células correspondentes na aba correta do RM_STORMX. | Use Colar Especial &gt; Valores (Ctrl+Shift+V ou Alt+E+S+V). Nunca cole com formatação. | Atenção  Nunca copie e cole com formatação. Isso quebra fórmulas e campos calculados do RM_STORMX." draggable="false"></div>
<div class="slide" id="s7"><img data-src="slides/slide-07.jpg" alt="Slide 7: Selecionando a Aba Correta | Plataformas | 01 | 02 | 03 | Google Ads | Programmatic/DV360 | YouTube | Campanhas de Search, Display, PMax e Demand Gen | Campanhas de Display &amp; Video programáticas | Campanhas de YouTube, incluindo Masthead CPH | 04 | 05 | 06 | Meta + TikTok | Pinterest + Snap + X | Flashtalking | Campanhas de redes sociais Meta e TikTok | Campanhas em Pinterest, Snapchat e Twitter/X | Campanhas de Compra Direta via API Flashtalking" draggable="false"></div>

<script>
(function(){
  const scaler=document.getElementById('scaler'),W=1280,H=720;
  function resize(){const s=Math.min(window.innerWidth/W,(window.innerHeight-52)/H);scaler.style.transform=`translate(${-W/2}px,${-H/2}px) scale(${s})`;}
  window.addEventListener('resize',resize);resize();
  const slides=Array.from(document.querySelectorAll('.slide')),total=slides.length;let cur=0;
  const counter=document.getElementById('counter'),fill=document.getElementById('progress-fill'),dotsWrap=document.getElementById('dots');
  const pad=n=>n<10?'0'+n:''+n;
  function load(i){for(let k=i-1;k<=i+2;k++){if(k<0||k>=total)continue;const im=slides[k].querySelector('img');if(im&&!im.src)im.src=im.dataset.src;}}
  slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' active':'');d.addEventListener('click',()=>go(i));dotsWrap.appendChild(d);});
  const dots=Array.from(dotsWrap.children);
  function go(i){if(i<0||i>=total||i===cur)return;const dir=i>cur;slides[cur].classList.remove('active');slides[cur].classList.toggle('prevslide',dir);slides[i].classList.remove('prevslide');slides[i].classList.add('active');dots[cur].classList.remove('active');dots[i].classList.add('active');cur=i;load(i);counter.textContent=pad(cur+1)+' / '+pad(total);fill.style.width=((cur+1)/total*100)+'%';}
  const next=()=>go(cur+1),prev=()=>go(cur-1);
  document.getElementById('nextBtn').addEventListener('click',next);document.getElementById('prevBtn').addEventListener('click',prev);
  document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}else if(e.key==='Home')go(0);else if(e.key==='End')go(total-1);else if(e.key.toLowerCase()==='f')fs();});
  let tx=null;document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)(dx<0?next:prev)();tx=null;});
  function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
  document.getElementById('fsBtn').addEventListener('click',fs);
  counter.textContent=pad(1)+' / '+pad(total);fill.style.width=(100/total)+'%';load(0);
})();
</script>
