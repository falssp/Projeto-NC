<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADP StormX 2026 · Download</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --brand: #1A4775;
      --brand-light: #e8f0f9;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--brand);
      margin-bottom: 10px;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    .desc { font-size: 15px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
    .meta {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .meta strong { color: var(--text); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--brand);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background .15s;
    }
    .btn:hover { background: #163d63; }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    .err { font-size: 13px; color: #c0392b; margin-top: 14px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .history-link {
      font-size: 13px;
      color: var(--brand);
      text-decoration: none;
    }
    .history-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Unilever BR · StormX</div>
    <h1>ADP String Tool Merge</h1>
    <p class="desc">
      Ferramenta de geração de strings para Ad Platform (Camphouse → CM360 / DV360).
      Baixe sempre a versão mais recente abaixo.
    </p>
    <div class="meta">
      <span>Versão <strong id="adp-version">—</strong></span>
      <span>Atualizado em <strong id="adp-date">—</strong></span>
    </div>

    <a id="adp-btn" class="btn" href="#" download disabled>
      ⬇ Baixar ADP (versão mais recente)
    </a>
    <p id="adp-err" class="err" style="display:none;"></p>

    <hr class="divider">
    <a class="history-link" href="./">
      Ver histórico de versões →
    </a>
  </div>

  <script>
    (function () {
      const btn     = document.getElementById('adp-btn');
      const verEl   = document.getElementById('adp-version');
      const dateEl  = document.getElementById('adp-date');
      const errEl   = document.getElementById('adp-err');

      fetch('latest.json?nocache=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          btn.href = encodeURIComponent(data.filename);
          btn.setAttribute('download', data.filename);
          btn.removeAttribute('disabled');
          verEl.textContent  = data.version  || '—';
          dateEl.textContent = data.updated  || '—';
        })
        .catch(e => {
          errEl.style.display = 'block';
          errEl.textContent = 'Erro ao carregar versão: ' + e.message;
        });
    })();
  </script>
</body>
</html>
