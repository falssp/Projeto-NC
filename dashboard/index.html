<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | NC Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1F36C7;--escuro:#1a237e;--bg:#f0f2ff;--surface:#fff;--border:#d6dbf2;--muted:#9fa8da;--body:#3d4a8a}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--escuro);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.wrap{width:100%;max-width:480px}
nav{display:flex;align-items:center;gap:8px;margin-bottom:40px}
.back{font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none}
.back:hover{color:var(--azul)}
.sep{color:var(--border)}
.crumb{font-size:.78rem;color:var(--body)}
h1{font-size:1.7rem;font-weight:700;color:var(--escuro);margin-bottom:8px}
p.sub{font-size:.85rem;color:var(--body);margin-bottom:32px;line-height:1.6}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{flex:1;min-width:160px;padding:14px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:.9rem;text-align:center;transition:opacity .15s}
.btn-corp{background:var(--azul);color:#fff}
.btn-pes{background:#1a237e;color:#fff}
.btn:hover{opacity:.85}
@media(max-width:420px){.btns{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="back" href="/Projeto-NC/">&#8592; Portal NC Tool</a>
    <span class="sep">/</span>
    <span class="crumb">Dashboard</span>
  </nav>
  <h1>Dashboard</h1>
  <p class="sub">Visão consolidada de todas as fases — IDs, validações, operações e saúde do dicionário. Acesse com a conta Google correta do seu ambiente.</p>
  <div class="btns">
    <a class="btn btn-corp" href="corp/">Corp (StormX)</a>
    <a class="btn btn-pes" href="pessoal/">Pessoal</a>
  </div>
</div>
</body>
</html>
